 ràpida de l'API de `uuid`\n\n| Signatura / Funció / Tipus | Què fa i quan fer-la servir |\n|---|---|\n| `uuid v4 / uuid v7 / uuid v7 at` | Genera UUIDs canònics de 36 caràcters RFC 9562 v4 (aleatori) i v7 (ordenat pel temps) |\n| `uuid is valid / uuid version` | Valida l'estructura 8-4-4-4-12 i els bits de variant RFC 9562 (`8, 9, a, b`) |\n| `fnv1a 32 / adler32 / crc32 / crc32 hex` | Hashes no criptogràfics i sumes de verificació ràpides de 32 bits |\n| `prng next / prng range` | PRNG congruencial lineal funcional pur per a proves i simulacions reproduïbles |\n\n---\n\n## 4. Receptes pràctiques en estil tabular\n\n### Recepta 1: Flux principal amb `uuid`\n\nObserva com els signes `=` i els passos de transformació queden alineats com una taula neta:\n\n```ridgun\nimport uuid\n\nfn :: generar ids ordenados () => (String, String, Bool)\n      generar ids ordenados =\n        id1 = uuid v7 at 1000\n        id2 = uuid v7 at 2000\n        ok  = (uuid is valid id1) and (id1 < id2)\n        (id1, id2, ok)\n```\n\n### Recepta 2: Composició segura i sense efectes laterals\n\nTota funció de la lib `uuid` és componible amb la resta de les 32 libs de `ridgun-libs`:\n\n```ridgun\nimport uuid\n\nfn :: firmar paquete (payload : String) => (String, Int)\n      firmar paquete payload =\n         (crc32 hex payload, fnv1a 32 payload)\n```\n\n---\n\n## 5. Sota el capó: rendiment, memòria RMM i garanties\n\n- **Garantia algorísmica i de seguretat**: `uuid v7 at t1 < uuid v7 at t2` garanteix ordre lexicogràfic monòton creixent amb el temps, ideal per a índexs `btree` i bases de dades.\n- **Memòria determinista (`RMM1`/`RMM2`)**: Zero pauses de recol·lector de brossa; totes les estructures intermèdies s'alliberen de forma determinista en sortir de l'àmbit.\n- **Verificació contínua**: Provada exhaustivament amb `stable check` i la suite automatitzada `src/test/ridgun/test_uuid.rg`.\n"}, {"num": "20", "slug": "20-lib-log-logging-ndjson-i-redaccio", "file": "20-lib-log-logging-ndjson-i-redaccio.md", "title": "Capítol 20: La lib `log` — Logging Estructurat NDJSON i Redacció Automàtica de Secrets", "short_title": "La lib `log` — Logging Estructurat NDJSON i Redacció Automàtica de Secrets", "markdown": "# Capítol 20: La lib `log` — Logging Estructurat NDJSON i Redacció Automàtica de Secrets\n\n## 1. Per què existeix la lib `log`?\n\nSiguem sincers: bolcar els camps d'una petició en un fitxer de log i descobrir setmanes després que acabes de desar `password`, `api_key` o `authorization` en text pla al teu agregador de logs és un incident de seguretat clàssic.\n\nLa lib **`log`** proporciona filtratge per severitat (`DEBUG`, `INFO`, `WARN`, `ERROR`), formatat en text humà i **NDJSON estructurat**, i **redacció automàtica de claus sensibles** (`password`, `secret`, `token`, `api_key`, `authorization`, `cookie`, `private_key` $\\rightarrow$ `\"[REDACTED]\"`, mitigant `VUL-LOG-001`).\n\n---\n\n## 2. Artefactes, importació i arquitectura sense `libc`\n\nA `ridgun-libs`, **`log`** és una **lib** de primera classe situada a `src/main/ridgun/lib/log.rg` (domini `LOG`). En compilar amb `stable bundle`, s'empaqueta en tres formats natius:\n\n| Artefacte | Ruta | Propòsit |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/log.rglib` | Distribució i importació directa amb `import log` |\n| **Fitxer compilat** | `target/log.rgc` | Artefacte intermedi verificat per `ridgunc` |\n| **Objecte compartit ELF64** | `target/liblog.so` | Biblioteca dinàmica nativa sense dependències de C ni `libc` |\n\n> Per fer servir aquesta lib en qualsevol fitxer `.rg`, n'hi ha prou de declarar `import log` a la capçalera i cridar les seves funcions amb espais o guions baixos indistintament.\n\n---\n\n## 3. Referència ràpida de l'API de `log`\n\n| Signatura / Funció / Tipus | Què fa i quan fer-la servir |\n|---|---|\n| `log level rank / log should emit` | Compara nivells (`DEBUG=10`, `INFO=20`, `WARN=30`, `ERROR=40`) enfront del llindar actiu |\n| `log is sensitive key / log redact fields` | Substitueix valors de claus secretes per `\"[REDACTED]\"` sense importar majúscules |\n| `log format text / log format json` | Formata línies text `clau=valor` o NDJSON RFC 8259 amb redacció automàtica de secrets |\n\n---\n\n## 4. Receptes pràctiques en estil tabular\n\n### Recepta 1: Flux principal amb `log`\n\nObserva com els signes `=` i els passos de transformació queden alineats com una taula neta:\n\n```ridgun\nimport log\n\nfn :: auditar login (usuario : String) (clave : String) => String\n      auditar login usuario clave =\n        campos = [(\"user\", usuario), (\"password\", clave), (\"ip\", \"10.0.0.1\")]\n        log format json \"INFO\" \"intento de acceso\" campos\n```\n\n### Recepta 2: Composició segura i sense efectes laterals\n\nTota funció de la lib `log` és componible amb la resta de les 32 libs de `ridgun-libs`:\n\n```ridgun\nimport log\n\nfn :: emitir si procede (umbral : String) (nivel : String) (msg : String) => String\n      emitir si procede umbral nivel msg =\n        | log should emit umbral nivel = log format text nivel msg [(\"service\", \"solstice\")]\n        | otherwise                    = \"\"\n```\n\n---\n\n## 5. Sota el capó: rendiment, memòria RMM i garanties\n\n- **Garantia algorísmica i de seguretat**: Tant `log format text` com `log format json` passen sempre els camps per `log redact fields` abans de serialitzar, garantint que cap secret es filtri per oblit.\n- **Memòria determinista (`RMM1`/`RMM2`)**: Zero pauses de recol·lector de brossa; totes les estructures intermèdies s'alliberen de forma determinista en sortir de l'àmbit.\n- **Verificació contínua**: Provada exhaustivament amb `stable check` i la suite automatitzada `src/test/ridgun/test_log.rg`.\n"}, {"num": "21", "slug": "21-lib-test-assercions-unitaries-i-funcionals", "file": "21-lib-test-assercions-unitaries-i-funcionals.md", "title": "Capítol 21: La lib `test` — Primitives d'Asserció Unitària i Funcional (`RG-011`)", "short_title": "La lib `test` — Primitives d'Asserció Unitària i Funcional (`RG-011`)", "markdown": "# Capítol 21: La lib `test` — Primitives d'Asserció Unitària i Funcional (`RG-011`)\n\n## 1. Per què existeix la lib `test`?\n\nSiguem sincers: quan un framework de tests requereix macros màgiques, reflexió en temps d'execució o un runner extern pesat, escriure proves deixa de ser immediat.\n\nLa lib **`test`** (`RG-011`) proporciona assercions pures, polimòrfiques i específiques de tipus que emeten diagnòstics clars `[FAIL]` amb els valors esperat i obtingut i acaben amb codi de sortida `1` tan bon punt falla una invariant.\n\n---\n\n## 2. Artefactes, importació i arquitectura sense `libc`\n\nA `ridgun-libs`, **`test`** és una **lib** de primera classe situada a `src/main/ridgun/lib/test.rg` (domini `TST`). En compilar amb `stable bundle`, s'empaqueta en tres formats natius:\n\n| Artefacte | Ruta | Propòsit |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/test.rglib` | Distribució i importació directa amb `import test` |\n| **Fitxer compilat** | `target/test.rgc` | Artefacte intermedi verificat per `ridgunc` |\n| **Objecte compartit ELF64** | `target/libtest.so` | Biblioteca dinàmica nativa sense dependències de C ni `libc` |\n\n> Per fer servir aquesta lib en qualsevol fitxer `.rg`, n'hi ha prou de declarar `import test` a la capçalera i cridar les seves funcions amb espais o guions baixos indistintament.\n\n---\n\n## 3. Referència ràpida de l'API de `test`\n\n| Signatura / Funció / Tipus | Què fa i quan fer-la servir |\n|---|---|\n| `assert equals / assert eq : A -> A -> String -> ()` | Asserció polimòrfica d'igualtat amb etiqueta descriptiva del cas de prova |\n| `assert int equals / assert str eq` | Assercions especialitzades d'igualtat per a `Int` i `String` |\n| `assert true / assert false / assert not` | Assercions d'invariants booleanes (`True` / `False`) |\n| `assert ok : Int -> String -> ()` | Verifica que un codi d'estat del sistema o socket sigui `0` (`OK`) |\n\n---\n\n## 4. Receptes pràctiques en estil tabular\n\n### Recepta 1: Flux principal amb `test`\n\nObserva com els signes `=` i els passos de transformació queden alineats com una taula neta:\n\n```ridgun\nimport test\nimport math\n\nfn :: suite matematicas () => ()\n      suite matematicas =\n        _ = assert int equals 12 (math gcd 36 60) \"MCD de 36 y 60\"\n        _ = assert true (math is prime 97) \"97 es primo\"\n        echo \"[PASS] suite matematicas\"\n```\n\n### Recepta 2: Composició segura i sense efectes laterals\n\nTota funció de la lib `test` és componible amb la resta de les 32 libs de `ridgun-libs`:\n\n```ridgun\nimport test\n\nfn :: verificar codigo sistema (rc : Int) => ()\n      verificar codigo sistema rc =\n        assert ok rc \"operacion de descriptor exitosa\"\n```\n\n---\n\n## 5. Sota el capó: rendiment, memòria RMM i garanties\n\n- **Garantia algorísmica i de seguretat**: Les 30 suites de proves de `ridgun-libs` (`src/test/ridgun/test_*.rg`, més de 4 000 línies) s'executen amb aquesta mateixa lib mitjançant `stable test`.\n- **Memòria determinista (`RMM1`/`RMM2`)**: Zero pauses de recol·lector de brossa; totes les estructures intermèdies s'alliberen de forma determinista en sortir de l'àmbit.\n- **Verificació contínua**: Provada exhaustivament amb `stable check` i la suite automatitzada `src/test/ridgun/test_test.rg`.\n"}, {"num": "22", "slug": "22-lib-posix-capa-pal-rellotges-i-senyals", "file": "22-lib-posix-capa-pal-rellotges-i-senyals.md", "title": "Capítol 22: La lib `posix` — Capa d'Abstracció de Plataforma (PAL), Rellotges, Senyals i CSPRNG", "short_title": "La lib `posix` — Capa d'Abstracció de Plataforma (PAL), Rellotges, Senyals i CSPRNG", "markdown": "# Capítol 22: La lib `posix` — Capa d'Abstracció de Plataforma (PAL), Rellotges, Senyals i CSPRNG\n\n## 1. Per què existeix la lib `posix`?\n\nSiguem sincers: les banderes com `O_CREAT`, `O_NONBLOCK` o els números de syscall canvien entre Linux, macOS i arquitectures (`X86_64` vs `Arm64`), i en C tot es resol amb una jungla il·legible d'`#ifdef`.\n\nLa lib **`posix`** implementa la **Capa d'Abstracció de Plataforma (PAL)** de 2 nivells de Ridgun fent servir guardes tabulars sobre `sys os` (`Linux | MacOS | Windows`) i `sys arch` (`X86_64 | Arm64 | RiscV64`), a més de sondeig de descriptors (`wait fd` / `PollStatus`), rellotges monòtons i de paret (`RGF-017`), senyals (`RGF-018`) i entropia CSPRNG del nucli (`sys random bytes`).\n\n---\n\n## 2. Artefactes, importació i arquitectura sense `libc`\n\nA `ridgun-libs`, **`posix`** és una **lib** de primera classe situada a `src/main/ridgun/lib/posix.rg` (domini `POSIX`). En compilar amb `stable bundle`, s'empaqueta en tres formats natius:\n\n| Artefacte | Ruta | Propòsit |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/posix.rglib` | Distribució i importació directa amb `import posix` |\n| **Fitxer compilat** | `target/posix.rgc` | Artefacte intermedi verificat per `ridgunc` |\n| **Objecte compartit ELF64** | `target/libposix.so` | Biblioteca dinàmica nativa sense dependències de C ni `libc` |\n\n> Per fer servir aquesta lib en qualsevol fitxer `.rg`, n'hi ha prou de declarar `import posix` a la capçalera i cridar les seves funcions amb espais o guions baixos indistintament.\n\n---\n\n## 3. Referència ràpida de l'API de `posix`\n\n| Signatura / Funció / Tipus | Què fa i quan fer-la servir |\n|---|---|\n| `pal open create trunc wr / pal o nonblock` | Traducció de banderes del SO segons `sys os` (`Linux | MacOS | Windows`) |\n| `wait fd : Int -> Int -> Int -> PollStatus` | Sondeja un descriptor retornant `PollReady`, `PollTimeout` o `PollError errno` |\n| `clock monotonic ms / clock monotonic ns / clock wall ms` | Rellotges monòtons i rellotge de paret UTC en mil·lisegons (`RGF-017`) |\n| `signal watch / signal poll / sys random bytes` | Sondeig no bloquejant de senyals (`SIGINT`, `SIGTERM`) i bytes CSPRNG del nucli |\n| `read text / write text / file exists / run cmd` | E/S de fitxers d'alt nivell, directoris i execució de subprocessos |\n\n---\n\n## 4. Receptes pràctiques en estil tabular\n\n### Recepta 1: Flux principal amb `posix`\n\nObserva com els signes `=` i els passos de transformació queden alineats com una taula neta:\n\n```ridgun\nimport posix\n\nfn :: medir operacion () => (Int, Int)\n      medir operacion =\n        t0  = clock monotonic ms\n        rnd = len (sys random bytes 32)\n        t1  = clock monotonic ms\n        (rnd, t1 - t0)\n```\n\n### Recepta 2: Composició segura i sense efectes laterals\n\nTota funció de la lib `posix` és componible amb la resta de les 32 libs de `ridgun-libs`:\n\n```ridgun\nimport posix\n\nfn :: esperar lectura (fd : Int) => Bool\n      esperar lectura fd =\n        est = wait fd fd poll_in 100\n        est == PollReady\n```\n\n---\n\n## 5. Sota el capó: rendiment, memòria RMM i garanties\n\n- **Garantia algorísmica i de seguretat**: Les branques de `sys os` i `sys arch` que no corresponen al binari destí són eliminades en temps de compilació (Dead-Code Elimination) per `ridgunc`.\n- **Memòria determinista (`RMM1`/`RMM2`)**: Zero pauses de recol·lector de brossa; totes les estructures intermèdies s'alliberen de forma determinista en sortir de l'àmbit.\n- **Verificació contínua**: Provada exhaustivament amb `stable check` i la suite automatitzada `src/test/ridgun/test_posix.rg`.\n"}, {"num": "23", "slug": "23-lib-io-entrada-sortida-amb-timeout", "file": "23-lib-io-entrada-sortida-amb-timeout.md", "title": "Capítol 23: La lib `io` — Errors Tipats `IoResult`, E/S amb `with timeout` i Processos", "short_title": "La lib `io` — Errors Tipats `IoResult`, E/S amb `with timeout` i Processos", "markdown": "# Capítol 23: La lib `io` — Errors Tipats `IoResult`, E/S amb `with timeout` i Processos\n\n## 1. Per què existeix la lib `io`?\n\nSiguem sincers: una crida a `read()` o un subprocess fill sense data límit (`timeout`) és una invitació perquè un sol recurs penjat esgoti tots els treballadors del teu servidor.\n\nLa lib **`io`** modela cada operació del sistema amb ADTs explícits (`IoError`, `IoResult[A]`), combina `ppoll` no bloquejant amb quotes lèxiques `with timeout wait_ms do` de Ridgun i ofereix els operadors mixfix `read fd ... timeout` i `write fd ... timeout`.\n\n---\n\n## 2. Artefactes, importació i arquitectura sense `libc`\n\nA `ridgun-libs`, **`io`** és una **lib** de primera classe situada a `src/main/ridgun/lib/io.rg` (domini `IO`). En compilar amb `stable bundle`, s'empaqueta en tres formats natius:\n\n| Artefacte | Ruta | Propòsit |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/io.rglib` | Distribució i importació directa amb `import io` |\n| **Fitxer compilat** | `target/io.rgc` | Artefacte intermedi verificat per `ridgunc` |\n| **Objecte compartit ELF64** | `target/libio.so` | Biblioteca dinàmica nativa sense dependències de C ni `libc` |\n\n> Per fer servir aquesta lib en qualsevol fitxer `.rg`, n'hi ha prou de declarar `import io` a la capçalera i cridar les seves funcions amb espais o guions baixos indistintament.\n\n---\n\n## 3. Referència ràpida de l'API de `io`\n\n| Signatura / Funció / Tipus | Què fa i quan fer-la servir |\n|---|---|\n| `type IoError / type IoResult[A]` | `IoNotFound | IoPermission | IoTimeout | IoRefused | IoReset | IoEOF | IoInvalid | IoSysError` |\n| `io read with timeout / io write with timeout` | Lectura/escriptura no bloquejant de descriptor acotada per `wait_ms` |\n| `read fd N max M timeout T / write fd N data S timeout T` | Operadors mixfix ergonòmics (`op ::`) per a E/S de descriptor amb data límit |\n| `io read file / io write file / io read lines` | Funcions segures de fitxers i fluxos de línies que retornen `IoResult` |\n| `exec with timeout : String -> Int -> IoResult[ProcStatus]` | Executa una comanda externa acotada per una quota lèxica `with timeout` |\n\n---\n\n## 4. Receptes pràctiques en estil tabular\n\n### Recepta 1: Flux principal amb `io`\n\nObserva com els signes `=` i els passos de transformació queden alineats com una taula neta:\n\n```ridgun\nimport io\n\nfn :: leer peticion segura (fd : Int) => String\n      leer peticion segura fd =\n        res = read fd fd max 4096 timeout 250\n        io unwrap or res \"\"\n```\n\n### Recepta 2: Composició segura i sense efectes laterals\n\nTota funció de la lib `io` és componible amb la resta de les 32 libs de `ridgun-libs`:\n\n```ridgun\nimport io\n\nfn :: describir fallo () => String\n      describir fallo =\n        format io error (IoTimeout \"read\" 250)\n```\n\n---\n\n## 5. Sota el capó: rendiment, memòria RMM i garanties\n\n- **Garantia algorísmica i de seguretat**: Cap lectura, escriptura o comanda executada a través d'`io` amb quota `wait_ms` pot bloquejar indefinidament el fil o actor que fa la crida.\n- **Memòria determinista (`RMM1`/`RMM2`)**: Zero pauses de recol·lector de brossa; totes les estructures intermèdies s'alliberen de forma determinista en sortir de l'àmbit.\n- **Verificació contínua**: Provada exhaustivament amb `stable check` i la suite automatitzada `src/test/ridgun/test_io.rg`.\n"}, {"num": "24", "slug": "24-lib-crypto-sha256-hmac-pbkdf2-i-aead", "file": "24-lib-crypto-sha256-hmac-pbkdf2-i-aead.md", "title": "Capítol 24: La lib `crypto` — SHA-256, HMAC, PBKDF2, Argon2id i ChaCha20-Poly1305 AEAD", "short_title": "La lib `crypto` — SHA-256, HMAC, PBKDF2, Argon2id i ChaCha20-Poly1305 AEAD", "markdown": "# Capítol 24: La lib `crypto` — SHA-256, HMAC, PBKDF2, Argon2id i ChaCha20-Poly1305 AEAD\n\n## 1. Per què existeix la lib `crypto`?\n\nSiguem sincers: comparar un HMAC amb `==` obre la porta a atacs de temporització (*timing attacks*), i dependre de `libssl.so` per calcular un `SHA-256` o xifrar amb `ChaCha20-Poly1305` trenca la portabilitat estàtica de qualsevol binari.\n\nLa lib **`crypto`** implementa al 100 % en Ridgun pur sobre `Tensor[Int]` preassignat: operacions de bytes/bits (`RGF-019`), **FIPS 180-4 SHA-256**, **RFC 2104 HMAC-SHA-256**, igualtat en temps constant (`ct equal`), **RFC 8018 PBKDF2-HMAC-SHA-256** amb precomputació de l'estat intermedi SHA-256, façana **Argon2id** de 5 arguments i xifratge autenticat **RFC 8439 ChaCha20-Poly1305 AEAD** (`aead seal` / `aead open`).\n\n---\n\n## 2. Artefactes, importació i arquitectura sense `libc`\n\nA `ridgun-libs`, **`crypto`** és una **lib** de primera classe situada a `src/main/ridgun/lib/crypto.rg` (domini `CRYPTO`). En compilar amb `stable bundle`, s'empaqueta en tres formats natius:\n\n| Artefacte | Ruta | Propòsit |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/crypto.rglib` | Distribució i importació directa amb `import crypto` |\n| **Fitxer compilat** | `target/crypto.rgc` | Artefacte intermedi verificat per `ridgunc` |\n| **Objecte compartit ELF64** | `target/libcrypto.so` | Biblioteca dinàmica nativa sense dependències de C ni `libc` |\n\n> Per fer servir aquesta lib en qualsevol fitxer `.rg`, n'hi ha prou de declarar `import crypto` a la capçalera i cridar les seves funcions amb espais o guions baixos indistintament.\n\n---\n\n## 3. Referència ràpida de l'API de `crypto`\n\n| Signatura / Funció / Tipus | Què fa i quan fer-la servir |\n|---|---|\n| `sha256 bytes / sha256 hex` | Resum binari de 32 bytes o hexadecimal de 64 caràcters FIPS 180-4 SHA-256 |\n| `hmac sha256 / hmac sha256 hex / ct equal` | MAC amb clau RFC 2104 i comparació d'acumulador en temps constant |\n| `pbkdf2 hmac sha256 : String -> String -> Int -> Int -> String` | Derivació de claus RFC 8018 amb estats intermedis SHA-256 precomputats |\n| `argon2id hash / argon2id verify` | Hashing de contrasenyes PHC RFC 9106 de 5 arguments i verificació en temps constant |\n| `aead seal / aead open` | Xifratge autenticat RFC 8439 ChaCha20-Poly1305 i desxifratge amb verificació de tag |\n\n---\n\n## 4. Receptes pràctiques en estil tabular\n\n### Recepta 1: Flux principal amb `crypto`\n\nObserva com els signes `=` i els passos de transformació queden alineats com una taula neta:\n\n```ridgun\nimport crypto\n\nfn :: cifrar mensaje sesion (secreto : String) (texto : String) => (Int, String)\n      cifrar mensaje sesion secreto texto =\n        key32   = sha256 bytes secreto\n        nonce12 = \"0123456789ab\"\n        aad     = \"canal-autenticado\"\n        sellado = aead seal key32 nonce12 aad texto\n        aead open key32 nonce12 aad sellado\n```\n\n### Recepta 2: Composició segura i sense efectes laterals\n\nTota funció de la lib `crypto` és componible amb la resta de les 32 libs de `ridgun-libs`:\n\n```ridgun\nimport crypto\n\nfn :: verificar firma webhook (clave : String) (cuerpo : String) (firma_hex : String) => Bool\n      verificar firma webhook clave cuerpo firma_hex =\n        esperada = hmac sha256 hex clave cuerpo\n        ct equal esperada firma_hex\n```\n\n---\n\n## 5. Sota el capó: rendiment, memòria RMM i garanties\n\n- **Garantia algorísmica i de seguretat**: `aead open` verifica el tag Poly1305 de 16 bytes en temps constant abans de retornar un sol byte de text pla (si falla, retorna `(-1, \"\")`).\n- **Memòria determinista (`RMM1`/`RMM2`)**: Zero pauses de recol·lector de brossa; totes les estructures intermèdies s'alliberen de forma determinista en sortir de l'àmbit.\n- **Verificació contínua**: Provada exhaustivament amb `stable check` i la suite automatitzada `src/test/ridgun/test_crypto.rg`.\n"}, {"num": "25", "slug": "25-lib-argon2id-hashing-rfc9106-i-owasp", "file": "25-lib-argon2id-hashing-rfc9106-i-owasp.md", "title": "Capítol 25: La lib `argon2id` — RFC 9106 Argon2id sobre `Tensor[U64 * 8 * 16]`, Blake2b i Presets OWASP", "short_title": "La lib `argon2id` — RFC 9106 Argon2id sobre `Tensor[U64 * 8 * 16]`, Blake2b i Presets OWASP", "markdown": "# Capítol 25: La lib `argon2id` — RFC 9106 Argon2id sobre `Tensor[U64 * 8 * 16]`, Blake2b i Presets OWASP\n\n## 1. Per què existeix la lib `argon2id`?\n\nSiguem sincers: desar contrasenyes amb un simple SHA-256 permet que una GPU moderna provi milers de milions de combinacions per segon, però enllaçar biblioteques C externes per tenir Argon2id sol portar mals de cap de compilació i memòria.\n\nLa lib **`argon2id`** implementa **RFC 9106 Argon2id** i **RFC 7693 Blake2b-512** al 100 % en Ridgun pur operant directament sobre blocs natius `Tensor[U64 * 8 * 16]` (1 024 bytes per bloc en memòria contigua RMM2), amb generació de cadenes **PHC** (`$argon2id$v=19$m=...,t=...,p=...$`), perfils **OWASP** (`owaspfirst`, `owaspsecond`), suport de *pepper* (`argon2id hash ctx`), derivació de claus (`argon2id derive key`) i detecció d'actualització de paràmetres (`argon2id needs rehash`).\n\n---\n\n## 2. Artefactes, importació i arquitectura sense `libc`\n\nA `ridgun-libs`, **`argon2id`** és una **lib** de primera classe situada a `src/main/ridgun/lib/argon2id.rg` (domini `CRYPTO`). En compilar amb `stable bundle`, s'empaqueta en tres formats natius:\n\n| Artefacte | Ruta | Propòsit |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/argon2id.rglib` | Distribució i importació directa amb `import argon2id` |\n| **Fitxer compilat** | `target/argon2id.rgc` | Artefacte intermedi verificat per `ridgunc` |\n| **Objecte compartit ELF64** | `target/libargon2id.so` | Biblioteca dinàmica nativa sense dependències de C ni `libc` |\n\n> Per fer servir aquesta lib en qualsevol fitxer `.rg`, n'hi ha prou de declarar `import argon2id` a la capçalera i cridar les seves funcions amb espais o guions baixos indistintament.\n\n---\n\n## 3. Referència ràpida de l'API de `argon2id`\n\n| Signatura / Funció / Tipus | Què fa i quan fer-la servir |\n|---|---|\n| `argon2id hash / argon2id verify` | Hashing PHC RFC 9106 de 6 arguments (`pwd, salt, m_kib, t, p, tag_len`) i verificació en temps constant |\n| `argon2id hash with preset / argon2id params preset` | Perfils amb nom: `\"interactive\"`, `\"owaspfirst\"` (`19456 KiB, t=2`), `\"owaspsecond\"` (`47104 KiB, t=1`), `\"moderate\"`, `\"sensitive\"` |\n| `argon2id hash ctx / argon2id verify ctx` | Hashing RFC 9106 amb secret `pepper` ($K$) i dades associades ($X$) |\n| `argon2id derive key / argon2id needs rehash` | Derivació de clau binària crua i detecció de necessitat de rehash en cadenes PHC |\n| `blake2b / blake2b hex` | Resum criptogràfic de propòsit general RFC 7693 Blake2b (`1..64` bytes) |\n\n---\n\n## 4. Receptes pràctiques en estil tabular\n\n### Recepta 1: Flux principal amb `argon2id`\n\nObserva com els signes `=` i els passos de transformació queden alineats com una taula neta:\n\n```ridgun\nimport argon2id\n\nfn :: proteger clave usuario (clave : String) => (String, Bool, Bool)\n      proteger clave usuario clave =\n        phc    = argon2id hash clave \"sal-unica-16byte\" 32 2 1 32\n        valido = argon2id verify clave phc\n        rehash = argon2id needs rehash phc 19456 2 1 32\n        (phc, valido, rehash)\n```\n\n### Recepta 2: Composició segura i sense efectes laterals\n\nTota funció de la lib `argon2id` és componible amb la resta de les 32 libs de `ridgun-libs`:\n\n```ridgun\nimport argon2id\n\nfn :: derivar clave maestra (frase : String) (sal : String) => String\n      derivar clave maestra frase sal =\n        -- Deriva 32 bytes crudos listos para ChaCha20-Poly1305 AEAD\n        argon2id derive key frase sal 64 2 1 32\n```\n\n---\n\n## 5. Sota el capó: rendiment, memòria RMM i garanties\n\n- **Garantia algorísmica i de seguretat**: Coincidència byte a byte amb els vectors oficials RFC 9106 §5.3 i OpenSSL 3.5, operant sobre `Tensor[U64 * 8 * 16]` sense ni una sola línia de C.\n- **Memòria determinista (`RMM1`/`RMM2`)**: Zero pauses de recol·lector de brossa; totes les estructures intermèdies s'alliberen de forma determinista en sortir de l'àmbit.\n- **Verificació contínua**: Provada exhaustivament amb `stable check` i la suite automatitzada `src/test/ridgun/test_argon2id.rg`.\n"}, {"num": "26", "slug": "26-lib-jwt-tokens-rfc7519-i-aead", "file": "26-lib-jwt-tokens-rfc7519-i-aead.md", "title": "Capítol 26: La lib `jwt` — JSON Web Tokens RFC 7519 (`HS256`) i Tokens Xifrats ChaCha20-Poly1305", "short_title": "La lib `jwt` — JSON Web Tokens RFC 7519 (`HS256`) i Tokens Xifrats ChaCha20-Poly1305", "markdown": "# Capítol 26: La lib `jwt` — JSON Web Tokens RFC 7519 (`HS256`) i Tokens Xifrats ChaCha20-Poly1305\n\n## 1. Per què existeix la lib `jwt`?\n\nSiguem sincers: l'ecosistema JWT és famós per vulnerabilitats on un atacant canvia la capçalera a `\"alg\":\"none\"` i el servidor accepta el token sense signatura, o on es desa informació sensible en un JWT oblidant que el seu payload només està codificat en Base64url, no xifrat.\n\nLa lib **`jwt`** resol tots dos mons: signa i verifica **JWTs RFC 7519 (`HS256`)** exigint explícitament `alg == \"HS256\"`, comparant l'HMAC en temps constant i validant `exp`/`nbf`, i a més ofereix **`token seal` / `token open`** per emetre tokens opacs autenticats i xifrats amb **ChaCha20-Poly1305 AEAD**.\n\n---\n\n## 2. Artefactes, importació i arquitectura sense `libc`\n\nA `ridgun-libs`, **`jwt`** és una **lib** de primera classe situada a `src/main/ridgun/lib/jwt.rg` (domini `JWT`). En compilar amb `stable bundle`, s'empaqueta en tres formats natius:\n\n| Artefacte | Ruta | Propòsit |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/jwt.rglib` | Distribució i importació directa amb `import jwt` |\n| **Fitxer compilat** | `target/jwt.rgc` | Artefacte intermedi verificat per `ridgunc` |\n| **Objecte compartit ELF64** | `target/libjwt.so` | Biblioteca dinàmica nativa sense dependències de C ni `libc` |\n\n> Per fer servir aquesta lib en qualsevol fitxer `.rg`, n'hi ha prou de declarar `import jwt` a la capçalera i cridar les seves funcions amb espais o guions baixos indistintament.\n\n---\n\n## 3. Referència ràpida de l'API de `jwt`\n\n| Signatura / Funció / Tipus | Què fa i quan fer-la servir |\n|---|---|\n| `type JwtResult` | `JwtOk JsonVal | JwtExpired | JwtNotYetValid | JwtBadSignature | JwtMalformed` |\n| `jwt sign hs256 / jwt verify hs256` | Signa claims `JsonVal` i verifica signatura + `alg == \"HS256\"` + finestres `exp`/`nbf` |\n| `jwt claims / jwt get str / jwt get int` | Construeix claims estàndard `(sub, iss, iat, exp)` i consulta payloads verificats |\n| `token seal / token open` | Xifra i autentica tokens JSON opacs mitjançant ChaCha20-Poly1305 AEAD |\n\n---\n\n## 4. Receptes pràctiques en estil tabular\n\n### Recepta 1: Flux principal amb `jwt`\n\nObserva com els signes `=` i els passos de transformació queden alineats com una taula neta:\n\n```ridgun\nimport jwt\nimport json\n\nfn :: emitir y verificar sesion (secreto : String) => (String, String)\n      emitir y verificar sesion secreto =\n        claims = jwt claims \"user-42\" \"solstice\" 1700000000 1700003600\n        tok    = jwt sign hs256 secreto claims\n        res    = jwt verify hs256 secreto tok 1700001000\n        sub    = jwt get str res \"sub\" \"anonimo\"\n        (tok, sub)\n```\n\n### Recepta 2: Composició segura i sense efectes laterals\n\nTota funció de la lib `jwt` és componible amb la resta de les 32 libs de `ridgun-libs`:\n\n```ridgun\nimport jwt\nimport json\n\nfn :: sellar token confidencial (clave : String) => JwtResult\n      sellar token confidencial clave =\n        datos = JnObj [(\"rol\", JnStr \"root\"), (\"pin\", JnInt 9988)]\n        sobre = token seal clave \"nonce-12byte\" datos\n        token open clave sobre\n```\n\n---\n\n## 5. Sota el capó: rendiment, memòria RMM i garanties\n\n- **Garantia algorísmica i de seguretat**: Immunitat total a l'atac `\"alg\":\"none\"` (qualsevol capçalera el `alg` de la qual no sigui exactament `\"HS256\"` retorna `JwtBadSignature`) i comparació de signatura en temps constant.\n- **Memòria determinista (`RMM1`/`RMM2`)**: Zero pauses de recol·lector de brossa; totes les estructures intermèdies s'alliberen de forma determinista en sortir de l'àmbit.\n- **Verificació contínua**: Provada exhaustivament amb `stable check` i la suite automatitzada `src/test/ridgun/test_jwt.rg`.\n"}, {"num": "27", "slug": "27-lib-socket-xarxes-dns-i-kernel-sockets", "file": "27-lib-socket-xarxes-dns-i-kernel-sockets.md", "title": "Capítol 27: La lib `socket` — TCP, UDP, AF_UNIX, Framing, DNS RFC 1035 i Kernel Sockets (`RGF-001`)", "short_title": "La lib `socket` — TCP, UDP, AF_UNIX, Framing, DNS RFC 1035 i Kernel Sockets (`RGF-001`)", "markdown": "# Capítol 27: La lib `socket` — TCP, UDP, AF_UNIX, Framing, DNS RFC 1035 i Kernel Sockets (`RGF-001`)\n\n## 1. Per què existeix la lib `socket`?\n\nSiguem sincers: programar sockets BSD en C amb `struct sockaddr_in`, `htons`, `inet_pton` i `getaddrinfo` (que a més arrossega `libnss` de `glibc`) és un ritual arcà dels anys 80.\n\nLa lib **`socket`** ofereix dues capes complementàries sense ni una línia de C: (1) l'API de descriptors del nucli **`RGF-001`** per a servidors de producció com **Solstice** (`sys tcp listen`, `sys tcp listen reuseport`, `sys accept`, `sys tcp connect`, `sys send`, `sys recv`, `sys resolve ipv4` mitjançant `/etc/hosts` + paquets DNS UDP RFC 1035 al port 53) i (2) la màquina d'estats funcional immutable `Socket` amb framing prefixat per longitud, línies CRLF i subxarxes CIDR.\n\n---\n\n## 2. Artefactes, importació i arquitectura sense `libc`\n\nA `ridgun-libs`, **`socket`** és una **lib** de primera classe situada a `src/main/ridgun/lib/socket.rg` (domini `SOCK`). En compilar amb `stable bundle`, s'empaqueta en tres formats natius:\n\n| Artefacte | Ruta | Propòsit |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/socket.rglib` | Distribució i importació directa amb `import socket` |\n| **Fitxer compilat** | `target/socket.rgc` | Artefacte intermedi verificat per `ridgunc` |\n| **Objecte compartit ELF64** | `target/libsocket.so` | Biblioteca dinàmica nativa sense dependències de C ni `libc` |\n\n> Per fer servir aquesta lib en qualsevol fitxer `.rg`, n'hi ha prou de declarar `import socket` a la capçalera i cridar les seves funcions amb espais o guions baixos indistintament.\n\n---\n\n## 3. Referència ràpida de l'API de `socket`\n\n| Signatura / Funció / Tipus | Què fa i quan fer-la servir |\n|---|---|\n| `sys tcp listen / sys tcp listen reuseport / sys unix listen` | Enllaça i escolta en TCP IPv4 (`SO_REUSEADDR` / `SO_REUSEPORT`) o `AF_UNIX` |\n| `sys accept / sys tcp connect / sys unix connect` | `accept` i `connect` acotats per timeout retornant `SockFdResult` / `SockAcceptResult` |\n| `sys send / sys recv / sys shutdown write` | Enviament, recepció i tancament d'escriptura (`SHUT_WR`) de socket amb timeout |\n| `sys resolve ipv4 / dns resolve a` | Resolució IPv4 pura en Ridgun mitjançant `/etc/hosts` i consultes DNS UDP RFC 1035 |\n| `sock send frame / sock recv frame / ipv4 in cidr` | Framing prefixat per longitud (`N:payload`) i coincidència de subxarxes CIDR IPv4 |\n\n---\n\n## 4. Receptes pràctiques en estil tabular\n\n### Recepta 1: Flux principal amb `socket`\n\nObserva com els signes `=` i els passos de transformació queden alineats com una taula neta:\n\n```ridgun\nimport socket\n\nfn :: eco tcp local () => String\n      eco tcp local =\n        l_res = sys tcp listen \"127.0.0.1\" 0 16\n        lfd   = sock fd l_res\n        port  = sys local port lfd\n        c_res = sys tcp connect \"127.0.0.1\" port 1000\n        cfd   = sock fd c_res\n        a_res = sys accept lfd 1000\n        sfd   = sock accept fd a_res\n        _     = sys send cfd \"hola-solstice\" 1000\n        r_res = sys recv sfd 64 1000\n        datos = sock recv data r_res\n        _     = sys_close cfd\n        _     = sys_close sfd\n        _     = sys_close lfd\n        datos\n```\n\n### Recepta 2: Composició segura i sense efectes laterals\n\nTota funció de la lib `socket` és componible amb la resta de les 32 libs de `ridgun-libs`:\n\n```ridgun\nimport socket\n\nfn :: verificar ip interna (ip : String) => Bool\n      verificar ip interna ip =\n        ipv4 in cidr ip \"10.0.0.0/8\"\n```\n\n---\n\n## 5. Sota el capó: rendiment, memòria RMM i garanties\n\n- **Garantia algorísmica i de seguretat**: Actualització de registres amb sintaxi immutable `s with field = val`, resolució DNS sense `glibc`/`libnss` i codis d'estat deterministes (`0` OK, `-1` EOF, `-2` TIMEOUT, `-3` REFUSED).\n- **Memòria determinista (`RMM1`/`RMM2`)**: Zero pauses de recol·lector de brossa; totes les estructures intermèdies s'alliberen de forma determinista en sortir de l'àmbit.\n- **Verificació contínua**: Provada exhaustivament amb `stable check` i la suite automatitzada `src/test/ridgun/test_socket.rg`.\n"}, {"num": "28", "slug": "28-lib-http-uris-http11-i-client-tcp", "file": "28-lib-http-uris-http11-i-client-tcp.md", "title": "Capítol 28: La lib `http` — URIs RFC 3986, Codec HTTP/1.1 RFC 9112 i Client TCP en Viu", "short_title": "La lib `http` — URIs RFC 3986, Codec HTTP/1.1 RFC 9112 i Client TCP en Viu", "markdown": "# Capítol 28: La lib `http` — URIs RFC 3986, Codec HTTP/1.1 RFC 9112 i Client TCP en Viu\n\n## 1. Per què existeix la lib `http`?\n\nSiguem sincers: si no filtres salts `\\r\\n` en els valors de les capçaleres HTTP, un atacant pot injectar capçaleres falses o dividir la resposta (*CRLF Response Splitting*), i enllaçar `libcurl` per fer un simple `GET` o `POST` és excessiu.\n\nLa lib **`http`** implementa descomposició d'**URIs RFC 3986**, construcció i anàlisi de peticions i respostes **HTTP/1.1 RFC 9112** amb sanejament automàtic de CRLF (`VUL-INJ-002`) i `Content-Length` automàtic, extracció de tokens `Bearer` i un **client HTTP/1.1 en viu sobre sockets TCP del nucli** (`http get`, `http post`, `http request tcp`).\n\n---\n\n## 2. Artefactes, importació i arquitectura sense `libc`\n\nA `ridgun-libs`, **`http`** és una **lib** de primera classe situada a `src/main/ridgun/lib/http.rg` (domini `HTTP`). En compilar amb `stable bundle`, s'empaqueta en tres formats natius:\n\n| Artefacte | Ruta | Propòsit |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/http.rglib` | Distribució i importació directa amb `import http` |\n| **Fitxer compilat** | `target/http.rgc` | Artefacte intermedi verificat per `ridgunc` |\n| **Objecte compartit ELF64** | `target/libhttp.so` | Biblioteca dinàmica nativa sense dependències de C ni `libc` |\n\n> Per fer servir aquesta lib en qualsevol fitxer `.rg`, n'hi ha prou de declarar `import http` a la capçalera i cridar les seves funcions amb espais o guions baixos indistintament.\n\n---\n\n## 3. Referència ràpida de l'API de `http`\n\n| Signatura / Funció / Tipus | Què fa i quan fer-la servir |\n|---|---|\n| `uri parse / uri scheme / uri host / uri port / uri path / uri query` | Descompon URIs RFC 3986 amb ports per defecte automàtics (`80` en `http`, `443` en `https`) |\n| `http build request / http parse request` | Formata i analitza peticions HTTP/1.1 amb sanejament CRLF de capçaleres |\n| `http build response / http parse response` | Formata i analitza respostes HTTP/1.1 amb frases d'estat estàndard |\n| `http header get / http bearer token` | Cerca de capçaleres insensible a majúscules i extracció d'`Authorization: Bearer <token>` |\n| `http get / http post / http request tcp` | Executa crides HTTP/1.1 en viu sobre sockets TCP del nucli amb `timeout_ms` |\n\n---\n\n## 4. Receptes pràctiques en estil tabular\n\n### Recepta 1: Flux principal amb `http`\n\nObserva com els signes `=` i els passos de transformació queden alineats com una taula neta:\n\n```ridgun\nimport http\n\nfn :: inspeccionar endpoint (url : String) => (String, Int, String, String)\n      inspeccionar endpoint url =\n        host = uri host url\n        port = uri port url\n        path = uri path url\n        wire = http build request \"GET\" path [(\"Host\", host)] \"\"\n        (host, port, path, wire)\n```\n\n### Recepta 2: Composició segura i sense efectes laterals\n\nTota funció de la lib `http` és componible amb la resta de les 32 libs de `ridgun-libs`:\n\n```ridgun\nimport http\n\nfn :: extraer credenciales (raw_req : String) => (String, String)\n      extraer credenciales raw_req =\n        (metodo, ruta, _, hdrs_raw, _) = http parse request raw_req\n        hdrs = http parse headers hdrs_raw\n        tok  = http bearer token hdrs\n        (metodo + \" \" + ruta, tok)\n```\n\n---\n\n## 5. Sota el capó: rendiment, memòria RMM i garanties\n\n- **Garantia algorísmica i de seguretat**: Sanejament automàtic de `\\r` i `\\n` en totes les capçaleres (`http sanitize header`) per impedir atacs de divisió de resposta HTTP.\n- **Memòria determinista (`RMM1`/`RMM2`)**: Zero pauses de recol·lector de brossa; totes les estructures intermèdies s'alliberen de forma determinista en sortir de l'àmbit.\n- **Verificació contínua**: Provada exhaustivament amb `stable check` i la suite automatitzada `src/test/ridgun/test_http.rg`.\n"}, {"num": "29", "slug": "29-lib-ws-protocol-websocket-rfc6455", "file": "29-lib-ws-protocol-websocket-rfc6455.md", "title": "Capítol 29: La lib `ws` — Handshake WebSocket RFC 6455, Framing de 16/64 bits i Emmascament XOR", "short_title": "La lib `ws` — Handshake WebSocket RFC 6455, Framing de 16/64 bits i Emmascament XOR", "markdown": "# Capítol 29: La lib `ws` — Handshake WebSocket RFC 6455, Framing de 16/64 bits i Emmascament XOR\n\n## 1. Per què existeix la lib `ws`?\n\nSiguem sincers: el protocol WebSocket (RFC 6455) combina un handshake SHA-1 + Base64 amb trames binàries de longitud variable (7 bits, 16 bits o 64 bits) i emmascarament XOR obligatori de client a servidor.\n\nLa lib **`ws`** implementa **RFC 6455** complet en Ridgun pur: càlcul de `Sec-WebSocket-Accept` (amb SHA-1 RFC 3174 integrat exclusivament per al GUID de handshake), capçaleres HTTP `101 Switching Protocols`, codificació i descodificació de trames (`WsFrame`) amb longituds de 7, 16 (`126`) i 64 bits (`127`), emmascarament simètric XOR i constructors de trames de text, ping, pong i tancament.\n\n---\n\n## 2. Artefactes, importació i arquitectura sense `libc`\n\nA `ridgun-libs`, **`ws`** és una **lib** de primera classe situada a `src/main/ridgun/lib/ws.rg` (domini `WS`). En compilar amb `stable bundle`, s'empaqueta en tres formats natius:\n\n| Artefacte | Ruta | Propòsit |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/ws.rglib` | Distribució i importació directa amb `import ws` |\n| **Fitxer compilat** | `target/ws.rgc` | Artefacte intermedi verificat per `ridgunc` |\n| **Objecte compartit ELF64** | `target/libws.so` | Biblioteca dinàmica nativa sense dependències de C ni `libc` |\n\n> Per fer servir aquesta lib en qualsevol fitxer `.rg`, n'hi ha prou de declarar `import ws` a la capçalera i cridar les seves funcions amb espais o guions baixos indistintament.\n\n---\n\n## 3. Referència ràpida de l'API de `ws`\n\n| Signatura / Funció / Tipus | Què fa i quan fer-la servir |\n|---|---|\n| `ws accept key : String -> String` | Calcula `Sec-WebSocket-Accept` (RFC 6455 §1.3) a partir de `Sec-WebSocket-Key` |\n| `ws build upgrade request / ws build upgrade response` | Formata els missatges HTTP/1.1 de negociació (upgrade handshake) WebSocket |\n| `ws encode frame / ws decode frame` | Codifica i descodifica trames `WsFrame` (`fin`, `opcode`, `masked`, `mask_key`, `payload`) |\n| `ws text frame / ws ping frame / ws pong frame / ws close frame` | Constructors de trames d'alt nivell i extractors de codi de tancament (`1000` normal) |\n\n---\n\n## 4. Receptes pràctiques en estil tabular\n\n### Recepta 1: Flux principal amb `ws`\n\nObserva com els signes `=` i els passos de transformació queden alineats com una taula neta:\n\n```ridgun\nimport ws\n\nfn :: negociar y enviar (client_key : String) => (String, String)\n      negociar y enviar client_key =\n        resp  = ws build upgrade response client_key\n        trama = ws encode frame (ws text frame \"hola-tiempo-real\" False \"\")\n        (resp, trama)\n```\n\n### Recepta 2: Composició segura i sense efectes laterals\n\nTota funció de la lib `ws` és componible amb la resta de les 32 libs de `ridgun-libs`:\n\n```ridgun\nimport ws\n\nfn :: decodificar trama cliente (clave4 : String) (msg : String) => String\n      decodificar trama cliente clave4 msg =\n        wire = ws encode frame (ws text frame msg True clave4)\n        res  = ws decode frame wire\n        ws frame payload res\n```\n\n---\n\n## 5. Sota el capó: rendiment, memòria RMM i garanties\n\n- **Garantia algorísmica i de seguretat**: Coincidència exacta amb el vector oficial RFC 6455 (`\"dGhlIHNhbXBsZSBub25jZQ==\"` $\\rightarrow$ `\"s3pPLMBiTxaQ9kYGzzhZRbK+xOo=\"`) i desemmascarament automàtic a `ws decode frame`.\n- **Memòria determinista (`RMM1`/`RMM2`)**: Zero pauses de recol·lector de brossa; totes les estructures intermèdies s'alliberen de forma determinista en sortir de l'àmbit.\n- **Verificació contínua**: Provada exhaustivament amb `stable check` i la suite automatitzada `src/test/ridgun/test_ws.rg`.\n"}, {"num": "30", "slug": "30-lib-agent-concurrencia-d-actors", "file": "30-lib-agent-concurrencia-d-actors.md", "title": "Capítol 30: La lib `agent` — Model Natiu d'Actors (`agent`, `send`, `receive`), KV Store i Rate Limiter", "short_title": "La lib `agent` — Model Natiu d'Actors (`agent`, `send`, `receive`), KV Store i Rate Limiter", "markdown": "# Capítol 30: La lib `agent` — Model Natiu d'Actors (`agent`, `send`, `receive`), KV Store i Rate Limiter\n\n## 1. Per què existeix la lib `agent`?\n\nSiguem sincers: compartir memòria mutable entre fils amb `Mutex`, `RwLock` i variables de condició és una fàbrica inesgotable de *deadlocks* i condicions de carrera.\n\nLa lib **`agent`** aprofita el **Model Natiu d'Agents** de Ridgun (`agent`, `send ... to`, `receive from`, `try receive from`, `stop`) per oferir bústies aïllades amb pas de missatges Copy-on-Write, un magatzem clau-valor concurrent (`KvStore`), un limitador de taxa per cubell de tokens (`RateBucket`) i supervisió d'estat (`AgentHealth`).\n\n---\n\n## 2. Artefactes, importació i arquitectura sense `libc`\n\nA `ridgun-libs`, **`agent`** és una **lib** de primera classe situada a `src/main/ridgun/lib/agent.rg` (domini `AGENT`). En compilar amb `stable bundle`, s'empaqueta en tres formats natius:\n\n| Artefacte | Ruta | Propòsit |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/agent.rglib` | Distribució i importació directa amb `import agent` |\n| **Fitxer compilat** | `target/agent.rgc` | Artefacte intermedi verificat per `ridgunc` |\n| **Objecte compartit ELF64** | `target/libagent.so` | Biblioteca dinàmica nativa sense dependències de C ni `libc` |\n\n> Per fer servir aquesta lib en qualsevol fitxer `.rg`, n'hi ha prou de declarar `import agent` a la capçalera i cridar les seves funcions amb espais o guions baixos indistintament.\n\n---\n\n## 3. Referència ràpida de l'API de `agent`\n\n| Signatura / Funció / Tipus | Què fa i quan fer-la servir |\n|---|---|\n| `agent roundtrip / agent drain count` | Llança actors natius (`agent`), intercanvia missatges (`send ... to` / `receive from`) i executa `stop` |\n| `kv store new / kv store apply` | Magatzem clau-valor immutable per a actors (`KvPut`, `KvGet`, `KvDelete`, `KvClear`) |\n| `rate bucket new / rate bucket allow` | Limitador de taxa per cubell de tokens que retorna el cubell actualitzat i `(allowed, remaining)` |\n| `sup mark failed / sup should restart` | Polítiques de supervisió amb control de pressupost de reinicis (`max_restarts`) |\n\n---\n\n## 4. Receptes pràctiques en estil tabular\n\n### Recepta 1: Flux principal amb `agent`\n\nObserva com els signes `=` i els passos de transformació queden alineats com una taula neta:\n\n```ridgun\nimport agent\n\nfn :: probar actor nativo () => (Int, Int)\n      probar actor nativo =\n        eco = agent roundtrip 42\n        vac = agent drain count [10, 20, 30]\n        (eco, vac)\n```\n\n### Recepta 2: Composició segura i sense efectes laterals\n\nTota funció de la lib `agent` és componible amb la resta de les 32 libs de `ridgun-libs`:\n\n```ridgun\nimport agent\n\nfn :: aplicar limite peticion () => (Bool, Int)\n      aplicar limite peticion =\n        b0         = rate bucket new 10 2 1000\n        (b1, res1) = rate bucket allow b0 1 1000\n        rateresp allowed res1, rateobs remaining res1\n```\n\n---\n\n## 5. Sota el capó: rendiment, memòria RMM i garanties\n\n- **Garantia algorísmica i de seguretat**: Zero memòria mutable compartida entre actors: cada missatge es transfereix per valor / Copy-on-Write i `stop` allibera la regió de l'agent de forma determinista.\n- **Memòria determinista (`RMM1`/`RMM2`)**: Zero pauses de recol·lector de brossa; totes les estructures intermèdies s'alliberen de forma determinista en sortir de l'àmbit.\n- **Verificació contínua**: Provada exhaustivament amb `stable check` i la suite automatitzada `src/test/ridgun/test_agent.rg`.\n"}, {"num": "31", "slug": "31-lib-pool-treballadors-i-work-stealing", "file": "31-lib-pool-treballadors-i-work-stealing.md", "title": "Capítol 31: La lib `pool` — Pool Acotat de Treballadors, Round-Robin i Robatori de Treball", "short_title": "La lib `pool` — Pool Acotat de Treballadors, Round-Robin i Robatori de Treball", "markdown": "# Capítol 31: La lib `pool` — Pool Acotat de Treballadors, Round-Robin i Robatori de Treball\n\n## 1. Per què existeix la lib `pool`?\n\nSiguem sincers: llançar un fil o actor nou per cada petició entrant sense límit superior (`unbounded spawning`) fa que un pic de trànsit esgoti la memòria en segons (*Out Of Memory*).\n\nLa lib **`pool`** proporciona un despatxador de tasques amb **contrapressió explícita** (`PoolAccept`, `PoolRejectFull`), partició equilibrada de lots en $K$ carrils (`pool partition`), reequilibri per **robatori de treball (*work-stealing*)** (`pool steal rebalance`) i execució paral·lela sobre actors natius.\n\n---\n\n## 2. Artefactes, importació i arquitectura sense `libc`\n\nA `ridgun-libs`, **`pool`** és una **lib** de primera classe situada a `src/main/ridgun/lib/pool.rg` (domini `AGENT`). En compilar amb `stable bundle`, s'empaqueta en tres formats natius:\n\n| Artefacte | Ruta | Propòsit |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/pool.rglib` | Distribució i importació directa amb `import pool` |\n| **Fitxer compilat** | `target/pool.rgc` | Artefacte intermedi verificat per `ridgunc` |\n| **Objecte compartit ELF64** | `target/libpool.so` | Biblioteca dinàmica nativa sense dependències de C ni `libc` |\n\n> Per fer servir aquesta lib en qualsevol fitxer `.rg`, n'hi ha prou de declarar `import pool` a la capçalera i cridar les seves funcions amb espais o guions baixos indistintament.\n\n---\n\n## 3. Referència ràpida de l'API de `pool`\n\n| Signatura / Funció / Tipus | Què fa i quan fer-la servir |\n|---|---|\n| `pool new : Int -> Int -> PoolState` | Crea un pool acotat amb `workers` carrils i capacitat màxima `max_queue` |\n| `pool submit : PoolState -> PoolTask -> (PoolState, PoolDecision)` | Encola una tasca en round-robin o retorna `PoolRejectFull` si està saturat |\n| `pool partition / pool steal rebalance` | Reparteix lots entre $K$ treballadors i roba la meitat d'una cua sobrecarregada per a un treballador lliure |\n| `pool map sum / pool parallel sum2` | Despatxa càrregues de treball en paral·lel sobre treballadors `agent` natius |\n\n---\n\n## 4. Receptes pràctiques en estil tabular\n\n### Recepta 1: Flux principal amb `pool`\n\nObserva com els signes `=` i els passos de transformació queden alineats com una taula neta:\n\n```ridgun\nimport pool\n\nfn :: encolar con contrapresion () => (Int, Int)\n      encolar con contrapresion =\n        p0        = pool new 4 16\n        tarea     = PoolTask 1 100 \"indexar-bloque\"\n        (p1, dec) = pool submit p0 tarea\n        (pool queued p1, pool accepted p1)\n```\n\n### Recepta 2: Composició segura i sense efectes laterals\n\nTota funció de la lib `pool` és componible amb la resta de les 32 libs de `ridgun-libs`:\n\n```ridgun\nimport pool\n\nfn :: sumar en paralelo () => Int\n      sumar en paralelo =\n        pool parallel sum2 [10, 20, 30] [40, 50, 60]\n```\n\n---\n\n## 5. Sota el capó: rendiment, memòria RMM i garanties\n\n- **Garantia algorísmica i de seguretat**: Capacitat de cua estrictament acotada (`queued <= max_queue`) per protegir la memòria sota sobrecàrrega i repartiment determinista entre treballadors.\n- **Memòria determinista (`RMM1`/`RMM2`)**: Zero pauses de recol·lector de brossa; totes les estructures intermèdies s'alliberen de forma determinista en sortir de l'àmbit.\n- **Verificació contínua**: Provada exhaustivament amb `stable check` i la suite automatitzada `src/test/ridgun/test_pool.rg`.\n"}, {"num": "32", "slug": "32-lib-net-agent-supervisor-de-connexions", "file": "32-lib-net-agent-supervisor-de-connexions.md", "title": "Capítol 32: La lib `net_agent` — Supervisor de Connexions de Xarxa i Pont d'Esdeveniments No Bloquejant", "short_title": "La lib `net_agent` — Supervisor de Connexions de Xarxa i Pont d'Esdeveniments No Bloquejant", "markdown": "# Capítol 32: La lib `net_agent` — Supervisor de Connexions de Xarxa i Pont d'Esdeveniments No Bloquejant\n\n## 1. Per què existeix la lib `net_agent`?\n\nSiguem sincers: en un servidor real com **Solstice**, acceptar connexions TCP és la part fàcil; el difícil és limitar el màxim de clients simultanis, desconnectar clients zombis inactius (*idle timeout*) i connectar el bucle `ppoll` amb els teus actors sense fuites de descriptors.\n\nLa lib **`net_agent`** tanca el cercle de `ridgun-libs` unint **`posix`**, **`socket`** i **`agent`**: gestiona taules de connexions supervisades (`NetSupervisor`), aplica límits de concurrència (`max_conns`), purga connexions inactives (`net evict idle`) i converteix esdeveniments de descriptors del nucli en esdeveniments tipats (`NetEvReadyRead`, `NetEvReadyWrite`, `NetEvTimeout`, `NetEvError`) a més d'oferir un pas d'eco TCP complet d'extrem a extrem (`net tcp echo step`).\n\n---\n\n## 2. Artefactes, importació i arquitectura sense `libc`\n\nA `ridgun-libs`, **`net_agent`** és una **lib** de primera classe situada a `src/main/ridgun/lib/net_agent.rg` (domini `AGENT`). En compilar amb `stable bundle`, s'empaqueta en tres formats natius:\n\n| Artefacte | Ruta | Propòsit |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/net_agent.rglib` | Distribució i importació directa amb `import net_agent` |\n| **Fitxer compilat** | `target/net_agent.rgc` | Artefacte intermedi verificat per `ridgunc` |\n| **Objecte compartit ELF64** | `target/libnet_agent.so` | Biblioteca dinàmica nativa sense dependències de C ni `libc` |\n\n> Per fer servir aquesta lib en qualsevol fitxer `.rg`, n'hi ha prou de declarar `import net_agent` a la capçalera i cridar les seves funcions amb espais o guions baixos indistintament.\n\n---\n\n## 3. Referència ràpida de l'API de `net_agent`\n\n| Signatura / Funció / Tipus | Què fa i quan fer-la servir |\n|---|---|\n| `net supervisor new : Int -> Int -> NetSupervisor` | Crea un supervisor de connexions amb límit `max_conns` i inactivitat `idle_timeout_ms` |\n| `net register conn / net record rx / net record tx / net close conn` | Registra sockets acceptats, actualitza comptadors de bytes/activitat i tanca parells |\n| `net evict idle : NetSupervisor -> Int -> (NetSupervisor, [Int])` | Tanca i expulsa connexions inactives més enllà d'`idle_timeout_ms`, retornant els seus FDs |\n| `net poll fd : Int -> Bool -> Int -> NetEvent` | Pont `wait fd` no bloquejant que emet `NetEvReadyRead`, `NetEvReadyWrite`, `NetEvTimeout` o `NetEvError` |\n| `net tcp echo step : String -> Int -> (Int, String)` | Pas complet d'extrem a extrem TCP loopback (`listen/connect/accept/supervise/echo`) |\n\n---\n\n## 4. Receptes pràctiques en estil tabular\n\n### Recepta 1: Flux principal amb `net_agent`\n\nObserva com els signes `=` i els passos de transformació queden alineats com una taula neta:\n\n```ridgun\nimport net_agent\n\nfn :: supervisar clientes () => (Int, [Int])\n      supervisar clientes =\n        s0        = net supervisor new 100 5000\n        (s1, _)   = net register conn s0 10 \"10.0.0.1\" 51000 1000\n        (s2, _)   = net register conn s1 11 \"10.0.0.2\" 51001 6500\n        (s3, exp) = net evict idle s2 7000\n        (net active count s3, exp)\n```\n\n### Recepta 2: Composició segura i sense efectes laterals\n\nTota funció de la lib `net_agent` és componible amb la resta de les 32 libs de `ridgun-libs`:\n\n```ridgun\nimport net_agent\n\nfn :: probar puente tcp supervisado () => (Int, String)\n      probar puente tcp supervisado =\n        net tcp echo step \"ping-supervisado\" 1000\n```\n\n---\n\n## 5. Sota el capó: rendiment, memòria RMM i garanties\n\n- **Garantia algorísmica i de seguretat**: Protecció automàtica enfront d'esgotament de descriptors (`max_conns`), expulsió determinista de connexions inactives i tancament garantit de sockets a `net tcp echo step`.\n- **Memòria determinista (`RMM1`/`RMM2`)**: Zero pauses de recol·lector de brossa; totes les estructures intermèdies s'alliberen de forma determinista en sortir de l'àmbit.\n- **Verificació contínua**: Provada exhaustivament amb `stable check` i la suite automatitzada `src/test/ridgun/test_net_agent.rg`.\n"}];
    const UI_STRINGS = {"copy_label": "Copia", "copied_label": "Copiat!", "prev_label": "&larr; Capítol anterior", "next_label": "Capítol següent &rarr;", "search_hits_label": "Resultats per a", "search_empty_label": "No s'han trobat coincidències per a"};
    let currentIdx = 0;

    function escapeHtml(s) {
      return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function highlightRidgun(code) {
      return code.split("\n").map(line => {
        const comIdx = (() => {
          let inD = false, inS = false;
          for (let i = 0; i < line.length - 1; i++) {
            if (line[i] === "\\") { i++; continue; }
            if (line[i] === '"' && !inS) inD = !inD;
            else if (line[i] === "'" && !inD) inS = !inS;
            else if (!inD && !inS && line[i] === "-" && line[i+1] === "-") return i;
          }
          return -1;
        })();
        const codePart = comIdx >= 0 ? line.slice(0, comIdx) : line;
        const comPart = comIdx >= 0 ? line.slice(comIdx) : "";
        let html = escapeHtml(codePart);
        html = html.replace(/("([^"\\]|\\.)*"|'[^']*')/g, '<span class="rg-str">$1</span>');
        html = html.replace(/\b(fn|op|type|import|mut|otherwise|with|region|timeout|do|global|context|shared|atomic|hardware|echo|and|or|xor|not|agent|send|to|receive|from|try|stop)\b/g, '<span class="rg-kw">$1</span>');
        html = html.replace(/\b(Int|Real|String|Char|Bool|U64|Tensor|Option|Result|Some|None|Ok|Err|OutOfMemory|Timeout|True|False)\b/g, '<span class="rg-ty">$1</span>');
        html = html.replace(/(::|=&gt;|-&gt;|&lt;-|\|\|\.|\|\||\|\.)/g, '<span class="rg-op">$1</span>');
        html = html.replace(/\b(0x[0-9a-fA-F_]+|[0-9][0-9_]*(_KB|_MB|_GB)?(\.[0-9]+)?)\b/g, '<span class="rg-num">$1</span>');
        if (comPart) {
          html += '<span class="rg-com">' + escapeHtml(comPart) + '</span>';
        }
        return html;
      }).join("\n");
    }

    function formatInline(text) {
      let out = escapeHtml(text);
      out = out.replace(/`([^`]+)`/g, "<code>$1</code>");
      out = out.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      out = out.replace(/\*([^*]+)\*/g, "<em>$1</em>");
      out = out.replace(/\$O\(([^)]+)\)\$/g, "<code>O($1)</code>");
      out = out.replace(/\$\\rightarrow\$/g, "&rarr;");
      return out;
    }

    function renderMarkdown(md) {
      const lines = md.split("\n");
      let html = "";
      let i = 0;
      while (i < lines.length) {
        const line = lines[i];
        if (line.startsWith("```")) {
          const lang = line.slice(3).trim() || "ridgun";
          i++;
          const buf = [];
          while (i < lines.length && !lines[i].startsWith("```")) {
            buf.push(lines[i]);
            i++;
          }
          i++;
          const rawCode = buf.join("\n");
          const bodyHtml = (lang === "ridgun" || lang === "") ? highlightRidgun(rawCode) : escapeHtml(rawCode);
          html += `<div class="code-wrapper"><div class="code-header"><span>${escapeHtml(lang)}</span><button class="copy-btn" onclick="copyCode(this)">${escapeHtml(UI_STRINGS.copy_label)}</button></div><pre data-raw="${ encodeURIComponent(rawCode) }"><code>${bodyHtml}</code></pre></div>`;
          continue;
        }
        if (/^---+$/.test(line.trim())) {
          html += "<hr />";
          i++;
          continue;
        }
        if (line.startsWith("# ")) {
          html += `<h1>${formatInline(line.slice(2).trim())}</h1>`;
          i++;
          continue;
        }
        if (line.startsWith("## ")) {
          html += `<h2>${formatInline(line.slice(3).trim())}</h2>`;
          i++;
          continue;
        }
        if (line.startsWith("### ")) {
          html += `<h3>${formatInline(line.slice(4).trim())}</h3>`;
          i++;
          continue;
        }
        if (line.trim().startsWith("|") && i + 1 < lines.length && /^\|[\s:-]+\|/.test(lines[i+1].trim())) {
          const headers = line.trim().slice(1, -1).split("|").map(c => formatInline(c.trim()));
          i += 2;
          const rows = [];
          while (i < lines.length && lines[i].trim().startsWith("|")) {
            rows.push(lines[i].trim().slice(1, -1).split("|").map(c => formatInline(c.trim())));
            i++;
          }
          html += '<div class="table-wrap"><table><thead><tr>' + headers.map(h => `<th>${h}</th>`).join("") + '</tr></thead><tbody>' +
                  rows.map(r => '<tr>' + r.map(c => `<td>${c}</td>`).join("") + '</tr>').join("") + '</tbody></table></div>';
          continue;
        }
        if (line.startsWith(">")) {
          const qLines = [];
          while (i < lines.length && lines[i].startsWith(">")) {
            qLines.push(lines[i].replace(/^>\s?/, ""));
            i++;
          }
          html += `<blockquote><p>${qLines.map(formatInline).join("<br/>")}</p></blockquote>`;
          continue;
        }
        if (/^\s*-\s+/.test(line)) {
          const items = [];
          while (i < lines.length && /^\s*-\s+/.test(lines[i])) {
            items.push(formatInline(lines[i].replace(/^\s*-\s+/, "")));
            i++;
          }
          html += "<ul>" + items.map(it => `<li>${it}</li>`).join("") + "</ul>";
          continue;
        }
        if (/^\s*\d+\.\s+/.test(line)) {
          const items = [];
          while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
            items.push(formatInline(lines[i].replace(/^\s*\d+\.\s+/, "")));
            i++;
          }
          html += "<ol>" + items.map(it => `<li>${it}</li>`).join("") + "</ol>";
          continue;
        }
        if (!line.trim()) {
          i++;
          continue;
        }
        const pLines = [];
        while (i < lines.length && lines[i].trim() && !lines[i].startsWith("#") && !lines[i].startsWith("```") && !lines[i].startsWith(">") && !lines[i].trim().startsWith("|") && !/^---+$/.test(lines[i].trim()) && !/^\s*(-|\d+\.)\s+/.test(lines[i])) {
          pLines.push(formatInline(lines[i]));
          i++;
        }
        html += `<p>${pLines.join(" ")}</p>`;
      }
      return html;
    }

    window.copyCode = function(btn) {
      const pre = btn.closest(".code-wrapper").querySelector("pre");
      const raw = decodeURIComponent(pre.getAttribute("data-raw"));
      navigator.clipboard.writeText(raw);
      const old = btn.textContent;
      btn.textContent = UI_STRINGS.copied_label;
      setTimeout(() => { btn.textContent = old; }, 1400);
    };

    function renderSidebar() {
      const nav = document.getElementById("navList");
      nav.innerHTML = CHAPTERS.map((ch, idx) => `
        <li class="nav-item">
          <button class="nav-btn ${idx === currentIdx ? 'active' : ''}" onclick="selectChapter(${idx})">
            <span class="nav-num">${ch.num}</span>
            <span>${escapeHtml(ch.short_title)}</span>
          </button>
        </li>
      `).join("");
    }

    window.selectChapter = function(idx) {
      currentIdx = idx;
      const ch = CHAPTERS[idx];
      location.hash = ch.slug;
      renderSidebar();
      let pagerHtml = '<div class="pager">';
      if (idx > 0) {
        pagerHtml += `<button class="pager-btn prev" onclick="selectChapter(${idx - 1})"><span class="pager-label">${UI_STRINGS.prev_label}</span><span class="pager-title">${escapeHtml(CHAPTERS[idx - 1].title)}</span></button>`;
      } else {
        pagerHtml += '<div></div>';
      }
      if (idx + 1 < CHAPTERS.length) {
        pagerHtml += `<button class="pager-btn next" onclick="selectChapter(${idx + 1})"><span class="pager-label">${UI_STRINGS.next_label}</span><span class="pager-title">${escapeHtml(CHAPTERS[idx + 1].title)}</span></button>`;
      }
      pagerHtml += '</div>';
      document.getElementById("chapterContent").innerHTML = renderMarkdown(ch.markdown) + pagerHtml;
      window.scrollTo({ top: 0, behavior: "smooth" });
    };

    document.getElementById("searchInput").addEventListener("input", (e) => {
      const q = e.target.value.trim().toLowerCase();
      if (q.length < 2) {
        selectChapter(currentIdx);
        return;
      }
      const hits = [];
      CHAPTERS.forEach((ch, idx) => {
        const lines = ch.markdown.split("\n");
        for (const l of lines) {
          if (l.toLowerCase().includes(q)) {
            hits.push({ idx, title: ch.title, snippet: l.replace(/^[#>*-]+\s*/, "").slice(0, 140) });
            break;
          }
        }
      });
      const box = hits.length
        ? `<div class="search-results"><strong>${escapeHtml(UI_STRINGS.search_hits_label)} "${escapeHtml(q)}" (${hits.length}):</strong>` +
          hits.map(h => `<div class="search-hit" onclick="document.getElementById('searchInput').value=''; selectChapter(${h.idx})"><div class="search-hit-title">${escapeHtml(h.title)}</div><div class="search-hit-snippet">${escapeHtml(h.snippet)}</div></div>`).join("") +
          `</div>`
        : `<div class="search-results">${escapeHtml(UI_STRINGS.search_empty_label)} "${escapeHtml(q)}".</div>`;
      document.getElementById("chapterContent").innerHTML = box + renderMarkdown(CHAPTERS[currentIdx].markdown);
    });

    document.getElementById("themeBtn").addEventListener("click", () => {
      const root = document.documentElement;
      root.setAttribute("data-theme", root.getAttribute("data-theme") === "dark" ? "light" : "dark");
    });

    const initialSlug = location.hash.replace(/^#/, "");
    const foundIdx = CHAPTERS.findIndex(c => c.slug === initialSlug);
    selectChapter(foundIdx >= 0 ? foundIdx : 0);
  </script>
</body>
</html>
