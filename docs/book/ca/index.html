  <script>
    const CHAPTERS = [{"num": "00", "slug": "00-per-que-necessito-ridgun-libs", "file": "00-per-que-necessito-ridgun-libs.md", "title": "Capítol 00: Per què necessito `ridgun-libs`? 32 libs sense ni una línia de C? Explica-m'ho!", "short_title": "Per què necessito `ridgun-libs`? 32 libs sense ni una línia de C? Explica-m'ho!", "markdown": "# Capítol 00: Per què necessito `ridgun-libs`? 32 libs sense ni una línia de C? Explica-m'ho!\n\nSiguem sincers: quan descobreixes que un llenguatge compila a un binari ELF natiu minúscul i sense recol·lector de brossa, la segona pregunta que et fas —amb tota la raó del món— és:\n\n> *\"D'acord, el llenguatge mola molt... però quan hagi d'obrir un socket TCP, calcular un hash Argon2id, analitzar un JSON, resoldre un sistema lineal amb tensors o muntar un pool d'actors, hauré d'enllaçar `libc`, `OpenSSL`, `libcurl` i `pcre2`, o baixar-me 800 paquets de tercers mantinguts per un desconegut?\"*\n\nÉs una pregunta excel·lent. I la resposta curta és: **no**. Per a això existeix **`ridgun-libs`**: una suite de **32 libs fonamentals** escrites al **100 % en Ridgun pur (`v0.9.16`)**, amb **zero dependències en C** i **zero `libc`**.\n\nPosem nom als quatre mals de cap diaris que `ridgun-libs` elimina d'arrel.\n\n---\n\n## Mal de cap núm. 1: \"L'infern de `libc`, OpenSSL i l'enllaçat creuat\"\n\nSegur que has viscut aquest malson:\n\n1. Escrius un servidor o una eina CLI suposadament \"estàtica\" o \"portable\".\n2. Tan bon punt necessites criptografia (`SHA-256`, `Argon2id`, `ChaCha20-Poly1305`), xarxa (`DNS`, `HTTP`, `WebSockets`) o expressions regulars, el teu programa acaba depenent de `glibc 2.38`, `libssl.so.3` i tres capçaleres de C.\n3. Intentes copiar el binari a un contenidor mínim o a una altra distribució Linux i explota en arrencar amb l'infame `version 'GLIBC_2.38' not found`.\n\n**Què canvia amb `ridgun-libs`?**\nCadascuna de les 32 libs d'aquest repositori està escrita íntegrament en Ridgun tabular i parla directament amb el nucli del sistema operatiu mitjançant la capa PAL (`posix`) o executa algorismes purs en memòria determinista (`RMM1`/`RMM2`). Es compilen tant a paquets portables (`.rglib` / `.rgc`) com a objectes compartits ELF64 natius (`lib*.so`). Sense `libc`, sense FFI fràgil i sense sorpreses en desplegar.\n\n---\n\n## Mal de cap núm. 2: \"La síndrome del `node_modules` / `Cargo.lock` de 400 dependències\"\n\nEn molts ecosistemes moderns, la biblioteca estàndard és tan esquelètica que per llegir un fitxer `.ini`, validar un `UUIDv7`, aplicar un pedaç Unified Diff o renderitzar una plantilla HTML segura necessites instal·lar mitja dotzena de paquets externs.\n\nA **`ridgun-libs`**, les **32 libs** segueixen una única filosofia de disseny:\n\n```ridgun\nimport crypto\nimport json\nimport http\n\nfn :: autenticar y pedir (token : String) => String\n      autenticar y pedir token =\n        -- Totes les libs comparteixen tipus purs, alineació tabular i semàntica determinista\n        mac_hex = sha256 hex token\n        cuerpo  = json stringify (JnObj [(\"token_sha256\", JnStr mac_hex)])\n        pet     = http build request \"POST\" \"/v1/sesion\" [(\"Content-Type\", \"application/json\")] cuerpo\n        pet\n```\n\nMateixa estètica tabular, mateixos ADTs immutables (`Option`, `Result`, `IoResult`, `JsonVal`), zero efectes laterals ocults.\n\n---\n\n## Mal de cap núm. 3: \"Expressions regulars que pengen la CPU (ReDoS) i sockets que bloquegen per sempre\"\n\nDues bombes de rellotgeria clàssiques a producció:\n\n- Un usuari maliciós envia una cadena dissenyada perquè el teu motor d'expressions regulars amb *backtracking* entri en temps exponencial $O(2^N)$ i deixi fregit un nucli al 100 %.\n- Un descriptor de xarxa es queda mig obert i el teu fil es queda bloquejat eternament esperant un `read()` sense data límit.\n\nA **`ridgun-libs`**:\n- La lib **`regex`** (Capítol 11) implementa un autòmat **NFA de Thompson** que garanteix temps lineal estricte **$O(N \\cdot M)$**: immune per construcció a atacs ReDoS.\n- Les libs **`posix`**, **`io`** i **`socket`** (Capítols 22, 23 i 27) integren quotes lèxiques `with timeout` i `ppoll` a nivell de descriptor: cap operació d'entrada/sortida pot penjar el teu servei.\n\n---\n\n## Mal de cap núm. 4: \"Criptografia i àlgebra lineal que semblen jeroglífics\"\n\nA **`ridgun-libs`**, la potència dels tipus `Tensor[...]` de Ridgun permet que libs com **`tensor`** (Capítol 05), **`linalg`** (Capítol 06) i **`argon2id`** (Capítol 25) operin sobre blocs de memòria contigua (`Tensor[U64 * 8 * 16]`, `Tensor[Real]`) mantenint la llegibilitat d'una taula matemàtica.\n\n---\n\n## Mapa complet del llibre: 32 capítols per a 32 libs\n\nCada capítol d'aquest llibre està dedicat a **una lib** de `ridgun-libs`, agrupades en una progressió lògica de baix a dalt:\n\n| Capítols | Família de libs | Libs incloses |\n|---|---|---|\n| **01 – 04** | Text, Matemàtiques i Estructures de Dades | `str`, `math`, `list`, `btree` |\n| **05 – 06** | Tensors i Àlgebra Lineal | `tensor`, `linalg` |\n| **07 – 10** | Codificació i Formats de Dades | `codec`, `json`, `csv`, `ini` |\n| **11 – 15** | Motors de Text, Diffs, Plantilles i Formatat | `regex`, `glob`, `diff`, `template`, `fmt` |\n| **16 – 21** | CLI, Rutes, Temps, UUIDs, Logs i Testing | `cli`, `path`, `time`, `uuid`, `log`, `test` |\n| **22 – 23** | Sistemes POSIX i E/S amb Timeout | `posix`, `io` |\n| **24 – 26** | Criptografia, Argon2id i Tokens JWT | `crypto`, `argon2id`, `jwt` |\n| **27 – 29** | Xarxes, Sockets del Nucli, HTTP/1.1 i WebSockets | `socket`, `http`, `ws` |\n| **30 – 32** | Concurrència d'Actors, Pools i Supervisió de Xarxa | `agent`, `pool`, `net_agent` |\n\nSom-hi! Passa al **Capítol 01 (`str`)** i comencem a construir.\n"}, {"num": "01", "slug": "01-lib-str-manipulacio-de-text", "file": "01-lib-str-manipulacio-de-text.md", "title": "Capítol 01: La lib `str` — Manipulació de Text, Cerca i Format Tabular", "short_title": "La lib `str` — Manipulació de Text, Cerca i Format Tabular", "markdown": "# Capítol 01: La lib `str` — Manipulació de Text, Cerca i Format Tabular\n\n## 1. Per què existeix la lib `str`?\n\nSiguem sincers: en C manipular cadenes amb `strtok` i `strncpy` és caminar per un camp de mines de desbordaments de memòria i punters `NULL`, i en altres llenguatges acabes important tres paquets només per alinear columnes o repetir un separador en $O(\\log N)$.\n\nLa lib **`str`** proporciona totes les primitives pures i immutables per cercar, retallar, dividir, unir, canviar majúscules/minúscules, repetir per duplicació binària $O(\\log N)$ i emplenar cadenes.\n\n---\n\n## 2. Artefactes, importació i arquitectura sense `libc`\n\nA `ridgun-libs`, **`str`** és una **lib** de primera classe situada a `src/main/ridgun/lib/str.rg` (domini `STR`). En compilar amb `stable bundle`, s'empaqueta en tres formats natius:\n\n| Artefacte | Ruta | Propòsit |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/str.rglib` | Distribució i importació directa amb `import str` |\n| **Fitxer compilat** | `target/str.rgc` | Artefacte intermedi verificat per `ridgunc` |\n| **Objecte compartit ELF64** | `target/libstr.so` | Biblioteca dinàmica nativa sense dependències de C ni `libc` |\n\n> Per fer servir aquesta lib en qualsevol fitxer `.rg`, n'hi ha prou de declarar `import str` a la capçalera i cridar les seves funcions amb espais o guions baixos indistintament.\n\n---\n\n## 3. Referència ràpida de l'API de `str`\n\n| Signatura / Funció / Tipus | Què fa i quan fer-la servir |\n|---|---|\n| `str index of : String -> String -> Int` | Primer índex de la subcadena (`-1` si no existeix / `0` si és buida) |\n| `str contains / str starts with / str ends with` | Predicats `Bool` de subcadena, prefix i sufix |\n| `str trim / str trim left / str trim right` | Elimina espais en blanc ASCII (` `, `\\t`, `\\n`, `\\r`) |\n| `str split / str lines / str words / str join` | Divideix en `[String]` i uneix llistes amb un separador |\n| `str replace / str to upper / str to lower` | Reemplaçament sense solapament i conversió ASCII de majúscules/minúscules |\n| `str repeat / str pad left / str pad right` | Repetició en $O(\\log N)$ i farciment de columnes a amplada fixa |\n\n---\n\n## 4. Receptes pràctiques en estil tabular\n\n### Recepta 1: Flux principal amb `str`\n\nObserva com els signes `=` i els passos de transformació queden alineats com una taula neta:\n\n```ridgun\nimport str\n\nfn :: normalizar cabecera (raw : String) => String\n      normalizar cabecera raw =\n        limpia = str to lower (str trim raw)\n        partes = str words limpia\n        slug   = str join partes \"-\"\n        str pad right slug 24 \".\"\n```\n\n### Recepta 2: Composició segura i sense efectes laterals\n\nTota funció de la lib `str` és componible amb la resta de les 32 libs de `ridgun-libs`:\n\n```ridgun\nimport str\n\nfn :: extraer dominio (correo : String) => String\n      extraer dominio correo =\n        pos = str index of correo \"@\"\n        | pos < 0   = \"sin-dominio\"\n        | otherwise =\n          partes = str split correo \"@\"\n          str replace (str to lower correo) \"@\" \" en \"\n```\n\n---\n\n## 5. Sota el capó: rendiment, memòria RMM i garanties\n\n- **Garantia algorísmica i de seguretat**: Repetició en $O(\\log N)$ mitjançant duplicació de cadenes, predicats segurs davant agulles buides i zero mutació al lloc.\n- **Memòria determinista (`RMM1`/`RMM2`)**: Zero pauses de recol·lector de brossa; totes les estructures intermèdies s'alliberen de forma determinista en sortir de l'àmbit.\n- **Verificació contínua**: Provada exhaustivament amb `stable check` i la suite automatitzada `src/test/ridgun/test_str.rg`.\n"}, {"num": "02", "slug": "02-lib-math-aritmetica-i-teoria-de-nombres", "file": "02-lib-math-aritmetica-i-teoria-de-nombres.md", "title": "Capítol 02: La lib `math` — Aritmètica Segura, Teoria de Nombres i Estadística", "short_title": "La lib `math` — Aritmètica Segura, Teoria de Nombres i Estadística", "markdown": "# Capítol 02: La lib `math` — Aritmètica Segura, Teoria de Nombres i Estadística\n\n## 1. Per què existeix la lib `math`?\n\nSiguem sincers: una divisió per zero inesperada a producció o l'operador `%` retornant residus negatius en C o Java han tombat més serveis dels que ens agrada admetre.\n\nLa lib **`math`** ofereix divisions totals a prova de `d == 0` (`div ceil`, `div floor`, `div euclid`, `mod euclid`), exponenciació i invers modular en $O(\\log E)$, arrels i logaritmes enters exactes, combinatòria, primalitat i l'operador mixfix `clamp x between lo and hi`.\n\n---\n\n## 2. Artefactes, importació i arquitectura sense `libc`\n\nA `ridgun-libs`, **`math`** és una **lib** de primera classe situada a `src/main/ridgun/lib/math.rg` (domini `MATH`). En compilar amb `stable bundle`, s'empaqueta en tres formats natius:\n\n| Artefacte | Ruta | Propòsit |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/math.rglib` | Distribució i importació directa amb `import math` |\n| **Fitxer compilat** | `target/math.rgc` | Artefacte intermedi verificat per `ridgunc` |\n| **Objecte compartit ELF64** | `target/libmath.so` | Biblioteca dinàmica nativa sense dependències de C ni `libc` |\n\n> Per fer servir aquesta lib en qualsevol fitxer `.rg`, n'hi ha prou de declarar `import math` a la capçalera i cridar les seves funcions amb espais o guions baixos indistintament.\n\n---\n\n## 3. Referència ràpida de l'API de `math`\n\n| Signatura / Funció / Tipus | Què fa i quan fer-la servir |\n|---|---|\n| `math abs / math sign / math min / math max` | Magnitud absoluta, signe (`-1, 0, 1`) i extrems |\n| `clamp x between lo and hi` | Operador mixfix (`op ::`) que acota `x` al rang `[lo, hi]` |\n| `math div ceil / math div floor / math div euclid / math mod euclid` | Arrodoniment segur davant divisió per zero i residu euclidià no negatiu |\n| `math pow / math isqrt / math ilog2 / math ilog10` | Potència en $O(\\log E)$, arrel quadrada entera de Newton i logaritmes enters |\n| `math gcd / math lcm / math mod pow / math mod inv / math is prime` | MCD/MCM d'Euclides, aritmètica modular i test de primalitat $6k \\pm 1$ |\n| `math sum / math mean floor / math median floor / math variance floor` | Combinatòria (`nCr`) sense desbordament i estadística entera sobre llistes |\n\n---\n\n## 4. Receptes pràctiques en estil tabular\n\n### Recepta 1: Flux principal amb `math`\n\nObserva com els signes `=` i els passos de transformació queden alineats com una taula neta:\n\n```ridgun\nimport math\n\nfn :: verificar clave modular (base : Int) (primo : Int) => (Int, Int, Bool)\n      verificar clave modular base primo =\n        es_p = math is prime primo\n        pot  = math mod pow base (primo - 1) primo\n        inv  = math mod inv base primo\n        (pot, inv, es_p)\n```\n\n### Recepta 2: Composició segura i sense efectes laterals\n\nTota funció de la lib `math` és componible amb la resta de les 32 libs de `ridgun-libs`:\n\n```ridgun\nimport math\n\nfn :: calcular paginas y cuota (items : Int) (por_pag : Int) (uso : Int) => (Int, Int)\n      calcular paginas y cuota items por_pag uso =\n        pags  = math div ceil items por_pag\n        cuota = clamp uso between 0 and 100\n        (pags, cuota)\n```\n\n---\n\n## 5. Sota el capó: rendiment, memòria RMM i garanties\n\n- **Garantia algorísmica i de seguretat**: Funcions totals (retornen `0` quan el divisor o mòdul és `<= 0` en lloc d'avortar amb `SIGFPE`), sense coma flotant imprecisa.\n- **Memòria determinista (`RMM1`/`RMM2`)**: Zero pauses de recol·lector de brossa; totes les estructures intermèdies s'alliberen de forma determinista en sortir de l'àmbit.\n- **Verificació contínua**: Provada exhaustivament amb `stable check` i la suite automatitzada `src/test/ridgun/test_math.rg`.\n"}, {"num": "03", "slug": "03-lib-list-llistes-mergesort-i-mapes-kv", "file": "03-lib-list-llistes-mergesort-i-mapes-kv.md", "title": "Capítol 03: La lib `list` — Llistes, Mergesort $O(N \\log N)$ i Mapes Clau-Valor", "short_title": "La lib `list` — Llistes, Mergesort $O(N \\log N)$ i Mapes Clau-Valor", "markdown": "# Capítol 03: La lib `list` — Llistes, Mergesort $O(N \\log N)$ i Mapes Clau-Valor\n\n## 1. Per què existeix la lib `list`?\n\nSiguem sincers: accedir a un índex fora de rang (`IndexError` / `panic!`) o mutar una llista compartida per accident són dos dels errors més freqüents en processar col·leccions.\n\nLa lib **`list`** proporciona indexació amb valor per defecte, llescat (`take`, `drop`, `slice`), rangs amb pas, deduplicació estable, ordenació **mergesort $O(N \\log N)$** per a `[Int]` i `[String]`, i diccionaris associatius immutables `[String String]` (`kv get`, `kv put`, `kv merge`).\n\n---\n\n## 2. Artefactes, importació i arquitectura sense `libc`\n\nA `ridgun-libs`, **`list`** és una **lib** de primera classe situada a `src/main/ridgun/lib/list.rg` (domini `LIST`). En compilar amb `stable bundle`, s'empaqueta en tres formats natius:\n\n| Artefacte | Ruta | Propòsit |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/list.rglib` | Distribució i importació directa amb `import list` |\n| **Fitxer compilat** | `target/list.rgc` | Artefacte intermedi verificat per `ridgunc` |\n| **Objecte compartit ELF64** | `target/liblist.so` | Biblioteca dinàmica nativa sense dependències de C ni `libc` |\n\n> Per fer servir aquesta lib en qualsevol fitxer `.rg`, n'hi ha prou de declarar `import list` a la capçalera i cridar les seves funcions amb espais o guions baixos indistintament.\n\n---\n\n## 3. Referència ràpida de l'API de `list`\n\n| Signatura / Funció / Tipus | Què fa i quan fer-la servir |\n|---|---|\n| `list nth or / list str nth or` | Lectura segura per índex retornant `default_val` si està fora de rang |\n| `list take / list drop / list slice / list reverse` | Prefix, sufix, subrang `[start, end)` i inversió recursiva de cua |\n| `list range / list range step` | Genera seqüències aritmètiques (`step == 0` retorna `[]` de forma segura) |\n| `list sort / list str sort / list dedup / list str dedup` | Ordenació mergesort $O(N \\log N)$ estable i deduplicació per primera aparició |\n| `kv empty / kv put / kv get / kv get or / kv remove / kv merge` | Operacions sobre diccionaris associatius ordenats `[String String]` |\n\n---\n\n## 4. Receptes pràctiques en estil tabular\n\n### Recepta 1: Flux principal amb `list`\n\nObserva com els signes `=` i els passos de transformació queden alineats com una taula neta:\n\n```ridgun\nimport list\n\nfn :: top tres unicos (puntos : [Int]) => [Int]\n      top tres unicos puntos =\n        unicos    = list dedup puntos\n        ordenados = list reverse (list sort unicos)\n        list take ordenados 3\n```\n\n### Recepta 2: Composició segura i sense efectes laterals\n\nTota funció de la lib `list` és componible amb la resta de les 32 libs de `ridgun-libs`:\n\n```ridgun\nimport list\n\nfn :: configurar entorno (base : [String String]) => (String, [String])\n      configurar entorno base =\n        cfg1 = kv put base \"host\" \"0.0.0.0\"\n        cfg2 = kv put cfg1 \"port\" \"8080\"\n        host = kv get or cfg2 \"host\" \"127.0.0.1\"\n        (host, kv keys cfg2)\n```\n\n---\n\n## 5. Sota el capó: rendiment, memòria RMM i garanties\n\n- **Garantia algorísmica i de seguretat**: Ordenació determinista $O(N \\log N)$ en el pitjor cas (sense l'$O(N^2)$ patològic de Quicksort) i preservació de l'ordre d'inserció en mapes `kv`.\n- **Memòria determinista (`RMM1`/`RMM2`)**: Zero pauses de recol·lector de brossa; totes les estructures intermèdies s'alliberen de forma determinista en sortir de l'àmbit.\n- **Verificació contínua**: Provada exhaustivament amb `stable check` i la suite automatitzada `src/test/ridgun/test_list.rg`.\n"}, {"num": "04", "slug": "04-lib-btree-arbres-avl-conjunts-i-monticles", "file": "04-lib-btree-arbres-avl-conjunts-i-monticles.md", "title": "Capítol 04: La lib `btree` — Arbres AVL Persistents $O(\\log N)$, Conjunts i Monticles", "short_title": "La lib `btree` — Arbres AVL Persistents $O(\\log N)$, Conjunts i Monticles", "markdown": "# Capítol 04: La lib `btree` — Arbres AVL Persistents $O(\\log N)$, Conjunts i Monticles\n\n## 1. Per què existeix la lib `btree`?\n\nSiguem sincers: les taules hash mutables pateixen atacs de col·lisió de claus (HashDoS), no mantenen les claus ordenades per a consultes per rang i no es poden compartir entre actors sense copiar-les senceres o posar-hi un cadenat.\n\nLa lib **`btree`** implementa tres estructures de dades funcionals persistents en $O(\\log N)$ amb compartició estructural: **`BTreeMap`** (arbre AVL autobalancejat), **`BTreeSet`** (àlgebra de conjunts ordenada) i **`MinHeap`** (cua de prioritat *leftist heap*).\n\n---\n\n## 2. Artefactes, importació i arquitectura sense `libc`\n\nA `ridgun-libs`, **`btree`** és una **lib** de primera classe situada a `src/main/ridgun/lib/btree.rg` (domini `BTREE`). En compilar amb `stable bundle`, s'empaqueta en tres formats natius:\n\n| Artefacte | Ruta | Propòsit |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/btree.rglib` | Distribució i importació directa amb `import btree` |\n| **Fitxer compilat** | `target/btree.rgc` | Artefacte intermedi verificat per `ridgunc` |\n| **Objecte compartit ELF64** | `target/libbtree.so` | Biblioteca dinàmica nativa sense dependències de C ni `libc` |\n\n> Per fer servir aquesta lib en qualsevol fitxer `.rg`, n'hi ha prou de declarar `import btree` a la capçalera i cridar les seves funcions amb espais o guions baixos indistintament.\n\n---\n\n## 3. Referència ràpida de l'API de `btree`\n\n| Signatura / Funció / Tipus | Què fa i quan fer-la servir |\n|---|---|\n| `btree empty / btree insert / btree get / btree remove` | Cerca, inserció i esborrat persistent en diccionari AVL en $O(\\log N)$ |\n| `btree min key / btree max key / btree range` | Extrems ordenats i consulta per rang `[lo, hi]` |\n| `bset from list / bset union / bset intersect / bset diff` | Àlgebra de conjunts ordenats (`BTreeSet`) i predicat de subconjunt |\n| `heap empty / heap push / heap peek / heap pop / heap sort` | Cua de prioritat `MinHeap` (*leftist heap*) amb fusió en $O(\\log N)$ |\n\n---\n\n## 4. Receptes pràctiques en estil tabular\n\n### Recepta 1: Flux principal amb `btree`\n\nObserva com els signes `=` i els passos de transformació queden alineats com una taula neta:\n\n```ridgun\nimport btree\n\nfn :: consultar rango precios () => [String String]\n      consultar rango precios =\n        t0 = btree empty\n        t1 = btree insert t0 \"item:10\" \"Teclado\"\n        t2 = btree insert t1 \"item:20\" \"Monitor\"\n        t3 = btree insert t2 \"item:30\" \"Raton\"\n        btree range t3 \"item:10\" \"item:25\"\n```\n\n### Recepta 2: Composició segura i sense efectes laterals\n\nTota funció de la lib `btree` és componible amb la resta de les 32 libs de `ridgun-libs`:\n\n```ridgun\nimport btree\n\nfn :: despachar urgente () => (Int, String)\n      despachar urgente =\n        h0 = heap empty\n        h1 = heap push h0 50 \"backup-nocturno\"\n        h2 = heap push h1 10 \"alerta-seguridad\"\n        h3 = heap push h2 30 \"rotar-logs\"\n        heap peek h3\n```\n\n---\n\n## 5. Sota el capó: rendiment, memòria RMM i garanties\n\n- **Garantia algorísmica i de seguretat**: Rotacions AVL estrictes (`height diff <= 1`), immunitat total a HashDoS, consultes per rang en $O(\\log N + K)$ i fusió de monticles en $O(\\log N)$.\n- **Memòria determinista (`RMM1`/`RMM2`)**: Zero pauses de recol·lector de brossa; totes les estructures intermèdies s'alliberen de forma determinista en sortir de l'àmbit.\n- **Verificació contínua**: Provada exhaustivament amb `stable check` i la suite automatitzada `src/test/ridgun/test_btree.rg`.\n"}, {"num": "05", "slug": "05-lib-tensor-tensors-multidimensionals", "file": "05-lib-tensor-tensors-multidimensionals.md", "title": "Capítol 05: La lib `tensor` — Tensors Multidimensionals, Vistes i Contracció d'Einstein", "short_title": "La lib `tensor` — Tensors Multidimensionals, Vistes i Contracció d'Einstein", "markdown": "# Capítol 05: La lib `tensor` — Tensors Multidimensionals, Vistes i Contracció d'Einstein\n\n## 1. Per què existeix la lib `tensor`?\n\nSiguem sincers: en la majoria de llenguatges has de triar entre llistes imbricades lentíssimes plenes de punters dispersos o enllaçar una mola de C++/Fortran de 200 MB com NumPy/BLAS.\n\nLa lib **`tensor`** embolcalla la primitiva nativa `Tensor[...]` de Ridgun oferint creació tipada (`Tensor[Int]`, `Tensor[Real]`, `Tensor[U64]`), vistes sense còpia (`reshape`, `slice`), operacions element a element (Hadamard), contracció d'Einstein (`*` sobre eixos simbòlics) i aritmètica `BlaMka` de 64 bits.\n\n---\n\n## 2. Artefactes, importació i arquitectura sense `libc`\n\nA `ridgun-libs`, **`tensor`** és una **lib** de primera classe situada a `src/main/ridgun/lib/tensor.rg` (domini `TENSOR`). En compilar amb `stable bundle`, s'empaqueta en tres formats natius:\n\n| Artefacte | Ruta | Propòsit |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/tensor.rglib` | Distribució i importació directa amb `import tensor` |\n| **Fitxer compilat** | `target/tensor.rgc` | Artefacte intermedi verificat per `ridgunc` |\n| **Objecte compartit ELF64** | `target/libtensor.so` | Biblioteca dinàmica nativa sense dependències de C ni `libc` |\n\n> Per fer servir aquesta lib en qualsevol fitxer `.rg`, n'hi ha prou de declarar `import tensor` a la capçalera i cridar les seves funcions amb espais o guions baixos indistintament.\n\n---\n\n## 3. Referència ràpida de l'API de `tensor`\n\n| Signatura / Funció / Tipus | Què fa i quan fer-la servir |\n|---|---|\n| `tensor zeros int / tensor fill int / tensor zeros real` | Reserva blocs contigus 1D/2D de `Tensor[Int]` i `Tensor[Real]` |\n| `tensor get 1d / tensor set 1d / tensor get 2d / tensor set 2d` | Accés i actualització funcional Copy-on-Write (`with [i] = v`) |\n| `tensor reshape 1d to 2d / tensor slice 1d` | Vistes de descriptor en $O(1)$ sense copiar l'emmagatzematge del tensor |\n| `tensor add int / tensor mul int / tensor scale int` | Suma, multiplicació element a element (Hadamard) i escalat |\n| `tensor dot int / tensor matmul int` | Contracció d'índexs d'Einstein (`a[i] * b[i]`, `a[i, k] * b[k, j]`) |\n| `u64 blamka g / u64 rotr` | Mescla rotacional `U64` sense signe de 64 bits per a blocs criptogràfics |\n\n---\n\n## 4. Receptes pràctiques en estil tabular\n\n### Recepta 1: Flux principal amb `tensor`\n\nObserva com els signes `=` i els passos de transformació queden alineats com una taula neta:\n\n```ridgun\nimport tensor\n\nfn :: producto matricial tensor () => Tensor[Int]\n      producto matricial tensor =\n        a = tensor reshape 1d to 2d (tensor from list int [1, 2, 3, 4]) 2 2\n        b = tensor reshape 1d to 2d (tensor from list int [5, 6, 7, 8]) 2 2\n        tensor matmul int a b\n```\n\n### Recepta 2: Composició segura i sense efectes laterals\n\nTota funció de la lib `tensor` és componible amb la resta de les 32 libs de `ridgun-libs`:\n\n```ridgun\nimport tensor\n\nfn :: energia vector (xs : [Int]) => (Int, Int)\n      energia vector xs =\n        v   = tensor from list int xs\n        dot = tensor dot int v v\n        mx  = tensor max int v\n        (dot, mx)\n```\n\n---\n\n## 5. Sota el capó: rendiment, memòria RMM i garanties\n\n- **Garantia algorísmica i de seguretat**: Memòria contigua de 8 bytes per cel·la gestionada estàticament per RMM1/RMM2, vistes en $O(1)$ sense duplicar el búfer i semàntica pura Copy-on-Write.\n- **Memòria determinista (`RMM1`/`RMM2`)**: Zero pauses de recol·lector de brossa; totes les estructures intermèdies s'alliberen de forma determinista en sortir de l'àmbit.\n- **Verificació contínua**: Provada exhaustivament amb `stable check` i la suite automatitzada `src/test/ridgun/test_tensor.rg`.\n"}, {"num": "06", "slug": "06-lib-linalg-algebra-lineal-i-tensors", "file": "06-lib-linalg-algebra-lineal-i-tensors.md", "title": "Capítol 06: La lib `linalg` — Àlgebra Lineal sobre `Tensor[Real]`, Bareiss i Activacions", "short_title": "La lib `linalg` — Àlgebra Lineal sobre `Tensor[Real]`, Bareiss i Activacions", "markdown": "# Capítol 06: La lib `linalg` — Àlgebra Lineal sobre `Tensor[Real]`, Bareiss i Activacions\n\n## 1. Per què existeix la lib `linalg`?\n\nSiguem sincers: quan vols calcular similitud cosinus per a embeddings, resoldre $A x = b$ o avaluar una capa `softmax` en un binari lleuger, no vols arrossegar 400 MB de PyTorch o LAPACK.\n\nLa lib **`linalg`** construeix àlgebra lineal numèrica sobre `Tensor[Real]` natiu: transposició, traça, identitat, producte intern/extern, multiplicació matriu-vector i matriu-matriu amb notació d'Einstein, normes ($L_1, L_2, L_\\infty$, Frobenius), determinant i resolució lineal $A x = b$ mitjançant eliminació de **Bareiss/Gauss amb pivotatge parcial**, i activacions neuronals (`relu`, `sigmoid`, `softmax`).\n\n---\n\n## 2. Artefactes, importació i arquitectura sense `libc`\n\nA `ridgun-libs`, **`linalg`** és una **lib** de primera classe situada a `src/main/ridgun/lib/linalg.rg` (domini `LINALG`). En compilar amb `stable bundle`, s'empaqueta en tres formats natius:\n\n| Artefacte | Ruta | Propòsit |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/linalg.rglib` | Distribució i importació directa amb `import linalg` |\n| **Fitxer compilat** | `target/linalg.rgc` | Artefacte intermedi verificat per `ridgunc` |\n| **Objecte compartit ELF64** | `target/liblinalg.so` | Biblioteca dinàmica nativa sense dependències de C ni `libc` |\n\n> Per fer servir aquesta lib en qualsevol fitxer `.rg`, n'hi ha prou de declarar `import linalg` a la capçalera i cridar les seves funcions amb espais o guions baixos indistintament.\n\n---\n\n## 3. Referència ràpida de l'API de `linalg`\n\n| Signatura / Funció / Tipus | Què fa i quan fer-la servir |\n|---|---|\n| `linalg vec from list / linalg mat from lists` | Construeix `Tensor[Real]` 1D i 2D a partir de llistes de Ridgun |\n| `linalg transpose / linalg trace / linalg diag / linalg identity` | Transformacions estructurals de matrius i matriu identitat |\n| `linalg dot / linalg outer / linalg matvec / linalg matmul` | Einstein contraction (`a[i] * b[i]`, `a[i, k] * b[k, j]`) |\n| `linalg norm l1 / linalg norm l2 / linalg cosine similarity` | Normes vectorials/matricials, normalització i similitud cosinus |\n| `linalg det / linalg solve` | Determinant exacte de Bareiss i resolució $A x = b$ amb pivotatge parcial (`Option[Tensor[Real]]`) |\n| `linalg relu / linalg sigmoid / linalg softmax` | Activacions neuronals numèricament estables amb desplaçament pel màxim |\n\n---\n\n## 4. Receptes pràctiques en estil tabular\n\n### Recepta 1: Flux principal amb `linalg`\n\nObserva com els signes `=` i els passos de transformació queden alineats com una taula neta:\n\n```ridgun\nimport linalg\n\nfn :: resolver sistema lineal () => Option[Tensor[Real]]\n      resolver sistema lineal =\n        -- Resuelve 2x + y = 5, x + 3y = 10 -> x = 1.0, y = 3.0\n        a = linalg mat from lists [[2.0, 1.0], [1.0, 3.0]]\n        b = linalg vec from list [5.0, 10.0]\n        linalg solve a b\n```\n\n### Recepta 2: Composició segura i sense efectes laterals\n\nTota funció de la lib `linalg` és componible amb la resta de les 32 libs de `ridgun-libs`:\n\n```ridgun\nimport linalg\n\nfn :: puntuar embeddings () => (Real, Tensor[Real])\n      puntuar embeddings =\n        q     = linalg vec from list [1.0, 2.0, 3.0]\n        d     = linalg vec from list [1.0, 2.0, 3.0]\n        sim   = linalg cosine similarity q d\n        probs = linalg softmax q\n        (sim, probs)\n```\n\n---\n\n## 5. Sota el capó: rendiment, memòria RMM i garanties\n\n- **Garantia algorísmica i de seguretat**: Les matrius singulars retornen `None` netament a `linalg solve` (sense `NaN` silenciosos), i `linalg softmax` resta el màxim abans d'exponenciar per evitar desbordaments.\n- **Memòria determinista (`RMM1`/`RMM2`)**: Zero pauses de recol·lector de brossa; totes les estructures intermèdies s'alliberen de forma determinista en sortir de l'àmbit.\n- **Verificació contínua**: Provada exhaustivament amb `stable check` i la suite automatitzada `src/test/ridgun/test_linalg.rg`.\n"}, {"num": "07", "slug": "07-lib-codec-hex-base64-i-url", "file": "07-lib-codec-hex-base64-i-url.md", "title": "Capítol 07: La lib `codec` — Hex, Base64, Base64url, URL Percent-Encoding i JSON Lleuger", "short_title": "La lib `codec` — Hex, Base64, Base64url, URL Percent-Encoding i JSON Lleuger", "markdown": "# Capítol 07: La lib `codec` — Hex, Base64, Base64url, URL Percent-Encoding i JSON Lleuger\n\n## 1. Per què existeix la lib `codec`?\n\nSiguem sincers: res no trenca més ràpid una integració web que confondre Base64 estàndard (`+/=`) amb Base64url (`-_` sense farciment) en un token JWT, o construir una query string concatenant cadenes sense escapar.\n\nLa lib **`codec`** implementa els estàndards **RFC 4648** (Hex, Base64 i Base64url), **RFC 3986** (codificació percentual d'URLs i diccionaris `query encode` / `query decode`) i constructors/extractors ràpids de **JSON lleuger (RFC 8259)**.\n\n---\n\n## 2. Artefactes, importació i arquitectura sense `libc`\n\nA `ridgun-libs`, **`codec`** és una **lib** de primera classe situada a `src/main/ridgun/lib/codec.rg` (domini `CODEC`). En compilar amb `stable bundle`, s'empaqueta en tres formats natius:\n\n| Artefacte | Ruta | Propòsit |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/codec.rglib` | Distribució i importació directa amb `import codec` |\n| **Fitxer compilat** | `target/codec.rgc` | Artefacte intermedi verificat per `ridgunc` |\n| **Objecte compartit ELF64** | `target/libcodec.so` | Biblioteca dinàmica nativa sense dependències de C ni `libc` |\n\n> Per fer servir aquesta lib en qualsevol fitxer `.rg`, n'hi ha prou de declarar `import codec` a la capçalera i cridar les seves funcions amb espais o guions baixos indistintament.\n\n---\n\n## 3. Referència ràpida de l'API de `codec`\n\n| Signatura / Funció / Tipus | Què fa i quan fer-la servir |\n|---|---|\n| `hex encode / hex decode / hex is valid` | Codificació hexadecimal RFC 4648 en minúscules i descodificació validada |\n| `base64 encode / base64 decode` | Base64 estàndard RFC 4648 §4 amb farciment `=` |\n| `base64url encode / base64url decode` | Base64url segur per a URLs RFC 4648 §5 (`-`, `_`, sense farciment) |\n| `url encode / url decode / query encode / query decode` | Codificació percentual RFC 3986 i diccionaris de query string `k=v&...` |\n| `json quote / json object / json get str / json get int` | Serialització JSON ràpida sense AST i extracció de claus de primer nivell |\n\n---\n\n## 4. Receptes pràctiques en estil tabular\n\n### Recepta 1: Flux principal amb `codec`\n\nObserva com els signes `=` i els passos de transformació queden alineats com una taula neta:\n\n```ridgun\nimport codec\n\nfn :: empaquetar parametros (usuario : String) (redir : String) => String\n      empaquetar parametros usuario redir =\n        token_b64 = base64url encode usuario\n        query encode [(\"token\", token_b64), (\"next\", redir)]\n```\n\n### Recepta 2: Composició segura i sense efectes laterals\n\nTota funció de la lib `codec` és componible amb la resta de les 32 libs de `ridgun-libs`:\n\n```ridgun\nimport codec\n\nfn :: construir respuesta rapida (id : Int) (nombre : String) => (String, Int)\n      construir respuesta rapida id nombre =\n        doc = json object [(\"id\", json int id), (\"name\", json quote nombre), (\"ok\", json bool True)]\n        leido = json get int doc \"id\" 0\n        (doc, leido)\n```\n\n---\n\n## 5. Sota el capó: rendiment, memòria RMM i garanties\n\n- **Garantia algorísmica i de seguretat**: Rebuig determinista d'entrades hexadecimals o Base64 mal formades (retornant `\"\"` sense lectures fora de límits) i reversibilitat exacta $decode(encode(x)) == x$.\n- **Memòria determinista (`RMM1`/`RMM2`)**: Zero pauses de recol·lector de brossa; totes les estructures intermèdies s'alliberen de forma determinista en sortir de l'àmbit.\n- **Verificació contínua**: Provada exhaustivament amb `stable check` i la suite automatitzada `src/test/ridgun/test_codec.rg`.\n"}, {"num": "08", "slug": "08-lib-json-parser-ast-i-consultes", "file": "08-lib-json-parser-ast-i-consultes.md", "title": "Capítol 08: La lib `json` — Arbre AST Recursiu RFC 8259, Pretty-Printer i Consultes per Ruta", "short_title": "La lib `json` — Arbre AST Recursiu RFC 8259, Pretty-Printer i Consultes per Ruta", "markdown": "# Capítol 08: La lib `json` — Arbre AST Recursiu RFC 8259, Pretty-Printer i Consultes per Ruta\n\n## 1. Per què existeix la lib `json`?\n\nSiguem sincers: navegar un JSON imbricat en molts llenguatges estàtics implica escriure tres pantalles de boilerplate o encadenar deu `.and_then()` abans de llegir un simple port.\n\nLa lib **`json`** proporciona un analitzador descendent recursiu complet per a **RFC 8259** sobre l'ADT algebraic `JsonVal` (`JnNull`, `JnBool`, `JnInt`, `JnStr`, `JnArr`, `JnObj`, `JnErr`), serialització compacta i sagnada (`json pretty`) i consultes directes per ruta amb punts (`\"server.http.port\"`, `\"users.0.name\"`).\n\n---\n\n## 2. Artefactes, importació i arquitectura sense `libc`\n\nA `ridgun-libs`, **`json`** és una **lib** de primera classe situada a `src/main/ridgun/lib/json.rg` (domini `JSON`). En compilar amb `stable bundle`, s'empaqueta en tres formats natius:\n\n| Artefacte | Ruta | Propòsit |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/json.rglib` | Distribució i importació directa amb `import json` |\n| **Fitxer compilat** | `target/json.rgc` | Artefacte intermedi verificat per `ridgunc` |\n| **Objecte compartit ELF64** | `target/libjson.so` | Biblioteca dinàmica nativa sense dependències de C ni `libc` |\n\n> Per fer servir aquesta lib en qualsevol fitxer `.rg`, n'hi ha prou de declarar `import json` a la capçalera i cridar les seves funcions amb espais o guions baixos indistintament.\n\n---\n\n## 3. Referència ràpida de l'API de `json`\n\n| Signatura / Funció / Tipus | Què fa i quan fer-la servir |\n|---|---|\n| `type JsonVal` | `JnNull | JnBool Bool | JnInt Int | JnStr String | JnArr [JsonVal] | JnObj [String JsonVal] | JnErr String` |\n| `json parse / json is ok` | Analitza text JSON en un arbre `JsonVal` i valida l'absència de `JnErr` |\n| `json stringify / json pretty` | Serialitza `JsonVal` a JSON compacte o multilínia sagnat |\n| `json get path / json get str / json get int / json get bool` | Recorre objectes i llistes imbricats mitjançant rutes amb punts (`\"a.b.0.c\"`) |\n\n---\n\n## 4. Receptes pràctiques en estil tabular\n\n### Recepta 1: Flux principal amb `json`\n\nObserva com els signes `=` i els passos de transformació queden alineats com una taula neta:\n\n```ridgun\nimport json\n\nfn :: leer config servidor (raw : String) => (String, Int, Bool)\n      leer config servidor raw =\n        doc  = json parse raw\n        host = json get str doc \"server.host\" \"127.0.0.1\"\n        port = json get int doc \"server.port\" 8080\n        tls  = json get bool doc \"server.tls.enabled\" False\n        (host, port, tls)\n```\n\n### Recepta 2: Composició segura i sense efectes laterals\n\nTota funció de la lib `json` és componible amb la resta de les 32 libs de `ridgun-libs`:\n\n```ridgun\nimport json\n\nfn :: construir manifiesto () => String\n      construir manifiesto =\n        nodo = JnObj [(\"app\", JnStr \"solstice\"), (\"workers\", JnInt 8), (\"tags\", JnArr [JnStr \"elf64\", JnStr \"rmm2\"])]\n        json pretty nodo 2\n```\n\n---\n\n## 5. Sota el capó: rendiment, memòria RMM i garanties\n\n- **Garantia algorísmica i de seguretat**: Rebuig estricte de brossa sobrant després del valor arrel (`trailing garbage`), maneig complet d'escapaments i retorn segur de `JnErr` sense excepcions.\n- **Memòria determinista (`RMM1`/`RMM2`)**: Zero pauses de recol·lector de brossa; totes les estructures intermèdies s'alliberen de forma determinista en sortir de l'àmbit.\n- **Verificació contínua**: Provada exhaustivament amb `stable check` i la suite automatitzada `src/test/ridgun/test_json.rg`.\n"}, {"num": "09", "slug": "09-lib-csv-parser-rfc4180-i-taules", "file": "09-lib-csv-parser-rfc4180-i-taules.md", "title": "Capítol 09: La lib `csv` — Analitzador d'Estats RFC 4180 per a CSV/TSV i Taules Indexades", "short_title": "La lib `csv` — Analitzador d'Estats RFC 4180 per a CSV/TSV i Taules Indexades", "markdown": "# Capítol 09: La lib `csv` — Analitzador d'Estats RFC 4180 per a CSV/TSV i Taules Indexades\n\n## 1. Per què existeix la lib `csv`?\n\nSiguem sincers: tothom es pensa que analitzar un CSV és fer `str split linia \",\"`... fins que apareix un camp entre cometes amb una coma a dins, cometes escapades `\"\"` o un salt de línia `\\r\\n` al mig d'una cel·la.\n\nLa lib **`csv`** implementa una màquina d'estats completa conforme a **RFC 4180** per a CSV i TSV, serialització automàtica amb cometes intel·ligents i el tipus `CsvTable` per consultar columnes i files per nom de capçalera.\n\n---\n\n## 2. Artefactes, importació i arquitectura sense `libc`\n\nA `ridgun-libs`, **`csv`** és una **lib** de primera classe situada a `src/main/ridgun/lib/csv.rg` (domini `CSV`). En compilar amb `stable bundle`, s'empaqueta en tres formats natius:\n\n| Artefacte | Ruta | Propòsit |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/csv.rglib` | Distribució i importació directa amb `import csv` |\n| **Fitxer compilat** | `target/csv.rgc` | Artefacte intermedi verificat per `ridgunc` |\n| **Objecte compartit ELF64** | `target/libcsv.so` | Biblioteca dinàmica nativa sense dependències de C ni `libc` |\n\n> Per fer servir aquesta lib en qualsevol fitxer `.rg`, n'hi ha prou de declarar `import csv` a la capçalera i cridar les seves funcions amb espais o guions baixos indistintament.\n\n---\n\n## 3. Referència ràpida de l'API de `csv`\n\n| Signatura / Funció / Tipus | Què fa i quan fer-la servir |\n|---|---|\n| `csv parse / tsv parse / csv parse with` | Analitza text CSV/TSV (incloent-hi cel·les multilínia i escapaments `\"\"`) en `[[String]]` |\n| `csv stringify / tsv stringify` | Serialitza `[[String]]` posant cometes només a cel·les amb delimitadors, cometes o salts |\n| `csv parse table / csv get cell / csv col` | Consulta sobre `CsvTable` indexada per capçalera `(fila, nom_col)` o columna completa |\n| `csv row to kv / csv table to kv list` | Converteix files tabulars en diccionaris `[String String]` indexats per capçalera |\n\n---\n\n## 4. Receptes pràctiques en estil tabular\n\n### Recepta 1: Flux principal amb `csv`\n\nObserva com els signes `=` i els passos de transformació queden alineats com una taula neta:\n\n```ridgun\nimport csv\n\nfn :: extraer columna precios (raw_csv : String) => ([String], String)\n      extraer columna precios raw_csv =\n        tabla   = csv parse table raw_csv\n        precios = csv col tabla \"precio\"\n        primero = csv get cell tabla 0 \"producto\" \"desconocido\"\n        (precios, primero)\n```\n\n### Recepta 2: Composició segura i sense efectes laterals\n\nTota funció de la lib `csv` és componible amb la resta de les 32 libs de `ridgun-libs`:\n\n```ridgun\nimport csv\n\nfn :: exportar informe () => String\n      exportar informe =\n        filas = [[\"id\", \"nota\"], [\"1\", \"Contiene, coma\"], [\"2\", \"Dijo \"hola\"\"]]\n        csv stringify filas\n```\n\n---\n\n## 5. Sota el capó: rendiment, memòria RMM i garanties\n\n- **Garantia algorísmica i de seguretat**: Suport exacte de salts `\\r\\n` i `\\n` tant fora com dins de cometes, i zero pèrdua de dades en viatges d'anada i tornada `csv parse (csv stringify files)`.\n- **Memòria determinista (`RMM1`/`RMM2`)**: Zero pauses de recol·lector de brossa; totes les estructures intermèdies s'alliberen de forma determinista en sortir de l'àmbit.\n- **Verificació contínua**: Provada exhaustivament amb `stable check` i la suite automatitzada `src/test/ridgun/test_csv.rg`.\n"}, {"num": "10", "slug": "10-lib-ini-configuracio-ini-i-dotenv", "file": "10-lib-ini-configuracio-ini-i-dotenv.md", "title": "Capítol 10: La lib `ini` — Fitxers `.ini` per Seccions, `.env` i Interpolació de Variables", "short_title": "La lib `ini` — Fitxers `.ini` per Seccions, `.env` i Interpolació de Variables", "markdown": "# Capítol 10: La lib `ini` — Fitxers `.ini` per Seccions, `.env` i Interpolació de Variables\n\n## 1. Per què existeix la lib `ini`?\n\nSiguem sincers: els fitxers `.env` i `.ini` semblen trivials fins que algú hi afegeix `export KEY=\"valor # amb coixinet\"`, comentaris `;` al final de la línia o referències creuades entre variables.\n\nLa lib **`ini`** analitza configuracions `.ini` amb seccions (`[database]`) i fitxers `.env` amb prefixos `export`, preservant símbols `#` i `;` dins de cometes i resolent interpolacions de variables a `dotenv parse`.\n\n---\n\n## 2. Artefactes, importació i arquitectura sense `libc`\n\nA `ridgun-libs`, **`ini`** és una **lib** de primera classe situada a `src/main/ridgun/lib/ini.rg` (domini `INI`). En compilar amb `stable bundle`, s'empaqueta en tres formats natius:\n\n| Artefacte | Ruta | Propòsit |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/ini.rglib` | Distribució i importació directa amb `import ini` |\n| **Fitxer compilat** | `target/ini.rgc` | Artefacte intermedi verificat per `ridgunc` |\n| **Objecte compartit ELF64** | `target/libini.so` | Biblioteca dinàmica nativa sense dependències de C ni `libc` |\n\n> Per fer servir aquesta lib en qualsevol fitxer `.rg`, n'hi ha prou de declarar `import ini` a la capçalera i cridar les seves funcions amb espais o guions baixos indistintament.\n\n---\n\n## 3. Referència ràpida de l'API de `ini`\n\n| Signatura / Funció / Tipus | Què fa i quan fer-la servir |\n|---|---|\n| `ini parse / ini stringify` | Analitza text `.ini` per seccions en `IniDoc` i el serialitza de tornada |\n| `ini get / ini get int / ini get bool / ini set` | Consultes tipades per secció+clau (`\"\"` per a secció global) i actualització immutable |\n| `ini sections / ini section map` | Llista els noms de secció o extreu el mapa `[String String]` d'una secció |\n| `dotenv parse` | Analitza fitxers `.env` (`export K=V`, cometes, comentaris i expansió de variables) |\n\n---\n\n## 4. Receptes pràctiques en estil tabular\n\n### Recepta 1: Flux principal amb `ini`\n\nObserva com els signes `=` i els passos de transformació queden alineats com una taula neta:\n\n```ridgun\nimport ini\n\nfn :: cargar base de datos (texto_ini : String) => (String, Int, Bool)\n      cargar base de datos texto_ini =\n        doc  = ini parse texto_ini\n        host = ini get doc \"database\" \"host\" \"localhost\"\n        port = ini get int doc \"database\" \"port\" 5432\n        pool = ini get bool doc \"database\" \"pool\" True\n        (host, port, pool)\n```\n\n### Recepta 2: Composició segura i sense efectes laterals\n\nTota funció de la lib `ini` és componible amb la resta de les 32 libs de `ridgun-libs`:\n\n```ridgun\nimport ini\n\nfn :: actualizar puerto (doc : IniDoc) (nuevo : String) => String\n      actualizar puerto doc nuevo =\n        doc2 = ini set doc \"database\" \"port\" nuevo\n        ini stringify doc2\n```\n\n---\n\n## 5. Sota el capó: rendiment, memòria RMM i garanties\n\n- **Garantia algorísmica i de seguretat**: Respecte total pels caràcters `#` i `;` quan apareixen entre cometes simples o dobles, i conversió booleana flexible (`true/1/yes/on` vs `false/0/no/off`).\n- **Memòria determinista (`RMM1`/`RMM2`)**: Zero pauses de recol·lector de brossa; totes les estructures intermèdies s'alliberen de forma determinista en sortir de l'àmbit.\n- **Verificació contínua**: Provada exhaustivament amb `stable check` i la suite automatitzada `src/test/ridgun/test_ini.rg`.\n"}, {"num": "11", "slug": "11-lib-regex-motor-thompson-nfa-lineal", "file": "11-lib-regex-motor-thompson-nfa-lineal.md", "title": "Capítol 11: La lib `regex` — Motor d'Expressions Regulars Thompson NFA en Temps Lineal $O(N \\cdot M)$", "short_title": "La lib `regex` — Motor d'Expressions Regulars Thompson NFA en Temps Lineal $O(N \\cdot M)$", "markdown": "# Capítol 11: La lib `regex` — Motor d'Expressions Regulars Thompson NFA en Temps Lineal $O(N \\cdot M)$\n\n## 1. Per què existeix la lib `regex`?\n\nSiguem sincers: els motors d'expressions regulars amb *backtracking* han causat caigudes globals famoses (com a Cloudflare o StackOverflow) quan un patró com `(a+)+b` rep trenta `a` seguides i entra en temps exponencial $O(2^N)$.\n\nLa lib **`regex`** compila les teves expressions regulars (`.`, `*`, `+`, `?`, `|`, `()`, `[a-z]`, `[^...]`, `^`, `$`, `\\d`, `\\w`, `\\s`) a un **autòmat finit no determinista de Thompson (NFA)** i avança el conjunt d'estats pas a pas en temps estrictament lineal **$O(N \\cdot M)$**, fent que els atacs **ReDoS siguin matemàticament impossibles**.\n\n---\n\n## 2. Artefactes, importació i arquitectura sense `libc`\n\nA `ridgun-libs`, **`regex`** és una **lib** de primera classe situada a `src/main/ridgun/lib/regex.rg` (domini `REGEX`). En compilar amb `stable bundle`, s'empaqueta en tres formats natius:\n\n| Artefacte | Ruta | Propòsit |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/regex.rglib` | Distribució i importació directa amb `import regex` |\n| **Fitxer compilat** | `target/regex.rgc` | Artefacte intermedi verificat per `ridgunc` |\n| **Objecte compartit ELF64** | `target/libregex.so` | Biblioteca dinàmica nativa sense dependències de C ni `libc` |\n\n> Per fer servir aquesta lib en qualsevol fitxer `.rg`, n'hi ha prou de declarar `import regex` a la capçalera i cridar les seves funcions amb espais o guions baixos indistintament.\n\n---\n\n## 3. Referència ràpida de l'API de `regex`\n\n| Signatura / Funció / Tipus | Què fa i quan fer-la servir |\n|---|---|\n| `regex match / regex is match` | Coincidència de cadena completa i cerca de subcadena en temps lineal $O(N \\cdot M)$ |\n| `regex find / regex find all` | Extreu la primera o totes les subcadenes coincidents sense solapament |\n| `regex replace / regex replace all` | Reemplaça la primera o totes les coincidències de l'expressió regular |\n| `regex split / regex escape` | Divideix text segons un delimitador regex i escapa metacaràcters |\n\n---\n\n## 4. Receptes pràctiques en estil tabular\n\n### Recepta 1: Flux principal amb `regex`\n\nObserva com els signes `=` i els passos de transformació queden alineats com una taula neta:\n\n```ridgun\nimport regex\n\nfn :: extraer codigos postales (texto : String) => [String]\n      extraer codigos postales texto =\n        regex find all \"\\\\d+\" texto\n```\n\n### Recepta 2: Composició segura i sense efectes laterals\n\nTota funció de la lib `regex` és componible amb la resta de les 32 libs de `ridgun-libs`:\n\n```ridgun\nimport regex\n\nfn :: censurar telefonos (comentario : String) => (Bool, String)\n      censurar telefonos comentario =\n        tiene = regex is match \"\\\\d+-\\\\d+\" comentario\n        limpio = regex replace all \"\\\\d+-\\\\d+\" comentario \"[TELEFONO]\"\n        (tiene, limpio)\n```\n\n---\n\n## 5. Sota el capó: rendiment, memòria RMM i garanties\n\n- **Garantia algorísmica i de seguretat**: Simulació de conjunt d'estats NFA sense recursió descontrolada de pila i temps $O(N \\cdot M)$ garantit fins i tot davant patrons patològics `(a+)+b`.\n- **Memòria determinista (`RMM1`/`RMM2`)**: Zero pauses de recol·lector de brossa; totes les estructures intermèdies s'alliberen de forma determinista en sortir de l'àmbit.\n- **Verificació contínua**: Provada exhaustivament amb `stable check` i la suite automatitzada `src/test/ridgun/test_regex.rg`.\n"}, {"num": "12", "slug": "12-lib-glob-comodins-i-filtratge", "file": "12-lib-glob-comodins-i-filtratge.md", "title": "Capítol 12: La lib `glob` — Patrons de Comodins (`*`, `?`, `[a-z]`) i Filtratge de Llistes", "short_title": "La lib `glob` — Patrons de Comodins (`*`, `?`, `[a-z]`) i Filtratge de Llistes", "markdown": "# Capítol 12: La lib `glob` — Patrons de Comodins (`*`, `?`, `[a-z]`) i Filtratge de Llistes\n\n## 1. Per què existeix la lib `glob`?\n\nSiguem sincers: fer servir una expressió regular completa només per comprovar si un fitxer acaba en `*.rg` o comença per `test_[0-9]*.rg` és matar mosques a canonades.\n\nLa lib **`glob`** implementa coincidència exacta de comodins de shell (`*`, `?`, classes `[a-z]`, classes negades `[!0-9]` / `[^a-z]`), variants insensibles a majúscules (`glob match ci`) i filtratge directe de llistes de rutes o noms.\n\n---\n\n## 2. Artefactes, importació i arquitectura sense `libc`\n\nA `ridgun-libs`, **`glob`** és una **lib** de primera classe situada a `src/main/ridgun/lib/glob.rg` (domini `GLOB`). En compilar amb `stable bundle`, s'empaqueta en tres formats natius:\n\n| Artefacte | Ruta | Propòsit |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/glob.rglib` | Distribució i importació directa amb `import glob` |\n| **Fitxer compilat** | `target/glob.rgc` | Artefacte intermedi verificat per `ridgunc` |\n| **Objecte compartit ELF64** | `target/libglob.so` | Biblioteca dinàmica nativa sense dependències de C ni `libc` |\n\n> Per fer servir aquesta lib en qualsevol fitxer `.rg`, n'hi ha prou de declarar `import glob` a la capçalera i cridar les seves funcions amb espais o guions baixos indistintament.\n\n---\n\n## 3. Referència ràpida de l'API de `glob`\n\n| Signatura / Funció / Tipus | Què fa i quan fer-la servir |\n|---|---|\n| `glob match / glob match ci` | Coincidència de patrons glob sensible i insensible a majúscules ASCII |\n| `glob filter / glob any match` | Filtra `[String]` segons un patró o comprova si coincideix algun patró d'una llista |\n| `glob has magic` | Detecta si una cadena conté metacaràcters de comodí (`*`, `?`, `[`) |\n\n---\n\n## 4. Receptes pràctiques en estil tabular\n\n### Recepta 1: Flux principal amb `glob`\n\nObserva com els signes `=` i els passos de transformació queden alineats com una taula neta:\n\n```ridgun\nimport glob\n\nfn :: seleccionar fuentes ridgun (archivos : [String]) => [String]\n      seleccionar fuentes ridgun archivos =\n        glob filter \"test_[a-z]*.rg\" archivos\n```\n\n### Recepta 2: Composició segura i sense efectes laterals\n\nTota funció de la lib `glob` és componible amb la resta de les 32 libs de `ridgun-libs`:\n\n```ridgun\nimport glob\n\nfn :: es ruta excluida (ruta : String) => Bool\n      es ruta excluida ruta =\n        glob any match [\"*.tmp\", \"*.bak\", \"target/*\"] ruta\n```\n\n---\n\n## 5. Sota el capó: rendiment, memòria RMM i garanties\n\n- **Garantia algorísmica i de seguretat**: Col·lapse automàtic d'estrelles consecutives (`***` $\\rightarrow$ `*`) per evitar retrocessos redundants i maneig segur de claudàtors sense tancar `[`.\n- **Memòria determinista (`RMM1`/`RMM2`)**: Zero pauses de recol·lector de brossa; totes les estructures intermèdies s'alliberen de forma determinista en sortir de l'àmbit.\n- **Verificació contínua**: Provada exhaustivament amb `stable check` i la suite automatitzada `src/test/ridgun/test_glob.rg`.\n"}, {"num": "13", "slug": "13-lib-diff-comparacio-lcs-i-pedacos", "file": "13-lib-diff-comparacio-lcs-i-pedacos.md", "title": "Capítol 13: La lib `diff` — Algorisme LCS, Distància d'Edició, Unified Diff i Pedaços", "short_title": "La lib `diff` — Algorisme LCS, Distància d'Edició, Unified Diff i Pedaços", "markdown": "# Capítol 13: La lib `diff` — Algorisme LCS, Distància d'Edició, Unified Diff i Pedaços\n\n## 1. Per què existeix la lib `diff`?\n\nSiguem sincers: quan un test falla o un fitxer de configuració canvia, un sec `\"expected A, got B\"` de 200 línies t'obliga a deixar-te les pestanyes buscant quina línia exacta ha canviat.\n\nLa lib **`diff`** calcula la **Subseqüència Comuna Més Llarga (LCS)** sobre `Tensor[Int]` 2D per produir edicions mínimes (`DiffKeep`, `DiffAdd`, `DiffDel`), distància d'edició, estadístiques, format **Unified Diff** (`---`/`+++`/`@@`) i reconstrucció exacta amb `diff apply`.\n\n---\n\n## 2. Artefactes, importació i arquitectura sense `libc`\n\nA `ridgun-libs`, **`diff`** és una **lib** de primera classe situada a `src/main/ridgun/lib/diff.rg` (domini `DIFF`). En compilar amb `stable bundle`, s'empaqueta en tres formats natius:\n\n| Artefacte | Ruta | Propòsit |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/diff.rglib` | Distribució i importació directa amb `import diff` |\n| **Fitxer compilat** | `target/diff.rgc` | Artefacte intermedi verificat per `ridgunc` |\n| **Objecte compartit ELF64** | `target/libdiff.so` | Biblioteca dinàmica nativa sense dependències de C ni `libc` |\n\n> Per fer servir aquesta lib en qualsevol fitxer `.rg`, n'hi ha prou de declarar `import diff` a la capçalera i cridar les seves funcions amb espais o guions baixos indistintament.\n\n---\n\n## 3. Referència ràpida de l'API de `diff`\n\n| Signatura / Funció / Tipus | Què fa i quan fer-la servir |\n|---|---|\n| `type DiffOp` | `DiffKeep String | DiffDel String | DiffAdd String` |\n| `diff lines / diff text` | Calcula el guió mínim d'edició LCS entre llistes `[String]` o textos multilínia |\n| `diff edit distance / diff stats` | Distància mínima d'inserció+esborrat i recompte `(kept, added, deleted)` |\n| `diff format / diff unified` | Formata línies compactes `+ / - /  ` o Unified Diff estàndard amb capçaleres |\n| `diff apply / diff apply text` | Reconstrueix el document destí sense pèrdues a partir del guió d'edició |\n\n---\n\n## 4. Receptes pràctiques en estil tabular\n\n### Recepta 1: Flux principal amb `diff`\n\nObserva com els signes `=` i els passos de transformació queden alineats com una taula neta:\n\n```ridgun\nimport diff\n\nfn :: auditar cambio (antes : String) (despues : String) => (Int, String)\n      auditar cambio antes despues =\n        dist   = diff edit distance ( [\"host=localhost\", \"port=8080\"] ) ( [\"host=0.0.0.0\", \"port=8080\"] )\n        parche = diff unified \"config.old\" \"config.new\" antes despues\n        (dist, parche)\n```\n\n### Recepta 2: Composició segura i sense efectes laterals\n\nTota funció de la lib `diff` és componible amb la resta de les 32 libs de `ridgun-libs`:\n\n```ridgun\nimport diff\n\nfn :: verificar parche (orig : [String]) (nuevo : [String]) => [String]\n      verificar parche orig nuevo =\n        ops = diff lines orig nuevo\n        diff apply ops\n```\n\n---\n\n## 5. Sota el capó: rendiment, memòria RMM i garanties\n\n- **Garantia algorísmica i de seguretat**: Identitat matemàtica garantida $diff\\_edit\\_distance(a, b) == |a| + |b| - 2 \\cdot LCS(a, b)$ i reconstrucció sense pèrdues `diff apply (diff lines a b) == b`.\n- **Memòria determinista (`RMM1`/`RMM2`)**: Zero pauses de recol·lector de brossa; totes les estructures intermèdies s'alliberen de forma determinista en sortir de l'àmbit.\n- **Verificació contínua**: Provada exhaustivament amb `stable check` i la suite automatitzada `src/test/ridgun/test_diff.rg`.\n"}, {"num": "14", "slug": "14-lib-template-plantilles-mustache-segures", "file": "14-lib-template-plantilles-mustache-segures.md", "title": "Capítol 14: La lib `template` — Plantilles Mustache Segures amb Auto-Escapament HTML i LaTeX", "short_title": "La lib `template` — Plantilles Mustache Segures amb Auto-Escapament HTML i LaTeX", "markdown": "# Capítol 14: La lib `template` — Plantilles Mustache Segures amb Auto-Escapament HTML i LaTeX\n\n## 1. Per què existeix la lib `template`?\n\nSiguem sincers: muntar pàgines HTML o informes LaTeX concatenant cadenes a mà és la recepta perfecta per a una vulnerabilitat XSS (`<script>`) o perquè un simple símbol `%` o `_` trenqui la compilació del teu PDF.\n\nLa lib **`template`** ofereix un motor **Mustache** sense lògica arbitrària amb auto-escapament contextual (`TmplPlain`, `TmplHtml`, `TmplLatex`), substitució crua explícita (`{{{raw}}}` / `{{&raw}}`), comentaris (`{{! ... }}`), seccions condicionals (`{{#sec}}...{{/sec}}`) i invertides (`{{^sec}}...{{/sec}}`).\n\n---\n\n## 2. Artefactes, importació i arquitectura sense `libc`\n\nA `ridgun-libs`, **`template`** és una **lib** de primera classe situada a `src/main/ridgun/lib/template.rg` (domini `TMPL`). En compilar amb `stable bundle`, s'empaqueta en tres formats natius:\n\n| Artefacte | Ruta | Propòsit |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/template.rglib` | Distribució i importació directa amb `import template` |\n| **Fitxer compilat** | `target/template.rgc` | Artefacte intermedi verificat per `ridgunc` |\n| **Objecte compartit ELF64** | `target/libtemplate.so` | Biblioteca dinàmica nativa sense dependències de C ni `libc` |\n\n> Per fer servir aquesta lib en qualsevol fitxer `.rg`, n'hi ha prou de declarar `import template` a la capçalera i cridar les seves funcions amb espais o guions baixos indistintament.\n\n---\n\n## 3. Referència ràpida de l'API de `template`\n\n| Signatura / Funció / Tipus | Què fa i quan fer-la servir |\n|---|---|\n| `tmpl render / tmpl render html / tmpl render latex` | Renderitza plantilles Mustache amb auto-escapament pla, HTML o LaTeX |\n| `tmpl escape html / tmpl escape latex` | Escapa `& < > \" '` per a HTML o `\\ { } & % $ # _ ~ ^` per a LaTeX |\n| `tmpl extract vars / tmpl has unclosed tags` | Extreu els noms de variables requerits i valida que les etiquetes estiguin tancades |\n\n---\n\n## 4. Receptes pràctiques en estil tabular\n\n### Recepta 1: Flux principal amb `template`\n\nObserva com els signes `=` i els passos de transformació queden alineats com una taula neta:\n\n```ridgun\nimport template\n\nfn :: renderizar perfil html (usuario : String) (es_admin : String) => String\n      renderizar perfil html usuario es_admin =\n        plantilla = \"<h1>Hola {{user}}</h1>{{#admin}}<span class='badge'>Admin</span>{{/admin}}\"\n        vars      = [(\"user\", usuario), (\"admin\", es_admin)]\n        tmpl render html plantilla vars\n```\n\n### Recepta 2: Composició segura i sense efectes laterals\n\nTota funció de la lib `template` és componible amb la resta de les 32 libs de `ridgun-libs`:\n\n```ridgun\nimport template\n\nfn :: generar linea latex (metrica : String) => String\n      generar linea latex metrica =\n        -- Escapa automaticamente % _ & # para que LaTeX no falle\n        tmpl render latex \"Resultado: {{val}}\" [(\"val\", metrica)]\n```\n\n---\n\n## 5. Sota el capó: rendiment, memòria RMM i garanties\n\n- **Garantia algorísmica i de seguretat**: Prevenció d'XSS per defecte a `tmpl render html` (escapant `&`, `<`, `>`, `\"`, `'`) mentre `{{{var}}}` permet injectar fragments de confiança de forma explícita.\n- **Memòria determinista (`RMM1`/`RMM2`)**: Zero pauses de recol·lector de brossa; totes les estructures intermèdies s'alliberen de forma determinista en sortir de l'àmbit.\n- **Verificació contínua**: Provada exhaustivament amb `stable check` i la suite automatitzada `src/test/ridgun/test_template.rg`.\n"}, {"num": "15", "slug": "15-lib-fmt-formatador-tabular-i-ressaltador", "file": "15-lib-fmt-formatador-tabular-i-ressaltador.md", "title": "Capítol 15: La lib `fmt` — Formatador Tabular Canònic 2D i Ressaltador de Sintaxi en 9 Formats", "short_title": "La lib `fmt` — Formatador Tabular Canònic 2D i Ressaltador de Sintaxi en 9 Formats", "markdown": "# Capítol 15: La lib `fmt` — Formatador Tabular Canònic 2D i Ressaltador de Sintaxi en 9 Formats\n\n## 1. Per què existeix la lib `fmt`?\n\nSiguem sincers: la bellesa del codi Ridgun rau en les seves columnes tabulars perfectament alineades (`::`, `=`, `|`, `->`, `--`), però alinear espais a mà o exportar codi acolorit per a terminal, HTML i LaTeX sense una eina dedicada és tediós.\n\nLa lib **`fmt`** és el motor oficial de formatat tabular 2D i ressaltat lèxic de Ridgun: alinea signatures `fn ::`, equacions, guardes `|` i comentaris `--`, i exporta a **9 formats de sortida** (`FmtPlain`, `FmtTty`, `FmtTrueColor`, `FmtHtmlInline`, `FmtHtmlCss`, `FmtMarkdown`, `FmtPango`, `FmtLatex`, `FmtRtf`).\n\n---\n\n## 2. Artefactes, importació i arquitectura sense `libc`\n\nA `ridgun-libs`, **`fmt`** és una **lib** de primera classe situada a `src/main/ridgun/lib/fmt.rg` (domini `FMT`). En compilar amb `stable bundle`, s'empaqueta en tres formats natius:\n\n| Artefacte | Ruta | Propòsit |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/fmt.rglib` | Distribució i importació directa amb `import fmt` |\n| **Fitxer compilat** | `target/fmt.rgc` | Artefacte intermedi verificat per `ridgunc` |\n| **Objecte compartit ELF64** | `target/libfmt.so` | Biblioteca dinàmica nativa sense dependències de C ni `libc` |\n\n> Per fer servir aquesta lib en qualsevol fitxer `.rg`, n'hi ha prou de declarar `import fmt` a la capçalera i cridar les seves funcions amb espais o guions baixos indistintament.\n\n---\n\n## 3. Referència ràpida de l'API de `fmt`\n\n| Signatura / Funció / Tipus | Què fa i quan fer-la servir |\n|---|---|\n| `fmt source / fmt source with` | Formata codi font Ridgun fent servir l'alineació tabular 2D canònica |\n| `fmt check` | Retorna `True` si el codi ja compleix el format tabular canònic de `fmt source` |\n| `fmt render / fmt render with` | Formata i acoloreix el codi cap a qualsevol dels 9 formats `FmtTarget` |\n| `fmt tokenize line` | Tokenitza una línia en `TokKeyword`, `TokType`, `TokOperator`, `TokString`, `TokNumber`, `TokComment` |\n\n---\n\n## 4. Receptes pràctiques en estil tabular\n\n### Recepta 1: Flux principal amb `fmt`\n\nObserva com els signes `=` i els passos de transformació queden alineats com una taula neta:\n\n```ridgun\nimport fmt\n\nfn :: formatear y verificar (codigo : String) => (String, Bool)\n      formatear y verificar codigo =\n        limpio = fmt source codigo\n        es_ok  = fmt check limpio\n        (limpio, es_ok)\n```\n\n### Recepta 2: Composició segura i sense efectes laterals\n\nTota funció de la lib `fmt` és componible amb la resta de les 32 libs de `ridgun-libs`:\n\n```ridgun\nimport fmt\n\nfn :: exportar bloque html (codigo : String) => String\n      exportar bloque html codigo =\n        fmt render codigo FmtHtmlCss\n```\n\n---\n\n## 5. Sota el capó: rendiment, memòria RMM i garanties\n\n- **Garantia algorísmica i de seguretat**: Idempotència estricta (`fmt source (fmt source s) == fmt source s`) i preservació del 100 % dels tokens semàntics.\n- **Memòria determinista (`RMM1`/`RMM2`)**: Zero pauses de recol·lector de brossa; totes les estructures intermèdies s'alliberen de forma determinista en sortir de l'àmbit.\n- **Verificació contínua**: Provada exhaustivament amb `stable check` i la suite automatitzada `src/test/ridgun/test_fmt.rg`.\n"}, {"num": "16", "slug": "16-lib-cli-arguments-i-entorn", "file": "16-lib-cli-arguments-i-entorn.md", "title": "Capítol 16: La lib `cli` — Banderes, Opcions, Barrera `--`, Subcomandes i Variables d'Entorn", "short_title": "La lib `cli` — Banderes, Opcions, Barrera `--`, Subcomandes i Variables d'Entorn", "markdown": "# Capítol 16: La lib `cli` — Banderes, Opcions, Barrera `--`, Subcomandes i Variables d'Entorn\n\n## 1. Per què existeix la lib `cli`?\n\nSiguem sincers: analitzar `argv` a mà sempre comença amb un bucle innocent i acaba trencant-se quan algú passa `-la` agrupat, `--port=9090` amb signe igual o `--` seguit d'un fitxer que comença per guió `-fitxer.rg`.\n\nLa lib **`cli`** resol banderes llargues (`--verbose`), curtes (`-v`), agrupades (`-la`), opcions amb valor (`--port=8080`, `--port 8080`, `-p 8080`), el separador POSIX `--`, arguments posicionals, subcomandes i lectura tipada de variables d'entorn (`env get int or`, `env get bool or`).\n\n---\n\n## 2. Artefactes, importació i arquitectura sense `libc`\n\nA `ridgun-libs`, **`cli`** és una **lib** de primera classe situada a `src/main/ridgun/lib/cli.rg` (domini `CLI`). En compilar amb `stable bundle`, s'empaqueta en tres formats natius:\n\n| Artefacte | Ruta | Propòsit |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/cli.rglib` | Distribució i importació directa amb `import cli` |\n| **Fitxer compilat** | `target/cli.rgc` | Artefacte intermedi verificat per `ridgunc` |\n| **Objecte compartit ELF64** | `target/libcli.so` | Biblioteca dinàmica nativa sense dependències de C ni `libc` |\n\n> Per fer servir aquesta lib en qualsevol fitxer `.rg`, n'hi ha prou de declarar `import cli` a la capçalera i cridar les seves funcions amb espais o guions baixos indistintament.\n\n---\n\n## 3. Referència ràpida de l'API de `cli`\n\n| Signatura / Funció / Tipus | Què fa i quan fer-la servir |\n|---|---|\n| `cli has flag : [String] -> String -> String -> Bool` | Detecta `--long`, `-s` o banderes agrupades `-xyz` abans de `--` |\n| `cli get opt / cli get int opt` | Extreu opció de text o entera (`--k=v`, `--k v`, `-k v`) amb valor per defecte |\n| `cli positionals / cli subcommand` | Recull els arguments posicionals (incloent-hi tot el que segueix a `--`) |\n| `env get or / env get int or / env get bool or` | Llegeix variables d'entorn amb conversió tipada i valors de suport |\n\n---\n\n## 4. Receptes pràctiques en estil tabular\n\n### Recepta 1: Flux principal amb `cli`\n\nObserva com els signes `=` i els passos de transformació queden alineats com una taula neta:\n\n```ridgun\nimport cli\n\nfn :: analizar comando (args : [String]) => (String, Bool, Int, [String])\n      analizar comando args =\n        sub   = cli subcommand args\n        all_f = cli has flag args \"--all\" \"-a\"\n        port  = cli get int opt args \"--port\" \"-p\" 8080\n        arch  = cli positionals args [\"--port\", \"-p\"]\n        (sub, all_f, port, arch)\n```\n\n### Recepta 2: Composició segura i sense efectes laterals\n\nTota funció de la lib `cli` és componible amb la resta de les 32 libs de `ridgun-libs`:\n\n```ridgun\nimport cli\n\nfn :: leer config entorno () => (Int, Bool)\n      leer config entorno =\n        workers = env get int or \"SOLSTICE_WORKERS\" 4\n        debug   = env get bool or \"SOLSTICE_DEBUG\" False\n        (workers, debug)\n```\n\n---\n\n## 5. Sota el capó: rendiment, memòria RMM i garanties\n\n- **Garantia algorísmica i de seguretat**: Respecte estricte del separador POSIX `--`: cap argument situat a la dreta de `--` s'interpreta mai com a bandera.\n- **Memòria determinista (`RMM1`/`RMM2`)**: Zero pauses de recol·lector de brossa; totes les estructures intermèdies s'alliberen de forma determinista en sortir de l'àmbit.\n- **Verificació contínua**: Provada exhaustivament amb `stable check` i la suite automatitzada `src/test/ridgun/test_cli.rg`.\n"}, {"num": "17", "slug": "17-lib-path-rutes-posix-i-seguretat", "file": "17-lib-path-rutes-posix-i-seguretat.md", "title": "Capítol 17: La lib `path` — Normalització POSIX (`path clean`) i Confinament contra Path Traversal", "short_title": "La lib `path` — Normalització POSIX (`path clean`) i Confinament contra Path Traversal", "markdown": "# Capítol 17: La lib `path` — Normalització POSIX (`path clean`) i Confinament contra Path Traversal\n\n## 1. Per què existeix la lib `path`?\n\nSiguem sincers: unir rutes amb `base + \"/\" + fitxer` sense netejar segments `..` ni validar prefixos és com deixar la porta oberta perquè algú demani `../../etc/passwd` al teu servidor web.\n\nLa lib **`path`** implementa normalització lèxica POSIX (`path clean` a l'estil `filepath.Clean` de Go), unió segura (`path join`), descomposició (`dirname`, `basename`, `stem`, `ext`, `replace ext`) i el predicat de seguretat **`path is safe subpath`** (`VUL-INJ-001`) contra escapaments de directori.\n\n---\n\n## 2. Artefactes, importació i arquitectura sense `libc`\n\nA `ridgun-libs`, **`path`** és una **lib** de primera classe situada a `src/main/ridgun/lib/path.rg` (domini `PATH`). En compilar amb `stable bundle`, s'empaqueta en tres formats natius:\n\n| Artefacte | Ruta | Propòsit |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/path.rglib` | Distribució i importació directa amb `import path` |\n| **Fitxer compilat** | `target/path.rgc` | Artefacte intermedi verificat per `ridgunc` |\n| **Objecte compartit ELF64** | `target/libpath.so` | Biblioteca dinàmica nativa sense dependències de C ni `libc` |\n\n> Per fer servir aquesta lib en qualsevol fitxer `.rg`, n'hi ha prou de declarar `import path` a la capçalera i cridar les seves funcions amb espais o guions baixos indistintament.\n\n---\n\n## 3. Referència ràpida de l'API de `path`\n\n| Signatura / Funció / Tipus | Què fa i quan fer-la servir |\n|---|---|\n| `path clean / path join / path join list` | Col·lapsa `//`, `.` i `..` lèxicament i uneix segments de ruta |\n| `path dirname / path basename / path split` | Divideix una ruta en directori pare i nom de fitxer final |\n| `path ext / path stem / path replace ext` | Extreu o canvia l'extensió (tractant `.bashrc` com a arrel `.bashrc` i ext `\"\"`) |\n| `path is safe subpath : String -> String -> Bool` | Verifica que `rel` romangui estrictament dins de `base_dir` i sense bytes NUL |\n\n---\n\n## 4. Receptes pràctiques en estil tabular\n\n### Recepta 1: Flux principal amb `path`\n\nObserva com els signes `=` i els passos de transformació queden alineats com una taula neta:\n\n```ridgun\nimport path\n\nfn :: resolver archivo estatico (raiz : String) (peticion : String) => (Bool, String)\n      resolver archivo estatico raiz peticion =\n        seguro = path is safe subpath raiz peticion\n        ruta   = path join raiz peticion\n        (seguro, ruta)\n```\n\n### Recepta 2: Composició segura i sense efectes laterals\n\nTota funció de la lib `path` és componible amb la resta de les 32 libs de `ridgun-libs`:\n\n```ridgun\nimport path\n\nfn :: cambiar salida a objeto (fuente : String) => (String, String, String)\n      cambiar salida a objeto fuente =\n        dir = path dirname fuente\n        nom = path stem fuente\n        obj = path replace ext (path clean fuente) \".rglib\"\n        (dir, nom, obj)\n```\n\n---\n\n## 5. Sota el capó: rendiment, memòria RMM i garanties\n\n- **Garantia algorísmica i de seguretat**: `path is safe subpath` rebutja rutes absolutes, bytes NUL i qualsevol seqüència `..` que intenti escapar del directori arrel o d'un prefix germà (`/srv/www-secret`).\n- **Memòria determinista (`RMM1`/`RMM2`)**: Zero pauses de recol·lector de brossa; totes les estructures intermèdies s'alliberen de forma determinista en sortir de l'àmbit.\n- **Verificació contínua**: Provada exhaustivament amb `stable check` i la suite automatitzada `src/test/ridgun/test_path.rg`.\n"}, {"num": "18", "slug": "18-lib-time-calendari-utc-iso8601-i-backoff", "file": "18-lib-time-calendari-utc-iso8601-i-backoff.md", "title": "Capítol 18: La lib `time` — Calendari Civil UTC (Hinnant), ISO-8601, Durades i Backoff", "short_title": "La lib `time` — Calendari Civil UTC (Hinnant), ISO-8601, Durades i Backoff", "markdown": "# Capítol 18: La lib `time` — Calendari Civil UTC (Hinnant), ISO-8601, Durades i Backoff\n\n## 1. Per què existeix la lib `time`?\n\nSiguem sincers: les funcions de data de `libc` (`localtime`, `gmtime`, `mktime`) depenen d'estat global mutable (`TZ`), no són segures entre fils i fallen amb regles d'anys de traspàs seculars com 1900 vs 2000.\n\nLa lib **`time`** implementa l'algorisme de calendari civil gregorià prolèptic en **$O(1)$ de Howard Hinnant**, formatat i anàlisi estricta **ISO-8601 / RFC 3339** (`YYYY-MM-DDTHH:MM:SSZ`), durades llegibles (`1h 1m 1s 5ms`) i càlcul d'*exponential backoff* acotat per a reintents de xarxa.\n\n---\n\n## 2. Artefactes, importació i arquitectura sense `libc`\n\nA `ridgun-libs`, **`time`** és una **lib** de primera classe situada a `src/main/ridgun/lib/time.rg` (domini `TIME`). En compilar amb `stable bundle`, s'empaqueta en tres formats natius:\n\n| Artefacte | Ruta | Propòsit |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/time.rglib` | Distribució i importació directa amb `import time` |\n| **Fitxer compilat** | `target/time.rgc` | Artefacte intermedi verificat per `ridgunc` |\n| **Objecte compartit ELF64** | `target/libtime.so` | Biblioteca dinàmica nativa sense dependències de C ni `libc` |\n\n> Per fer servir aquesta lib en qualsevol fitxer `.rg`, n'hi ha prou de declarar `import time` a la capçalera i cridar les seves funcions amb espais o guions baixos indistintament.\n\n---\n\n## 3. Referència ràpida de l'API de `time`\n\n| Signatura / Funció / Tipus | Què fa i quan fer-la servir |\n|---|---|\n| `time epoch to utc / time utc to epoch` | Conversió en $O(1)$ entre segons Unix epoch i `(year, month, day, hour, min, sec)` |\n| `time is leap year / time days in month / time day of week` | Regles d'any de traspàs (`400 / 100 / 4`), dies del mes i dia ISO de la setmana (`1=Dll..7=Diu`) |\n| `time format iso8601 / time parse iso8601` | Formata i valida marques `YYYY-MM-DDTHH:MM:SSZ` (`-1` en dates invàlides com 30 de feb) |\n| `time format duration ms / time backoff ms` | Durades llegibles i temps d'espera exponencials acotats $base \\cdot 2^{attempt}$ |\n\n---\n\n## 4. Receptes pràctiques en estil tabular\n\n### Recepta 1: Flux principal amb `time`\n\nObserva com els signes `=` i els passos de transformació queden alineats com una taula neta:\n\n```ridgun\nimport time\n\nfn :: registrar evento temporal (epoch_s : Int) => (String, Int, String)\n      registrar evento temporal epoch_s =\n        iso = time format iso8601 epoch_s\n        sem = time day of week epoch_s\n        dur = time format duration ms 3661005\n        (iso, sem, dur)\n```\n\n### Recepta 2: Composició segura i sense efectes laterals\n\nTota funció de la lib `time` és componible amb la resta de les 32 libs de `ridgun-libs`:\n\n```ridgun\nimport time\n\nfn :: planificar reintentos () => [Int]\n      planificar reintentos =\n        [time backoff ms 0 100 5000, time backoff ms 1 100 5000, time backoff ms 2 100 5000, time backoff ms 9 100 5000]\n```\n\n---\n\n## 5. Sota el capó: rendiment, memòria RMM i garanties\n\n- **Garantia algorísmica i de seguretat**: Conversió de calendari en $O(1)$ sense bucles any per any i validació estricta de dies per mes (rebutjant el 29 de febrer en anys no de traspàs).\n- **Memòria determinista (`RMM1`/`RMM2`)**: Zero pauses de recol·lector de brossa; totes les estructures intermèdies s'alliberen de forma determinista en sortir de l'àmbit.\n- **Verificació contínua**: Provada exhaustivament amb `stable check` i la suite automatitzada `src/test/ridgun/test_time.rg`.\n"}, {"num": "19", "slug": "19-lib-uuid-identificadors-crc32-i-prng", "file": "19-lib-uuid-identificadors-crc32-i-prng.md", "title": "Capítol 19: La lib `uuid` — RFC 9562 `UUIDv4`/`UUIDv7`, FNV-1a, Adler-32, CRC-32 i PRNG", "short_title": "La lib `uuid` — RFC 9562 `UUIDv4`/`UUIDv7`, FNV-1a, Adler-32, CRC-32 i PRNG", "markdown": "# Capítol 19: La lib `uuid` — RFC 9562 `UUIDv4`/`UUIDv7`, FNV-1a, Adler-32, CRC-32 i PRNG\n\n## 1. Per què existeix la lib `uuid`?\n\nSiguem sincers: fer servir `UUIDv4` completament aleatoris com a clau primària en una base de dades fragmenta els índexs B-Tree, mentre que inventar-se IDs casolans sense entropia del nucli acaba en col·lisions.\n\nLa lib **`uuid`** implementa **`UUIDv4`** (aleatori amb CSPRNG del nucli) i **`UUIDv7`** (ordenat cronològicament en els primers 48 bits segons **RFC 9562**), sumes de verificació ràpides (**FNV-1a**, **Adler-32**, **CRC-32 IEEE 802.3**) i un PRNG determinista amb llavor.\n\n---\n\n## 2. Artefactes, importació i arquitectura sense `libc`\n\nA `ridgun-libs`, **`uuid`** és una **lib** de primera classe situada a `src/main/ridgun/lib/uuid.rg` (domini `UUID`). En compilar amb `stable bundle`, s'empaqueta en tres formats natius:\n\n| Artefacte | Ruta | Propòsit |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/uuid.rglib` | Distribució i importació directa amb `import uuid` |\n| **Fitxer compilat** | `target/uuid.rgc` | Artefacte intermedi verificat per `ridgunc` |\n| **Objecte compartit ELF64** | `target/libuuid.so` | Biblioteca dinàmica nativa sense dependències de C ni `libc` |\n\n> Per fer servir aquesta lib en qualsevol fitxer `.rg`, n'hi ha prou de declarar `import uuid` a la capçalera i cridar les seves funcions amb espais o guions baixos indistintament.\n\n---\n\n## 3. Referència
