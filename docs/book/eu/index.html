    const CHAPTERS = [{"num": "00", "slug": "00-zergatik-behar-dut-ridgun-libs", "file": "00-zergatik-behar-dut-ridgun-libs.md", "title": "00. kapitulua: Zergatik behar dut `ridgun-libs`? 32 lib C lerro bakar bat gabe? Kontaidazu gehiago!", "short_title": "Zergatik behar dut `ridgun-libs`? 32 lib C lerro bakar bat gabe? Kontaidazu gehiago!", "markdown": "# 00. kapitulua: Zergatik behar dut `ridgun-libs`? 32 lib C lerro bakar bat gabe? Kontaidazu gehiago!\n\nIzan gaitezen zintzoak: lengoaia batek zabor-biltzailerik gabeko ELF bitar natibo txiki-txiki batera konpilatzen duela deskubritzen duzunean, zeure buruari egiten diozun bigarren galdera —arrazoi osoz— hauxe da:\n\n> *\"Ados, lengoaia bikaina da... baina TCP socket bat ireki, Argon2id hash bat kalkulatu, JSON bat analizatu, tentsoreekin sistema lineal bat ebatzi edo aktore-pool bat muntatu behar dudanean, `libc`, `OpenSSL`, `libcurl` eta `pcre2` estekatu beharko ditut, ala ezezagun batek mantendutako hirugarrenen 800 pakete deskargatu?\"*\n\nGaldera bikaina da. Eta erantzun laburra hauxe da: **ez**. Horretarako existitzen da **`ridgun-libs`**: **% 100ean Ridgun hutsean (`v0.9.16`)** idatzitako **oinarrizko 32 lib-eko** suitea, **zero C mendekotasunekin** eta **zero `libc`-rekin**.\n\nJar diezaiegun izena `ridgun-libs`-ek errotik ezabatzen dituen eguneroko lau minei.\n\n---\n\n## 1. mina: \"`libc`, OpenSSL eta estekatze gurutzatuaren infernua\"\n\nZiur amesgaizto hau bizi izan duzula:\n\n1. Ustez \"estatikoa\" edo \"eramangarria\" den zerbitzari edo CLI tresna bat idazten duzu.\n2. Kriptografia (`SHA-256`, `Argon2id`, `ChaCha20-Poly1305`), sarea (`DNS`, `HTTP`, `WebSockets`) edo adierazpen erregularrak behar dituzun bezain laster, zure programa `glibc 2.38`, `libssl.so.3` eta C-ko hiru goibururen menpe geratzen da.\n3. Bitarra edukiontzi minimo batera edo beste Linux banaketa batera kopiatzen saiatzen zara eta abiaraztean eztanda egiten du `version 'GLIBC_2.38' not found` mezu ezagunarekin.\n\n**Zer aldatzen da `ridgun-libs`-ekin?**\nBiltegi honetako 32 lib-etako bakoitza oso-osorik Ridgun taularatuan idatzita dago eta zuzenean sistema eragilearen nukleoarekin hitz egiten du PAL geruzaren bidez (`posix`), edo algoritmo hutsak exekutatzen ditu memoria deterministan (`RMM1`/`RMM2`). Pakete eramangarrietara (`.rglib` / `.rgc`) zein ELF64 objektu partekatu natiboetara (`lib*.so`) konpilatzen dira. `libc` gabe, FFI hauskorrik gabe eta ustekaberik gabe.\n\n---\n\n## 2. mina: \"400 mendekotasuneko `node_modules` / `Cargo.lock` sindromea\"\n\nEkosistema moderno askotan, liburutegi estandarra hain da hezurdura hutsa ezen `.ini` fitxategi bat irakurtzeko, `UUIDv7` bat baliozkotzeko, Unified Diff adabaki bat aplikatzeko edo HTML txantiloi seguru bat errenderizatzeko kanpoko dozena erdi pakete instalatu behar baitituzu.\n\n**`ridgun-libs`**-en, **32 lib-ek** diseinu-filosofia bakar bati jarraitzen diote:\n\n```ridgun\nimport crypto\nimport json\nimport http\n\nfn :: autenticar y pedir (token : String) => String\n      autenticar y pedir token =\n        -- Lib guztiek mota hutsak, lerrokatze taularatua eta semantika determinista partekatzen dituzte\n        mac_hex = sha256 hex token\n        cuerpo  = json stringify (JnObj [(\"token_sha256\", JnStr mac_hex)])\n        pet     = http build request \"POST\" \"/v1/sesion\" [(\"Content-Type\", \"application/json\")] cuerpo\n        pet\n```\n\nEstetika taularatu bera, ADT aldaezin berdinak (`Option`, `Result`, `IoResult`, `JsonVal`), zero albo-ondorio ezkutu.\n\n---\n\n## 3. mina: \"PUZa zintzilikatzen duten adierazpen erregularrak (ReDoS) eta betiko blokeatzen diren socketak\"\n\nEkoizpeneko bi erloju-bonba klasiko:\n\n- Erabiltzaile gaizto batek kate berezi bat bidaltzen du zure *backtracking* bidezko adierazpen erregularren motorra $O(2^N)$ denbora esponentzialean sartzeko eta nukleo bat % 100ean erretzeko.\n- Sare-deskribatzaile bat erdi irekita geratzen da eta zure haria betiko blokeatuta geratzen da epemugarik gabeko `read()` baten zain.\n\n**`ridgun-libs`**-en:\n- **`regex`** lib-ak (11. kapitulua) **Thompsonen NFA** automata bat inplementatzen du, **$O(N \\cdot M)$** denbora lineal zorrotza bermatuz: ReDoS erasoen aurka immunizatua eraikuntzaz.\n- **`posix`**, **`io`** eta **`socket`** lib-ek (22, 23 eta 27. kapituluak) `with timeout` kuota lexikoak eta `ppoll` integratzen dituzte deskribatzaile-mailan: sarrera/irteerako inongo eragiketak ezin du zure zerbitzua zintzilik utzi.\n\n---\n\n## 4. mina: \"Hieroglifikoak diruditen kriptografia eta aljebra lineala\"\n\n**`ridgun-libs`**-en, Ridgunen `Tensor[...]` moten ahalmenari esker, **`tensor`** (05. kapitulua), **`linalg`** (06. kapitulua) eta **`argon2id`** (25. kapitulua) bezalako lib-ek memoria jarraituko blokeen gainean (`Tensor[U64 * 8 * 16]`, `Tensor[Real]`) lan egiten dute, taula matematiko baten irakurgarritasuna mantenduz.\n\n---\n\n## Liburuaren mapa osoa: 32 kapitulu 32 lib-entzat\n\nLiburu honetako kapitulu bakoitza `ridgun-libs`-eko **lib bati** eskainita dago, behetik gorako progresio logiko batean multzokatuta:\n\n| Kapituluak | Lib familia | Barne hartutako lib-ak |\n|---|---|---|\n| **01 – 04** | Testua, Matematika eta Datu-egiturak | `str`, `math`, `list`, `btree` |\n| **05 – 06** | Tentsoreak eta Aljebra Lineala | `tensor`, `linalg` |\n| **07 – 10** | Kodetzea eta Datu-formatuak | `codec`, `json`, `csv`, `ini` |\n| **11 – 15** | Testu-motorrak, Diff-ak, Txantiloiak eta Formateatzea | `regex`, `glob`, `diff`, `template`, `fmt` |\n| **16 – 21** | CLI, Bideak, Denbora, UUIDak, Log-ak eta Testing-a | `cli`, `path`, `time`, `uuid`, `log`, `test` |\n| **22 – 23** | POSIX Sistemak eta Timeout bidezko S/I | `posix`, `io` |\n| **24 – 26** | Kriptografia, Argon2id eta JWT Tokenak | `crypto`, `argon2id`, `jwt` |\n| **27 – 29** | Sareak, Nukleoko Socketak, HTTP/1.1 eta WebSocketak | `socket`, `http`, `ws` |\n| **30 – 32** | Aktoreen Konkurrentzia, Pool-ak eta Sare-gainbegiratzea | `agent`, `pool`, `net_agent` |\n\nAurrera ba! Joan **01. kapitulura (`str`)** eta has gaitezen eraikitzen.\n"}, {"num": "01", "slug": "01-lib-str-testu-manipulazioa", "file": "01-lib-str-testu-manipulazioa.md", "title": "01. kapitulua: `str` lib-a — Testu-manipulazioa, Bilaketa eta Formatu Taularatua", "short_title": "`str` lib-a — Testu-manipulazioa, Bilaketa eta Formatu Taularatua", "markdown": "# 01. kapitulua: `str` lib-a — Testu-manipulazioa, Bilaketa eta Formatu Taularatua\n\n## 1. Zergatik existitzen da `str` lib-a?\n\nIzan gaitezen zintzoak: C lengoaian `strtok` eta `strncpy` bidez kateak manipulatzea buffer-gainezkatzeen eta `NULL` erakusleen arteko mina-zelai batean ibiltzea da, eta beste lengoaia batzuetan hiru pakete inportatzen amaitzen duzu zutabeak lerrokatzeko.\n\n**`str`** lib-ak kateak bilatu, moztu, zatitu, elkartu, letra larri/xeheetara bihurtu, $O(\\log N)$ bikoizketa bitarrez errepikatu eta betetzeko primitiba huts eta aldaezin guztiak eskaintzen ditu.\n\n---\n\n## 2. Artefaktuak, inportazioa eta `libc` gabeko arkitektura\n\n`ridgun-libs`-en, **`str`** lehen mailako **lib** bat da, `src/main/ridgun/lib/str.rg` bidean kokatua (`STR` domeinua). `stable bundle`-ekin konpilatzean, hiru formatu natibotan paketatzen da:\n\n| Artefaktua | Bidea | Helburua |\n|---|---|---|\n| **Ridgun Bundle-a** | `target/bundles/str.rglib` | Banaketa eta inportazio zuzena `import str` bidez |\n| **Fitxategi konpilatua** | `target/str.rgc` | `ridgunc`-ek egiaztatutako tarteko artefaktua |\n| **ELF64 objektu partekatua** | `target/libstr.so` | C edo `libc` mendekotasunik gabeko liburutegi dinamiko natiboa |\n\n> Lib hau edozein `.rg` fitxategitan erabiltzeko, nahikoa da goiburuan `import str` deklaratzea eta bere funtzioei zuriuneekin edo azpimarrarekin deitzea.\n\n---\n\n## 3. `str` APIaren erreferentzia azkarra\n\n| Sinadura / Funtzioa / Mota | Zer egiten duen eta noiz erabili |\n|---|---|\n| `str index of : String -> String -> Int` | Azpikatearen lehen indizea (`-1` ez badago / `0` hutsa bada) |\n| `str contains / str starts with / str ends with` | Azpikate, aurrizki eta atzizkien `Bool` predikatuak |\n| `str trim / str trim left / str trim right` | ASCII zuriuneak kentzen ditu (` `, `\\t`, `\\n`, `\\r`) |\n| `str split / str lines / str words / str join` | `[String]` zerrendan zatitu eta bereizle batekin elkartzen ditu |\n| `str replace / str to upper / str to lower` | Gainjartzerik gabeko ordezkapena eta ASCII letra larri/xeheen bihurketa |\n| `str repeat / str pad left / str pad right` | $O(\\log N)$ errepikapena eta zabaleraardatzeko zutabe-betegarria |\n\n---\n\n## 4. Errezeta praktikoak estilo taularatuan\n\n### 1. errezeta: Fluxu nagusia `str` erabiliz\n\nIkusi nola `=` ikurrak eta eraldaketa-urratsak taula garbi bat bezala lerrokatuta geratzen diren:\n\n```ridgun\nimport str\n\nfn :: normalizar cabecera (raw : String) => String\n      normalizar cabecera raw =\n        limpia = str to lower (str trim raw)\n        partes = str words limpia\n        slug   = str join partes \"-\"\n        str pad right slug 24 \".\"\n```\n\n### 2. errezeta: Konposizio segurua eta albo-ondoriorik gabea\n\n`str` lib-eko funtzio oro `ridgun-libs`-eko gainerako 32 lib-ekin konposa daiteke:\n\n```ridgun\nimport str\n\nfn :: extraer dominio (correo : String) => String\n      extraer dominio correo =\n        pos = str index of correo \"@\"\n        | pos < 0   = \"sin-dominio\"\n        | otherwise =\n          partes = str split correo \"@\"\n          str replace (str to lower correo) \"@\" \" en \"\n```\n\n---\n\n## 5. Kaputaren azpian: errendimendua, RMM memoria eta bermeak\n\n- **Berme algoritmikoa eta segurtasunekoa**: $O(\\log N)$ errepikapena kateen bikoizketaren bidez, predikatu seguruak orratz hutsen aurrean eta zero mutazio bertan.\n- **Memoria determinista (`RMM1`/`RMM2`)**: Zero zabor-biltzaile etenaldi; tarteko egitura guztiak modu deterministan askatzen dira esparrutik irtetean.\n- **Etengabeko egiaztapena**: Zorrotz probatua `stable check` eta `src/test/ridgun/test_str.rg` suite automatizatuaren bidez.\n"}, {"num": "02", "slug": "02-lib-math-aritmetika-eta-zenbaki-teoria", "file": "02-lib-math-aritmetika-eta-zenbaki-teoria.md", "title": "02. kapitulua: `math` lib-a — Aritmetika Segurua, Zenbaki-teoria eta Estatistika", "short_title": "`math` lib-a — Aritmetika Segurua, Zenbaki-teoria eta Estatistika", "markdown": "# 02. kapitulua: `math` lib-a — Aritmetika Segurua, Zenbaki-teoria eta Estatistika\n\n## 1. Zergatik existitzen da `math` lib-a?\n\nIzan gaitezen zintzoak: ekoizpenean ustekabeko zeroz zatitze batek edo C zein Javan `%` eragileak hondar negatiboak itzultzeak aitortzea gustatzen zaiguna baino zerbitzu gehiago bota ditu behera.\n\n**`math`** lib-ak `d == 0`-ren aurkako zatiketa osoak (`div ceil`, `div floor`, `div euclid`, `mod euclid`), $O(\\log E)$ berreketa eta alderantzizko modularra, erro eta logaritmo oso zehatzak, konbinatoria eta `clamp x between lo and hi` mixfix eragilea eskaintzen ditu.\n\n---\n\n## 2. Artefaktuak, inportazioa eta `libc` gabeko arkitektura\n\n`ridgun-libs`-en, **`math`** lehen mailako **lib** bat da, `src/main/ridgun/lib/math.rg` bidean kokatua (`MATH` domeinua). `stable bundle`-ekin konpilatzean, hiru formatu natibotan paketatzen da:\n\n| Artefaktua | Bidea | Helburua |\n|---|---|---|\n| **Ridgun Bundle-a** | `target/bundles/math.rglib` | Banaketa eta inportazio zuzena `import math` bidez |\n| **Fitxategi konpilatua** | `target/math.rgc` | `ridgunc`-ek egiaztatutako tarteko artefaktua |\n| **ELF64 objektu partekatua** | `target/libmath.so` | C edo `libc` mendekotasunik gabeko liburutegi dinamiko natiboa |\n\n> Lib hau edozein `.rg` fitxategitan erabiltzeko, nahikoa da goiburuan `import math` deklaratzea eta bere funtzioei zuriuneekin edo azpimarrarekin deitzea.\n\n---\n\n## 3. `math` APIaren erreferentzia azkarra\n\n| Sinadura / Funtzioa / Mota | Zer egiten duen eta noiz erabili |\n|---|---|\n| `math abs / math sign / math min / math max` | Magnitude absolutua, zeinua (`-1, 0, 1`) eta muturrak |\n| `clamp x between lo and hi` | `x` balioa `[lo, hi]` tartera mugatzen duen mixfix eragilea (`op ::`) |\n| `math div ceil / math div floor / math div euclid / math mod euclid` | Zeroz zatitzearen aurkako biribilketa segurua eta hondar euklidear ez-negatiboa |\n| `math pow / math isqrt / math ilog2 / math ilog10` | $O(\\log E)$ berreketa, Newtonen erro karratu osoa eta logaritmo osoak |\n| `math gcd / math lcm / math mod pow / math mod inv / math is prime` | Euklidesen ZKH/MKT, aritmetika modularra eta $6k \\pm 1$ lehentasun-proba |\n| `math sum / math mean floor / math median floor / math variance floor` | Gainezkatzerik gabeko konbinatoria (`nCr`) eta zerrenden estatistika osoa |\n\n---\n\n## 4. Errezeta praktikoak estilo taularatuan\n\n### 1. errezeta: Fluxu nagusia `math` erabiliz\n\nIkusi nola `=` ikurrak eta eraldaketa-urratsak taula garbi bat bezala lerrokatuta geratzen diren:\n\n```ridgun\nimport math\n\nfn :: verificar clave modular (base : Int) (primo : Int) => (Int, Int, Bool)\n      verificar clave modular base primo =\n        es_p = math is prime primo\n        pot  = math mod pow base (primo - 1) primo\n        inv  = math mod inv base primo\n        (pot, inv, es_p)\n```\n\n### 2. errezeta: Konposizio segurua eta albo-ondoriorik gabea\n\n`math` lib-eko funtzio oro `ridgun-libs`-eko gainerako 32 lib-ekin konposa daiteke:\n\n```ridgun\nimport math\n\nfn :: calcular paginas y cuota (items : Int) (por_pag : Int) (uso : Int) => (Int, Int)\n      calcular paginas y cuota items por_pag uso =\n        pags  = math div ceil items por_pag\n        cuota = clamp uso between 0 and 100\n        (pags, cuota)\n```\n\n---\n\n## 5. Kaputaren azpian: errendimendua, RMM memoria eta bermeak\n\n- **Berme algoritmikoa eta segurtasunekoa**: Funtzio osoak (`0` itzultzen dute zatitzailea `<= 0` denean `SIGFPE`-rekin abortatu beharrean), koma higikor ez-zehatzik gabe.\n- **Memoria determinista (`RMM1`/`RMM2`)**: Zero zabor-biltzaile etenaldi; tarteko egitura guztiak modu deterministan askatzen dira esparrutik irtetean.\n- **Etengabeko egiaztapena**: Zorrotz probatua `stable check` eta `src/test/ridgun/test_math.rg` suite automatizatuaren bidez.\n"}, {"num": "03", "slug": "03-lib-list-zerrendak-mergesort-eta-kv-mapak", "file": "03-lib-list-zerrendak-mergesort-eta-kv-mapak.md", "title": "03. kapitulua: `list` lib-a — Zerrendak, $O(N \\log N)$ Mergesort eta Gako-Balio Mapak", "short_title": "`list` lib-a — Zerrendak, $O(N \\log N)$ Mergesort eta Gako-Balio Mapak", "markdown": "# 03. kapitulua: `list` lib-a — Zerrendak, $O(N \\log N)$ Mergesort eta Gako-Balio Mapak\n\n## 1. Zergatik existitzen da `list` lib-a?\n\nIzan gaitezen zintzoak: tartetik kanpoko indize batera sartzea (`IndexError` / `panic!`) edo partekatutako zerrenda bat ustekabean mutatzea bildumak prozesatzeko orduan gertatzen diren akats ohikoenetako bi dira.\n\n**`list`** lib-ak lehenetsitako balio bidezko indexazioa, zatitzea (`take`, `drop`, `slice`), urrats bidezko tarteak, deduplikazio egonkorra, `[Int]` eta `[String]`-entzako **$O(N \\log N)$ mergesort** ordenazioa eta `[String String]` hiztegi elkartu aldaezinak eskaintzen ditu.\n\n---\n\n## 2. Artefaktuak, inportazioa eta `libc` gabeko arkitektura\n\n`ridgun-libs`-en, **`list`** lehen mailako **lib** bat da, `src/main/ridgun/lib/list.rg` bidean kokatua (`LIST` domeinua). `stable bundle`-ekin konpilatzean, hiru formatu natibotan paketatzen da:\n\n| Artefaktua | Bidea | Helburua |\n|---|---|---|\n| **Ridgun Bundle-a** | `target/bundles/list.rglib` | Banaketa eta inportazio zuzena `import list` bidez |\n| **Fitxategi konpilatua** | `target/list.rgc` | `ridgunc`-ek egiaztatutako tarteko artefaktua |\n| **ELF64 objektu partekatua** | `target/liblist.so` | C edo `libc` mendekotasunik gabeko liburutegi dinamiko natiboa |\n\n> Lib hau edozein `.rg` fitxategitan erabiltzeko, nahikoa da goiburuan `import list` deklaratzea eta bere funtzioei zuriuneekin edo azpimarrarekin deitzea.\n\n---\n\n## 3. `list` APIaren erreferentzia azkarra\n\n| Sinadura / Funtzioa / Mota | Zer egiten duen eta noiz erabili |\n|---|---|\n| `list nth or / list str nth or` | Indize bidezko irakurketa segurua, tartetik kanpo `default_val` itzuliz |\n| `list take / list drop / list slice / list reverse` | Aurrizkia, atzizkia, `[start, end)` azpitartea eta buztan-errekurtsioko alderantzikatzea |\n| `list range / list range step` | Sekuentzia aritmetikoak sortzen ditu (`step == 0`-k `[]` itzultzen du seguru) |\n| `list sort / list str sort / list dedup / list str dedup` | $O(N \\log N)$ mergesort ordenazio egonkorra eta lehen agerpeneko deduplikazioa |\n| `kv empty / kv put / kv get / kv get or / kv remove / kv merge` | `[String String]` hiztegi elkartu ordenatuen gaineko eragiketak |\n\n---\n\n## 4. Errezeta praktikoak estilo taularatuan\n\n### 1. errezeta: Fluxu nagusia `list` erabiliz\n\nIkusi nola `=` ikurrak eta eraldaketa-urratsak taula garbi bat bezala lerrokatuta geratzen diren:\n\n```ridgun\nimport list\n\nfn :: top tres unicos (puntos : [Int]) => [Int]\n      top tres unicos puntos =\n        unicos    = list dedup puntos\n        ordenados = list reverse (list sort unicos)\n        list take ordenados 3\n```\n\n### 2. errezeta: Konposizio segurua eta albo-ondoriorik gabea\n\n`list` lib-eko funtzio oro `ridgun-libs`-eko gainerako 32 lib-ekin konposa daiteke:\n\n```ridgun\nimport list\n\nfn :: configurar entorno (base : [String String]) => (String, [String])\n      configurar entorno base =\n        cfg1 = kv put base \"host\" \"0.0.0.0\"\n        cfg2 = kv put cfg1 \"port\" \"8080\"\n        host = kv get or cfg2 \"host\" \"127.0.0.1\"\n        (host, kv keys cfg2)\n```\n\n---\n\n## 5. Kaputaren azpian: errendimendua, RMM memoria eta bermeak\n\n- **Berme algoritmikoa eta segurtasunekoa**: Kasurik txarreneko $O(N \\log N)$ ordenazio determinista (Quicksorten $O(N^2)$ patologikorik gabe) eta txertatze-ordenaren kontserbazioa `kv` mapetan.\n- **Memoria determinista (`RMM1`/`RMM2`)**: Zero zabor-biltzaile etenaldi; tarteko egitura guztiak modu deterministan askatzen dira esparrutik irtetean.\n- **Etengabeko egiaztapena**: Zorrotz probatua `stable check` eta `src/test/ridgun/test_list.rg` suite automatizatuaren bidez.\n"}, {"num": "04", "slug": "04-lib-btree-avl-zuhaitzak-multzoak-eta-tontorrak", "file": "04-lib-btree-avl-zuhaitzak-multzoak-eta-tontorrak.md", "title": "04. kapitulua: `btree` lib-a — $O(\\log N)$ AVL Zuhaitz Iraunkorrak, Multzoak eta Tontorrak", "short_title": "`btree` lib-a — $O(\\log N)$ AVL Zuhaitz Iraunkorrak, Multzoak eta Tontorrak", "markdown": "# 04. kapitulua: `btree` lib-a — $O(\\log N)$ AVL Zuhaitz Iraunkorrak, Multzoak eta Tontorrak\n\n## 1. Zergatik existitzen da `btree` lib-a?\n\nIzan gaitezen zintzoak: hash-taula aldakorrek gako-talka erasoak (HashDoS) jasaten dituzte, ez dituzte gakoak ordenatuta mantentzen tarte-kontsultetarako eta ezin dira aktoreen artean partekatu blokeorik gabe.\n\n**`btree`** lib-ak egitura-partekatzea duten $O(\\log N)$ hiru datu-egitura funtzional iraunkor inplementatzen ditu: **`BTreeMap`** (bere kabuz orekatzen den AVL zuhaitza), **`BTreeSet`** (multzo-aljebra ordenatua) eta **`MinHeap`** (*leftist heap* lehentasun-ilara).\n\n---\n\n## 2. Artefaktuak, inportazioa eta `libc` gabeko arkitektura\n\n`ridgun-libs`-en, **`btree`** lehen mailako **lib** bat da, `src/main/ridgun/lib/btree.rg` bidean kokatua (`BTREE` domeinua). `stable bundle`-ekin konpilatzean, hiru formatu natibotan paketatzen da:\n\n| Artefaktua | Bidea | Helburua |\n|---|---|---|\n| **Ridgun Bundle-a** | `target/bundles/btree.rglib` | Banaketa eta inportazio zuzena `import btree` bidez |\n| **Fitxategi konpilatua** | `target/btree.rgc` | `ridgunc`-ek egiaztatutako tarteko artefaktua |\n| **ELF64 objektu partekatua** | `target/libbtree.so` | C edo `libc` mendekotasunik gabeko liburutegi dinamiko natiboa |\n\n> Lib hau edozein `.rg` fitxategitan erabiltzeko, nahikoa da goiburuan `import btree` deklaratzea eta bere funtzioei zuriuneekin edo azpimarrarekin deitzea.\n\n---\n\n## 3. `btree` APIaren erreferentzia azkarra\n\n| Sinadura / Funtzioa / Mota | Zer egiten duen eta noiz erabili |\n|---|---|\n| `btree empty / btree insert / btree get / btree remove` | $O(\\log N)$ AVL hiztegi iraunkorreko bilaketa, txertaketa eta ezabaketa |\n| `btree min key / btree max key / btree range` | Mutur ordenatuak eta `[lo, hi]` tarte-kontsulta |\n| `bset from list / bset union / bset intersect / bset diff` | Multzo ordenatuen aljebra (`BTreeSet`) eta azpimultzo-predikatua |\n| `heap empty / heap push / heap peek / heap pop / heap sort` | `MinHeap` lehentasun-ilara (*leftist heap*) $O(\\log N)$ batuketarekin |\n\n---\n\n## 4. Errezeta praktikoak estilo taularatuan\n\n### 1. errezeta: Fluxu nagusia `btree` erabiliz\n\nIkusi nola `=` ikurrak eta eraldaketa-urratsak taula garbi bat bezala lerrokatuta geratzen diren:\n\n```ridgun\nimport btree\n\nfn :: consultar rango precios () => [String String]\n      consultar rango precios =\n        t0 = btree empty\n        t1 = btree insert t0 \"item:10\" \"Teclado\"\n        t2 = btree insert t1 \"item:20\" \"Monitor\"\n        t3 = btree insert t2 \"item:30\" \"Raton\"\n        btree range t3 \"item:10\" \"item:25\"\n```\n\n### 2. errezeta: Konposizio segurua eta albo-ondoriorik gabea\n\n`btree` lib-eko funtzio oro `ridgun-libs`-eko gainerako 32 lib-ekin konposa daiteke:\n\n```ridgun\nimport btree\n\nfn :: despachar urgente () => (Int, String)\n      despachar urgente =\n        h0 = heap empty\n        h1 = heap push h0 50 \"backup-nocturno\"\n        h2 = heap push h1 10 \"alerta-seguridad\"\n        h3 = heap push h2 30 \"rotar-logs\"\n        heap peek h3\n```\n\n---\n\n## 5. Kaputaren azpian: errendimendua, RMM memoria eta bermeak\n\n- **Berme algoritmikoa eta segurtasunekoa**: AVL biraketa zorrotzak (`height diff <= 1`), HashDoS-en aurkako immunitate osoa, tarte-kontsultak $O(\\log N + K)$-n eta tontorren batuketa $O(\\log N)$-n.\n- **Memoria determinista (`RMM1`/`RMM2`)**: Zero zabor-biltzaile etenaldi; tarteko egitura guztiak modu deterministan askatzen dira esparrutik irtetean.\n- **Etengabeko egiaztapena**: Zorrotz probatua `stable check` eta `src/test/ridgun/test_btree.rg` suite automatizatuaren bidez.\n"}, {"num": "05", "slug": "05-lib-tensor-dimentsio-anitzeko-tentsoreak", "file": "05-lib-tensor-dimentsio-anitzeko-tentsoreak.md", "title": "05. kapitulua: `tensor` lib-a — Dimentsio Anitzeko Tentsoreak, Bistak eta Einsteinen Uzkurdura", "short_title": "`tensor` lib-a — Dimentsio Anitzeko Tentsoreak, Bistak eta Einsteinen Uzkurdura", "markdown": "# 05. kapitulua: `tensor` lib-a — Dimentsio Anitzeko Tentsoreak, Bistak eta Einsteinen Uzkurdura\n\n## 1. Zergatik existitzen da `tensor` lib-a?\n\nIzan gaitezen zintzoak: lengoaia gehienetan erakusle sakabanatuz betetako zerrenda habiaratu motel-motelen edo NumPy/BLAS bezalako 200 MB-ko C++/Fortran bloke erraldoi bat estekatzearen artean aukeratu behar duzu.\n\n**`tensor`** lib-ak Ridgunen `Tensor[...]` primitiba natiboa biltzen du, sorrera tipatua (`Tensor[Int]`, `Tensor[Real]`, `Tensor[U64]`), kopiarik gabeko bistak (`reshape`, `slice`), elementuz elementuko eragiketak (Hadamard), Einsteinen uzkurdura eta 64 biteko `BlaMka` aritmetika eskainiz.\n\n---\n\n## 2. Artefaktuak, inportazioa eta `libc` gabeko arkitektura\n\n`ridgun-libs`-en, **`tensor`** lehen mailako **lib** bat da, `src/main/ridgun/lib/tensor.rg` bidean kokatua (`TENSOR` domeinua). `stable bundle`-ekin konpilatzean, hiru formatu natibotan paketatzen da:\n\n| Artefaktua | Bidea | Helburua |\n|---|---|---|\n| **Ridgun Bundle-a** | `target/bundles/tensor.rglib` | Banaketa eta inportazio zuzena `import tensor` bidez |\n| **Fitxategi konpilatua** | `target/tensor.rgc` | `ridgunc`-ek egiaztatutako tarteko artefaktua |\n| **ELF64 objektu partekatua** | `target/libtensor.so` | C edo `libc` mendekotasunik gabeko liburutegi dinamiko natiboa |\n\n> Lib hau edozein `.rg` fitxategitan erabiltzeko, nahikoa da goiburuan `import tensor` deklaratzea eta bere funtzioei zuriuneekin edo azpimarrarekin deitzea.\n\n---\n\n## 3. `tensor` APIaren erreferentzia azkarra\n\n| Sinadura / Funtzioa / Mota | Zer egiten duen eta noiz erabili |\n|---|---|\n| `tensor zeros int / tensor fill int / tensor zeros real` | 1D/2D `Tensor[Int]` eta `Tensor[Real]` bloke jarraituak esleitzen ditu |\n| `tensor get 1d / tensor set 1d / tensor get 2d / tensor set 2d` | Copy-on-Write (`with [i] = v`) elementuen sarbide eta eguneratze funtzionala |\n| `tensor reshape 1d to 2d / tensor slice 1d` | $O(1)$ deskribatzaile-bistak tentsorearen biltegia kopiatu gabe |\n| `tensor add int / tensor mul int / tensor scale int` | Elementuz elementuko batuketa, biderketa (Hadamard) eta eskalatzea |\n| `tensor dot int / tensor matmul int` | Einsteinen indize-uzkurdura (`a[i] * b[i]`, `a[i, k] * b[k, j]`) |\n| `u64 blamka g / u64 rotr` | 64 biteko zeinurik gabeko `U64` nahasketa birakaria bloke kriptografikoetarako |\n\n---\n\n## 4. Errezeta praktikoak estilo taularatuan\n\n### 1. errezeta: Fluxu nagusia `tensor` erabiliz\n\nIkusi nola `=` ikurrak eta eraldaketa-urratsak taula garbi bat bezala lerrokatuta geratzen diren:\n\n```ridgun\nimport tensor\n\nfn :: producto matricial tensor () => Tensor[Int]\n      producto matricial tensor =\n        a = tensor reshape 1d to 2d (tensor from list int [1, 2, 3, 4]) 2 2\n        b = tensor reshape 1d to 2d (tensor from list int [5, 6, 7, 8]) 2 2\n        tensor matmul int a b\n```\n\n### 2. errezeta: Konposizio segurua eta albo-ondoriorik gabea\n\n`tensor` lib-eko funtzio oro `ridgun-libs`-eko gainerako 32 lib-ekin konposa daiteke:\n\n```ridgun\nimport tensor\n\nfn :: energia vector (xs : [Int]) => (Int, Int)\n      energia vector xs =\n        v   = tensor from list int xs\n        dot = tensor dot int v v\n        mx  = tensor max int v\n        (dot, mx)\n```\n\n---\n\n## 5. Kaputaren azpian: errendimendua, RMM memoria eta bermeak\n\n- **Berme algoritmikoa eta segurtasunekoa**: RMM1/RMM2-k estatikoki kudeatutako gelaxkako 8 byteko memoria jarraitua, $O(1)$ bistak bufferra bikoiztu gabe eta Copy-on-Write semantika hutsa.\n- **Memoria determinista (`RMM1`/`RMM2`)**: Zero zabor-biltzaile etenaldi; tarteko egitura guztiak modu deterministan askatzen dira esparrutik irtetean.\n- **Etengabeko egiaztapena**: Zorrotz probatua `stable check` eta `src/test/ridgun/test_tensor.rg` suite automatizatuaren bidez.\n"}, {"num": "06", "slug": "06-lib-linalg-aljebra-lineala-eta-tentsoreak", "file": "06-lib-linalg-aljebra-lineala-eta-tentsoreak.md", "title": "06. kapitulua: `linalg` lib-a — `Tensor[Real]` gaineko Aljebra Lineala, Bareiss eta Aktibazioak", "short_title": "`linalg` lib-a — `Tensor[Real]` gaineko Aljebra Lineala, Bareiss eta Aktibazioak", "markdown": "# 06. kapitulua: `linalg` lib-a — `Tensor[Real]` gaineko Aljebra Lineala, Bareiss eta Aktibazioak\n\n## 1. Zergatik existitzen da `linalg` lib-a?\n\nIzan gaitezen zintzoak: embedding-etarako kosinu-antzekotasuna kalkulatu, $A x = b$ ebatzi edo bitar arin batean `softmax` geruza bat ebaluatu nahi duzunean, ez dituzu PyTorch edo LAPACKen 400 MB arrastaka eraman nahi.\n\n**`linalg`** lib-ak zenbakizko aljebra lineala eraikitzen du `Tensor[Real]` natiboaren gainean: iraulketa, aztarna, identitatea, biderkadura eskalarrak eta matrizialak Einsteinen notazioarekin, normak ($L_1, L_2, L_\\infty$, Frobenius), determinantea eta $A x = b$ ebazpena **Bareiss/Gauss** algoritmoarekin, eta aktibazio neuronalak (`relu`, `sigmoid`, `softmax`).\n\n---\n\n## 2. Artefaktuak, inportazioa eta `libc` gabeko arkitektura\n\n`ridgun-libs`-en, **`linalg`** lehen mailako **lib** bat da, `src/main/ridgun/lib/linalg.rg` bidean kokatua (`LINALG` domeinua). `stable bundle`-ekin konpilatzean, hiru formatu natibotan paketatzen da:\n\n| Artefaktua | Bidea | Helburua |\n|---|---|---|\n| **Ridgun Bundle-a** | `target/bundles/linalg.rglib` | Banaketa eta inportazio zuzena `import linalg` bidez |\n| **Fitxategi konpilatua** | `target/linalg.rgc` | `ridgunc`-ek egiaztatutako tarteko artefaktua |\n| **ELF64 objektu partekatua** | `target/liblinalg.so` | C edo `libc` mendekotasunik gabeko liburutegi dinamiko natiboa |\n\n> Lib hau edozein `.rg` fitxategitan erabiltzeko, nahikoa da goiburuan `import linalg` deklaratzea eta bere funtzioei zuriuneekin edo azpimarrarekin deitzea.\n\n---\n\n## 3. `linalg` APIaren erreferentzia azkarra\n\n| Sinadura / Funtzioa / Mota | Zer egiten duen eta noiz erabili |\n|---|---|\n| `linalg vec from list / linalg mat from lists` | Ridgun zerrendetatik 1D eta 2D `Tensor[Real]` eraikitzen ditu |\n| `linalg transpose / linalg trace / linalg diag / linalg identity` | Matrizeen egitura-eraldaketak eta identitate-matrizea |\n| `linalg dot / linalg outer / linalg matvec / linalg matmul` | Einstein contraction (`a[i] * b[i]`, `a[i, k] * b[k, j]`) |\n| `linalg norm l1 / linalg norm l2 / linalg cosine similarity` | Bektore/matrize normak, normalizazioa eta kosinu-antzekotasuna |\n| `linalg det / linalg solve` | Bareissen determinante zehatza eta $A x = b$ ebazlea pibotatze partzialarekin (`Option[Tensor[Real]]`) |\n| `linalg relu / linalg sigmoid / linalg softmax` | Maximoaren bidezko desplazamendudun aktibazio neuronal zenbakiz egonkorrak |\n\n---\n\n## 4. Errezeta praktikoak estilo taularatuan\n\n### 1. errezeta: Fluxu nagusia `linalg` erabiliz\n\nIkusi nola `=` ikurrak eta eraldaketa-urratsak taula garbi bat bezala lerrokatuta geratzen diren:\n\n```ridgun\nimport linalg\n\nfn :: resolver sistema lineal () => Option[Tensor[Real]]\n      resolver sistema lineal =\n        -- Resuelve 2x + y = 5, x + 3y = 10 -> x = 1.0, y = 3.0\n        a = linalg mat from lists [[2.0, 1.0], [1.0, 3.0]]\n        b = linalg vec from list [5.0, 10.0]\n        linalg solve a b\n```\n\n### 2. errezeta: Konposizio segurua eta albo-ondoriorik gabea\n\n`linalg` lib-eko funtzio oro `ridgun-libs`-eko gainerako 32 lib-ekin konposa daiteke:\n\n```ridgun\nimport linalg\n\nfn :: puntuar embeddings () => (Real, Tensor[Real])\n      puntuar embeddings =\n        q     = linalg vec from list [1.0, 2.0, 3.0]\n        d     = linalg vec from list [1.0, 2.0, 3.0]\n        sim   = linalg cosine similarity q d\n        probs = linalg softmax q\n        (sim, probs)\n```\n\n---\n\n## 5. Kaputaren azpian: errendimendua, RMM memoria eta bermeak\n\n- **Berme algoritmikoa eta segurtasunekoa**: Matrize singularrek `None` itzultzen dute garbi `linalg solve`-n (`NaN` isilik gabe), eta `linalg softmax`-ek maximoa kentzen du berreketa aurretik gainezkatzeak saihesteko.\n- **Memoria determinista (`RMM1`/`RMM2`)**: Zero zabor-biltzaile etenaldi; tarteko egitura guztiak modu deterministan askatzen dira esparrutik irtetean.\n- **Etengabeko egiaztapena**: Zorrotz probatua `stable check` eta `src/test/ridgun/test_linalg.rg` suite automatizatuaren bidez.\n"}, {"num": "07", "slug": "07-lib-codec-hex-base64-eta-url", "file": "07-lib-codec-hex-base64-eta-url.md", "title": "07. kapitulua: `codec` lib-a — Hex, Base64, Base64url, URL Percent-Encoding eta JSON Arina", "short_title": "`codec` lib-a — Hex, Base64, Base64url, URL Percent-Encoding eta JSON Arina", "markdown": "# 07. kapitulua: `codec` lib-a — Hex, Base64, Base64url, URL Percent-Encoding eta JSON Arina\n\n## 1. Zergatik existitzen da `codec` lib-a?\n\nIzan gaitezen zintzoak: ezerk ez du web integrazio bat azkarragoapurtzen JWT token batean Base64 estandarra (`+/=`) eta Base64url (`-_` betegarririk gabe) nahasteak edo query string bat ihes-karaktererik gabe kateatzeak baino.\n\n**`codec`** lib-ak **RFC 4648** (Hex, Base64 eta Base64url), **RFC 3986** (URLen ehunekozko kodetzea eta `query encode` / `query decode`) eta **JSON arinaren (RFC 8259)** eraikitzaile/erauzleak inplementatzen ditu.\n\n---\n\n## 2. Artefaktuak, inportazioa eta `libc` gabeko arkitektura\n\n`ridgun-libs`-en, **`codec`** lehen mailako **lib** bat da, `src/main/ridgun/lib/codec.rg` bidean kokatua (`CODEC` domeinua). `stable bundle`-ekin konpilatzean, hiru formatu natibotan paketatzen da:\n\n| Artefaktua | Bidea | Helburua |\n|---|---|---|\n| **Ridgun Bundle-a** | `target/bundles/codec.rglib` | Banaketa eta inportazio zuzena `import codec` bidez |\n| **Fitxategi konpilatua** | `target/codec.rgc` | `ridgunc`-ek egiaztatutako tarteko artefaktua |\n| **ELF64 objektu partekatua** | `target/libcodec.so` | C edo `libc` mendekotasunik gabeko liburutegi dinamiko natiboa |\n\n> Lib hau edozein `.rg` fitxategitan erabiltzeko, nahikoa da goiburuan `import codec` deklaratzea eta bere funtzioei zuriuneekin edo azpimarrarekin deitzea.\n\n---\n\n## 3. `codec` APIaren erreferentzia azkarra\n\n| Sinadura / Funtzioa / Mota | Zer egiten duen eta noiz erabili |\n|---|---|\n| `hex encode / hex decode / hex is valid` | RFC 4648 kodeketa hamaseitarra letra xehez eta deskodeketa baliozkotua |\n| `base64 encode / base64 decode` | RFC 4648 §4 Base64 estandarra `=` betegarriarekin |\n| `base64url encode / base64url decode` | URLetarako RFC 4648 §5 Base64url segurua (`-`, `_`, betegarririk gabe) |\n| `url encode / url decode / query encode / query decode` | RFC 3986 ehunekozko kodetzea eta `k=v&...` query string bihurketak |\n| `json quote / json object / json get str / json get int` | AST gabeko JSON serializazio azkarra eta lehen mailako gakoen erauzketa |\n\n---\n\n## 4. Errezeta praktikoak estilo taularatuan\n\n### 1. errezeta: Fluxu nagusia `codec` erabiliz\n\nIkusi nola `=` ikurrak eta eraldaketa-urratsak taula garbi bat bezala lerrokatuta geratzen diren:\n\n```ridgun\nimport codec\n\nfn :: empaquetar parametros (usuario : String) (redir : String) => String\n      empaquetar parametros usuario redir =\n        token_b64 = base64url encode usuario\n        query encode [(\"token\", token_b64), (\"next\", redir)]\n```\n\n### 2. errezeta: Konposizio segurua eta albo-ondoriorik gabea\n\n`codec` lib-eko funtzio oro `ridgun-libs`-eko gainerako 32 lib-ekin konposa daiteke:\n\n```ridgun\nimport codec\n\nfn :: construir respuesta rapida (id : Int) (nombre : String) => (String, Int)\n      construir respuesta rapida id nombre =\n        doc = json object [(\"id\", json int id), (\"name\", json quote nombre), (\"ok\", json bool True)]\n        leido = json get int doc \"id\" 0\n        (doc, leido)\n```\n\n---\n\n## 5. Kaputaren azpian: errendimendua, RMM memoria eta bermeak\n\n- **Berme algoritmikoa eta segurtasunekoa**: Gaizki osatutako sarrera hamaseitar edo Base64-en ukapen determinista (`\"\"` itzuliz mugetatik kanpoko irakurketarik gabe) eta $decode(encode(x)) == x$ itzulgarritasun zehatza.\n- **Memoria determinista (`RMM1`/`RMM2`)**: Zero zabor-biltzaile etenaldi; tarteko egitura guztiak modu deterministan askatzen dira esparrutik irtetean.\n- **Etengabeko egiaztapena**: Zorrotz probatua `stable check` eta `src/test/ridgun/test_codec.rg` suite automatizatuaren bidez.\n"}, {"num": "08", "slug": "08-lib-json-ast-analizatzailea-eta-kontsultak", "file": "08-lib-json-ast-analizatzailea-eta-kontsultak.md", "title": "08. kapitulua: `json` lib-a — RFC 8259 AST Zuhaitz Errekurtsiboa, Pretty-Printer eta Bide-kontsultak", "short_title": "`json` lib-a — RFC 8259 AST Zuhaitz Errekurtsiboa, Pretty-Printer eta Bide-kontsultak", "markdown": "# 08. kapitulua: `json` lib-a — RFC 8259 AST Zuhaitz Errekurtsiboa, Pretty-Printer eta Bide-kontsultak\n\n## 1. Zergatik existitzen da `json` lib-a?\n\nIzan gaitezen zintzoak: lengoaia estatiko askotan JSON habiaratu batean nabigatzeak hiru pantaila kode errepikakor idaztea edo hamar `.and_then()` kateatzea eskatzen du ataka soil bat irakurri aurretik.\n\n**`json`** lib-ak **RFC 8259**-rako jaitsiera errekurtsiboko analizatzaile oso bat eskaintzen du `JsonVal` ADT aljebraikoaren gainean (`JnNull`, `JnBool`, `JnInt`, `JnStr`, `JnArr`, `JnObj`, `JnErr`), serializazio trinkoa zein koskaduna (`json pretty`) eta puntu bidezko bide-kontsultak (`\"server.http.port\"`).\n\n---\n\n## 2. Artefaktuak, inportazioa eta `libc` gabeko arkitektura\n\n`ridgun-libs`-en, **`json`** lehen mailako **lib** bat da, `src/main/ridgun/lib/json.rg` bidean kokatua (`JSON` domeinua). `stable bundle`-ekin konpilatzean, hiru formatu natibotan paketatzen da:\n\n| Artefaktua | Bidea | Helburua |\n|---|---|---|\n| **Ridgun Bundle-a** | `target/bundles/json.rglib` | Banaketa eta inportazio zuzena `import json` bidez |\n| **Fitxategi konpilatua** | `target/json.rgc` | `ridgunc`-ek egiaztatutako tarteko artefaktua |\n| **ELF64 objektu partekatua** | `target/libjson.so` | C edo `libc` mendekotasunik gabeko liburutegi dinamiko natiboa |\n\n> Lib hau edozein `.rg` fitxategitan erabiltzeko, nahikoa da goiburuan `import json` deklaratzea eta bere funtzioei zuriuneekin edo azpimarrarekin deitzea.\n\n---\n\n## 3. `json` APIaren erreferentzia azkarra\n\n| Sinadura / Funtzioa / Mota | Zer egiten duen eta noiz erabili |\n|---|---|\n| `type JsonVal` | `JnNull | JnBool Bool | JnInt Int | JnStr String | JnArr [JsonVal] | JnObj [String JsonVal] | JnErr String` |\n| `json parse / json is ok` | JSON testua `JsonVal` zuhaitzean analizatzen du eta `JnErr` ez dagoela egiaztatu |\n| `json stringify / json pretty` | `JsonVal` JSON trinko edo lerro anitzeko koskadunera serializatzen du |\n| `json get path / json get str / json get int / json get bool` | Objektu eta zerrenda habiaratuak zeharkatzen ditu puntudun bideekin (`\"a.b.0.c\"`) |\n\n---\n\n## 4. Errezeta praktikoak estilo taularatuan\n\n### 1. errezeta: Fluxu nagusia `json` erabiliz\n\nIkusi nola `=` ikurrak eta eraldaketa-urratsak taula garbi bat bezala lerrokatuta geratzen diren:\n\n```ridgun\nimport json\n\nfn :: leer config servidor (raw : String) => (String, Int, Bool)\n      leer config servidor raw =\n        doc  = json parse raw\n        host = json get str doc \"server.host\" \"127.0.0.1\"\n        port = json get int doc \"server.port\" 8080\n        tls  = json get bool doc \"server.tls.enabled\" False\n        (host, port, tls)\n```\n\n### 2. errezeta: Konposizio segurua eta albo-ondoriorik gabea\n\n`json` lib-eko funtzio oro `ridgun-libs`-eko gainerako 32 lib-ekin konposa daiteke:\n\n```ridgun\nimport json\n\nfn :: construir manifiesto () => String\n      construir manifiesto =\n        nodo = JnObj [(\"app\", JnStr \"solstice\"), (\"workers\", JnInt 8), (\"tags\", JnArr [JnStr \"elf64\", JnStr \"rmm2\"])]\n        json pretty nodo 2\n```\n\n---\n\n## 5. Kaputaren azpian: errendimendua, RMM memoria eta bermeak\n\n- **Berme algoritmikoa eta segurtasunekoa**: Erro-balioaren ondorengo zaborraren (`trailing garbage`) ukapen zorrotza, ihes-sekuentzien kudeaketa osoa eta salbuespenik gabeko `JnErr` itzulera segurua.\n- **Memoria determinista (`RMM1`/`RMM2`)**: Zero zabor-biltzaile etenaldi; tarteko egitura guztiak modu deterministan askatzen dira esparrutik irtetean.\n- **Etengabeko egiaztapena**: Zorrotz probatua `stable check` eta `src/test/ridgun/test_json.rg` suite automatizatuaren bidez.\n"}, {"num": "09", "slug": "09-lib-csv-rfc4180-analizatzailea-eta-taulak", "file": "09-lib-csv-rfc4180-analizatzailea-eta-taulak.md", "title": "09. kapitulua: `csv` lib-a — CSV/TSV-rako RFC 4180 Egoera-analizatzailea eta Taula Indexatuak", "short_title": "`csv` lib-a — CSV/TSV-rako RFC 4180 Egoera-analizatzailea eta Taula Indexatuak", "markdown": "# 09. kapitulua: `csv` lib-a — CSV/TSV-rako RFC 4180 Egoera-analizatzailea eta Taula Indexatuak\n\n## 1. Zergatik existitzen da `csv` lib-a?\n\nIzan gaitezen zintzoak: mundu guztiak uste du CSV bat analizatzea `str split lerroa \",\"` egitea dela... harik eta komatxo artean koma bat, `\"\"` komatxo iheskorrak edo gelaxka baten erdian `\\r\\n` lerro-jauzi bat dituen eremu bat agertzen den arte.\n\n**`csv`** lib-ak **RFC 4180** arauarekiko egoera-makina oso bat inplementatzen du CSV eta TSV formatuetarako, komatxo adimentsudun serializazio automatikoa eta goiburu-izenaren araberako zutabeak eta errenkadak kontsultatzeko `CsvTable` mota.\n\n---\n\n## 2. Artefaktuak, inportazioa eta `libc` gabeko arkitektura\n\n`ridgun-libs`-en, **`csv`** lehen mailako **lib** bat da, `src/main/ridgun/lib/csv.rg` bidean kokatua (`CSV` domeinua). `stable bundle`-ekin konpilatzean, hiru formatu natibotan paketatzen da:\n\n| Artefaktua | Bidea | Helburua |\n|---|---|---|\n| **Ridgun Bundle-a** | `target/bundles/csv.rglib` | Banaketa eta inportazio zuzena `import csv` bidez |\n| **Fitxategi konpilatua** | `target/csv.rgc` | `ridgunc`-ek egiaztatutako tarteko artefaktua |\n| **ELF64 objektu partekatua** | `target/libcsv.so` | C edo `libc` mendekotasunik gabeko liburutegi dinamiko natiboa |\n\n> Lib hau edozein `.rg` fitxategitan erabiltzeko, nahikoa da goiburuan `import csv` deklaratzea eta bere funtzioei zuriuneekin edo azpimarrarekin deitzea.\n\n---\n\n## 3. `csv` APIaren erreferentzia azkarra\n\n| Sinadura / Funtzioa / Mota | Zer egiten duen eta noiz erabili |\n|---|---|\n| `csv parse / tsv parse / csv parse with` | CSV/TSV testua (`\"\"` ihesak eta lerro anitzeko gelaxkak barne) `[[String]]`-ra analizatzen du |\n| `csv stringify / tsv stringify` | `[[String]]` serializatzen du, bereizleak, komatxoak edo jauziak dituzten gelaxkak soilik komatxo artean jarriz |\n| `csv parse table / csv get cell / csv col` | Goiburuz indexatutako `CsvTable` kontsulta `(errenkada, zutabe_izena)` bidez edo zutabe osoa |\n| `csv row to kv / csv table to kv list` | Errenkada taularatuak goiburuz indexatutako `[String String]` hiztegietara bihurtzen ditu |\n\n---\n\n## 4. Errezeta praktikoak estilo taularatuan\n\n### 1. errezeta: Fluxu nagusia `csv` erabiliz\n\nIkusi nola `=` ikurrak eta eraldaketa-urratsak taula garbi bat bezala lerrokatuta geratzen diren:\n\n```ridgun\nimport csv\n\nfn :: extraer columna precios (raw_csv : String) => ([String], String)\n      extraer columna precios raw_csv =\n        tabla   = csv parse table raw_csv\n        precios = csv col tabla \"precio\"\n        primero = csv get cell tabla 0 \"producto\" \"desconocido\"\n        (precios, primero)\n```\n\n### 2. errezeta: Konposizio segurua eta albo-ondoriorik gabea\n\n`csv` lib-eko funtzio oro `ridgun-libs`-eko gainerako 32 lib-ekin konposa daiteke:\n\n```ridgun\nimport csv\n\nfn :: exportar informe () => String\n      exportar informe =\n        filas = [[\"id\", \"nota\"], [\"1\", \"Contiene, coma\"], [\"2\", \"Dijo \"hola\"\"]]\n        csv stringify filas\n```\n\n---\n\n## 5. Kaputaren azpian: errendimendua, RMM memoria eta bermeak\n\n- **Berme algoritmikoa eta segurtasunekoa**: `\\r\\n` eta `\\n` lerro-jauzien euskarri zehatza komatxoen barruan zein kanpoan, eta zero datu-galera `csv parse (csv stringify errenkadak)` joan-etorrietan.\n- **Memoria determinista (`RMM1`/`RMM2`)**: Zero zabor-biltzaile etenaldi; tarteko egitura guztiak modu deterministan askatzen dira esparrutik irtetean.\n- **Etengabeko egiaztapena**: Zorrotz probatua `stable check` eta `src/test/ridgun/test_csv.rg` suite automatizatuaren bidez.\n"}, {"num": "10", "slug": "10-lib-ini-ini-eta-dotenv-konfigurazioa", "file": "10-lib-ini-ini-eta-dotenv-konfigurazioa.md", "title": "10. kapitulua: `ini` lib-a — Atalkako `.ini` Fitxategiak, `.env` eta Aldagaien Interpolazioa", "short_title": "`ini` lib-a — Atalkako `.ini` Fitxategiak, `.env` eta Aldagaien Interpolazioa", "markdown": "# 10. kapitulua: `ini` lib-a — Atalkako `.ini` Fitxategiak, `.env` eta Aldagaien Interpolazioa\n\n## 1. Zergatik existitzen da `ini` lib-a?\n\nIzan gaitezen zintzoak: `.env` eta `.ini` fitxategiak hutsalkeriak dirudite norbaitek `export KEY=\"balioa # traolarekin\"`, lerro amaierako `;` iruzkinak edo aldagaien arteko erreferentzia gurutzatuak gehitzen dituen arte.\n\n**`ini`** lib-ak ataldun `.ini` konfigurazioak (`[database]`) eta `export` aurrizkidun `.env` fitxategiak analizatzen ditu, komatxo barruko `#` eta `;` ikurrak mantenduz eta `dotenv parse`-n aldagaien interpolazioak ebatziz.\n\n---\n\n## 2. Artefaktuak, inportazioa eta `libc` gabeko arkitektura\n\n`ridgun-libs`-en, **`ini`** lehen mailako **lib** bat da, `src/main/ridgun/lib/ini.rg` bidean kokatua (`INI` domeinua). `stable bundle`-ekin konpilatzean, hiru formatu natibotan paketatzen da:\n\n| Artefaktua | Bidea | Helburua |\n|---|---|---|\n| **Ridgun Bundle-a** | `target/bundles/ini.rglib` | Banaketa eta inportazio zuzena `import ini` bidez |\n| **Fitxategi konpilatua** | `target/ini.rgc` | `ridgunc`-ek egiaztatutako tarteko artefaktua |\n| **ELF64 objektu partekatua** | `target/libini.so` | C edo `libc` mendekotasunik gabeko liburutegi dinamiko natiboa |\n\n> Lib hau edozein `.rg` fitxategitan erabiltzeko, nahikoa da goiburuan `import ini` deklaratzea eta bere funtzioei zuriuneekin edo azpimarrarekin deitzea.\n\n---\n\n## 3. `ini` APIaren erreferentzia azkarra\n\n| Sinadura / Funtzioa / Mota | Zer egiten duen eta noiz erabili |\n|---|---|\n| `ini parse / ini stringify` | Atalkako `.ini` testua `IniDoc`-era analizatzen du eta testu kanonikora serializatzen du |\n| `ini get / ini get int / ini get bool / ini set` | Atal+gako bidezko kontsulta tipatuak (`\"\"` atal globalerako) eta eguneratze aldaezina |\n| `ini sections / ini section map` | Atal-izen guztiak zerrendatzen ditu edo atal baten `[String String]` mapa erauzten du |\n| `dotenv parse` | `.env` lerroak analizatzen ditu (`export K=V`, komatxoak, iruzkinak eta aldagaien hedapena) |\n\n---\n\n## 4. Errezeta praktikoak estilo taularatuan\n\n### 1. errezeta: Fluxu nagusia `ini` erabiliz\n\nIkusi nola `=` ikurrak eta eraldaketa-urratsak taula garbi bat bezala lerrokatuta geratzen diren:\n\n```ridgun\nimport ini\n\nfn :: cargar base de datos (texto_ini : String) => (String, Int, Bool)\n      cargar base de datos texto_ini =\n        doc  = ini parse texto_ini\n        host = ini get doc \"database\" \"host\" \"localhost\"\n        port = ini get int doc \"database\" \"port\" 5432\n        pool = ini get bool doc \"database\" \"pool\" True\n        (host, port, pool)\n```\n\n### 2. errezeta: Konposizio segurua eta albo-ondoriorik gabea\n\n`ini` lib-eko funtzio oro `ridgun-libs`-eko gainerako 32 lib-ekin konposa daiteke:\n\n```ridgun\nimport ini\n\nfn :: actualizar puerto (doc : IniDoc) (nuevo : String) => String\n      actualizar puerto doc nuevo =\n        doc2 = ini set doc \"database\" \"port\" nuevo\n        ini stringify doc2\n```\n\n---\n\n## 5. Kaputaren azpian: errendimendua, RMM memoria eta bermeak\n\n- **Berme algoritmikoa eta segurtasunekoa**: Errespetu osoa `#` eta `;` karaktereekiko komatxo sinple edo bikoitzen artean agertzen direnean, eta bihurketa boolear malgua (`true/1/yes/on` vs `false/0/no/off`).\n- **Memoria determinista (`RMM1`/`RMM2`)**: Zero zabor-biltzaile etenaldi; tarteko egitura guztiak modu deterministan askatzen dira esparrutik irtetean.\n- **Etengabeko egiaztapena**: Zorrotz probatua `stable check` eta `src/test/ridgun/test_ini.rg` suite automatizatuaren bidez.\n"}, {"num": "11", "slug": "11-lib-regex-thompson-nfa-motor-lineala", "file": "11-lib-regex-thompson-nfa-motor-lineala.md", "title": "11. kapitulua: `regex` lib-a — $O(N \\cdot M)$ Denbora Linealeko Thompson NFA Adierazpen Erregularren Motorra", "short_title": "`regex` lib-a — $O(N \\cdot M)$ Denbora Linealeko Thompson NFA Adierazpen Erregularren Motorra", "markdown": "# 11. kapitulua: `regex` lib-a — $O(N \\cdot M)$ Denbora Linealeko Thompson NFA Adierazpen Erregularren Motorra\n\n## 1. Zergatik existitzen da `regex` lib-a?\n\nIzan gaitezen zintzoak: *backtracking* bidezko adierazpen erregularren motorrek erorketa global ospetsuak eragin dituzte (Cloudflare edo StackOverflow-n bezala) `(a+)+b` bezalako eredu batek hogeita hamar `a` jarraian jasotzen dituenean eta $O(2^N)$ denbora esponentzialean sartzen denean.\n\n**`regex`** lib-ak zure adierazpen erregularrak (`.`, `*`, `+`, `?`, `|`, `()`, `[a-z]`, `[^...]`, `^`, `$`, `\\d`, `\\w`, `\\s`) **Thompsonen automata finitu ez-determinista (NFA)** batera konpilatzen ditu eta egoera-multzoa urratsez urrats aurreratzen du **$O(N \\cdot M)$** denbora lineal zorrotzean, **ReDoS erasoak matematikoki ezinezko** bihurtuz.\n\n---\n\n## 2. Artefaktuak, inportazioa eta `libc` gabeko arkitektura\n\n`ridgun-libs`-en, **`regex`** lehen mailako **lib** bat da, `src/main/ridgun/lib/regex.rg` bidean kokatua (`REGEX` domeinua). `stable bundle`-ekin konpilatzean, hiru formatu natibotan paketatzen da:\n\n| Artefaktua | Bidea | Helburua |\n|---|---|---|\n| **Ridgun Bundle-a** | `target/bundles/regex.rglib` | Banaketa eta inportazio zuzena `import regex` bidez |\n| **Fitxategi konpilatua** | `target/regex.rgc` | `ridgunc`-ek egiaztatutako tarteko artefaktua |\n| **ELF64 objektu partekatua** | `target/libregex.so` | C edo `libc` mendekotasunik gabeko liburutegi dinamiko natiboa |\n\n> Lib hau edozein `.rg` fitxategitan erabiltzeko, nahikoa da goiburuan `import regex` deklaratzea eta bere funtzioei zuriuneekin edo azpimarrarekin deitzea.\n\n---\n\n## 3. `regex` APIaren erreferentzia azkarra\n\n| Sinadura / Funtzioa / Mota | Zer egiten duen eta noiz erabili |\n|---|---|\n| `regex match / regex is match` | Kate osoaren bat-etortzea eta azpikate-bilaketa $O(N \\cdot M)$ denbora linealean |\n| `regex find / regex find all` | Bat datorren lehen azpikatea edo gainjartzerik gabeko guztiak erauzten ditu |\n| `regex replace / regex replace all` | Adierazpen erregularraren lehen bat-etortzea edo guztiak ordezkatzen ditu |\n| `regex split / regex escape` | Testua regex bereizle baten arabera zatitzen du eta metakaraktereak ihes egiten ditu |\n\n---\n\n## 4. Errezeta praktikoak estilo taularatuan\n\n### 1. errezeta: Fluxu nagusia `regex` erabiliz\n\nIkusi nola `=` ikurrak eta eraldaketa-urratsak taula garbi bat bezala lerrokatuta geratzen diren:\n\n```ridgun\nimport regex\n\nfn :: extraer codigos postales (texto : String) => [String]\n      extraer codigos postales texto =\n        regex find all \"\\\\d+\" texto\n```\n\n### 2. errezeta: Konposizio segurua eta albo-ondoriorik gabea\n\n`regex` lib-eko funtzio oro `ridgun-libs`-eko gainerako 32 lib-ekin konposa daiteke:\n\n```ridgun\nimport regex\n\nfn :: censurar telefonos (comentario : String) => (Bool, String)\n      censurar telefonos comentario =\n        tiene = regex is match \"\\\\d+-\\\\d+\" comentario\n        limpio = regex replace all \"\\\\d+-\\\\d+\" comentario \"[TELEFONO]\"\n        (tiene, limpio)\n```\n\n---\n\n## 5. Kaputaren azpian: errendimendua, RMM memoria eta bermeak\n\n- **Berme algoritmikoa eta segurtasunekoa**: NFA egoera-multzoaren simulazioa pilaren errekurtsio kontrolatu gaberik gabe eta $O(N \\cdot M)$ denbora bermatua baita `(a+)+b` eredu patologikoen aurrean ere.\n- **Memoria determinista (`RMM1`/`RMM2`)**: Zero zabor-biltzaile etenaldi; tarteko egitura guztiak modu deterministan askatzen dira esparrutik irtetean.\n- **Etengabeko egiaztapena**: Zorrotz probatua `stable check` eta `src/test/ridgun/test_regex.rg` suite automatizatuaren bidez.\n"}, {"num": "12", "slug": "12-lib-glob-komodinak-eta-iragazketa", "file": "12-lib-glob-komodinak-eta-iragazketa.md", "title": "12. kapitulua: `glob` lib-a — Komodin-ereduak (`*`, `?`, `[a-z]`) eta Zerrenden Iragazketa", "short_title": "`glob` lib-a — Komodin-ereduak (`*`, `?`, `[a-z]`) eta Zerrenden Iragazketa", "markdown": "# 12. kapitulua: `glob` lib-a — Komodin-ereduak (`*`, `?`, `[a-z]`) eta Zerrenden Iragazketa\n\n## 1. Zergatik existitzen da `glob` lib-a?\n\nIzan gaitezen zintzoak: fitxategi bat `*.rg`-rekin amaitzen den edo `test_[0-9]*.rg`-rekin hasten den egiaztatzeko adierazpen erregular oso bat erabiltzea euliak kanoikadaka hiltzea da.\n\n**`glob`** lib-ak shell komodinen bat-etortze zehatza (`*`, `?`, `[a-z]` klaseak, `[!0-9]` / `[^a-z]` klase ukatuak), letra larri/xeheekiko aldaera sentikorrak (`glob match ci`) eta bide-zerrenden iragazketa zuzena inplementatzen ditu.\n\n---\n\n## 2. Artefaktuak, inportazioa eta `libc` gabeko arkitektura\n\n`ridgun-libs`-en, **`glob`** lehen mailako **lib** bat da, `src/main/ridgun/lib/glob.rg` bidean kokatua (`GLOB` domeinua). `stable bundle`-ekin konpilatzean, hiru formatu natibotan paketatzen da:\n\n| Artefaktua | Bidea | Helburua |\n|---|---|---|\n| **Ridgun Bundle-a** | `target/bundles/glob.rglib` | Banaketa eta inportazio zuzena `import glob` bidez |\n| **Fitxategi konpilatua** | `target/glob.rgc` | `ridgunc`-ek egiaztatutako tarteko artefaktua |\n| **ELF64 objektu partekatua** | `target/libglob.so` | C edo `libc` mendekotasunik gabeko liburutegi dinamiko natiboa |\n\n> Lib hau edozein `.rg` fitxategitan erabiltzeko, nahikoa da goiburuan `import glob` deklaratzea eta bere funtzioei zuriuneekin edo azpimarrarekin deitzea.\n\n---\n\n## 3. `glob` APIaren erreferentzia azkarra\n\n| Sinadura / Funtzioa / Mota | Zer egiten duen eta noiz erabili |\n|---|---|\n| `glob match / glob match ci` | ASCII letra larri/xeheekiko sentikorra edo ez-sentikorra den glob bat-etortzea |\n| `glob filter / glob any match` | `[String]` iragazten du edo zerrenda bateko ereduren bat bat datorren egiaztatzen du |\n| `glob has magic` | Kate batek komodin-metakaraktereak (`*`, `?`, `[`) dituen detektatzen du |\n\n---\n\n## 4. Errezeta praktikoak estilo taularatuan\n\n### 1. errezeta: Fluxu nagusia `glob` erabiliz\n\nIkusi nola `=` ikurrak eta eraldaketa-urratsak taula garbi bat bezala lerrokatuta geratzen diren:\n\n```ridgun\nimport glob\n\nfn :: seleccionar fuentes ridgun (archivos : [String]) => [String]\n      seleccionar fuentes ridgun archivos =\n        glob filter \"test_[a-z]*.rg\" archivos\n```\n\n### 2. errezeta: Konposizio segurua eta albo-ondoriorik gabea\n\n`glob` lib-eko funtzio oro `ridgun-libs`-eko gainerako 32 lib-ekin konposa daiteke:\n\n```ridgun\nimport glob\n\nfn :: es ruta excluida (ruta : String) => Bool\n      es ruta excluida ruta =\n        glob any match [\"*.tmp\", \"*.bak\", \"target/*\"] ruta\n```\n\n---\n\n## 5. Kaputaren azpian: errendimendua, RMM memoria eta bermeak\n\n- **Berme algoritmikoa eta segurtasunekoa**: Ondoz ondoko izarren kolapso automatikoa (`***` $\\rightarrow$ `*`) atzera-egite erredundanteak saihesteko eta itxi gabeko `[` kortxeteen kudeaketa segurua.\n- **Memoria determinista (`RMM1`/`RMM2`)**: Zero zabor-biltzaile etenaldi; tarteko egitura guztiak modu deterministan askatzen dira esparrutik irtetean.\n- **Etengabeko egiaztapena**: Zorrotz probatua `stable check` eta `src/test/ridgun/test_glob.rg` suite automatizatuaren bidez.\n"}, {"num": "13", "slug": "13-lib-diff-lcs-konparazioa-eta-adabakiak", "file": "13-lib-diff-lcs-konparazioa-eta-adabakiak.md", "title": "13. kapitulua: `diff` lib-a — LCS Algoritmoa, Edizio-distantzia, Unified Diff eta Adabakiak", "short_title": "`diff` lib-a — LCS Algoritmoa, Edizio-distantzia, Unified Diff eta Adabakiak", "markdown": "# 13. kapitulua: `diff` lib-a — LCS Algoritmoa, Edizio-distantzia, Unified Diff eta Adabakiak\n\n## 1. Zergatik existitzen da `diff` lib-a?\n\nIzan gaitezen zintzoak: test batek huts egiten duenean edo konfigurazio-fitxategi bat aldatzen denean, 200 lerroko `\"expected A, got B\"` lehor batek zein lerro zehatz aldatu den bilatzen begiak uztera behartzen zaitu.\n\n**`diff`** lib-ak **Azpisekuentzia Komun Luzeena (LCS)** kalkulatzen du 2D `Tensor[Int]` baten gainean edizio minimoak (`DiffKeep`, `DiffAdd`, `DiffDel`), edizio-distantzia, estatistikak, **Unified Diff** formatua eta `diff apply` bidezko berreraikuntza zehatza sortzeko.\n\n---\n\n## 2. Artefaktuak, inportazioa eta `libc` gabeko arkitektura\n\n`ridgun-libs`-en, **`diff`** lehen mailako **lib** bat da, `src/main/ridgun/lib/diff.rg` bidean kokatua (`DIFF` domeinua). `stable bundle`-ekin konpilatzean, hiru formatu natibotan paketatzen da:\n\n| Artefaktua | Bidea | Helburua |\n|---|---|---|\n| **Ridgun Bundle-a** | `target/bundles/diff.rglib` | Banaketa eta inportazio zuzena `import diff` bidez |\n| **Fitxategi konpilatua** | `target/diff.rgc` | `ridgunc`-ek egiaztatutako tarteko artefaktua |\n| **ELF64 objektu partekatua** | `target/libdiff.so` | C edo `libc` mendekotasunik gabeko liburutegi dinamiko natiboa |\n\n> Lib hau edozein `.rg` fitxategitan erabiltzeko, nahikoa da goiburuan `import diff` deklaratzea eta bere funtzioei zuriuneekin edo azpimarrarekin deitzea.\n\n---\n\n## 3. `diff` APIaren erreferentzia azkarra\n\n| Sinadura / Funtzioa / Mota | Zer egiten duen eta noiz erabili |\n|---|---|\n| `type DiffOp` | `DiffKeep String | DiffDel String | DiffAdd String` |\n| `diff lines / diff text` | `[String]` zerrenden edo lerro anitzeko testuen arteko LCS edizio-gidoi minimoa kalkulatzen du |\n| `diff edit distance / diff stats` | Txertaketa+ezabaketa distantzia minimoa eta `(kept, added, deleted)` zenbaketa |\n| `diff format / diff unified` | `+ / - /  ` lerro trinkoak edo goiburudun Unified Diff estandarra errenderizatzen ditu |\n| `diff apply / diff apply text` | Helburuko dokumentua galerarik gabe berreraikitzen du edizio-gidoitik abiatuta |\n\n---\n\n## 4. Errezeta praktikoak estilo taularatuan\n\n### 1. errezeta: Fluxu nagusia `diff` erabiliz\n\nIkusi nola `=` ikurrak eta eraldaketa-urratsak taula garbi bat bezala lerrokatuta geratzen diren:\n\n```ridgun\nimport diff\n\nfn :: auditar cambio (antes : String) (despues : String) => (Int, String)\n      auditar cambio antes despues =\n        dist   = diff edit distance ( [\"host=localhost\", \"port=8080\"] ) ( [\"host=0.0.0.0\", \"port=8080\"] )\n        parche = diff unified \"config.old\" \"config.new\" antes despues\n        (dist, parche)\n```\n\n### 2. errezeta: Konposizio segurua eta albo-ondoriorik gabea\n\n`diff` lib-eko funtzio oro `ridgun-libs`-eko gainerako 32 lib-ekin konposa daiteke:\n\n```ridgun\nimport diff\n\nfn :: verificar parche (orig : [String]) (nuevo : [String]) => [String]\n      verificar parche orig nuevo =\n        ops = diff lines orig nuevo\n        diff apply ops\n```\n\n---\n\n## 5. Kaputaren azpian: errendimendua, RMM memoria eta bermeak\n\n- **Berme algoritmikoa eta segurtasunekoa**: $diff\\_edit\\_distance(a, b) == |a| + |b| - 2 \\cdot LCS(a, b)$ identitate matematiko bermatua eta galerarik gabeko berreraikuntza: `diff apply (diff lines a b) == b`.\n- **Memoria determinista (`RMM1`/`RMM2`)**: Zero zabor-biltzaile etenaldi; tarteko egitura guztiak modu deterministan askatzen dira esparrutik irtetean.\n- **Etengabeko egiaztapena**: Zorrotz probatua `stable check` eta `src/test/ridgun/test_diff.rg` suite automatizatuaren bidez.\n"}, {"num": "14", "slug": "14-lib-template-mustache-txantiloi-seguruak", "file": "14-lib-template-mustache-txantiloi-seguruak.md", "title": "14. kapitulua: `template` lib-a — HTML eta LaTeX Auto-ihesa duten Mustache Txantiloi Seguruak", "short_title": "`template` lib-a — HTML eta LaTeX Auto-ihesa duten Mustache Txantiloi Seguruak", "markdown": "# 14. kapitulua: `template` lib-a — HTML eta LaTeX Auto-ihesa duten Mustache Txantiloi Seguruak\n\n## 1. Zergatik existitzen da `template` lib-a?\n\nIzan gaitezen zintzoak: HTML orriak edo LaTeX txostenak kateak eskuz lotuz muntatzea XSS ahultasun baterako (`<script>`) edo `%` zein `_` ikur soil batek zure PDFaren konpilazioa apurtzeko errezeta perfektua da.\n\n**`template`** lib-ak logika arbitrariorik gabeko **Mustache** motor bat eskaintzen du testuinguruko auto-ihesarekin (`TmplPlain`, `TmplHtml`, `TmplLatex`), ordezkapen gordin esplizituarekin (`{{{raw}}}` / `{{&raw}}`), iruzkinekin (`{{! ... }}`) eta atal baldintzatuekin (`{{#sec}}` / `{{^sec}}`).\n\n---\n\n## 2. Artefaktuak, inportazioa eta `libc` gabeko arkitektura\n\n`ridgun-libs`-en, **`template`** lehen mailako **lib** bat da, `src/main/ridgun/lib/template.rg` bidean kokatua (`TMPL` domeinua). `stable bundle`-ekin konpilatzean, hiru formatu natibotan paketatzen da:\n\n| Artefaktua | Bidea | Helburua |\n|---|---|---|\n| **Ridgun Bundle-a** | `target/bundles/template.rglib` | Banaketa eta inportazio zuzena `import template` bidez |\n| **Fitxategi konpilatua** | `target/template.rgc` | `ridgunc`-ek egiaztatutako tarteko artefaktua |\n| **ELF64 objektu partekatua** | `target/libtemplate.so` | C edo `libc` mendekotasunik gabeko liburutegi dinamiko natiboa |\n\n> Lib hau edozein `.rg` fitxategitan erabiltzeko, nahikoa da goiburuan `import template` deklaratzea eta bere funtzioei zuriuneekin edo azpimarrarekin deitzea.\n\n---\n\n## 3. `template` APIaren erreferentzia azkarra\n\n| Sinadura / Funtzioa / Mota | Zer egiten duen eta noiz erabili |\n|---|---|\n| `tmpl render / tmpl render html / tmpl render latex` | Mustache txantiloiak errenderizatzen ditu auto-ihes lau, HTML edo LaTeXekin |\n| `tmpl escape html / tmpl escape latex` | `& < > \" '` HTMLrako edo `\\ { } & % $ # _ ~ ^` LaTeXerako ihes egiten ditu |\n| `tmpl extract vars / tmpl has unclosed tags` | Beharrezko aldagai-izenak erauzten ditu eta etiketen oreka egiaztatzen du |\n\n---\n\n## 4. Errezeta praktikoak estilo taularatuan\n\n### 1. errezeta: Fluxu nagusia `template` erabiliz\n\nIkusi nola `=` ikurrak eta eraldaketa-urratsak taula garbi bat bezala lerrokatuta geratzen diren:\n\n```ridgun\nimport template\n\nfn :: renderizar perfil html (usuario : String) (es_admin : String) => String\n      renderizar perfil html usuario es_admin =\n        plantilla = \"<h1>Hola {{user}}</h1>{{#admin}}<span class='badge'>Admin</span>{{/admin}}\"\n        vars      = [(\"user\", usuario), (\"admin\", es_admin)]\n        tmpl render html plantilla vars\n```\n\n### 2. errezeta: Konposizio segurua eta albo-ondoriorik gabea\n\n`template` lib-eko funtzio oro `ridgun-libs`-eko gainerako 32 lib-ekin konposa daiteke:\n\n```ridgun\nimport template\n\nfn :: generar linea latex (metrica : String) => String\n      generar linea latex metrica =\n        -- Escapa automaticamente % _ & # para que LaTeX no falle\n        tmpl render latex \"Resultado: {{val}}\" [(\"val\", metrica)]\n```\n\n---\n\n## 5. Kaputaren azpian: errendimendua, RMM memoria eta bermeak\n\n- **Berme algoritmikoa eta segurtasunekoa**: XSS prebentzioa lehenetsita `tmpl render html`-n (`&`, `<`, `>`, `\"`, `'` ihes eginez), `{{{var}}}`-k konfiantzazko zatiak esplizituki txertatzea ahalbidetzen duen bitartean.\n- **Memoria determinista (`RMM1`/`RMM2`)**: Zero zabor-biltzaile etenaldi; tarteko egitura guztiak modu deterministan askatzen dira esparrutik irtetean.\n- **Etengabeko egiaztapena**: Zorrotz probatua `stable check` eta `src/test/ridgun/test_template.rg` suite automatizatuaren bidez.\n"}, {"num": "15", "slug": "15-lib-fmt-formateatzaile-taularatua-eta-nabarmentzailea", "file": "15-lib-fmt-formateatzaile-taularatua-eta-nabarmentzailea.md", "title": "15. kapitulua: `fmt` lib-a — 2D Formateatzaile Taularatu Kanonikoa eta 9 Formatuko Sintaxi-nabarmentzailea", "short_title": "`fmt` lib-a — 2D Formateatzaile Taularatu Kanonikoa eta 9 Formatuko Sintaxi-nabarmentzailea", "markdown": "# 15. kapitulua: `fmt` lib-a — 2D Formateatzaile Taularatu Kanonikoa eta 9 Formatuko Sintaxi-nabarmentzailea\n\n## 1. Zergatik existitzen da `fmt` lib-a?\n\nIzan gaitezen zintzoak: Ridgun kodearen edertasuna ezin hobeto lerrokatutako zutabe taularatuetan datza (`::`, `=`, `|`, `->`, `--`), baina zuriuneak eskuz lerrokatzea edo kode koloreztatua terminal, HTML eta LaTeXerako esportatzea neketsua da.\n\n**`fmt`** lib-a Ridgunen 2D formateatze taularatuko eta nabarmentze lexikoko motor ofiziala da: `fn ::` sinadurak, ekuazioak, `|` zainak eta `--` iruzkinak lerrokatzen ditu, eta **9 irteera-formatutara** esportatzen du (`FmtPlain`, `FmtTty`, `FmtTrueColor`, `FmtHtmlInline`, `FmtHtmlCss`, `FmtMarkdown`, `FmtPango`, `FmtLatex`, `FmtRtf`).\n\n---\n\n## 2. Artefaktuak, inportazioa eta `libc` gabeko arkitektura\n\n`ridgun-libs`-en, **`fmt`** lehen mailako **lib** bat da, `src/main/ridgun/lib/fmt.rg` bidean kokatua (`FMT` domeinua). `stable bundle`-ekin konpilatzean, hiru formatu natibotan paketatzen da:\n\n| Artefaktua | Bidea | Helburua |\n|---|---|---|\n| **Ridgun Bundle-a** | `target/bundles/fmt.rglib` | Banaketa eta inportazio zuzena `import fmt` bidez |\n| **Fitxategi konpilatua** | `target/fmt.rgc` | `ridgunc`-ek egiaztatutako tarteko artefaktua |\n| **ELF64 objektu partekatua** | `target/libfmt.so` | C edo `libc` mendekotasunik gabeko liburutegi dinamiko natiboa |\n\n> Lib hau edozein `.rg` fitxategitan erabiltzeko, nahikoa da goiburuan `import fmt` deklaratzea eta bere funtzioei zuriuneekin edo azpimarrarekin deitzea.\n\n---\n\n## 3. `fmt` APIaren erreferentzia azkarra\n\n| Sinadura / Funtzioa / Mota | Zer egiten duen eta noiz erabili |\n|---|---|\n| `fmt source / fmt source with` | Ridgun iturburu-kodea formateatzen du 2D zutabe-lerrokatze taularatu kanonikoarekin |\n| `fmt check` | `True` itzultzen du kodeak dagoeneko `fmt source` diseinu kanonikoa betetzen badu |\n| `fmt render / fmt render with` | Kodea formateatu eta koloreztatzen du 9 `FmtTarget` irteera-formatuetako edozeinetara |\n| `fmt tokenize line` | Lerro bat `TokKeyword`, `TokType`, `TokOperator`, `TokString`, `TokNumber`, `TokComment`-etan tokenizatzen du |\n\n---\n\n## 4. Errezeta praktikoak estilo taularatuan\n\n### 1. errezeta: Fluxu nagusia `fmt` erabiliz\n\nIkusi nola `=` ikurrak eta eraldaketa-urratsak taula garbi bat bezala lerrokatuta geratzen diren:\n\n```ridgun\nimport fmt\n\nfn :: formatear y verificar (codigo : String) => (String, Bool)\n      formatear y verificar codigo =\n        limpio = fmt source codigo\n        es_ok  = fmt check limpio\n        (limpio, es_ok)\n```\n\n### 2. errezeta: Konposizio segurua eta albo-ondoriorik gabea\n\n`fmt` lib-eko funtzio oro `ridgun-libs`-eko gainerako 32 lib-ekin konposa daiteke:\n\n```ridgun\nimport fmt\n\nfn :: exportar bloque html (codigo : String) => String\n      exportar bloque html codigo =\n        fmt render codigo FmtHtmlCss\n```\n\n---\n\n## 5. Kaputaren azpian: errendimendua, RMM memoria eta bermeak\n\n- **Berme algoritmikoa eta segurtasunekoa**: Idempotentzia zorrotza (`fmt source (fmt source s) == fmt source s`) eta token semantikoen % 100eko kontserbazioa.\n- **Memoria determinista (`RMM1`/`RMM2`)**: Zero zabor-biltzaile etenaldi; tarteko egitura guztiak modu deterministan askatzen dira esparrutik irtetean.\n- **Etengabeko egiaztapena**: Zorrotz probatua `stable check` eta `src/test/ridgun/test_fmt.rg` suite automatizatuaren bidez.\n"}, {"num": "16", "slug": "16-lib-cli-argumentuak-eta-ingurunea", "file": "16-lib-cli-argumentuak-eta-ingurunea.md", "title": "16. kapitulua: `cli` lib-a — Banderak, Aukerak, `--` Hesia, Azpikomandoak eta Ingurune-aldagaiak", "short_title": "`cli` lib-a — Banderak, Aukerak, `--` Hesia, Azpikomandoak eta Ingurune-aldagaiak", "markdown": "# 16. kapitulua: `cli` lib-a — Banderak, Aukerak, `--` Hesia, Azpikomandoak eta Ingurune-aldagaiak\n\n## 1. Zergatik existitzen da `cli` lib-a?\n\nIzan gaitezen zintzoak: `argv` eskuz analizatzea begizta xalo batekin hasten da beti, eta apurtzen amaitzen du norbaitek `-la` elkartuta, `--port=9090` berdin ikurrarekin edo `--` eta jarraian marratxoz hasten den `-fitxategia.rg` bat pasatzen duenean.\n\n**`cli`** lib-ak bandera luzeak (`--verbose`), laburrak (`-v`), elkartuak (`-la`), baliodun aukerak (`--port=8080`, `--port 8080`, `-p 8080`), POSIX `--` bereizlea, argumentu posizionalak, azpikomandoak eta ingurune-aldagaien irakurketa tipatua ebazten ditu.\n\n---\n\n## 2. Artefaktuak, inportazioa eta `libc` gabeko arkitektura\n\n`ridgun-libs`-en, **`cli`** lehen mailako **lib** bat da, `src/main/ridgun/lib/cli.rg` bidean kokatua (`CLI` domeinua). `stable bundle`-ekin konpilatzean, hiru formatu natibotan paketatzen da:\n\n| Artefaktua | Bidea | Helburua |\n|---|---|---|\n| **Ridgun Bundle-a** | `target/bundles/cli.rglib` | Banaketa eta inportazio zuzena `import cli` bidez |\n| **Fitxategi konpilatua** | `target/cli.rgc` | `ridgunc`-ek egiaztatutako tarteko artefaktua |\n| **ELF64 objektu partekatua** | `target/libcli.so` | C edo `libc` mendekotasunik gabeko liburutegi dinamiko natiboa |\n\n> Lib hau edozein `.rg` fitxategitan erabiltzeko, nahikoa da goiburuan `import cli` deklaratzea eta bere funtzioei zuriuneekin edo azpimarrarekin deitzea.\n\n---\n\n## 3. `cli` APIaren erreferentzia azkarra\n\n| Sinadura / Funtzioa / Mota | Zer egiten duen eta noiz erabili |\n|---|---|\n| `cli has flag : [String] -> String -> String -> Bool` | `--` aurretik `--long`, `-s` edo `-xyz` bandera elkartuak detektatzen ditu |\n| `cli get opt / cli get int opt` | Testuzko edo zenbaki osozko aukera (`--k=v`, `--k v`, `-k v`) erauzten du lehenetsitako balioarekin |\n| `cli positionals / cli subcommand` | Argumentu posizionalak biltzen ditu (`--` ondorengo guztia barne) |\n| `env get or / env get int or / env get bool or` | Ingurune-aldagaiak irakurtzen ditu bihurketa tipatu eta ordezko balioekin |\n\n---\n\n## 4. Errezeta praktikoak estilo taularatuan\n\n### 1. errezeta: Fluxu nagusia `cli` erabiliz\n\nIkusi nola `=` ikurrak eta eraldaketa-urratsak taula garbi bat bezala lerrokatuta geratzen diren:\n\n```ridgun\nimport cli\n\nfn :: analizar comando (args : [String]) => (String, Bool, Int, [String])\n      analizar comando args =\n        sub   = cli subcommand args\n        all_f = cli has flag args \"--all\" \"-a\"\n        port  = cli get int opt args \"--port\" \"-p\" 8080\n        arch  = cli positionals args [\"--port\", \"-p\"]\n        (sub, all_f, port, arch)\n```\n\n### 2. errezeta: Konposizio segurua eta albo-ondoriorik gabea\n\n`cli` lib-eko funtzio oro `ridgun-libs`-eko gainerako 32 lib-ekin konposa daiteke:\n\n```ridgun\nimport cli\n\nfn :: leer config entorno () => (Int, Bool)\n      leer config entorno =\n        workers = env get int or \"SOLSTICE_WORKERS\" 4\n        debug   = env get bool or \"SOLSTICE_DEBUG\" False\n        (workers, debug)\n```\n\n---\n\n## 5. Kaputaren azpian: errendimendua, RMM memoria eta bermeak\n\n- **Berme algoritmikoa eta segurtasunekoa**: POSIX `--` bereizlearen errespetu zorrotza: `--`-ren eskuinean dagoen inongo argumenturik ez da inoiz banderatzat hartzen.\n- **Memoria determinista (`RMM1`/`RMM2`)**: Zero zabor-biltzaile etenaldi; tarteko egitura guztiak modu deterministan askatzen dira esparrutik irtetean.\n- **Etengabeko egiaztapena**: Zorrotz probatua `stable check` eta `src/test/ridgun/test_cli.rg` suite automatizatuaren bidez.\n"}, {"num": "17", "slug": "17-lib-path-posix-bideak-eta-segurtasuna", "file": "17-lib-path-posix-bideak-eta-segurtasuna.md", "title": "17. kapitulua: `path` lib-a — POSIX Normalizazioa (`path clean`) eta Path Traversal Aurkako Konfinamendua", "short_title": "`path` lib-a — POSIX Normalizazioa (`path clean`) eta Path Traversal Aurkako Konfinamendua", "markdown": "# 17. kapitulua: `path` lib-a — POSIX Normalizazioa (`path clean`) eta Path Traversal Aurkako Konfinamendua\n\n## 1. Zergatik existitzen da `path` lib-a?\n\nIzan gaitezen zintzoak: bideak `base + \"/\" + fitxategia` eginez lotzea, `..` segmentuak garbitu eta aurrizkiak baliozkotu gabe, zure web zerbitzarian norbaitek `../../etc/passwd` eskatzeko atea zabalik uztea bezala da.\n\n**`path`** lib-ak POSIX normalizazio lexikoa (`path clean`, Go-ren `filepath.Clean` estiloan), lotura segurua (`path join`), deskonposizioa (`dirname`, `basename`, `stem`, `ext`, `replace ext`) eta direktorio-ihesen aurkako **`path is safe subpath`** (`VUL-INJ-001`) segurtasun-predikatua inplementatzen ditu.\n\n---\n\n## 2. Artefaktuak, inportazioa eta `libc` gabeko arkitektura\n\n`ridgun-libs`-en, **`path`** lehen mailako **lib** bat da, `src/main/ridgun/lib/path.rg` bidean kokatua (`PATH` domeinua). `stable bundle`-ekin konpilatzean, hiru formatu natibotan paketatzen da:\n\n| Artefaktua | Bidea | Helburua |\n|---|---|---|\n| **Ridgun Bundle-a** | `target/bundles/path.rglib` | Banaketa eta inportazio zuzena `import path` bidez |\n| **Fitxategi konpilatua** | `target/path.rgc` | `ridgunc`-ek egiaztatutako tarteko artefaktua |\n| **ELF64 objektu partekatua** | `target/libpath.so` | C edo `libc` mendekotasunik gabeko liburutegi dinamiko natiboa |\n\n> Lib hau edozein `.rg` fitxategitan erabiltzeko, nahikoa da goiburuan `import path` deklaratzea eta bere funtzioei zuriuneekin edo azpimarrarekin deitzea.\n\n---\n\n## 3. `path` APIaren erreferentzia azkarra\n\n| Sinadura / Funtzioa / Mota | Zer egiten duen eta noiz erabili |\n|---|---|\n| `path clean / path join / path join list` | `//`, `.` eta `..` lexikoki kolapsatzen ditu eta bide-segmentuak lotzen ditu |\n| `path dirname / path basename / path split` | Bide bat guraso-direktorioan eta azken fitxategi-izenean zatitzen du |\n| `path ext / path stem / path replace ext` | Luzapena erauzi edo aldatzen du (`.bashrc` erro gisa eta `\"\"` luzapen gisa tratatuz) |\n| `path is safe subpath : String -> String -> Bool` | `rel` `base_dir` barruan zorrotz geratzen dela eta NUL byterik ez duela egiaztatzen du |\n\n---\n\n## 4. Errezeta praktikoak estilo taularatuan\n\n### 1. errezeta: Fluxu nagusia `path` erabiliz\n\nIkusi nola `=` ikurrak eta eraldaketa-urratsak taula garbi bat bezala lerrokatuta geratzen diren:\n\n```ridgun\nimport path\n\nfn :: resolver archivo estatico (raiz : String) (peticion : String) => (Bool, String)\n      resolver archivo estatico raiz peticion =\n        seguro = path is safe subpath raiz peticion\n        ruta   = path join raiz peticion\n        (seguro, ruta)\n```\n\n### 2. errezeta: Konposizio segurua eta albo-ondoriorik gabea\n\n`path` lib-eko funtzio oro `ridgun-libs`-eko gainerako 32 lib-ekin konposa daiteke:\n\n```ridgun\nimport path\n\nfn :: cambiar salida a objeto (fuente : String) => (String, String, String)\n      cambiar salida a objeto fuente =\n        dir = path dirname fuente\n        nom = path stem fuente\n        obj = path replace ext (path clean fuente) \".rglib\"\n        (dir, nom, obj)\n```\n\n---\n\n## 5. Kaputaren azpian: errendimendua, RMM memoria eta bermeak\n\n- **Berme algoritmikoa eta segurtasunekoa**: `path is safe subpath`-ek bide absolutuak, NUL byteak eta erro-direktoriotik zein `/srv/www-secret` bezalako aurrizki anaietatik ihes egiten saiatzen den edozein `..` sekuentzia ukatzen ditu.\n- **Memoria determinista (`RMM1`/`RMM2`)**: Zero zabor-biltzaile etenaldi; tarteko egitura guztiak modu deterministan askatzen dira esparrutik irtetean.\n- **Etengabeko egiaztapena**: Zorrotz probatua `stable check` eta `src/test/ridgun/test_path.rg` suite automatizatuaren bidez.\n"}, {"num": "18", "slug": "18-lib-time-utc-egutegia-iso8601-eta-backoff", "file": "18-lib-time-utc-egutegia-iso8601-eta-backoff.md", "title": "18. kapitulua: `time` lib-a — UTC Egutegi Zibila (Hinnant), ISO-8601, Iraupenak eta Backoff-a", "short_title": "`time` lib-a — UTC Egutegi Zibila (Hinnant), ISO-8601, Iraupenak eta Backoff-a", "markdown": "# 18. kapitulua: `time` lib-a — UTC Egutegi Zibila (Hinnant), ISO-8601, Iraupenak eta Backoff-a\n\n## 1. Zergatik existitzen da `time` lib-a?\n\nIzan gaitezen zintzoak: `libc`-ko data-funtzioak (`localtime`, `gmtime`, `mktime`) egoera global aldakorraren (`TZ`) menpe daude, ez dira hari-seguruak eta huts egiten dute 1900 vs 2000 bezalako bisurte-arauetan.\n\n**`time`** lib-ak **Howard Hinnanten $O(1)$** egutegi zibil gregoriano proleptikoaren algoritmoa, **ISO-8601 / RFC 3339** (`YYYY-MM-DDTHH:MM:SSZ`) formateatze eta analisi zorrotza, iraupen irakurgarriak (`1h 1m 1s 5ms`) eta sare-berriro saiatzeetarako *exponential backoff* kalkulua inplementatzen ditu.\n\n---\n\n## 2. Artefaktuak, inportazioa eta `libc` gabeko arkitektura\n\n`ridgun-libs`-en, **`time`** lehen mailako **lib** bat da, `src/main/ridgun/lib/time.rg` bidean kokatua (`TIME` domeinua). `stable bundle`-ekin konpilatzean, hiru formatu natibotan paketatzen da:\n\n| Artefaktua | Bidea | Helburua |\n|---|---|---|\n| **Ridgun Bundle-a** | `target/bundles/time.rglib` | Banaketa eta inportazio zuzena `import time` bidez |\n| **Fitxategi konpilatua** | `target/time.rgc` | `ridgunc`-ek egiaztatutako tarteko artefaktua |\n| **ELF64 objektu partekatua** | `target/libtime.so` | C edo `libc` mendekotasunik gabeko liburutegi dinamiko natiboa |\n\n> Lib hau edozein `.rg` fitxategitan erabiltzeko, nahikoa da goiburuan `import time` deklaratzea eta bere funtzioei zuriuneekin edo azpimarrarekin deitzea.\n\n---\n\n## 3. `time` APIaren erreferentzia azkarra\n\n| Sinadura / Funtzioa / Mota | Zer egiten duen eta noiz erabili |\n|---|---|\n| `time epoch to utc / time utc to epoch` | $O(1)$ bihurketa Unix epoch segundoen eta `(year, month, day, hour, min, sec)` artean |\n| `time is leap year / time days in month / time day of week` | Bisurte-arauak (`400 / 100 / 4`), hileko egunak eta ISO asteguna (`1=Ast..7=Iga`) |\n| `time format iso8601 / time parse iso8601` | `YYYY-MM-DDTHH:MM:SSZ` datak formateatu eta baliozkotzen ditu (`-1` otsailak 30 bezalakoetan) |\n| `time format duration ms / time backoff ms` | Iraupen irakurgarriak eta $base \\cdot 2^{attempt}$ atzerapen esponentzial mugatuak |\n\n---\n\n## 4. Errezeta praktikoak estilo taularatuan\n\n### 1. errezeta: Fluxu nagusia `time` erabiliz\n\nIkusi nola `=` ikurrak eta eraldaketa-urratsak taula garbi bat bezala lerrokatuta geratzen diren:\n\n```ridgun\nimport time\n\nfn :: registrar evento temporal (epoch_s : Int) => (String, Int, String)\n      registrar evento temporal epoch_s =\n        iso = time format iso8601 epoch_s\n        sem = time day of week epoch_s\n        dur = time format duration ms 3661005\n        (iso, sem, dur)\n```\n\n### 2. errezeta: Konposizio segurua eta albo-ondoriorik gabea\n\n`time` lib-eko funtzio oro `ridgun-libs`-eko gainerako 32 lib-ekin konposa daiteke:\n\n```ridgun\nimport time\n\nfn :: planificar reintentos () => [Int]\n      planificar reintentos =\n        [time backoff ms 0 100 5000, time backoff ms 1 100 5000, time backoff ms 2 100 5000, time backoff ms 9 100 5000]\n```\n\n---\n\n## 5. Kaputaren azpian: errendimendua, RMM memoria eta bermeak\n\n- **Berme algoritmikoa eta segurtasunekoa**: $O(1)$ egutegi-bihurketa urtez urteko begiztarik gabe eta hileko egunen baliozkotze zorrotza (bisurte ez diren urteetako otsailaren 29a ukatuz).\n- **Memoria determinista (`RMM1`/`RMM2`)**: Zero zabor-biltzaile etenaldi; tarteko egitura guztiak modu deterministan askatzen dira esparrutik irtetean.\n- **Etengabeko egiaztapena**: Zorrotz probatua `stable check` eta `src/test/ridgun/test_time.rg` suite automatizatuaren bidez.\n"}, {"num": "19", "slug": "19-lib-uuid-identifikatzaileak-crc32-eta-prng", "file": "19-lib-uuid-identifikatzaileak-crc32-eta-prng.md", "title": "19. kapitulua: `uuid` lib-a — RFC 9562 `UUIDv4`/`UUIDv7`, FNV-1a, Adler-32, CRC-32 eta PRNG", "short_title": "`uuid` lib-a — RFC 9562 `UUIDv4`/`UUIDv7`, FNV-1a, Adler-32, CRC-32 eta PRNG", "markdown": "# 19. kapitulua: `uuid` lib-a — RFC 9562 `UUIDv4`/`UUIDv7`, FNV-1a, Adler-32, CRC-32 eta PRNG\n\n## 1. Zergatik existitzen da `uuid` lib-a?\n\nIzan gaitezen zintzoak: datu-base batean gako nagusi gisa erabat ausazko `UUIDv4`-ak erabiltzeak B-Tree indizeak zatikatzen ditu, eta nukleoaren entropiarik gabeko etxeko IDak asmatzeak talketan amaitzen du.\n\n**`uuid`** lib-ak **`UUIDv4`** (nukleoaren CSPRNG bidezko ausazkoa) eta **`UUIDv7`** (**RFC 9562** arauaren arabera lehen 48 bitetan kronologikoki ordenatua), egiaztapen-batura azkarrak (**FNV-1a**, **Adler-32**, **CRC-32 IEEE 802.3**) eta hazidun PRNG determinista bat inplementatzen ditu.\n\n---\n\n## 2. Artefaktuak, inportazioa eta `libc` gabeko arkitektura\n\n`ridgun-libs`-en, **`uuid`** lehen mailako **lib** bat da, `src/main/ridgun/lib/uuid.rg` bidean kokatua (`UUID` domeinua). `stable bundle`-ekin konpilatzean, hiru formatu natibotan paketatzen da:\n\n| Artefaktua | Bidea | Helburua |\n|---|---|---|\n| **Ridgun Bundle-a** | `target/bundles/uuid.rglib` | Banaketa eta inportazio zuzena `import uuid` bidez |\n| **Fitxategi konpilatua** | `target/uuid.rgc` | `ridgunc`-ek egiaztatutako tarteko artefaktua |\n| **ELF64 objektu partekatua** | `target/libuuid.so` | C edo `libc` mendekotasunik gabeko liburutegi dinamiko natiboa |\n\n> Lib hau edozein `.rg` fitxategitan erabiltzeko, nahikoa da goiburuan `import uuid` deklaratzea eta bere funtzioei zuriuneekin edo azpimarrarekin deitzea.\n\n---\n\n## 3. `uuid` APIaren erreferentzia azkarra\n\n| Sinadura / Funtzioa / Mota | Zer egiten duen eta noiz erabili |\n|---|---|\n| `uuid v4 / uuid v7 / uuid v7 at` | 36 karaktereko RFC 9562 v4 (ausazkoa) eta v7 (denboraz ordenatua) UUID kanonikoak sortzen ditu |\n| `uuid is valid / uuid version` | 8-4-4-4-12 egitura
