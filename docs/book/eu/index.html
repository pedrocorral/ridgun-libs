eta RFC 9562 aldaera-bitak (`8, 9, a, b`) baliozkotzen ditu |\n| `fnv1a 32 / adler32 / crc32 / crc32 hex` | 32 biteko hash ez-kriptografiko eta egiaztapen-batura azkarrak |\n| `prng next / prng range` | Proba eta simulazio errepikagarrietarako PRNG kongruentzial lineal funtzional hutsa |\n\n---\n\n## 4. Errezeta praktikoak estilo taularatuan\n\n### 1. errezeta: Fluxu nagusia `uuid` erabiliz\n\nIkusi nola `=` ikurrak eta eraldaketa-urratsak taula garbi bat bezala lerrokatuta geratzen diren:\n\n```ridgun\nimport uuid\n\nfn :: generar ids ordenados () => (String, String, Bool)\n      generar ids ordenados =\n        id1 = uuid v7 at 1000\n        id2 = uuid v7 at 2000\n        ok  = (uuid is valid id1) and (id1 < id2)\n        (id1, id2, ok)\n```\n\n### 2. errezeta: Konposizio segurua eta albo-ondoriorik gabea\n\n`uuid` lib-eko funtzio oro `ridgun-libs`-eko gainerako 32 lib-ekin konposa daiteke:\n\n```ridgun\nimport uuid\n\nfn :: firmar paquete (payload : String) => (String, Int)\n      firmar paquete payload =\n         (crc32 hex payload, fnv1a 32 payload)\n```\n\n---\n\n## 5. Kaputaren azpian: errendimendua, RMM memoria eta bermeak\n\n- **Berme algoritmikoa eta segurtasunekoa**: `uuid v7 at t1 < uuid v7 at t2`-k denborarekin hazten den ordena lexikografiko monotonoa bermatzen du, `btree` indizeetarako eta datu-baseetarako aproposa.\n- **Memoria determinista (`RMM1`/`RMM2`)**: Zero zabor-biltzaile etenaldi; tarteko egitura guztiak modu deterministan askatzen dira esparrutik irtetean.\n- **Etengabeko egiaztapena**: Zorrotz probatua `stable check` eta `src/test/ridgun/test_uuid.rg` suite automatizatuaren bidez.\n"}, {"num": "20", "slug": "20-lib-log-ndjson-erregistroa-eta-sekretuak", "file": "20-lib-log-ndjson-erregistroa-eta-sekretuak.md", "title": "20. kapitulua: `log` lib-a — NDJSON Erregistro Egituratua eta Sekretuen Ezkutatze Automatikoa", "short_title": "`log` lib-a — NDJSON Erregistro Egituratua eta Sekretuen Ezkutatze Automatikoa", "markdown": "# 20. kapitulua: `log` lib-a — NDJSON Erregistro Egituratua eta Sekretuen Ezkutatze Automatikoa\n\n## 1. Zergatik existitzen da `log` lib-a?\n\nIzan gaitezen zintzoak: eskaera bateko eremuak log fitxategi batera irauli eta aste batzuk geroago `password`, `api_key` edo `authorization` testu lauan gorde dituzula deskubritzea segurtasun-gertakari klasiko bat da.\n\n**`log`** lib-ak larritasunaren araberako iragazketa (`DEBUG`, `INFO`, `WARN`, `ERROR`), giza testuko eta **NDJSON egituratuko** formateatzea, eta **gako sentikorren ezkutatze automatikoa** (`password`, `secret`, `token`, `api_key`, `authorization`, `cookie`, `private_key` $\\rightarrow$ `\"[REDACTED]\"`, `VUL-LOG-001` arinduz) eskaintzen ditu.\n\n---\n\n## 2. Artefaktuak, inportazioa eta `libc` gabeko arkitektura\n\n`ridgun-libs`-en, **`log`** lehen mailako **lib** bat da, `src/main/ridgun/lib/log.rg` bidean kokatua (`LOG` domeinua). `stable bundle`-ekin konpilatzean, hiru formatu natibotan paketatzen da:\n\n| Artefaktua | Bidea | Helburua |\n|---|---|---|\n| **Ridgun Bundle-a** | `target/bundles/log.rglib` | Banaketa eta inportazio zuzena `import log` bidez |\n| **Fitxategi konpilatua** | `target/log.rgc` | `ridgunc`-ek egiaztatutako tarteko artefaktua |\n| **ELF64 objektu partekatua** | `target/liblog.so` | C edo `libc` mendekotasunik gabeko liburutegi dinamiko natiboa |\n\n> Lib hau edozein `.rg` fitxategitan erabiltzeko, nahikoa da goiburuan `import log` deklaratzea eta bere funtzioei zuriuneekin edo azpimarrarekin deitzea.\n\n---\n\n## 3. `log` APIaren erreferentzia azkarra\n\n| Sinadura / Funtzioa / Mota | Zer egiten duen eta noiz erabili |\n|---|---|\n| `log level rank / log should emit` | Log mailak (`DEBUG=10`, `INFO=20`, `WARN=30`, `ERROR=40`) atalase aktiboarekin konparatzen ditu |\n| `log is sensitive key / log redact fields` | Gako sekretuen balioak `\"[REDACTED]\"`-ekin ordezkatzen ditu letra larri/xeheak kontuan hartu gabe |\n| `log format text / log format json` | `gako=balio` testu-lerroak edo RFC 8259 NDJSON formateatzen ditu sekretuen ezkutatze automatikoarekin |\n\n---\n\n## 4. Errezeta praktikoak estilo taularatuan\n\n### 1. errezeta: Fluxu nagusia `log` erabiliz\n\nIkusi nola `=` ikurrak eta eraldaketa-urratsak taula garbi bat bezala lerrokatuta geratzen diren:\n\n```ridgun\nimport log\n\nfn :: auditar login (usuario : String) (clave : String) => String\n      auditar login usuario clave =\n        campos = [(\"user\", usuario), (\"password\", clave), (\"ip\", \"10.0.0.1\")]\n        log format json \"INFO\" \"intento de acceso\" campos\n```\n\n### 2. errezeta: Konposizio segurua eta albo-ondoriorik gabea\n\n`log` lib-eko funtzio oro `ridgun-libs`-eko gainerako 32 lib-ekin konposa daiteke:\n\n```ridgun\nimport log\n\nfn :: emitir si procede (umbral : String) (nivel : String) (msg : String) => String\n      emitir si procede umbral nivel msg =\n        | log should emit umbral nivel = log format text nivel msg [(\"service\", \"solstice\")]\n        | otherwise                    = \"\"\n```\n\n---\n\n## 5. Kaputaren azpian: errendimendua, RMM memoria eta bermeak\n\n- **Berme algoritmikoa eta segurtasunekoa**: Bai `log format text`-ek eta bai `log format json`-ek eremuak `log redact fields`-etik pasatzen dituzte beti serializatu aurretik, inongo sekreturik ahaztuta ez isurtzea bermatuz.\n- **Memoria determinista (`RMM1`/`RMM2`)**: Zero zabor-biltzaile etenaldi; tarteko egitura guztiak modu deterministan askatzen dira esparrutik irtetean.\n- **Etengabeko egiaztapena**: Zorrotz probatua `stable check` eta `src/test/ridgun/test_log.rg` suite automatizatuaren bidez.\n"}, {"num": "21", "slug": "21-lib-test-baieztapen-unitarioak-eta-funtzionalak", "file": "21-lib-test-baieztapen-unitarioak-eta-funtzionalak.md", "title": "21. kapitulua: `test` lib-a — Baieztapen Unitario eta Funtzionalen Primitibak (`RG-011`)", "short_title": "`test` lib-a — Baieztapen Unitario eta Funtzionalen Primitibak (`RG-011`)", "markdown": "# 21. kapitulua: `test` lib-a — Baieztapen Unitario eta Funtzionalen Primitibak (`RG-011`)\n\n## 1. Zergatik existitzen da `test` lib-a?\n\nIzan gaitezen zintzoak: test framework batek makro magikoak, exekuzio-garaiko isla edo kanpoko runner astun bat eskatzen dituenean, probak idazteak berehalakoa izateari uzten dio.\n\n**`test`** lib-ak (`RG-011`) baieztapen huts, polimorfiko eta motaren araberakoak eskaintzen ditu, espero zen eta lortutako balioekin `[FAIL]` diagnostiko argiak igorriz eta irteera-kode `1`-ekin amaituz.\n\n---\n\n## 2. Artefaktuak, inportazioa eta `libc` gabeko arkitektura\n\n`ridgun-libs`-en, **`test`** lehen mailako **lib** bat da, `src/main/ridgun/lib/test.rg` bidean kokatua (`TST` domeinua). `stable bundle`-ekin konpilatzean, hiru formatu natibotan paketatzen da:\n\n| Artefaktua | Bidea | Helburua |\n|---|---|---|\n| **Ridgun Bundle-a** | `target/bundles/test.rglib` | Banaketa eta inportazio zuzena `import test` bidez |\n| **Fitxategi konpilatua** | `target/test.rgc` | `ridgunc`-ek egiaztatutako tarteko artefaktua |\n| **ELF64 objektu partekatua** | `target/libtest.so` | C edo `libc` mendekotasunik gabeko liburutegi dinamiko natiboa |\n\n> Lib hau edozein `.rg` fitxategitan erabiltzeko, nahikoa da goiburuan `import test` deklaratzea eta bere funtzioei zuriuneekin edo azpimarrarekin deitzea.\n\n---\n\n## 3. `test` APIaren erreferentzia azkarra\n\n| Sinadura / Funtzioa / Mota | Zer egiten duen eta noiz erabili |\n|---|---|\n| `assert equals / assert eq : A -> A -> String -> ()` | Berdintasun-baieztapen polimorfikoa proba-kasuaren etiketa deskribatzailearekin |\n| `assert int equals / assert str eq` | `Int` eta `String`-entzako berdintasun-baieztapen espezializatuak |\n| `assert true / assert false / assert not` | Aldaezin boolearren baieztapenak (`True` / `False`) |\n| `assert ok : Int -> String -> ()` | Sistema edo socket baten egoera-kodea `0` (`OK`) dela egiaztatzen du |\n\n---\n\n## 4. Errezeta praktikoak estilo taularatuan\n\n### 1. errezeta: Fluxu nagusia `test` erabiliz\n\nIkusi nola `=` ikurrak eta eraldaketa-urratsak taula garbi bat bezala lerrokatuta geratzen diren:\n\n```ridgun\nimport test\nimport math\n\nfn :: suite matematicas () => ()\n      suite matematicas =\n        _ = assert int equals 12 (math gcd 36 60) \"MCD de 36 y 60\"\n        _ = assert true (math is prime 97) \"97 es primo\"\n        echo \"[PASS] suite matematicas\"\n```\n\n### 2. errezeta: Konposizio segurua eta albo-ondoriorik gabea\n\n`test` lib-eko funtzio oro `ridgun-libs`-eko gainerako 32 lib-ekin konposa daiteke:\n\n```ridgun\nimport test\n\nfn :: verificar codigo sistema (rc : Int) => ()\n      verificar codigo sistema rc =\n        assert ok rc \"operacion de descriptor exitosa\"\n```\n\n---\n\n## 5. Kaputaren azpian: errendimendua, RMM memoria eta bermeak\n\n- **Berme algoritmikoa eta segurtasunekoa**: `ridgun-libs`-eko 30 proba-suiteak (`src/test/ridgun/test_*.rg`, 4 000 lerro baino gehiago) lib honekin exekutatzen dira `stable test` bidez.\n- **Memoria determinista (`RMM1`/`RMM2`)**: Zero zabor-biltzaile etenaldi; tarteko egitura guztiak modu deterministan askatzen dira esparrutik irtetean.\n- **Etengabeko egiaztapena**: Zorrotz probatua `stable check` eta `src/test/ridgun/test_test.rg` suite automatizatuaren bidez.\n"}, {"num": "22", "slug": "22-lib-posix-pal-geruza-erlojuak-eta-seinaleak", "file": "22-lib-posix-pal-geruza-erlojuak-eta-seinaleak.md", "title": "22. kapitulua: `posix` lib-a — Plataforma Abstrakzio Geruza (PAL), Erlojuak, Seinaleak eta CSPRNG", "short_title": "`posix` lib-a — Plataforma Abstrakzio Geruza (PAL), Erlojuak, Seinaleak eta CSPRNG", "markdown": "# 22. kapitulua: `posix` lib-a — Plataforma Abstrakzio Geruza (PAL), Erlojuak, Seinaleak eta CSPRNG\n\n## 1. Zergatik existitzen da `posix` lib-a?\n\nIzan gaitezen zintzoak: `O_CREAT`, `O_NONBLOCK` bezalako banderak edo syscall zenbakiak aldatu egiten dira Linux, macOS eta arkitekturen artean (`X86_64` vs `Arm64`), eta C-n dena `#ifdef` oihan irakurgaitz batekin konpontzen da.\n\n**`posix`** lib-ak Ridgunen 2 mailako **Plataforma Abstrakzio Geruza (PAL)** inplementatzen du `sys os` (`Linux | MacOS | Windows`) eta `sys arch` (`X86_64 | Arm64 | RiscV64`) gaineko zain taularatuak erabiliz, deskribatzaileen zundaketaz (`wait fd`), erloju monotonoez (`RGF-017`), seinaleez (`RGF-018`) eta nukleoaren CSPRNG entropiaz (`sys random bytes`) gain.\n\n---\n\n## 2. Artefaktuak, inportazioa eta `libc` gabeko arkitektura\n\n`ridgun-libs`-en, **`posix`** lehen mailako **lib** bat da, `src/main/ridgun/lib/posix.rg` bidean kokatua (`POSIX` domeinua). `stable bundle`-ekin konpilatzean, hiru formatu natibotan paketatzen da:\n\n| Artefaktua | Bidea | Helburua |\n|---|---|---|\n| **Ridgun Bundle-a** | `target/bundles/posix.rglib` | Banaketa eta inportazio zuzena `import posix` bidez |\n| **Fitxategi konpilatua** | `target/posix.rgc` | `ridgunc`-ek egiaztatutako tarteko artefaktua |\n| **ELF64 objektu partekatua** | `target/libposix.so` | C edo `libc` mendekotasunik gabeko liburutegi dinamiko natiboa |\n\n> Lib hau edozein `.rg` fitxategitan erabiltzeko, nahikoa da goiburuan `import posix` deklaratzea eta bere funtzioei zuriuneekin edo azpimarrarekin deitzea.\n\n---\n\n## 3. `posix` APIaren erreferentzia azkarra\n\n| Sinadura / Funtzioa / Mota | Zer egiten duen eta noiz erabili |\n|---|---|\n| `pal open create trunc wr / pal o nonblock` | SE banderen itzulpena `sys os`-en arabera (`Linux | MacOS | Windows`) |\n| `wait fd : Int -> Int -> Int -> PollStatus` | Deskribatzaile bat zundatzen du `PollReady`, `PollTimeout` edo `PollError errno` itzuliz |\n| `clock monotonic ms / clock monotonic ns / clock wall ms` | Erloju monotonoak eta UTC horma-erlojua milisegundotan (`RGF-017`) |\n| `signal watch / signal poll / sys random bytes` | Seinaleen zundaketa ez-blokeatzailea (`SIGINT`, `SIGTERM`) eta nukleoaren CSPRNG byteak |\n| `read text / write text / file exists / run cmd` | Goi-mailako fitxategi S/I, direktorio-eragiketak eta azpiprozesuen bilgarriak |\n\n---\n\n## 4. Errezeta praktikoak estilo taularatuan\n\n### 1. errezeta: Fluxu nagusia `posix` erabiliz\n\nIkusi nola `=` ikurrak eta eraldaketa-urratsak taula garbi bat bezala lerrokatuta geratzen diren:\n\n```ridgun\nimport posix\n\nfn :: medir operacion () => (Int, Int)\n      medir operacion =\n        t0  = clock monotonic ms\n        rnd = len (sys random bytes 32)\n        t1  = clock monotonic ms\n        (rnd, t1 - t0)\n```\n\n### 2. errezeta: Konposizio segurua eta albo-ondoriorik gabea\n\n`posix` lib-eko funtzio oro `ridgun-libs`-eko gainerako 32 lib-ekin konposa daiteke:\n\n```ridgun\nimport posix\n\nfn :: esperar lectura (fd : Int) => Bool\n      esperar lectura fd =\n        est = wait fd fd poll_in 100\n        est == PollReady\n```\n\n---\n\n## 5. Kaputaren azpian: errendimendua, RMM memoria eta bermeak\n\n- **Berme algoritmikoa eta segurtasunekoa**: Helburuko bitarrari ez dagozkion `sys os` eta `sys arch` adarrak konpilazio-garaian ezabatzen ditu (Dead-Code Elimination) `ridgunc`-ek.\n- **Memoria determinista (`RMM1`/`RMM2`)**: Zero zabor-biltzaile etenaldi; tarteko egitura guztiak modu deterministan askatzen dira esparrutik irtetean.\n- **Etengabeko egiaztapena**: Zorrotz probatua `stable check` eta `src/test/ridgun/test_posix.rg` suite automatizatuaren bidez.\n"}, {"num": "23", "slug": "23-lib-io-timeout-bidezko-sarrera-irteera", "file": "23-lib-io-timeout-bidezko-sarrera-irteera.md", "title": "23. kapitulua: `io` lib-a — `IoResult` Errore Tipatuak, `with timeout` bidezko S/I eta Prozesuak", "short_title": "`io` lib-a — `IoResult` Errore Tipatuak, `with timeout` bidezko S/I eta Prozesuak", "markdown": "# 23. kapitulua: `io` lib-a — `IoResult` Errore Tipatuak, `with timeout` bidezko S/I eta Prozesuak\n\n## 1. Zergatik existitzen da `io` lib-a?\n\nIzan gaitezen zintzoak: epemugarik (`timeout`) gabeko `read()` dei bat edo ume-azpiprozesu bat zintzilikatutako baliabide bakar batek zure zerbitzariko langile guztiak agortzeko gonbidapena da.\n\n**`io`** lib-ak sistemaren eragiketa bakoitza ADT esplizituekin modelatzen du (`IoError`, `IoResult[A]`), blokeatzailea ez den `ppoll` Ridgunen `with timeout wait_ms do` kuota lexikoekin uztartzen du eta `read fd ... timeout` zein `write fd ... timeout` mixfix eragileak eskaintzen ditu.\n\n---\n\n## 2. Artefaktuak, inportazioa eta `libc` gabeko arkitektura\n\n`ridgun-libs`-en, **`io`** lehen mailako **lib** bat da, `src/main/ridgun/lib/io.rg` bidean kokatua (`IO` domeinua). `stable bundle`-ekin konpilatzean, hiru formatu natibotan paketatzen da:\n\n| Artefaktua | Bidea | Helburua |\n|---|---|---|\n| **Ridgun Bundle-a** | `target/bundles/io.rglib` | Banaketa eta inportazio zuzena `import io` bidez |\n| **Fitxategi konpilatua** | `target/io.rgc` | `ridgunc`-ek egiaztatutako tarteko artefaktua |\n| **ELF64 objektu partekatua** | `target/libio.so` | C edo `libc` mendekotasunik gabeko liburutegi dinamiko natiboa |\n\n> Lib hau edozein `.rg` fitxategitan erabiltzeko, nahikoa da goiburuan `import io` deklaratzea eta bere funtzioei zuriuneekin edo azpimarrarekin deitzea.\n\n---\n\n## 3. `io` APIaren erreferentzia azkarra\n\n| Sinadura / Funtzioa / Mota | Zer egiten duen eta noiz erabili |\n|---|---|\n| `type IoError / type IoResult[A]` | `IoNotFound | IoPermission | IoTimeout | IoRefused | IoReset | IoEOF | IoInvalid | IoSysError` |\n| `io read with timeout / io write with timeout` | `wait_ms` bidez mugatutako deskribatzaileen irakurketa/idazketa ez-blokeatzailea |\n| `read fd N max M timeout T / write fd N data S timeout T` | Epemugadun deskribatzaileen S/I-rako mixfix eragile ergonomikoak (`op ::`) |\n| `io read file / io write file / io read lines` | `IoResult` itzultzen duten fitxategi eta lerro-korronteen funtzio seguruak |\n| `exec with timeout : String -> Int -> IoResult[ProcStatus]` | Kanpoko komando bat exekutatzen du `with timeout` kuota lexiko batez mugatuta |\n\n---\n\n## 4. Errezeta praktikoak estilo taularatuan\n\n### 1. errezeta: Fluxu nagusia `io` erabiliz\n\nIkusi nola `=` ikurrak eta eraldaketa-urratsak taula garbi bat bezala lerrokatuta geratzen diren:\n\n```ridgun\nimport io\n\nfn :: leer peticion segura (fd : Int) => String\n      leer peticion segura fd =\n        res = read fd fd max 4096 timeout 250\n        io unwrap or res \"\"\n```\n\n### 2. errezeta: Konposizio segurua eta albo-ondoriorik gabea\n\n`io` lib-eko funtzio oro `ridgun-libs`-eko gainerako 32 lib-ekin konposa daiteke:\n\n```ridgun\nimport io\n\nfn :: describir fallo () => String\n      describir fallo =\n        format io error (IoTimeout \"read\" 250)\n```\n\n---\n\n## 5. Kaputaren azpian: errendimendua, RMM memoria eta bermeak\n\n- **Berme algoritmikoa eta segurtasunekoa**: `wait_ms` kuotarekin `io` bidez exekutatutako inongo irakurketa, idazketa edo komandok ezin du deitzen duen haria edo aktorea mugagabe blokeatu.\n- **Memoria determinista (`RMM1`/`RMM2`)**: Zero zabor-biltzaile etenaldi; tarteko egitura guztiak modu deterministan askatzen dira esparrutik irtetean.\n- **Etengabeko egiaztapena**: Zorrotz probatua `stable check` eta `src/test/ridgun/test_io.rg` suite automatizatuaren bidez.\n"}, {"num": "24", "slug": "24-lib-crypto-sha256-hmac-pbkdf2-eta-aead", "file": "24-lib-crypto-sha256-hmac-pbkdf2-eta-aead.md", "title": "24. kapitulua: `crypto` lib-a — SHA-256, HMAC, PBKDF2, Argon2id eta ChaCha20-Poly1305 AEAD", "short_title": "`crypto` lib-a — SHA-256, HMAC, PBKDF2, Argon2id eta ChaCha20-Poly1305 AEAD", "markdown": "# 24. kapitulua: `crypto` lib-a — SHA-256, HMAC, PBKDF2, Argon2id eta ChaCha20-Poly1305 AEAD\n\n## 1. Zergatik existitzen da `crypto` lib-a?\n\nIzan gaitezen zintzoak: HMAC bat `==`-rekin konparatzeak denbora-erasoei (*timing attacks*) atea irekitzen die, eta `SHA-256` bat kalkulatzeko edo `ChaCha20-Poly1305`-ekin zifratzeko `libssl.so`-ren menpe egoteak edozein bitarren eramangarritasun estatikoa apurtzen du.\n\n**`crypto`** lib-ak % 100ean Ridgun hutsean eta aurrez esleitutako `Tensor[Int]` gainean inplementatzen ditu: byte/bit eragiketak (`RGF-019`), **FIPS 180-4 SHA-256**, **RFC 2104 HMAC-SHA-256**, denbora konstanteko berdintasuna (`ct equal`), **RFC 8018 PBKDF2-HMAC-SHA-256**, 5 argumentuko **Argon2id** fatxada eta **RFC 8439 ChaCha20-Poly1305 AEAD** zifraketa autentifikatua (`aead seal` / `aead open`).\n\n---\n\n## 2. Artefaktuak, inportazioa eta `libc` gabeko arkitektura\n\n`ridgun-libs`-en, **`crypto`** lehen mailako **lib** bat da, `src/main/ridgun/lib/crypto.rg` bidean kokatua (`CRYPTO` domeinua). `stable bundle`-ekin konpilatzean, hiru formatu natibotan paketatzen da:\n\n| Artefaktua | Bidea | Helburua |\n|---|---|---|\n| **Ridgun Bundle-a** | `target/bundles/crypto.rglib` | Banaketa eta inportazio zuzena `import crypto` bidez |\n| **Fitxategi konpilatua** | `target/crypto.rgc` | `ridgunc`-ek egiaztatutako tarteko artefaktua |\n| **ELF64 objektu partekatua** | `target/libcrypto.so` | C edo `libc` mendekotasunik gabeko liburutegi dinamiko natiboa |\n\n> Lib hau edozein `.rg` fitxategitan erabiltzeko, nahikoa da goiburuan `import crypto` deklaratzea eta bere funtzioei zuriuneekin edo azpimarrarekin deitzea.\n\n---\n\n## 3. `crypto` APIaren erreferentzia azkarra\n\n| Sinadura / Funtzioa / Mota | Zer egiten duen eta noiz erabili |\n|---|---|\n| `sha256 bytes / sha256 hex` | FIPS 180-4 SHA-256 32 byteko laburpen bitarra edo 64 karaktereko hamaseitarra |\n| `hmac sha256 / hmac sha256 hex / ct equal` | RFC 2104 gakodun MACa eta denbora konstanteko metagailu-konparazioa |\n| `pbkdf2 hmac sha256 : String -> String -> Int -> Int -> String` | RFC 8018 gako-eratorpena aurrez kalkulatutako SHA-256 tarteko egoerekin |\n| `argon2id hash / argon2id verify` | 5 argumentuko RFC 9106 PHC pasahitz-hashinga eta denbora konstanteko egiaztapena |\n| `aead seal / aead open` | RFC 8439 ChaCha20-Poly1305 zifraketa autentifikatua eta etiketa egiaztatuko deszifraketa |\n\n---\n\n## 4. Errezeta praktikoak estilo taularatuan\n\n### 1. errezeta: Fluxu nagusia `crypto` erabiliz\n\nIkusi nola `=` ikurrak eta eraldaketa-urratsak taula garbi bat bezala lerrokatuta geratzen diren:\n\n```ridgun\nimport crypto\n\nfn :: cifrar mensaje sesion (secreto : String) (texto : String) => (Int, String)\n      cifrar mensaje sesion secreto texto =\n        key32   = sha256 bytes secreto\n        nonce12 = \"0123456789ab\"\n        aad     = \"canal-autenticado\"\n        sellado = aead seal key32 nonce12 aad texto\n        aead open key32 nonce12 aad sellado\n```\n\n### 2. errezeta: Konposizio segurua eta albo-ondoriorik gabea\n\n`crypto` lib-eko funtzio oro `ridgun-libs`-eko gainerako 32 lib-ekin konposa daiteke:\n\n```ridgun\nimport crypto\n\nfn :: verificar firma webhook (clave : String) (cuerpo : String) (firma_hex : String) => Bool\n      verificar firma webhook clave cuerpo firma_hex =\n        esperada = hmac sha256 hex clave cuerpo\n        ct equal esperada firma_hex\n```\n\n---\n\n## 5. Kaputaren azpian: errendimendua, RMM memoria eta bermeak\n\n- **Berme algoritmikoa eta segurtasunekoa**: `aead open`-ek 16 byteko Poly1305 etiketa denbora konstantean egiaztatzen du testu lauko byte bakar bat itzuli aurretik (huts egiten badu, `(-1, \"\")` itzultzen du).\n- **Memoria determinista (`RMM1`/`RMM2`)**: Zero zabor-biltzaile etenaldi; tarteko egitura guztiak modu deterministan askatzen dira esparrutik irtetean.\n- **Etengabeko egiaztapena**: Zorrotz probatua `stable check` eta `src/test/ridgun/test_crypto.rg` suite automatizatuaren bidez.\n"}, {"num": "25", "slug": "25-lib-argon2id-rfc9106-hashing-eta-owasp", "file": "25-lib-argon2id-rfc9106-hashing-eta-owasp.md", "title": "25. kapitulua: `argon2id` lib-a — RFC 9106 Argon2id `Tensor[U64 * 8 * 16]` gainean, Blake2b eta OWASP Aurrezarpenak", "short_title": "`argon2id` lib-a — RFC 9106 Argon2id `Tensor[U64 * 8 * 16]` gainean, Blake2b eta OWASP Aurrezarpenak", "markdown": "# 25. kapitulua: `argon2id` lib-a — RFC 9106 Argon2id `Tensor[U64 * 8 * 16]` gainean, Blake2b eta OWASP Aurrezarpenak\n\n## 1. Zergatik existitzen da `argon2id` lib-a?\n\nIzan gaitezen zintzoak: pasahitzak SHA-256 soil batekin gordetzeak GPU moderno bati segundoko milaka milioi konbinazio probatzea ahalbidetzen dio, baina Argon2id izateko kanpoko C liburutegiak estekatzeak konpilazio- eta memoria-buruhausteak ekartzen ditu.\n\n**`argon2id`** lib-ak **RFC 9106 Argon2id** eta **RFC 7693 Blake2b-512** % 100ean Ridgun hutsean inplementatzen ditu `Tensor[U64 * 8 * 16]` bloke natiboen gainean (1 024 byte blokeko RMM2 memoria jarraituan), **PHC** kateen sorrerarekin (`$argon2id$v=19$m=...,t=...,p=...$`), **OWASP** profilekin (`owaspfirst`, `owaspsecond`), *pepper* euskarriarekin (`argon2id hash ctx`), gakoen eratorpenarekin (`argon2id derive key`) eta parametroen eguneratze-detekzioarekin (`argon2id needs rehash`).\n\n---\n\n## 2. Artefaktuak, inportazioa eta `libc` gabeko arkitektura\n\n`ridgun-libs`-en, **`argon2id`** lehen mailako **lib** bat da, `src/main/ridgun/lib/argon2id.rg` bidean kokatua (`CRYPTO` domeinua). `stable bundle`-ekin konpilatzean, hiru formatu natibotan paketatzen da:\n\n| Artefaktua | Bidea | Helburua |\n|---|---|---|\n| **Ridgun Bundle-a** | `target/bundles/argon2id.rglib` | Banaketa eta inportazio zuzena `import argon2id` bidez |\n| **Fitxategi konpilatua** | `target/argon2id.rgc` | `ridgunc`-ek egiaztatutako tarteko artefaktua |\n| **ELF64 objektu partekatua** | `target/libargon2id.so` | C edo `libc` mendekotasunik gabeko liburutegi dinamiko natiboa |\n\n> Lib hau edozein `.rg` fitxategitan erabiltzeko, nahikoa da goiburuan `import argon2id` deklaratzea eta bere funtzioei zuriuneekin edo azpimarrarekin deitzea.\n\n---\n\n## 3. `argon2id` APIaren erreferentzia azkarra\n\n| Sinadura / Funtzioa / Mota | Zer egiten duen eta noiz erabili |\n|---|---|\n| `argon2id hash / argon2id verify` | 6 argumentuko RFC 9106 PHC pasahitz-hashinga (`pwd, salt, m_kib, t, p, tag_len`) eta denbora konstanteko egiaztapena |\n| `argon2id hash with preset / argon2id params preset` | Izendun profilak: `\"interactive\"`, `\"owaspfirst\"` (`19456 KiB, t=2`), `\"owaspsecond\"` (`47104 KiB, t=1`), `\"moderate\"`, `\"sensitive\"` |\n| `argon2id hash ctx / argon2id verify ctx` | RFC 9106 hashinga `pepper` sekretuarekin ($K$) eta datu elkartuekin ($X$) |\n| `argon2id derive key / argon2id needs rehash` | Gako bitar gordinaren eratorpena eta PHC kateetan rehash beharraren detekzioa |\n| `blake2b / blake2b hex` | Helburu orokorreko RFC 7693 Blake2b laburpen kriptografikoa (`1..64` byte) |\n\n---\n\n## 4. Errezeta praktikoak estilo taularatuan\n\n### 1. errezeta: Fluxu nagusia `argon2id` erabiliz\n\nIkusi nola `=` ikurrak eta eraldaketa-urratsak taula garbi bat bezala lerrokatuta geratzen diren:\n\n```ridgun\nimport argon2id\n\nfn :: proteger clave usuario (clave : String) => (String, Bool, Bool)\n      proteger clave usuario clave =\n        phc    = argon2id hash clave \"sal-unica-16byte\" 32 2 1 32\n        valido = argon2id verify clave phc\n        rehash = argon2id needs rehash phc 19456 2 1 32\n        (phc, valido, rehash)\n```\n\n### 2. errezeta: Konposizio segurua eta albo-ondoriorik gabea\n\n`argon2id` lib-eko funtzio oro `ridgun-libs`-eko gainerako 32 lib-ekin konposa daiteke:\n\n```ridgun\nimport argon2id\n\nfn :: derivar clave maestra (frase : String) (sal : String) => String\n      derivar clave maestra frase sal =\n        -- Deriva 32 bytes crudos listos para ChaCha20-Poly1305 AEAD\n        argon2id derive key frase sal 64 2 1 32\n```\n\n---\n\n## 5. Kaputaren azpian: errendimendua, RMM memoria eta bermeak\n\n- **Berme algoritmikoa eta segurtasunekoa**: Bat-etortze zehatza bytez byte RFC 9106 §5.3 eta OpenSSL 3.5 bektore ofizialekin, `Tensor[U64 * 8 * 16]` gainean C lerro bakar bat ere gabe lan eginez.\n- **Memoria determinista (`RMM1`/`RMM2`)**: Zero zabor-biltzaile etenaldi; tarteko egitura guztiak modu deterministan askatzen dira esparrutik irtetean.\n- **Etengabeko egiaztapena**: Zorrotz probatua `stable check` eta `src/test/ridgun/test_argon2id.rg` suite automatizatuaren bidez.\n"}, {"num": "26", "slug": "26-lib-jwt-rfc7519-tokenak-eta-aead", "file": "26-lib-jwt-rfc7519-tokenak-eta-aead.md", "title": "26. kapitulua: `jwt` lib-a — RFC 7519 JSON Web Tokenak (`HS256`) eta ChaCha20-Poly1305 Token Zifratuak", "short_title": "`jwt` lib-a — RFC 7519 JSON Web Tokenak (`HS256`) eta ChaCha20-Poly1305 Token Zifratuak", "markdown": "# 26. kapitulua: `jwt` lib-a — RFC 7519 JSON Web Tokenak (`HS256`) eta ChaCha20-Poly1305 Token Zifratuak\n\n## 1. Zergatik existitzen da `jwt` lib-a?\n\nIzan gaitezen zintzoak: JWT ekosistema ospetsua da erasotzaile batek goiburua `\"alg\":\"none\"`-ra aldatzen duen eta zerbitzariak tokena sinadurarik gabe onartzen duen ahultasunengatik, edo payload-a Base64url-n kodetuta baino ez dagoela ahaztuta informazio sentikorra gordetzeagatik.\n\n**`jwt`** lib-ak bi munduak konpontzen ditu: **RFC 7519 (`HS256`) JWTak** sinatu eta egiaztatzen ditu `alg == \"HS256\"` esplizituki eskatuz, HMACa denbora konstantean konparatuz eta `exp`/`nbf` baliozkotuz, eta gainera **`token seal` / `token open`** eskaintzen ditu **ChaCha20-Poly1305 AEAD** bidez zifratutako token opakuak jaulkitzeko.\n\n---\n\n## 2. Artefaktuak, inportazioa eta `libc` gabeko arkitektura\n\n`ridgun-libs`-en, **`jwt`** lehen mailako **lib** bat da, `src/main/ridgun/lib/jwt.rg` bidean kokatua (`JWT` domeinua). `stable bundle`-ekin konpilatzean, hiru formatu natibotan paketatzen da:\n\n| Artefaktua | Bidea | Helburua |\n|---|---|---|\n| **Ridgun Bundle-a** | `target/bundles/jwt.rglib` | Banaketa eta inportazio zuzena `import jwt` bidez |\n| **Fitxategi konpilatua** | `target/jwt.rgc` | `ridgunc`-ek egiaztatutako tarteko artefaktua |\n| **ELF64 objektu partekatua** | `target/libjwt.so` | C edo `libc` mendekotasunik gabeko liburutegi dinamiko natiboa |\n\n> Lib hau edozein `.rg` fitxategitan erabiltzeko, nahikoa da goiburuan `import jwt` deklaratzea eta bere funtzioei zuriuneekin edo azpimarrarekin deitzea.\n\n---\n\n## 3. `jwt` APIaren erreferentzia azkarra\n\n| Sinadura / Funtzioa / Mota | Zer egiten duen eta noiz erabili |\n|---|---|\n| `type JwtResult` | `JwtOk JsonVal | JwtExpired | JwtNotYetValid | JwtBadSignature | JwtMalformed` |\n| `jwt sign hs256 / jwt verify hs256` | `JsonVal` claim-ak sinatzen ditu eta sinadura + `alg == \"HS256\"` + `exp`/`nbf` egiaztatzen ditu |\n| `jwt claims / jwt get str / jwt get int` | `(sub, iss, iat, exp)` claim estandarrak eraiki eta egiaztatutako payload-ak kontsultatzen ditu |\n| `token seal / token open` | JSON token opakuak zifratu eta autentifikatzen ditu ChaCha20-Poly1305 AEAD bidez |\n\n---\n\n## 4. Errezeta praktikoak estilo taularatuan\n\n### 1. errezeta: Fluxu nagusia `jwt` erabiliz\n\nIkusi nola `=` ikurrak eta eraldaketa-urratsak taula garbi bat bezala lerrokatuta geratzen diren:\n\n```ridgun\nimport jwt\nimport json\n\nfn :: emitir y verificar sesion (secreto : String) => (String, String)\n      emitir y verificar sesion secreto =\n        claims = jwt claims \"user-42\" \"solstice\" 1700000000 1700003600\n        tok    = jwt sign hs256 secreto claims\n        res    = jwt verify hs256 secreto tok 1700001000\n        sub    = jwt get str res \"sub\" \"anonimo\"\n        (tok, sub)\n```\n\n### 2. errezeta: Konposizio segurua eta albo-ondoriorik gabea\n\n`jwt` lib-eko funtzio oro `ridgun-libs`-eko gainerako 32 lib-ekin konposa daiteke:\n\n```ridgun\nimport jwt\nimport json\n\nfn :: sellar token confidencial (clave : String) => JwtResult\n      sellar token confidencial clave =\n        datos = JnObj [(\"rol\", JnStr \"root\"), (\"pin\", JnInt 9988)]\n        sobre = token seal clave \"nonce-12byte\" datos\n        token open clave sobre\n```\n\n---\n\n## 5. Kaputaren azpian: errendimendua, RMM memoria eta bermeak\n\n- **Berme algoritmikoa eta segurtasunekoa**: `\"alg\":\"none\"` erasoaren aurkako immunitate osoa (`alg` zehazki `\"HS256\"` ez duen edozein goiburuk `JwtBadSignature` itzultzen du) eta sinaduraren denbora konstanteko konparazioa.\n- **Memoria determinista (`RMM1`/`RMM2`)**: Zero zabor-biltzaile etenaldi; tarteko egitura guztiak modu deterministan askatzen dira esparrutik irtetean.\n- **Etengabeko egiaztapena**: Zorrotz probatua `stable check` eta `src/test/ridgun/test_jwt.rg` suite automatizatuaren bidez.\n"}, {"num": "27", "slug": "27-lib-socket-sareak-dns-eta-kernel-socketak", "file": "27-lib-socket-sareak-dns-eta-kernel-socketak.md", "title": "27. kapitulua: `socket` lib-a — TCP, UDP, AF_UNIX, Framing, RFC 1035 DNS eta Kernel Socketak (`RGF-001`)", "short_title": "`socket` lib-a — TCP, UDP, AF_UNIX, Framing, RFC 1035 DNS eta Kernel Socketak (`RGF-001`)", "markdown": "# 27. kapitulua: `socket` lib-a — TCP, UDP, AF_UNIX, Framing, RFC 1035 DNS eta Kernel Socketak (`RGF-001`)\n\n## 1. Zergatik existitzen da `socket` lib-a?\n\nIzan gaitezen zintzoak: C-n BSD socketak `struct sockaddr_in`, `htons`, `inet_pton` eta `getaddrinfo`-rekin programatzea (`glibc`-ren `libnss` arrastaka dakarrena gainera) 80ko hamarkadako erritu arkano bat da.\n\n**`socket`** lib-ak bi geruza osagarri eskaintzen ditu C lerro bakar bat gabe: (1) **Solstice** bezalako ekoizpen-zerbitzarietarako **`RGF-001`** nukleoko deskribatzaileen APIa (`sys tcp listen`, `sys tcp listen reuseport`, `sys accept`, `sys tcp connect`, `sys send`, `sys recv`, `sys resolve ipv4` `/etc/hosts` + 53 atakako RFC 1035 UDP DNS paketeen bidez) eta (2) `Socket` egoera-makina funtzional aldaezina luzera-aurrizkidun framing, CRLF lerro eta CIDR azpisareekin.\n\n---\n\n## 2. Artefaktuak, inportazioa eta `libc` gabeko arkitektura\n\n`ridgun-libs`-en, **`socket`** lehen mailako **lib** bat da, `src/main/ridgun/lib/socket.rg` bidean kokatua (`SOCK` domeinua). `stable bundle`-ekin konpilatzean, hiru formatu natibotan paketatzen da:\n\n| Artefaktua | Bidea | Helburua |\n|---|---|---|\n| **Ridgun Bundle-a** | `target/bundles/socket.rglib` | Banaketa eta inportazio zuzena `import socket` bidez |\n| **Fitxategi konpilatua** | `target/socket.rgc` | `ridgunc`-ek egiaztatutako tarteko artefaktua |\n| **ELF64 objektu partekatua** | `target/libsocket.so` | C edo `libc` mendekotasunik gabeko liburutegi dinamiko natiboa |\n\n> Lib hau edozein `.rg` fitxategitan erabiltzeko, nahikoa da goiburuan `import socket` deklaratzea eta bere funtzioei zuriuneekin edo azpimarrarekin deitzea.\n\n---\n\n## 3. `socket` APIaren erreferentzia azkarra\n\n| Sinadura / Funtzioa / Mota | Zer egiten duen eta noiz erabili |\n|---|---|\n| `sys tcp listen / sys tcp listen reuseport / sys unix listen` | IPv4 TCP (`SO_REUSEADDR` / `SO_REUSEPORT`) edo `AF_UNIX` entzuten jartzen du |\n| `sys accept / sys tcp connect / sys unix connect` | Timeout bidez mugatutako `accept` eta `connect`, `SockFdResult` / `SockAcceptResult` itzuliz |\n| `sys send / sys recv / sys shutdown write` | Timeout bidezko socket bidalketa, harrera eta idazketa-itxiera (`SHUT_WR`) |\n| `sys resolve ipv4 / dns resolve a` | Ridgun hutseko IPv4 ebazpena `/etc/hosts` eta RFC 1035 UDP DNS kontsulten bidez |\n| `sock send frame / sock recv frame / ipv4 in cidr` | Luzera-aurrizkidun (`N:payload`) framinga eta IPv4 CIDR azpisareen bat-etortzea |\n\n---\n\n## 4. Errezeta praktikoak estilo taularatuan\n\n### 1. errezeta: Fluxu nagusia `socket` erabiliz\n\nIkusi nola `=` ikurrak eta eraldaketa-urratsak taula garbi bat bezala lerrokatuta geratzen diren:\n\n```ridgun\nimport socket\n\nfn :: eco tcp local () => String\n      eco tcp local =\n        l_res = sys tcp listen \"127.0.0.1\" 0 16\n        lfd   = sock fd l_res\n        port  = sys local port lfd\n        c_res = sys tcp connect \"127.0.0.1\" port 1000\n        cfd   = sock fd c_res\n        a_res = sys accept lfd 1000\n        sfd   = sock accept fd a_res\n        _     = sys send cfd \"hola-solstice\" 1000\n        r_res = sys recv sfd 64 1000\n        datos = sock recv data r_res\n        _     = sys_close cfd\n        _     = sys_close sfd\n        _     = sys_close lfd\n        datos\n```\n\n### 2. errezeta: Konposizio segurua eta albo-ondoriorik gabea\n\n`socket` lib-eko funtzio oro `ridgun-libs`-eko gainerako 32 lib-ekin konposa daiteke:\n\n```ridgun\nimport socket\n\nfn :: verificar ip interna (ip : String) => Bool\n      verificar ip interna ip =\n        ipv4 in cidr ip \"10.0.0.0/8\"\n```\n\n---\n\n## 5. Kaputaren azpian: errendimendua, RMM memoria eta bermeak\n\n- **Berme algoritmikoa eta segurtasunekoa**: Erregistroen eguneratzea `s with field = val` sintaxi aldaezinarekin, `glibc`/`libnss` gabeko DNS ebazpena eta egoera-kode deterministak (`0` OK, `-1` EOF, `-2` TIMEOUT, `-3` REFUSED).\n- **Memoria determinista (`RMM1`/`RMM2`)**: Zero zabor-biltzaile etenaldi; tarteko egitura guztiak modu deterministan askatzen dira esparrutik irtetean.\n- **Etengabeko egiaztapena**: Zorrotz probatua `stable check` eta `src/test/ridgun/test_socket.rg` suite automatizatuaren bidez.\n"}, {"num": "28", "slug": "28-lib-http-uriak-http11-eta-tcp-bezeroa", "file": "28-lib-http-uriak-http11-eta-tcp-bezeroa.md", "title": "28. kapitulua: `http` lib-a — RFC 3986 URIak, RFC 9112 HTTP/1.1 Kodeka eta Zuzeneko TCP Bezeroa", "short_title": "`http` lib-a — RFC 3986 URIak, RFC 9112 HTTP/1.1 Kodeka eta Zuzeneko TCP Bezeroa", "markdown": "# 28. kapitulua: `http` lib-a — RFC 3986 URIak, RFC 9112 HTTP/1.1 Kodeka eta Zuzeneko TCP Bezeroa\n\n## 1. Zergatik existitzen da `http` lib-a?\n\nIzan gaitezen zintzoak: HTTP goiburuetako balioetan `\\r\\n` jauziak iragazten ez badituzu, erasotzaile batek goiburu faltsuak txerta ditzake (*CRLF Response Splitting*), eta `GET` edo `POST` soil bat egiteko `libcurl` estekatzea gehiegizkoa da.\n\n**`http`** lib-ak **RFC 3986 URIen** deskonposizioa, **RFC 9112 HTTP/1.1** eskaera eta erantzunen eraikuntza zein analisia CRLF garbiketa automatikoarekin (`VUL-INJ-002`) eta `Content-Length` automatikoarekin, `Bearer` tokenen erauzketa eta **nukleoko TCP socketen gaineko zuzeneko HTTP/1.1 bezeroa** (`http get`, `http post`, `http request tcp`) inplementatzen ditu.\n\n---\n\n## 2. Artefaktuak, inportazioa eta `libc` gabeko arkitektura\n\n`ridgun-libs`-en, **`http`** lehen mailako **lib** bat da, `src/main/ridgun/lib/http.rg` bidean kokatua (`HTTP` domeinua). `stable bundle`-ekin konpilatzean, hiru formatu natibotan paketatzen da:\n\n| Artefaktua | Bidea | Helburua |\n|---|---|---|\n| **Ridgun Bundle-a** | `target/bundles/http.rglib` | Banaketa eta inportazio zuzena `import http` bidez |\n| **Fitxategi konpilatua** | `target/http.rgc` | `ridgunc`-ek egiaztatutako tarteko artefaktua |\n| **ELF64 objektu partekatua** | `target/libhttp.so` | C edo `libc` mendekotasunik gabeko liburutegi dinamiko natiboa |\n\n> Lib hau edozein `.rg` fitxategitan erabiltzeko, nahikoa da goiburuan `import http` deklaratzea eta bere funtzioei zuriuneekin edo azpimarrarekin deitzea.\n\n---\n\n## 3. `http` APIaren erreferentzia azkarra\n\n| Sinadura / Funtzioa / Mota | Zer egiten duen eta noiz erabili |\n|---|---|\n| `uri parse / uri scheme / uri host / uri port / uri path / uri query` | RFC 3986 URIak deskonposatzen ditu lehenetsitako ataka automatikoekin (`80` / `443`) |\n| `http build request / http parse request` | HTTP/1.1 eskaerak formateatu eta analizatzen ditu goiburuen CRLF garbiketarekin |\n| `http build response / http parse response` | HTTP/1.1 erantzunak formateatu eta analizatzen ditu egoera-esaldiekin |\n| `http header get / http bearer token` | Letra larri/xeheekiko sentikorra ez den goiburu-bilaketa eta `Bearer <token>` erauzketa |\n| `http get / http post / http request tcp` | Zuzeneko HTTP/1.1 deiak exekutatzen ditu nukleoko TCP socketen gainean `timeout_ms`-rekin |\n\n---\n\n## 4. Errezeta praktikoak estilo taularatuan\n\n### 1. errezeta: Fluxu nagusia `http` erabiliz\n\nIkusi nola `=` ikurrak eta eraldaketa-urratsak taula garbi bat bezala lerrokatuta geratzen diren:\n\n```ridgun\nimport http\n\nfn :: inspeccionar endpoint (url : String) => (String, Int, String, String)\n      inspeccionar endpoint url =\n        host = uri host url\n        port = uri port url\n        path = uri path url\n        wire = http build request \"GET\" path [(\"Host\", host)] \"\"\n        (host, port, path, wire)\n```\n\n### 2. errezeta: Konposizio segurua eta albo-ondoriorik gabea\n\n`http` lib-eko funtzio oro `ridgun-libs`-eko gainerako 32 lib-ekin konposa daiteke:\n\n```ridgun\nimport http\n\nfn :: extraer credenciales (raw_req : String) => (String, String)\n      extraer credenciales raw_req =\n        (metodo, ruta, _, hdrs_raw, _) = http parse request raw_req\n        hdrs = http parse headers hdrs_raw\n        tok  = http bearer token hdrs\n        (metodo + \" \" + ruta, tok)\n```\n\n---\n\n## 5. Kaputaren azpian: errendimendua, RMM memoria eta bermeak\n\n- **Berme algoritmikoa eta segurtasunekoa**: `\\r` eta `\\n` karaktereen garbiketa automatikoa goiburu guztietan (`http sanitize header`) HTTP erantzun-zatikatze erasoak eragozteko.\n- **Memoria determinista (`RMM1`/`RMM2`)**: Zero zabor-biltzaile etenaldi; tarteko egitura guztiak modu deterministan askatzen dira esparrutik irtetean.\n- **Etengabeko egiaztapena**: Zorrotz probatua `stable check` eta `src/test/ridgun/test_http.rg` suite automatizatuaren bidez.\n"}, {"num": "29", "slug": "29-lib-ws-rfc6455-websocket-protokoloa", "file": "29-lib-ws-rfc6455-websocket-protokoloa.md", "title": "29. kapitulua: `ws` lib-a — RFC 6455 WebSocket Handshakea, 16/64 biteko Framinga eta XOR Maskaratzea", "short_title": "`ws` lib-a — RFC 6455 WebSocket Handshakea, 16/64 biteko Framinga eta XOR Maskaratzea", "markdown": "# 29. kapitulua: `ws` lib-a — RFC 6455 WebSocket Handshakea, 16/64 biteko Framinga eta XOR Maskaratzea\n\n## 1. Zergatik existitzen da `ws` lib-a?\n\nIzan gaitezen zintzoak: WebSocket protokoloak (RFC 6455) SHA-1 + Base64 handshake bat luzera aldakorreko trama bitarrekin (7 bit, 16 bit edo 64 bit) eta bezerotik zerbitzarirako nahitaezko XOR maskaratzearekin uztartzen du.\n\n**`ws`** lib-ak **RFC 6455** osoa inplementatzen du Ridgun hutsean: `Sec-WebSocket-Accept` kalkulua (handshake GUIDerako soilik integratutako RFC 3174 SHA-1-ekin), `101 Switching Protocols` HTTP goiburuak, 7, 16 (`126`) eta 64 biteko (`127`) luzeradun tramen (`WsFrame`) kodetzea/deskodetzea, XOR maskaratze simetrikoa eta testu, ping, pong zein itxiera tramen eraikitzaileak.\n\n---\n\n## 2. Artefaktuak, inportazioa eta `libc` gabeko arkitektura\n\n`ridgun-libs`-en, **`ws`** lehen mailako **lib** bat da, `src/main/ridgun/lib/ws.rg` bidean kokatua (`WS` domeinua). `stable bundle`-ekin konpilatzean, hiru formatu natibotan paketatzen da:\n\n| Artefaktua | Bidea | Helburua |\n|---|---|---|\n| **Ridgun Bundle-a** | `target/bundles/ws.rglib` | Banaketa eta inportazio zuzena `import ws` bidez |\n| **Fitxategi konpilatua** | `target/ws.rgc` | `ridgunc`-ek egiaztatutako tarteko artefaktua |\n| **ELF64 objektu partekatua** | `target/libws.so` | C edo `libc` mendekotasunik gabeko liburutegi dinamiko natiboa |\n\n> Lib hau edozein `.rg` fitxategitan erabiltzeko, nahikoa da goiburuan `import ws` deklaratzea eta bere funtzioei zuriuneekin edo azpimarrarekin deitzea.\n\n---\n\n## 3. `ws` APIaren erreferentzia azkarra\n\n| Sinadura / Funtzioa / Mota | Zer egiten duen eta noiz erabili |\n|---|---|\n| `ws accept key : String -> String` | `Sec-WebSocket-Key`-tik abiatuta RFC 6455 §1.3 `Sec-WebSocket-Accept` kalkulatzen du |\n| `ws build upgrade request / ws build upgrade response` | WebSocket HTTP/1.1 upgrade handshake mezuak formateatzen ditu |\n| `ws encode frame / ws decode frame` | `WsFrame` tramak (`fin`, `opcode`, `masked`, `mask_key`, `payload`) kodetu eta deskodetzen ditu |\n| `ws text frame / ws ping frame / ws pong frame / ws close frame` | Goi-mailako tramen eraikitzaileak eta itxiera-kodeen erauzleak (`1000` itxiera normala) |\n\n---\n\n## 4. Errezeta praktikoak estilo taularatuan\n\n### 1. errezeta: Fluxu nagusia `ws` erabiliz\n\nIkusi nola `=` ikurrak eta eraldaketa-urratsak taula garbi bat bezala lerrokatuta geratzen diren:\n\n```ridgun\nimport ws\n\nfn :: negociar y enviar (client_key : String) => (String, String)\n      negociar y enviar client_key =\n        resp  = ws build upgrade response client_key\n        trama = ws encode frame (ws text frame \"hola-tiempo-real\" False \"\")\n        (resp, trama)\n```\n\n### 2. errezeta: Konposizio segurua eta albo-ondoriorik gabea\n\n`ws` lib-eko funtzio oro `ridgun-libs`-eko gainerako 32 lib-ekin konposa daiteke:\n\n```ridgun\nimport ws\n\nfn :: decodificar trama cliente (clave4 : String) (msg : String) => String\n      decodificar trama cliente clave4 msg =\n        wire = ws encode frame (ws text frame msg True clave4)\n        res  = ws decode frame wire\n        ws frame payload res\n```\n\n---\n\n## 5. Kaputaren azpian: errendimendua, RMM memoria eta bermeak\n\n- **Berme algoritmikoa eta segurtasunekoa**: Bat-etortze zehatza RFC 6455 bektore ofizialarekin (`\"dGhlIHNhbXBsZSBub25jZQ==\"` $\\rightarrow$ `\"s3pPLMBiTxaQ9kYGzzhZRbK+xOo=\"`) eta maskara-kentze automatikoa `ws decode frame`-n.\n- **Memoria determinista (`RMM1`/`RMM2`)**: Zero zabor-biltzaile etenaldi; tarteko egitura guztiak modu deterministan askatzen dira esparrutik irtetean.\n- **Etengabeko egiaztapena**: Zorrotz probatua `stable check` eta `src/test/ridgun/test_ws.rg` suite automatizatuaren bidez.\n"}, {"num": "30", "slug": "30-lib-agent-aktoreen-konkurrentzia", "file": "30-lib-agent-aktoreen-konkurrentzia.md", "title": "30. kapitulua: `agent` lib-a — Aktoreen Eredu Natiboa (`agent`, `send`, `receive`), KV Biltegia eta Rate Limiter-a", "short_title": "`agent` lib-a — Aktoreen Eredu Natiboa (`agent`, `send`, `receive`), KV Biltegia eta Rate Limiter-a", "markdown": "# 30. kapitulua: `agent` lib-a — Aktoreen Eredu Natiboa (`agent`, `send`, `receive`), KV Biltegia eta Rate Limiter-a\n\n## 1. Zergatik existitzen da `agent` lib-a?\n\nIzan gaitezen zintzoak: harien artean memoria aldakorra `Mutex`, `RwLock` eta baldintza-aldagaiekin partekatzea *deadlock* eta lasterketa-baldintzen fabrika agortezina da.\n\n**`agent`** lib-ak Ridgunen **Agenteen Eredu Natiboa** (`agent`, `send ... to`, `receive from`, `try receive from`, `stop`) baliatzen du Copy-on-Write mezu-igorpenezko postontzi isolatuak, gako-balio biltegi konkurrente bat (`KvStore`), token-ontzi bidezko tasa-mugatzaile bat (`RateBucket`) eta egoera-gainbegiratzea (`AgentHealth`) eskaintzeko.\n\n---\n\n## 2. Artefaktuak, inportazioa eta `libc` gabeko arkitektura\n\n`ridgun-libs`-en, **`agent`** lehen mailako **lib** bat da, `src/main/ridgun/lib/agent.rg` bidean kokatua (`AGENT` domeinua). `stable bundle`-ekin konpilatzean, hiru formatu natibotan paketatzen da:\n\n| Artefaktua | Bidea | Helburua |\n|---|---|---|\n| **Ridgun Bundle-a** | `target/bundles/agent.rglib` | Banaketa eta inportazio zuzena `import agent` bidez |\n| **Fitxategi konpilatua** | `target/agent.rgc` | `ridgunc`-ek egiaztatutako tarteko artefaktua |\n| **ELF64 objektu partekatua** | `target/libagent.so` | C edo `libc` mendekotasunik gabeko liburutegi dinamiko natiboa |\n\n> Lib hau edozein `.rg` fitxategitan erabiltzeko, nahikoa da goiburuan `import agent` deklaratzea eta bere funtzioei zuriuneekin edo azpimarrarekin deitzea.\n\n---\n\n## 3. `agent` APIaren erreferentzia azkarra\n\n| Sinadura / Funtzioa / Mota | Zer egiten duen eta noiz erabili |\n|---|---|\n| `agent roundtrip / agent drain count` | Aktore natiboak (`agent`) abiarazi, mezuak trukatu (`send ... to` / `receive from`) eta `stop` egiten du |\n| `kv store new / kv store apply` | Aktoreentzako gako-balio biltegi aldaezina (`KvPut`, `KvGet`, `KvDelete`, `KvClear`) |\n| `rate bucket new / rate bucket allow` | Token-ontzi bidezko tasa-mugatzailea, ontzi eguneratua eta `(allowed, remaining)` itzultzen dituena |\n| `sup mark failed / sup should restart` | Berrabiarazte-aurrekontua (`max_restarts`) kontrolatzen duten gainbegiratze-politikak |\n\n---\n\n## 4. Errezeta praktikoak estilo taularatuan\n\n### 1. errezeta: Fluxu nagusia `agent` erabiliz\n\nIkusi nola `=` ikurrak eta eraldaketa-urratsak taula garbi bat bezala lerrokatuta geratzen diren:\n\n```ridgun\nimport agent\n\nfn :: probar actor nativo () => (Int, Int)\n      probar actor nativo =\n        eco = agent roundtrip 42\n        vac = agent drain count [10, 20, 30]\n        (eco, vac)\n```\n\n### 2. errezeta: Konposizio segurua eta albo-ondoriorik gabea\n\n`agent` lib-eko funtzio oro `ridgun-libs`-eko gainerako 32 lib-ekin konposa daiteke:\n\n```ridgun\nimport agent\n\nfn :: aplicar limite peticion () => (Bool, Int)\n      aplicar limite peticion =\n        b0         = rate bucket new 10 2 1000\n        (b1, res1) = rate bucket allow b0 1 1000\n        rateresp allowed res1, rateobs remaining res1\n```\n\n---\n\n## 5. Kaputaren azpian: errendimendua, RMM memoria eta bermeak\n\n- **Berme algoritmikoa eta segurtasunekoa**: Zero memoria aldakor partekatu aktoreen artean: mezu bakoitza balioz / Copy-on-Write bidez transferitzen da eta `stop`-ek agentearen eskualdea modu deterministan askatzen du.\n- **Memoria determinista (`RMM1`/`RMM2`)**: Zero zabor-biltzaile etenaldi; tarteko egitura guztiak modu deterministan askatzen dira esparrutik irtetean.\n- **Etengabeko egiaztapena**: Zorrotz probatua `stable check` eta `src/test/ridgun/test_agent.rg` suite automatizatuaren bidez.\n"}, {"num": "31", "slug": "31-lib-pool-langileak-eta-lan-lapurreta", "file": "31-lib-pool-langileak-eta-lan-lapurreta.md", "title": "31. kapitulua: `pool` lib-a — Langileen Pool Mugatua, Round-Robin eta Lan-lapurreta", "short_title": "`pool` lib-a — Langileen Pool Mugatua, Round-Robin eta Lan-lapurreta", "markdown": "# 31. kapitulua: `pool` lib-a — Langileen Pool Mugatua, Round-Robin eta Lan-lapurreta\n\n## 1. Zergatik existitzen da `pool` lib-a?\n\nIzan gaitezen zintzoak: sartzen den eskaera bakoitzeko goi-mugarik gabe hari edo aktore berri bat abiarazteak (`unbounded spawning`) trafiko-gailur batean memoria segundo gutxitan agortzea eragiten du (*Out Of Memory*).\n\n**`pool`** lib-ak **kontrapresio esplizituko** ataza-banatzaile bat (`PoolAccept`, `PoolRejectFull`), sorten $K$ erreietako partizio orekatua (`pool partition`), **lan-lapurreta (*work-stealing*)** bidezko berrorekatzea (`pool steal rebalance`) eta aktore natiboen gaineko exekuzio paraleloa eskaintzen ditu.\n\n---\n\n## 2. Artefaktuak, inportazioa eta `libc` gabeko arkitektura\n\n`ridgun-libs`-en, **`pool`** lehen mailako **lib** bat da, `src/main/ridgun/lib/pool.rg` bidean kokatua (`AGENT` domeinua). `stable bundle`-ekin konpilatzean, hiru formatu natibotan paketatzen da:\n\n| Artefaktua | Bidea | Helburua |\n|---|---|---|\n| **Ridgun Bundle-a** | `target/bundles/pool.rglib` | Banaketa eta inportazio zuzena `import pool` bidez |\n| **Fitxategi konpilatua** | `target/pool.rgc` | `ridgunc`-ek egiaztatutako tarteko artefaktua |\n| **ELF64 objektu partekatua** | `target/libpool.so` | C edo `libc` mendekotasunik gabeko liburutegi dinamiko natiboa |\n\n> Lib hau edozein `.rg` fitxategitan erabiltzeko, nahikoa da goiburuan `import pool` deklaratzea eta bere funtzioei zuriuneekin edo azpimarrarekin deitzea.\n\n---\n\n## 3. `pool` APIaren erreferentzia azkarra\n\n| Sinadura / Funtzioa / Mota | Zer egiten duen eta noiz erabili |\n|---|---|\n| `pool new : Int -> Int -> PoolState` | `workers` errei eta `max_queue` gehienezko edukiera dituen pool mugatua sortzen du |\n| `pool submit : PoolState -> PoolTask -> (PoolState, PoolDecision)` | Ataza bat round-robin bidez ilaran jartzen du edo `PoolRejectFull` itzultzen du beteta badago |\n| `pool partition / pool steal rebalance` | Sortak $K$ langileren artean banatu eta gainkargatutako ilara baten erdia lapurtzen du langile libre batentzat |\n| `pool map sum / pool parallel sum2` | Lan-kargak paraleloan banatzen ditu `agent` langile natiboen artean |\n\n---\n\n## 4. Errezeta praktikoak estilo taularatuan\n\n### 1. errezeta: Fluxu nagusia `pool` erabiliz\n\nIkusi nola `=` ikurrak eta eraldaketa-urratsak taula garbi bat bezala lerrokatuta geratzen diren:\n\n```ridgun\nimport pool\n\nfn :: encolar con contrapresion () => (Int, Int)\n      encolar con contrapresion =\n        p0        = pool new 4 16\n        tarea     = PoolTask 1 100 \"indexar-bloque\"\n        (p1, dec) = pool submit p0 tarea\n        (pool queued p1, pool accepted p1)\n```\n\n### 2. errezeta: Konposizio segurua eta albo-ondoriorik gabea\n\n`pool` lib-eko funtzio oro `ridgun-libs`-eko gainerako 32 lib-ekin konposa daiteke:\n\n```ridgun\nimport pool\n\nfn :: sumar en paralelo () => Int\n      sumar en paralelo =\n        pool parallel sum2 [10, 20, 30] [40, 50, 60]\n```\n\n---\n\n## 5. Kaputaren azpian: errendimendua, RMM memoria eta bermeak\n\n- **Berme algoritmikoa eta segurtasunekoa**: Ilara-edukiera zorrozki mugatua (`queued <= max_queue`) gainkargapean memoria babesteko eta langileen arteko banaketa determinista.\n- **Memoria determinista (`RMM1`/`RMM2`)**: Zero zabor-biltzaile etenaldi; tarteko egitura guztiak modu deterministan askatzen dira esparrutik irtetean.\n- **Etengabeko egiaztapena**: Zorrotz probatua `stable check` eta `src/test/ridgun/test_pool.rg` suite automatizatuaren bidez.\n"}, {"num": "32", "slug": "32-lib-net-agent-konexioen-gainbegiralea", "file": "32-lib-net-agent-konexioen-gainbegiralea.md", "title": "32. kapitulua: `net_agent` lib-a — Sare-konexioen Gainbegiralea eta Gertaera-zubi Ez-blokeatzailea", "short_title": "`net_agent` lib-a — Sare-konexioen Gainbegiralea eta Gertaera-zubi Ez-blokeatzailea", "markdown": "# 32. kapitulua: `net_agent` lib-a — Sare-konexioen Gainbegiralea eta Gertaera-zubi Ez-blokeatzailea\n\n## 1. Zergatik existitzen da `net_agent` lib-a?\n\nIzan gaitezen zintzoak: **Solstice** bezalako benetako zerbitzari batean, TCP konexioak onartzea zati erraza da; zailena aldi bereko bezeroen gehienekoa mugatzea, bezero zonbi geldoak deskonektatzea (*idle timeout*) eta `ppoll` begizta zure aktoreekin deskribatzaile-ihesik gabe lotzea da.\n\n**`net_agent`** lib-ak `ridgun-libs`-en zirkulua ixten du **`posix`**, **`socket`** eta **`agent`** batuz: gainbegiratutako konexio-taulak (`NetSupervisor`) kudeatzen ditu, konkurrentzia-mugak (`max_conns`) aplikatzen ditu, konexio geldoak garbitzen ditu (`net evict idle`) eta nukleoko deskribatzaileen gertaerak gertaera tipatuetan (`NetEvReadyRead`, `NetEvReadyWrite`, `NetEvTimeout`, `NetEvError`) bihurtzen ditu, muturretik muturrerako TCP oihartzun-urrats oso batez (`net tcp echo step`) gain.\n\n---\n\n## 2. Artefaktuak, inportazioa eta `libc` gabeko arkitektura\n\n`ridgun-libs`-en, **`net_agent`** lehen mailako **lib** bat da, `src/main/ridgun/lib/net_agent.rg` bidean kokatua (`AGENT` domeinua). `stable bundle`-ekin konpilatzean, hiru formatu natibotan paketatzen da:\n\n| Artefaktua | Bidea | Helburua |\n|---|---|---|\n| **Ridgun Bundle-a** | `target/bundles/net_agent.rglib` | Banaketa eta inportazio zuzena `import net_agent` bidez |\n| **Fitxategi konpilatua** | `target/net_agent.rgc` | `ridgunc`-ek egiaztatutako tarteko artefaktua |\n| **ELF64 objektu partekatua** | `target/libnet_agent.so` | C edo `libc` mendekotasunik gabeko liburutegi dinamiko natiboa |\n\n> Lib hau edozein `.rg` fitxategitan erabiltzeko, nahikoa da goiburuan `import net_agent` deklaratzea eta bere funtzioei zuriuneekin edo azpimarrarekin deitzea.\n\n---\n\n## 3. `net_agent` APIaren erreferentzia azkarra\n\n| Sinadura / Funtzioa / Mota | Zer egiten duen eta noiz erabili |\n|---|---|\n| `net supervisor new : Int -> Int -> NetSupervisor` | `max_conns` muga eta `idle_timeout_ms` geldotasun-epemuga dituen konexio-gainbegiralea sortzen du |\n| `net register conn / net record rx / net record tx / net close conn` | Onartutako socketak erregistratu, byte/jarduera kontagailuak eguneratu eta parekoak ixten ditu |\n| `net evict idle : NetSupervisor -> Int -> (NetSupervisor, [Int])` | `idle_timeout_ms` baino gehiago geldirik dauden konexioak itxi eta kanporatzen ditu, FDak itzuliz |\n| `net poll fd : Int -> Bool -> Int -> NetEvent` | `NetEvReadyRead`, `NetEvReadyWrite`, `NetEvTimeout` edo `NetEvError` igortzen duen `wait fd` zubia |\n| `net tcp echo step : String -> Int -> (Int, String)` | Muturretik muturrerako TCP loopback urrats osoa (`listen/connect/accept/supervise/echo`) |\n\n---\n\n## 4. Errezeta praktikoak estilo taularatuan\n\n### 1. errezeta: Fluxu nagusia `net_agent` erabiliz\n\nIkusi nola `=` ikurrak eta eraldaketa-urratsak taula garbi bat bezala lerrokatuta geratzen diren:\n\n```ridgun\nimport net_agent\n\nfn :: supervisar clientes () => (Int, [Int])\n      supervisar clientes =\n        s0        = net supervisor new 100 5000\n        (s1, _)   = net register conn s0 10 \"10.0.0.1\" 51000 1000\n        (s2, _)   = net register conn s1 11 \"10.0.0.2\" 51001 6500\n        (s3, exp) = net evict idle s2 7000\n        (net active count s3, exp)\n```\n\n### 2. errezeta: Konposizio segurua eta albo-ondoriorik gabea\n\n`net_agent` lib-eko funtzio oro `ridgun-libs`-eko gainerako 32 lib-ekin konposa daiteke:\n\n```ridgun\nimport net_agent\n\nfn :: probar puente tcp supervisado () => (Int, String)\n      probar puente tcp supervisado =\n        net tcp echo step \"ping-supervisado\" 1000\n```\n\n---\n\n## 5. Kaputaren azpian: errendimendua, RMM memoria eta bermeak\n\n- **Berme algoritmikoa eta segurtasunekoa**: Deskribatzaileen agorpenaren aurkako babes automatikoa (`max_conns`), konexio geldoen kanporatze determinista eta socketen itxiera bermatua `net tcp echo step`-en.\n- **Memoria determinista (`RMM1`/`RMM2`)**: Zero zabor-biltzaile etenaldi; tarteko egitura guztiak modu deterministan askatzen dira esparrutik irtetean.\n- **Etengabeko egiaztapena**: Zorrotz probatua `stable check` eta `src/test/ridgun/test_net_agent.rg` suite automatizatuaren bidez.\n"}];
    const UI_STRINGS = {"copy_label": "Kopiatu", "copied_label": "Kopiatuta!", "prev_label": "&larr; Aurreko kapitulua", "next_label": "Hurrengo kapitulua &rarr;", "search_hits_label": "Emaitzak honentzat:", "search_empty_label": "Ez da bat-etortzerik aurkitu honentzat:"};
    let currentIdx = 0;

    function escapeHtml(s) {
      return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function highlightRidgun(code) {
      return code.split("\n").map(line => {
        const comIdx = (() => {
          let inD = false, inS = false;
          for (let i = 0; i < line.length - 1; i++) {
            if (line[i] === "\\") { i++; continue; }
            if (line[i] === '"' && !inS) inD = !inD;
            else if (line[i] === "'" && !inD) inS = !inS;
            else if (!inD && !inS && line[i] === "-" && line[i+1] === "-") return i;
          }
          return -1;
        })();
        const codePart = comIdx >= 0 ? line.slice(0, comIdx) : line;
        const comPart = comIdx >= 0 ? line.slice(comIdx) : "";
        let html = escapeHtml(codePart);
        html = html.replace(/("([^"\\]|\\.)*"|'[^']*')/g, '<span class="rg-str">$1</span>');
        html = html.replace(/\b(fn|op|type|import|mut|otherwise|with|region|timeout|do|global|context|shared|atomic|hardware|echo|and|or|xor|not|agent|send|to|receive|from|try|stop)\b/g, '<span class="rg-kw">$1</span>');
        html = html.replace(/\b(Int|Real|String|Char|Bool|U64|Tensor|Option|Result|Some|None|Ok|Err|OutOfMemory|Timeout|True|False)\b/g, '<span class="rg-ty">$1</span>');
        html = html.replace(/(::|=&gt;|-&gt;|&lt;-|\|\|\.|\|\||\|\.)/g, '<span class="rg-op">$1</span>');
        html = html.replace(/\b(0x[0-9a-fA-F_]+|[0-9][0-9_]*(_KB|_MB|_GB)?(\.[0-9]+)?)\b/g, '<span class="rg-num">$1</span>');
        if (comPart) {
          html += '<span class="rg-com">' + escapeHtml(comPart) + '</span>';
        }
        return html;
      }).join("\n");
    }

    function formatInline(text) {
      let out = escapeHtml(text);
      out = out.replace(/`([^`]+)`/g, "<code>$1</code>");
      out = out.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      out = out.replace(/\*([^*]+)\*/g, "<em>$1</em>");
      out = out.replace(/\$O\(([^)]+)\)\$/g, "<code>O($1)</code>");
      out = out.replace(/\$\\rightarrow\$/g, "&rarr;");
      return out;
    }

    function renderMarkdown(md) {
      const lines = md.split("\n");
      let html = "";
      let i = 0;
      while (i < lines.length) {
        const line = lines[i];
        if (line.startsWith("```")) {
          const lang = line.slice(3).trim() || "ridgun";
          i++;
          const buf = [];
          while (i < lines.length && !lines[i].startsWith("```")) {
            buf.push(lines[i]);
            i++;
          }
          i++;
          const rawCode = buf.join("\n");
          const bodyHtml = (lang === "ridgun" || lang === "") ? highlightRidgun(rawCode) : escapeHtml(rawCode);
          html += `<div class="code-wrapper"><div class="code-header"><span>${escapeHtml(lang)}</span><button class="copy-btn" onclick="copyCode(this)">${escapeHtml(UI_STRINGS.copy_label)}</button></div><pre data-raw="${ encodeURIComponent(rawCode) }"><code>${bodyHtml}</code></pre></div>`;
          continue;
        }
        if (/^---+$/.test(line.trim())) {
          html += "<hr />";
          i++;
          continue;
        }
        if (line.startsWith("# ")) {
          html += `<h1>${formatInline(line.slice(2).trim())}</h1>`;
          i++;
          continue;
        }
        if (line.startsWith("## ")) {
          html += `<h2>${formatInline(line.slice(3).trim())}</h2>`;
          i++;
          continue;
        }
        if (line.startsWith("### ")) {
          html += `<h3>${formatInline(line.slice(4).trim())}</h3>`;
          i++;
          continue;
        }
        if (line.trim().startsWith("|") && i + 1 < lines.length && /^\|[\s:-]+\|/.test(lines[i+1].trim())) {
          const headers = line.trim().slice(1, -1).split("|").map(c => formatInline(c.trim()));
          i += 2;
          const rows = [];
          while (i < lines.length && lines[i].trim().startsWith("|")) {
            rows.push(lines[i].trim().slice(1, -1).split("|").map(c => formatInline(c.trim())));
            i++;
          }
          html += '<div class="table-wrap"><table><thead><tr>' + headers.map(h => `<th>${h}</th>`).join("") + '</tr></thead><tbody>' +
                  rows.map(r => '<tr>' + r.map(c => `<td>${c}</td>`).join("") + '</tr>').join("") + '</tbody></table></div>';
          continue;
        }
        if (line.startsWith(">")) {
          const qLines = [];
          while (i < lines.length && lines[i].startsWith(">")) {
            qLines.push(lines[i].replace(/^>\s?/, ""));
            i++;
          }
          html += `<blockquote><p>${qLines.map(formatInline).join("<br/>")}</p></blockquote>`;
          continue;
        }
        if (/^\s*-\s+/.test(line)) {
          const items = [];
          while (i < lines.length && /^\s*-\s+/.test(lines[i])) {
            items.push(formatInline(lines[i].replace(/^\s*-\s+/, "")));
            i++;
          }
          html += "<ul>" + items.map(it => `<li>${it}</li>`).join("") + "</ul>";
          continue;
        }
        if (/^\s*\d+\.\s+/.test(line)) {
          const items = [];
          while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
            items.push(formatInline(lines[i].replace(/^\s*\d+\.\s+/, "")));
            i++;
          }
          html += "<ol>" + items.map(it => `<li>${it}</li>`).join("") + "</ol>";
          continue;
        }
        if (!line.trim()) {
          i++;
          continue;
        }
        const pLines = [];
        while (i < lines.length && lines[i].trim() && !lines[i].startsWith("#") && !lines[i].startsWith("```") && !lines[i].startsWith(">") && !lines[i].trim().startsWith("|") && !/^---+$/.test(lines[i].trim()) && !/^\s*(-|\d+\.)\s+/.test(lines[i])) {
          pLines.push(formatInline(lines[i]));
          i++;
        }
        html += `<p>${pLines.join(" ")}</p>`;
      }
      return html;
    }

    window.copyCode = function(btn) {
      const pre = btn.closest(".code-wrapper").querySelector("pre");
      const raw = decodeURIComponent(pre.getAttribute("data-raw"));
      navigator.clipboard.writeText(raw);
      const old = btn.textContent;
      btn.textContent = UI_STRINGS.copied_label;
      setTimeout(() => { btn.textContent = old; }, 1400);
    };

    function renderSidebar() {
      const nav = document.getElementById("navList");
      nav.innerHTML = CHAPTERS.map((ch, idx) => `
        <li class="nav-item">
          <button class="nav-btn ${idx === currentIdx ? 'active' : ''}" onclick="selectChapter(${idx})">
            <span class="nav-num">${ch.num}</span>
            <span>${escapeHtml(ch.short_title)}</span>
          </button>
        </li>
      `).join("");
    }

    window.selectChapter = function(idx) {
      currentIdx = idx;
      const ch = CHAPTERS[idx];
      location.hash = ch.slug;
      renderSidebar();
      let pagerHtml = '<div class="pager">';
      if (idx > 0) {
        pagerHtml += `<button class="pager-btn prev" onclick="selectChapter(${idx - 1})"><span class="pager-label">${UI_STRINGS.prev_label}</span><span class="pager-title">${escapeHtml(CHAPTERS[idx - 1].title)}</span></button>`;
      } else {
        pagerHtml += '<div></div>';
      }
      if (idx + 1 < CHAPTERS.length) {
        pagerHtml += `<button class="pager-btn next" onclick="selectChapter(${idx + 1})"><span class="pager-label">${UI_STRINGS.next_label}</span><span class="pager-title">${escapeHtml(CHAPTERS[idx + 1].title)}</span></button>`;
      }
      pagerHtml += '</div>';
      document.getElementById("chapterContent").innerHTML = renderMarkdown(ch.markdown) + pagerHtml;
      window.scrollTo({ top: 0, behavior: "smooth" });
    };

    document.getElementById("searchInput").addEventListener("input", (e) => {
      const q = e.target.value.trim().toLowerCase();
      if (q.length < 2) {
        selectChapter(currentIdx);
        return;
      }
      const hits = [];
      CHAPTERS.forEach((ch, idx) => {
        const lines = ch.markdown.split("\n");
        for (const l of lines) {
          if (l.toLowerCase().includes(q)) {
            hits.push({ idx, title: ch.title, snippet: l.replace(/^[#>*-]+\s*/, "").slice(0, 140) });
            break;
          }
        }
      });
      const box = hits.length
        ? `<div class="search-results"><strong>${escapeHtml(UI_STRINGS.search_hits_label)} "${escapeHtml(q)}" (${hits.length}):</strong>` +
          hits.map(h => `<div class="search-hit" onclick="document.getElementById('searchInput').value=''; selectChapter(${h.idx})"><div class="search-hit-title">${escapeHtml(h.title)}</div><div class="search-hit-snippet">${escapeHtml(h.snippet)}</div></div>`).join("") +
          `</div>`
        : `<div class="search-results">${escapeHtml(UI_STRINGS.search_empty_label)} "${escapeHtml(q)}".</div>`;
      document.getElementById("chapterContent").innerHTML = box + renderMarkdown(CHAPTERS[currentIdx].markdown);
    });

    document.getElementById("themeBtn").addEventListener("click", () => {
      const root = document.documentElement;
      root.setAttribute("data-theme", root.getAttribute("data-theme") === "dark" ? "light" : "dark");
    });

    const initialSlug = location.hash.replace(/^#/, "");
    const foundIdx = CHAPTERS.findIndex(c => c.slug === initialSlug);
    selectChapter(foundIdx >= 0 ? foundIdx : 0);
  </script>
</body>
</html>
