  <script>
    const CHAPTERS = [{"num": "00", "slug": "00-por-que-preciso-ridgun-libs", "file": "00-por-que-preciso-ridgun-libs.md", "title": "Capítulo 00: Por que preciso `ridgun-libs`? 32 libs sen unha liña de C? Cóntame máis!", "short_title": "Por que preciso `ridgun-libs`? 32 libs sen unha liña de C? Cóntame máis!", "markdown": "# Capítulo 00: Por que preciso `ridgun-libs`? 32 libs sen unha liña de C? Cóntame máis!\n\nSexamos sinceros: cando descobres que unha linguaxe compila a un binario ELF nativo minúsculo e sen colector de lixo, a segunda pregunta que te fas —con toda a razón do mundo— é:\n\n> *\"Vale, a linguaxe mola moito... pero cando teña que abrir un socket TCP, calcular un hash Argon2id, analizar un JSON, resolver un sistema lineal con tensores ou montar un pool de actores, vou ter que enlazar `libc`, `OpenSSL`, `libcurl` e `pcre2`, ou descargar 800 paquetes de terceiros mantidos por un descoñecido?\"*\n\nÉ unha pregunta excelente. E a resposta curta é: **non**. Para iso existe **`ridgun-libs`**: unha suite de **32 libs fundamentais** escritas ao **100 % en Ridgun puro (`v0.9.16`)**, con **cero dependencias en C** e **cero `libc`**.\n\nPoñámoslle nome ás catro dores diarias que `ridgun-libs` elimina de raíz.\n\n---\n\n## Dor n.º 1: \"O inferno de `libc`, OpenSSL e o enlazado cruzado\"\n\nSeguro que xa viviches este pesadelo:\n\n1. Escribes un servidor ou unha ferramenta CLI supostamente \"estática\" ou \"portable\".\n2. En canto precisas criptografía (`SHA-256`, `Argon2id`, `ChaCha20-Poly1305`), rede (`DNS`, `HTTP`, `WebSockets`) ou expresións regulares, o teu programa acaba dependendo de `glibc 2.38`, `libssl.so.3` e tres cabeceiras de C.\n3. Intentas copiar o binario a un contedor mínimo ou a outra distribución Linux e estoura ao arrincar co infame `version 'GLIBC_2.38' not found`.\n\n**Que muda con `ridgun-libs`?**\nCada unha das 32 libs deste repositorio está escrita integramente en Ridgun tabular e fala directamente co núcleo do sistema operativo mediante a capa PAL (`posix`) ou executa algoritmos puros en memoria determinista (`RMM1`/`RMM2`). Compílanse tanto a paquetes portables (`.rglib` / `.rgc`) como a obxectos compartidos ELF64 nativos (`lib*.so`). Sen `libc`, sen FFI fráxil e sen sorpresas ao despregar.\n\n---\n\n## Dor n.º 2: \"A síndrome do `node_modules` / `Cargo.lock` de 400 dependencias\"\n\nEn moitos ecosistemas modernos, a biblioteca estándar é tan esquelética que para ler un ficheiro `.ini`, validar un `UUIDv7`, aplicar un parche Unified Diff ou renderizar un modelo HTML seguro precisas instalar media ducia de paquetes externos.\n\nEn **`ridgun-libs`**, as **32 libs** seguen unha única filosofía de deseño:\n\n```ridgun\nimport crypto\nimport json\nimport http\n\nfn :: autenticar y pedir (token : String) => String\n      autenticar y pedir token =\n        -- Todas as libs comparten tipos puros, aliñamento tabular e semántica determinista\n        mac_hex = sha256 hex token\n        cuerpo  = json stringify (JnObj [(\"token_sha256\", JnStr mac_hex)])\n        pet     = http build request \"POST\" \"/v1/sesion\" [(\"Content-Type\", \"application/json\")] cuerpo\n        pet\n```\n\nMesma estética tabular, mesmos ADTs inmutables (`Option`, `Result`, `IoResult`, `JsonVal`), cero efectos laterais ocultos.\n\n---\n\n## Dor n.º 3: \"Expresións regulares que colgan a CPU (ReDoS) e sockets que bloquean para sempre\"\n\nDúas bombas de reloxaría clásicas en produción:\n\n- Un usuario malicioso envía unha cadea deseñada para que o teu motor de expresións regulares con *backtracking* entre en tempo exponencial $O(2^N)$ e deixe frito un núcleo ao 100 %.\n- Un descritor de rede queda medio aberto e o teu fío queda bloqueado eternamente agardando un `read()` sen data límite.\n\nEn **`ridgun-libs`**:\n- A lib **`regex`** (Capítulo 11) implementa un autómata **NFA de Thompson** que garante tempo lineal estrito **$O(N \\cdot M)$**: inmune por construción a ataques ReDoS.\n- As libs **`posix`**, **`io`** e **`socket`** (Capítulos 22, 23 e 27) integran cotas léxicas `with timeout` e `ppoll` a nivel de descritor: ningunha operación de entrada/saída pode colgar o teu servizo.\n\n---\n\n## Dor n.º 4: \"Criptografía e álxebra lineal que parecen xeroglíficos\"\n\nEn **`ridgun-libs`**, a potencia dos tipos `Tensor[...]` de Ridgun permite que libs coma **`tensor`** (Capítulo 05), **`linalg`** (Capítulo 06) e **`argon2id`** (Capítulo 25) operen sobre bloques de memoria contigua (`Tensor[U64 * 8 * 16]`, `Tensor[Real]`) mantendo a lexibilidade dunha táboa matemática.\n\n---\n\n## Mapa completo do libro: 32 capítulos para 32 libs\n\nCada capítulo deste libro está dedicado a **unha lib** de `ridgun-libs`, agrupadas nunha progresión lóxica de abaixo cara arriba:\n\n| Capítulos | Familia de libs | Libs incluídas |\n|---|---|---|\n| **01 – 04** | Texto, Matemáticas e Estruturas de Datos | `str`, `math`, `list`, `btree` |\n| **05 – 06** | Tensores e Álxebra Lineal | `tensor`, `linalg` |\n| **07 – 10** | Codificación e Formatos de Datos | `codec`, `json`, `csv`, `ini` |\n| **11 – 15** | Motores de Texto, Diffs, Modelos e Formatado | `regex`, `glob`, `diff`, `template`, `fmt` |\n| **16 – 21** | CLI, Rutas, Tempo, UUIDs, Logs e Testing | `cli`, `path`, `time`, `uuid`, `log`, `test` |\n| **22 – 23** | Sistemas POSIX e E/S con Timeout | `posix`, `io` |\n| **24 – 26** | Criptografía, Argon2id e Tokens JWT | `crypto`, `argon2id`, `jwt` |\n| **27 – 29** | Redes, Sockets do Kernel, HTTP/1.1 e WebSockets | `socket`, `http`, `ws` |\n| **30 – 32** | Concorrencia de Actores, Pools e Supervisión de Rede | `agent`, `pool`, `net_agent` |\n\nImos aló! Pasa ao **Capítulo 01 (`str`)** e comecemos a construír.\n"}, {"num": "01", "slug": "01-lib-str-manipulacion-de-texto", "file": "01-lib-str-manipulacion-de-texto.md", "title": "Capítulo 01: A lib `str` — Manipulación de Texto, Busca e Formato Tabular", "short_title": "A lib `str` — Manipulación de Texto, Busca e Formato Tabular", "markdown": "# Capítulo 01: A lib `str` — Manipulación de Texto, Busca e Formato Tabular\n\n## 1. Por que existe a lib `str`?\n\nSexamos sinceros: en C manipular cadeas con `strtok` e `strncpy` é camiñar por un campo de minas de desbordamentos de búfer e punteiros `NULL`, e noutras linguaxes acabas importando tres paquetes só para aliñar columnas ou repetir un separador en $O(\\log N)$.\n\nA lib **`str`** proporciona todas as primitivas puras e inmutables para buscar, recortar, dividir, unir, cambiar maiúsculas/minúsculas, repetir por duplicación binaria $O(\\log N)$ e encher cadeas.\n\n---\n\n## 2. Artefactos, importación e arquitectura sen `libc`\n\nEn `ridgun-libs`, **`str`** é unha **lib** de primeira clase situada en `src/main/ridgun/lib/str.rg` (dominio `STR`). Ao compilar con `stable bundle`, empaquétase en tres formatos nativos:\n\n| Artefacto | Ruta | Propósito |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/str.rglib` | Distribución e importación directa con `import str` |\n| **Ficheiro compilado** | `target/str.rgc` | Artefacto intermedio verificado por `ridgunc` |\n| **Obxecto compartido ELF64** | `target/libstr.so` | Biblioteca dinámica nativa sen dependencias de C nin `libc` |\n\n> Para usar esta lib en calquera ficheiro `.rg`, abonda con declarar `import str` na cabeceira e chamar ás súas funcións con espazos ou guións baixos indistintamente.\n\n---\n\n## 3. Referencia rápida da API de `str`\n\n| Sinatura / Función / Tipo | Que fai e cando usala |\n|---|---|\n| `str index of : String -> String -> Int` | Primeiro índice da subcadea (`-1` se non existe / `0` se é baleira) |\n| `str contains / str starts with / str ends with` | Predicados `Bool` de subcadea, prefixo e sufixo |\n| `str trim / str trim left / str trim right` | Elimina espazos en branco ASCII (` `, `\\t`, `\\n`, `\\r`) |\n| `str split / str lines / str words / str join` | Divide en `[String]` e une listas cun separador |\n| `str replace / str to upper / str to lower` | Substitución sen solapamento e conversión ASCII de maiúsculas/minúsculas |\n| `str repeat / str pad left / str pad right` | Repetición en $O(\\log N)$ e recheo de columnas a ancho fixo |\n\n---\n\n## 4. Receitas prácticas en estilo tabular\n\n### Receita 1: Fluxo principal con `str`\n\nObserva como os signos `=` e os pasos de transformación quedan aliñados coma unha táboa limpa:\n\n```ridgun\nimport str\n\nfn :: normalizar cabecera (raw : String) => String\n      normalizar cabecera raw =\n        limpia = str to lower (str trim raw)\n        partes = str words limpia\n        slug   = str join partes \"-\"\n        str pad right slug 24 \".\"\n```\n\n### Receita 2: Composición segura e sen efectos laterais\n\nToda función da lib `str` é compoñible co resto das 32 libs de `ridgun-libs`:\n\n```ridgun\nimport str\n\nfn :: extraer dominio (correo : String) => String\n      extraer dominio correo =\n        pos = str index of correo \"@\"\n        | pos < 0   = \"sin-dominio\"\n        | otherwise =\n          partes = str split correo \"@\"\n          str replace (str to lower correo) \"@\" \" en \"\n```\n\n---\n\n## 5. Baixo o capó: rendemento, memoria RMM e garantías\n\n- **Garantía algorítmica e de seguridade**: Repetición en $O(\\log N)$ mediante duplicación de cadeas, predicados seguros ante agullas baleiras e cero mutación no lugar.\n- **Memoria determinista (`RMM1`/`RMM2`)**: Cero pausas de colector de lixo; todas as estruturas intermedias libéranse de forma determinista ao saír do ámbito.\n- **Verificación continua**: Probada exhaustivamente con `stable check` e a suite automatizada `src/test/ridgun/test_str.rg`.\n"}, {"num": "02", "slug": "02-lib-math-aritmetica-e-teoria-de-numeros", "file": "02-lib-math-aritmetica-e-teoria-de-numeros.md", "title": "Capítulo 02: A lib `math` — Aritmética Segura, Teoría de Números e Estatística", "short_title": "A lib `math` — Aritmética Segura, Teoría de Números e Estatística", "markdown": "# Capítulo 02: A lib `math` — Aritmética Segura, Teoría de Números e Estatística\n\n## 1. Por que existe a lib `math`?\n\nSexamos sinceros: unha división por cero inesperada en produción ou o operador `%` devolvendo restos negativos en C ou Java teñen tombado máis servizos dos que nos gusta admitir.\n\nA lib **`math`** ofrece divisións totais a proba de `d == 0` (`div ceil`, `div floor`, `div euclid`, `mod euclid`), exponenciación e inverso modular en $O(\\log E)$, raíces e logaritmos enteiros exactos, combinatoria, primalidade e o operador mixfix `clamp x between lo and hi`.\n\n---\n\n## 2. Artefactos, importación e arquitectura sen `libc`\n\nEn `ridgun-libs`, **`math`** é unha **lib** de primeira clase situada en `src/main/ridgun/lib/math.rg` (dominio `MATH`). Ao compilar con `stable bundle`, empaquétase en tres formatos nativos:\n\n| Artefacto | Ruta | Propósito |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/math.rglib` | Distribución e importación directa con `import math` |\n| **Ficheiro compilado** | `target/math.rgc` | Artefacto intermedio verificado por `ridgunc` |\n| **Obxecto compartido ELF64** | `target/libmath.so` | Biblioteca dinámica nativa sen dependencias de C nin `libc` |\n\n> Para usar esta lib en calquera ficheiro `.rg`, abonda con declarar `import math` na cabeceira e chamar ás súas funcións con espazos ou guións baixos indistintamente.\n\n---\n\n## 3. Referencia rápida da API de `math`\n\n| Sinatura / Función / Tipo | Que fai e cando usala |\n|---|---|\n| `math abs / math sign / math min / math max` | Magnitude absoluta, signo (`-1, 0, 1`) e extremos |\n| `clamp x between lo and hi` | Operador mixfix (`op ::`) que acouta `x` ao rango `[lo, hi]` |\n| `math div ceil / math div floor / math div euclid / math mod euclid` | Redondeo seguro ante división por cero e resto euclidiano non negativo |\n| `math pow / math isqrt / math ilog2 / math ilog10` | Potencia en $O(\\log E)$, raíz cadrada enteira de Newton e logaritmos enteiros |\n| `math gcd / math lcm / math mod pow / math mod inv / math is prime` | MCD/MCM de Euclides, aritmética modular e test de primalidade $6k \\pm 1$ |\n| `math sum / math mean floor / math median floor / math variance floor` | Combinatoria (`nCr`) sen desbordamento e estatística enteira sobre listas |\n\n---\n\n## 4. Receitas prácticas en estilo tabular\n\n### Receita 1: Fluxo principal con `math`\n\nObserva como os signos `=` e os pasos de transformación quedan aliñados coma unha táboa limpa:\n\n```ridgun\nimport math\n\nfn :: verificar clave modular (base : Int) (primo : Int) => (Int, Int, Bool)\n      verificar clave modular base primo =\n        es_p = math is prime primo\n        pot  = math mod pow base (primo - 1) primo\n        inv  = math mod inv base primo\n        (pot, inv, es_p)\n```\n\n### Receita 2: Composición segura e sen efectos laterais\n\nToda función da lib `math` é compoñible co resto das 32 libs de `ridgun-libs`:\n\n```ridgun\nimport math\n\nfn :: calcular paginas y cuota (items : Int) (por_pag : Int) (uso : Int) => (Int, Int)\n      calcular paginas y cuota items por_pag uso =\n        pags  = math div ceil items por_pag\n        cuota = clamp uso between 0 and 100\n        (pags, cuota)\n```\n\n---\n\n## 5. Baixo o capó: rendemento, memoria RMM e garantías\n\n- **Garantía algorítmica e de seguridade**: Funcións totais (devolven `0` cando o divisor ou módulo é `<= 0` en vez de abortar con `SIGFPE`), sen coma flotante imprecisa.\n- **Memoria determinista (`RMM1`/`RMM2`)**: Cero pausas de colector de lixo; todas as estruturas intermedias libéranse de forma determinista ao saír do ámbito.\n- **Verificación continua**: Probada exhaustivamente con `stable check` e a suite automatizada `src/test/ridgun/test_math.rg`.\n"}, {"num": "03", "slug": "03-lib-list-listas-mergesort-e-mapas-kv", "file": "03-lib-list-listas-mergesort-e-mapas-kv.md", "title": "Capítulo 03: A lib `list` — Listas, Mergesort $O(N \\log N)$ e Mapas Chave-Valor", "short_title": "A lib `list` — Listas, Mergesort $O(N \\log N)$ e Mapas Chave-Valor", "markdown": "# Capítulo 03: A lib `list` — Listas, Mergesort $O(N \\log N)$ e Mapas Chave-Valor\n\n## 1. Por que existe a lib `list`?\n\nSexamos sinceros: acceder a un índice fóra de rango (`IndexError` / `panic!`) ou mutar unha lista compartida por accidente son dous dos erros máis frecuentes ao procesar coleccións.\n\nA lib **`list`** proporciona indexación con valor por defecto, rebandado (`take`, `drop`, `slice`), rangos con paso, deduplicación estable, ordenación **mergesort $O(N \\log N)$** para `[Int]` e `[String]`, e dicionarios asociativos inmutables `[String String]` (`kv get`, `kv put`, `kv merge`).\n\n---\n\n## 2. Artefactos, importación e arquitectura sen `libc`\n\nEn `ridgun-libs`, **`list`** é unha **lib** de primeira clase situada en `src/main/ridgun/lib/list.rg` (dominio `LIST`). Ao compilar con `stable bundle`, empaquétase en tres formatos nativos:\n\n| Artefacto | Ruta | Propósito |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/list.rglib` | Distribución e importación directa con `import list` |\n| **Ficheiro compilado** | `target/list.rgc` | Artefacto intermedio verificado por `ridgunc` |\n| **Obxecto compartido ELF64** | `target/liblist.so` | Biblioteca dinámica nativa sen dependencias de C nin `libc` |\n\n> Para usar esta lib en calquera ficheiro `.rg`, abonda con declarar `import list` na cabeceira e chamar ás súas funcións con espazos ou guións baixos indistintamente.\n\n---\n\n## 3. Referencia rápida da API de `list`\n\n| Sinatura / Función / Tipo | Que fai e cando usala |\n|---|---|\n| `list nth or / list str nth or` | Lectura segura por índice devolvendo `default_val` se está fóra de rango |\n| `list take / list drop / list slice / list reverse` | Prefixo, sufixo, subrango `[start, end)` e inversión recursiva de cola |\n| `list range / list range step` | Xera secuencias aritméticas (`step == 0` devolve `[]` de forma segura) |\n| `list sort / list str sort / list dedup / list str dedup` | Ordenación mergesort $O(N \\log N)$ estable e deduplicación por primeira aparición |\n| `kv empty / kv put / kv get / kv get or / kv remove / kv merge` | Operacións sobre dicionarios asociativos ordenados `[String String]` |\n\n---\n\n## 4. Receitas prácticas en estilo tabular\n\n### Receita 1: Fluxo principal con `list`\n\nObserva como os signos `=` e os pasos de transformación quedan aliñados coma unha táboa limpa:\n\n```ridgun\nimport list\n\nfn :: top tres unicos (puntos : [Int]) => [Int]\n      top tres unicos puntos =\n        unicos    = list dedup puntos\n        ordenados = list reverse (list sort unicos)\n        list take ordenados 3\n```\n\n### Receita 2: Composición segura e sen efectos laterais\n\nToda función da lib `list` é compoñible co resto das 32 libs de `ridgun-libs`:\n\n```ridgun\nimport list\n\nfn :: configurar entorno (base : [String String]) => (String, [String])\n      configurar entorno base =\n        cfg1 = kv put base \"host\" \"0.0.0.0\"\n        cfg2 = kv put cfg1 \"port\" \"8080\"\n        host = kv get or cfg2 \"host\" \"127.0.0.1\"\n        (host, kv keys cfg2)\n```\n\n---\n\n## 5. Baixo o capó: rendemento, memoria RMM e garantías\n\n- **Garantía algorítmica e de seguridade**: Ordenación determinista $O(N \\log N)$ no peor caso (sen o $O(N^2)$ patolóxico de Quicksort) e preservación da orde de inserción en mapas `kv`.\n- **Memoria determinista (`RMM1`/`RMM2`)**: Cero pausas de colector de lixo; todas as estruturas intermedias libéranse de forma determinista ao saír do ámbito.\n- **Verificación continua**: Probada exhaustivamente con `stable check` e a suite automatizada `src/test/ridgun/test_list.rg`.\n"}, {"num": "04", "slug": "04-lib-btree-arbores-avl-conxuntos-e-monticulos", "file": "04-lib-btree-arbores-avl-conxuntos-e-monticulos.md", "title": "Capítulo 04: A lib `btree` — Árbores AVL Persistentes $O(\\log N)$, Conxuntos e Montículos", "short_title": "A lib `btree` — Árbores AVL Persistentes $O(\\log N)$, Conxuntos e Montículos", "markdown": "# Capítulo 04: A lib `btree` — Árbores AVL Persistentes $O(\\log N)$, Conxuntos e Montículos\n\n## 1. Por que existe a lib `btree`?\n\nSexamos sinceros: as táboas hash mutables sofren ataques de colisión de chaves (HashDoS), non manteñen as chaves ordenadas para consultas por rango e non se poden compartir entre actores sen copialas enteiras ou meter un cadeado.\n\nA lib **`btree`** implementa tres estruturas de datos funcionais persistentes en $O(\\log N)$ con compartición estrutural: **`BTreeMap`** (árbore AVL autobalanceada), **`BTreeSet`** (álxebra de conxuntos ordenada) e **`MinHeap`** (fila de prioridade *leftist heap*).\n\n---\n\n## 2. Artefactos, importación e arquitectura sen `libc`\n\nEn `ridgun-libs`, **`btree`** é unha **lib** de primeira clase situada en `src/main/ridgun/lib/btree.rg` (dominio `BTREE`). Ao compilar con `stable bundle`, empaquétase en tres formatos nativos:\n\n| Artefacto | Ruta | Propósito |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/btree.rglib` | Distribución e importación directa con `import btree` |\n| **Ficheiro compilado** | `target/btree.rgc` | Artefacto intermedio verificado por `ridgunc` |\n| **Obxecto compartido ELF64** | `target/libbtree.so` | Biblioteca dinámica nativa sen dependencias de C nin `libc` |\n\n> Para usar esta lib en calquera ficheiro `.rg`, abonda con declarar `import btree` na cabeceira e chamar ás súas funcións con espazos ou guións baixos indistintamente.\n\n---\n\n## 3. Referencia rápida da API de `btree`\n\n| Sinatura / Función / Tipo | Que fai e cando usala |\n|---|---|\n| `btree empty / btree insert / btree get / btree remove` | Busca, inserción e borrado persistente en dicionario AVL en $O(\\log N)$ |\n| `btree min key / btree max key / btree range` | Extremos ordenados e consulta por rango `[lo, hi]` |\n| `bset from list / bset union / bset intersect / bset diff` | Álxebra de conxuntos ordenados (`BTreeSet`) e predicado de subconxunto |\n| `heap empty / heap push / heap peek / heap pop / heap sort` | Fila de prioridade `MinHeap` (*leftist heap*) con fusión en $O(\\log N)$ |\n\n---\n\n## 4. Receitas prácticas en estilo tabular\n\n### Receita 1: Fluxo principal con `btree`\n\nObserva como os signos `=` e os pasos de transformación quedan aliñados coma unha táboa limpa:\n\n```ridgun\nimport btree\n\nfn :: consultar rango precios () => [String String]\n      consultar rango precios =\n        t0 = btree empty\n        t1 = btree insert t0 \"item:10\" \"Teclado\"\n        t2 = btree insert t1 \"item:20\" \"Monitor\"\n        t3 = btree insert t2 \"item:30\" \"Raton\"\n        btree range t3 \"item:10\" \"item:25\"\n```\n\n### Receita 2: Composición segura e sen efectos laterais\n\nToda función da lib `btree` é compoñible co resto das 32 libs de `ridgun-libs`:\n\n```ridgun\nimport btree\n\nfn :: despachar urgente () => (Int, String)\n      despachar urgente =\n        h0 = heap empty\n        h1 = heap push h0 50 \"backup-nocturno\"\n        h2 = heap push h1 10 \"alerta-seguridad\"\n        h3 = heap push h2 30 \"rotar-logs\"\n        heap peek h3\n```\n\n---\n\n## 5. Baixo o capó: rendemento, memoria RMM e garantías\n\n- **Garantía algorítmica e de seguridade**: Rotacións AVL estritas (`height diff <= 1`), inmunidade total a HashDoS, consultas por rango en $O(\\log N + K)$ e fusión de montículos en $O(\\log N)$.\n- **Memoria determinista (`RMM1`/`RMM2`)**: Cero pausas de colector de lixo; todas as estruturas intermedias libéranse de forma determinista ao saír do ámbito.\n- **Verificación continua**: Probada exhaustivamente con `stable check` e a suite automatizada `src/test/ridgun/test_btree.rg`.\n"}, {"num": "05", "slug": "05-lib-tensor-tensores-multidimensionais", "file": "05-lib-tensor-tensores-multidimensionais.md", "title": "Capítulo 05: A lib `tensor` — Tensores Multidimensionais, Vistas e Contracción de Einstein", "short_title": "A lib `tensor` — Tensores Multidimensionais, Vistas e Contracción de Einstein", "markdown": "# Capítulo 05: A lib `tensor` — Tensores Multidimensionais, Vistas e Contracción de Einstein\n\n## 1. Por que existe a lib `tensor`?\n\nSexamos sinceros: na maioría de linguaxes tes que escoller entre listas aniñadas lentísimas cheas de punteiros dispersos ou enlazar unha mole de C++/Fortran de 200 MB coma NumPy/BLAS.\n\nA lib **`tensor`** envolve a primitiva nativa `Tensor[...]` de Ridgun ofrecendo creación tipada (`Tensor[Int]`, `Tensor[Real]`, `Tensor[U64]`), vistas sen copia (`reshape`, `slice`), operacións elemento a elemento (Hadamard), contracción de Einstein (`*` sobre eixos simbólicos) e aritmética `BlaMka` de 64 bits.\n\n---\n\n## 2. Artefactos, importación e arquitectura sen `libc`\n\nEn `ridgun-libs`, **`tensor`** é unha **lib** de primeira clase situada en `src/main/ridgun/lib/tensor.rg` (dominio `TENSOR`). Ao compilar con `stable bundle`, empaquétase en tres formatos nativos:\n\n| Artefacto | Ruta | Propósito |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/tensor.rglib` | Distribución e importación directa con `import tensor` |\n| **Ficheiro compilado** | `target/tensor.rgc` | Artefacto intermedio verificado por `ridgunc` |\n| **Obxecto compartido ELF64** | `target/libtensor.so` | Biblioteca dinámica nativa sen dependencias de C nin `libc` |\n\n> Para usar esta lib en calquera ficheiro `.rg`, abonda con declarar `import tensor` na cabeceira e chamar ás súas funcións con espazos ou guións baixos indistintamente.\n\n---\n\n## 3. Referencia rápida da API de `tensor`\n\n| Sinatura / Función / Tipo | Que fai e cando usala |\n|---|---|\n| `tensor zeros int / tensor fill int / tensor zeros real` | Reserva bloques contiguos 1D/2D de `Tensor[Int]` e `Tensor[Real]` |\n| `tensor get 1d / tensor set 1d / tensor get 2d / tensor set 2d` | Acceso e actualización funcional Copy-on-Write (`with [i] = v`) |\n| `tensor reshape 1d to 2d / tensor slice 1d` | Vistas de descritor en $O(1)$ sen copiar o almacenamento do tensor |\n| `tensor add int / tensor mul int / tensor scale int` | Suma, multiplicación elemento a elemento (Hadamard) e escalado |\n| `tensor dot int / tensor matmul int` | Contracción de índices de Einstein (`a[i] * b[i]`, `a[i, k] * b[k, j]`) |\n| `u64 blamka g / u64 rotr` | Mestura rotacional `U64` sen signo de 64 bits para bloques criptográficos |\n\n---\n\n## 4. Receitas prácticas en estilo tabular\n\n### Receita 1: Fluxo principal con `tensor`\n\nObserva como os signos `=` e os pasos de transformación quedan aliñados coma unha táboa limpa:\n\n```ridgun\nimport tensor\n\nfn :: producto matricial tensor () => Tensor[Int]\n      producto matricial tensor =\n        a = tensor reshape 1d to 2d (tensor from list int [1, 2, 3, 4]) 2 2\n        b = tensor reshape 1d to 2d (tensor from list int [5, 6, 7, 8]) 2 2\n        tensor matmul int a b\n```\n\n### Receita 2: Composición segura e sen efectos laterais\n\nToda función da lib `tensor` é compoñible co resto das 32 libs de `ridgun-libs`:\n\n```ridgun\nimport tensor\n\nfn :: energia vector (xs : [Int]) => (Int, Int)\n      energia vector xs =\n        v   = tensor from list int xs\n        dot = tensor dot int v v\n        mx  = tensor max int v\n        (dot, mx)\n```\n\n---\n\n## 5. Baixo o capó: rendemento, memoria RMM e garantías\n\n- **Garantía algorítmica e de seguridade**: Memoria contigua de 8 bytes por cela xestionada estaticamente por RMM1/RMM2, vistas en $O(1)$ sen duplicar o búfer e semántica pura Copy-on-Write.\n- **Memoria determinista (`RMM1`/`RMM2`)**: Cero pausas de colector de lixo; todas as estruturas intermedias libéranse de forma determinista ao saír do ámbito.\n- **Verificación continua**: Probada exhaustivamente con `stable check` e a suite automatizada `src/test/ridgun/test_tensor.rg`.\n"}, {"num": "06", "slug": "06-lib-linalg-alxebra-lineal-e-tensores", "file": "06-lib-linalg-alxebra-lineal-e-tensores.md", "title": "Capítulo 06: A lib `linalg` — Álxebra Lineal sobre `Tensor[Real]`, Bareiss e Activacións", "short_title": "A lib `linalg` — Álxebra Lineal sobre `Tensor[Real]`, Bareiss e Activacións", "markdown": "# Capítulo 06: A lib `linalg` — Álxebra Lineal sobre `Tensor[Real]`, Bareiss e Activacións\n\n## 1. Por que existe a lib `linalg`?\n\nSexamos sinceros: cando queres calcular similitude coseno para embeddings, resolver $A x = b$ ou avaliar unha capa `softmax` nun binario lixeiro, non queres arrastrar 400 MB de PyTorch ou LAPACK.\n\nA lib **`linalg`** constrúe álxebra lineal numérica sobre `Tensor[Real]` nativo: transposición, traza, identidade, produto interno/externo, multiplicación matriz-vector e matriz-matriz con notación de Einstein, normas ($L_1, L_2, L_\\infty$, Frobenius), determinante e resolución lineal $A x = b$ mediante eliminación de **Bareiss/Gauss con pivoteo parcial**, e activacións neuronais (`relu`, `sigmoid`, `softmax`).\n\n---\n\n## 2. Artefactos, importación e arquitectura sen `libc`\n\nEn `ridgun-libs`, **`linalg`** é unha **lib** de primeira clase situada en `src/main/ridgun/lib/linalg.rg` (dominio `LINALG`). Ao compilar con `stable bundle`, empaquétase en tres formatos nativos:\n\n| Artefacto | Ruta | Propósito |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/linalg.rglib` | Distribución e importación directa con `import linalg` |\n| **Ficheiro compilado** | `target/linalg.rgc` | Artefacto intermedio verificado por `ridgunc` |\n| **Obxecto compartido ELF64** | `target/liblinalg.so` | Biblioteca dinámica nativa sen dependencias de C nin `libc` |\n\n> Para usar esta lib en calquera ficheiro `.rg`, abonda con declarar `import linalg` na cabeceira e chamar ás súas funcións con espazos ou guións baixos indistintamente.\n\n---\n\n## 3. Referencia rápida da API de `linalg`\n\n| Sinatura / Función / Tipo | Que fai e cando usala |\n|---|---|\n| `linalg vec from list / linalg mat from lists` | Constrúe `Tensor[Real]` 1D e 2D a partir de listas de Ridgun |\n| `linalg transpose / linalg trace / linalg diag / linalg identity` | Transformacións estruturais de matrices e matriz identidade |\n| `linalg dot / linalg outer / linalg matvec / linalg matmul` | Einstein contraction (`a[i] * b[i]`, `a[i, k] * b[k, j]`) |\n| `linalg norm l1 / linalg norm l2 / linalg cosine similarity` | Normas vectoriais/matriciais, normalización e similitude coseno |\n| `linalg det / linalg solve` | Determinante exacto de Bareiss e resolución $A x = b$ con pivoteo parcial (`Option[Tensor[Real]]`) |\n| `linalg relu / linalg sigmoid / linalg softmax` | Activacións neuronais numericamente estables con desprazamento polo máximo |\n\n---\n\n## 4. Receitas prácticas en estilo tabular\n\n### Receita 1: Fluxo principal con `linalg`\n\nObserva como os signos `=` e os pasos de transformación quedan aliñados coma unha táboa limpa:\n\n```ridgun\nimport linalg\n\nfn :: resolver sistema lineal () => Option[Tensor[Real]]\n      resolver sistema lineal =\n        -- Resuelve 2x + y = 5, x + 3y = 10 -> x = 1.0, y = 3.0\n        a = linalg mat from lists [[2.0, 1.0], [1.0, 3.0]]\n        b = linalg vec from list [5.0, 10.0]\n        linalg solve a b\n```\n\n### Receita 2: Composición segura e sen efectos laterais\n\nToda función da lib `linalg` é compoñible co resto das 32 libs de `ridgun-libs`:\n\n```ridgun\nimport linalg\n\nfn :: puntuar embeddings () => (Real, Tensor[Real])\n      puntuar embeddings =\n        q     = linalg vec from list [1.0, 2.0, 3.0]\n        d     = linalg vec from list [1.0, 2.0, 3.0]\n        sim   = linalg cosine similarity q d\n        probs = linalg softmax q\n        (sim, probs)\n```\n\n---\n\n## 5. Baixo o capó: rendemento, memoria RMM e garantías\n\n- **Garantía algorítmica e de seguridade**: As matrices singulares devolven `None` limpamente en `linalg solve` (sen `NaN` silenciosos), e `linalg softmax` resta o máximo antes de exponenciar para evitar desbordamentos.\n- **Memoria determinista (`RMM1`/`RMM2`)**: Cero pausas de colector de lixo; todas as estruturas intermedias libéranse de forma determinista ao saír do ámbito.\n- **Verificación continua**: Probada exhaustivamente con `stable check` e a suite automatizada `src/test/ridgun/test_linalg.rg`.\n"}, {"num": "07", "slug": "07-lib-codec-hex-base64-e-url", "file": "07-lib-codec-hex-base64-e-url.md", "title": "Capítulo 07: A lib `codec` — Hex, Base64, Base64url, URL Percent-Encoding e JSON Lixeiro", "short_title": "A lib `codec` — Hex, Base64, Base64url, URL Percent-Encoding e JSON Lixeiro", "markdown": "# Capítulo 07: A lib `codec` — Hex, Base64, Base64url, URL Percent-Encoding e JSON Lixeiro\n\n## 1. Por que existe a lib `codec`?\n\nSexamos sinceros: nada rompe máis rápido unha integración web ca confundir Base64 estándar (`+/=`) con Base64url (`-_` sen recheo) nun token JWT, ou construír unha query string concatenando cadeas sen escapar.\n\nA lib **`codec`** implementa os estándares **RFC 4648** (Hex, Base64 e Base64url), **RFC 3986** (codificación porcentual de URLs e dicionarios `query encode` / `query decode`) e construtores/extractores rápidos de **JSON lixeiro (RFC 8259)**.\n\n---\n\n## 2. Artefactos, importación e arquitectura sen `libc`\n\nEn `ridgun-libs`, **`codec`** é unha **lib** de primeira clase situada en `src/main/ridgun/lib/codec.rg` (dominio `CODEC`). Ao compilar con `stable bundle`, empaquétase en tres formatos nativos:\n\n| Artefacto | Ruta | Propósito |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/codec.rglib` | Distribución e importación directa con `import codec` |\n| **Ficheiro compilado** | `target/codec.rgc` | Artefacto intermedio verificado por `ridgunc` |\n| **Obxecto compartido ELF64** | `target/libcodec.so` | Biblioteca dinámica nativa sen dependencias de C nin `libc` |\n\n> Para usar esta lib en calquera ficheiro `.rg`, abonda con declarar `import codec` na cabeceira e chamar ás súas funcións con espazos ou guións baixos indistintamente.\n\n---\n\n## 3. Referencia rápida da API de `codec`\n\n| Sinatura / Función / Tipo | Que fai e cando usala |\n|---|---|\n| `hex encode / hex decode / hex is valid` | Codificación hexadecimal RFC 4648 en minúsculas e descodificación validada |\n| `base64 encode / base64 decode` | Base64 estándar RFC 4648 §4 con recheo `=` |\n| `base64url encode / base64url decode` | Base64url seguro para URLs RFC 4648 §5 (`-`, `_`, sen recheo) |\n| `url encode / url decode / query encode / query decode` | Codificación porcentual RFC 3986 e dicionarios de query string `k=v&...` |\n| `json quote / json object / json get str / json get int` | Serialización JSON rápida sen AST e extracción de chaves de primeiro nivel |\n\n---\n\n## 4. Receitas prácticas en estilo tabular\n\n### Receita 1: Fluxo principal con `codec`\n\nObserva como os signos `=` e os pasos de transformación quedan aliñados coma unha táboa limpa:\n\n```ridgun\nimport codec\n\nfn :: empaquetar parametros (usuario : String) (redir : String) => String\n      empaquetar parametros usuario redir =\n        token_b64 = base64url encode usuario\n        query encode [(\"token\", token_b64), (\"next\", redir)]\n```\n\n### Receita 2: Composición segura e sen efectos laterais\n\nToda función da lib `codec` é compoñible co resto das 32 libs de `ridgun-libs`:\n\n```ridgun\nimport codec\n\nfn :: construir respuesta rapida (id : Int) (nombre : String) => (String, Int)\n      construir respuesta rapida id nombre =\n        doc = json object [(\"id\", json int id), (\"name\", json quote nombre), (\"ok\", json bool True)]\n        leido = json get int doc \"id\" 0\n        (doc, leido)\n```\n\n---\n\n## 5. Baixo o capó: rendemento, memoria RMM e garantías\n\n- **Garantía algorítmica e de seguridade**: Rexeitamento determinista de entradas hexadecimais ou Base64 mal formadas (devolvendo `\"\"` sen lecturas fóra de límites) e reversibilidade exacta $decode(encode(x)) == x$.\n- **Memoria determinista (`RMM1`/`RMM2`)**: Cero pausas de colector de lixo; todas as estruturas intermedias libéranse de forma determinista ao saír do ámbito.\n- **Verificación continua**: Probada exhaustivamente con `stable check` e a suite automatizada `src/test/ridgun/test_codec.rg`.\n"}, {"num": "08", "slug": "08-lib-json-parser-ast-e-consultas", "file": "08-lib-json-parser-ast-e-consultas.md", "title": "Capítulo 08: A lib `json` — Árbore AST Recursiva RFC 8259, Pretty-Printer e Consultas por Ruta", "short_title": "A lib `json` — Árbore AST Recursiva RFC 8259, Pretty-Printer e Consultas por Ruta", "markdown": "# Capítulo 08: A lib `json` — Árbore AST Recursiva RFC 8259, Pretty-Printer e Consultas por Ruta\n\n## 1. Por que existe a lib `json`?\n\nSexamos sinceros: navegar un JSON aniñado en moitas linguaxes estáticas implica escribir tres pantallas de boilerplate ou encadear dez `.and_then()` antes de ler un simple porto.\n\nA lib **`json`** proporciona un analizador descendente recursivo completo para **RFC 8259** sobre o ADT alxébrico `JsonVal` (`JnNull`, `JnBool`, `JnInt`, `JnStr`, `JnArr`, `JnObj`, `JnErr`), serialización compacta e sangrada (`json pretty`) e consultas directas por ruta con puntos (`\"server.http.port\"`, `\"users.0.name\"`).\n\n---\n\n## 2. Artefactos, importación e arquitectura sen `libc`\n\nEn `ridgun-libs`, **`json`** é unha **lib** de primeira clase situada en `src/main/ridgun/lib/json.rg` (dominio `JSON`). Ao compilar con `stable bundle`, empaquétase en tres formatos nativos:\n\n| Artefacto | Ruta | Propósito |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/json.rglib` | Distribución e importación directa con `import json` |\n| **Ficheiro compilado** | `target/json.rgc` | Artefacto intermedio verificado por `ridgunc` |\n| **Obxecto compartido ELF64** | `target/libjson.so` | Biblioteca dinámica nativa sen dependencias de C nin `libc` |\n\n> Para usar esta lib en calquera ficheiro `.rg`, abonda con declarar `import json` na cabeceira e chamar ás súas funcións con espazos ou guións baixos indistintamente.\n\n---\n\n## 3. Referencia rápida da API de `json`\n\n| Sinatura / Función / Tipo | Que fai e cando usala |\n|---|---|\n| `type JsonVal` | `JnNull | JnBool Bool | JnInt Int | JnStr String | JnArr [JsonVal] | JnObj [String JsonVal] | JnErr String` |\n| `json parse / json is ok` | Analiza texto JSON nunha árbore `JsonVal` e valida a ausencia de `JnErr` |\n| `json stringify / json pretty` | Serializa `JsonVal` a JSON compacto ou multiliña sangrado |\n| `json get path / json get str / json get int / json get bool` | Percorre obxectos e listas aniñados mediante rutas con puntos (`\"a.b.0.c\"`) |\n\n---\n\n## 4. Receitas prácticas en estilo tabular\n\n### Receita 1: Fluxo principal con `json`\n\nObserva como os signos `=` e os pasos de transformación quedan aliñados coma unha táboa limpa:\n\n```ridgun\nimport json\n\nfn :: leer config servidor (raw : String) => (String, Int, Bool)\n      leer config servidor raw =\n        doc  = json parse raw\n        host = json get str doc \"server.host\" \"127.0.0.1\"\n        port = json get int doc \"server.port\" 8080\n        tls  = json get bool doc \"server.tls.enabled\" False\n        (host, port, tls)\n```\n\n### Receita 2: Composición segura e sen efectos laterais\n\nToda función da lib `json` é compoñible co resto das 32 libs de `ridgun-libs`:\n\n```ridgun\nimport json\n\nfn :: construir manifiesto () => String\n      construir manifiesto =\n        nodo = JnObj [(\"app\", JnStr \"solstice\"), (\"workers\", JnInt 8), (\"tags\", JnArr [JnStr \"elf64\", JnStr \"rmm2\"])]\n        json pretty nodo 2\n```\n\n---\n\n## 5. Baixo o capó: rendemento, memoria RMM e garantías\n\n- **Garantía algorítmica e de seguridade**: Rexeitamento estrito de lixo sobrante tras o valor raíz (`trailing garbage`), manexo completo de escapes e retorno seguro de `JnErr` sen excepcións.\n- **Memoria determinista (`RMM1`/`RMM2`)**: Cero pausas de colector de lixo; todas as estruturas intermedias libéranse de forma determinista ao saír do ámbito.\n- **Verificación continua**: Probada exhaustivamente con `stable check` e a suite automatizada `src/test/ridgun/test_json.rg`.\n"}, {"num": "09", "slug": "09-lib-csv-parser-rfc4180-e-taboas", "file": "09-lib-csv-parser-rfc4180-e-taboas.md", "title": "Capítulo 09: A lib `csv` — Analizador de Estados RFC 4180 para CSV/TSV e Táboas Indexadas", "short_title": "A lib `csv` — Analizador de Estados RFC 4180 para CSV/TSV e Táboas Indexadas", "markdown": "# Capítulo 09: A lib `csv` — Analizador de Estados RFC 4180 para CSV/TSV e Táboas Indexadas\n\n## 1. Por que existe a lib `csv`?\n\nSexamos sinceros: todo o mundo cre que analizar un CSV é facer `str split lina \",\"`... ata que aparece un campo entre comiñas cunha coma dentro, comiñas escapadas `\"\"` ou un salto de liña `\\r\\n` no medio dunha cela.\n\nA lib **`csv`** implementa unha máquina de estados completa conforme a **RFC 4180** para CSV e TSV, serialización automática con comiñas intelixentes e o tipo `CsvTable` para consultar columnas e filas por nome de cabeceira.\n\n---\n\n## 2. Artefactos, importación e arquitectura sen `libc`\n\nEn `ridgun-libs`, **`csv`** é unha **lib** de primeira clase situada en `src/main/ridgun/lib/csv.rg` (dominio `CSV`). Ao compilar con `stable bundle`, empaquétase en tres formatos nativos:\n\n| Artefacto | Ruta | Propósito |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/csv.rglib` | Distribución e importación directa con `import csv` |\n| **Ficheiro compilado** | `target/csv.rgc` | Artefacto intermedio verificado por `ridgunc` |\n| **Obxecto compartido ELF64** | `target/libcsv.so` | Biblioteca dinámica nativa sen dependencias de C nin `libc` |\n\n> Para usar esta lib en calquera ficheiro `.rg`, abonda con declarar `import csv` na cabeceira e chamar ás súas funcións con espazos ou guións baixos indistintamente.\n\n---\n\n## 3. Referencia rápida da API de `csv`\n\n| Sinatura / Función / Tipo | Que fai e cando usala |\n|---|---|\n| `csv parse / tsv parse / csv parse with` | Analiza texto CSV/TSV (incluíndo celas multiliña e escapes `\"\"`) en `[[String]]` |\n| `csv stringify / tsv stringify` | Serializa `[[String]]` entrecomiñando só celas con delimitadores, comiñas ou saltos |\n| `csv parse table / csv get cell / csv col` | Consulta sobre `CsvTable` indexada por cabeceira `(fila, nome_col)` ou columna completa |\n| `csv row to kv / csv table to kv list` | Converte filas tabulares en dicionarios `[String String]` indexados por cabeceira |\n\n---\n\n## 4. Receitas prácticas en estilo tabular\n\n### Receita 1: Fluxo principal con `csv`\n\nObserva como os signos `=` e os pasos de transformación quedan aliñados coma unha táboa limpa:\n\n```ridgun\nimport csv\n\nfn :: extraer columna precios (raw_csv : String) => ([String], String)\n      extraer columna precios raw_csv =\n        tabla   = csv parse table raw_csv\n        precios = csv col tabla \"precio\"\n        primero = csv get cell tabla 0 \"producto\" \"desconocido\"\n        (precios, primero)\n```\n\n### Receita 2: Composición segura e sen efectos laterais\n\nToda función da lib `csv` é compoñible co resto das 32 libs de `ridgun-libs`:\n\n```ridgun\nimport csv\n\nfn :: exportar informe () => String\n      exportar informe =\n        filas = [[\"id\", \"nota\"], [\"1\", \"Contiene, coma\"], [\"2\", \"Dijo \"hola\"\"]]\n        csv stringify filas\n```\n\n---\n\n## 5. Baixo o capó: rendemento, memoria RMM e garantías\n\n- **Garantía algorítmica e de seguridade**: Soporte exacto de saltos `\\r\\n` e `\\n` tanto fóra coma dentro de comiñas, e cero perda de datos en viaxes de ida e volta `csv parse (csv stringify filas)`.\n- **Memoria determinista (`RMM1`/`RMM2`)**: Cero pausas de colector de lixo; todas as estruturas intermedias libéranse de forma determinista ao saír do ámbito.\n- **Verificación continua**: Probada exhaustivamente con `stable check` e a suite automatizada `src/test/ridgun/test_csv.rg`.\n"}, {"num": "10", "slug": "10-lib-ini-configuracion-ini-e-dotenv", "file": "10-lib-ini-configuracion-ini-e-dotenv.md", "title": "Capítulo 10: A lib `ini` — Ficheiros `.ini` por Seccións, `.env` e Interpolación de Variables", "short_title": "A lib `ini` — Ficheiros `.ini` por Seccións, `.env` e Interpolación de Variables", "markdown": "# Capítulo 10: A lib `ini` — Ficheiros `.ini` por Seccións, `.env` e Interpolación de Variables\n\n## 1. Por que existe a lib `ini`?\n\nSexamos sinceros: os ficheiros `.env` e `.ini` parecen triviais ata que alguén engade `export KEY=\"valor # con cancelo\"`, comentarios `;` ao final da liña ou referencias cruzadas entre variables.\n\nA lib **`ini`** analiza configuracións `.ini` con seccións (`[database]`) e ficheiros `.env` con prefixos `export`, preservando símbolos `#` e `;` dentro de comiñas e resolvendo interpolacións de variables en `dotenv parse`.\n\n---\n\n## 2. Artefactos, importación e arquitectura sen `libc`\n\nEn `ridgun-libs`, **`ini`** é unha **lib** de primeira clase situada en `src/main/ridgun/lib/ini.rg` (dominio `INI`). Ao compilar con `stable bundle`, empaquétase en tres formatos nativos:\n\n| Artefacto | Ruta | Propósito |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/ini.rglib` | Distribución e importación directa con `import ini` |\n| **Ficheiro compilado** | `target/ini.rgc` | Artefacto intermedio verificado por `ridgunc` |\n| **Obxecto compartido ELF64** | `target/libini.so` | Biblioteca dinámica nativa sen dependencias de C nin `libc` |\n\n> Para usar esta lib en calquera ficheiro `.rg`, abonda con declarar `import ini` na cabeceira e chamar ás súas funcións con espazos ou guións baixos indistintamente.\n\n---\n\n## 3. Referencia rápida da API de `ini`\n\n| Sinatura / Función / Tipo | Que fai e cando usala |\n|---|---|\n| `ini parse / ini stringify` | Analiza texto `.ini` por seccións en `IniDoc` e serialízao de volta |\n| `ini get / ini get int / ini get bool / ini set` | Consultas tipadas por sección+chave (`\"\"` para sección global) e actualización inmutable |\n| `ini sections / ini section map` | Lista os nomes de sección ou extrae o mapa `[String String]` dunha sección |\n| `dotenv parse` | Analiza ficheiros `.env` (`export K=V`, comiñas, comentarios e expansión de variables) |\n\n---\n\n## 4. Receitas prácticas en estilo tabular\n\n### Receita 1: Fluxo principal con `ini`\n\nObserva como os signos `=` e os pasos de transformación quedan aliñados coma unha táboa limpa:\n\n```ridgun\nimport ini\n\nfn :: cargar base de datos (texto_ini : String) => (String, Int, Bool)\n      cargar base de datos texto_ini =\n        doc  = ini parse texto_ini\n        host = ini get doc \"database\" \"host\" \"localhost\"\n        port = ini get int doc \"database\" \"port\" 5432\n        pool = ini get bool doc \"database\" \"pool\" True\n        (host, port, pool)\n```\n\n### Receita 2: Composición segura e sen efectos laterais\n\nToda función da lib `ini` é compoñible co resto das 32 libs de `ridgun-libs`:\n\n```ridgun\nimport ini\n\nfn :: actualizar puerto (doc : IniDoc) (nuevo : String) => String\n      actualizar puerto doc nuevo =\n        doc2 = ini set doc \"database\" \"port\" nuevo\n        ini stringify doc2\n```\n\n---\n\n## 5. Baixo o capó: rendemento, memoria RMM e garantías\n\n- **Garantía algorítmica e de seguridade**: Respecto total polos caracteres `#` e `;` cando aparecen entre comiñas simples ou dobres, e conversión booleana flexible (`true/1/yes/on` vs `false/0/no/off`).\n- **Memoria determinista (`RMM1`/`RMM2`)**: Cero pausas de colector de lixo; todas as estruturas intermedias libéranse de forma determinista ao saír do ámbito.\n- **Verificación continua**: Probada exhaustivamente con `stable check` e a suite automatizada `src/test/ridgun/test_ini.rg`.\n"}, {"num": "11", "slug": "11-lib-regex-motor-thompson-nfa-lineal", "file": "11-lib-regex-motor-thompson-nfa-lineal.md", "title": "Capítulo 11: A lib `regex` — Motor de Expresións Regulares Thompson NFA en Tempo Lineal $O(N \\cdot M)$", "short_title": "A lib `regex` — Motor de Expresións Regulares Thompson NFA en Tempo Lineal $O(N \\cdot M)$", "markdown": "# Capítulo 11: A lib `regex` — Motor de Expresións Regulares Thompson NFA en Tempo Lineal $O(N \\cdot M)$\n\n## 1. Por que existe a lib `regex`?\n\nSexamos sinceros: os motores de expresións regulares con *backtracking* teñen causado caídas globais famosas (coma en Cloudflare ou StackOverflow) cando un padrón coma `(a+)+b` recibe trinta `a` seguidas e entra en tempo exponencial $O(2^N)$.\n\nA lib **`regex`** compila as túas expresións regulares (`.`, `*`, `+`, `?`, `|`, `()`, `[a-z]`, `[^...]`, `^`, `$`, `\\d`, `\\w`, `\\s`) a un **autómata finito non determinista de Thompson (NFA)** e avanza o conxunto de estados paso a paso en tempo estritamente lineal **$O(N \\cdot M)$**, facendo que os ataques **ReDoS sexan matematicamente imposibles**.\n\n---\n\n## 2. Artefactos, importación e arquitectura sen `libc`\n\nEn `ridgun-libs`, **`regex`** é unha **lib** de primeira clase situada en `src/main/ridgun/lib/regex.rg` (dominio `REGEX`). Ao compilar con `stable bundle`, empaquétase en tres formatos nativos:\n\n| Artefacto | Ruta | Propósito |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/regex.rglib` | Distribución e importación directa con `import regex` |\n| **Ficheiro compilado** | `target/regex.rgc` | Artefacto intermedio verificado por `ridgunc` |\n| **Obxecto compartido ELF64** | `target/libregex.so` | Biblioteca dinámica nativa sen dependencias de C nin `libc` |\n\n> Para usar esta lib en calquera ficheiro `.rg`, abonda con declarar `import regex` na cabeceira e chamar ás súas funcións con espazos ou guións baixos indistintamente.\n\n---\n\n## 3. Referencia rápida da API de `regex`\n\n| Sinatura / Función / Tipo | Que fai e cando usala |\n|---|---|\n| `regex match / regex is match` | Coincidencia de cadea completa e busca de subcadea en tempo lineal $O(N \\cdot M)$ |\n| `regex find / regex find all` | Extrae a primeira ou todas as subcadeas coincidentes sen solapamento |\n| `regex replace / regex replace all` | Substitúe a primeira ou todas as coincidencias da expresión regular |\n| `regex split / regex escape` | Divide texto segundo un delimitador regex e escapa metacaracteres |\n\n---\n\n## 4. Receitas prácticas en estilo tabular\n\n### Receita 1: Fluxo principal con `regex`\n\nObserva como os signos `=` e os pasos de transformación quedan aliñados coma unha táboa limpa:\n\n```ridgun\nimport regex\n\nfn :: extraer codigos postales (texto : String) => [String]\n      extraer codigos postales texto =\n        regex find all \"\\\\d+\" texto\n```\n\n### Receita 2: Composición segura e sen efectos laterais\n\nToda función da lib `regex` é compoñible co resto das 32 libs de `ridgun-libs`:\n\n```ridgun\nimport regex\n\nfn :: censurar telefonos (comentario : String) => (Bool, String)\n      censurar telefonos comentario =\n        tiene = regex is match \"\\\\d+-\\\\d+\" comentario\n        limpio = regex replace all \"\\\\d+-\\\\d+\" comentario \"[TELEFONO]\"\n        (tiene, limpio)\n```\n\n---\n\n## 5. Baixo o capó: rendemento, memoria RMM e garantías\n\n- **Garantía algorítmica e de seguridade**: Simulación de conxunto de estados NFA sen recursión descontrolada de pila e tempo $O(N \\cdot M)$ garantido mesmo ante padróns patolóxicos `(a+)+b`.\n- **Memoria determinista (`RMM1`/`RMM2`)**: Cero pausas de colector de lixo; todas as estruturas intermedias libéranse de forma determinista ao saír do ámbito.\n- **Verificación continua**: Probada exhaustivamente con `stable check` e a suite automatizada `src/test/ridgun/test_regex.rg`.\n"}, {"num": "12", "slug": "12-lib-glob-comodins-e-filtrado", "file": "12-lib-glob-comodins-e-filtrado.md", "title": "Capítulo 12: A lib `glob` — Padróns de Comodíns (`*`, `?`, `[a-z]`) e Filtrado de Listas", "short_title": "A lib `glob` — Padróns de Comodíns (`*`, `?`, `[a-z]`) e Filtrado de Listas", "markdown": "# Capítulo 12: A lib `glob` — Padróns de Comodíns (`*`, `?`, `[a-z]`) e Filtrado de Listas\n\n## 1. Por que existe a lib `glob`?\n\nSexamos sinceros: usar unha expresión regular completa só para comprobar se un ficheiro remata en `*.rg` ou comeza por `test_[0-9]*.rg` é matar moscas a cañonazos.\n\nA lib **`glob`** implementa coincidencia exacta de comodíns de shell (`*`, `?`, clases `[a-z]`, clases negadas `[!0-9]` / `[^a-z]`), variantes insensibles a maiúsculas (`glob match ci`) e filtrado directo de listas de rutas ou nomes.\n\n---\n\n## 2. Artefactos, importación e arquitectura sen `libc`\n\nEn `ridgun-libs`, **`glob`** é unha **lib** de primeira clase situada en `src/main/ridgun/lib/glob.rg` (dominio `GLOB`). Ao compilar con `stable bundle`, empaquétase en tres formatos nativos:\n\n| Artefacto | Ruta | Propósito |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/glob.rglib` | Distribución e importación directa con `import glob` |\n| **Ficheiro compilado** | `target/glob.rgc` | Artefacto intermedio verificado por `ridgunc` |\n| **Obxecto compartido ELF64** | `target/libglob.so` | Biblioteca dinámica nativa sen dependencias de C nin `libc` |\n\n> Para usar esta lib en calquera ficheiro `.rg`, abonda con declarar `import glob` na cabeceira e chamar ás súas funcións con espazos ou guións baixos indistintamente.\n\n---\n\n## 3. Referencia rápida da API de `glob`\n\n| Sinatura / Función / Tipo | Que fai e cando usala |\n|---|---|\n| `glob match / glob match ci` | Coincidencia de padróns glob sensible e insensible a maiúsculas ASCII |\n| `glob filter / glob any match` | Filtra `[String]` segundo un padrón ou comproba se coincide algún padrón dunha lista |\n| `glob has magic` | Detecta se unha cadea contén metacaracteres de comodín (`*`, `?`, `[`) |\n\n---\n\n## 4. Receitas prácticas en estilo tabular\n\n### Receita 1: Fluxo principal con `glob`\n\nObserva como os signos `=` e os pasos de transformación quedan aliñados coma unha táboa limpa:\n\n```ridgun\nimport glob\n\nfn :: seleccionar fuentes ridgun (archivos : [String]) => [String]\n      seleccionar fuentes ridgun archivos =\n        glob filter \"test_[a-z]*.rg\" archivos\n```\n\n### Receita 2: Composición segura e sen efectos laterais\n\nToda función da lib `glob` é compoñible co resto das 32 libs de `ridgun-libs`:\n\n```ridgun\nimport glob\n\nfn :: es ruta excluida (ruta : String) => Bool\n      es ruta excluida ruta =\n        glob any match [\"*.tmp\", \"*.bak\", \"target/*\"] ruta\n```\n\n---\n\n## 5. Baixo o capó: rendemento, memoria RMM e garantías\n\n- **Garantía algorítmica e de seguridade**: Colapso automático de estrelas consecutivas (`***` $\\rightarrow$ `*`) para evitar retrocesos redundantes e manexo seguro de corchetes sen pechar `[`.\n- **Memoria determinista (`RMM1`/`RMM2`)**: Cero pausas de colector de lixo; todas as estruturas intermedias libéranse de forma determinista ao saír do ámbito.\n- **Verificación continua**: Probada exhaustivamente con `stable check` e a suite automatizada `src/test/ridgun/test_glob.rg`.\n"}, {"num": "13", "slug": "13-lib-diff-comparacion-lcs-e-parches", "file": "13-lib-diff-comparacion-lcs-e-parches.md", "title": "Capítulo 13: A lib `diff` — Algoritmo LCS, Distancia de Edición, Unified Diff e Parches", "short_title": "A lib `diff` — Algoritmo LCS, Distancia de Edición, Unified Diff e Parches", "markdown": "# Capítulo 13: A lib `diff` — Algoritmo LCS, Distancia de Edición, Unified Diff e Parches\n\n## 1. Por que existe a lib `diff`?\n\nSexamos sinceros: cando un test falla ou un ficheiro de configuración muda, un seco `\"expected A, got B\"` de 200 liñas obrígache a deixarte as pestanas buscando que liña exacta mudou.\n\nA lib **`diff`** calcula a **Subsecuencia Común Máis Longa (LCS)** sobre `Tensor[Int]` 2D para producir edicións mínimas (`DiffKeep`, `DiffAdd`, `DiffDel`), distancia de edición, estatísticas, formato **Unified Diff** (`---`/`+++`/`@@`) e reconstrución exacta con `diff apply`.\n\n---\n\n## 2. Artefactos, importación e arquitectura sen `libc`\n\nEn `ridgun-libs`, **`diff`** é unha **lib** de primeira clase situada en `src/main/ridgun/lib/diff.rg` (dominio `DIFF`). Ao compilar con `stable bundle`, empaquétase en tres formatos nativos:\n\n| Artefacto | Ruta | Propósito |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/diff.rglib` | Distribución e importación directa con `import diff` |\n| **Ficheiro compilado** | `target/diff.rgc` | Artefacto intermedio verificado por `ridgunc` |\n| **Obxecto compartido ELF64** | `target/libdiff.so` | Biblioteca dinámica nativa sen dependencias de C nin `libc` |\n\n> Para usar esta lib en calquera ficheiro `.rg`, abonda con declarar `import diff` na cabeceira e chamar ás súas funcións con espazos ou guións baixos indistintamente.\n\n---\n\n## 3. Referencia rápida da API de `diff`\n\n| Sinatura / Función / Tipo | Que fai e cando usala |\n|---|---|\n| `type DiffOp` | `DiffKeep String | DiffDel String | DiffAdd String` |\n| `diff lines / diff text` | Calcula o guión mínimo de edición LCS entre listas `[String]` ou textos multiliña |\n| `diff edit distance / diff stats` | Distancia mínima de inserción+borrado e reconto `(kept, added, deleted)` |\n| `diff format / diff unified` | Formatea liñas compactas `+ / - /  ` ou Unified Diff estándar con cabeceiras |\n| `diff apply / diff apply text` | Reconstrúe o documento destino sen perdas a partir do guión de edición |\n\n---\n\n## 4. Receitas prácticas en estilo tabular\n\n### Receita 1: Fluxo principal con `diff`\n\nObserva como os signos `=` e os pasos de transformación quedan aliñados coma unha táboa limpa:\n\n```ridgun\nimport diff\n\nfn :: auditar cambio (antes : String) (despues : String) => (Int, String)\n      auditar cambio antes despues =\n        dist   = diff edit distance ( [\"host=localhost\", \"port=8080\"] ) ( [\"host=0.0.0.0\", \"port=8080\"] )\n        parche = diff unified \"config.old\" \"config.new\" antes despues\n        (dist, parche)\n```\n\n### Receita 2: Composición segura e sen efectos laterais\n\nToda función da lib `diff` é compoñible co resto das 32 libs de `ridgun-libs`:\n\n```ridgun\nimport diff\n\nfn :: verificar parche (orig : [String]) (nuevo : [String]) => [String]\n      verificar parche orig nuevo =\n        ops = diff lines orig nuevo\n        diff apply ops\n```\n\n---\n\n## 5. Baixo o capó: rendemento, memoria RMM e garantías\n\n- **Garantía algorítmica e de seguridade**: Identidade matemática garantida $diff\\_edit\\_distance(a, b) == |a| + |b| - 2 \\cdot LCS(a, b)$ e reconstrución sen perdas `diff apply (diff lines a b) == b`.\n- **Memoria determinista (`RMM1`/`RMM2`)**: Cero pausas de colector de lixo; todas as estruturas intermedias libéranse de forma determinista ao saír do ámbito.\n- **Verificación continua**: Probada exhaustivamente con `stable check` e a suite automatizada `src/test/ridgun/test_diff.rg`.\n"}, {"num": "14", "slug": "14-lib-template-modelos-mustache-seguros", "file": "14-lib-template-modelos-mustache-seguros.md", "title": "Capítulo 14: A lib `template` — Modelos Mustache Seguros con Auto-Escape HTML e LaTeX", "short_title": "A lib `template` — Modelos Mustache Seguros con Auto-Escape HTML e LaTeX", "markdown": "# Capítulo 14: A lib `template` — Modelos Mustache Seguros con Auto-Escape HTML e LaTeX\n\n## 1. Por que existe a lib `template`?\n\nSexamos sinceros: montar páxinas HTML ou informes LaTeX concatenando cadeas á man é a receita perfecta para unha vulnerabilidade XSS (`<script>`) ou para que un simple símbolo `%` ou `_` rompa a compilación do teu PDF.\n\nA lib **`template`** ofrece un motor **Mustache** sen lóxica arbitraria con auto-escape contextual (`TmplPlain`, `TmplHtml`, `TmplLatex`), substitución crúa explícita (`{{{raw}}}` / `{{&raw}}`), comentarios (`{{! ... }}`), seccións condicionais (`{{#sec}}...{{/sec}}`) e invertidas (`{{^sec}}...{{/sec}}`).\n\n---\n\n## 2. Artefactos, importación e arquitectura sen `libc`\n\nEn `ridgun-libs`, **`template`** é unha **lib** de primeira clase situada en `src/main/ridgun/lib/template.rg` (dominio `TMPL`). Ao compilar con `stable bundle`, empaquétase en tres formatos nativos:\n\n| Artefacto | Ruta | Propósito |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/template.rglib` | Distribución e importación directa con `import template` |\n| **Ficheiro compilado** | `target/template.rgc` | Artefacto intermedio verificado por `ridgunc` |\n| **Obxecto compartido ELF64** | `target/libtemplate.so` | Biblioteca dinámica nativa sen dependencias de C nin `libc` |\n\n> Para usar esta lib en calquera ficheiro `.rg`, abonda con declarar `import template` na cabeceira e chamar ás súas funcións con espazos ou guións baixos indistintamente.\n\n---\n\n## 3. Referencia rápida da API de `template`\n\n| Sinatura / Función / Tipo | Que fai e cando usala |\n|---|---|\n| `tmpl render / tmpl render html / tmpl render latex` | Renderiza modelos Mustache con auto-escape plano, HTML ou LaTeX |\n| `tmpl escape html / tmpl escape latex` | Escapa `& < > \" '` para HTML ou `\\ { } & % $ # _ ~ ^` para LaTeX |\n| `tmpl extract vars / tmpl has unclosed tags` | Extrae os nomes de variables requiridos e valida que as etiquetas estean pechadas |\n\n---\n\n## 4. Receitas prácticas en estilo tabular\n\n### Receita 1: Fluxo principal con `template`\n\nObserva como os signos `=` e os pasos de transformación quedan aliñados coma unha táboa limpa:\n\n```ridgun\nimport template\n\nfn :: renderizar perfil html (usuario : String) (es_admin : String) => String\n      renderizar perfil html usuario es_admin =\n        plantilla = \"<h1>Hola {{user}}</h1>{{#admin}}<span class='badge'>Admin</span>{{/admin}}\"\n        vars      = [(\"user\", usuario), (\"admin\", es_admin)]\n        tmpl render html plantilla vars\n```\n\n### Receita 2: Composición segura e sen efectos laterais\n\nToda función da lib `template` é compoñible co resto das 32 libs de `ridgun-libs`:\n\n```ridgun\nimport template\n\nfn :: generar linea latex (metrica : String) => String\n      generar linea latex metrica =\n        -- Escapa automaticamente % _ & # para que LaTeX no falle\n        tmpl render latex \"Resultado: {{val}}\" [(\"val\", metrica)]\n```\n\n---\n\n## 5. Baixo o capó: rendemento, memoria RMM e garantías\n\n- **Garantía algorítmica e de seguridade**: Prevención de XSS por defecto en `tmpl render html` (escapando `&`, `<`, `>`, `\"`, `'`) mentres `{{{var}}}` permite inxectar fragmentos de confianza de forma explícita.\n- **Memoria determinista (`RMM1`/`RMM2`)**: Cero pausas de colector de lixo; todas as estruturas intermedias libéranse de forma determinista ao saír do ámbito.\n- **Verificación continua**: Probada exhaustivamente con `stable check` e a suite automatizada `src/test/ridgun/test_template.rg`.\n"}, {"num": "15", "slug": "15-lib-fmt-formatador-tabular-e-resaltador", "file": "15-lib-fmt-formatador-tabular-e-resaltador.md", "title": "Capítulo 15: A lib `fmt` — Formatador Tabular Canónico 2D e Resaltador de Sintaxe en 9 Formatos", "short_title": "A lib `fmt` — Formatador Tabular Canónico 2D e Resaltador de Sintaxe en 9 Formatos", "markdown": "# Capítulo 15: A lib `fmt` — Formatador Tabular Canónico 2D e Resaltador de Sintaxe en 9 Formatos\n\n## 1. Por que existe a lib `fmt`?\n\nSexamos sinceros: a beleza do código Ridgun reside nas súas columnas tabulares perfectamente aliñadas (`::`, `=`, `|`, `->`, `--`), pero aliñar espazos á man ou exportar código coloreado para terminal, HTML e LaTeX sen unha ferramenta dedicada é tedioso.\n\nA lib **`fmt`** é o motor oficial de formatado tabular 2D e resaltado léxico de Ridgun: aliña sinaturas `fn ::`, ecuacións, gardas `|` e comentarios `--`, e exporta a **9 formatos de saída** (`FmtPlain`, `FmtTty`, `FmtTrueColor`, `FmtHtmlInline`, `FmtHtmlCss`, `FmtMarkdown`, `FmtPango`, `FmtLatex`, `FmtRtf`).\n\n---\n\n## 2. Artefactos, importación e arquitectura sen `libc`\n\nEn `ridgun-libs`, **`fmt`** é unha **lib** de primeira clase situada en `src/main/ridgun/lib/fmt.rg` (dominio `FMT`). Ao compilar con `stable bundle`, empaquétase en tres formatos nativos:\n\n| Artefacto | Ruta | Propósito |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/fmt.rglib` | Distribución e importación directa con `import fmt` |\n| **Ficheiro compilado** | `target/fmt.rgc` | Artefacto intermedio verificado por `ridgunc` |\n| **Obxecto compartido ELF64** | `target/libfmt.so` | Biblioteca dinámica nativa sen dependencias de C nin `libc` |\n\n> Para usar esta lib en calquera ficheiro `.rg`, abonda con declarar `import fmt` na cabeceira e chamar ás súas funcións con espazos ou guións baixos indistintamente.\n\n---\n\n## 3. Referencia rápida da API de `fmt`\n\n| Sinatura / Función / Tipo | Que fai e cando usala |\n|---|---|\n| `fmt source / fmt source with` | Formatea código fonte Ridgun usando o aliñamento tabular 2D canónico |\n| `fmt check` | Devolve `True` se o código xa cumpre o formato tabular canónico de `fmt source` |\n| `fmt render / fmt render with` | Formatea e colorea o código cara a calquera dos 9 formatos `FmtTarget` |\n| `fmt tokenize line` | Tokeniza unha liña en `TokKeyword`, `TokType`, `TokOperator`, `TokString`, `TokNumber`, `TokComment` |\n\n---\n\n## 4. Receitas prácticas en estilo tabular\n\n### Receita 1: Fluxo principal con `fmt`\n\nObserva como os signos `=` e os pasos de transformación quedan aliñados coma unha táboa limpa:\n\n```ridgun\nimport fmt\n\nfn :: formatear y verificar (codigo : String) => (String, Bool)\n      formatear y verificar codigo =\n        limpio = fmt source codigo\n        es_ok  = fmt check limpio\n        (limpio, es_ok)\n```\n\n### Receita 2: Composición segura e sen efectos laterais\n\nToda función da lib `fmt` é compoñible co resto das 32 libs de `ridgun-libs`:\n\n```ridgun\nimport fmt\n\nfn :: exportar bloque html (codigo : String) => String\n      exportar bloque html codigo =\n        fmt render codigo FmtHtmlCss\n```\n\n---\n\n## 5. Baixo o capó: rendemento, memoria RMM e garantías\n\n- **Garantía algorítmica e de seguridade**: Idempotencia estrita (`fmt source (fmt source s) == fmt source s`) e preservación do 100 % dos tokens semánticos.\n- **Memoria determinista (`RMM1`/`RMM2`)**: Cero pausas de colector de lixo; todas as estruturas intermedias libéranse de forma determinista ao saír do ámbito.\n- **Verificación continua**: Probada exhaustivamente con `stable check` e a suite automatizada `src/test/ridgun/test_fmt.rg`.\n"}, {"num": "16", "slug": "16-lib-cli-argumentos-e-contorno", "file": "16-lib-cli-argumentos-e-contorno.md", "title": "Capítulo 16: A lib `cli` — Bandeiras, Opcións, Barreira `--`, Subcomandos e Variables de Contorno", "short_title": "A lib `cli` — Bandeiras, Opcións, Barreira `--`, Subcomandos e Variables de Contorno", "markdown": "# Capítulo 16: A lib `cli` — Bandeiras, Opcións, Barreira `--`, Subcomandos e Variables de Contorno\n\n## 1. Por que existe a lib `cli`?\n\nSexamos sinceros: analizar `argv` á man sempre comeza cun bucle inocente e acaba rompéndose cando alguén pasa `-la` agrupado, `--port=9090` con signo igual ou `--` seguido dun ficheiro que comeza por guión `-ficheiro.rg`.\n\nA lib **`cli`** resolve bandeiras longas (`--verbose`), curtas (`-v`), agrupadas (`-la`), opcións con valor (`--port=8080`, `--port 8080`, `-p 8080`), o separador POSIX `--`, argumentos posicionais, subcomandos e lectura tipada de variables de contorno (`env get int or`, `env get bool or`).\n\n---\n\n## 2. Artefactos, importación e arquitectura sen `libc`\n\nEn `ridgun-libs`, **`cli`** é unha **lib** de primeira clase situada en `src/main/ridgun/lib/cli.rg` (dominio `CLI`). Ao compilar con `stable bundle`, empaquétase en tres formatos nativos:\n\n| Artefacto | Ruta | Propósito |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/cli.rglib` | Distribución e importación directa con `import cli` |\n| **Ficheiro compilado** | `target/cli.rgc` | Artefacto intermedio verificado por `ridgunc` |\n| **Obxecto compartido ELF64** | `target/libcli.so` | Biblioteca dinámica nativa sen dependencias de C nin `libc` |\n\n> Para usar esta lib en calquera ficheiro `.rg`, abonda con declarar `import cli` na cabeceira e chamar ás súas funcións con espazos ou guións baixos indistintamente.\n\n---\n\n## 3. Referencia rápida da API de `cli`\n\n| Sinatura / Función / Tipo | Que fai e cando usala |\n|---|---|\n| `cli has flag : [String] -> String -> String -> Bool` | Detecta `--long`, `-s` ou bandeiras agrupadas `-xyz` antes de `--` |\n| `cli get opt / cli get int opt` | Extrae opción de texto ou enteira (`--k=v`, `--k v`, `-k v`) con valor por defecto |\n| `cli positionals / cli subcommand` | Recolle os argumentos posicionais (incluíndo todo o que segue a `--`) |\n| `env get or / env get int or / env get bool or` | Le variables de contorno con conversión tipada e valores de apoio |\n\n---\n\n## 4. Receitas prácticas en estilo tabular\n\n### Receita 1: Fluxo principal con `cli`\n\nObserva como os signos `=` e os pasos de transformación quedan aliñados coma unha táboa limpa:\n\n```ridgun\nimport cli\n\nfn :: analizar comando (args : [String]) => (String, Bool, Int, [String])\n      analizar comando args =\n        sub   = cli subcommand args\n        all_f = cli has flag args \"--all\" \"-a\"\n        port  = cli get int opt args \"--port\" \"-p\" 8080\n        arch  = cli positionals args [\"--port\", \"-p\"]\n        (sub, all_f, port, arch)\n```\n\n### Receita 2: Composición segura e sen efectos laterais\n\nToda función da lib `cli` é compoñible co resto das 32 libs de `ridgun-libs`:\n\n```ridgun\nimport cli\n\nfn :: leer config entorno () => (Int, Bool)\n      leer config entorno =\n        workers = env get int or \"SOLSTICE_WORKERS\" 4\n        debug   = env get bool or \"SOLSTICE_DEBUG\" False\n        (workers, debug)\n```\n\n---\n\n## 5. Baixo o capó: rendemento, memoria RMM e garantías\n\n- **Garantía algorítmica e de seguridade**: Respecto estrito do separador POSIX `--`: ningún argumento situado á dereita de `--` se interpreta xamais como bandeira.\n- **Memoria determinista (`RMM1`/`RMM2`)**: Cero pausas de colector de lixo; todas as estruturas intermedias libéranse de forma determinista ao saír do ámbito.\n- **Verificación continua**: Probada exhaustivamente con `stable check` e a suite automatizada `src/test/ridgun/test_cli.rg`.\n"}, {"num": "17", "slug": "17-lib-path-rutas-posix-e-seguridade", "file": "17-lib-path-rutas-posix-e-seguridade.md", "title": "Capítulo 17: A lib `path` — Normalización POSIX (`path clean`) e Confinamento contra Path Traversal", "short_title": "A lib `path` — Normalización POSIX (`path clean`) e Confinamento contra Path Traversal", "markdown": "# Capítulo 17: A lib `path` — Normalización POSIX (`path clean`) e Confinamento contra Path Traversal\n\n## 1. Por que existe a lib `path`?\n\nSexamos sinceros: unir rutas con `base + \"/\" + ficheiro` sen limpar segmentos `..` nin validar prefixos é coma deixar a porta aberta para que alguén pida `../../etc/passwd` no teu servidor web.\n\nA lib **`path`** implementa normalización léxica POSIX (`path clean` ao estilo `filepath.Clean` de Go), unión segura (`path join`), descomposición (`dirname`, `basename`, `stem`, `ext`, `replace ext`) e o predicado de seguridade **`path is safe subpath`** (`VUL-INJ-001`) contra escapes de directorio.\n\n---\n\n## 2. Artefactos, importación e arquitectura sen `libc`\n\nEn `ridgun-libs`, **`path`** é unha **lib** de primeira clase situada en `src/main/ridgun/lib/path.rg` (dominio `PATH`). Ao compilar con `stable bundle`, empaquétase en tres formatos nativos:\n\n| Artefacto | Ruta | Propósito |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/path.rglib` | Distribución e importación directa con `import path` |\n| **Ficheiro compilado** | `target/path.rgc` | Artefacto intermedio verificado por `ridgunc` |\n| **Obxecto compartido ELF64** | `target/libpath.so` | Biblioteca dinámica nativa sen dependencias de C nin `libc` |\n\n> Para usar esta lib en calquera ficheiro `.rg`, abonda con declarar `import path` na cabeceira e chamar ás súas funcións con espazos ou guións baixos indistintamente.\n\n---\n\n## 3. Referencia rápida da API de `path`\n\n| Sinatura / Función / Tipo | Que fai e cando usala |\n|---|---|\n| `path clean / path join / path join list` | Colapsa `//`, `.` e `..` lexicamente e une segmentos de ruta |\n| `path dirname / path basename / path split` | Divide unha ruta en directorio pai e nome de ficheiro final |\n| `path ext / path stem / path replace ext` | Extrae ou cambia a extensión (tratando `.bashrc` como raíz `.bashrc` e ext `\"\"`) |\n| `path is safe subpath : String -> String -> Bool` | Verifica que `rel` permaneza estritamente dentro de `base_dir` e sen bytes NUL |\n\n---\n\n## 4. Receitas prácticas en estilo tabular\n\n### Receita 1: Fluxo principal con `path`\n\nObserva como os signos `=` e os pasos de transformación quedan aliñados coma unha táboa limpa:\n\n```ridgun\nimport path\n\nfn :: resolver archivo estatico (raiz : String) (peticion : String) => (Bool, String)\n      resolver archivo estatico raiz peticion =\n        seguro = path is safe subpath raiz peticion\n        ruta   = path join raiz peticion\n        (seguro, ruta)\n```\n\n### Receita 2: Composición segura e sen efectos laterais\n\nToda función da lib `path` é compoñible co resto das 32 libs de `ridgun-libs`:\n\n```ridgun\nimport path\n\nfn :: cambiar salida a objeto (fuente : String) => (String, String, String)\n      cambiar salida a objeto fuente =\n        dir = path dirname fuente\n        nom = path stem fuente\n        obj = path replace ext (path clean fuente) \".rglib\"\n        (dir, nom, obj)\n```\n\n---\n\n## 5. Baixo o capó: rendemento, memoria RMM e garantías\n\n- **Garantía algorítmica e de seguridade**: `path is safe subpath` rexeita rutas absolutas, bytes NUL e calquera secuencia `..` que intente escapar do directorio raíz ou dun prefixo irmán (`/srv/www-secret`).\n- **Memoria determinista (`RMM1`/`RMM2`)**: Cero pausas de colector de lixo; todas as estruturas intermedias libéranse de forma determinista ao saír do ámbito.\n- **Verificación continua**: Probada exhaustivamente con `stable check` e a suite automatizada `src/test/ridgun/test_path.rg`.\n"}, {"num": "18", "slug": "18-lib-time-calendario-utc-iso8601-e-backoff", "file": "18-lib-time-calendario-utc-iso8601-e-backoff.md", "title": "Capítulo 18: A lib `time` — Calendario Civil UTC (Hinnant), ISO-8601, Duracións e Backoff", "short_title": "A lib `time` — Calendario Civil UTC (Hinnant), ISO-8601, Duracións e Backoff", "markdown": "# Capítulo 18: A lib `time` — Calendario Civil UTC (Hinnant), ISO-8601, Duracións e Backoff\n\n## 1. Por que existe a lib `time`?\n\nSexamos sinceros: as funcións de data de `libc` (`localtime`, `gmtime`, `mktime`) dependen de estado global mutable (`TZ`), non son seguras entre fíos e fallan con regras de anos bisestos seculares coma 1900 vs 2000.\n\nA lib **`time`** implementa o algoritmo de calendario civil gregoriano proléptico en **$O(1)$ de Howard Hinnant**, formatado e análise estrita **ISO-8601 / RFC 3339** (`YYYY-MM-DDTHH:MM:SSZ`), duracións lexibles (`1h 1m 1s 5ms`) e cálculo de *exponential backoff* acoutado para reintentos de rede.\n\n---\n\n## 2. Artefactos, importación e arquitectura sen `libc`\n\nEn `ridgun-libs`, **`time`** é unha **lib** de primeira clase situada en `src/main/ridgun/lib/time.rg` (dominio `TIME`). Ao compilar con `stable bundle`, empaquétase en tres formatos nativos:\n\n| Artefacto | Ruta | Propósito |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/time.rglib` | Distribución e importación directa con `import time` |\n| **Ficheiro compilado** | `target/time.rgc` | Artefacto intermedio verificado por `ridgunc` |\n| **Obxecto compartido ELF64** | `target/libtime.so` | Biblioteca dinámica nativa sen dependencias de C nin `libc` |\n\n> Para usar esta lib en calquera ficheiro `.rg`, abonda con declarar `import time` na cabeceira e chamar ás súas funcións con espazos ou guións baixos indistintamente.\n\n---\n\n## 3. Referencia rápida da API de `time`\n\n| Sinatura / Función / Tipo | Que fai e cando usala |\n|---|---|\n| `time epoch to utc / time utc to epoch` | Conversión en $O(1)$ entre segundos Unix epoch e `(year, month, day, hour, min, sec)` |\n| `time is leap year / time days in month / time day of week` | Regras de ano bisesto (`400 / 100 / 4`), días do mes e día ISO da semana (`1=Lun..7=Dom`) |\n| `time format iso8601 / time parse iso8601` | Formatea e valida marcas `YYYY-MM-DDTHH:MM:SSZ` (`-1` en datas inválidas coma 30 de feb) |\n| `time format duration ms / time backoff ms` | Duracións lexibles e tempos de espera exponenciais acoutados $base \\cdot 2^{attempt}$ |\n\n---\n\n## 4. Receitas prácticas en estilo tabular\n\n### Receita 1: Fluxo principal con `time`\n\nObserva como os signos `=` e os pasos de transformación quedan aliñados coma unha táboa limpa:\n\n```ridgun\nimport time\n\nfn :: registrar evento temporal (epoch_s : Int) => (String, Int, String)\n      registrar evento temporal epoch_s =\n        iso = time format iso8601 epoch_s\n        sem = time day of week epoch_s\n        dur = time format duration ms 3661005\n        (iso, sem, dur)\n```\n\n### Receita 2: Composición segura e sen efectos laterais\n\nToda función da lib `time` é compoñible co resto das 32 libs de `ridgun-libs`:\n\n```ridgun\nimport time\n\nfn :: planificar reintentos () => [Int]\n      planificar reintentos =\n        [time backoff ms 0 100 5000, time backoff ms 1 100 5000, time backoff ms 2 100 5000, time backoff ms 9 100 5000]\n```\n\n---\n\n## 5. Baixo o capó: rendemento, memoria RMM e garantías\n\n- **Garantía algorítmica e de seguridade**: Conversión de calendario en $O(1)$ sen bucles ano por ano e validación estrita de días por mes (rexeitando o 29 de febreiro en anos non bisestos).\n- **Memoria determinista (`RMM1`/`RMM2`)**: Cero pausas de colector de lixo; todas as estruturas intermedias libéranse de forma determinista ao saír do ámbito.\n- **Verificación continua**: Probada exhaustivamente con `stable check` e a suite automatizada `src/test/ridgun/test_time.rg`.\n"}, {"num": "19", "slug": "19-lib-uuid-identificadores-crc32-e-prng", "file": "19-lib-uuid-identificadores-crc32-e-prng.md", "title": "Capítulo 19: A lib `uuid` — RFC 9562 `UUIDv4`/`UUIDv7`, FNV-1a, Adler-32, CRC-32 e PRNG", "short_title": "A lib `uuid` — RFC 9562 `UUIDv4`/`UUIDv7`, FNV-1a, Adler-32, CRC-32 e PRNG", "markdown": "# Capítulo 19: A lib `uuid` — RFC 9562 `UUIDv4`/`UUIDv7`, FNV-1a, Adler-32, CRC-32 e PRNG\n\n## 1. Por que existe a lib `uuid`?\n\nSexamos sinceros: usar `UUIDv4` completamente aleatorios como chave primaria nunha base de datos fragmenta os índices B-Tree, mentres que inventarse IDs caseiros sen entropía do kernel acaba en colisións.\n\nA lib **`uuid`** implementa **`UUIDv4`** (aleatorio con CSPRNG do kernel) e **`UUIDv7`** (ordenado cronoloxicamente nos primeiros 48 bits segundo **RFC 9562**), sumas de verificación rápidas (**FNV-1a**, **Adler-32**, **CRC-32 IEEE 802.3**) e un PRNG determinista con semente.\n\n---\n\n## 2. Artefactos, importación e arquitectura sen `libc`\n\nEn `ridgun-libs`, **`uuid`** é unha **lib** de primeira clase situada en `src/main/ridgun/lib/uuid.rg` (dominio `UUID`). Ao compilar con `stable bundle`, empaquétase en tres formatos nativos:\n\n| Artefacto | Ruta | Propósito |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/uuid.rglib` | Distribución e importación directa con `import uuid` |\n| **Ficheiro compilado** | `target/uuid.rgc` | Artefacto intermedio verificado por `ridgunc` |\n| **Obxecto compartido ELF64** | `target/libuuid.so` | Biblioteca dinámica nativa sen dependencias de C nin `libc` |\n\n> Para usar esta lib en calquera ficheiro `.rg`, abonda con declarar `import uuid` na cabeceira e chamar ás súas funcións con espazos ou guións baixos indistintamente.\n\n---\n\n## 3. Referencia rápida da API de `uuid`\n\n| Sinatura / Función / Tipo | Que fai e cando usala |\n|---|---|\n| `uuid v4 / uuid v7 / uuid v7 at` | Xera UUIDs canónicos de 36 caracteres RFC 9562 v4 (aleatorio) e v7 (ordenado polo tempo) |\n| `uuid is valid / uuid version` | Valida a estrutura 8-4-4-4-12 e os bits de variante RFC 9562 (`8, 9, a, b`) |\n| `fnv1a 32 / adler32 / crc32 / crc32 hex` | Hashes non criptográficos e sumas de verificación rápidas de 32 bits |\n| `prng next / prng range` | PRNG congruenci
