al lineal funcional puro para probas e simulacións reproducibles |\n\n---\n\n## 4. Receitas prácticas en estilo tabular\n\n### Receita 1: Fluxo principal con `uuid`\n\nObserva como os signos `=` e os pasos de transformación quedan aliñados coma unha táboa limpa:\n\n```ridgun\nimport uuid\n\nfn :: generar ids ordenados () => (String, String, Bool)\n      generar ids ordenados =\n        id1 = uuid v7 at 1000\n        id2 = uuid v7 at 2000\n        ok  = (uuid is valid id1) and (id1 < id2)\n        (id1, id2, ok)\n```\n\n### Receita 2: Composición segura e sen efectos laterais\n\nToda función da lib `uuid` é compoñible co resto das 32 libs de `ridgun-libs`:\n\n```ridgun\nimport uuid\n\nfn :: firmar paquete (payload : String) => (String, Int)\n      firmar paquete payload =\n         (crc32 hex payload, fnv1a 32 payload)\n```\n\n---\n\n## 5. Baixo o capó: rendemento, memoria RMM e garantías\n\n- **Garantía algorítmica e de seguridade**: `uuid v7 at t1 < uuid v7 at t2` garante orde lexicográfica monótona crecente co tempo, ideal para índices `btree` e bases de datos.\n- **Memoria determinista (`RMM1`/`RMM2`)**: Cero pausas de colector de lixo; todas as estruturas intermedias libéranse de forma determinista ao saír do ámbito.\n- **Verificación continua**: Probada exhaustivamente con `stable check` e a suite automatizada `src/test/ridgun/test_uuid.rg`.\n"}, {"num": "20", "slug": "20-lib-log-logging-ndjson-e-redaccion", "file": "20-lib-log-logging-ndjson-e-redaccion.md", "title": "Capítulo 20: A lib `log` — Logging Estruturado NDJSON e Redacción Automática de Segredos", "short_title": "A lib `log` — Logging Estruturado NDJSON e Redacción Automática de Segredos", "markdown": "# Capítulo 20: A lib `log` — Logging Estruturado NDJSON e Redacción Automática de Segredos\n\n## 1. Por que existe a lib `log`?\n\nSexamos sinceros: envorcar os campos dunha petición nun ficheiro de log e descubrir semanas despois que acabas de gardar `password`, `api_key` ou `authorization` en texto plano no teu agregador de logs é un incidente de seguridade clásico.\n\nA lib **`log`** proporciona filtrado por severidade (`DEBUG`, `INFO`, `WARN`, `ERROR`), formatado en texto humano e **NDJSON estruturado**, e **redacción automática de chaves sensibles** (`password`, `secret`, `token`, `api_key`, `authorization`, `cookie`, `private_key` $\\rightarrow$ `\"[REDACTED]\"`, mitigando `VUL-LOG-001`).\n\n---\n\n## 2. Artefactos, importación e arquitectura sen `libc`\n\nEn `ridgun-libs`, **`log`** é unha **lib** de primeira clase situada en `src/main/ridgun/lib/log.rg` (dominio `LOG`). Ao compilar con `stable bundle`, empaquétase en tres formatos nativos:\n\n| Artefacto | Ruta | Propósito |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/log.rglib` | Distribución e importación directa con `import log` |\n| **Ficheiro compilado** | `target/log.rgc` | Artefacto intermedio verificado por `ridgunc` |\n| **Obxecto compartido ELF64** | `target/liblog.so` | Biblioteca dinámica nativa sen dependencias de C nin `libc` |\n\n> Para usar esta lib en calquera ficheiro `.rg`, abonda con declarar `import log` na cabeceira e chamar ás súas funcións con espazos ou guións baixos indistintamente.\n\n---\n\n## 3. Referencia rápida da API de `log`\n\n| Sinatura / Función / Tipo | Que fai e cando usala |\n|---|---|\n| `log level rank / log should emit` | Compara niveis (`DEBUG=10`, `INFO=20`, `WARN=30`, `ERROR=40`) fronte ao limiar activo |\n| `log is sensitive key / log redact fields` | Substitúe valores de chaves segredas por `\"[REDACTED]\"` sen importar maiúsculas |\n| `log format text / log format json` | Formatea liñas texto `chave=valor` ou NDJSON RFC 8259 con redacción automática de segredos |\n\n---\n\n## 4. Receitas prácticas en estilo tabular\n\n### Receita 1: Fluxo principal con `log`\n\nObserva como os signos `=` e os pasos de transformación quedan aliñados coma unha táboa limpa:\n\n```ridgun\nimport log\n\nfn :: auditar login (usuario : String) (clave : String) => String\n      auditar login usuario clave =\n        campos = [(\"user\", usuario), (\"password\", clave), (\"ip\", \"10.0.0.1\")]\n        log format json \"INFO\" \"intento de acceso\" campos\n```\n\n### Receita 2: Composición segura e sen efectos laterais\n\nToda función da lib `log` é compoñible co resto das 32 libs de `ridgun-libs`:\n\n```ridgun\nimport log\n\nfn :: emitir si procede (umbral : String) (nivel : String) (msg : String) => String\n      emitir si procede umbral nivel msg =\n        | log should emit umbral nivel = log format text nivel msg [(\"service\", \"solstice\")]\n        | otherwise                    = \"\"\n```\n\n---\n\n## 5. Baixo o capó: rendemento, memoria RMM e garantías\n\n- **Garantía algorítmica e de seguridade**: Tanto `log format text` coma `log format json` pasan sempre os campos por `log redact fields` antes de serializar, garantindo que ningún segredo se filtre por esquecemento.\n- **Memoria determinista (`RMM1`/`RMM2`)**: Cero pausas de colector de lixo; todas as estruturas intermedias libéranse de forma determinista ao saír do ámbito.\n- **Verificación continua**: Probada exhaustivamente con `stable check` e a suite automatizada `src/test/ridgun/test_log.rg`.\n"}, {"num": "21", "slug": "21-lib-test-asercions-unitarias-e-funcionais", "file": "21-lib-test-asercions-unitarias-e-funcionais.md", "title": "Capítulo 21: A lib `test` — Primitivas de Aserción Unitaria e Funcional (`RG-011`)", "short_title": "A lib `test` — Primitivas de Aserción Unitaria e Funcional (`RG-011`)", "markdown": "# Capítulo 21: A lib `test` — Primitivas de Aserción Unitaria e Funcional (`RG-011`)\n\n## 1. Por que existe a lib `test`?\n\nSexamos sinceros: cando un framework de tests require macros máxicas, reflexión en tempo de execución ou un runner externo pesado, escribir probas deixa de ser inmediato.\n\nA lib **`test`** (`RG-011`) proporciona asercións puras, polimórficas e específicas de tipo que emiten diagnósticos claros `[FAIL]` cos valores esperado e obtido e rematan con código de saída `1` en canto falla unha invariante.\n\n---\n\n## 2. Artefactos, importación e arquitectura sen `libc`\n\nEn `ridgun-libs`, **`test`** é unha **lib** de primeira clase situada en `src/main/ridgun/lib/test.rg` (dominio `TST`). Ao compilar con `stable bundle`, empaquétase en tres formatos nativos:\n\n| Artefacto | Ruta | Propósito |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/test.rglib` | Distribución e importación directa con `import test` |\n| **Ficheiro compilado** | `target/test.rgc` | Artefacto intermedio verificado por `ridgunc` |\n| **Obxecto compartido ELF64** | `target/libtest.so` | Biblioteca dinámica nativa sen dependencias de C nin `libc` |\n\n> Para usar esta lib en calquera ficheiro `.rg`, abonda con declarar `import test` na cabeceira e chamar ás súas funcións con espazos ou guións baixos indistintamente.\n\n---\n\n## 3. Referencia rápida da API de `test`\n\n| Sinatura / Función / Tipo | Que fai e cando usala |\n|---|---|\n| `assert equals / assert eq : A -> A -> String -> ()` | Aserción polimórfica de igualdade con etiqueta descritiva do caso de proba |\n| `assert int equals / assert str eq` | Asercións especializadas de igualdade para `Int` e `String` |\n| `assert true / assert false / assert not` | Asercións de invariantes booleanas (`True` / `False`) |\n| `assert ok : Int -> String -> ()` | Verifica que un código de estado do sistema ou socket sexa `0` (`OK`) |\n\n---\n\n## 4. Receitas prácticas en estilo tabular\n\n### Receita 1: Fluxo principal con `test`\n\nObserva como os signos `=` e os pasos de transformación quedan aliñados coma unha táboa limpa:\n\n```ridgun\nimport test\nimport math\n\nfn :: suite matematicas () => ()\n      suite matematicas =\n        _ = assert int equals 12 (math gcd 36 60) \"MCD de 36 y 60\"\n        _ = assert true (math is prime 97) \"97 es primo\"\n        echo \"[PASS] suite matematicas\"\n```\n\n### Receita 2: Composición segura e sen efectos laterais\n\nToda función da lib `test` é compoñible co resto das 32 libs de `ridgun-libs`:\n\n```ridgun\nimport test\n\nfn :: verificar codigo sistema (rc : Int) => ()\n      verificar codigo sistema rc =\n        assert ok rc \"operacion de descriptor exitosa\"\n```\n\n---\n\n## 5. Baixo o capó: rendemento, memoria RMM e garantías\n\n- **Garantía algorítmica e de seguridade**: As 30 suites de probas de `ridgun-libs` (`src/test/ridgun/test_*.rg`, máis de 4 000 liñas) execútanse con esta mesma lib mediante `stable test`.\n- **Memoria determinista (`RMM1`/`RMM2`)**: Cero pausas de colector de lixo; todas as estruturas intermedias libéranse de forma determinista ao saír do ámbito.\n- **Verificación continua**: Probada exhaustivamente con `stable check` e a suite automatizada `src/test/ridgun/test_test.rg`.\n"}, {"num": "22", "slug": "22-lib-posix-capa-pal-reloxos-e-sinais", "file": "22-lib-posix-capa-pal-reloxos-e-sinais.md", "title": "Capítulo 22: A lib `posix` — Capa de Abstracción de Plataforma (PAL), Reloxos, Sinais e CSPRNG", "short_title": "A lib `posix` — Capa de Abstracción de Plataforma (PAL), Reloxos, Sinais e CSPRNG", "markdown": "# Capítulo 22: A lib `posix` — Capa de Abstracción de Plataforma (PAL), Reloxos, Sinais e CSPRNG\n\n## 1. Por que existe a lib `posix`?\n\nSexamos sinceros: as bandeiras coma `O_CREAT`, `O_NONBLOCK` ou os números de syscall mudan entre Linux, macOS e arquitecturas (`X86_64` vs `Arm64`), e en C todo se resolve cunha xungla ilexible de `#ifdef`.\n\nA lib **`posix`** implementa a **Capa de Abstracción de Plataforma (PAL)** de 2 niveis de Ridgun usando gardas tabulares sobre `sys os` (`Linux | MacOS | Windows`) e `sys arch` (`X86_64 | Arm64 | RiscV64`), ademais de sondaxe de descritores (`wait fd` / `PollStatus`), reloxos monótonos e de parede (`RGF-017`), sinais (`RGF-018`) e entropía CSPRNG do kernel (`sys random bytes`).\n\n---\n\n## 2. Artefactos, importación e arquitectura sen `libc`\n\nEn `ridgun-libs`, **`posix`** é unha **lib** de primeira clase situada en `src/main/ridgun/lib/posix.rg` (dominio `POSIX`). Ao compilar con `stable bundle`, empaquétase en tres formatos nativos:\n\n| Artefacto | Ruta | Propósito |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/posix.rglib` | Distribución e importación directa con `import posix` |\n| **Ficheiro compilado** | `target/posix.rgc` | Artefacto intermedio verificado por `ridgunc` |\n| **Obxecto compartido ELF64** | `target/libposix.so` | Biblioteca dinámica nativa sen dependencias de C nin `libc` |\n\n> Para usar esta lib en calquera ficheiro `.rg`, abonda con declarar `import posix` na cabeceira e chamar ás súas funcións con espazos ou guións baixos indistintamente.\n\n---\n\n## 3. Referencia rápida da API de `posix`\n\n| Sinatura / Función / Tipo | Que fai e cando usala |\n|---|---|\n| `pal open create trunc wr / pal o nonblock` | Tradución de bandeiras do SO segundo `sys os` (`Linux | MacOS | Windows`) |\n| `wait fd : Int -> Int -> Int -> PollStatus` | Sonda un descritor devolvendo `PollReady`, `PollTimeout` ou `PollError errno` |\n| `clock monotonic ms / clock monotonic ns / clock wall ms` | Reloxos monótonos e reloxo de parede UTC en milisegundos (`RGF-017`) |\n| `signal watch / signal poll / sys random bytes` | Sondaxe non bloqueante de sinais (`SIGINT`, `SIGTERM`) e bytes CSPRNG do kernel |\n| `read text / write text / file exists / run cmd` | E/S de ficheiros de alto nivel, directorios e execución de subprocesos |\n\n---\n\n## 4. Receitas prácticas en estilo tabular\n\n### Receita 1: Fluxo principal con `posix`\n\nObserva como os signos `=` e os pasos de transformación quedan aliñados coma unha táboa limpa:\n\n```ridgun\nimport posix\n\nfn :: medir operacion () => (Int, Int)\n      medir operacion =\n        t0  = clock monotonic ms\n        rnd = len (sys random bytes 32)\n        t1  = clock monotonic ms\n        (rnd, t1 - t0)\n```\n\n### Receita 2: Composición segura e sen efectos laterais\n\nToda función da lib `posix` é compoñible co resto das 32 libs de `ridgun-libs`:\n\n```ridgun\nimport posix\n\nfn :: esperar lectura (fd : Int) => Bool\n      esperar lectura fd =\n        est = wait fd fd poll_in 100\n        est == PollReady\n```\n\n---\n\n## 5. Baixo o capó: rendemento, memoria RMM e garantías\n\n- **Garantía algorítmica e de seguridade**: As ramas de `sys os` e `sys arch` que non corresponden ao binario destino son eliminadas en tempo de compilación (Dead-Code Elimination) por `ridgunc`.\n- **Memoria determinista (`RMM1`/`RMM2`)**: Cero pausas de colector de lixo; todas as estruturas intermedias libéranse de forma determinista ao saír do ámbito.\n- **Verificación continua**: Probada exhaustivamente con `stable check` e a suite automatizada `src/test/ridgun/test_posix.rg`.\n"}, {"num": "23", "slug": "23-lib-io-entrada-saida-con-timeout", "file": "23-lib-io-entrada-saida-con-timeout.md", "title": "Capítulo 23: A lib `io` — Erros Tipados `IoResult`, E/S con `with timeout` e Procesos", "short_title": "A lib `io` — Erros Tipados `IoResult`, E/S con `with timeout` e Procesos", "markdown": "# Capítulo 23: A lib `io` — Erros Tipados `IoResult`, E/S con `with timeout` e Procesos\n\n## 1. Por que existe a lib `io`?\n\nSexamos sinceros: unha chamada a `read()` ou un subproceso fillo sen data límite (`timeout`) é unha invitación a que un só recurso colgado esgote todos os traballadores do teu servidor.\n\nA lib **`io`** modela cada operación do sistema con ADTs explícitos (`IoError`, `IoResult[A]`), combina `ppoll` non bloqueante con cotas léxicas `with timeout wait_ms do` de Ridgun e ofrece os operadores mixfix `read fd ... timeout` e `write fd ... timeout`.\n\n---\n\n## 2. Artefactos, importación e arquitectura sen `libc`\n\nEn `ridgun-libs`, **`io`** é unha **lib** de primeira clase situada en `src/main/ridgun/lib/io.rg` (dominio `IO`). Ao compilar con `stable bundle`, empaquétase en tres formatos nativos:\n\n| Artefacto | Ruta | Propósito |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/io.rglib` | Distribución e importación directa con `import io` |\n| **Ficheiro compilado** | `target/io.rgc` | Artefacto intermedio verificado por `ridgunc` |\n| **Obxecto compartido ELF64** | `target/libio.so` | Biblioteca dinámica nativa sen dependencias de C nin `libc` |\n\n> Para usar esta lib en calquera ficheiro `.rg`, abonda con declarar `import io` na cabeceira e chamar ás súas funcións con espazos ou guións baixos indistintamente.\n\n---\n\n## 3. Referencia rápida da API de `io`\n\n| Sinatura / Función / Tipo | Que fai e cando usala |\n|---|---|\n| `type IoError / type IoResult[A]` | `IoNotFound | IoPermission | IoTimeout | IoRefused | IoReset | IoEOF | IoInvalid | IoSysError` |\n| `io read with timeout / io write with timeout` | Lectura/escritura non bloqueante de descritor acoutada por `wait_ms` |\n| `read fd N max M timeout T / write fd N data S timeout T` | Operadores mixfix ergonómicos (`op ::`) para E/S de descritor con data límite |\n| `io read file / io write file / io read lines` | Funcións seguras de ficheiros e fluxos de liñas que devolven `IoResult` |\n| `exec with timeout : String -> Int -> IoResult[ProcStatus]` | Executa un comando externo acoutado por unha cota léxica `with timeout` |\n\n---\n\n## 4. Receitas prácticas en estilo tabular\n\n### Receita 1: Fluxo principal con `io`\n\nObserva como os signos `=` e os pasos de transformación quedan aliñados coma unha táboa limpa:\n\n```ridgun\nimport io\n\nfn :: leer peticion segura (fd : Int) => String\n      leer peticion segura fd =\n        res = read fd fd max 4096 timeout 250\n        io unwrap or res \"\"\n```\n\n### Receita 2: Composición segura e sen efectos laterais\n\nToda función da lib `io` é compoñible co resto das 32 libs de `ridgun-libs`:\n\n```ridgun\nimport io\n\nfn :: describir fallo () => String\n      describir fallo =\n        format io error (IoTimeout \"read\" 250)\n```\n\n---\n\n## 5. Baixo o capó: rendemento, memoria RMM e garantías\n\n- **Garantía algorítmica e de seguridade**: Ningunha lectura, escritura ou comando executado a través de `io` con cota `wait_ms` pode bloquear indefinidamente o fío ou actor chamante.\n- **Memoria determinista (`RMM1`/`RMM2`)**: Cero pausas de colector de lixo; todas as estruturas intermedias libéranse de forma determinista ao saír do ámbito.\n- **Verificación continua**: Probada exhaustivamente con `stable check` e a suite automatizada `src/test/ridgun/test_io.rg`.\n"}, {"num": "24", "slug": "24-lib-crypto-sha256-hmac-pbkdf2-e-aead", "file": "24-lib-crypto-sha256-hmac-pbkdf2-e-aead.md", "title": "Capítulo 24: A lib `crypto` — SHA-256, HMAC, PBKDF2, Argon2id e ChaCha20-Poly1305 AEAD", "short_title": "A lib `crypto` — SHA-256, HMAC, PBKDF2, Argon2id e ChaCha20-Poly1305 AEAD", "markdown": "# Capítulo 24: A lib `crypto` — SHA-256, HMAC, PBKDF2, Argon2id e ChaCha20-Poly1305 AEAD\n\n## 1. Por que existe a lib `crypto`?\n\nSexamos sinceros: comparar un HMAC con `==` abre a porta a ataques de temporización (*timing attacks*), e depender de `libssl.so` para calcular un `SHA-256` ou cifrar con `ChaCha20-Poly1305` rompe a portabilidade estática de calquera binario.\n\nA lib **`crypto`** implementa ao 100 % en Ridgun puro sobre `Tensor[Int]` preasignado: operacións de bytes/bits (`RGF-019`), **FIPS 180-4 SHA-256**, **RFC 2104 HMAC-SHA-256**, igualdade en tempo constante (`ct equal`), **RFC 8018 PBKDF2-HMAC-SHA-256** con precomputación do estado intermedio SHA-256, fachada **Argon2id** de 5 argumentos e cifrado autenticado **RFC 8439 ChaCha20-Poly1305 AEAD** (`aead seal` / `aead open`).\n\n---\n\n## 2. Artefactos, importación e arquitectura sen `libc`\n\nEn `ridgun-libs`, **`crypto`** é unha **lib** de primeira clase situada en `src/main/ridgun/lib/crypto.rg` (dominio `CRYPTO`). Ao compilar con `stable bundle`, empaquétase en tres formatos nativos:\n\n| Artefacto | Ruta | Propósito |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/crypto.rglib` | Distribución e importación directa con `import crypto` |\n| **Ficheiro compilado** | `target/crypto.rgc` | Artefacto intermedio verificado por `ridgunc` |\n| **Obxecto compartido ELF64** | `target/libcrypto.so` | Biblioteca dinámica nativa sen dependencias de C nin `libc` |\n\n> Para usar esta lib en calquera ficheiro `.rg`, abonda con declarar `import crypto` na cabeceira e chamar ás súas funcións con espazos ou guións baixos indistintamente.\n\n---\n\n## 3. Referencia rápida da API de `crypto`\n\n| Sinatura / Función / Tipo | Que fai e cando usala |\n|---|---|\n| `sha256 bytes / sha256 hex` | Resumo binario de 32 bytes ou hexadecimal de 64 caracteres FIPS 180-4 SHA-256 |\n| `hmac sha256 / hmac sha256 hex / ct equal` | MAC con chave RFC 2104 e comparación de acumulador en tempo constante |\n| `pbkdf2 hmac sha256 : String -> String -> Int -> Int -> String` | Derivación de chaves RFC 8018 con estados intermedios SHA-256 precomputados |\n| `argon2id hash / argon2id verify` | Hashing de contrasinais PHC RFC 9106 de 5 argumentos e verificación en tempo constante |\n| `aead seal / aead open` | Cifrado autenticado RFC 8439 ChaCha20-Poly1305 e descifrado con verificación de tag |\n\n---\n\n## 4. Receitas prácticas en estilo tabular\n\n### Receita 1: Fluxo principal con `crypto`\n\nObserva como os signos `=` e os pasos de transformación quedan aliñados coma unha táboa limpa:\n\n```ridgun\nimport crypto\n\nfn :: cifrar mensaje sesion (secreto : String) (texto : String) => (Int, String)\n      cifrar mensaje sesion secreto texto =\n        key32   = sha256 bytes secreto\n        nonce12 = \"0123456789ab\"\n        aad     = \"canal-autenticado\"\n        sellado = aead seal key32 nonce12 aad texto\n        aead open key32 nonce12 aad sellado\n```\n\n### Receita 2: Composición segura e sen efectos laterais\n\nToda función da lib `crypto` é compoñible co resto das 32 libs de `ridgun-libs`:\n\n```ridgun\nimport crypto\n\nfn :: verificar firma webhook (clave : String) (cuerpo : String) (firma_hex : String) => Bool\n      verificar firma webhook clave cuerpo firma_hex =\n        esperada = hmac sha256 hex clave cuerpo\n        ct equal esperada firma_hex\n```\n\n---\n\n## 5. Baixo o capó: rendemento, memoria RMM e garantías\n\n- **Garantía algorítmica e de seguridade**: `aead open` verifica o tag Poly1305 de 16 bytes en tempo constante antes de devolver un só byte de texto plano (se falla, devolve `(-1, \"\")`).\n- **Memoria determinista (`RMM1`/`RMM2`)**: Cero pausas de colector de lixo; todas as estruturas intermedias libéranse de forma determinista ao saír do ámbito.\n- **Verificación continua**: Probada exhaustivamente con `stable check` e a suite automatizada `src/test/ridgun/test_crypto.rg`.\n"}, {"num": "25", "slug": "25-lib-argon2id-hashing-rfc9106-e-owasp", "file": "25-lib-argon2id-hashing-rfc9106-e-owasp.md", "title": "Capítulo 25: A lib `argon2id` — RFC 9106 Argon2id sobre `Tensor[U64 * 8 * 16]`, Blake2b e Presets OWASP", "short_title": "A lib `argon2id` — RFC 9106 Argon2id sobre `Tensor[U64 * 8 * 16]`, Blake2b e Presets OWASP", "markdown": "# Capítulo 25: A lib `argon2id` — RFC 9106 Argon2id sobre `Tensor[U64 * 8 * 16]`, Blake2b e Presets OWASP\n\n## 1. Por que existe a lib `argon2id`?\n\nSexamos sinceros: gardar contrasinais cun simple SHA-256 permite que unha GPU moderna probe miles de millóns de combinacións por segundo, pero enlazar bibliotecas C externas para ter Argon2id adoita traer dores de cabeza de compilación e memoria.\n\nA lib **`argon2id`** implementa **RFC 9106 Argon2id** e **RFC 7693 Blake2b-512** ao 100 % en Ridgun puro operando directamente sobre bloques nativos `Tensor[U64 * 8 * 16]` (1 024 bytes por bloque en memoria contigua RMM2), con xeración de cadeas **PHC** (`$argon2id$v=19$m=...,t=...,p=...$`), perfís **OWASP** (`owaspfirst`, `owaspsecond`), soporte de *pepper* (`argon2id hash ctx`), derivación de chaves (`argon2id derive key`) e detección de actualización de parámetros (`argon2id needs rehash`).\n\n---\n\n## 2. Artefactos, importación e arquitectura sen `libc`\n\nEn `ridgun-libs`, **`argon2id`** é unha **lib** de primeira clase situada en `src/main/ridgun/lib/argon2id.rg` (dominio `CRYPTO`). Ao compilar con `stable bundle`, empaquétase en tres formatos nativos:\n\n| Artefacto | Ruta | Propósito |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/argon2id.rglib` | Distribución e importación directa con `import argon2id` |\n| **Ficheiro compilado** | `target/argon2id.rgc` | Artefacto intermedio verificado por `ridgunc` |\n| **Obxecto compartido ELF64** | `target/libargon2id.so` | Biblioteca dinámica nativa sen dependencias de C nin `libc` |\n\n> Para usar esta lib en calquera ficheiro `.rg`, abonda con declarar `import argon2id` na cabeceira e chamar ás súas funcións con espazos ou guións baixos indistintamente.\n\n---\n\n## 3. Referencia rápida da API de `argon2id`\n\n| Sinatura / Función / Tipo | Que fai e cando usala |\n|---|---|\n| `argon2id hash / argon2id verify` | Hashing PHC RFC 9106 de 6 argumentos (`pwd, salt, m_kib, t, p, tag_len`) e verificación en tempo constante |\n| `argon2id hash with preset / argon2id params preset` | Perfís con nome: `\"interactive\"`, `\"owaspfirst\"` (`19456 KiB, t=2`), `\"owaspsecond\"` (`47104 KiB, t=1`), `\"moderate\"`, `\"sensitive\"` |\n| `argon2id hash ctx / argon2id verify ctx` | Hashing RFC 9106 con segredo `pepper` ($K$) e datos asociados ($X$) |\n| `argon2id derive key / argon2id needs rehash` | Derivación de chave binaria crúa e detección de necesidade de rehash en cadeas PHC |\n| `blake2b / blake2b hex` | Resumo criptográfico de propósito xeral RFC 7693 Blake2b (`1..64` bytes) |\n\n---\n\n## 4. Receitas prácticas en estilo tabular\n\n### Receita 1: Fluxo principal con `argon2id`\n\nObserva como os signos `=` e os pasos de transformación quedan aliñados coma unha táboa limpa:\n\n```ridgun\nimport argon2id\n\nfn :: proteger clave usuario (clave : String) => (String, Bool, Bool)\n      proteger clave usuario clave =\n        phc    = argon2id hash clave \"sal-unica-16byte\" 32 2 1 32\n        valido = argon2id verify clave phc\n        rehash = argon2id needs rehash phc 19456 2 1 32\n        (phc, valido, rehash)\n```\n\n### Receita 2: Composición segura e sen efectos laterais\n\nToda función da lib `argon2id` é compoñible co resto das 32 libs de `ridgun-libs`:\n\n```ridgun\nimport argon2id\n\nfn :: derivar clave maestra (frase : String) (sal : String) => String\n      derivar clave maestra frase sal =\n        -- Deriva 32 bytes crudos listos para ChaCha20-Poly1305 AEAD\n        argon2id derive key frase sal 64 2 1 32\n```\n\n---\n\n## 5. Baixo o capó: rendemento, memoria RMM e garantías\n\n- **Garantía algorítmica e de seguridade**: Coincidencia byte a byte cos vectores oficiais RFC 9106 §5.3 e OpenSSL 3.5, operando sobre `Tensor[U64 * 8 * 16]` sen unha soa liña de C.\n- **Memoria determinista (`RMM1`/`RMM2`)**: Cero pausas de colector de lixo; todas as estruturas intermedias libéranse de forma determinista ao saír do ámbito.\n- **Verificación continua**: Probada exhaustivamente con `stable check` e a suite automatizada `src/test/ridgun/test_argon2id.rg`.\n"}, {"num": "26", "slug": "26-lib-jwt-tokens-rfc7519-e-aead", "file": "26-lib-jwt-tokens-rfc7519-e-aead.md", "title": "Capítulo 26: A lib `jwt` — JSON Web Tokens RFC 7519 (`HS256`) e Tokens Cifrados ChaCha20-Poly1305", "short_title": "A lib `jwt` — JSON Web Tokens RFC 7519 (`HS256`) e Tokens Cifrados ChaCha20-Poly1305", "markdown": "# Capítulo 26: A lib `jwt` — JSON Web Tokens RFC 7519 (`HS256`) e Tokens Cifrados ChaCha20-Poly1305\n\n## 1. Por que existe a lib `jwt`?\n\nSexamos sinceros: o ecosistema JWT é famoso por vulnerabilidades onde un atacante muda a cabeceira a `\"alg\":\"none\"` e o servidor acepta o token sen sinatura, ou onde se garda información sensible nun JWT esquecendo que o seu payload só está codificado en Base64url, non cifrado.\n\nA lib **`jwt`** resolve ambos mundos: asina e verifica **JWTs RFC 7519 (`HS256`)** esixindo explicitamente `alg == \"HS256\"`, comparando o HMAC en tempo constante e validando `exp`/`nbf`, e ademais ofrece **`token seal` / `token open`** para emitir tokens opacos autenticados e cifrados con **ChaCha20-Poly1305 AEAD**.\n\n---\n\n## 2. Artefactos, importación e arquitectura sen `libc`\n\nEn `ridgun-libs`, **`jwt`** é unha **lib** de primeira clase situada en `src/main/ridgun/lib/jwt.rg` (dominio `JWT`). Ao compilar con `stable bundle`, empaquétase en tres formatos nativos:\n\n| Artefacto | Ruta | Propósito |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/jwt.rglib` | Distribución e importación directa con `import jwt` |\n| **Ficheiro compilado** | `target/jwt.rgc` | Artefacto intermedio verificado por `ridgunc` |\n| **Obxecto compartido ELF64** | `target/libjwt.so` | Biblioteca dinámica nativa sen dependencias de C nin `libc` |\n\n> Para usar esta lib en calquera ficheiro `.rg`, abonda con declarar `import jwt` na cabeceira e chamar ás súas funcións con espazos ou guións baixos indistintamente.\n\n---\n\n## 3. Referencia rápida da API de `jwt`\n\n| Sinatura / Función / Tipo | Que fai e cando usala |\n|---|---|\n| `type JwtResult` | `JwtOk JsonVal | JwtExpired | JwtNotYetValid | JwtBadSignature | JwtMalformed` |\n| `jwt sign hs256 / jwt verify hs256` | Asina claims `JsonVal` e verifica sinatura + `alg == \"HS256\"` + xanelas `exp`/`nbf` |\n| `jwt claims / jwt get str / jwt get int` | Constrúe claims estándar `(sub, iss, iat, exp)` e consulta payloads verificados |\n| `token seal / token open` | Cifra e autentica tokens JSON opacos mediante ChaCha20-Poly1305 AEAD |\n\n---\n\n## 4. Receitas prácticas en estilo tabular\n\n### Receita 1: Fluxo principal con `jwt`\n\nObserva como os signos `=` e os pasos de transformación quedan aliñados coma unha táboa limpa:\n\n```ridgun\nimport jwt\nimport json\n\nfn :: emitir y verificar sesion (secreto : String) => (String, String)\n      emitir y verificar sesion secreto =\n        claims = jwt claims \"user-42\" \"solstice\" 1700000000 1700003600\n        tok    = jwt sign hs256 secreto claims\n        res    = jwt verify hs256 secreto tok 1700001000\n        sub    = jwt get str res \"sub\" \"anonimo\"\n        (tok, sub)\n```\n\n### Receita 2: Composición segura e sen efectos laterais\n\nToda función da lib `jwt` é compoñible co resto das 32 libs de `ridgun-libs`:\n\n```ridgun\nimport jwt\nimport json\n\nfn :: sellar token confidencial (clave : String) => JwtResult\n      sellar token confidencial clave =\n        datos = JnObj [(\"rol\", JnStr \"root\"), (\"pin\", JnInt 9988)]\n        sobre = token seal clave \"nonce-12byte\" datos\n        token open clave sobre\n```\n\n---\n\n## 5. Baixo o capó: rendemento, memoria RMM e garantías\n\n- **Garantía algorítmica e de seguridade**: Inmunidade total ao ataque `\"alg\":\"none\"` (calquera cabeceira cuxo `alg` non sexa exactamente `\"HS256\"` devolve `JwtBadSignature`) e comparación de sinatura en tempo constante.\n- **Memoria determinista (`RMM1`/`RMM2`)**: Cero pausas de colector de lixo; todas as estruturas intermedias libéranse de forma determinista ao saír do ámbito.\n- **Verificación continua**: Probada exhaustivamente con `stable check` e a suite automatizada `src/test/ridgun/test_jwt.rg`.\n"}, {"num": "27", "slug": "27-lib-socket-redes-dns-e-kernel-sockets", "file": "27-lib-socket-redes-dns-e-kernel-sockets.md", "title": "Capítulo 27: A lib `socket` — TCP, UDP, AF_UNIX, Framing, DNS RFC 1035 e Kernel Sockets (`RGF-001`)", "short_title": "A lib `socket` — TCP, UDP, AF_UNIX, Framing, DNS RFC 1035 e Kernel Sockets (`RGF-001`)", "markdown": "# Capítulo 27: A lib `socket` — TCP, UDP, AF_UNIX, Framing, DNS RFC 1035 e Kernel Sockets (`RGF-001`)\n\n## 1. Por que existe a lib `socket`?\n\nSexamos sinceros: programar sockets BSD en C con `struct sockaddr_in`, `htons`, `inet_pton` e `getaddrinfo` (que ademais arrastra `libnss` de `glibc`) é un ritual arcano dos anos 80.\n\nA lib **`socket`** ofrece dúas capas complementarias sen unha liña de C: (1) a API de descritores do kernel **`RGF-001`** para servidores de produción coma **Solstice** (`sys tcp listen`, `sys tcp listen reuseport`, `sys accept`, `sys tcp connect`, `sys send`, `sys recv`, `sys resolve ipv4` mediante `/etc/hosts` + paquetes DNS UDP RFC 1035 no porto 53) e (2) a máquina de estados funcional inmutable `Socket` con framing prefixado por lonxitude, liñas CRLF e subredes CIDR.\n\n---\n\n## 2. Artefactos, importación e arquitectura sen `libc`\n\nEn `ridgun-libs`, **`socket`** é unha **lib** de primeira clase situada en `src/main/ridgun/lib/socket.rg` (dominio `SOCK`). Ao compilar con `stable bundle`, empaquétase en tres formatos nativos:\n\n| Artefacto | Ruta | Propósito |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/socket.rglib` | Distribución e importación directa con `import socket` |\n| **Ficheiro compilado** | `target/socket.rgc` | Artefacto intermedio verificado por `ridgunc` |\n| **Obxecto compartido ELF64** | `target/libsocket.so` | Biblioteca dinámica nativa sen dependencias de C nin `libc` |\n\n> Para usar esta lib en calquera ficheiro `.rg`, abonda con declarar `import socket` na cabeceira e chamar ás súas funcións con espazos ou guións baixos indistintamente.\n\n---\n\n## 3. Referencia rápida da API de `socket`\n\n| Sinatura / Función / Tipo | Que fai e cando usala |\n|---|---|\n| `sys tcp listen / sys tcp listen reuseport / sys unix listen` | Enlaza e escoita en TCP IPv4 (`SO_REUSEADDR` / `SO_REUSEPORT`) ou `AF_UNIX` |\n| `sys accept / sys tcp connect / sys unix connect` | `accept` e `connect` acoutados por timeout devolvendo `SockFdResult` / `SockAcceptResult` |\n| `sys send / sys recv / sys shutdown write` | Envío, recepción e peche de escritura (`SHUT_WR`) de socket con timeout |\n| `sys resolve ipv4 / dns resolve a` | Resolución IPv4 pura en Ridgun mediante `/etc/hosts` e consultas DNS UDP RFC 1035 |\n| `sock send frame / sock recv frame / ipv4 in cidr` | Framing prefixado por lonxitude (`N:payload`) e coincidencia de subredes CIDR IPv4 |\n\n---\n\n## 4. Receitas prácticas en estilo tabular\n\n### Receita 1: Fluxo principal con `socket`\n\nObserva como os signos `=` e os pasos de transformación quedan aliñados coma unha táboa limpa:\n\n```ridgun\nimport socket\n\nfn :: eco tcp local () => String\n      eco tcp local =\n        l_res = sys tcp listen \"127.0.0.1\" 0 16\n        lfd   = sock fd l_res\n        port  = sys local port lfd\n        c_res = sys tcp connect \"127.0.0.1\" port 1000\n        cfd   = sock fd c_res\n        a_res = sys accept lfd 1000\n        sfd   = sock accept fd a_res\n        _     = sys send cfd \"hola-solstice\" 1000\n        r_res = sys recv sfd 64 1000\n        datos = sock recv data r_res\n        _     = sys_close cfd\n        _     = sys_close sfd\n        _     = sys_close lfd\n        datos\n```\n\n### Receita 2: Composición segura e sen efectos laterais\n\nToda función da lib `socket` é compoñible co resto das 32 libs de `ridgun-libs`:\n\n```ridgun\nimport socket\n\nfn :: verificar ip interna (ip : String) => Bool\n      verificar ip interna ip =\n        ipv4 in cidr ip \"10.0.0.0/8\"\n```\n\n---\n\n## 5. Baixo o capó: rendemento, memoria RMM e garantías\n\n- **Garantía algorítmica e de seguridade**: Actualización de rexistros con sintaxe inmutable `s with field = val`, resolución DNS sen `glibc`/`libnss` e códigos de estado deterministas (`0` OK, `-1` EOF, `-2` TIMEOUT, `-3` REFUSED).\n- **Memoria determinista (`RMM1`/`RMM2`)**: Cero pausas de colector de lixo; todas as estruturas intermedias libéranse de forma determinista ao saír do ámbito.\n- **Verificación continua**: Probada exhaustivamente con `stable check` e a suite automatizada `src/test/ridgun/test_socket.rg`.\n"}, {"num": "28", "slug": "28-lib-http-uris-http11-e-cliente-tcp", "file": "28-lib-http-uris-http11-e-cliente-tcp.md", "title": "Capítulo 28: A lib `http` — URIs RFC 3986, Codec HTTP/1.1 RFC 9112 e Cliente TCP en Vivo", "short_title": "A lib `http` — URIs RFC 3986, Codec HTTP/1.1 RFC 9112 e Cliente TCP en Vivo", "markdown": "# Capítulo 28: A lib `http` — URIs RFC 3986, Codec HTTP/1.1 RFC 9112 e Cliente TCP en Vivo\n\n## 1. Por que existe a lib `http`?\n\nSexamos sinceros: se non filtras saltos `\\r\\n` nos valores das cabeceiras HTTP, un atacante pode inxectar cabeceiras falsas ou dividir a resposta (*CRLF Response Splitting*), e enlazar `libcurl` para facer un simple `GET` ou `POST` é excesivo.\n\nA lib **`http`** implementa descomposición de **URIs RFC 3986**, construción e análise de peticións e respostas **HTTP/1.1 RFC 9112** con saneamento automático de CRLF (`VUL-INJ-002`) e `Content-Length` automático, extracción de tokens `Bearer` e un **cliente HTTP/1.1 en vivo sobre sockets TCP do kernel** (`http get`, `http post`, `http request tcp`).\n\n---\n\n## 2. Artefactos, importación e arquitectura sen `libc`\n\nEn `ridgun-libs`, **`http`** é unha **lib** de primeira clase situada en `src/main/ridgun/lib/http.rg` (dominio `HTTP`). Ao compilar con `stable bundle`, empaquétase en tres formatos nativos:\n\n| Artefacto | Ruta | Propósito |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/http.rglib` | Distribución e importación directa con `import http` |\n| **Ficheiro compilado** | `target/http.rgc` | Artefacto intermedio verificado por `ridgunc` |\n| **Obxecto compartido ELF64** | `target/libhttp.so` | Biblioteca dinámica nativa sen dependencias de C nin `libc` |\n\n> Para usar esta lib en calquera ficheiro `.rg`, abonda con declarar `import http` na cabeceira e chamar ás súas funcións con espazos ou guións baixos indistintamente.\n\n---\n\n## 3. Referencia rápida da API de `http`\n\n| Sinatura / Función / Tipo | Que fai e cando usala |\n|---|---|\n| `uri parse / uri scheme / uri host / uri port / uri path / uri query` | Descompón URIs RFC 3986 con portos por defecto automáticos (`80` en `http`, `443` en `https`) |\n| `http build request / http parse request` | Formatea e analiza peticións HTTP/1.1 con saneamento CRLF de cabeceiras |\n| `http build response / http parse response` | Formatea e analiza respostas HTTP/1.1 con frases de estado estándar |\n| `http header get / http bearer token` | Busca de cabeceiras insensible a maiúsculas e extracción de `Authorization: Bearer <token>` |\n| `http get / http post / http request tcp` | Executa chamadas HTTP/1.1 en vivo sobre sockets TCP do kernel con `timeout_ms` |\n\n---\n\n## 4. Receitas prácticas en estilo tabular\n\n### Receita 1: Fluxo principal con `http`\n\nObserva como os signos `=` e os pasos de transformación quedan aliñados coma unha táboa limpa:\n\n```ridgun\nimport http\n\nfn :: inspeccionar endpoint (url : String) => (String, Int, String, String)\n      inspeccionar endpoint url =\n        host = uri host url\n        port = uri port url\n        path = uri path url\n        wire = http build request \"GET\" path [(\"Host\", host)] \"\"\n        (host, port, path, wire)\n```\n\n### Receita 2: Composición segura e sen efectos laterais\n\nToda función da lib `http` é compoñible co resto das 32 libs de `ridgun-libs`:\n\n```ridgun\nimport http\n\nfn :: extraer credenciales (raw_req : String) => (String, String)\n      extraer credenciales raw_req =\n        (metodo, ruta, _, hdrs_raw, _) = http parse request raw_req\n        hdrs = http parse headers hdrs_raw\n        tok  = http bearer token hdrs\n        (metodo + \" \" + ruta, tok)\n```\n\n---\n\n## 5. Baixo o capó: rendemento, memoria RMM e garantías\n\n- **Garantía algorítmica e de seguridade**: Saneamento automático de `\\r` e `\\n` en todas as cabeceiras (`http sanitize header`) para impedir ataques de división de resposta HTTP.\n- **Memoria determinista (`RMM1`/`RMM2`)**: Cero pausas de colector de lixo; todas as estruturas intermedias libéranse de forma determinista ao saír do ámbito.\n- **Verificación continua**: Probada exhaustivamente con `stable check` e a suite automatizada `src/test/ridgun/test_http.rg`.\n"}, {"num": "29", "slug": "29-lib-ws-protocolo-websocket-rfc6455", "file": "29-lib-ws-protocolo-websocket-rfc6455.md", "title": "Capítulo 29: A lib `ws` — Handshake WebSocket RFC 6455, Framing de 16/64 bits e Enmascarado XOR", "short_title": "A lib `ws` — Handshake WebSocket RFC 6455, Framing de 16/64 bits e Enmascarado XOR", "markdown": "# Capítulo 29: A lib `ws` — Handshake WebSocket RFC 6455, Framing de 16/64 bits e Enmascarado XOR\n\n## 1. Por que existe a lib `ws`?\n\nSexamos sinceros: o protocolo WebSocket (RFC 6455) combina un handshake SHA-1 + Base64 con tramas binarias de lonxitude variable (7 bits, 16 bits ou 64 bits) e enmascarado XOR obrigatorio de cliente a servidor.\n\nA lib **`ws`** implementa **RFC 6455** completo en Ridgun puro: cálculo de `Sec-WebSocket-Accept` (con SHA-1 RFC 3174 integrado exclusivamente para o GUID de handshake), cabeceiras HTTP `101 Switching Protocols`, codificación e descodificación de tramas (`WsFrame`) con lonxitudes de 7, 16 (`126`) e 64 bits (`127`), enmascarado simétrico XOR e construtores de tramas de texto, ping, pong e peche.\n\n---\n\n## 2. Artefactos, importación e arquitectura sen `libc`\n\nEn `ridgun-libs`, **`ws`** é unha **lib** de primeira clase situada en `src/main/ridgun/lib/ws.rg` (dominio `WS`). Ao compilar con `stable bundle`, empaquétase en tres formatos nativos:\n\n| Artefacto | Ruta | Propósito |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/ws.rglib` | Distribución e importación directa con `import ws` |\n| **Ficheiro compilado** | `target/ws.rgc` | Artefacto intermedio verificado por `ridgunc` |\n| **Obxecto compartido ELF64** | `target/libws.so` | Biblioteca dinámica nativa sen dependencias de C nin `libc` |\n\n> Para usar esta lib en calquera ficheiro `.rg`, abonda con declarar `import ws` na cabeceira e chamar ás súas funcións con espazos ou guións baixos indistintamente.\n\n---\n\n## 3. Referencia rápida da API de `ws`\n\n| Sinatura / Función / Tipo | Que fai e cando usala |\n|---|---|\n| `ws accept key : String -> String` | Calcula `Sec-WebSocket-Accept` (RFC 6455 §1.3) a partir de `Sec-WebSocket-Key` |\n| `ws build upgrade request / ws build upgrade response` | Formatea as mensaxes HTTP/1.1 de negociación (upgrade handshake) WebSocket |\n| `ws encode frame / ws decode frame` | Codifica e descodifica tramas `WsFrame` (`fin`, `opcode`, `masked`, `mask_key`, `payload`) |\n| `ws text frame / ws ping frame / ws pong frame / ws close frame` | Construtores de tramas de alto nivel e extractores de código de peche (`1000` normal) |\n\n---\n\n## 4. Receitas prácticas en estilo tabular\n\n### Receita 1: Fluxo principal con `ws`\n\nObserva como os signos `=` e os pasos de transformación quedan aliñados coma unha táboa limpa:\n\n```ridgun\nimport ws\n\nfn :: negociar y enviar (client_key : String) => (String, String)\n      negociar y enviar client_key =\n        resp  = ws build upgrade response client_key\n        trama = ws encode frame (ws text frame \"hola-tiempo-real\" False \"\")\n        (resp, trama)\n```\n\n### Receita 2: Composición segura e sen efectos laterais\n\nToda función da lib `ws` é compoñible co resto das 32 libs de `ridgun-libs`:\n\n```ridgun\nimport ws\n\nfn :: decodificar trama cliente (clave4 : String) (msg : String) => String\n      decodificar trama cliente clave4 msg =\n        wire = ws encode frame (ws text frame msg True clave4)\n        res  = ws decode frame wire\n        ws frame payload res\n```\n\n---\n\n## 5. Baixo o capó: rendemento, memoria RMM e garantías\n\n- **Garantía algorítmica e de seguridade**: Coincidencia exacta co vector oficial RFC 6455 (`\"dGhlIHNhbXBsZSBub25jZQ==\"` $\\rightarrow$ `\"s3pPLMBiTxaQ9kYGzzhZRbK+xOo=\"`) e desenmascarado automático en `ws decode frame`.\n- **Memoria determinista (`RMM1`/`RMM2`)**: Cero pausas de colector de lixo; todas as estruturas intermedias libéranse de forma determinista ao saír do ámbito.\n- **Verificación continua**: Probada exhaustivamente con `stable check` e a suite automatizada `src/test/ridgun/test_ws.rg`.\n"}, {"num": "30", "slug": "30-lib-agent-concorrencia-de-actores", "file": "30-lib-agent-concorrencia-de-actores.md", "title": "Capítulo 30: A lib `agent` — Modelo Nativo de Actores (`agent`, `send`, `receive`), KV Store e Rate Limiter", "short_title": "A lib `agent` — Modelo Nativo de Actores (`agent`, `send`, `receive`), KV Store e Rate Limiter", "markdown": "# Capítulo 30: A lib `agent` — Modelo Nativo de Actores (`agent`, `send`, `receive`), KV Store e Rate Limiter\n\n## 1. Por que existe a lib `agent`?\n\nSexamos sinceros: compartir memoria mutable entre fíos con `Mutex`, `RwLock` e variables de condición é unha fábrica inesgotable de *deadlocks* e condicións de carreira.\n\nA lib **`agent`** aproveita o **Modelo Nativo de Axentes** de Ridgun (`agent`, `send ... to`, `receive from`, `try receive from`, `stop`) para ofrecer caixas de correo illadas con paso de mensaxes Copy-on-Write, un almacén chave-valor concorrente (`KvStore`), un limitador de taxa por cubo de tokens (`RateBucket`) e supervisión de estado (`AgentHealth`).\n\n---\n\n## 2. Artefactos, importación e arquitectura sen `libc`\n\nEn `ridgun-libs`, **`agent`** é unha **lib** de primeira clase situada en `src/main/ridgun/lib/agent.rg` (dominio `AGENT`). Ao compilar con `stable bundle`, empaquétase en tres formatos nativos:\n\n| Artefacto | Ruta | Propósito |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/agent.rglib` | Distribución e importación directa con `import agent` |\n| **Ficheiro compilado** | `target/agent.rgc` | Artefacto intermedio verificado por `ridgunc` |\n| **Obxecto compartido ELF64** | `target/libagent.so` | Biblioteca dinámica nativa sen dependencias de C nin `libc` |\n\n> Para usar esta lib en calquera ficheiro `.rg`, abonda con declarar `import agent` na cabeceira e chamar ás súas funcións con espazos ou guións baixos indistintamente.\n\n---\n\n## 3. Referencia rápida da API de `agent`\n\n| Sinatura / Función / Tipo | Que fai e cando usala |\n|---|---|\n| `agent roundtrip / agent drain count` | Lanza actores nativos (`agent`), intercambia mensaxes (`send ... to` / `receive from`) e executa `stop` |\n| `kv store new / kv store apply` | Almacén chave-valor inmutable para actores (`KvPut`, `KvGet`, `KvDelete`, `KvClear`) |\n| `rate bucket new / rate bucket allow` | Limitador de taxa por cubo de tokens que devolve o cubo actualizado e `(allowed, remaining)` |\n| `sup mark failed / sup should restart` | Políticas de supervisión con control de orzamento de reinicios (`max_restarts`) |\n\n---\n\n## 4. Receitas prácticas en estilo tabular\n\n### Receita 1: Fluxo principal con `agent`\n\nObserva como os signos `=` e os pasos de transformación quedan aliñados coma unha táboa limpa:\n\n```ridgun\nimport agent\n\nfn :: probar actor nativo () => (Int, Int)\n      probar actor nativo =\n        eco = agent roundtrip 42\n        vac = agent drain count [10, 20, 30]\n        (eco, vac)\n```\n\n### Receita 2: Composición segura e sen efectos laterais\n\nToda función da lib `agent` é compoñible co resto das 32 libs de `ridgun-libs`:\n\n```ridgun\nimport agent\n\nfn :: aplicar limite peticion () => (Bool, Int)\n      aplicar limite peticion =\n        b0         = rate bucket new 10 2 1000\n        (b1, res1) = rate bucket allow b0 1 1000\n        rateresp allowed res1, rateobs remaining res1\n```\n\n---\n\n## 5. Baixo o capó: rendemento, memoria RMM e garantías\n\n- **Garantía algorítmica e de seguridade**: Cero memoria mutable compartida entre actores: cada mensaxe transfírese por valor / Copy-on-Write e `stop` libera a rexión do axente de forma determinista.\n- **Memoria determinista (`RMM1`/`RMM2`)**: Cero pausas de colector de lixo; todas as estruturas intermedias libéranse de forma determinista ao saír do ámbito.\n- **Verificación continua**: Probada exhaustivamente con `stable check` e a suite automatizada `src/test/ridgun/test_agent.rg`.\n"}, {"num": "31", "slug": "31-lib-pool-traballadores-e-work-stealing", "file": "31-lib-pool-traballadores-e-work-stealing.md", "title": "Capítulo 31: A lib `pool` — Pool Acoutado de Traballadores, Round-Robin e Roubo de Traballo", "short_title": "A lib `pool` — Pool Acoutado de Traballadores, Round-Robin e Roubo de Traballo", "markdown": "# Capítulo 31: A lib `pool` — Pool Acoutado de Traballadores, Round-Robin e Roubo de Traballo\n\n## 1. Por que existe a lib `pool`?\n\nSexamos sinceros: lanzar un fío ou actor novo por cada petición entrante sen límite superior (`unbounded spawning`) fai que un pico de tráfico esgote a memoria en segundos (*Out Of Memory*).\n\nA lib **`pool`** proporciona un despachador de tarefas con **contrapresión explícita** (`PoolAccept`, `PoolRejectFull`), partición equilibrada de lotes en $K$ carrís (`pool partition`), reequilibrio por **roubo de traballo (*work-stealing*)** (`pool steal rebalance`) e execución paralela sobre actores nativos.\n\n---\n\n## 2. Artefactos, importación e arquitectura sen `libc`\n\nEn `ridgun-libs`, **`pool`** é unha **lib** de primeira clase situada en `src/main/ridgun/lib/pool.rg` (dominio `AGENT`). Ao compilar con `stable bundle`, empaquétase en tres formatos nativos:\n\n| Artefacto | Ruta | Propósito |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/pool.rglib` | Distribución e importación directa con `import pool` |\n| **Ficheiro compilado** | `target/pool.rgc` | Artefacto intermedio verificado por `ridgunc` |\n| **Obxecto compartido ELF64** | `target/libpool.so` | Biblioteca dinámica nativa sen dependencias de C nin `libc` |\n\n> Para usar esta lib en calquera ficheiro `.rg`, abonda con declarar `import pool` na cabeceira e chamar ás súas funcións con espazos ou guións baixos indistintamente.\n\n---\n\n## 3. Referencia rápida da API de `pool`\n\n| Sinatura / Función / Tipo | Que fai e cando usala |\n|---|---|\n| `pool new : Int -> Int -> PoolState` | Crea un pool acoutado con `workers` carrís e capacidade máxima `max_queue` |\n| `pool submit : PoolState -> PoolTask -> (PoolState, PoolDecision)` | Enfila unha tarefa en round-robin ou devolve `PoolRejectFull` se está saturado |\n| `pool partition / pool steal rebalance` | Reparte lotes entre $K$ traballadores e rouba a metade dunha fila sobrecargada para un traballador libre |\n| `pool map sum / pool parallel sum2` | Despacha cargas de traballo en paralelo sobre traballadores `agent` nativos |\n\n---\n\n## 4. Receitas prácticas en estilo tabular\n\n### Receita 1: Fluxo principal con `pool`\n\nObserva como os signos `=` e os pasos de transformación quedan aliñados coma unha táboa limpa:\n\n```ridgun\nimport pool\n\nfn :: encolar con contrapresion () => (Int, Int)\n      encolar con contrapresion =\n        p0        = pool new 4 16\n        tarea     = PoolTask 1 100 \"indexar-bloque\"\n        (p1, dec) = pool submit p0 tarea\n        (pool queued p1, pool accepted p1)\n```\n\n### Receita 2: Composición segura e sen efectos laterais\n\nToda función da lib `pool` é compoñible co resto das 32 libs de `ridgun-libs`:\n\n```ridgun\nimport pool\n\nfn :: sumar en paralelo () => Int\n      sumar en paralelo =\n        pool parallel sum2 [10, 20, 30] [40, 50, 60]\n```\n\n---\n\n## 5. Baixo o capó: rendemento, memoria RMM e garantías\n\n- **Garantía algorítmica e de seguridade**: Capacidade de fila estritamente acoutada (`queued <= max_queue`) para protexer a memoria baixo sobrecarga e reparto determinista entre traballadores.\n- **Memoria determinista (`RMM1`/`RMM2`)**: Cero pausas de colector de lixo; todas as estruturas intermedias libéranse de forma determinista ao saír do ámbito.\n- **Verificación continua**: Probada exhaustivamente con `stable check` e a suite automatizada `src/test/ridgun/test_pool.rg`.\n"}, {"num": "32", "slug": "32-lib-net-agent-supervisor-de-conexions", "file": "32-lib-net-agent-supervisor-de-conexions.md", "title": "Capítulo 32: A lib `net_agent` — Supervisor de Conexións de Rede e Ponte de Eventos Non Bloqueante", "short_title": "A lib `net_agent` — Supervisor de Conexións de Rede e Ponte de Eventos Non Bloqueante", "markdown": "# Capítulo 32: A lib `net_agent` — Supervisor de Conexións de Rede e Ponte de Eventos Non Bloqueante\n\n## 1. Por que existe a lib `net_agent`?\n\nSexamos sinceros: nun servidor real coma **Solstice**, aceptar conexións TCP é a parte fácil; o difícil é limitar o máximo de clientes simultáneos, desconectar clientes zombis inactivos (*idle timeout*) e conectar o bucle `ppoll` cos teus actores sen fugas de descritores.\n\nA lib **`net_agent`** pecha o círculo de `ridgun-libs` unindo **`posix`**, **`socket`** e **`agent`**: xestiona táboas de conexións supervisadas (`NetSupervisor`), aplica límites de concorrencia (`max_conns`), purga conexións inactivas (`net evict idle`) e converte eventos de descritores do kernel en eventos tipados (`NetEvReadyRead`, `NetEvReadyWrite`, `NetEvTimeout`, `NetEvError`) ademais de ofrecer un paso de eco TCP completo de extremo a extremo (`net tcp echo step`).\n\n---\n\n## 2. Artefactos, importación e arquitectura sen `libc`\n\nEn `ridgun-libs`, **`net_agent`** é unha **lib** de primeira clase situada en `src/main/ridgun/lib/net_agent.rg` (dominio `AGENT`). Ao compilar con `stable bundle`, empaquétase en tres formatos nativos:\n\n| Artefacto | Ruta | Propósito |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/net_agent.rglib` | Distribución e importación directa con `import net_agent` |\n| **Ficheiro compilado** | `target/net_agent.rgc` | Artefacto intermedio verificado por `ridgunc` |\n| **Obxecto compartido ELF64** | `target/libnet_agent.so` | Biblioteca dinámica nativa sen dependencias de C nin `libc` |\n\n> Para usar esta lib en calquera ficheiro `.rg`, abonda con declarar `import net_agent` na cabeceira e chamar ás súas funcións con espazos ou guións baixos indistintamente.\n\n---\n\n## 3. Referencia rápida da API de `net_agent`\n\n| Sinatura / Función / Tipo | Que fai e cando usala |\n|---|---|\n| `net supervisor new : Int -> Int -> NetSupervisor` | Crea un supervisor de conexións con límite `max_conns` e inactividade `idle_timeout_ms` |\n| `net register conn / net record rx / net record tx / net close conn` | Rexistra sockets aceptados, actualiza contadores de bytes/actividade e pecha pares |\n| `net evict idle : NetSupervisor -> Int -> (NetSupervisor, [Int])` | Pecha e expulsa conexións inactivas máis aló de `idle_timeout_ms`, devolvendo os seus FDs |\n| `net poll fd : Int -> Bool -> Int -> NetEvent` | Ponte `wait fd` non bloqueante que emite `NetEvReadyRead`, `NetEvReadyWrite`, `NetEvTimeout` ou `NetEvError` |\n| `net tcp echo step : String -> Int -> (Int, String)` | Paso completo de extremo a extremo TCP loopback (`listen/connect/accept/supervise/echo`) |\n\n---\n\n## 4. Receitas prácticas en estilo tabular\n\n### Receita 1: Fluxo principal con `net_agent`\n\nObserva como os signos `=` e os pasos de transformación quedan aliñados coma unha táboa limpa:\n\n```ridgun\nimport net_agent\n\nfn :: supervisar clientes () => (Int, [Int])\n      supervisar clientes =\n        s0        = net supervisor new 100 5000\n        (s1, _)   = net register conn s0 10 \"10.0.0.1\" 51000 1000\n        (s2, _)   = net register conn s1 11 \"10.0.0.2\" 51001 6500\n        (s3, exp) = net evict idle s2 7000\n        (net active count s3, exp)\n```\n\n### Receita 2: Composición segura e sen efectos laterais\n\nToda función da lib `net_agent` é compoñible co resto das 32 libs de `ridgun-libs`:\n\n```ridgun\nimport net_agent\n\nfn :: probar puente tcp supervisado () => (Int, String)\n      probar puente tcp supervisado =\n        net tcp echo step \"ping-supervisado\" 1000\n```\n\n---\n\n## 5. Baixo o capó: rendemento, memoria RMM e garantías\n\n- **Garantía algorítmica e de seguridade**: Protección automática fronte a esgotamento de descritores (`max_conns`), expulsión determinista de conexións inactivas e peche garantido de sockets en `net tcp echo step`.\n- **Memoria determinista (`RMM1`/`RMM2`)**: Cero pausas de colector de lixo; todas as estruturas intermedias libéranse de forma determinista ao saír do ámbito.\n- **Verificación continua**: Probada exhaustivamente con `stable check` e a suite automatizada `src/test/ridgun/test_net_agent.rg`.\n"}];
    const UI_STRINGS = {"copy_label": "Copiar", "copied_label": "Copiado!", "prev_label": "&larr; Capítulo anterior", "next_label": "Seguinte capítulo &rarr;", "search_hits_label": "Resultados para", "search_empty_label": "Non se atoparon coincidencias para"};
    let currentIdx = 0;

    function escapeHtml(s) {
      return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function highlightRidgun(code) {
      return code.split("\n").map(line => {
        const comIdx = (() => {
          let inD = false, inS = false;
          for (let i = 0; i < line.length - 1; i++) {
            if (line[i] === "\\") { i++; continue; }
            if (line[i] === '"' && !inS) inD = !inD;
            else if (line[i] === "'" && !inD) inS = !inS;
            else if (!inD && !inS && line[i] === "-" && line[i+1] === "-") return i;
          }
          return -1;
        })();
        const codePart = comIdx >= 0 ? line.slice(0, comIdx) : line;
        const comPart = comIdx >= 0 ? line.slice(comIdx) : "";
        let html = escapeHtml(codePart);
        html = html.replace(/("([^"\\]|\\.)*"|'[^']*')/g, '<span class="rg-str">$1</span>');
        html = html.replace(/\b(fn|op|type|import|mut|otherwise|with|region|timeout|do|global|context|shared|atomic|hardware|echo|and|or|xor|not|agent|send|to|receive|from|try|stop)\b/g, '<span class="rg-kw">$1</span>');
        html = html.replace(/\b(Int|Real|String|Char|Bool|U64|Tensor|Option|Result|Some|None|Ok|Err|OutOfMemory|Timeout|True|False)\b/g, '<span class="rg-ty">$1</span>');
        html = html.replace(/(::|=&gt;|-&gt;|&lt;-|\|\|\.|\|\||\|\.)/g, '<span class="rg-op">$1</span>');
        html = html.replace(/\b(0x[0-9a-fA-F_]+|[0-9][0-9_]*(_KB|_MB|_GB)?(\.[0-9]+)?)\b/g, '<span class="rg-num">$1</span>');
        if (comPart) {
          html += '<span class="rg-com">' + escapeHtml(comPart) + '</span>';
        }
        return html;
      }).join("\n");
    }

    function formatInline(text) {
      let out = escapeHtml(text);
      out = out.replace(/`([^`]+)`/g, "<code>$1</code>");
      out = out.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      out = out.replace(/\*([^*]+)\*/g, "<em>$1</em>");
      out = out.replace(/\$O\(([^)]+)\)\$/g, "<code>O($1)</code>");
      out = out.replace(/\$\\rightarrow\$/g, "&rarr;");
      return out;
    }

    function renderMarkdown(md) {
      const lines = md.split("\n");
      let html = "";
      let i = 0;
      while (i < lines.length) {
        const line = lines[i];
        if (line.startsWith("```")) {
          const lang = line.slice(3).trim() || "ridgun";
          i++;
          const buf = [];
          while (i < lines.length && !lines[i].startsWith("```")) {
            buf.push(lines[i]);
            i++;
          }
          i++;
          const rawCode = buf.join("\n");
          const bodyHtml = (lang === "ridgun" || lang === "") ? highlightRidgun(rawCode) : escapeHtml(rawCode);
          html += `<div class="code-wrapper"><div class="code-header"><span>${escapeHtml(lang)}</span><button class="copy-btn" onclick="copyCode(this)">${escapeHtml(UI_STRINGS.copy_label)}</button></div><pre data-raw="${ encodeURIComponent(rawCode) }"><code>${bodyHtml}</code></pre></div>`;
          continue;
        }
        if (/^---+$/.test(line.trim())) {
          html += "<hr />";
          i++;
          continue;
        }
        if (line.startsWith("# ")) {
          html += `<h1>${formatInline(line.slice(2).trim())}</h1>`;
          i++;
          continue;
        }
        if (line.startsWith("## ")) {
          html += `<h2>${formatInline(line.slice(3).trim())}</h2>`;
          i++;
          continue;
        }
        if (line.startsWith("### ")) {
          html += `<h3>${formatInline(line.slice(4).trim())}</h3>`;
          i++;
          continue;
        }
        if (line.trim().startsWith("|") && i + 1 < lines.length && /^\|[\s:-]+\|/.test(lines[i+1].trim())) {
          const headers = line.trim().slice(1, -1).split("|").map(c => formatInline(c.trim()));
          i += 2;
          const rows = [];
          while (i < lines.length && lines[i].trim().startsWith("|")) {
            rows.push(lines[i].trim().slice(1, -1).split("|").map(c => formatInline(c.trim())));
            i++;
          }
          html += '<div class="table-wrap"><table><thead><tr>' + headers.map(h => `<th>${h}</th>`).join("") + '</tr></thead><tbody>' +
                  rows.map(r => '<tr>' + r.map(c => `<td>${c}</td>`).join("") + '</tr>').join("") + '</tbody></table></div>';
          continue;
        }
        if (line.startsWith(">")) {
          const qLines = [];
          while (i < lines.length && lines[i].startsWith(">")) {
            qLines.push(lines[i].replace(/^>\s?/, ""));
            i++;
          }
          html += `<blockquote><p>${qLines.map(formatInline).join("<br/>")}</p></blockquote>`;
          continue;
        }
        if (/^\s*-\s+/.test(line)) {
          const items = [];
          while (i < lines.length && /^\s*-\s+/.test(lines[i])) {
            items.push(formatInline(lines[i].replace(/^\s*-\s+/, "")));
            i++;
          }
          html += "<ul>" + items.map(it => `<li>${it}</li>`).join("") + "</ul>";
          continue;
        }
        if (/^\s*\d+\.\s+/.test(line)) {
          const items = [];
          while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
            items.push(formatInline(lines[i].replace(/^\s*\d+\.\s+/, "")));
            i++;
          }
          html += "<ol>" + items.map(it => `<li>${it}</li>`).join("") + "</ol>";
          continue;
        }
        if (!line.trim()) {
          i++;
          continue;
        }
        const pLines = [];
        while (i < lines.length && lines[i].trim() && !lines[i].startsWith("#") && !lines[i].startsWith("```") && !lines[i].startsWith(">") && !lines[i].trim().startsWith("|") && !/^---+$/.test(lines[i].trim()) && !/^\s*(-|\d+\.)\s+/.test(lines[i])) {
          pLines.push(formatInline(lines[i]));
          i++;
        }
        html += `<p>${pLines.join(" ")}</p>`;
      }
      return html;
    }

    window.copyCode = function(btn) {
      const pre = btn.closest(".code-wrapper").querySelector("pre");
      const raw = decodeURIComponent(pre.getAttribute("data-raw"));
      navigator.clipboard.writeText(raw);
      const old = btn.textContent;
      btn.textContent = UI_STRINGS.copied_label;
      setTimeout(() => { btn.textContent = old; }, 1400);
    };

    function renderSidebar() {
      const nav = document.getElementById("navList");
      nav.innerHTML = CHAPTERS.map((ch, idx) => `
        <li class="nav-item">
          <button class="nav-btn ${idx === currentIdx ? 'active' : ''}" onclick="selectChapter(${idx})">
            <span class="nav-num">${ch.num}</span>
            <span>${escapeHtml(ch.short_title)}</span>
          </button>
        </li>
      `).join("");
    }

    window.selectChapter = function(idx) {
      currentIdx = idx;
      const ch = CHAPTERS[idx];
      location.hash = ch.slug;
      renderSidebar();
      let pagerHtml = '<div class="pager">';
      if (idx > 0) {
        pagerHtml += `<button class="pager-btn prev" onclick="selectChapter(${idx - 1})"><span class="pager-label">${UI_STRINGS.prev_label}</span><span class="pager-title">${escapeHtml(CHAPTERS[idx - 1].title)}</span></button>`;
      } else {
        pagerHtml += '<div></div>';
      }
      if (idx + 1 < CHAPTERS.length) {
        pagerHtml += `<button class="pager-btn next" onclick="selectChapter(${idx + 1})"><span class="pager-label">${UI_STRINGS.next_label}</span><span class="pager-title">${escapeHtml(CHAPTERS[idx + 1].title)}</span></button>`;
      }
      pagerHtml += '</div>';
      document.getElementById("chapterContent").innerHTML = renderMarkdown(ch.markdown) + pagerHtml;
      window.scrollTo({ top: 0, behavior: "smooth" });
    };

    document.getElementById("searchInput").addEventListener("input", (e) => {
      const q = e.target.value.trim().toLowerCase();
      if (q.length < 2) {
        selectChapter(currentIdx);
        return;
      }
      const hits = [];
      CHAPTERS.forEach((ch, idx) => {
        const lines = ch.markdown.split("\n");
        for (const l of lines) {
          if (l.toLowerCase().includes(q)) {
            hits.push({ idx, title: ch.title, snippet: l.replace(/^[#>*-]+\s*/, "").slice(0, 140) });
            break;
          }
        }
      });
      const box = hits.length
        ? `<div class="search-results"><strong>${escapeHtml(UI_STRINGS.search_hits_label)} "${escapeHtml(q)}" (${hits.length}):</strong>` +
          hits.map(h => `<div class="search-hit" onclick="document.getElementById('searchInput').value=''; selectChapter(${h.idx})"><div class="search-hit-title">${escapeHtml(h.title)}</div><div class="search-hit-snippet">${escapeHtml(h.snippet)}</div></div>`).join("") +
          `</div>`
        : `<div class="search-results">${escapeHtml(UI_STRINGS.search_empty_label)} "${escapeHtml(q)}".</div>`;
      document.getElementById("chapterContent").innerHTML = box + renderMarkdown(CHAPTERS[currentIdx].markdown);
    });

    document.getElementById("themeBtn").addEventListener("click", () => {
      const root = document.documentElement;
      root.setAttribute("data-theme", root.getAttribute("data-theme") === "dark" ? "light" : "dark");
    });

    const initialSlug = location.hash.replace(/^#/, "");
    const foundIdx = CHAPTERS.findIndex(c => c.slug === initialSlug);
    selectChapter(foundIdx >= 0 ? foundIdx : 0);
  </script>
</body>
</html>
