next / prng range` | PRNG congruencial linear funcional puro para testes e simulações reprodutíveis |\n\n---\n\n## 4. Receitas práticas em estilo tabular\n\n### Receita 1: Fluxo principal com `uuid`\n\nRepare como os sinais `=` e os passos de transformação ficam alinhados como uma tabela limpa:\n\n```ridgun\nimport uuid\n\nfn :: generar ids ordenados () => (String, String, Bool)\n      generar ids ordenados =\n        id1 = uuid v7 at 1000\n        id2 = uuid v7 at 2000\n        ok  = (uuid is valid id1) and (id1 < id2)\n        (id1, id2, ok)\n```\n\n### Receita 2: Composição segura e sem efeitos colaterais\n\nTodas as funções da lib `uuid` compõem-se perfeitamente com as restantes 32 libs do `ridgun-libs`:\n\n```ridgun\nimport uuid\n\nfn :: firmar paquete (payload : String) => (String, Int)\n      firmar paquete payload =\n         (crc32 hex payload, fnv1a 32 payload)\n```\n\n---\n\n## 5. Debaixo do capô: desempenho, memória RMM e garantias\n\n- **Garantia algorítmica e de segurança**: `uuid v7 at t1 < uuid v7 at t2` garante ordem lexicográfica monótona crescente ao longo do tempo, ideal para índices `btree` e bases de dados.\n- **Memória determinística (`RMM1`/`RMM2`)**: Zero pausas de coletor de lixo; todas as estruturas intermédias são libertadas de forma determinística à saída do escopo.\n- **Verificação contínua**: Testada exaustivamente com `stable check` e pela suite automatizada `src/test/ridgun/test_uuid.rg`.\n"}, {"num": "20", "slug": "20-lib-log-logging-ndjson-e-redacao", "file": "20-lib-log-logging-ndjson-e-redacao.md", "title": "Capítulo 20: La lib `log` — Logging Estruturado NDJSON e Redação Automática de Segredos", "short_title": "La lib `log` — Logging Estruturado NDJSON e Redação Automática de Segredos", "markdown": "# Capítulo 20: La lib `log` — Logging Estruturado NDJSON e Redação Automática de Segredos\n\n## 1. Por que existe a lib `log`?\n\nSejamos sinceros: despejar os campos de um pedido num ficheiro de log e descobrir semanas depois que guardou `password`, `api_key` ou `authorization` em texto limpo no agregador de logs é um incidente de segurança clássico.\n\nA lib **`log`** fornece filtragem por severidade (`DEBUG`, `INFO`, `WARN`, `ERROR`), formatação em texto humano e **NDJSON estruturado**, e **redação automática de chaves sensíveis** (`password`, `secret`, `token`, `api_key`, `authorization`, `cookie`, `private_key` $\\rightarrow$ `\"[REDACTED]\"`, mitigando `VUL-LOG-001`).\n\n---\n\n## 2. Artefactos, importação e arquitetura sem `libc`\n\nNo `ridgun-libs`, **`log`** é uma **lib** de primeira classe localizada em `src/main/ridgun/lib/log.rg` (domínio `LOG`). Ao compilar com `stable bundle`, é empacotada em três formatos nativos:\n\n| Artefacto | Caminho | Finalidade |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/log.rglib` | Distribuição e importação direta com `import log` |\n| **Ficheiro compilado** | `target/log.rgc` | Artefacto intermédio verificado pelo `ridgunc` |\n| **Objeto partilhado ELF64** | `target/liblog.so` | Biblioteca dinâmica nativa sem dependências de C nem `libc` |\n\n> Para utilizar esta lib em qualquer ficheiro `.rg`, basta declarar `import log` no topo e invocar as suas funções com espaços ou underscores.\n\n---\n\n## 3. Referência rápida da API de `log`\n\n| Assinatura / Função / Tipo | O que faz e quando usar |\n|---|---|\n| `log level rank / log should emit` | Compara níveis (`DEBUG=10`, `INFO=20`, `WARN=30`, `ERROR=40`) face ao limiar configurado |\n| `log is sensitive key / log redact fields` | Substitui valores de chaves secretas por `\"[REDACTED]\"` independentemente de maiúsculas |\n| `log format text / log format json` | Formata linhas de texto `chave=valor` ou NDJSON RFC 8259 com redação automática de segredos |\n\n---\n\n## 4. Receitas práticas em estilo tabular\n\n### Receita 1: Fluxo principal com `log`\n\nRepare como os sinais `=` e os passos de transformação ficam alinhados como uma tabela limpa:\n\n```ridgun\nimport log\n\nfn :: auditar login (usuario : String) (clave : String) => String\n      auditar login usuario clave =\n        campos = [(\"user\", usuario), (\"password\", clave), (\"ip\", \"10.0.0.1\")]\n        log format json \"INFO\" \"intento de acceso\" campos\n```\n\n### Receita 2: Composição segura e sem efeitos colaterais\n\nTodas as funções da lib `log` compõem-se perfeitamente com as restantes 32 libs do `ridgun-libs`:\n\n```ridgun\nimport log\n\nfn :: emitir si procede (umbral : String) (nivel : String) (msg : String) => String\n      emitir si procede umbral nivel msg =\n        | log should emit umbral nivel = log format text nivel msg [(\"service\", \"solstice\")]\n        | otherwise                    = \"\"\n```\n\n---\n\n## 5. Debaixo do capô: desempenho, memória RMM e garantias\n\n- **Garantia algorítmica e de segurança**: Tanto `log format text` como `log format json` passam sempre os campos por `log redact fields` antes de serializar, garantindo que nenhum segredo vaze por esquecimento.\n- **Memória determinística (`RMM1`/`RMM2`)**: Zero pausas de coletor de lixo; todas as estruturas intermédias são libertadas de forma determinística à saída do escopo.\n- **Verificação contínua**: Testada exaustivamente com `stable check` e pela suite automatizada `src/test/ridgun/test_log.rg`.\n"}, {"num": "21", "slug": "21-lib-test-assercoes-unitarias-e-funcionais", "file": "21-lib-test-assercoes-unitarias-e-funcionais.md", "title": "Capítulo 21: A lib `test` — Primitivas de Asserção Unitária e Funcional (`RG-011`)", "short_title": "A lib `test` — Primitivas de Asserção Unitária e Funcional (`RG-011`)", "markdown": "# Capítulo 21: A lib `test` — Primitivas de Asserção Unitária e Funcional (`RG-011`)\n\n## 1. Por que existe a lib `test`?\n\nSejamos sinceros: quando uma framework de testes exige macros mágicas, reflexão em tempo de execução ou um executor externo pesado, escrever testes deixa de ser imediato.\n\nA lib **`test`** (`RG-011`) fornece asserções puras, polimórficas e específicas de tipo que emitem diagnósticos claros `[FAIL]` com os valores esperado e obtido e terminam com código de saída `1`.\n\n---\n\n## 2. Artefactos, importação e arquitetura sem `libc`\n\nNo `ridgun-libs`, **`test`** é uma **lib** de primeira classe localizada em `src/main/ridgun/lib/test.rg` (domínio `TST`). Ao compilar com `stable bundle`, é empacotada em três formatos nativos:\n\n| Artefacto | Caminho | Finalidade |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/test.rglib` | Distribuição e importação direta com `import test` |\n| **Ficheiro compilado** | `target/test.rgc` | Artefacto intermédio verificado pelo `ridgunc` |\n| **Objeto partilhado ELF64** | `target/libtest.so` | Biblioteca dinâmica nativa sem dependências de C nem `libc` |\n\n> Para utilizar esta lib em qualquer ficheiro `.rg`, basta declarar `import test` no topo e invocar as suas funções com espaços ou underscores.\n\n---\n\n## 3. Referência rápida da API de `test`\n\n| Assinatura / Função / Tipo | O que faz e quando usar |\n|---|---|\n| `assert equals / assert eq : A -> A -> String -> ()` | Asserção polimórfica de igualdade com etiqueta descritiva do caso de teste |\n| `assert int equals / assert str eq` | Asserções especializadas de igualdade para `Int` e `String` |\n| `assert true / assert false / assert not` | Asserções de invariantes booleanas (`True` / `False`) |\n| `assert ok : Int -> String -> ()` | Verifica se um código de estado do sistema ou socket é igual a `0` (`OK`) |\n\n---\n\n## 4. Receitas práticas em estilo tabular\n\n### Receita 1: Fluxo principal com `test`\n\nRepare como os sinais `=` e os passos de transformação ficam alinhados como uma tabela limpa:\n\n```ridgun\nimport test\nimport math\n\nfn :: suite matematicas () => ()\n      suite matematicas =\n        _ = assert int equals 12 (math gcd 36 60) \"MCD de 36 y 60\"\n        _ = assert true (math is prime 97) \"97 es primo\"\n        echo \"[PASS] suite matematicas\"\n```\n\n### Receita 2: Composição segura e sem efeitos colaterais\n\nTodas as funções da lib `test` compõem-se perfeitamente com as restantes 32 libs do `ridgun-libs`:\n\n```ridgun\nimport test\n\nfn :: verificar codigo sistema (rc : Int) => ()\n      verificar codigo sistema rc =\n        assert ok rc \"operacion de descriptor exitosa\"\n```\n\n---\n\n## 5. Debaixo do capô: desempenho, memória RMM e garantias\n\n- **Garantia algorítmica e de segurança**: Todas as 30 suites de testes do `ridgun-libs` (`src/test/ridgun/test_*.rg`, mais de 4 000 linhas) são executadas com esta mesma lib através de `stable test`.\n- **Memória determinística (`RMM1`/`RMM2`)**: Zero pausas de coletor de lixo; todas as estruturas intermédias são libertadas de forma determinística à saída do escopo.\n- **Verificação contínua**: Testada exaustivamente com `stable check` e pela suite automatizada `src/test/ridgun/test_test.rg`.\n"}, {"num": "22", "slug": "22-lib-posix-camada-pal-relogios-e-sinais", "file": "22-lib-posix-camada-pal-relogios-e-sinais.md", "title": "Capítulo 22: A lib `posix` — Camada de Abstração de Plataforma (PAL), Relógios, Sinais e CSPRNG", "short_title": "A lib `posix` — Camada de Abstração de Plataforma (PAL), Relógios, Sinais e CSPRNG", "markdown": "# Capítulo 22: A lib `posix` — Camada de Abstração de Plataforma (PAL), Relógios, Sinais e CSPRNG\n\n## 1. Por que existe a lib `posix`?\n\nSejamos sinceros: flags como `O_CREAT`, `O_NONBLOCK` ou números de syscall mudam entre Linux, macOS e arquiteturas (`X86_64` vs `Arm64`), e em C tudo se resolve com uma selva ilegível de `#ifdef`.\n\nA lib **`posix`** implementa a **Camada de Abstração de Plataforma (PAL)** de 2 níveis do Ridgun usando guardas tabulares sobre `sys os` (`Linux | MacOS | Windows`) e `sys arch` (`X86_64 | Arm64 | RiscV64`), além de sondagem de descritores (`wait fd`), relógios monotónicos (`RGF-017`), sinais (`RGF-018`) e entropia CSPRNG do kernel (`sys random bytes`).\n\n---\n\n## 2. Artefactos, importação e arquitetura sem `libc`\n\nNo `ridgun-libs`, **`posix`** é uma **lib** de primeira classe localizada em `src/main/ridgun/lib/posix.rg` (domínio `POSIX`). Ao compilar com `stable bundle`, é empacotada em três formatos nativos:\n\n| Artefacto | Caminho | Finalidade |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/posix.rglib` | Distribuição e importação direta com `import posix` |\n| **Ficheiro compilado** | `target/posix.rgc` | Artefacto intermédio verificado pelo `ridgunc` |\n| **Objeto partilhado ELF64** | `target/libposix.so` | Biblioteca dinâmica nativa sem dependências de C nem `libc` |\n\n> Para utilizar esta lib em qualquer ficheiro `.rg`, basta declarar `import posix` no topo e invocar as suas funções com espaços ou underscores.\n\n---\n\n## 3. Referência rápida da API de `posix`\n\n| Assinatura / Função / Tipo | O que faz e quando usar |\n|---|---|\n| `pal open create trunc wr / pal o nonblock` | Tradução de flags do SO conforme `sys os` (`Linux | MacOS | Windows`) |\n| `wait fd : Int -> Int -> Int -> PollStatus` | Sonda um descritor devolvendo `PollReady`, `PollTimeout` ou `PollError errno` |\n| `clock monotonic ms / clock monotonic ns / clock wall ms` | Relógios monotónicos e relógio de parede UTC em milissegundos (`RGF-017`) |\n| `signal watch / signal poll / sys random bytes` | Sondagem não bloqueante de sinais (`SIGINT`, `SIGTERM`) e bytes CSPRNG do kernel |\n| `read text / write text / file exists / run cmd` | E/S de ficheiros de alto nível, diretórios e execução de subprocessos |\n\n---\n\n## 4. Receitas práticas em estilo tabular\n\n### Receita 1: Fluxo principal com `posix`\n\nRepare como os sinais `=` e os passos de transformação ficam alinhados como uma tabela limpa:\n\n```ridgun\nimport posix\n\nfn :: medir operacion () => (Int, Int)\n      medir operacion =\n        t0  = clock monotonic ms\n        rnd = len (sys random bytes 32)\n        t1  = clock monotonic ms\n        (rnd, t1 - t0)\n```\n\n### Receita 2: Composição segura e sem efeitos colaterais\n\nTodas as funções da lib `posix` compõem-se perfeitamente com as restantes 32 libs do `ridgun-libs`:\n\n```ridgun\nimport posix\n\nfn :: esperar lectura (fd : Int) => Bool\n      esperar lectura fd =\n        est = wait fd fd poll_in 100\n        est == PollReady\n```\n\n---\n\n## 5. Debaixo do capô: desempenho, memória RMM e garantias\n\n- **Garantia algorítmica e de segurança**: Os ramos de `sys os` e `sys arch` que não correspondem ao binário alvo são eliminados em tempo de compilação (Dead-Code Elimination) pelo `ridgunc`.\n- **Memória determinística (`RMM1`/`RMM2`)**: Zero pausas de coletor de lixo; todas as estruturas intermédias são libertadas de forma determinística à saída do escopo.\n- **Verificação contínua**: Testada exaustivamente com `stable check` e pela suite automatizada `src/test/ridgun/test_posix.rg`.\n"}, {"num": "23", "slug": "23-lib-io-entrada-saida-com-timeout", "file": "23-lib-io-entrada-saida-com-timeout.md", "title": "Capítulo 23: A lib `io` — Erros Tipados `IoResult`, E/S com `with timeout` e Processos", "short_title": "A lib `io` — Erros Tipados `IoResult`, E/S com `with timeout` e Processos", "markdown": "# Capítulo 23: A lib `io` — Erros Tipados `IoResult`, E/S com `with timeout` e Processos\n\n## 1. Por que existe a lib `io`?\n\nSejamos sinceros: uma chamada `read()` ou um subprocesso filho sem prazo limite (`timeout`) é um convite para que um único recurso pendurado esgote todos os trabalhadores do seu servidor.\n\nA lib **`io`** modela cada operação do sistema com ADTs explícitos (`IoError`, `IoResult[A]`), combina `ppoll` não bloqueante com quotas léxicas `with timeout wait_ms do` do Ridgun e oferece os operadores mixfix `read fd ... timeout` e `write fd ... timeout`.\n\n---\n\n## 2. Artefactos, importação e arquitetura sem `libc`\n\nNo `ridgun-libs`, **`io`** é uma **lib** de primeira classe localizada em `src/main/ridgun/lib/io.rg` (domínio `IO`). Ao compilar com `stable bundle`, é empacotada em três formatos nativos:\n\n| Artefacto | Caminho | Finalidade |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/io.rglib` | Distribuição e importação direta com `import io` |\n| **Ficheiro compilado** | `target/io.rgc` | Artefacto intermédio verificado pelo `ridgunc` |\n| **Objeto partilhado ELF64** | `target/libio.so` | Biblioteca dinâmica nativa sem dependências de C nem `libc` |\n\n> Para utilizar esta lib em qualquer ficheiro `.rg`, basta declarar `import io` no topo e invocar as suas funções com espaços ou underscores.\n\n---\n\n## 3. Referência rápida da API de `io`\n\n| Assinatura / Função / Tipo | O que faz e quando usar |\n|---|---|\n| `type IoError / type IoResult[A]` | `IoNotFound | IoPermission | IoTimeout | IoRefused | IoReset | IoEOF | IoInvalid | IoSysError` |\n| `io read with timeout / io write with timeout` | Leitura/escrita não bloqueante de descritor limitada por `wait_ms` |\n| `read fd N max M timeout T / write fd N data S timeout T` | Operadores mixfix ergonómicos (`op ::`) para E/S de descritor com prazo limite |\n| `io read file / io write file / io read lines` | Funções seguras de ficheiros e fluxos de linhas que devolvem `IoResult` |\n| `exec with timeout : String -> Int -> IoResult[ProcStatus]` | Executa um comando externo limitado por uma quota léxica `with timeout` |\n\n---\n\n## 4. Receitas práticas em estilo tabular\n\n### Receita 1: Fluxo principal com `io`\n\nRepare como os sinais `=` e os passos de transformação ficam alinhados como uma tabela limpa:\n\n```ridgun\nimport io\n\nfn :: leer peticion segura (fd : Int) => String\n      leer peticion segura fd =\n        res = read fd fd max 4096 timeout 250\n        io unwrap or res \"\"\n```\n\n### Receita 2: Composição segura e sem efeitos colaterais\n\nTodas as funções da lib `io` compõem-se perfeitamente com as restantes 32 libs do `ridgun-libs`:\n\n```ridgun\nimport io\n\nfn :: describir fallo () => String\n      describir fallo =\n        format io error (IoTimeout \"read\" 250)\n```\n\n---\n\n## 5. Debaixo do capô: desempenho, memória RMM e garantias\n\n- **Garantia algorítmica e de segurança**: Nenhuma leitura, escrita ou comando executado através de `io` com quota `wait_ms` pode bloquear indefinidamente a thread ou ator chamador.\n- **Memória determinística (`RMM1`/`RMM2`)**: Zero pausas de coletor de lixo; todas as estruturas intermédias são libertadas de forma determinística à saída do escopo.\n- **Verificação contínua**: Testada exaustivamente com `stable check` e pela suite automatizada `src/test/ridgun/test_io.rg`.\n"}, {"num": "24", "slug": "24-lib-crypto-sha256-hmac-pbkdf2-e-aead", "file": "24-lib-crypto-sha256-hmac-pbkdf2-e-aead.md", "title": "Capítulo 24: A lib `crypto` — SHA-256, HMAC, PBKDF2, Argon2id e ChaCha20-Poly1305 AEAD", "short_title": "A lib `crypto` — SHA-256, HMAC, PBKDF2, Argon2id e ChaCha20-Poly1305 AEAD", "markdown": "# Capítulo 24: A lib `crypto` — SHA-256, HMAC, PBKDF2, Argon2id e ChaCha20-Poly1305 AEAD\n\n## 1. Por que existe a lib `crypto`?\n\nSejamos sinceros: comparar um HMAC com `==` abre a porta a ataques de temporização (*timing attacks*), e depender da `libssl.so` para calcular um `SHA-256` ou cifrar com `ChaCha20-Poly1305` destrói a portabilidade do seu binário.\n\nA lib **`crypto`** implementa a 100 % em Ridgun puro sobre `Tensor[Int]` pré-alocado: operações de bytes/bits (`RGF-019`), **FIPS 180-4 SHA-256**, **RFC 2104 HMAC-SHA-256**, igualdade em tempo constante (`ct equal`), **RFC 8018 PBKDF2-HMAC-SHA-256** com pré-computação de estado intermédio, fachada **Argon2id** de 5 argumentos e cifra autenticada **RFC 8439 ChaCha20-Poly1305 AEAD** (`aead seal` / `aead open`).\n\n---\n\n## 2. Artefactos, importação e arquitetura sem `libc`\n\nNo `ridgun-libs`, **`crypto`** é uma **lib** de primeira classe localizada em `src/main/ridgun/lib/crypto.rg` (domínio `CRYPTO`). Ao compilar com `stable bundle`, é empacotada em três formatos nativos:\n\n| Artefacto | Caminho | Finalidade |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/crypto.rglib` | Distribuição e importação direta com `import crypto` |\n| **Ficheiro compilado** | `target/crypto.rgc` | Artefacto intermédio verificado pelo `ridgunc` |\n| **Objeto partilhado ELF64** | `target/libcrypto.so` | Biblioteca dinâmica nativa sem dependências de C nem `libc` |\n\n> Para utilizar esta lib em qualquer ficheiro `.rg`, basta declarar `import crypto` no topo e invocar as suas funções com espaços ou underscores.\n\n---\n\n## 3. Referência rápida da API de `crypto`\n\n| Assinatura / Função / Tipo | O que faz e quando usar |\n|---|---|\n| `sha256 bytes / sha256 hex` | Resumo binário de 32 bytes ou hexadecimal de 64 caracteres FIPS 180-4 SHA-256 |\n| `hmac sha256 / hmac sha256 hex / ct equal` | MAC com chave RFC 2104 e comparação por acumulador em tempo constante |\n| `pbkdf2 hmac sha256 : String -> String -> Int -> Int -> String` | Derivação de chaves RFC 8018 com estados intermédios SHA-256 pré-computados |\n| `argon2id hash / argon2id verify` | Hashing de palavras-passe PHC RFC 9106 de 5 argumentos e verificação em tempo constante |\n| `aead seal / aead open` | Cifra autenticada RFC 8439 ChaCha20-Poly1305 e decifra com verificação de tag |\n\n---\n\n## 4. Receitas práticas em estilo tabular\n\n### Receita 1: Fluxo principal com `crypto`\n\nRepare como os sinais `=` e os passos de transformação ficam alinhados como uma tabela limpa:\n\n```ridgun\nimport crypto\n\nfn :: cifrar mensaje sesion (secreto : String) (texto : String) => (Int, String)\n      cifrar mensaje sesion secreto texto =\n        key32   = sha256 bytes secreto\n        nonce12 = \"0123456789ab\"\n        aad     = \"canal-autenticado\"\n        sellado = aead seal key32 nonce12 aad texto\n        aead open key32 nonce12 aad sellado\n```\n\n### Receita 2: Composição segura e sem efeitos colaterais\n\nTodas as funções da lib `crypto` compõem-se perfeitamente com as restantes 32 libs do `ridgun-libs`:\n\n```ridgun\nimport crypto\n\nfn :: verificar firma webhook (clave : String) (cuerpo : String) (firma_hex : String) => Bool\n      verificar firma webhook clave cuerpo firma_hex =\n        esperada = hmac sha256 hex clave cuerpo\n        ct equal esperada firma_hex\n```\n\n---\n\n## 5. Debaixo do capô: desempenho, memória RMM e garantias\n\n- **Garantia algorítmica e de segurança**: `aead open` verifica a tag Poly1305 de 16 bytes em tempo constante antes de libertar um único byte de texto limpo (devolvendo `(-1, \"\")` em caso de adulteração).\n- **Memória determinística (`RMM1`/`RMM2`)**: Zero pausas de coletor de lixo; todas as estruturas intermédias são libertadas de forma determinística à saída do escopo.\n- **Verificação contínua**: Testada exaustivamente com `stable check` e pela suite automatizada `src/test/ridgun/test_crypto.rg`.\n"}, {"num": "25", "slug": "25-lib-argon2id-hashing-rfc9106-e-owasp", "file": "25-lib-argon2id-hashing-rfc9106-e-owasp.md", "title": "Capítulo 25: A lib `argon2id` — RFC 9106 Argon2id sobre `Tensor[U64 * 8 * 16]`, Blake2b e Presets OWASP", "short_title": "A lib `argon2id` — RFC 9106 Argon2id sobre `Tensor[U64 * 8 * 16]`, Blake2b e Presets OWASP", "markdown": "# Capítulo 25: A lib `argon2id` — RFC 9106 Argon2id sobre `Tensor[U64 * 8 * 16]`, Blake2b e Presets OWASP\n\n## 1. Por que existe a lib `argon2id`?\n\nSejamos sinceros: guardar palavras-passe com um simples SHA-256 permite que uma GPU moderna teste milhares de milhões de combinações por segundo, mas ligar bibliotecas C externas para ter Argon2id traz dores de cabeça de compilação.\n\nA lib **`argon2id`** implementa **RFC 9106 Argon2id** e **RFC 7693 Blake2b-512** a 100 % em Ridgun puro operando diretamente sobre blocos nativos `Tensor[U64 * 8 * 16]` (1 024 bytes por bloco em memória contígua RMM2), com geração de cadeias **PHC** (`$argon2id$v=19$m=...,t=...,p=...$`), perfis **OWASP** (`owaspfirst`, `owaspsecond`), suporte de *pepper* (`argon2id hash ctx`), derivação de chaves (`argon2id derive key`) e deteção de atualização de parâmetros (`argon2id needs rehash`).\n\n---\n\n## 2. Artefactos, importação e arquitetura sem `libc`\n\nNo `ridgun-libs`, **`argon2id`** é uma **lib** de primeira classe localizada em `src/main/ridgun/lib/argon2id.rg` (domínio `CRYPTO`). Ao compilar com `stable bundle`, é empacotada em três formatos nativos:\n\n| Artefacto | Caminho | Finalidade |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/argon2id.rglib` | Distribuição e importação direta com `import argon2id` |\n| **Ficheiro compilado** | `target/argon2id.rgc` | Artefacto intermédio verificado pelo `ridgunc` |\n| **Objeto partilhado ELF64** | `target/libargon2id.so` | Biblioteca dinâmica nativa sem dependências de C nem `libc` |\n\n> Para utilizar esta lib em qualquer ficheiro `.rg`, basta declarar `import argon2id` no topo e invocar as suas funções com espaços ou underscores.\n\n---\n\n## 3. Referência rápida da API de `argon2id`\n\n| Assinatura / Função / Tipo | O que faz e quando usar |\n|---|---|\n| `argon2id hash / argon2id verify` | Hashing PHC RFC 9106 de 6 argumentos (`pwd, salt, m_kib, t, p, tag_len`) e verificação em tempo constante |\n| `argon2id hash with preset / argon2id params preset` | Perfis nomeados: `\"interactive\"`, `\"owaspfirst\"` (`19456 KiB, t=2`), `\"owaspsecond\"` (`47104 KiB, t=1`), `\"moderate\"`, `\"sensitive\"` |\n| `argon2id hash ctx / argon2id verify ctx` | Hashing RFC 9106 com segredo `pepper` ($K$) e dados associados ($X$) |\n| `argon2id derive key / argon2id needs rehash` | Derivação de chave binária bruta e deteção de necessidade de rehash em cadeias PHC |\n| `blake2b / blake2b hex` | Resumo criptográfico de uso geral RFC 7693 Blake2b (`1..64` bytes) |\n\n---\n\n## 4. Receitas práticas em estilo tabular\n\n### Receita 1: Fluxo principal com `argon2id`\n\nRepare como os sinais `=` e os passos de transformação ficam alinhados como uma tabela limpa:\n\n```ridgun\nimport argon2id\n\nfn :: proteger clave usuario (clave : String) => (String, Bool, Bool)\n      proteger clave usuario clave =\n        phc    = argon2id hash clave \"sal-unica-16byte\" 32 2 1 32\n        valido = argon2id verify clave phc\n        rehash = argon2id needs rehash phc 19456 2 1 32\n        (phc, valido, rehash)\n```\n\n### Receita 2: Composição segura e sem efeitos colaterais\n\nTodas as funções da lib `argon2id` compõem-se perfeitamente com as restantes 32 libs do `ridgun-libs`:\n\n```ridgun\nimport argon2id\n\nfn :: derivar clave maestra (frase : String) (sal : String) => String\n      derivar clave maestra frase sal =\n        -- Deriva 32 bytes crudos listos para ChaCha20-Poly1305 AEAD\n        argon2id derive key frase sal 64 2 1 32\n```\n\n---\n\n## 5. Debaixo do capô: desempenho, memória RMM e garantias\n\n- **Garantia algorítmica e de segurança**: Correspondência byte a byte com os vetores oficiais RFC 9106 §5.3 e OpenSSL 3.5, operando sobre `Tensor[U64 * 8 * 16]` sem uma única linha de C.\n- **Memória determinística (`RMM1`/`RMM2`)**: Zero pausas de coletor de lixo; todas as estruturas intermédias são libertadas de forma determinística à saída do escopo.\n- **Verificação contínua**: Testada exaustivamente com `stable check` e pela suite automatizada `src/test/ridgun/test_argon2id.rg`.\n"}, {"num": "26", "slug": "26-lib-jwt-tokens-rfc7519-e-aead", "file": "26-lib-jwt-tokens-rfc7519-e-aead.md", "title": "Capítulo 26: A lib `jwt` — JSON Web Tokens RFC 7519 (`HS256`) e Tokens Cifrados ChaCha20-Poly1305", "short_title": "A lib `jwt` — JSON Web Tokens RFC 7519 (`HS256`) e Tokens Cifrados ChaCha20-Poly1305", "markdown": "# Capítulo 26: A lib `jwt` — JSON Web Tokens RFC 7519 (`HS256`) e Tokens Cifrados ChaCha20-Poly1305\n\n## 1. Por que existe a lib `jwt`?\n\nSejamos sinceros: o ecossistema JWT é famoso por vulnerabilidades onde um atacante muda o cabeçalho para `\"alg\":\"none\"` e o servidor aceita o token sem assinatura, ou onde se guarda informação confidencial esquecendo que o payload apenas está em Base64url, não cifrado.\n\nA lib **`jwt`** resolve ambos os mundos: assina e verifica **JWTs RFC 7519 (`HS256`)** exigindo explicitamente `alg == \"HS256\"`, comparando o HMAC em tempo constante e validando `exp`/`nbf`, e oferece ainda **`token seal` / `token open`** para emitir tokens opacos cifrados com **ChaCha20-Poly1305 AEAD**.\n\n---\n\n## 2. Artefactos, importação e arquitetura sem `libc`\n\nNo `ridgun-libs`, **`jwt`** é uma **lib** de primeira classe localizada em `src/main/ridgun/lib/jwt.rg` (domínio `JWT`). Ao compilar com `stable bundle`, é empacotada em três formatos nativos:\n\n| Artefacto | Caminho | Finalidade |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/jwt.rglib` | Distribuição e importação direta com `import jwt` |\n| **Ficheiro compilado** | `target/jwt.rgc` | Artefacto intermédio verificado pelo `ridgunc` |\n| **Objeto partilhado ELF64** | `target/libjwt.so` | Biblioteca dinâmica nativa sem dependências de C nem `libc` |\n\n> Para utilizar esta lib em qualquer ficheiro `.rg`, basta declarar `import jwt` no topo e invocar as suas funções com espaços ou underscores.\n\n---\n\n## 3. Referência rápida da API de `jwt`\n\n| Assinatura / Função / Tipo | O que faz e quando usar |\n|---|---|\n| `type JwtResult` | `JwtOk JsonVal | JwtExpired | JwtNotYetValid | JwtBadSignature | JwtMalformed` |\n| `jwt sign hs256 / jwt verify hs256` | Assina claims `JsonVal` e verifica assinatura + `alg == \"HS256\"` + janelas `exp`/`nbf` |\n| `jwt claims / jwt get str / jwt get int` | Constrói claims padrão `(sub, iss, iat, exp)` e consulta payloads verificados |\n| `token seal / token open` | Cifra e autentica tokens JSON opacos através de ChaCha20-Poly1305 AEAD |\n\n---\n\n## 4. Receitas práticas em estilo tabular\n\n### Receita 1: Fluxo principal com `jwt`\n\nRepare como os sinais `=` e os passos de transformação ficam alinhados como uma tabela limpa:\n\n```ridgun\nimport jwt\nimport json\n\nfn :: emitir y verificar sesion (secreto : String) => (String, String)\n      emitir y verificar sesion secreto =\n        claims = jwt claims \"user-42\" \"solstice\" 1700000000 1700003600\n        tok    = jwt sign hs256 secreto claims\n        res    = jwt verify hs256 secreto tok 1700001000\n        sub    = jwt get str res \"sub\" \"anonimo\"\n        (tok, sub)\n```\n\n### Receita 2: Composição segura e sem efeitos colaterais\n\nTodas as funções da lib `jwt` compõem-se perfeitamente com as restantes 32 libs do `ridgun-libs`:\n\n```ridgun\nimport jwt\nimport json\n\nfn :: sellar token confidencial (clave : String) => JwtResult\n      sellar token confidencial clave =\n        datos = JnObj [(\"rol\", JnStr \"root\"), (\"pin\", JnInt 9988)]\n        sobre = token seal clave \"nonce-12byte\" datos\n        token open clave sobre\n```\n\n---\n\n## 5. Debaixo do capô: desempenho, memória RMM e garantias\n\n- **Garantia algorítmica e de segurança**: Imunidade total ao ataque `\"alg\":\"none\"` (qualquer cabeçalho cujo `alg` não seja exatamente `\"HS256\"` devolve `JwtBadSignature`) e comparação de assinatura em tempo constante.\n- **Memória determinística (`RMM1`/`RMM2`)**: Zero pausas de coletor de lixo; todas as estruturas intermédias são libertadas de forma determinística à saída do escopo.\n- **Verificação contínua**: Testada exaustivamente com `stable check` e pela suite automatizada `src/test/ridgun/test_jwt.rg`.\n"}, {"num": "27", "slug": "27-lib-socket-redes-dns-e-kernel-sockets", "file": "27-lib-socket-redes-dns-e-kernel-sockets.md", "title": "Capítulo 27: A lib `socket` — TCP, UDP, AF_UNIX, Framing, DNS RFC 1035 e Kernel Sockets (`RGF-001`)", "short_title": "A lib `socket` — TCP, UDP, AF_UNIX, Framing, DNS RFC 1035 e Kernel Sockets (`RGF-001`)", "markdown": "# Capítulo 27: A lib `socket` — TCP, UDP, AF_UNIX, Framing, DNS RFC 1035 e Kernel Sockets (`RGF-001`)\n\n## 1. Por que existe a lib `socket`?\n\nSejamos sinceros: programar sockets BSD em C com `struct sockaddr_in`, `htons`, `inet_pton` e `getaddrinfo` (que ainda por cima arrasta a `libnss` da `glibc`) é um ritual arcano dos anos 80.\n\nA lib **`socket`** oferece duas camadas complementares sem uma linha de C: (1) a API de descritores do kernel **`RGF-001`** para servidores de produção como o **Solstice** (`sys tcp listen`, `sys tcp listen reuseport`, `sys accept`, `sys tcp connect`, `sys send`, `sys recv`, `sys resolve ipv4` via `/etc/hosts` + pacotes DNS UDP RFC 1035 na porta 53) e (2) a máquina de estados funcional imutável `Socket` com framing por comprimento, linhas CRLF e sub-redes CIDR.\n\n---\n\n## 2. Artefactos, importação e arquitetura sem `libc`\n\nNo `ridgun-libs`, **`socket`** é uma **lib** de primeira classe localizada em `src/main/ridgun/lib/socket.rg` (domínio `SOCK`). Ao compilar com `stable bundle`, é empacotada em três formatos nativos:\n\n| Artefacto | Caminho | Finalidade |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/socket.rglib` | Distribuição e importação direta com `import socket` |\n| **Ficheiro compilado** | `target/socket.rgc` | Artefacto intermédio verificado pelo `ridgunc` |\n| **Objeto partilhado ELF64** | `target/libsocket.so` | Biblioteca dinâmica nativa sem dependências de C nem `libc` |\n\n> Para utilizar esta lib em qualquer ficheiro `.rg`, basta declarar `import socket` no topo e invocar as suas funções com espaços ou underscores.\n\n---\n\n## 3. Referência rápida da API de `socket`\n\n| Assinatura / Função / Tipo | O que faz e quando usar |\n|---|---|\n| `sys tcp listen / sys tcp listen reuseport / sys unix listen` | Associa e escuta em TCP IPv4 (`SO_REUSEADDR` / `SO_REUSEPORT`) ou `AF_UNIX` |\n| `sys accept / sys tcp connect / sys unix connect` | `accept` e `connect` limitados por timeout devolvendo `SockFdResult` / `SockAcceptResult` |\n| `sys send / sys recv / sys shutdown write` | Envio, receção e fecho de escrita (`SHUT_WR`) de socket com timeout |\n| `sys resolve ipv4 / dns resolve a` | Resolução IPv4 pura em Ridgun via `/etc/hosts` e consultas DNS UDP RFC 1035 |\n| `sock send frame / sock recv frame / ipv4 in cidr` | Framing prefixado por comprimento (`N:payload`) e correspondência de sub-redes CIDR IPv4 |\n\n---\n\n## 4. Receitas práticas em estilo tabular\n\n### Receita 1: Fluxo principal com `socket`\n\nRepare como os sinais `=` e os passos de transformação ficam alinhados como uma tabela limpa:\n\n```ridgun\nimport socket\n\nfn :: eco tcp local () => String\n      eco tcp local =\n        l_res = sys tcp listen \"127.0.0.1\" 0 16\n        lfd   = sock fd l_res\n        port  = sys local port lfd\n        c_res = sys tcp connect \"127.0.0.1\" port 1000\n        cfd   = sock fd c_res\n        a_res = sys accept lfd 1000\n        sfd   = sock accept fd a_res\n        _     = sys send cfd \"hola-solstice\" 1000\n        r_res = sys recv sfd 64 1000\n        datos = sock recv data r_res\n        _     = sys_close cfd\n        _     = sys_close sfd\n        _     = sys_close lfd\n        datos\n```\n\n### Receita 2: Composição segura e sem efeitos colaterais\n\nTodas as funções da lib `socket` compõem-se perfeitamente com as restantes 32 libs do `ridgun-libs`:\n\n```ridgun\nimport socket\n\nfn :: verificar ip interna (ip : String) => Bool\n      verificar ip interna ip =\n        ipv4 in cidr ip \"10.0.0.0/8\"\n```\n\n---\n\n## 5. Debaixo do capô: desempenho, memória RMM e garantias\n\n- **Garantia algorítmica e de segurança**: Atualização de registos com sintaxe imutável `s with field = val`, resolução DNS sem `glibc`/`libnss` e códigos de estado determinísticos (`0` OK, `-1` EOF, `-2` TIMEOUT, `-3` REFUSED).\n- **Memória determinística (`RMM1`/`RMM2`)**: Zero pausas de coletor de lixo; todas as estruturas intermédias são libertadas de forma determinística à saída do escopo.\n- **Verificação contínua**: Testada exaustivamente com `stable check` e pela suite automatizada `src/test/ridgun/test_socket.rg`.\n"}, {"num": "28", "slug": "28-lib-http-uris-http11-e-cliente-tcp", "file": "28-lib-http-uris-http11-e-cliente-tcp.md", "title": "Capítulo 28: A lib `http` — URIs RFC 3986, Codec HTTP/1.1 RFC 9112 e Cliente TCP ao Vivo", "short_title": "A lib `http` — URIs RFC 3986, Codec HTTP/1.1 RFC 9112 e Cliente TCP ao Vivo", "markdown": "# Capítulo 28: A lib `http` — URIs RFC 3986, Codec HTTP/1.1 RFC 9112 e Cliente TCP ao Vivo\n\n## 1. Por que existe a lib `http`?\n\nSejamos sinceros: se não filtrar quebras `\\r\\n` nos valores dos cabeçalhos HTTP, um atacante pode injetar cabeçalhos falsos (*CRLF Response Splitting*), e ligar a `libcurl` apenas para fazer um `GET` ou `POST` é um exagero.\n\nA lib **`http`** implementa decomposição de **URIs RFC 3986**, construção e análise de pedidos e respostas **HTTP/1.1 RFC 9112** com higienização automática de CRLF (`VUL-INJ-002`) e `Content-Length` automático, extração de tokens `Bearer` e um **cliente HTTP/1.1 ao vivo sobre sockets TCP do kernel** (`http get`, `http post`, `http request tcp`).\n\n---\n\n## 2. Artefactos, importação e arquitetura sem `libc`\n\nNo `ridgun-libs`, **`http`** é uma **lib** de primeira classe localizada em `src/main/ridgun/lib/http.rg` (domínio `HTTP`). Ao compilar com `stable bundle`, é empacotada em três formatos nativos:\n\n| Artefacto | Caminho | Finalidade |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/http.rglib` | Distribuição e importação direta com `import http` |\n| **Ficheiro compilado** | `target/http.rgc` | Artefacto intermédio verificado pelo `ridgunc` |\n| **Objeto partilhado ELF64** | `target/libhttp.so` | Biblioteca dinâmica nativa sem dependências de C nem `libc` |\n\n> Para utilizar esta lib em qualquer ficheiro `.rg`, basta declarar `import http` no topo e invocar as suas funções com espaços ou underscores.\n\n---\n\n## 3. Referência rápida da API de `http`\n\n| Assinatura / Função / Tipo | O que faz e quando usar |\n|---|---|\n| `uri parse / uri scheme / uri host / uri port / uri path / uri query` | Decompõe URIs RFC 3986 com portas padrão automáticas (`80` em `http`, `443` em `https`) |\n| `http build request / http parse request` | Formata e analisa pedidos HTTP/1.1 com higienização CRLF de cabeçalhos |\n| `http build response / http parse response` | Formata e analisa respostas HTTP/1.1 com frases de estado padrão |\n| `http header get / http bearer token` | Pesquisa de cabeçalhos insensível a maiúsculas e extração de `Authorization: Bearer <token>` |\n| `http get / http post / http request tcp` | Executa chamadas HTTP/1.1 ao vivo sobre sockets TCP do kernel com `timeout_ms` |\n\n---\n\n## 4. Receitas práticas em estilo tabular\n\n### Receita 1: Fluxo principal com `http`\n\nRepare como os sinais `=` e os passos de transformação ficam alinhados como uma tabela limpa:\n\n```ridgun\nimport http\n\nfn :: inspeccionar endpoint (url : String) => (String, Int, String, String)\n      inspeccionar endpoint url =\n        host = uri host url\n        port = uri port url\n        path = uri path url\n        wire = http build request \"GET\" path [(\"Host\", host)] \"\"\n        (host, port, path, wire)\n```\n\n### Receita 2: Composição segura e sem efeitos colaterais\n\nTodas as funções da lib `http` compõem-se perfeitamente com as restantes 32 libs do `ridgun-libs`:\n\n```ridgun\nimport http\n\nfn :: extraer credenciales (raw_req : String) => (String, String)\n      extraer credenciales raw_req =\n        (metodo, ruta, _, hdrs_raw, _) = http parse request raw_req\n        hdrs = http parse headers hdrs_raw\n        tok  = http bearer token hdrs\n        (metodo + \" \" + ruta, tok)\n```\n\n---\n\n## 5. Debaixo do capô: desempenho, memória RMM e garantias\n\n- **Garantia algorítmica e de segurança**: Higienização automática de `\\r` e `\\n` em todos os cabeçalhos (`http sanitize header`) para impedir ataques de divisão de resposta HTTP.\n- **Memória determinística (`RMM1`/`RMM2`)**: Zero pausas de coletor de lixo; todas as estruturas intermédias são libertadas de forma determinística à saída do escopo.\n- **Verificação contínua**: Testada exaustivamente com `stable check` e pela suite automatizada `src/test/ridgun/test_http.rg`.\n"}, {"num": "29", "slug": "29-lib-ws-protocolo-websocket-rfc6455", "file": "29-lib-ws-protocolo-websocket-rfc6455.md", "title": "Capítulo 29: A lib `ws` — Handshake WebSocket RFC 6455, Framing de 16/64 bits e Mascaramento XOR", "short_title": "A lib `ws` — Handshake WebSocket RFC 6455, Framing de 16/64 bits e Mascaramento XOR", "markdown": "# Capítulo 29: A lib `ws` — Handshake WebSocket RFC 6455, Framing de 16/64 bits e Mascaramento XOR\n\n## 1. Por que existe a lib `ws`?\n\nSejamos sinceros: o protocolo WebSocket (RFC 6455) combina um handshake SHA-1 + Base64 com tramas binárias de comprimento variável (7, 16 ou 64 bits) e mascaramento XOR obrigatório do cliente para o servidor.\n\nA lib **`ws`** implementa a **RFC 6455** completa em Ridgun puro: cálculo de `Sec-WebSocket-Accept` (com SHA-1 RFC 3174 integrado para o GUID do handshake), cabeçalhos HTTP `101 Switching Protocols`, codificação e descodificação de tramas (`WsFrame`) de 7, 16 (`126`) e 64 bits (`127`), mascaramento XOR simétrico e construtores de tramas de texto, ping, pong e fecho.\n\n---\n\n## 2. Artefactos, importação e arquitetura sem `libc`\n\nNo `ridgun-libs`, **`ws`** é uma **lib** de primeira classe localizada em `src/main/ridgun/lib/ws.rg` (domínio `WS`). Ao compilar com `stable bundle`, é empacotada em três formatos nativos:\n\n| Artefacto | Caminho | Finalidade |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/ws.rglib` | Distribuição e importação direta com `import ws` |\n| **Ficheiro compilado** | `target/ws.rgc` | Artefacto intermédio verificado pelo `ridgunc` |\n| **Objeto partilhado ELF64** | `target/libws.so` | Biblioteca dinâmica nativa sem dependências de C nem `libc` |\n\n> Para utilizar esta lib em qualquer ficheiro `.rg`, basta declarar `import ws` no topo e invocar as suas funções com espaços ou underscores.\n\n---\n\n## 3. Referência rápida da API de `ws`\n\n| Assinatura / Função / Tipo | O que faz e quando usar |\n|---|---|\n| `ws accept key : String -> String` | Calcula `Sec-WebSocket-Accept` (RFC 6455 §1.3) a partir de `Sec-WebSocket-Key` |\n| `ws build upgrade request / ws build upgrade response` | Formata as mensagens HTTP/1.1 de negociação (upgrade handshake) WebSocket |\n| `ws encode frame / ws decode frame` | Codifica e descodifica tramas `WsFrame` (`fin`, `opcode`, `masked`, `mask_key`, `payload`) |\n| `ws text frame / ws ping frame / ws pong frame / ws close frame` | Construtores de tramas de alto nível e extratores de código de fecho (`1000` normal) |\n\n---\n\n## 4. Receitas práticas em estilo tabular\n\n### Receita 1: Fluxo principal com `ws`\n\nRepare como os sinais `=` e os passos de transformação ficam alinhados como uma tabela limpa:\n\n```ridgun\nimport ws\n\nfn :: negociar y enviar (client_key : String) => (String, String)\n      negociar y enviar client_key =\n        resp  = ws build upgrade response client_key\n        trama = ws encode frame (ws text frame \"hola-tiempo-real\" False \"\")\n        (resp, trama)\n```\n\n### Receita 2: Composição segura e sem efeitos colaterais\n\nTodas as funções da lib `ws` compõem-se perfeitamente com as restantes 32 libs do `ridgun-libs`:\n\n```ridgun\nimport ws\n\nfn :: decodificar trama cliente (clave4 : String) (msg : String) => String\n      decodificar trama cliente clave4 msg =\n        wire = ws encode frame (ws text frame msg True clave4)\n        res  = ws decode frame wire\n        ws frame payload res\n```\n\n---\n\n## 5. Debaixo do capô: desempenho, memória RMM e garantias\n\n- **Garantia algorítmica e de segurança**: Correspondência exata com o vetor oficial RFC 6455 (`\"dGhlIHNhbXBsZSBub25jZQ==\"` $\\rightarrow$ `\"s3pPLMBiTxaQ9kYGzzhZRbK+xOo=\"`) e desmascaramento automático em `ws decode frame`.\n- **Memória determinística (`RMM1`/`RMM2`)**: Zero pausas de coletor de lixo; todas as estruturas intermédias são libertadas de forma determinística à saída do escopo.\n- **Verificação contínua**: Testada exaustivamente com `stable check` e pela suite automatizada `src/test/ridgun/test_ws.rg`.\n"}, {"num": "30", "slug": "30-lib-agent-concorrencia-de-atores", "file": "30-lib-agent-concorrencia-de-atores.md", "title": "Capítulo 30: A lib `agent` — Modelo Nativo de Atores (`agent`, `send`, `receive`), KV Store e Rate Limiter", "short_title": "A lib `agent` — Modelo Nativo de Atores (`agent`, `send`, `receive`), KV Store e Rate Limiter", "markdown": "# Capítulo 30: A lib `agent` — Modelo Nativo de Atores (`agent`, `send`, `receive`), KV Store e Rate Limiter\n\n## 1. Por que existe a lib `agent`?\n\nSejamos sinceros: partilhar memória mutável entre threads com `Mutex`, `RwLock` e variáveis de condição é uma fábrica inesgotável de *deadlocks* e condições de corrida.\n\nA lib **`agent`** tira partido do **Modelo Nativo de Agentes** do Ridgun (`agent`, `send ... to`, `receive from`, `try receive from`, `stop`) para oferecer caixas de correio isoladas com passagem de mensagens Copy-on-Write, um armazém chave-valor concorrente (`KvStore`), um limitador de taxa *token-bucket* (`RateBucket`) e supervisão (`AgentHealth`).\n\n---\n\n## 2. Artefactos, importação e arquitetura sem `libc`\n\nNo `ridgun-libs`, **`agent`** é uma **lib** de primeira classe localizada em `src/main/ridgun/lib/agent.rg` (domínio `AGENT`). Ao compilar com `stable bundle`, é empacotada em três formatos nativos:\n\n| Artefacto | Caminho | Finalidade |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/agent.rglib` | Distribuição e importação direta com `import agent` |\n| **Ficheiro compilado** | `target/agent.rgc` | Artefacto intermédio verificado pelo `ridgunc` |\n| **Objeto partilhado ELF64** | `target/libagent.so` | Biblioteca dinâmica nativa sem dependências de C nem `libc` |\n\n> Para utilizar esta lib em qualquer ficheiro `.rg`, basta declarar `import agent` no topo e invocar as suas funções com espaços ou underscores.\n\n---\n\n## 3. Referência rápida da API de `agent`\n\n| Assinatura / Função / Tipo | O que faz e quando usar |\n|---|---|\n| `agent roundtrip / agent drain count` | Lança atores nativos (`agent`), troca mensagens (`send ... to` / `receive from`) e executa `stop` |\n| `kv store new / kv store apply` | Armazém chave-valor imutável para atores (`KvPut`, `KvGet`, `KvDelete`, `KvClear`) |\n| `rate bucket new / rate bucket allow` | Limitador de taxa *token-bucket* que devolve o balde atualizado e `(allowed, remaining)` |\n| `sup mark failed / sup should restart` | Políticas de supervisão com controlo de orçamento de reinícios (`max_restarts`) |\n\n---\n\n## 4. Receitas práticas em estilo tabular\n\n### Receita 1: Fluxo principal com `agent`\n\nRepare como os sinais `=` e os passos de transformação ficam alinhados como uma tabela limpa:\n\n```ridgun\nimport agent\n\nfn :: probar actor nativo () => (Int, Int)\n      probar actor nativo =\n        eco = agent roundtrip 42\n        vac = agent drain count [10, 20, 30]\n        (eco, vac)\n```\n\n### Receita 2: Composição segura e sem efeitos colaterais\n\nTodas as funções da lib `agent` compõem-se perfeitamente com as restantes 32 libs do `ridgun-libs`:\n\n```ridgun\nimport agent\n\nfn :: aplicar limite peticion () => (Bool, Int)\n      aplicar limite peticion =\n        b0         = rate bucket new 10 2 1000\n        (b1, res1) = rate bucket allow b0 1 1000\n        rateresp allowed res1, rateobs remaining res1\n```\n\n---\n\n## 5. Debaixo do capô: desempenho, memória RMM e garantias\n\n- **Garantia algorítmica e de segurança**: Zero memória mutável partilhada entre atores: cada mensagem é transferida por valor / Copy-on-Write e `stop` liberta a região do agente de forma determinística.\n- **Memória determinística (`RMM1`/`RMM2`)**: Zero pausas de coletor de lixo; todas as estruturas intermédias são libertadas de forma determinística à saída do escopo.\n- **Verificação contínua**: Testada exaustivamente com `stable check` e pela suite automatizada `src/test/ridgun/test_agent.rg`.\n"}, {"num": "31", "slug": "31-lib-pool-trabalhadores-e-work-stealing", "file": "31-lib-pool-trabalhadores-e-work-stealing.md", "title": "Capítulo 31: A lib `pool` — Pool Limitado de Trabalhadores, Round-Robin e Work-Stealing", "short_title": "A lib `pool` — Pool Limitado de Trabalhadores, Round-Robin e Work-Stealing", "markdown": "# Capítulo 31: A lib `pool` — Pool Limitado de Trabalhadores, Round-Robin e Work-Stealing\n\n## 1. Por que existe a lib `pool`?\n\nSejamos sinceros: lançar uma nova thread ou ator por cada pedido sem limite superior (`unbounded spawning`) garante que um pico de tráfego esgota a memória do servidor em segundos.\n\nA lib **`pool`** fornece um despachante de tarefas com **contrapressão explícita** (`PoolAccept`, `PoolRejectFull`), partição equilibrada de lotes em $K$ vias (`pool partition`), reequilíbrio por **roubo de trabalho (*work-stealing*)** (`pool steal rebalance`) e execução paralela sobre atores nativos.\n\n---\n\n## 2. Artefactos, importação e arquitetura sem `libc`\n\nNo `ridgun-libs`, **`pool`** é uma **lib** de primeira classe localizada em `src/main/ridgun/lib/pool.rg` (domínio `AGENT`). Ao compilar com `stable bundle`, é empacotada em três formatos nativos:\n\n| Artefacto | Caminho | Finalidade |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/pool.rglib` | Distribuição e importação direta com `import pool` |\n| **Ficheiro compilado** | `target/pool.rgc` | Artefacto intermédio verificado pelo `ridgunc` |\n| **Objeto partilhado ELF64** | `target/libpool.so` | Biblioteca dinâmica nativa sem dependências de C nem `libc` |\n\n> Para utilizar esta lib em qualquer ficheiro `.rg`, basta declarar `import pool` no topo e invocar as suas funções com espaços ou underscores.\n\n---\n\n## 3. Referência rápida da API de `pool`\n\n| Assinatura / Função / Tipo | O que faz e quando usar |\n|---|---|\n| `pool new : Int -> Int -> PoolState` | Cria um pool limitado com `workers` vias e capacidade máxima `max_queue` |\n| `pool submit : PoolState -> PoolTask -> (PoolState, PoolDecision)` | Coloca uma tarefa na fila em round-robin ou devolve `PoolRejectFull` se saturado |\n| `pool partition / pool steal rebalance` | Divide lotes por $K$ trabalhadores e rouba metade de uma fila sobrecarregada para um trabalhador livre |\n| `pool map sum / pool parallel sum2` | Despacha cargas de trabalho em paralelo sobre trabalhadores `agent` nativos |\n\n---\n\n## 4. Receitas práticas em estilo tabular\n\n### Receita 1: Fluxo principal com `pool`\n\nRepare como os sinais `=` e os passos de transformação ficam alinhados como uma tabela limpa:\n\n```ridgun\nimport pool\n\nfn :: encolar con contrapresion () => (Int, Int)\n      encolar con contrapresion =\n        p0        = pool new 4 16\n        tarea     = PoolTask 1 100 \"indexar-bloque\"\n        (p1, dec) = pool submit p0 tarea\n        (pool queued p1, pool accepted p1)\n```\n\n### Receita 2: Composição segura e sem efeitos colaterais\n\nTodas as funções da lib `pool` compõem-se perfeitamente com as restantes 32 libs do `ridgun-libs`:\n\n```ridgun\nimport pool\n\nfn :: sumar en paralelo () => Int\n      sumar en paralelo =\n        pool parallel sum2 [10, 20, 30] [40, 50, 60]\n```\n\n---\n\n## 5. Debaixo do capô: desempenho, memória RMM e garantias\n\n- **Garantia algorítmica e de segurança**: Capacidade de fila estritamente limitada (`queued <= max_queue`) para proteger a memória sob sobrecarga e distribuição determinística entre trabalhadores.\n- **Memória determinística (`RMM1`/`RMM2`)**: Zero pausas de coletor de lixo; todas as estruturas intermédias são libertadas de forma determinística à saída do escopo.\n- **Verificação contínua**: Testada exaustivamente com `stable check` e pela suite automatizada `src/test/ridgun/test_pool.rg`.\n"}, {"num": "32", "slug": "32-lib-net-agent-supervisor-de-ligacoes", "file": "32-lib-net-agent-supervisor-de-ligacoes.md", "title": "Capítulo 32: A lib `net_agent` — Supervisor de Ligações de Rede e Ponte de Eventos Não Bloqueante", "short_title": "A lib `net_agent` — Supervisor de Ligações de Rede e Ponte de Eventos Não Bloqueante", "markdown": "# Capítulo 32: A lib `net_agent` — Supervisor de Ligações de Rede e Ponte de Eventos Não Bloqueante\n\n## 1. Por que existe a lib `net_agent`?\n\nSejamos sinceros: num servidor real como o **Solstice**, aceitar ligações TCP é a parte fácil; o difícil é limitar o máximo de clientes simultâneos, desconectar clientes zombies inativos (*idle timeout*) e ligar o ciclo `ppoll` aos seus atores sem fugas de descritores.\n\nA lib **`net_agent`** fecha o círculo do `ridgun-libs` unindo **`posix`**, **`socket`** e **`agent`**: gere tabelas de ligações supervisionadas (`NetSupervisor`), aplica limites de concorrência (`max_conns`), purga ligações inativas (`net evict idle`) e converte eventos de descritores do kernel em eventos tipados (`NetEvReadyRead`, `NetEvReadyWrite`, `NetEvTimeout`, `NetEvError`), além de fornecer um passo de eco TCP completo (`net tcp echo step`).\n\n---\n\n## 2. Artefactos, importação e arquitetura sem `libc`\n\nNo `ridgun-libs`, **`net_agent`** é uma **lib** de primeira classe localizada em `src/main/ridgun/lib/net_agent.rg` (domínio `AGENT`). Ao compilar com `stable bundle`, é empacotada em três formatos nativos:\n\n| Artefacto | Caminho | Finalidade |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/net_agent.rglib` | Distribuição e importação direta com `import net_agent` |\n| **Ficheiro compilado** | `target/net_agent.rgc` | Artefacto intermédio verificado pelo `ridgunc` |\n| **Objeto partilhado ELF64** | `target/libnet_agent.so` | Biblioteca dinâmica nativa sem dependências de C nem `libc` |\n\n> Para utilizar esta lib em qualquer ficheiro `.rg`, basta declarar `import net_agent` no topo e invocar as suas funções com espaços ou underscores.\n\n---\n\n## 3. Referência rápida da API de `net_agent`\n\n| Assinatura / Função / Tipo | O que faz e quando usar |\n|---|---|\n| `net supervisor new : Int -> Int -> NetSupervisor` | Cria um supervisor de ligações com limite `max_conns` e inatividade `idle_timeout_ms` |\n| `net register conn / net record rx / net record tx / net close conn` | Regista sockets aceites, atualiza contadores de bytes/atividade e fecha pares |\n| `net evict idle : NetSupervisor -> Int -> (NetSupervisor, [Int])` | Fecha e expulsa ligações inativas além de `idle_timeout_ms`, devolvendo os respetivos FDs |\n| `net poll fd : Int -> Bool -> Int -> NetEvent` | Ponte `wait fd` não bloqueante que emite `NetEvReadyRead`, `NetEvReadyWrite`, `NetEvTimeout` ou `NetEvError` |\n| `net tcp echo step : String -> Int -> (Int, String)` | Passo completo de ponta a ponta TCP loopback (`listen/connect/accept/supervise/echo`) |\n\n---\n\n## 4. Receitas práticas em estilo tabular\n\n### Receita 1: Fluxo principal com `net_agent`\n\nRepare como os sinais `=` e os passos de transformação ficam alinhados como uma tabela limpa:\n\n```ridgun\nimport net_agent\n\nfn :: supervisar clientes () => (Int, [Int])\n      supervisar clientes =\n        s0        = net supervisor new 100 5000\n        (s1, _)   = net register conn s0 10 \"10.0.0.1\" 51000 1000\n        (s2, _)   = net register conn s1 11 \"10.0.0.2\" 51001 6500\n        (s3, exp) = net evict idle s2 7000\n        (net active count s3, exp)\n```\n\n### Receita 2: Composição segura e sem efeitos colaterais\n\nTodas as funções da lib `net_agent` compõem-se perfeitamente com as restantes 32 libs do `ridgun-libs`:\n\n```ridgun\nimport net_agent\n\nfn :: probar puente tcp supervisado () => (Int, String)\n      probar puente tcp supervisado =\n        net tcp echo step \"ping-supervisado\" 1000\n```\n\n---\n\n## 5. Debaixo do capô: desempenho, memória RMM e garantias\n\n- **Garantia algorítmica e de segurança**: Proteção automática contra esgotamento de descritores (`max_conns`), expulsão determinística de ligações inativas e fecho garantido de sockets em `net tcp echo step`.\n- **Memória determinística (`RMM1`/`RMM2`)**: Zero pausas de coletor de lixo; todas as estruturas intermédias são libertadas de forma determinística à saída do escopo.\n- **Verificação contínua**: Testada exaustivamente com `stable check` e pela suite automatizada `src/test/ridgun/test_net_agent.rg`.\n"}];
    const UI_STRINGS = {"copy_label": "Copiar", "copied_label": "Copiado!", "prev_label": "&larr; Capítulo anterior", "next_label": "Próximo capítulo &rarr;", "search_hits_label": "Resultados para", "search_empty_label": "Nenhuma correspondência encontrada para"};
    let currentIdx = 0;

    function escapeHtml(s) {
      return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function highlightRidgun(code) {
      return code.split("\n").map(line => {
        const comIdx = (() => {
          let inD = false, inS = false;
          for (let i = 0; i < line.length - 1; i++) {
            if (line[i] === "\\") { i++; continue; }
            if (line[i] === '"' && !inS) inD = !inD;
            else if (line[i] === "'" && !inD) inS = !inS;
            else if (!inD && !inS && line[i] === "-" && line[i+1] === "-") return i;
          }
          return -1;
        })();
        const codePart = comIdx >= 0 ? line.slice(0, comIdx) : line;
        const comPart = comIdx >= 0 ? line.slice(comIdx) : "";
        let html = escapeHtml(codePart);
        html = html.replace(/("([^"\\]|\\.)*"|'[^']*')/g, '<span class="rg-str">$1</span>');
        html = html.replace(/\b(fn|op|type|import|mut|otherwise|with|region|timeout|do|global|context|shared|atomic|hardware|echo|and|or|xor|not|agent|send|to|receive|from|try|stop)\b/g, '<span class="rg-kw">$1</span>');
        html = html.replace(/\b(Int|Real|String|Char|Bool|U64|Tensor|Option|Result|Some|None|Ok|Err|OutOfMemory|Timeout|True|False)\b/g, '<span class="rg-ty">$1</span>');
        html = html.replace(/(::|=&gt;|-&gt;|&lt;-|\|\|\.|\|\||\|\.)/g, '<span class="rg-op">$1</span>');
        html = html.replace(/\b(0x[0-9a-fA-F_]+|[0-9][0-9_]*(_KB|_MB|_GB)?(\.[0-9]+)?)\b/g, '<span class="rg-num">$1</span>');
        if (comPart) {
          html += '<span class="rg-com">' + escapeHtml(comPart) + '</span>';
        }
        return html;
      }).join("\n");
    }

    function formatInline(text) {
      let out = escapeHtml(text);
      out = out.replace(/`([^`]+)`/g, "<code>$1</code>");
      out = out.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      out = out.replace(/\*([^*]+)\*/g, "<em>$1</em>");
      out = out.replace(/\$O\(([^)]+)\)\$/g, "<code>O($1)</code>");
      out = out.replace(/\$\\rightarrow\$/g, "&rarr;");
      return out;
    }

    function renderMarkdown(md) {
      const lines = md.split("\n");
      let html = "";
      let i = 0;
      while (i < lines.length) {
        const line = lines[i];
        if (line.startsWith("```")) {
          const lang = line.slice(3).trim() || "ridgun";
          i++;
          const buf = [];
          while (i < lines.length && !lines[i].startsWith("```")) {
            buf.push(lines[i]);
            i++;
          }
          i++;
          const rawCode = buf.join("\n");
          const bodyHtml = (lang === "ridgun" || lang === "") ? highlightRidgun(rawCode) : escapeHtml(rawCode);
          html += `<div class="code-wrapper"><div class="code-header"><span>${escapeHtml(lang)}</span><button class="copy-btn" onclick="copyCode(this)">${escapeHtml(UI_STRINGS.copy_label)}</button></div><pre data-raw="${ encodeURIComponent(rawCode) }"><code>${bodyHtml}</code></pre></div>`;
          continue;
        }
        if (/^---+$/.test(line.trim())) {
          html += "<hr />";
          i++;
          continue;
        }
        if (line.startsWith("# ")) {
          html += `<h1>${formatInline(line.slice(2).trim())}</h1>`;
          i++;
          continue;
        }
        if (line.startsWith("## ")) {
          html += `<h2>${formatInline(line.slice(3).trim())}</h2>`;
          i++;
          continue;
        }
        if (line.startsWith("### ")) {
          html += `<h3>${formatInline(line.slice(4).trim())}</h3>`;
          i++;
          continue;
        }
        if (line.trim().startsWith("|") && i + 1 < lines.length && /^\|[\s:-]+\|/.test(lines[i+1].trim())) {
          const headers = line.trim().slice(1, -1).split("|").map(c => formatInline(c.trim()));
          i += 2;
          const rows = [];
          while (i < lines.length && lines[i].trim().startsWith("|")) {
            rows.push(lines[i].trim().slice(1, -1).split("|").map(c => formatInline(c.trim())));
            i++;
          }
          html += '<div class="table-wrap"><table><thead><tr>' + headers.map(h => `<th>${h}</th>`).join("") + '</tr></thead><tbody>' +
                  rows.map(r => '<tr>' + r.map(c => `<td>${c}</td>`).join("") + '</tr>').join("") + '</tbody></table></div>';
          continue;
        }
        if (line.startsWith(">")) {
          const qLines = [];
          while (i < lines.length && lines[i].startsWith(">")) {
            qLines.push(lines[i].replace(/^>\s?/, ""));
            i++;
          }
          html += `<blockquote><p>${qLines.map(formatInline).join("<br/>")}</p></blockquote>`;
          continue;
        }
        if (/^\s*-\s+/.test(line)) {
          const items = [];
          while (i < lines.length && /^\s*-\s+/.test(lines[i])) {
            items.push(formatInline(lines[i].replace(/^\s*-\s+/, "")));
            i++;
          }
          html += "<ul>" + items.map(it => `<li>${it}</li>`).join("") + "</ul>";
          continue;
        }
        if (/^\s*\d+\.\s+/.test(line)) {
          const items = [];
          while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
            items.push(formatInline(lines[i].replace(/^\s*\d+\.\s+/, "")));
            i++;
          }
          html += "<ol>" + items.map(it => `<li>${it}</li>`).join("") + "</ol>";
          continue;
        }
        if (!line.trim()) {
          i++;
          continue;
        }
        const pLines = [];
        while (i < lines.length && lines[i].trim() && !lines[i].startsWith("#") && !lines[i].startsWith("```") && !lines[i].startsWith(">") && !lines[i].trim().startsWith("|") && !/^---+$/.test(lines[i].trim()) && !/^\s*(-|\d+\.)\s+/.test(lines[i])) {
          pLines.push(formatInline(lines[i]));
          i++;
        }
        html += `<p>${pLines.join(" ")}</p>`;
      }
      return html;
    }

    window.copyCode = function(btn) {
      const pre = btn.closest(".code-wrapper").querySelector("pre");
      const raw = decodeURIComponent(pre.getAttribute("data-raw"));
      navigator.clipboard.writeText(raw);
      const old = btn.textContent;
      btn.textContent = UI_STRINGS.copied_label;
      setTimeout(() => { btn.textContent = old; }, 1400);
    };

    function renderSidebar() {
      const nav = document.getElementById("navList");
      nav.innerHTML = CHAPTERS.map((ch, idx) => `
        <li class="nav-item">
          <button class="nav-btn ${idx === currentIdx ? 'active' : ''}" onclick="selectChapter(${idx})">
            <span class="nav-num">${ch.num}</span>
            <span>${escapeHtml(ch.short_title)}</span>
          </button>
        </li>
      `).join("");
    }

    window.selectChapter = function(idx) {
      currentIdx = idx;
      const ch = CHAPTERS[idx];
      location.hash = ch.slug;
      renderSidebar();
      let pagerHtml = '<div class="pager">';
      if (idx > 0) {
        pagerHtml += `<button class="pager-btn prev" onclick="selectChapter(${idx - 1})"><span class="pager-label">${UI_STRINGS.prev_label}</span><span class="pager-title">${escapeHtml(CHAPTERS[idx - 1].title)}</span></button>`;
      } else {
        pagerHtml += '<div></div>';
      }
      if (idx + 1 < CHAPTERS.length) {
        pagerHtml += `<button class="pager-btn next" onclick="selectChapter(${idx + 1})"><span class="pager-label">${UI_STRINGS.next_label}</span><span class="pager-title">${escapeHtml(CHAPTERS[idx + 1].title)}</span></button>`;
      }
      pagerHtml += '</div>';
      document.getElementById("chapterContent").innerHTML = renderMarkdown(ch.markdown) + pagerHtml;
      window.scrollTo({ top: 0, behavior: "smooth" });
    };

    document.getElementById("searchInput").addEventListener("input", (e) => {
      const q = e.target.value.trim().toLowerCase();
      if (q.length < 2) {
        selectChapter(currentIdx);
        return;
      }
      const hits = [];
      CHAPTERS.forEach((ch, idx) => {
        const lines = ch.markdown.split("\n");
        for (const l of lines) {
          if (l.toLowerCase().includes(q)) {
            hits.push({ idx, title: ch.title, snippet: l.replace(/^[#>*-]+\s*/, "").slice(0, 140) });
            break;
          }
        }
      });
      const box = hits.length
        ? `<div class="search-results"><strong>${escapeHtml(UI_STRINGS.search_hits_label)} "${escapeHtml(q)}" (${hits.length}):</strong>` +
          hits.map(h => `<div class="search-hit" onclick="document.getElementById('searchInput').value=''; selectChapter(${h.idx})"><div class="search-hit-title">${escapeHtml(h.title)}</div><div class="search-hit-snippet">${escapeHtml(h.snippet)}</div></div>`).join("") +
          `</div>`
        : `<div class="search-results">${escapeHtml(UI_STRINGS.search_empty_label)} "${escapeHtml(q)}".</div>`;
      document.getElementById("chapterContent").innerHTML = box + renderMarkdown(CHAPTERS[currentIdx].markdown);
    });

    document.getElementById("themeBtn").addEventListener("click", () => {
      const root = document.documentElement;
      root.setAttribute("data-theme", root.getAttribute("data-theme") === "dark" ? "light" : "dark");
    });

    const initialSlug = location.hash.replace(/^#/, "");
    const foundIdx = CHAPTERS.findIndex(c => c.slug === initialSlug);
    selectChapter(foundIdx >= 0 ? foundIdx : 0);
  </script>
</body>
</html>
