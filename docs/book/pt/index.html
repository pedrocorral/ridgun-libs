  <script>
    const CHAPTERS = [{"num": "00", "slug": "00-por-que-preciso-do-ridgun-libs", "file": "00-por-que-preciso-do-ridgun-libs.md", "title": "Capítulo 00: Por que preciso do `ridgun-libs`? 32 libs sem uma linha de C? Conte-me mais!", "short_title": "Por que preciso do `ridgun-libs`? 32 libs sem uma linha de C? Conte-me mais!", "markdown": "# Capítulo 00: Por que preciso do `ridgun-libs`? 32 libs sem uma linha de C? Conte-me mais!\n\nSejamos sinceros: quando descobre que uma linguagem compila para um binário ELF nativo minúsculo e sem coletor de lixo, a segunda pergunta que faz a si mesmo — com toda a razão do mundo — é:\n\n> *\"Muito bem, a linguagem é excelente... mas quando eu precisar de abrir um socket TCP, calcular um hash Argon2id, analisar um JSON, resolver um sistema linear com tensores ou montar um pool de atores, vou ter de ligar `libc`, `OpenSSL`, `libcurl` e `pcre2`, ou descarregar 800 pacotes de terceiros mantidos por desconhecidos?\"*\n\nÉ uma excelente pergunta. E a resposta curta é: **não**. É exatamente para isso que existe o **`ridgun-libs`**: uma suite de **32 libs fundamentais** escritas a **100 % em Ridgun puro (`v0.9.16`)**, com **zero dependências em C** e **zero `libc`**.\n\nVamos dar nome às quatro dores diárias que o `ridgun-libs` elimina pela raiz.\n\n---\n\n## Dor n.º 1: \"O inferno da `libc`, OpenSSL e da ligação cruzada\"\n\nDe certeza que já viveu este pesadelo:\n\n1. Escreve um servidor ou uma ferramenta CLI supostamente \"estática\" ou \"portátil\".\n2. Assim que precisa de criptografia (`SHA-256`, `Argon2id`, `ChaCha20-Poly1305`), rede (`DNS`, `HTTP`, `WebSockets`) ou expressões regulares, o seu programa acaba dependente da `glibc 2.38`, `libssl.so.3` e cabeçalhos C.\n3. Tenta copiar o binário para um contentor mínimo ou outra distribuição Linux e ele rebenta no arranque com o famoso `version 'GLIBC_2.38' not found`.\n\n**O que muda com o `ridgun-libs`?**\nCada uma das 32 libs deste repositório está escrita integralmente em Ridgun tabular e comunica diretamente com o kernel do sistema operativo através da camada PAL (`posix`) ou executa algoritmos puros em memória determinística (`RMM1`/`RMM2`). Compilam tanto para pacotes portáteis (`.rglib` / `.rgc`) como para objetos partilhados ELF64 nativos (`lib*.so`). Sem `libc`, sem FFI frágil e sem surpresas na implementação.\n\n---\n\n## Dor n.º 2: \"A síndrome do `node_modules` / `Cargo.lock` de 400 dependências\"\n\nEm muitos ecossistemas modernos, a biblioteca padrão é tão esquelética que para ler um ficheiro `.ini`, validar um `UUIDv7`, aplicar um patch Unified Diff ou renderizar um template HTML seguro precisa de instalar meia dúzia de pacotes externos.\n\nNo **`ridgun-libs`**, todas as **32 libs** seguem uma única filosofia de desenho:\n\n```ridgun\nimport crypto\nimport json\nimport http\n\nfn :: autenticar y pedir (token : String) => String\n      autenticar y pedir token =\n        -- Todas as libs partilham tipos puros, alinhamento tabular e semântica determinística\n        mac_hex = sha256 hex token\n        cuerpo  = json stringify (JnObj [(\"token_sha256\", JnStr mac_hex)])\n        pet     = http build request \"POST\" \"/v1/sesion\" [(\"Content-Type\", \"application/json\")] cuerpo\n        pet\n```\n\nMesma estética tabular, mesmos ADTs imutáveis (`Option`, `Result`, `IoResult`, `JsonVal`), zero efeitos colaterais ocultos.\n\n---\n\n## Dor n.º 3: \"Expressões regulares que bloqueiam a CPU (ReDoS) e sockets que ficam pendurados para sempre\"\n\nDuas bombas-relógio clássicas em produção:\n\n- Um utilizador malicioso envia uma cadeia desenhada para forçar o seu motor de expressões regulares com *backtracking* a entrar em tempo exponencial $O(2^N)$, queimando um núcleo a 100 %.\n- Um descritor de rede fica meio aberto e a sua tarefa bloqueia eternamente num `read()` sem prazo limite.\n\nNo **`ridgun-libs`**:\n- A lib **`regex`** (Capítulo 11) implementa um autómato **NFA de Thompson** que garante tempo linear estrito **$O(N \\cdot M)$**: imune por construção a ataques ReDoS.\n- As libs **`posix`**, **`io`** e **`socket`** (Capítulos 22, 23 e 27) integram quotas léxicas `with timeout` e `ppoll` ao nível do descritor: nenhuma operação de entrada/saída pode bloquear o seu serviço.\n\n---\n\n## Dor n.º 4: \"Criptografia e álgebra linear que parecem hieróglifos\"\n\nNo **`ridgun-libs`**, o poder dos tipos `Tensor[...]` do Ridgun permite que libs como **`tensor`** (Capítulo 05), **`linalg`** (Capítulo 06) e **`argon2id`** (Capítulo 25) operem sobre blocos de memória contígua (`Tensor[U64 * 8 * 16]`, `Tensor[Real]`) mantendo a legibilidade de uma tabela matemática.\n\n---\n\n## Mapa completo do livro: 32 capítulos para 32 libs\n\nCada capítulo deste livro é dedicado a **uma lib** do `ridgun-libs`, organizadas numa progressão lógica de baixo para cima:\n\n| Capítulos | Família de libs | Libs incluídas |\n|---|---|---|\n| **01 – 04** | Texto, Matemática e Estruturas de Dados | `str`, `math`, `list`, `btree` |\n| **05 – 06** | Tensores e Álgebra Linear | `tensor`, `linalg` |\n| **07 – 10** | Codificação e Formatos de Dados | `codec`, `json`, `csv`, `ini` |\n| **11 – 15** | Motores de Texto, Diffs, Templates e Formatação | `regex`, `glob`, `diff`, `template`, `fmt` |\n| **16 – 21** | CLI, Caminhos, Tempo, UUIDs, Logs e Testes | `cli`, `path`, `time`, `uuid`, `log`, `test` |\n| **22 – 23** | Sistemas POSIX e E/S com Timeout | `posix`, `io` |\n| **24 – 26** | Criptografia, Argon2id e Tokens JWT | `crypto`, `argon2id`, `jwt` |\n| **27 – 29** | Redes, Sockets do Kernel, HTTP/1.1 e WebSockets | `socket`, `http`, `ws` |\n| **30 – 32** | Concorrência de Atores, Pools e Supervisão de Rede | `agent`, `pool`, `net_agent` |\n\nVamos a isto! Avance para o **Capítulo 01 (`str`)** e comecemos a construir.\n"}, {"num": "01", "slug": "01-lib-str-manipulacao-de-texto", "file": "01-lib-str-manipulacao-de-texto.md", "title": "Capítulo 01: A lib `str` — Manipulação de Texto, Pesquisa e Formatação Tabular", "short_title": "A lib `str` — Manipulação de Texto, Pesquisa e Formatação Tabular", "markdown": "# Capítulo 01: A lib `str` — Manipulação de Texto, Pesquisa e Formatação Tabular\n\n## 1. Por que existe a lib `str`?\n\nSejamos sinceros: manipular cadeias em C com `strtok` e `strncpy` é caminhar num campo de minas de *buffer overflows* e ponteiros `NULL`, e noutras linguagens acaba a importar pacotes externos só para alinhar colunas ou repetir um separador em $O(\\log N)$.\n\nA lib **`str`** fornece todas as primitivas puras e imutáveis para pesquisar, aparar, dividir, juntar, converter maiúsculas/minúsculas, repetir por duplicação binária $O(\\log N)$ e preencher cadeias.\n\n---\n\n## 2. Artefactos, importação e arquitetura sem `libc`\n\nNo `ridgun-libs`, **`str`** é uma **lib** de primeira classe localizada em `src/main/ridgun/lib/str.rg` (domínio `STR`). Ao compilar com `stable bundle`, é empacotada em três formatos nativos:\n\n| Artefacto | Caminho | Finalidade |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/str.rglib` | Distribuição e importação direta com `import str` |\n| **Ficheiro compilado** | `target/str.rgc` | Artefacto intermédio verificado pelo `ridgunc` |\n| **Objeto partilhado ELF64** | `target/libstr.so` | Biblioteca dinâmica nativa sem dependências de C nem `libc` |\n\n> Para utilizar esta lib em qualquer ficheiro `.rg`, basta declarar `import str` no topo e invocar as suas funções com espaços ou underscores.\n\n---\n\n## 3. Referência rápida da API de `str`\n\n| Assinatura / Função / Tipo | O que faz e quando usar |\n|---|---|\n| `str index of : String -> String -> Int` | Primeiro índice da subcadeia (`-1` se ausente / `0` se vazia) |\n| `str contains / str starts with / str ends with` | Predicados `Bool` de subcadeia, prefixo e sufixo |\n| `str trim / str trim left / str trim right` | Remove espaços em branco ASCII (` `, `\\t`, `\\n`, `\\r`) |\n| `str split / str lines / str words / str join` | Divide em `[String]` e junta listas com um separador |\n| `str replace / str to upper / str to lower` | Substituição sem sobreposição e conversão ASCII de maiúsculas/minúsculas |\n| `str repeat / str pad left / str pad right` | Repetição em $O(\\log N)$ e preenchimento de colunas com largura fixa |\n\n---\n\n## 4. Receitas práticas em estilo tabular\n\n### Receita 1: Fluxo principal com `str`\n\nRepare como os sinais `=` e os passos de transformação ficam alinhados como uma tabela limpa:\n\n```ridgun\nimport str\n\nfn :: normalizar cabecera (raw : String) => String\n      normalizar cabecera raw =\n        limpia = str to lower (str trim raw)\n        partes = str words limpia\n        slug   = str join partes \"-\"\n        str pad right slug 24 \".\"\n```\n\n### Receita 2: Composição segura e sem efeitos colaterais\n\nTodas as funções da lib `str` compõem-se perfeitamente com as restantes 32 libs do `ridgun-libs`:\n\n```ridgun\nimport str\n\nfn :: extraer dominio (correo : String) => String\n      extraer dominio correo =\n        pos = str index of correo \"@\"\n        | pos < 0   = \"sin-dominio\"\n        | otherwise =\n          partes = str split correo \"@\"\n          str replace (str to lower correo) \"@\" \" en \"\n```\n\n---\n\n## 5. Debaixo do capô: desempenho, memória RMM e garantias\n\n- **Garantia algorítmica e de segurança**: Repetição em $O(\\log N)$ através de duplicação binária de cadeias, predicados seguros perante agulhas vazias e zero mutação local.\n- **Memória determinística (`RMM1`/`RMM2`)**: Zero pausas de coletor de lixo; todas as estruturas intermédias são libertadas de forma determinística à saída do escopo.\n- **Verificação contínua**: Testada exaustivamente com `stable check` e pela suite automatizada `src/test/ridgun/test_str.rg`.\n"}, {"num": "02", "slug": "02-lib-math-aritmetica-e-teoria-dos-numeros", "file": "02-lib-math-aritmetica-e-teoria-dos-numeros.md", "title": "Capítulo 02: A lib `math` — Aritmética Segura, Teoria dos Números e Estatística", "short_title": "A lib `math` — Aritmética Segura, Teoria dos Números e Estatística", "markdown": "# Capítulo 02: A lib `math` — Aritmética Segura, Teoria dos Números e Estatística\n\n## 1. Por que existe a lib `math`?\n\nSejamos sinceros: uma divisão por zero inesperada em produção ou o operador `%` a devolver restos negativos em C ou Java já derrubaram mais serviços do que gostamos de admitir.\n\nA lib **`math`** oferece divisões totais à prova de `d == 0` (`div ceil`, `div floor`, `div euclid`, `mod euclid`), exponenciação e inverso modular em $O(\\log E)$, raízes e logaritmos inteiros exatos, combinatória, primalidade e o operador mixfix `clamp x between lo and hi`.\n\n---\n\n## 2. Artefactos, importação e arquitetura sem `libc`\n\nNo `ridgun-libs`, **`math`** é uma **lib** de primeira classe localizada em `src/main/ridgun/lib/math.rg` (domínio `MATH`). Ao compilar com `stable bundle`, é empacotada em três formatos nativos:\n\n| Artefacto | Caminho | Finalidade |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/math.rglib` | Distribuição e importação direta com `import math` |\n| **Ficheiro compilado** | `target/math.rgc` | Artefacto intermédio verificado pelo `ridgunc` |\n| **Objeto partilhado ELF64** | `target/libmath.so` | Biblioteca dinâmica nativa sem dependências de C nem `libc` |\n\n> Para utilizar esta lib em qualquer ficheiro `.rg`, basta declarar `import math` no topo e invocar as suas funções com espaços ou underscores.\n\n---\n\n## 3. Referência rápida da API de `math`\n\n| Assinatura / Função / Tipo | O que faz e quando usar |\n|---|---|\n| `math abs / math sign / math min / math max` | Magnitude absoluta, sinal (`-1, 0, 1`) e extremos |\n| `clamp x between lo and hi` | Operador mixfix (`op ::`) que limita `x` ao intervalo `[lo, hi]` |\n| `math div ceil / math div floor / math div euclid / math mod euclid` | Arredondamento seguro contra divisão por zero e resto euclidiano não negativo |\n| `math pow / math isqrt / math ilog2 / math ilog10` | Potência em $O(\\log E)$, raiz quadrada inteira de Newton e logaritmos inteiros |\n| `math gcd / math lcm / math mod pow / math mod inv / math is prime` | MDC/MMC de Euclides, aritmética modular e teste de primalidade $6k \\pm 1$ |\n| `math sum / math mean floor / math median floor / math variance floor` | Combinatória (`nCr`) sem overflow e estatística inteira sobre listas |\n\n---\n\n## 4. Receitas práticas em estilo tabular\n\n### Receita 1: Fluxo principal com `math`\n\nRepare como os sinais `=` e os passos de transformação ficam alinhados como uma tabela limpa:\n\n```ridgun\nimport math\n\nfn :: verificar clave modular (base : Int) (primo : Int) => (Int, Int, Bool)\n      verificar clave modular base primo =\n        es_p = math is prime primo\n        pot  = math mod pow base (primo - 1) primo\n        inv  = math mod inv base primo\n        (pot, inv, es_p)\n```\n\n### Receita 2: Composição segura e sem efeitos colaterais\n\nTodas as funções da lib `math` compõem-se perfeitamente com as restantes 32 libs do `ridgun-libs`:\n\n```ridgun\nimport math\n\nfn :: calcular paginas y cuota (items : Int) (por_pag : Int) (uso : Int) => (Int, Int)\n      calcular paginas y cuota items por_pag uso =\n        pags  = math div ceil items por_pag\n        cuota = clamp uso between 0 and 100\n        (pags, cuota)\n```\n\n---\n\n## 5. Debaixo do capô: desempenho, memória RMM e garantias\n\n- **Garantia algorítmica e de segurança**: Funções totais (devolvem `0` quando o divisor é `<= 0` em vez de abortar com `SIGFPE`), sem imprecisão de vírgula flutuante.\n- **Memória determinística (`RMM1`/`RMM2`)**: Zero pausas de coletor de lixo; todas as estruturas intermédias são libertadas de forma determinística à saída do escopo.\n- **Verificação contínua**: Testada exaustivamente com `stable check` e pela suite automatizada `src/test/ridgun/test_math.rg`.\n"}, {"num": "03", "slug": "03-lib-list-listas-mergesort-e-mapas-kv", "file": "03-lib-list-listas-mergesort-e-mapas-kv.md", "title": "Capítulo 03: A lib `list` — Listas, Mergesort $O(N \\log N)$ e Mapas Chave-Valor", "short_title": "A lib `list` — Listas, Mergesort $O(N \\log N)$ e Mapas Chave-Valor", "markdown": "# Capítulo 03: A lib `list` — Listas, Mergesort $O(N \\log N)$ e Mapas Chave-Valor\n\n## 1. Por que existe a lib `list`?\n\nSejamos sinceros: aceder a um índice fora de limites (`IndexError` / `panic!`) ou mutar acidentalmente uma lista partilhada são dois dos erros mais comuns ao processar coleções.\n\nA lib **`list`** fornece indexação segura com valor padrão, fatiamento (`take`, `drop`, `slice`), intervalos com passo, desduplicação estável, ordenação **mergesort $O(N \\log N)$** para `[Int]` e `[String]`, e mapas associativos imutáveis `[String String]` (`kv get`, `kv put`, `kv merge`).\n\n---\n\n## 2. Artefactos, importação e arquitetura sem `libc`\n\nNo `ridgun-libs`, **`list`** é uma **lib** de primeira classe localizada em `src/main/ridgun/lib/list.rg` (domínio `LIST`). Ao compilar com `stable bundle`, é empacotada em três formatos nativos:\n\n| Artefacto | Caminho | Finalidade |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/list.rglib` | Distribuição e importação direta com `import list` |\n| **Ficheiro compilado** | `target/list.rgc` | Artefacto intermédio verificado pelo `ridgunc` |\n| **Objeto partilhado ELF64** | `target/liblist.so` | Biblioteca dinâmica nativa sem dependências de C nem `libc` |\n\n> Para utilizar esta lib em qualquer ficheiro `.rg`, basta declarar `import list` no topo e invocar as suas funções com espaços ou underscores.\n\n---\n\n## 3. Referência rápida da API de `list`\n\n| Assinatura / Função / Tipo | O que faz e quando usar |\n|---|---|\n| `list nth or / list str nth or` | Leitura segura por índice devolvendo `default_val` se fora de limites |\n| `list take / list drop / list slice / list reverse` | Prefixo, sufixo, subintervalo `[start, end)` e inversão recursiva de cauda |\n| `list range / list range step` | Gera sequências aritméticas (`step == 0` devolve `[]` em segurança) |\n| `list sort / list str sort / list dedup / list str dedup` | Ordenação mergesort $O(N \\log N)$ estável e desduplicação pela primeira ocorrência |\n| `kv empty / kv put / kv get / kv get or / kv remove / kv merge` | Operações sobre dicionários associativos ordenados `[String String]` |\n\n---\n\n## 4. Receitas práticas em estilo tabular\n\n### Receita 1: Fluxo principal com `list`\n\nRepare como os sinais `=` e os passos de transformação ficam alinhados como uma tabela limpa:\n\n```ridgun\nimport list\n\nfn :: top tres unicos (puntos : [Int]) => [Int]\n      top tres unicos puntos =\n        unicos    = list dedup puntos\n        ordenados = list reverse (list sort unicos)\n        list take ordenados 3\n```\n\n### Receita 2: Composição segura e sem efeitos colaterais\n\nTodas as funções da lib `list` compõem-se perfeitamente com as restantes 32 libs do `ridgun-libs`:\n\n```ridgun\nimport list\n\nfn :: configurar entorno (base : [String String]) => (String, [String])\n      configurar entorno base =\n        cfg1 = kv put base \"host\" \"0.0.0.0\"\n        cfg2 = kv put cfg1 \"port\" \"8080\"\n        host = kv get or cfg2 \"host\" \"127.0.0.1\"\n        (host, kv keys cfg2)\n```\n\n---\n\n## 5. Debaixo do capô: desempenho, memória RMM e garantias\n\n- **Garantia algorítmica e de segurança**: Ordenação determinística $O(N \\log N)$ no pior caso (sem o $O(N^2)$ patológico do Quicksort) e preservação da ordem de inserção nos mapas `kv`.\n- **Memória determinística (`RMM1`/`RMM2`)**: Zero pausas de coletor de lixo; todas as estruturas intermédias são libertadas de forma determinística à saída do escopo.\n- **Verificação contínua**: Testada exaustivamente com `stable check` e pela suite automatizada `src/test/ridgun/test_list.rg`.\n"}, {"num": "04", "slug": "04-lib-btree-arvores-avl-conjuntos-e-heaps", "file": "04-lib-btree-arvores-avl-conjuntos-e-heaps.md", "title": "Capítulo 04: A lib `btree` — Árvores AVL Persistentes $O(\\log N)$, Conjuntos e Heaps", "short_title": "A lib `btree` — Árvores AVL Persistentes $O(\\log N)$, Conjuntos e Heaps", "markdown": "# Capítulo 04: A lib `btree` — Árvores AVL Persistentes $O(\\log N)$, Conjuntos e Heaps\n\n## 1. Por que existe a lib `btree`?\n\nSejamos sinceros: tabelas de hash mutáveis sofrem ataques de colisão de chaves (HashDoS), não mantêm as chaves ordenadas para consultas por intervalo e não podem ser partilhadas entre atores sem bloqueios.\n\nA lib **`btree`** implementa três estruturas de dados funcionais persistentes em $O(\\log N)$ com partilha estrutural: **`BTreeMap`** (árvore AVL autobalanceada), **`BTreeSet`** (álgebra de conjuntos ordenada) e **`MinHeap`** (fila de prioridade *leftist heap*).\n\n---\n\n## 2. Artefactos, importação e arquitetura sem `libc`\n\nNo `ridgun-libs`, **`btree`** é uma **lib** de primeira classe localizada em `src/main/ridgun/lib/btree.rg` (domínio `BTREE`). Ao compilar com `stable bundle`, é empacotada em três formatos nativos:\n\n| Artefacto | Caminho | Finalidade |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/btree.rglib` | Distribuição e importação direta com `import btree` |\n| **Ficheiro compilado** | `target/btree.rgc` | Artefacto intermédio verificado pelo `ridgunc` |\n| **Objeto partilhado ELF64** | `target/libbtree.so` | Biblioteca dinâmica nativa sem dependências de C nem `libc` |\n\n> Para utilizar esta lib em qualquer ficheiro `.rg`, basta declarar `import btree` no topo e invocar as suas funções com espaços ou underscores.\n\n---\n\n## 3. Referência rápida da API de `btree`\n\n| Assinatura / Função / Tipo | O que faz e quando usar |\n|---|---|\n| `btree empty / btree insert / btree get / btree remove` | Pesquisa, inserção e remoção persistente em dicionário AVL em $O(\\log N)$ |\n| `btree min key / btree max key / btree range` | Extremos ordenados e consulta por intervalo `[lo, hi]` |\n| `bset from list / bset union / bset intersect / bset diff` | Álgebra de conjuntos ordenados (`BTreeSet`) e predicado de subconjunto |\n| `heap empty / heap push / heap peek / heap pop / heap sort` | Fila de prioridade `MinHeap` (*leftist heap*) com fusão em $O(\\log N)$ |\n\n---\n\n## 4. Receitas práticas em estilo tabular\n\n### Receita 1: Fluxo principal com `btree`\n\nRepare como os sinais `=` e os passos de transformação ficam alinhados como uma tabela limpa:\n\n```ridgun\nimport btree\n\nfn :: consultar rango precios () => [String String]\n      consultar rango precios =\n        t0 = btree empty\n        t1 = btree insert t0 \"item:10\" \"Teclado\"\n        t2 = btree insert t1 \"item:20\" \"Monitor\"\n        t3 = btree insert t2 \"item:30\" \"Raton\"\n        btree range t3 \"item:10\" \"item:25\"\n```\n\n### Receita 2: Composição segura e sem efeitos colaterais\n\nTodas as funções da lib `btree` compõem-se perfeitamente com as restantes 32 libs do `ridgun-libs`:\n\n```ridgun\nimport btree\n\nfn :: despachar urgente () => (Int, String)\n      despachar urgente =\n        h0 = heap empty\n        h1 = heap push h0 50 \"backup-nocturno\"\n        h2 = heap push h1 10 \"alerta-seguridad\"\n        h3 = heap push h2 30 \"rotar-logs\"\n        heap peek h3\n```\n\n---\n\n## 5. Debaixo do capô: desempenho, memória RMM e garantias\n\n- **Garantia algorítmica e de segurança**: Rotações AVL estritas (`height diff <= 1`), imunidade total a HashDoS, consultas por intervalo em $O(\\log N + K)$ e fusão de heaps em $O(\\log N)$.\n- **Memória determinística (`RMM1`/`RMM2`)**: Zero pausas de coletor de lixo; todas as estruturas intermédias são libertadas de forma determinística à saída do escopo.\n- **Verificação contínua**: Testada exaustivamente com `stable check` e pela suite automatizada `src/test/ridgun/test_btree.rg`.\n"}, {"num": "05", "slug": "05-lib-tensor-tensores-multidimensionais", "file": "05-lib-tensor-tensores-multidimensionais.md", "title": "Capítulo 05: A lib `tensor` — Tensores Multidimensionais, Vistas e Contração de Einstein", "short_title": "A lib `tensor` — Tensores Multidimensionais, Vistas e Contração de Einstein", "markdown": "# Capítulo 05: A lib `tensor` — Tensores Multidimensionais, Vistas e Contração de Einstein\n\n## 1. Por que existe a lib `tensor`?\n\nSejamos sinceros: na maioria das linguagens tem de escolher entre listas aninhadas lentíssimas cheias de ponteiros dispersos ou ligar um monstro de C++/Fortran de 200 MB como o NumPy/BLAS.\n\nA lib **`tensor`** envolve a primitiva nativa `Tensor[...]` do Ridgun oferecendo criação tipada (`Tensor[Int]`, `Tensor[Real]`, `Tensor[U64]`), vistas sem cópia (`reshape`, `slice`), operações elemento a elemento (Hadamard), contração de Einstein e aritmética `BlaMka` de 64 bits.\n\n---\n\n## 2. Artefactos, importação e arquitetura sem `libc`\n\nNo `ridgun-libs`, **`tensor`** é uma **lib** de primeira classe localizada em `src/main/ridgun/lib/tensor.rg` (domínio `TENSOR`). Ao compilar com `stable bundle`, é empacotada em três formatos nativos:\n\n| Artefacto | Caminho | Finalidade |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/tensor.rglib` | Distribuição e importação direta com `import tensor` |\n| **Ficheiro compilado** | `target/tensor.rgc` | Artefacto intermédio verificado pelo `ridgunc` |\n| **Objeto partilhado ELF64** | `target/libtensor.so` | Biblioteca dinâmica nativa sem dependências de C nem `libc` |\n\n> Para utilizar esta lib em qualquer ficheiro `.rg`, basta declarar `import tensor` no topo e invocar as suas funções com espaços ou underscores.\n\n---\n\n## 3. Referência rápida da API de `tensor`\n\n| Assinatura / Função / Tipo | O que faz e quando usar |\n|---|---|\n| `tensor zeros int / tensor fill int / tensor zeros real` | Aloca blocos contíguos 1D/2D de `Tensor[Int]` e `Tensor[Real]` |\n| `tensor get 1d / tensor set 1d / tensor get 2d / tensor set 2d` | Acesso e atualização funcional Copy-on-Write (`with [i] = v`) |\n| `tensor reshape 1d to 2d / tensor slice 1d` | Vistas de descritor em $O(1)$ sem copiar o armazenamento do tensor |\n| `tensor add int / tensor mul int / tensor scale int` | Soma, multiplicação elemento a elemento (Hadamard) e escalonamento |\n| `tensor dot int / tensor matmul int` | Contração de índices de Einstein (`a[i] * b[i]`, `a[i, k] * b[k, j]`) |\n| `u64 blamka g / u64 rotr` | Mistura rotacional `U64` sem sinal de 64 bits para blocos criptográficos |\n\n---\n\n## 4. Receitas práticas em estilo tabular\n\n### Receita 1: Fluxo principal com `tensor`\n\nRepare como os sinais `=` e os passos de transformação ficam alinhados como uma tabela limpa:\n\n```ridgun\nimport tensor\n\nfn :: producto matricial tensor () => Tensor[Int]\n      producto matricial tensor =\n        a = tensor reshape 1d to 2d (tensor from list int [1, 2, 3, 4]) 2 2\n        b = tensor reshape 1d to 2d (tensor from list int [5, 6, 7, 8]) 2 2\n        tensor matmul int a b\n```\n\n### Receita 2: Composição segura e sem efeitos colaterais\n\nTodas as funções da lib `tensor` compõem-se perfeitamente com as restantes 32 libs do `ridgun-libs`:\n\n```ridgun\nimport tensor\n\nfn :: energia vector (xs : [Int]) => (Int, Int)\n      energia vector xs =\n        v   = tensor from list int xs\n        dot = tensor dot int v v\n        mx  = tensor max int v\n        (dot, mx)\n```\n\n---\n\n## 5. Debaixo do capô: desempenho, memória RMM e garantias\n\n- **Garantia algorítmica e de segurança**: Memória contígua de 8 bytes por célula gerida estaticamente por RMM1/RMM2, vistas em $O(1)$ sem duplicar o buffer e semântica pura Copy-on-Write.\n- **Memória determinística (`RMM1`/`RMM2`)**: Zero pausas de coletor de lixo; todas as estruturas intermédias são libertadas de forma determinística à saída do escopo.\n- **Verificação contínua**: Testada exaustivamente com `stable check` e pela suite automatizada `src/test/ridgun/test_tensor.rg`.\n"}, {"num": "06", "slug": "06-lib-linalg-algebra-linear-e-tensores", "file": "06-lib-linalg-algebra-linear-e-tensores.md", "title": "Capítulo 06: A lib `linalg` — Álgebra Linear sobre `Tensor[Real]`, Bareiss e Ativações", "short_title": "A lib `linalg` — Álgebra Linear sobre `Tensor[Real]`, Bareiss e Ativações", "markdown": "# Capítulo 06: A lib `linalg` — Álgebra Linear sobre `Tensor[Real]`, Bareiss e Ativações\n\n## 1. Por que existe a lib `linalg`?\n\nSejamos sinceros: quando precisa de calcular similaridade de cosseno para embeddings, resolver $A x = b$ ou avaliar uma camada `softmax` num binário leve, não quer arrastar 400 MB de PyTorch ou LAPACK.\n\nA lib **`linalg`** constrói álgebra linear numérica sobre `Tensor[Real]` nativo: transposição, traço, identidade, produto interno/externo, multiplicação matriz-vetor e matriz-matriz com notação de Einstein, normas ($L_1, L_2, L_\\infty$, Frobenius), determinante e resolução linear $A x = b$ por **Bareiss/Gauss com pivotamento parcial**, e ativações neuronais (`relu`, `sigmoid`, `softmax`).\n\n---\n\n## 2. Artefactos, importação e arquitetura sem `libc`\n\nNo `ridgun-libs`, **`linalg`** é uma **lib** de primeira classe localizada em `src/main/ridgun/lib/linalg.rg` (domínio `LINALG`). Ao compilar com `stable bundle`, é empacotada em três formatos nativos:\n\n| Artefacto | Caminho | Finalidade |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/linalg.rglib` | Distribuição e importação direta com `import linalg` |\n| **Ficheiro compilado** | `target/linalg.rgc` | Artefacto intermédio verificado pelo `ridgunc` |\n| **Objeto partilhado ELF64** | `target/liblinalg.so` | Biblioteca dinâmica nativa sem dependências de C nem `libc` |\n\n> Para utilizar esta lib em qualquer ficheiro `.rg`, basta declarar `import linalg` no topo e invocar as suas funções com espaços ou underscores.\n\n---\n\n## 3. Referência rápida da API de `linalg`\n\n| Assinatura / Função / Tipo | O que faz e quando usar |\n|---|---|\n| `linalg vec from list / linalg mat from lists` | Constrói `Tensor[Real]` 1D e 2D a partir de listas Ridgun |\n| `linalg transpose / linalg trace / linalg diag / linalg identity` | Transformações estruturais de matrizes e matriz identidade |\n| `linalg dot / linalg outer / linalg matvec / linalg matmul` | Einstein contraction (`a[i] * b[i]`, `a[i, k] * b[k, j]`) |\n| `linalg norm l1 / linalg norm l2 / linalg cosine similarity` | Normas vetoriais/matriciais, normalização e similaridade de cosseno |\n| `linalg det / linalg solve` | Determinante exato de Bareiss e resolução $A x = b$ com pivotamento parcial (`Option[Tensor[Real]]`) |\n| `linalg relu / linalg sigmoid / linalg softmax` | Ativações neuronais numericamente estáveis com deslocamento pelo máximo |\n\n---\n\n## 4. Receitas práticas em estilo tabular\n\n### Receita 1: Fluxo principal com `linalg`\n\nRepare como os sinais `=` e os passos de transformação ficam alinhados como uma tabela limpa:\n\n```ridgun\nimport linalg\n\nfn :: resolver sistema lineal () => Option[Tensor[Real]]\n      resolver sistema lineal =\n        -- Resuelve 2x + y = 5, x + 3y = 10 -> x = 1.0, y = 3.0\n        a = linalg mat from lists [[2.0, 1.0], [1.0, 3.0]]\n        b = linalg vec from list [5.0, 10.0]\n        linalg solve a b\n```\n\n### Receita 2: Composição segura e sem efeitos colaterais\n\nTodas as funções da lib `linalg` compõem-se perfeitamente com as restantes 32 libs do `ridgun-libs`:\n\n```ridgun\nimport linalg\n\nfn :: puntuar embeddings () => (Real, Tensor[Real])\n      puntuar embeddings =\n        q     = linalg vec from list [1.0, 2.0, 3.0]\n        d     = linalg vec from list [1.0, 2.0, 3.0]\n        sim   = linalg cosine similarity q d\n        probs = linalg softmax q\n        (sim, probs)\n```\n\n---\n\n## 5. Debaixo do capô: desempenho, memória RMM e garantias\n\n- **Garantia algorítmica e de segurança**: Matrizes singulares devolvem `None` de forma limpa em `linalg solve` (sem `NaN` silenciosos), e `linalg softmax` subtrai o máximo antes de exponenciar para evitar overflow.\n- **Memória determinística (`RMM1`/`RMM2`)**: Zero pausas de coletor de lixo; todas as estruturas intermédias são libertadas de forma determinística à saída do escopo.\n- **Verificação contínua**: Testada exaustivamente com `stable check` e pela suite automatizada `src/test/ridgun/test_linalg.rg`.\n"}, {"num": "07", "slug": "07-lib-codec-hex-base64-e-url", "file": "07-lib-codec-hex-base64-e-url.md", "title": "Capítulo 07: A lib `codec` — Hex, Base64, Base64url, URL Percent-Encoding e JSON Leve", "short_title": "A lib `codec` — Hex, Base64, Base64url, URL Percent-Encoding e JSON Leve", "markdown": "# Capítulo 07: A lib `codec` — Hex, Base64, Base64url, URL Percent-Encoding e JSON Leve\n\n## 1. Por que existe a lib `codec`?\n\nSejamos sinceros: nada quebra mais depressa uma integração web do que confundir Base64 padrão (`+/=`) com Base64url (`-_` sem preenchimento) num token JWT, ou construir uma query string sem escapar caracteres.\n\nA lib **`codec`** implementa as normas **RFC 4648** (Hex, Base64 e Base64url), **RFC 3986** (codificação percentual de URLs e `query encode` / `query decode`) e construtores/extratores rápidos de **JSON leve (RFC 8259)**.\n\n---\n\n## 2. Artefactos, importação e arquitetura sem `libc`\n\nNo `ridgun-libs`, **`codec`** é uma **lib** de primeira classe localizada em `src/main/ridgun/lib/codec.rg` (domínio `CODEC`). Ao compilar com `stable bundle`, é empacotada em três formatos nativos:\n\n| Artefacto | Caminho | Finalidade |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/codec.rglib` | Distribuição e importação direta com `import codec` |\n| **Ficheiro compilado** | `target/codec.rgc` | Artefacto intermédio verificado pelo `ridgunc` |\n| **Objeto partilhado ELF64** | `target/libcodec.so` | Biblioteca dinâmica nativa sem dependências de C nem `libc` |\n\n> Para utilizar esta lib em qualquer ficheiro `.rg`, basta declarar `import codec` no topo e invocar as suas funções com espaços ou underscores.\n\n---\n\n## 3. Referência rápida da API de `codec`\n\n| Assinatura / Função / Tipo | O que faz e quando usar |\n|---|---|\n| `hex encode / hex decode / hex is valid` | Codificação hexadecimal RFC 4648 em minúsculas e descodificação validada |\n| `base64 encode / base64 decode` | Base64 padrão RFC 4648 §4 com preenchimento `=` |\n| `base64url encode / base64url decode` | Base64url seguro para URLs RFC 4648 §5 (`-`, `_`, sem preenchimento) |\n| `url encode / url decode / query encode / query decode` | Codificação percentual RFC 3986 e dicionários de query string `k=v&...` |\n| `json quote / json object / json get str / json get int` | Serialização JSON rápida sem AST e extração de chaves de primeiro nível |\n\n---\n\n## 4. Receitas práticas em estilo tabular\n\n### Receita 1: Fluxo principal com `codec`\n\nRepare como os sinais `=` e os passos de transformação ficam alinhados como uma tabela limpa:\n\n```ridgun\nimport codec\n\nfn :: empaquetar parametros (usuario : String) (redir : String) => String\n      empaquetar parametros usuario redir =\n        token_b64 = base64url encode usuario\n        query encode [(\"token\", token_b64), (\"next\", redir)]\n```\n\n### Receita 2: Composição segura e sem efeitos colaterais\n\nTodas as funções da lib `codec` compõem-se perfeitamente com as restantes 32 libs do `ridgun-libs`:\n\n```ridgun\nimport codec\n\nfn :: construir respuesta rapida (id : Int) (nombre : String) => (String, Int)\n      construir respuesta rapida id nombre =\n        doc = json object [(\"id\", json int id), (\"name\", json quote nombre), (\"ok\", json bool True)]\n        leido = json get int doc \"id\" 0\n        (doc, leido)\n```\n\n---\n\n## 5. Debaixo do capô: desempenho, memória RMM e garantias\n\n- **Garantia algorítmica e de segurança**: Rejeição determinística de entradas hexadecimais ou Base64 malformadas (devolvendo `\"\"` sem leituras fora de limites) e reversibilidade exata $decode(encode(x)) == x$.\n- **Memória determinística (`RMM1`/`RMM2`)**: Zero pausas de coletor de lixo; todas as estruturas intermédias são libertadas de forma determinística à saída do escopo.\n- **Verificação contínua**: Testada exaustivamente com `stable check` e pela suite automatizada `src/test/ridgun/test_codec.rg`.\n"}, {"num": "08", "slug": "08-lib-json-parser-ast-e-consultas", "file": "08-lib-json-parser-ast-e-consultas.md", "title": "Capítulo 08: A lib `json` — Árvore AST Recursiva RFC 8259, Pretty-Printer e Consultas por Caminho", "short_title": "A lib `json` — Árvore AST Recursiva RFC 8259, Pretty-Printer e Consultas por Caminho", "markdown": "# Capítulo 08: A lib `json` — Árvore AST Recursiva RFC 8259, Pretty-Printer e Consultas por Caminho\n\n## 1. Por que existe a lib `json`?\n\nSejamos sinceros: navegar num JSON aninhado em muitas linguagens estáticas obriga a escrever páginas de código repetitivo ou encadear dez `.and_then()` antes de ler uma simples porta.\n\nA lib **`json`** fornece um analisador descendente recursivo completo para **RFC 8259** sobre o ADT algébrico `JsonVal` (`JnNull`, `JnBool`, `JnInt`, `JnStr`, `JnArr`, `JnObj`, `JnErr`), serialização compacta e indentada (`json pretty`) e consultas diretas por caminho com pontos (`\"server.http.port\"`, `\"users.0.name\"`).\n\n---\n\n## 2. Artefactos, importação e arquitetura sem `libc`\n\nNo `ridgun-libs`, **`json`** é uma **lib** de primeira classe localizada em `src/main/ridgun/lib/json.rg` (domínio `JSON`). Ao compilar com `stable bundle`, é empacotada em três formatos nativos:\n\n| Artefacto | Caminho | Finalidade |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/json.rglib` | Distribuição e importação direta com `import json` |\n| **Ficheiro compilado** | `target/json.rgc` | Artefacto intermédio verificado pelo `ridgunc` |\n| **Objeto partilhado ELF64** | `target/libjson.so` | Biblioteca dinâmica nativa sem dependências de C nem `libc` |\n\n> Para utilizar esta lib em qualquer ficheiro `.rg`, basta declarar `import json` no topo e invocar as suas funções com espaços ou underscores.\n\n---\n\n## 3. Referência rápida da API de `json`\n\n| Assinatura / Função / Tipo | O que faz e quando usar |\n|---|---|\n| `type JsonVal` | `JnNull | JnBool Bool | JnInt Int | JnStr String | JnArr [JsonVal] | JnObj [String JsonVal] | JnErr String` |\n| `json parse / json is ok` | Analisa texto JSON numa árvore `JsonVal` e valida a ausência de `JnErr` |\n| `json stringify / json pretty` | Serializa `JsonVal` em JSON compacto ou multilinha indentado |\n| `json get path / json get str / json get int / json get bool` | Percorre objetos e listas aninhados através de caminhos com pontos (`\"a.b.0.c\"`) |\n\n---\n\n## 4. Receitas práticas em estilo tabular\n\n### Receita 1: Fluxo principal com `json`\n\nRepare como os sinais `=` e os passos de transformação ficam alinhados como uma tabela limpa:\n\n```ridgun\nimport json\n\nfn :: leer config servidor (raw : String) => (String, Int, Bool)\n      leer config servidor raw =\n        doc  = json parse raw\n        host = json get str doc \"server.host\" \"127.0.0.1\"\n        port = json get int doc \"server.port\" 8080\n        tls  = json get bool doc \"server.tls.enabled\" False\n        (host, port, tls)\n```\n\n### Receita 2: Composição segura e sem efeitos colaterais\n\nTodas as funções da lib `json` compõem-se perfeitamente com as restantes 32 libs do `ridgun-libs`:\n\n```ridgun\nimport json\n\nfn :: construir manifiesto () => String\n      construir manifiesto =\n        nodo = JnObj [(\"app\", JnStr \"solstice\"), (\"workers\", JnInt 8), (\"tags\", JnArr [JnStr \"elf64\", JnStr \"rmm2\"])]\n        json pretty nodo 2\n```\n\n---\n\n## 5. Debaixo do capô: desempenho, memória RMM e garantias\n\n- **Garantia algorítmica e de segurança**: Rejeição estrita de lixo residual após o valor raiz (`trailing garbage`), tratamento completo de sequências de escape e retorno seguro de `JnErr` sem exceções.\n- **Memória determinística (`RMM1`/`RMM2`)**: Zero pausas de coletor de lixo; todas as estruturas intermédias são libertadas de forma determinística à saída do escopo.\n- **Verificação contínua**: Testada exaustivamente com `stable check` e pela suite automatizada `src/test/ridgun/test_json.rg`.\n"}, {"num": "09", "slug": "09-lib-csv-parser-rfc4180-e-tabelas", "file": "09-lib-csv-parser-rfc4180-e-tabelas.md", "title": "Capítulo 09: A lib `csv` — Analisador de Estados RFC 4180 para CSV/TSV e Tabelas Indexadas", "short_title": "A lib `csv` — Analisador de Estados RFC 4180 para CSV/TSV e Tabelas Indexadas", "markdown": "# Capítulo 09: A lib `csv` — Analisador de Estados RFC 4180 para CSV/TSV e Tabelas Indexadas\n\n## 1. Por que existe a lib `csv`?\n\nSejamos sinceros: toda a gente acha que analisar um CSV é fazer `str split linha \",\"`... até aparecer um campo entre aspas com uma vírgula lá dentro, aspas duplicadas `\"\"` ou uma quebra de linha `\\r\\n` a meio de uma célula.\n\nA lib **`csv`** implementa uma máquina de estados completa conforme a **RFC 4180** para CSV e TSV, serialização automática com aspas inteligentes e o tipo `CsvTable` para consultar colunas e linhas pelo nome do cabeçalho.\n\n---\n\n## 2. Artefactos, importação e arquitetura sem `libc`\n\nNo `ridgun-libs`, **`csv`** é uma **lib** de primeira classe localizada em `src/main/ridgun/lib/csv.rg` (domínio `CSV`). Ao compilar com `stable bundle`, é empacotada em três formatos nativos:\n\n| Artefacto | Caminho | Finalidade |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/csv.rglib` | Distribuição e importação direta com `import csv` |\n| **Ficheiro compilado** | `target/csv.rgc` | Artefacto intermédio verificado pelo `ridgunc` |\n| **Objeto partilhado ELF64** | `target/libcsv.so` | Biblioteca dinâmica nativa sem dependências de C nem `libc` |\n\n> Para utilizar esta lib em qualquer ficheiro `.rg`, basta declarar `import csv` no topo e invocar as suas funções com espaços ou underscores.\n\n---\n\n## 3. Referência rápida da API de `csv`\n\n| Assinatura / Função / Tipo | O que faz e quando usar |\n|---|---|\n| `csv parse / tsv parse / csv parse with` | Analisa texto CSV/TSV (incluindo células multilinha e escapes `\"\"`) em `[[String]]` |\n| `csv stringify / tsv stringify` | Serializa `[[String]]` colocando aspas apenas em células com delimitadores, aspas ou quebras |\n| `csv parse table / csv get cell / csv col` | Consulta sobre `CsvTable` indexada por cabeçalho `(linha, nome_col)` ou coluna inteira |\n| `csv row to kv / csv table to kv list` | Converte linhas tabulares em dicionários `[String String]` indexados pelo cabeçalho |\n\n---\n\n## 4. Receitas práticas em estilo tabular\n\n### Receita 1: Fluxo principal com `csv`\n\nRepare como os sinais `=` e os passos de transformação ficam alinhados como uma tabela limpa:\n\n```ridgun\nimport csv\n\nfn :: extraer columna precios (raw_csv : String) => ([String], String)\n      extraer columna precios raw_csv =\n        tabla   = csv parse table raw_csv\n        precios = csv col tabla \"precio\"\n        primero = csv get cell tabla 0 \"producto\" \"desconocido\"\n        (precios, primero)\n```\n\n### Receita 2: Composição segura e sem efeitos colaterais\n\nTodas as funções da lib `csv` compõem-se perfeitamente com as restantes 32 libs do `ridgun-libs`:\n\n```ridgun\nimport csv\n\nfn :: exportar informe () => String\n      exportar informe =\n        filas = [[\"id\", \"nota\"], [\"1\", \"Contiene, coma\"], [\"2\", \"Dijo \"hola\"\"]]\n        csv stringify filas\n```\n\n---\n\n## 5. Debaixo do capô: desempenho, memória RMM e garantias\n\n- **Garantia algorítmica e de segurança**: Suporte exato de quebras `\\r\\n` e `\\n` dentro e fora de aspas, e zero perda de dados em viagens de ida e volta `csv parse (csv stringify linhas)`.\n- **Memória determinística (`RMM1`/`RMM2`)**: Zero pausas de coletor de lixo; todas as estruturas intermédias são libertadas de forma determinística à saída do escopo.\n- **Verificação contínua**: Testada exaustivamente com `stable check` e pela suite automatizada `src/test/ridgun/test_csv.rg`.\n"}, {"num": "10", "slug": "10-lib-ini-configuracao-ini-e-dotenv", "file": "10-lib-ini-configuracao-ini-e-dotenv.md", "title": "Capítulo 10: A lib `ini` — Ficheiros `.ini` por Secções, `.env` e Interpolação de Variáveis", "short_title": "A lib `ini` — Ficheiros `.ini` por Secções, `.env` e Interpolação de Variáveis", "markdown": "# Capítulo 10: A lib `ini` — Ficheiros `.ini` por Secções, `.env` e Interpolação de Variáveis\n\n## 1. Por que existe a lib `ini`?\n\nSejamos sinceros: os ficheiros `.env` e `.ini` parecem triviais até alguém adicionar `export KEY=\"valor # com cardinal\"`, comentários `;` no fim da linha ou referências cruzadas entre variáveis.\n\nA lib **`ini`** analisa configurações `.ini` com secções (`[database]`) e ficheiros `.env` com prefixos `export`, preservando símbolos `#` e `;` dentro de aspas e resolvendo interpolações de variáveis em `dotenv parse`.\n\n---\n\n## 2. Artefactos, importação e arquitetura sem `libc`\n\nNo `ridgun-libs`, **`ini`** é uma **lib** de primeira classe localizada em `src/main/ridgun/lib/ini.rg` (domínio `INI`). Ao compilar com `stable bundle`, é empacotada em três formatos nativos:\n\n| Artefacto | Caminho | Finalidade |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/ini.rglib` | Distribuição e importação direta com `import ini` |\n| **Ficheiro compilado** | `target/ini.rgc` | Artefacto intermédio verificado pelo `ridgunc` |\n| **Objeto partilhado ELF64** | `target/libini.so` | Biblioteca dinâmica nativa sem dependências de C nem `libc` |\n\n> Para utilizar esta lib em qualquer ficheiro `.rg`, basta declarar `import ini` no topo e invocar as suas funções com espaços ou underscores.\n\n---\n\n## 3. Referência rápida da API de `ini`\n\n| Assinatura / Função / Tipo | O que faz e quando usar |\n|---|---|\n| `ini parse / ini stringify` | Analisa texto `.ini` por secções em `IniDoc` e serializa de volta para texto canónico |\n| `ini get / ini get int / ini get bool / ini set` | Consultas tipadas por secção+chave (`\"\"` para secção global) e atualização imutável |\n| `ini sections / ini section map` | Lista todos os nomes de secção ou extrai o mapa `[String String]` de uma secção |\n| `dotenv parse` | Analisa linhas `.env` (`export K=V`, aspas, comentários e expansão de variáveis) |\n\n---\n\n## 4. Receitas práticas em estilo tabular\n\n### Receita 1: Fluxo principal com `ini`\n\nRepare como os sinais `=` e os passos de transformação ficam alinhados como uma tabela limpa:\n\n```ridgun\nimport ini\n\nfn :: cargar base de datos (texto_ini : String) => (String, Int, Bool)\n      cargar base de datos texto_ini =\n        doc  = ini parse texto_ini\n        host = ini get doc \"database\" \"host\" \"localhost\"\n        port = ini get int doc \"database\" \"port\" 5432\n        pool = ini get bool doc \"database\" \"pool\" True\n        (host, port, pool)\n```\n\n### Receita 2: Composição segura e sem efeitos colaterais\n\nTodas as funções da lib `ini` compõem-se perfeitamente com as restantes 32 libs do `ridgun-libs`:\n\n```ridgun\nimport ini\n\nfn :: actualizar puerto (doc : IniDoc) (nuevo : String) => String\n      actualizar puerto doc nuevo =\n        doc2 = ini set doc \"database\" \"port\" nuevo\n        ini stringify doc2\n```\n\n---\n\n## 5. Debaixo do capô: desempenho, memória RMM e garantias\n\n- **Garantia algorítmica e de segurança**: Respeito total pelos caracteres `#` e `;` quando surgem entre aspas simples ou duplas, e conversão booleana flexível (`true/1/yes/on` vs `false/0/no/off`).\n- **Memória determinística (`RMM1`/`RMM2`)**: Zero pausas de coletor de lixo; todas as estruturas intermédias são libertadas de forma determinística à saída do escopo.\n- **Verificação contínua**: Testada exaustivamente com `stable check` e pela suite automatizada `src/test/ridgun/test_ini.rg`.\n"}, {"num": "11", "slug": "11-lib-regex-motor-thompson-nfa-linear", "file": "11-lib-regex-motor-thompson-nfa-linear.md", "title": "Capítulo 11: A lib `regex` — Motor de Expressões Regulares Thompson NFA em Tempo Linear $O(N \\cdot M)$", "short_title": "A lib `regex` — Motor de Expressões Regulares Thompson NFA em Tempo Linear $O(N \\cdot M)$", "markdown": "# Capítulo 11: A lib `regex` — Motor de Expressões Regulares Thompson NFA em Tempo Linear $O(N \\cdot M)$\n\n## 1. Por que existe a lib `regex`?\n\nSejamos sinceros: os motores de expressões regulares com *backtracking* já causaram quedas globais famosas (como na Cloudflare ou no StackOverflow) quando um padrão como `(a+)+b` recebe trinta `a` seguidos e entra em tempo exponencial $O(2^N)$.\n\nA lib **`regex`** compila as suas expressões regulares (`.`, `*`, `+`, `?`, `|`, `()`, `[a-z]`, `[^...]`, `^`, `$`, `\\d`, `\\w`, `\\s`) para um **autómato finito não determinístico de Thompson (NFA)** e avança o conjunto de estados passo a passo em tempo estritamente linear **$O(N \\cdot M)$**, tornando os ataques **ReDoS matematicamente impossíveis**.\n\n---\n\n## 2. Artefactos, importação e arquitetura sem `libc`\n\nNo `ridgun-libs`, **`regex`** é uma **lib** de primeira classe localizada em `src/main/ridgun/lib/regex.rg` (domínio `REGEX`). Ao compilar com `stable bundle`, é empacotada em três formatos nativos:\n\n| Artefacto | Caminho | Finalidade |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/regex.rglib` | Distribuição e importação direta com `import regex` |\n| **Ficheiro compilado** | `target/regex.rgc` | Artefacto intermédio verificado pelo `ridgunc` |\n| **Objeto partilhado ELF64** | `target/libregex.so` | Biblioteca dinâmica nativa sem dependências de C nem `libc` |\n\n> Para utilizar esta lib em qualquer ficheiro `.rg`, basta declarar `import regex` no topo e invocar as suas funções com espaços ou underscores.\n\n---\n\n## 3. Referência rápida da API de `regex`\n\n| Assinatura / Função / Tipo | O que faz e quando usar |\n|---|---|\n| `regex match / regex is match` | Correspondência de cadeia completa e pesquisa de subcadeia em tempo linear $O(N \\cdot M)$ |\n| `regex find / regex find all` | Extrai a primeira ou todas as subcadeias correspondentes sem sobreposição |\n| `regex replace / regex replace all` | Substitui a primeira ou todas as correspondências da expressão regular |\n| `regex split / regex escape` | Divide texto por um delimitador regex e escapa metacaracteres |\n\n---\n\n## 4. Receitas práticas em estilo tabular\n\n### Receita 1: Fluxo principal com `regex`\n\nRepare como os sinais `=` e os passos de transformação ficam alinhados como uma tabela limpa:\n\n```ridgun\nimport regex\n\nfn :: extraer codigos postales (texto : String) => [String]\n      extraer codigos postales texto =\n        regex find all \"\\\\d+\" texto\n```\n\n### Receita 2: Composição segura e sem efeitos colaterais\n\nTodas as funções da lib `regex` compõem-se perfeitamente com as restantes 32 libs do `ridgun-libs`:\n\n```ridgun\nimport regex\n\nfn :: censurar telefonos (comentario : String) => (Bool, String)\n      censurar telefonos comentario =\n        tiene = regex is match \"\\\\d+-\\\\d+\" comentario\n        limpio = regex replace all \"\\\\d+-\\\\d+\" comentario \"[TELEFONO]\"\n        (tiene, limpio)\n```\n\n---\n\n## 5. Debaixo do capô: desempenho, memória RMM e garantias\n\n- **Garantia algorítmica e de segurança**: Simulação de conjunto de estados NFA sem recursão descontrolada na pilha e tempo $O(N \\cdot M)$ garantido mesmo perante padrões patológicos `(a+)+b`.\n- **Memória determinística (`RMM1`/`RMM2`)**: Zero pausas de coletor de lixo; todas as estruturas intermédias são libertadas de forma determinística à saída do escopo.\n- **Verificação contínua**: Testada exaustivamente com `stable check` e pela suite automatizada `src/test/ridgun/test_regex.rg`.\n"}, {"num": "12", "slug": "12-lib-glob-wildcards-e-filtragem", "file": "12-lib-glob-wildcards-e-filtragem.md", "title": "Capítulo 12: A lib `glob` — Padrões de Wildcards (`*`, `?`, `[a-z]`) e Filtragem de Listas", "short_title": "A lib `glob` — Padrões de Wildcards (`*`, `?`, `[a-z]`) e Filtragem de Listas", "markdown": "# Capítulo 12: A lib `glob` — Padrões de Wildcards (`*`, `?`, `[a-z]`) e Filtragem de Listas\n\n## 1. Por que existe a lib `glob`?\n\nSejamos sinceros: usar uma expressão regular completa só para verificar se um ficheiro termina em `*.rg` ou começa por `test_[0-9]*.rg` é matar moscas com tiros de canhão.\n\nA lib **`glob`** implementa correspondência exata de wildcards de shell (`*`, `?`, classes `[a-z]`, classes negadas `[!0-9]` / `[^a-z]`), variantes insensíveis a maiúsculas (`glob match ci`) e filtragem direta de listas.\n\n---\n\n## 2. Artefactos, importação e arquitetura sem `libc`\n\nNo `ridgun-libs`, **`glob`** é uma **lib** de primeira classe localizada em `src/main/ridgun/lib/glob.rg` (domínio `GLOB`). Ao compilar com `stable bundle`, é empacotada em três formatos nativos:\n\n| Artefacto | Caminho | Finalidade |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/glob.rglib` | Distribuição e importação direta com `import glob` |\n| **Ficheiro compilado** | `target/glob.rgc` | Artefacto intermédio verificado pelo `ridgunc` |\n| **Objeto partilhado ELF64** | `target/libglob.so` | Biblioteca dinâmica nativa sem dependências de C nem `libc` |\n\n> Para utilizar esta lib em qualquer ficheiro `.rg`, basta declarar `import glob` no topo e invocar as suas funções com espaços ou underscores.\n\n---\n\n## 3. Referência rápida da API de `glob`\n\n| Assinatura / Função / Tipo | O que faz e quando usar |\n|---|---|\n| `glob match / glob match ci` | Correspondência de padrões glob sensível e insensível a maiúsculas ASCII |\n| `glob filter / glob any match` | Filtra `[String]` por padrão ou verifica se algum padrão de uma lista corresponde |\n| `glob has magic` | Deteta se uma cadeia contém metacaracteres de wildcard (`*`, `?`, `[`) |\n\n---\n\n## 4. Receitas práticas em estilo tabular\n\n### Receita 1: Fluxo principal com `glob`\n\nRepare como os sinais `=` e os passos de transformação ficam alinhados como uma tabela limpa:\n\n```ridgun\nimport glob\n\nfn :: seleccionar fuentes ridgun (archivos : [String]) => [String]\n      seleccionar fuentes ridgun archivos =\n        glob filter \"test_[a-z]*.rg\" archivos\n```\n\n### Receita 2: Composição segura e sem efeitos colaterais\n\nTodas as funções da lib `glob` compõem-se perfeitamente com as restantes 32 libs do `ridgun-libs`:\n\n```ridgun\nimport glob\n\nfn :: es ruta excluida (ruta : String) => Bool\n      es ruta excluida ruta =\n        glob any match [\"*.tmp\", \"*.bak\", \"target/*\"] ruta\n```\n\n---\n\n## 5. Debaixo do capô: desempenho, memória RMM e garantias\n\n- **Garantia algorítmica e de segurança**: Colapso automático de asteriscos consecutivos (`***` $\\rightarrow$ `*`) para evitar retrocessos redundantes e tratamento seguro de parênteses retos `[` não fechados.\n- **Memória determinística (`RMM1`/`RMM2`)**: Zero pausas de coletor de lixo; todas as estruturas intermédias são libertadas de forma determinística à saída do escopo.\n- **Verificação contínua**: Testada exaustivamente com `stable check` e pela suite automatizada `src/test/ridgun/test_glob.rg`.\n"}, {"num": "13", "slug": "13-lib-diff-comparacao-lcs-e-patches", "file": "13-lib-diff-comparacao-lcs-e-patches.md", "title": "Capítulo 13: A lib `diff` — Algoritmo LCS, Distância de Edição, Unified Diff e Patches", "short_title": "A lib `diff` — Algoritmo LCS, Distância de Edição, Unified Diff e Patches", "markdown": "# Capítulo 13: A lib `diff` — Algoritmo LCS, Distância de Edição, Unified Diff e Patches\n\n## 1. Por que existe a lib `diff`?\n\nSejamos sinceros: quando um teste falha ou um ficheiro de configuração muda, um seco `\"expected A, got B\"` de 200 linhas obriga-o a queimar as pestanas à procura da linha exata que mudou.\n\nA lib **`diff`** calcula a **Subsequência Comum Mais Longa (LCS)** sobre `Tensor[Int]` 2D para produzir edições mínimas (`DiffKeep`, `DiffAdd`, `DiffDel`), distância de edição, estatísticas, formato **Unified Diff** (`---`/`+++`/`@@`) e reconstrução exata com `diff apply`.\n\n---\n\n## 2. Artefactos, importação e arquitetura sem `libc`\n\nNo `ridgun-libs`, **`diff`** é uma **lib** de primeira classe localizada em `src/main/ridgun/lib/diff.rg` (domínio `DIFF`). Ao compilar com `stable bundle`, é empacotada em três formatos nativos:\n\n| Artefacto | Caminho | Finalidade |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/diff.rglib` | Distribuição e importação direta com `import diff` |\n| **Ficheiro compilado** | `target/diff.rgc` | Artefacto intermédio verificado pelo `ridgunc` |\n| **Objeto partilhado ELF64** | `target/libdiff.so` | Biblioteca dinâmica nativa sem dependências de C nem `libc` |\n\n> Para utilizar esta lib em qualquer ficheiro `.rg`, basta declarar `import diff` no topo e invocar as suas funções com espaços ou underscores.\n\n---\n\n## 3. Referência rápida da API de `diff`\n\n| Assinatura / Função / Tipo | O que faz e quando usar |\n|---|---|\n| `type DiffOp` | `DiffKeep String | DiffDel String | DiffAdd String` |\n| `diff lines / diff text` | Calcula o script mínimo de edição LCS entre listas `[String]` ou textos multilinha |\n| `diff edit distance / diff stats` | Distância mínima de inserção+remoção e contagem `(kept, added, deleted)` |\n| `diff format / diff unified` | Formata linhas compactas `+ / - /  ` ou Unified Diff padrão com cabeçalhos |\n| `diff apply / diff apply text` | Reconstrói o documento de destino sem perdas a partir de um script de edição |\n\n---\n\n## 4. Receitas práticas em estilo tabular\n\n### Receita 1: Fluxo principal com `diff`\n\nRepare como os sinais `=` e os passos de transformação ficam alinhados como uma tabela limpa:\n\n```ridgun\nimport diff\n\nfn :: auditar cambio (antes : String) (despues : String) => (Int, String)\n      auditar cambio antes despues =\n        dist   = diff edit distance ( [\"host=localhost\", \"port=8080\"] ) ( [\"host=0.0.0.0\", \"port=8080\"] )\n        parche = diff unified \"config.old\" \"config.new\" antes despues\n        (dist, parche)\n```\n\n### Receita 2: Composição segura e sem efeitos colaterais\n\nTodas as funções da lib `diff` compõem-se perfeitamente com as restantes 32 libs do `ridgun-libs`:\n\n```ridgun\nimport diff\n\nfn :: verificar parche (orig : [String]) (nuevo : [String]) => [String]\n      verificar parche orig nuevo =\n        ops = diff lines orig nuevo\n        diff apply ops\n```\n\n---\n\n## 5. Debaixo do capô: desempenho, memória RMM e garantias\n\n- **Garantia algorítmica e de segurança**: Identidade matemática garantida $diff\\_edit\\_distance(a, b) == |a| + |b| - 2 \\cdot LCS(a, b)$ e reconstrução sem perdas `diff apply (diff lines a b) == b`.\n- **Memória determinística (`RMM1`/`RMM2`)**: Zero pausas de coletor de lixo; todas as estruturas intermédias são libertadas de forma determinística à saída do escopo.\n- **Verificação contínua**: Testada exaustivamente com `stable check` e pela suite automatizada `src/test/ridgun/test_diff.rg`.\n"}, {"num": "14", "slug": "14-lib-template-templates-mustache-seguros", "file": "14-lib-template-templates-mustache-seguros.md", "title": "Capítulo 14: A lib `template` — Templates Mustache Seguros com Auto-Escape HTML e LaTeX", "short_title": "A lib `template` — Templates Mustache Seguros com Auto-Escape HTML e LaTeX", "markdown": "# Capítulo 14: A lib `template` — Templates Mustache Seguros com Auto-Escape HTML e LaTeX\n\n## 1. Por que existe a lib `template`?\n\nSejamos sinceros: montar páginas HTML ou relatórios LaTeX concatenando cadeias à mão é a receita perfeita para uma vulnerabilidade XSS (`<script>`) ou para que um simples `%` ou `_` quebre o seu PDF.\n\nA lib **`template`** oferece um motor **Mustache** sem lógica arbitrária com auto-escape contextual (`TmplPlain`, `TmplHtml`, `TmplLatex`), substituição bruta explícita (`{{{raw}}}` / `{{&raw}}`), comentários (`{{! ... }}`), secções condicionais (`{{#sec}}...{{/sec}}`) e invertidas (`{{^sec}}...{{/sec}}`).\n\n---\n\n## 2. Artefactos, importação e arquitetura sem `libc`\n\nNo `ridgun-libs`, **`template`** é uma **lib** de primeira classe localizada em `src/main/ridgun/lib/template.rg` (domínio `TMPL`). Ao compilar com `stable bundle`, é empacotada em três formatos nativos:\n\n| Artefacto | Caminho | Finalidade |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/template.rglib` | Distribuição e importação direta com `import template` |\n| **Ficheiro compilado** | `target/template.rgc` | Artefacto intermédio verificado pelo `ridgunc` |\n| **Objeto partilhado ELF64** | `target/libtemplate.so` | Biblioteca dinâmica nativa sem dependências de C nem `libc` |\n\n> Para utilizar esta lib em qualquer ficheiro `.rg`, basta declarar `import template` no topo e invocar as suas funções com espaços ou underscores.\n\n---\n\n## 3. Referência rápida da API de `template`\n\n| Assinatura / Função / Tipo | O que faz e quando usar |\n|---|---|\n| `tmpl render / tmpl render html / tmpl render latex` | Renderiza templates Mustache com auto-escape simples, HTML ou LaTeX |\n| `tmpl escape html / tmpl escape latex` | Escapa `& < > \" '` para HTML ou `\\ { } & % $ # _ ~ ^` para LaTeX |\n| `tmpl extract vars / tmpl has unclosed tags` | Extrai os nomes das variáveis necessárias e valida o fecho das etiquetas |\n\n---\n\n## 4. Receitas práticas em estilo tabular\n\n### Receita 1: Fluxo principal com `template`\n\nRepare como os sinais `=` e os passos de transformação ficam alinhados como uma tabela limpa:\n\n```ridgun\nimport template\n\nfn :: renderizar perfil html (usuario : String) (es_admin : String) => String\n      renderizar perfil html usuario es_admin =\n        plantilla = \"<h1>Hola {{user}}</h1>{{#admin}}<span class='badge'>Admin</span>{{/admin}}\"\n        vars      = [(\"user\", usuario), (\"admin\", es_admin)]\n        tmpl render html plantilla vars\n```\n\n### Receita 2: Composição segura e sem efeitos colaterais\n\nTodas as funções da lib `template` compõem-se perfeitamente com as restantes 32 libs do `ridgun-libs`:\n\n```ridgun\nimport template\n\nfn :: generar linea latex (metrica : String) => String\n      generar linea latex metrica =\n        -- Escapa automaticamente % _ & # para que LaTeX no falle\n        tmpl render latex \"Resultado: {{val}}\" [(\"val\", metrica)]\n```\n\n---\n\n## 5. Debaixo do capô: desempenho, memória RMM e garantias\n\n- **Garantia algorítmica e de segurança**: Prevenção de XSS por omissão em `tmpl render html` (escapando `&`, `<`, `>`, `\"`, `'`), enquanto `{{{var}}}` permite injetar fragmentos confiáveis explicitamente.\n- **Memória determinística (`RMM1`/`RMM2`)**: Zero pausas de coletor de lixo; todas as estruturas intermédias são libertadas de forma determinística à saída do escopo.\n- **Verificação contínua**: Testada exaustivamente com `stable check` e pela suite automatizada `src/test/ridgun/test_template.rg`.\n"}, {"num": "15", "slug": "15-lib-fmt-formatador-tabular-e-realcador", "file": "15-lib-fmt-formatador-tabular-e-realcador.md", "title": "Capítulo 15: A lib `fmt` — Formatador Tabular Canónico 2D e Realçador de Sintaxe em 9 Formatos", "short_title": "A lib `fmt` — Formatador Tabular Canónico 2D e Realçador de Sintaxe em 9 Formatos", "markdown": "# Capítulo 15: A lib `fmt` — Formatador Tabular Canónico 2D e Realçador de Sintaxe em 9 Formatos\n\n## 1. Por que existe a lib `fmt`?\n\nSejamos sinceros: a beleza do código Ridgun reside nas suas colunas tabulares perfeitamente alinhadas (`::`, `=`, `|`, `->`, `--`), mas alinhar espaços à mão ou exportar código colorido para terminal, HTML e LaTeX é trabalhoso.\n\nA lib **`fmt`** é o motor oficial de formatação tabular 2D e realce léxico do Ridgun: alinha assinaturas `fn ::`, equações, guardas `|` e comentários `--`, e exporta para **9 formatos de saída** (`FmtPlain`, `FmtTty`, `FmtTrueColor`, `FmtHtmlInline`, `FmtHtmlCss`, `FmtMarkdown`, `FmtPango`, `FmtLatex`, `FmtRtf`).\n\n---\n\n## 2. Artefactos, importação e arquitetura sem `libc`\n\nNo `ridgun-libs`, **`fmt`** é uma **lib** de primeira classe localizada em `src/main/ridgun/lib/fmt.rg` (domínio `FMT`). Ao compilar com `stable bundle`, é empacotada em três formatos nativos:\n\n| Artefacto | Caminho | Finalidade |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/fmt.rglib` | Distribuição e importação direta com `import fmt` |\n| **Ficheiro compilado** | `target/fmt.rgc` | Artefacto intermédio verificado pelo `ridgunc` |\n| **Objeto partilhado ELF64** | `target/libfmt.so` | Biblioteca dinâmica nativa sem dependências de C nem `libc` |\n\n> Para utilizar esta lib em qualquer ficheiro `.rg`, basta declarar `import fmt` no topo e invocar as suas funções com espaços ou underscores.\n\n---\n\n## 3. Referência rápida da API de `fmt`\n\n| Assinatura / Função / Tipo | O que faz e quando usar |\n|---|---|\n| `fmt source / fmt source with` | Formata código-fonte Ridgun usando o alinhamento tabular 2D canónico |\n| `fmt check` | Devolve `True` se o código já cumprir o formato tabular canónico de `fmt source` |\n| `fmt render / fmt render with` | Formata e realça o código para qualquer um dos 9 formatos `FmtTarget` |\n| `fmt tokenize line` | Tokeniza uma linha em `TokKeyword`, `TokType`, `TokOperator`, `TokString`, `TokNumber`, `TokComment` |\n\n---\n\n## 4. Receitas práticas em estilo tabular\n\n### Receita 1: Fluxo principal com `fmt`\n\nRepare como os sinais `=` e os passos de transformação ficam alinhados como uma tabela limpa:\n\n```ridgun\nimport fmt\n\nfn :: formatear y verificar (codigo : String) => (String, Bool)\n      formatear y verificar codigo =\n        limpio = fmt source codigo\n        es_ok  = fmt check limpio\n        (limpio, es_ok)\n```\n\n### Receita 2: Composição segura e sem efeitos colaterais\n\nTodas as funções da lib `fmt` compõem-se perfeitamente com as restantes 32 libs do `ridgun-libs`:\n\n```ridgun\nimport fmt\n\nfn :: exportar bloque html (codigo : String) => String\n      exportar bloque html codigo =\n        fmt render codigo FmtHtmlCss\n```\n\n---\n\n## 5. Debaixo do capô: desempenho, memória RMM e garantias\n\n- **Garantia algorítmica e de segurança**: Idempotência estrita (`fmt source (fmt source s) == fmt source s`) e preservação de 100 % dos tokens semânticos.\n- **Memória determinística (`RMM1`/`RMM2`)**: Zero pausas de coletor de lixo; todas as estruturas intermédias são libertadas de forma determinística à saída do escopo.\n- **Verificação contínua**: Testada exaustivamente com `stable check` e pela suite automatizada `src/test/ridgun/test_fmt.rg`.\n"}, {"num": "16", "slug": "16-lib-cli-argumentos-e-ambiente", "file": "16-lib-cli-argumentos-e-ambiente.md", "title": "Capítulo 16: A lib `cli` — Flags, Opções, Barreira `--`, Subcomandos e Variáveis de Ambiente", "short_title": "A lib `cli` — Flags, Opções, Barreira `--`, Subcomandos e Variáveis de Ambiente", "markdown": "# Capítulo 16: A lib `cli` — Flags, Opções, Barreira `--`, Subcomandos e Variáveis de Ambiente\n\n## 1. Por que existe a lib `cli`?\n\nSejamos sinceros: analisar `argv` à mão começa sempre com um ciclo inocente e acaba por quebrar quando alguém passa `-la` agrupado, `--port=9090` com sinal de igual ou `--` seguido de um ficheiro começado por hífen.\n\nA lib **`cli`** resolve flags longas (`--verbose`), curtas (`-v`), agrupadas (`-la`), opções com valor (`--port=8080`, `--port 8080`, `-p 8080`), o separador POSIX `--`, argumentos posicionais, subcomandos e leitura tipada de variáveis de ambiente.\n\n---\n\n## 2. Artefactos, importação e arquitetura sem `libc`\n\nNo `ridgun-libs`, **`cli`** é uma **lib** de primeira classe localizada em `src/main/ridgun/lib/cli.rg` (domínio `CLI`). Ao compilar com `stable bundle`, é empacotada em três formatos nativos:\n\n| Artefacto | Caminho | Finalidade |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/cli.rglib` | Distribuição e importação direta com `import cli` |\n| **Ficheiro compilado** | `target/cli.rgc` | Artefacto intermédio verificado pelo `ridgunc` |\n| **Objeto partilhado ELF64** | `target/libcli.so` | Biblioteca dinâmica nativa sem dependências de C nem `libc` |\n\n> Para utilizar esta lib em qualquer ficheiro `.rg`, basta declarar `import cli` no topo e invocar as suas funções com espaços ou underscores.\n\n---\n\n## 3. Referência rápida da API de `cli`\n\n| Assinatura / Função / Tipo | O que faz e quando usar |\n|---|---|\n| `cli has flag : [String] -> String -> String -> Bool` | Deteta `--long`, `-s` ou flags agrupadas `-xyz` antes de `--` |\n| `cli get opt / cli get int opt` | Extrai opção de texto ou inteira (`--k=v`, `--k v`, `-k v`) com valor padrão |\n| `cli positionals / cli subcommand` | Recolhe os argumentos posicionais (incluindo tudo o que sucede a `--`) |\n| `env get or / env get int or / env get bool or` | Lê variáveis de ambiente com conversão tipada e valores padrão |\n\n---\n\n## 4. Receitas práticas em estilo tabular\n\n### Receita 1: Fluxo principal com `cli`\n\nRepare como os sinais `=` e os passos de transformação ficam alinhados como uma tabela limpa:\n\n```ridgun\nimport cli\n\nfn :: analizar comando (args : [String]) => (String, Bool, Int, [String])\n      analizar comando args =\n        sub   = cli subcommand args\n        all_f = cli has flag args \"--all\" \"-a\"\n        port  = cli get int opt args \"--port\" \"-p\" 8080\n        arch  = cli positionals args [\"--port\", \"-p\"]\n        (sub, all_f, port, arch)\n```\n\n### Receita 2: Composição segura e sem efeitos colaterais\n\nTodas as funções da lib `cli` compõem-se perfeitamente com as restantes 32 libs do `ridgun-libs`:\n\n```ridgun\nimport cli\n\nfn :: leer config entorno () => (Int, Bool)\n      leer config entorno =\n        workers = env get int or \"SOLSTICE_WORKERS\" 4\n        debug   = env get bool or \"SOLSTICE_DEBUG\" False\n        (workers, debug)\n```\n\n---\n\n## 5. Debaixo do capô: desempenho, memória RMM e garantias\n\n- **Garantia algorítmica e de segurança**: Respeito estrito pelo separador POSIX `--`: nenhum argumento à direita de `--` é jamais interpretado como flag.\n- **Memória determinística (`RMM1`/`RMM2`)**: Zero pausas de coletor de lixo; todas as estruturas intermédias são libertadas de forma determinística à saída do escopo.\n- **Verificação contínua**: Testada exaustivamente com `stable check` e pela suite automatizada `src/test/ridgun/test_cli.rg`.\n"}, {"num": "17", "slug": "17-lib-path-caminhos-posix-e-seguranca", "file": "17-lib-path-caminhos-posix-e-seguranca.md", "title": "Capítulo 17: A lib `path` — Normalização POSIX (`path clean`) e Confinamento contra Path Traversal", "short_title": "A lib `path` — Normalização POSIX (`path clean`) e Confinamento contra Path Traversal", "markdown": "# Capítulo 17: A lib `path` — Normalização POSIX (`path clean`) e Confinamento contra Path Traversal\n\n## 1. Por que existe a lib `path`?\n\nSejamos sinceros: juntar caminhos com `base + \"/\" + ficheiro` sem limpar segmentos `..` nem validar prefixos é deixar a porta aberta para alguém pedir `../../etc/passwd` no seu servidor web.\n\nA lib **`path`** implementa normalização léxica POSIX (`path clean`), junção segura (`path join`), extração de componentes (`dirname`, `basename`, `stem`, `ext`, `replace ext`) e o predicado de segurança **`path is safe subpath`** (`VUL-INJ-001`) contra *path traversal*.\n\n---\n\n## 2. Artefactos, importação e arquitetura sem `libc`\n\nNo `ridgun-libs`, **`path`** é uma **lib** de primeira classe localizada em `src/main/ridgun/lib/path.rg` (domínio `PATH`). Ao compilar com `stable bundle`, é empacotada em três formatos nativos:\n\n| Artefacto | Caminho | Finalidade |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/path.rglib` | Distribuição e importação direta com `import path` |\n| **Ficheiro compilado** | `target/path.rgc` | Artefacto intermédio verificado pelo `ridgunc` |\n| **Objeto partilhado ELF64** | `target/libpath.so` | Biblioteca dinâmica nativa sem dependências de C nem `libc` |\n\n> Para utilizar esta lib em qualquer ficheiro `.rg`, basta declarar `import path` no topo e invocar as suas funções com espaços ou underscores.\n\n---\n\n## 3. Referência rápida da API de `path`\n\n| Assinatura / Função / Tipo | O que faz e quando usar |\n|---|---|\n| `path clean / path join / path join list` | Colapsa `//`, `.` e `..` lexicamente e junta segmentos de caminho |\n| `path dirname / path basename / path split` | Divide um caminho em diretório pai e nome de ficheiro final |\n| `path ext / path stem / path replace ext` | Extrai ou substitui a extensão (tratando `.bashrc` como raiz `.bashrc` e ext `\"\"`) |\n| `path is safe subpath : String -> String -> Bool` | Verifica que `rel` permanece estritamente dentro de `base_dir` e sem bytes NUL |\n\n---\n\n## 4. Receitas práticas em estilo tabular\n\n### Receita 1: Fluxo principal com `path`\n\nRepare como os sinais `=` e os passos de transformação ficam alinhados como uma tabela limpa:\n\n```ridgun\nimport path\n\nfn :: resolver archivo estatico (raiz : String) (peticion : String) => (Bool, String)\n      resolver archivo estatico raiz peticion =\n        seguro = path is safe subpath raiz peticion\n        ruta   = path join raiz peticion\n        (seguro, ruta)\n```\n\n### Receita 2: Composição segura e sem efeitos colaterais\n\nTodas as funções da lib `path` compõem-se perfeitamente com as restantes 32 libs do `ridgun-libs`:\n\n```ridgun\nimport path\n\nfn :: cambiar salida a objeto (fuente : String) => (String, String, String)\n      cambiar salida a objeto fuente =\n        dir = path dirname fuente\n        nom = path stem fuente\n        obj = path replace ext (path clean fuente) \".rglib\"\n        (dir, nom, obj)\n```\n\n---\n\n## 5. Debaixo do capô: desempenho, memória RMM e garantias\n\n- **Garantia algorítmica e de segurança**: `path is safe subpath` rejeita caminhos absolutos, bytes NUL e qualquer sequência `..` que tente escapar do diretório base ou atingir um prefixo irmão (`/srv/www-secret`).\n- **Memória determinística (`RMM1`/`RMM2`)**: Zero pausas de coletor de lixo; todas as estruturas intermédias são libertadas de forma determinística à saída do escopo.\n- **Verificação contínua**: Testada exaustivamente com `stable check` e pela suite automatizada `src/test/ridgun/test_path.rg`.\n"}, {"num": "18", "slug": "18-lib-time-calendario-utc-iso8601-e-backoff", "file": "18-lib-time-calendario-utc-iso8601-e-backoff.md", "title": "Capítulo 18: A lib `time` — Calendário Civil UTC (Hinnant), ISO-8601, Durações e Backoff", "short_title": "A lib `time` — Calendário Civil UTC (Hinnant), ISO-8601, Durações e Backoff", "markdown": "# Capítulo 18: A lib `time` — Calendário Civil UTC (Hinnant), ISO-8601, Durações e Backoff\n\n## 1. Por que existe a lib `time`?\n\nSejamos sinceros: as funções de data da `libc` (`localtime`, `gmtime`, `mktime`) dependem de estado global mutável (`TZ`), não são seguras entre threads e falham frequentemente nas regras de anos bissextos.\n\nA lib **`time`** implementa o algoritmo de calendário civil gregoriano proléptico em **$O(1)$ de Howard Hinnant**, formatação e análise estrita **ISO-8601 / RFC 3339** (`YYYY-MM-DDTHH:MM:SSZ`), durações legíveis (`1h 1m 1s 5ms`) e cálculo de *exponential backoff* limitado.\n\n---\n\n## 2. Artefactos, importação e arquitetura sem `libc`\n\nNo `ridgun-libs`, **`time`** é uma **lib** de primeira classe localizada em `src/main/ridgun/lib/time.rg` (domínio `TIME`). Ao compilar com `stable bundle`, é empacotada em três formatos nativos:\n\n| Artefacto | Caminho | Finalidade |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/time.rglib` | Distribuição e importação direta com `import time` |\n| **Ficheiro compilado** | `target/time.rgc` | Artefacto intermédio verificado pelo `ridgunc` |\n| **Objeto partilhado ELF64** | `target/libtime.so` | Biblioteca dinâmica nativa sem dependências de C nem `libc` |\n\n> Para utilizar esta lib em qualquer ficheiro `.rg`, basta declarar `import time` no topo e invocar as suas funções com espaços ou underscores.\n\n---\n\n## 3. Referência rápida da API de `time`\n\n| Assinatura / Função / Tipo | O que faz e quando usar |\n|---|---|\n| `time epoch to utc / time utc to epoch` | Conversão em $O(1)$ entre segundos Unix epoch e `(year, month, day, hour, min, sec)` |\n| `time is leap year / time days in month / time day of week` | Regras de ano bissexto (`400 / 100 / 4`), dias do mês e dia ISO da semana (`1=Seg..7=Dom`) |\n| `time format iso8601 / time parse iso8601` | Formata e valida marcas `YYYY-MM-DDTHH:MM:SSZ` (`-1` em datas inválidas como 30 de fev) |\n| `time format duration ms / time backoff ms` | Durações legíveis e tempos de espera exponenciais limitados $base \\cdot 2^{attempt}$ |\n\n---\n\n## 4. Receitas práticas em estilo tabular\n\n### Receita 1: Fluxo principal com `time`\n\nRepare como os sinais `=` e os passos de transformação ficam alinhados como uma tabela limpa:\n\n```ridgun\nimport time\n\nfn :: registrar evento temporal (epoch_s : Int) => (String, Int, String)\n      registrar evento temporal epoch_s =\n        iso = time format iso8601 epoch_s\n        sem = time day of week epoch_s\n        dur = time format duration ms 3661005\n        (iso, sem, dur)\n```\n\n### Receita 2: Composição segura e sem efeitos colaterais\n\nTodas as funções da lib `time` compõem-se perfeitamente com as restantes 32 libs do `ridgun-libs`:\n\n```ridgun\nimport time\n\nfn :: planificar reintentos () => [Int]\n      planificar reintentos =\n        [time backoff ms 0 100 5000, time backoff ms 1 100 5000, time backoff ms 2 100 5000, time backoff ms 9 100 5000]\n```\n\n---\n\n## 5. Debaixo do capô: desempenho, memória RMM e garantias\n\n- **Garantia algorítmica e de segurança**: Conversão de calendário em $O(1)$ sem ciclos ano a ano e validação estrita de dias por mês (rejeitando 29 de fevereiro em anos não bissextos).\n- **Memória determinística (`RMM1`/`RMM2`)**: Zero pausas de coletor de lixo; todas as estruturas intermédias são libertadas de forma determinística à saída do escopo.\n- **Verificação contínua**: Testada exaustivamente com `stable check` e pela suite automatizada `src/test/ridgun/test_time.rg`.\n"}, {"num": "19", "slug": "19-lib-uuid-identificadores-crc32-e-prng", "file": "19-lib-uuid-identificadores-crc32-e-prng.md", "title": "Capítulo 19: A lib `uuid` — RFC 9562 `UUIDv4`/`UUIDv7`, FNV-1a, Adler-32, CRC-32 e PRNG", "short_title": "A lib `uuid` — RFC 9562 `UUIDv4`/`UUIDv7`, FNV-1a, Adler-32, CRC-32 e PRNG", "markdown": "# Capítulo 19: A lib `uuid` — RFC 9562 `UUIDv4`/`UUIDv7`, FNV-1a, Adler-32, CRC-32 e PRNG\n\n## 1. Por que existe a lib `uuid`?\n\nSejamos sinceros: usar `UUIDv4` totalmente aleatórios como chave primária numa base de dados fragmenta os índices B-Tree, enquanto inventar IDs caseiros sem entropia do kernel acaba em colisões.\n\nA lib **`uuid`** implementa **`UUIDv4`** (aleatório com CSPRNG do kernel) e **`UUIDv7`** (ordenado cronologicamente nos primeiros 48 bits segundo a **RFC 9562**), *checksums* rápidos (**FNV-1a**, **Adler-32**, **CRC-32 IEEE 802.3**) e um PRNG determinístico com semente.\n\n---\n\n## 2. Artefactos, importação e arquitetura sem `libc`\n\nNo `ridgun-libs`, **`uuid`** é uma **lib** de primeira classe localizada em `src/main/ridgun/lib/uuid.rg` (domínio `UUID`). Ao compilar com `stable bundle`, é empacotada em três formatos nativos:\n\n| Artefacto | Caminho | Finalidade |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/uuid.rglib` | Distribuição e importação direta com `import uuid` |\n| **Ficheiro compilado** | `target/uuid.rgc` | Artefacto intermédio verificado pelo `ridgunc` |\n| **Objeto partilhado ELF64** | `target/libuuid.so` | Biblioteca dinâmica nativa sem dependências de C nem `libc` |\n\n> Para utilizar esta lib em qualquer ficheiro `.rg`, basta declarar `import uuid` no topo e invocar as suas funções com espaços ou underscores.\n\n---\n\n## 3. Referência rápida da API de `uuid`\n\n| Assinatura / Função / Tipo | O que faz e quando usar |\n|---|---|\n| `uuid v4 / uuid v7 / uuid v7 at` | Gera UUIDs canónicos de 36 caracteres RFC 9562 v4 (aleatório) e v7 (ordenado no tempo) |\n| `uuid is valid / uuid version` | Valida o formato 8-4-4-4-12 e os bits de variante RFC 9562 (`8, 9, a, b`) |\n| `fnv1a 32 / adler32 / crc32 / crc32 hex` | Hashes não criptográficos e *checksums* rápidos de 32 bits |\n| `prng
