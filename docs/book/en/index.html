  <script>
    const CHAPTERS = [{"num": "00", "slug": "00-why-do-i-need-ridgun-libs", "file": "00-why-do-i-need-ridgun-libs.md", "title": "Chapter 00: Why Do I Need `ridgun-libs`? 32 Libs Without a Single Line of C? Tell Me More!", "short_title": "Why Do I Need `ridgun-libs`? 32 Libs Without a Single Line of C? Tell Me More!", "markdown": "# Chapter 00: Why Do I Need `ridgun-libs`? 32 Libs Without a Single Line of C? Tell Me More!\n\nLet's be honest: when you discover a language that compiles down to a tiny native ELF binary with no garbage collector, the very next question you ask yourself—and rightly so—is:\n\n> *\"Okay, the language itself is great... but the moment I need to open a TCP socket, hash a password with Argon2id, parse JSON, solve a linear system on tensors, or spin up an actor pool, am I going to have to link `libc`, `OpenSSL`, `libcurl`, and `pcre2`, or pull in 800 third-party packages maintained by strangers?\"*\n\nThat is an excellent question. And the short answer is: **no**. That is exactly why **`ridgun-libs`** exists: a suite of **32 foundational libs** written in **100% pure Ridgun (`v0.9.16`)**, with **zero C dependencies** and **zero `libc`**.\n\nLet's put a name to the four daily pains that `ridgun-libs` eliminates for good.\n\n---\n\n## Pain #1: \"The `libc`, OpenSSL, and Cross-Linking Nightmare\"\n\nYou have almost certainly lived through this horror movie:\n\n1. You write a supposedly \"portable\" server or CLI tool.\n2. As soon as you need cryptography (`SHA-256`, `Argon2id`, `ChaCha20-Poly1305`), networking (`DNS`, `HTTP`, `WebSockets`), or regular expressions, your binary ends up dynamically coupled to `glibc 2.38`, `libssl.so.3`, and C headers.\n3. You copy the binary to a minimal container or an older Linux host and it crashes at startup with the infamous `version 'GLIBC_2.38' not found`.\n\n**What changes with `ridgun-libs`?**\nEvery single one of the 32 libs in this repository is written in pure tabular Ridgun. System libs talk directly to the OS kernel via the Platform Abstraction Layer (`posix`), while data, math, and crypto libs execute in deterministic compiled memory (`RMM1`/`RMM2`). Every lib compiles to portable Ridgun bundles (`.rglib` / `.rgc`) and native ELF64 shared objects (`lib*.so`). Zero `libc`, zero fragile FFI glue, zero deployment surprises.\n\n---\n\n## Pain #2: \"The 400-Dependency `node_modules` / `Cargo.lock` Syndrome\"\n\nIn many modern ecosystems, the standard library is so bare-bones that reading an `.ini` file, validating a `UUIDv7`, applying a Unified Diff patch, or rendering an auto-escaped HTML template requires pulling in half a dozen external packages—each with its own error types, conventions, and supply-chain risk.\n\nIn **`ridgun-libs`**, all **32 libs** share a single, cohesive design philosophy:\n\n```ridgun\nimport crypto\nimport json\nimport http\n\nfn :: autenticar y pedir (token : String) => String\n      autenticar y pedir token =\n        -- Every lib shares pure types, tabular alignment, and deterministic semantics\n        mac_hex = sha256 hex token\n        cuerpo  = json stringify (JnObj [(\"token_sha256\", JnStr mac_hex)])\n        pet     = http build request \"POST\" \"/v1/sesion\" [(\"Content-Type\", \"application/json\")] cuerpo\n        pet\n```\n\nSame tabular aesthetic, same immutable ADTs (`Option`, `Result`, `IoResult`, `JsonVal`), zero hidden side effects.\n\n---\n\n## Pain #3: \"Catastrophic Backtracking Regexes (ReDoS) and Hanging Sockets\"\n\nTwo classic production time bombs:\n\n- A malicious user sends a crafted string that drives a backtracking regex engine into $O(2^N)$ exponential time, pinning a CPU core at 100%.\n- A network peer stalls mid-stream and your worker blocks forever on a `read()` with no deadline.\n\nIn **`ridgun-libs`**:\n- The **`regex`** lib (Chapter 11) is built on a **Thompson NFA** engine that guarantees strict **$O(N \\cdot M)$ linear time**—immune to ReDoS by construction.\n- The **`posix`**, **`io`**, and **`socket`** libs (Chapters 22, 23, and 27) enforce lexical `with timeout` deadlines and `ppoll` readiness checks on every descriptor operation.\n\n---\n\n## Pain #4: \"Cryptography and Linear Algebra That Read Like Hieroglyphics\"\n\nIn **`ridgun-libs`**, Ridgun's native `Tensor[...]` types allow libs like **`tensor`** (Chapter 05), **`linalg`** (Chapter 06), and **`argon2id`** (Chapter 25) to operate over contiguous memory blocks (`Tensor[U64 * 8 * 16]`, `Tensor[Real]`) while keeping the clarity of a mathematical table.\n\n---\n\n## Complete Book Map: 32 Chapters for 32 Libs\n\nEvery chapter in this book is dedicated to **one lib** in `ridgun-libs`, organized in a clean bottom-up progression:\n\n| Chapters | Lib Family | Libs Covered |\n|---|---|---|\n| **01 – 04** | Text, Mathematics & Data Structures | `str`, `math`, `list`, `btree` |\n| **05 – 06** | Tensors & Linear Algebra | `tensor`, `linalg` |\n| **07 – 10** | Encoding & Data Formats | `codec`, `json`, `csv`, `ini` |\n| **11 – 15** | Text Engines, Diffs, Templates & Formatting | `regex`, `glob`, `diff`, `template`, `fmt` |\n| **16 – 21** | CLI, Paths, Time, UUIDs, Logging & Testing | `cli`, `path`, `time`, `uuid`, `log`, `test` |\n| **22 – 23** | POSIX Systems & Timeout-Bounded I/O | `posix`, `io` |\n| **24 – 26** | Cryptography, Argon2id & JWT Tokens | `crypto`, `argon2id`, `jwt` |\n| **27 – 29** | Networking, Kernel Sockets, HTTP/1.1 & WebSockets | `socket`, `http`, `ws` |\n| **30 – 32** | Actor Concurrency, Worker Pools & Network Supervision | `agent`, `pool`, `net_agent` |\n\nLet's dive right in! Turn to **Chapter 01 (`str`)** and start building.\n"}, {"num": "01", "slug": "01-lib-str-text-manipulation", "file": "01-lib-str-text-manipulation.md", "title": "Chapter 01: The `str` Lib — Text Manipulation, Search, and Tabular Padding", "short_title": "The `str` Lib — Text Manipulation, Search, and Tabular Padding", "markdown": "# Chapter 01: The `str` Lib — Text Manipulation, Search, and Tabular Padding\n\n## 1. Why Does the `str` Lib Exist?\n\nLet's be honest: manipulating strings in C with `strtok` and `strncpy` is a minefield of buffer overflows and null pointers, while in higher-level languages you often pull in external packages just to pad tabular output or repeat a delimiter in $O(\\log N)$.\n\nThe **`str`** lib provides pure, immutable primitives for searching, trimming, splitting, joining, ASCII case conversion, $O(\\log N)$ binary-doubling repetition, and column padding.\n\n---\n\n## 2. Bundles, Imports, and Zero-`libc` Architecture\n\nIn `ridgun-libs`, **`str`** is a first-class **lib** located at `src/main/ridgun/lib/str.rg` (domain `STR`). When built with `stable bundle`, it compiles into three native artifacts:\n\n| Artifact | Path | Purpose |\n|---|---|---|\n| **Ridgun Bundle** | `target/bundles/str.rglib` | Portable distribution and direct `import str` resolution |\n| **Compiled Archive** | `target/str.rgc` | Type-checked intermediate artifact verified by `ridgunc` |\n| **ELF64 Shared Object** | `target/libstr.so` | Native dynamic shared library with zero C or `libc` dependencies |\n\n> To use this lib in any `.rg` file, simply add `import str` at the top and call its functions using either multi-word spaces or underscores.\n\n---\n\n## 3. Quick API Reference for `str`\n\n| Signature / Function / Type | Purpose & Usage |\n|---|---|\n| `str index of : String -> String -> Int` | First index of needle in haystack (`-1` if absent / empty needle `0`) |\n| `str contains / str starts with / str ends with` | `Bool` substring, prefix, and suffix predicates |\n| `str trim / str trim left / str trim right` | Strip ASCII whitespace (` `, `\\t`, `\\n`, `\\r`) |\n| `str split / str lines / str words / str join` | Split into `[String]` and join lists with a separator |\n| `str replace / str to upper / str to lower` | Non-overlapping replacement and ASCII case conversion |\n| `str repeat / str pad left / str pad right` | $O(\\log N)$ repetition and fixed-width column padding |\n\n---\n\n## 4. Practical Tabular Recipes\n\n### Recipe 1: Core Workflow with `str`\n\nNotice how the `=` signs and transformation steps align into a clean, scannable table:\n\n```ridgun\nimport str\n\nfn :: normalizar cabecera (raw : String) => String\n      normalizar cabecera raw =\n        limpia = str to lower (str trim raw)\n        partes = str words limpia\n        slug   = str join partes \"-\"\n        str pad right slug 24 \".\"\n```\n\n### Recipe 2: Safe, Side-Effect-Free Composition\n\nEvery function in the `str` lib composes seamlessly with the rest of the 32 libs in `ridgun-libs`:\n\n```ridgun\nimport str\n\nfn :: extraer dominio (correo : String) => String\n      extraer dominio correo =\n        pos = str index of correo \"@\"\n        | pos < 0   = \"sin-dominio\"\n        | otherwise =\n          partes = str split correo \"@\"\n          str replace (str to lower correo) \"@\" \" en \"\n```\n\n---\n\n## 5. Under the Hood: Performance, RMM Memory, and Guarantees\n\n- **Algorithmic & Safety Guarantee**: $O(\\log N)$ repetition via binary string doubling, safe handling of empty needles, and zero in-place mutation.\n- **Deterministic Memory (`RMM1`/`RMM2`)**: Zero garbage-collector pauses; all intermediate allocations are reclaimed deterministically on scope exit.\n- **Continuous Verification**: Statically checked via `stable check` and tested by the automated suite in `src/test/ridgun/test_str.rg`.\n"}, {"num": "02", "slug": "02-lib-math-safe-arithmetic-and-number-theory", "file": "02-lib-math-safe-arithmetic-and-number-theory.md", "title": "Chapter 02: The `math` Lib — Safe Division, Number Theory, and Statistics", "short_title": "The `math` Lib — Safe Division, Number Theory, and Statistics", "markdown": "# Chapter 02: The `math` Lib — Safe Division, Number Theory, and Statistics\n\n## 1. Why Does the `math` Lib Exist?\n\nLet's be honest: an unexpected division by zero in production or the `%` operator returning negative remainders in C or Java has crashed more services than anyone likes to admit.\n\nThe **`math`** lib provides total division primitives safe against `d == 0` (`div ceil`, `div floor`, `div euclid`, `mod euclid`), $O(\\log E)$ modular exponentiation and inverse, integer roots/logs, combinatorics, primality testing, and the `clamp x between lo and hi` mixfix operator.\n\n---\n\n## 2. Bundles, Imports, and Zero-`libc` Architecture\n\nIn `ridgun-libs`, **`math`** is a first-class **lib** located at `src/main/ridgun/lib/math.rg` (domain `MATH`). When built with `stable bundle`, it compiles into three native artifacts:\n\n| Artifact | Path | Purpose |\n|---|---|---|\n| **Ridgun Bundle** | `target/bundles/math.rglib` | Portable distribution and direct `import math` resolution |\n| **Compiled Archive** | `target/math.rgc` | Type-checked intermediate artifact verified by `ridgunc` |\n| **ELF64 Shared Object** | `target/libmath.so` | Native dynamic shared library with zero C or `libc` dependencies |\n\n> To use this lib in any `.rg` file, simply add `import math` at the top and call its functions using either multi-word spaces or underscores.\n\n---\n\n## 3. Quick API Reference for `math`\n\n| Signature / Function / Type | Purpose & Usage |\n|---|---|\n| `math abs / math sign / math min / math max` | Magnitude, sign (`-1, 0, 1`), and extrema |\n| `clamp x between lo and hi` | Mixfix operator (`op ::`) clamping `x` into `[lo, hi]` |\n| `math div ceil / math div floor / math div euclid / math mod euclid` | Division-by-zero-safe rounding and non-negative Euclidean remainder |\n| `math pow / math isqrt / math ilog2 / math ilog10` | $O(\\log E)$ power, Newton integer square root, and integer logarithms |\n| `math gcd / math lcm / math mod pow / math mod inv / math is prime` | Euclidean GCD/LCM, modular arithmetic, and $6k \\pm 1$ primality |\n| `math sum / math mean floor / math median floor / math variance floor` | Overflow-safe combinatorics (`nCr`) and integer list statistics |\n\n---\n\n## 4. Practical Tabular Recipes\n\n### Recipe 1: Core Workflow with `math`\n\nNotice how the `=` signs and transformation steps align into a clean, scannable table:\n\n```ridgun\nimport math\n\nfn :: verificar clave modular (base : Int) (primo : Int) => (Int, Int, Bool)\n      verificar clave modular base primo =\n        es_p = math is prime primo\n        pot  = math mod pow base (primo - 1) primo\n        inv  = math mod inv base primo\n        (pot, inv, es_p)\n```\n\n### Recipe 2: Safe, Side-Effect-Free Composition\n\nEvery function in the `math` lib composes seamlessly with the rest of the 32 libs in `ridgun-libs`:\n\n```ridgun\nimport math\n\nfn :: calcular paginas y cuota (items : Int) (por_pag : Int) (uso : Int) => (Int, Int)\n      calcular paginas y cuota items por_pag uso =\n        pags  = math div ceil items por_pag\n        cuota = clamp uso between 0 and 100\n        (pags, cuota)\n```\n\n---\n\n## 5. Under the Hood: Performance, RMM Memory, and Guarantees\n\n- **Algorithmic & Safety Guarantee**: Total arithmetic functions (returning `0` on `<= 0` divisors instead of raising `SIGFPE`), free of floating-point rounding drift.\n- **Deterministic Memory (`RMM1`/`RMM2`)**: Zero garbage-collector pauses; all intermediate allocations are reclaimed deterministically on scope exit.\n- **Continuous Verification**: Statically checked via `stable check` and tested by the automated suite in `src/test/ridgun/test_math.rg`.\n"}, {"num": "03", "slug": "03-lib-list-slicing-mergesort-and-kv-maps", "file": "03-lib-list-slicing-mergesort-and-kv-maps.md", "title": "Chapter 03: The `list` Lib — Slicing, $O(N \\log N)$ Mergesort, and Associative KV Maps", "short_title": "The `list` Lib — Slicing, $O(N \\log N)$ Mergesort, and Associative KV Maps", "markdown": "# Chapter 03: The `list` Lib — Slicing, $O(N \\log N)$ Mergesort, and Associative KV Maps\n\n## 1. Why Does the `list` Lib Exist?\n\nLet's be honest: out-of-bounds index panics (`IndexError` / `panic!`) and accidental mutation of shared lists are two of the most common bugs in everyday collection processing.\n\nThe **`list`** lib provides default-safe indexing, slicing (`take`, `drop`, `slice`), stepped ranges, stable deduplication, **$O(N \\log N)$ mergesort** for `[Int]` and `[String]`, and immutable `[String String]` key-value maps (`kv get`, `kv put`, `kv merge`).\n\n---\n\n## 2. Bundles, Imports, and Zero-`libc` Architecture\n\nIn `ridgun-libs`, **`list`** is a first-class **lib** located at `src/main/ridgun/lib/list.rg` (domain `LIST`). When built with `stable bundle`, it compiles into three native artifacts:\n\n| Artifact | Path | Purpose |\n|---|---|---|\n| **Ridgun Bundle** | `target/bundles/list.rglib` | Portable distribution and direct `import list` resolution |\n| **Compiled Archive** | `target/list.rgc` | Type-checked intermediate artifact verified by `ridgunc` |\n| **ELF64 Shared Object** | `target/liblist.so` | Native dynamic shared library with zero C or `libc` dependencies |\n\n> To use this lib in any `.rg` file, simply add `import list` at the top and call its functions using either multi-word spaces or underscores.\n\n---\n\n## 3. Quick API Reference for `list`\n\n| Signature / Function / Type | Purpose & Usage |\n|---|---|\n| `list nth or / list str nth or` | Safe index lookup returning `default_val` when out of bounds |\n| `list take / list drop / list slice / list reverse` | Prefix, suffix, subrange `[start, end)`, and tail-recursive reversal |\n| `list range / list range step` | Generate arithmetic sequences (`step == 0` safely returns `[]`) |\n| `list sort / list str sort / list dedup / list str dedup` | Stable $O(N \\log N)$ top-down mergesort and first-seen deduplication |\n| `kv empty / kv put / kv get / kv get or / kv remove / kv merge` | Ordered associative `[String String]` key-value dictionary operations |\n\n---\n\n## 4. Practical Tabular Recipes\n\n### Recipe 1: Core Workflow with `list`\n\nNotice how the `=` signs and transformation steps align into a clean, scannable table:\n\n```ridgun\nimport list\n\nfn :: top tres unicos (puntos : [Int]) => [Int]\n      top tres unicos puntos =\n        unicos    = list dedup puntos\n        ordenados = list reverse (list sort unicos)\n        list take ordenados 3\n```\n\n### Recipe 2: Safe, Side-Effect-Free Composition\n\nEvery function in the `list` lib composes seamlessly with the rest of the 32 libs in `ridgun-libs`:\n\n```ridgun\nimport list\n\nfn :: configurar entorno (base : [String String]) => (String, [String])\n      configurar entorno base =\n        cfg1 = kv put base \"host\" \"0.0.0.0\"\n        cfg2 = kv put cfg1 \"port\" \"8080\"\n        host = kv get or cfg2 \"host\" \"127.0.0.1\"\n        (host, kv keys cfg2)\n```\n\n---\n\n## 5. Under the Hood: Performance, RMM Memory, and Guarantees\n\n- **Algorithmic & Safety Guarantee**: Worst-case $O(N \\log N)$ deterministic mergesort (immune to Quicksort's $O(N^2)$ adversarial inputs) and insertion-order preservation on `kv` maps.\n- **Deterministic Memory (`RMM1`/`RMM2`)**: Zero garbage-collector pauses; all intermediate allocations are reclaimed deterministically on scope exit.\n- **Continuous Verification**: Statically checked via `stable check` and tested by the automated suite in `src/test/ridgun/test_list.rg`.\n"}, {"num": "04", "slug": "04-lib-btree-persistent-avl-maps-sets-and-heaps", "file": "04-lib-btree-persistent-avl-maps-sets-and-heaps.md", "title": "Chapter 04: The `btree` Lib — Persistent $O(\\log N)$ AVL Maps, Sets, and Priority Queues", "short_title": "The `btree` Lib — Persistent $O(\\log N)$ AVL Maps, Sets, and Priority Queues", "markdown": "# Chapter 04: The `btree` Lib — Persistent $O(\\log N)$ AVL Maps, Sets, and Priority Queues\n\n## 1. Why Does the `btree` Lib Exist?\n\nLet's be honest: mutable hash tables are vulnerable to hash-flooding (HashDoS), cannot answer ordered range queries cleanly, and cannot be safely shared across concurrent actors without cloning or locking.\n\nThe **`btree`** lib implements three persistent $O(\\log N)$ functional data structures with structural sharing: **`BTreeMap`** (self-balancing AVL tree), **`BTreeSet`** (ordered set algebra), and **`MinHeap`** (leftist priority queue).\n\n---\n\n## 2. Bundles, Imports, and Zero-`libc` Architecture\n\nIn `ridgun-libs`, **`btree`** is a first-class **lib** located at `src/main/ridgun/lib/btree.rg` (domain `BTREE`). When built with `stable bundle`, it compiles into three native artifacts:\n\n| Artifact | Path | Purpose |\n|---|---|---|\n| **Ridgun Bundle** | `target/bundles/btree.rglib` | Portable distribution and direct `import btree` resolution |\n| **Compiled Archive** | `target/btree.rgc` | Type-checked intermediate artifact verified by `ridgunc` |\n| **ELF64 Shared Object** | `target/libbtree.so` | Native dynamic shared library with zero C or `libc` dependencies |\n\n> To use this lib in any `.rg` file, simply add `import btree` at the top and call its functions using either multi-word spaces or underscores.\n\n---\n\n## 3. Quick API Reference for `btree`\n\n| Signature / Function / Type | Purpose & Usage |\n|---|---|\n| `btree empty / btree insert / btree get / btree remove` | Persistent $O(\\log N)$ AVL dictionary lookup, insertion, and deletion |\n| `btree min key / btree max key / btree range` | Ordered extrema and range query `[lo, hi]` |\n| `bset from list / bset union / bset intersect / bset diff` | Ordered set operations (`BTreeSet`) and subset predicate |\n| `heap empty / heap push / heap peek / heap pop / heap sort` | Leftist `MinHeap` priority queue with $O(\\log N)$ merge |\n\n---\n\n## 4. Practical Tabular Recipes\n\n### Recipe 1: Core Workflow with `btree`\n\nNotice how the `=` signs and transformation steps align into a clean, scannable table:\n\n```ridgun\nimport btree\n\nfn :: consultar rango precios () => [String String]\n      consultar rango precios =\n        t0 = btree empty\n        t1 = btree insert t0 \"item:10\" \"Teclado\"\n        t2 = btree insert t1 \"item:20\" \"Monitor\"\n        t3 = btree insert t2 \"item:30\" \"Raton\"\n        btree range t3 \"item:10\" \"item:25\"\n```\n\n### Recipe 2: Safe, Side-Effect-Free Composition\n\nEvery function in the `btree` lib composes seamlessly with the rest of the 32 libs in `ridgun-libs`:\n\n```ridgun\nimport btree\n\nfn :: despachar urgente () => (Int, String)\n      despachar urgente =\n        h0 = heap empty\n        h1 = heap push h0 50 \"backup-nocturno\"\n        h2 = heap push h1 10 \"alerta-seguridad\"\n        h3 = heap push h2 30 \"rotar-logs\"\n        heap peek h3\n```\n\n---\n\n## 5. Under the Hood: Performance, RMM Memory, and Guarantees\n\n- **Algorithmic & Safety Guarantee**: Strict AVL balance invariant (`|height_l - height_r| <= 1`), complete HashDoS immunity, $O(\\log N + K)$ range queries, and $O(\\log N)$ leftist heap merging.\n- **Deterministic Memory (`RMM1`/`RMM2`)**: Zero garbage-collector pauses; all intermediate allocations are reclaimed deterministically on scope exit.\n- **Continuous Verification**: Statically checked via `stable check` and tested by the automated suite in `src/test/ridgun/test_btree.rg`.\n"}, {"num": "05", "slug": "05-lib-tensor-multi-dimensional-tensors", "file": "05-lib-tensor-multi-dimensional-tensors.md", "title": "Chapter 05: The `tensor` Lib — Multi-Dimensional Tensors, Views, and Einstein Contraction", "short_title": "The `tensor` Lib — Multi-Dimensional Tensors, Views, and Einstein Contraction", "markdown": "# Chapter 05: The `tensor` Lib — Multi-Dimensional Tensors, Views, and Einstein Contraction\n\n## 1. Why Does the `tensor` Lib Exist?\n\nLet's be honest: in most languages you either suffer pointer-chasing nested lists or link a 200 MB C++/Fortran behemoth like NumPy or OpenBLAS.\n\nThe **`tensor`** lib wraps Ridgun's native `Tensor[...]` primitive with typed constructors (`Tensor[Int]`, `Tensor[Real]`, `Tensor[U64]`), zero-copy views (`reshape`, `slice`), Hadamard elementwise ops, Einstein summation contraction, and 64-bit `BlaMka` mixing.\n\n---\n\n## 2. Bundles, Imports, and Zero-`libc` Architecture\n\nIn `ridgun-libs`, **`tensor`** is a first-class **lib** located at `src/main/ridgun/lib/tensor.rg` (domain `TENSOR`). When built with `stable bundle`, it compiles into three native artifacts:\n\n| Artifact | Path | Purpose |\n|---|---|---|\n| **Ridgun Bundle** | `target/bundles/tensor.rglib` | Portable distribution and direct `import tensor` resolution |\n| **Compiled Archive** | `target/tensor.rgc` | Type-checked intermediate artifact verified by `ridgunc` |\n| **ELF64 Shared Object** | `target/libtensor.so` | Native dynamic shared library with zero C or `libc` dependencies |\n\n> To use this lib in any `.rg` file, simply add `import tensor` at the top and call its functions using either multi-word spaces or underscores.\n\n---\n\n## 3. Quick API Reference for `tensor`\n\n| Signature / Function / Type | Purpose & Usage |\n|---|---|\n| `tensor zeros int / tensor fill int / tensor zeros real` | Allocate contiguous 1D/2D `Tensor[Int]` and `Tensor[Real]` blocks |\n| `tensor get 1d / tensor set 1d / tensor get 2d / tensor set 2d` | Functional Copy-on-Write (`with [i] = v`) element access and update |\n| `tensor reshape 1d to 2d / tensor slice 1d` | Metadata-only descriptor views over shared tensor storage |\n| `tensor add int / tensor mul int / tensor scale int` | Elementwise Hadamard addition, multiplication, and scalar scaling |\n| `tensor dot int / tensor matmul int` | Einstein index contraction (`a[i] * b[i]`, `a[i, k] * b[k, j]`) |\n| `u64 blamka g / u64 rotr` | 64-bit unsigned `U64` rotational mixing for cryptographic blocks |\n\n---\n\n## 4. Practical Tabular Recipes\n\n### Recipe 1: Core Workflow with `tensor`\n\nNotice how the `=` signs and transformation steps align into a clean, scannable table:\n\n```ridgun\nimport tensor\n\nfn :: producto matricial tensor () => Tensor[Int]\n      producto matricial tensor =\n        a = tensor reshape 1d to 2d (tensor from list int [1, 2, 3, 4]) 2 2\n        b = tensor reshape 1d to 2d (tensor from list int [5, 6, 7, 8]) 2 2\n        tensor matmul int a b\n```\n\n### Recipe 2: Safe, Side-Effect-Free Composition\n\nEvery function in the `tensor` lib composes seamlessly with the rest of the 32 libs in `ridgun-libs`:\n\n```ridgun\nimport tensor\n\nfn :: energia vector (xs : [Int]) => (Int, Int)\n      energia vector xs =\n        v   = tensor from list int xs\n        dot = tensor dot int v v\n        mx  = tensor max int v\n        (dot, mx)\n```\n\n---\n\n## 5. Under the Hood: Performance, RMM Memory, and Guarantees\n\n- **Algorithmic & Safety Guarantee**: Contiguous 8-byte-aligned storage statically managed by RMM1/RMM2, $O(1)$ descriptor views without buffer duplication, and pure Copy-on-Write semantics.\n- **Deterministic Memory (`RMM1`/`RMM2`)**: Zero garbage-collector pauses; all intermediate allocations are reclaimed deterministically on scope exit.\n- **Continuous Verification**: Statically checked via `stable check` and tested by the automated suite in `src/test/ridgun/test_tensor.rg`.\n"}, {"num": "06", "slug": "06-lib-linalg-linear-algebra-and-solvers", "file": "06-lib-linalg-linear-algebra-and-solvers.md", "title": "Chapter 06: The `linalg` Lib — `Tensor[Real]` Linear Algebra, Bareiss Solver, and Activations", "short_title": "The `linalg` Lib — `Tensor[Real]` Linear Algebra, Bareiss Solver, and Activations", "markdown": "# Chapter 06: The `linalg` Lib — `Tensor[Real]` Linear Algebra, Bareiss Solver, and Activations\n\n## 1. Why Does the `linalg` Lib Exist?\n\nLet's be honest: when you need cosine similarity for embeddings, an exact $A x = b$ linear solver, or a numerically stable `softmax` layer inside a lightweight service, you shouldn't have to ship 400 MB of PyTorch or LAPACK.\n\nThe **`linalg`** lib builds numerical linear algebra directly on native `Tensor[Real]`: transpose, trace, identity, inner/outer products, Einstein-contracted `matvec` and `matmul`, norms ($L_1, L_2, L_\\infty$, Frobenius), partial-pivoting **Bareiss/Gaussian** determinant and $A x = b$ solver, plus neural activations (`relu`, `sigmoid`, `softmax`).\n\n---\n\n## 2. Bundles, Imports, and Zero-`libc` Architecture\n\nIn `ridgun-libs`, **`linalg`** is a first-class **lib** located at `src/main/ridgun/lib/linalg.rg` (domain `LINALG`). When built with `stable bundle`, it compiles into three native artifacts:\n\n| Artifact | Path | Purpose |\n|---|---|---|\n| **Ridgun Bundle** | `target/bundles/linalg.rglib` | Portable distribution and direct `import linalg` resolution |\n| **Compiled Archive** | `target/linalg.rgc` | Type-checked intermediate artifact verified by `ridgunc` |\n| **ELF64 Shared Object** | `target/liblinalg.so` | Native dynamic shared library with zero C or `libc` dependencies |\n\n> To use this lib in any `.rg` file, simply add `import linalg` at the top and call its functions using either multi-word spaces or underscores.\n\n---\n\n## 3. Quick API Reference for `linalg`\n\n| Signature / Function / Type | Purpose & Usage |\n|---|---|\n| `linalg vec from list / linalg mat from lists` | Construct 1D and 2D `Tensor[Real]` from Ridgun lists |\n| `linalg transpose / linalg trace / linalg diag / linalg identity` | Structural matrix transforms and identity constructors |\n| `linalg dot / linalg outer / linalg matvec / linalg matmul` | Einstein contraction (`a[i] * b[i]`, `a[i, k] * b[k, j]`) |\n| `linalg norm l1 / linalg norm l2 / linalg cosine similarity` | Vector/matrix norms, normalization, and cosine similarity |\n| `linalg det / linalg solve` | Exact division-free Bareiss determinant and partial-pivoting $A x = b$ solver (`Option[Tensor[Real]]`) |\n| `linalg relu / linalg sigmoid / linalg softmax` | Max-shifted numerically stable neural layer activations |\n\n---\n\n## 4. Practical Tabular Recipes\n\n### Recipe 1: Core Workflow with `linalg`\n\nNotice how the `=` signs and transformation steps align into a clean, scannable table:\n\n```ridgun\nimport linalg\n\nfn :: resolver sistema lineal () => Option[Tensor[Real]]\n      resolver sistema lineal =\n        -- Resuelve 2x + y = 5, x + 3y = 10 -> x = 1.0, y = 3.0\n        a = linalg mat from lists [[2.0, 1.0], [1.0, 3.0]]\n        b = linalg vec from list [5.0, 10.0]\n        linalg solve a b\n```\n\n### Recipe 2: Safe, Side-Effect-Free Composition\n\nEvery function in the `linalg` lib composes seamlessly with the rest of the 32 libs in `ridgun-libs`:\n\n```ridgun\nimport linalg\n\nfn :: puntuar embeddings () => (Real, Tensor[Real])\n      puntuar embeddings =\n        q     = linalg vec from list [1.0, 2.0, 3.0]\n        d     = linalg vec from list [1.0, 2.0, 3.0]\n        sim   = linalg cosine similarity q d\n        probs = linalg softmax q\n        (sim, probs)\n```\n\n---\n\n## 5. Under the Hood: Performance, RMM Memory, and Guarantees\n\n- **Algorithmic & Safety Guarantee**: Singular matrices cleanly return `None` in `linalg solve` (no silent `NaN` propagation), and `linalg softmax` shifts by the maximum logit before exponentiating to prevent overflow.\n- **Deterministic Memory (`RMM1`/`RMM2`)**: Zero garbage-collector pauses; all intermediate allocations are reclaimed deterministically on scope exit.\n- **Continuous Verification**: Statically checked via `stable check` and tested by the automated suite in `src/test/ridgun/test_linalg.rg`.\n"}, {"num": "07", "slug": "07-lib-codec-hex-base64-and-url-encoding", "file": "07-lib-codec-hex-base64-and-url-encoding.md", "title": "Chapter 07: The `codec` Lib — RFC 4648 Hex, Base64, Base64url, and URL Percent-Encoding", "short_title": "The `codec` Lib — RFC 4648 Hex, Base64, Base64url, and URL Percent-Encoding", "markdown": "# Chapter 07: The `codec` Lib — RFC 4648 Hex, Base64, Base64url, and URL Percent-Encoding\n\n## 1. Why Does the `codec` Lib Exist?\n\nLet's be honest: nothing breaks a web integration faster than mixing up standard Base64 (`+/=`) with unpadded URL-safe Base64url (`-_`) inside a JWT, or building query strings by naive string concatenation.\n\nThe **`codec`** lib implements **RFC 4648** (Hex, Base64, and URL-safe Base64url), **RFC 3986** (URL percent-encoding and `query encode` / `query decode`), and lightweight **RFC 8259 JSON** builders and field extractors.\n\n---\n\n## 2. Bundles, Imports, and Zero-`libc` Architecture\n\nIn `ridgun-libs`, **`codec`** is a first-class **lib** located at `src/main/ridgun/lib/codec.rg` (domain `CODEC`). When built with `stable bundle`, it compiles into three native artifacts:\n\n| Artifact | Path | Purpose |\n|---|---|---|\n| **Ridgun Bundle** | `target/bundles/codec.rglib` | Portable distribution and direct `import codec` resolution |\n| **Compiled Archive** | `target/codec.rgc` | Type-checked intermediate artifact verified by `ridgunc` |\n| **ELF64 Shared Object** | `target/libcodec.so` | Native dynamic shared library with zero C or `libc` dependencies |\n\n> To use this lib in any `.rg` file, simply add `import codec` at the top and call its functions using either multi-word spaces or underscores.\n\n---\n\n## 3. Quick API Reference for `codec`\n\n| Signature / Function / Type | Purpose & Usage |\n|---|---|\n| `hex encode / hex decode / hex is valid` | Lowercase RFC 4648 hexadecimal encoding and validated decoding |\n| `base64 encode / base64 decode` | Standard RFC 4648 §4 Base64 with `=` padding |\n| `base64url encode / base64url decode` | URL-safe RFC 4648 §5 Base64url (`-`, `_`, unpadded) |\n| `url encode / url decode / query encode / query decode` | RFC 3986 percent-encoding and `k=v&...` query string round-trips |\n| `json quote / json object / json get str / json get int` | Fast zero-AST JSON serialization and top-level key lookup |\n\n---\n\n## 4. Practical Tabular Recipes\n\n### Recipe 1: Core Workflow with `codec`\n\nNotice how the `=` signs and transformation steps align into a clean, scannable table:\n\n```ridgun\nimport codec\n\nfn :: empaquetar parametros (usuario : String) (redir : String) => String\n      empaquetar parametros usuario redir =\n        token_b64 = base64url encode usuario\n        query encode [(\"token\", token_b64), (\"next\", redir)]\n```\n\n### Recipe 2: Safe, Side-Effect-Free Composition\n\nEvery function in the `codec` lib composes seamlessly with the rest of the 32 libs in `ridgun-libs`:\n\n```ridgun\nimport codec\n\nfn :: construir respuesta rapida (id : Int) (nombre : String) => (String, Int)\n      construir respuesta rapida id nombre =\n        doc = json object [(\"id\", json int id), (\"name\", json quote nombre), (\"ok\", json bool True)]\n        leido = json get int doc \"id\" 0\n        (doc, leido)\n```\n\n---\n\n## 5. Under the Hood: Performance, RMM Memory, and Guarantees\n\n- **Algorithmic & Safety Guarantee**: Deterministic rejection of malformed Hex or Base64 inputs (returning `\"\"` with zero out-of-bounds reads) and exact $decode(encode(x)) == x$ round-trip fidelity.\n- **Deterministic Memory (`RMM1`/`RMM2`)**: Zero garbage-collector pauses; all intermediate allocations are reclaimed deterministically on scope exit.\n- **Continuous Verification**: Statically checked via `stable check` and tested by the automated suite in `src/test/ridgun/test_codec.rg`.\n"}, {"num": "08", "slug": "08-lib-json-ast-parser-and-queries", "file": "08-lib-json-ast-parser-and-queries.md", "title": "Chapter 08: The `json` Lib — Recursive RFC 8259 AST Parser, Pretty-Printer, and Dot-Path Queries", "short_title": "The `json` Lib — Recursive RFC 8259 AST Parser, Pretty-Printer, and Dot-Path Queries", "markdown": "# Chapter 08: The `json` Lib — Recursive RFC 8259 AST Parser, Pretty-Printer, and Dot-Path Queries\n\n## 1. Why Does the `json` Lib Exist?\n\nLet's be honest: navigating deeply nested JSON in many statically typed languages means writing pages of boilerplate or chaining ten `.and_then()` calls just to read a single port number.\n\nThe **`json`** lib provides a full recursive-descent **RFC 8259** parser into the algebraic `JsonVal` ADT (`JnNull`, `JnBool`, `JnInt`, `JnStr`, `JnArr`, `JnObj`, `JnErr`), compact and indented serializers (`json pretty`), and dot-path queries (`\"server.http.port\"`, `\"users.0.name\"`).\n\n---\n\n## 2. Bundles, Imports, and Zero-`libc` Architecture\n\nIn `ridgun-libs`, **`json`** is a first-class **lib** located at `src/main/ridgun/lib/json.rg` (domain `JSON`). When built with `stable bundle`, it compiles into three native artifacts:\n\n| Artifact | Path | Purpose |\n|---|---|---|\n| **Ridgun Bundle** | `target/bundles/json.rglib` | Portable distribution and direct `import json` resolution |\n| **Compiled Archive** | `target/json.rgc` | Type-checked intermediate artifact verified by `ridgunc` |\n| **ELF64 Shared Object** | `target/libjson.so` | Native dynamic shared library with zero C or `libc` dependencies |\n\n> To use this lib in any `.rg` file, simply add `import json` at the top and call its functions using either multi-word spaces or underscores.\n\n---\n\n## 3. Quick API Reference for `json`\n\n| Signature / Function / Type | Purpose & Usage |\n|---|---|\n| `type JsonVal` | `JnNull | JnBool Bool | JnInt Int | JnStr String | JnArr [JsonVal] | JnObj [String JsonVal] | JnErr String` |\n| `json parse / json is ok` | Parse raw JSON text into `JsonVal` and validate absence of `JnErr` |\n| `json stringify / json pretty` | Serialize `JsonVal` into compact or multi-line indented JSON |\n| `json get path / json get str / json get int / json get bool` | Traverse nested objects and arrays via dot-separated paths (`\"a.b.0.c\"`) |\n\n---\n\n## 4. Practical Tabular Recipes\n\n### Recipe 1: Core Workflow with `json`\n\nNotice how the `=` signs and transformation steps align into a clean, scannable table:\n\n```ridgun\nimport json\n\nfn :: leer config servidor (raw : String) => (String, Int, Bool)\n      leer config servidor raw =\n        doc  = json parse raw\n        host = json get str doc \"server.host\" \"127.0.0.1\"\n        port = json get int doc \"server.port\" 8080\n        tls  = json get bool doc \"server.tls.enabled\" False\n        (host, port, tls)\n```\n\n### Recipe 2: Safe, Side-Effect-Free Composition\n\nEvery function in the `json` lib composes seamlessly with the rest of the 32 libs in `ridgun-libs`:\n\n```ridgun\nimport json\n\nfn :: construir manifiesto () => String\n      construir manifiesto =\n        nodo = JnObj [(\"app\", JnStr \"solstice\"), (\"workers\", JnInt 8), (\"tags\", JnArr [JnStr \"elf64\", JnStr \"rmm2\"])]\n        json pretty nodo 2\n```\n\n---\n\n## 5. Under the Hood: Performance, RMM Memory, and Guarantees\n\n- **Algorithmic & Safety Guarantee**: Strict rejection of trailing garbage after the root value, full escape-sequence handling, and exception-free `JnErr` reporting.\n- **Deterministic Memory (`RMM1`/`RMM2`)**: Zero garbage-collector pauses; all intermediate allocations are reclaimed deterministically on scope exit.\n- **Continuous Verification**: Statically checked via `stable check` and tested by the automated suite in `src/test/ridgun/test_json.rg`.\n"}, {"num": "09", "slug": "09-lib-csv-rfc4180-parser-and-tables", "file": "09-lib-csv-rfc4180-parser-and-tables.md", "title": "Chapter 09: The `csv` Lib — RFC 4180 CSV/TSV State-Machine Parser and Header-Indexed Tables", "short_title": "The `csv` Lib — RFC 4180 CSV/TSV State-Machine Parser and Header-Indexed Tables", "markdown": "# Chapter 09: The `csv` Lib — RFC 4180 CSV/TSV State-Machine Parser and Header-Indexed Tables\n\n## 1. Why Does the `csv` Lib Exist?\n\nLet's be honest: everyone thinks parsing CSV is just `str split line \",\"`... until a quoted field shows up containing a comma, doubled quotes `\"\"`, or an embedded `\\r\\n` newline right in the middle of a cell.\n\nThe **`csv`** lib implements a full **RFC 4180** state-machine parser for CSV and TSV, smart-quoting serializers, and the `CsvTable` ADT for header-indexed column and row lookups.\n\n---\n\n## 2. Bundles, Imports, and Zero-`libc` Architecture\n\nIn `ridgun-libs`, **`csv`** is a first-class **lib** located at `src/main/ridgun/lib/csv.rg` (domain `CSV`). When built with `stable bundle`, it compiles into three native artifacts:\n\n| Artifact | Path | Purpose |\n|---|---|---|\n| **Ridgun Bundle** | `target/bundles/csv.rglib` | Portable distribution and direct `import csv` resolution |\n| **Compiled Archive** | `target/csv.rgc` | Type-checked intermediate artifact verified by `ridgunc` |\n| **ELF64 Shared Object** | `target/libcsv.so` | Native dynamic shared library with zero C or `libc` dependencies |\n\n> To use this lib in any `.rg` file, simply add `import csv` at the top and call its functions using either multi-word spaces or underscores.\n\n---\n\n## 3. Quick API Reference for `csv`\n\n| Signature / Function / Type | Purpose & Usage |\n|---|---|\n| `csv parse / tsv parse / csv parse with` | Parse CSV/TSV text (including multiline quoted fields and `\"\"` escapes) into `[[String]]` |\n| `csv stringify / tsv stringify` | Serialize `[[String]]` quoting only cells that contain delimiters, quotes, or newlines |\n| `csv parse table / csv get cell / csv col` | Header-indexed `CsvTable` lookup by `(row_idx, col_name)` or full column extraction |\n| `csv row to kv / csv table to kv list` | Convert tabular rows into `[String String]` dictionaries keyed by header |\n\n---\n\n## 4. Practical Tabular Recipes\n\n### Recipe 1: Core Workflow with `csv`\n\nNotice how the `=` signs and transformation steps align into a clean, scannable table:\n\n```ridgun\nimport csv\n\nfn :: extraer columna precios (raw_csv : String) => ([String], String)\n      extraer columna precios raw_csv =\n        tabla   = csv parse table raw_csv\n        precios = csv col tabla \"precio\"\n        primero = csv get cell tabla 0 \"producto\" \"desconocido\"\n        (precios, primero)\n```\n\n### Recipe 2: Safe, Side-Effect-Free Composition\n\nEvery function in the `csv` lib composes seamlessly with the rest of the 32 libs in `ridgun-libs`:\n\n```ridgun\nimport csv\n\nfn :: exportar informe () => String\n      exportar informe =\n        filas = [[\"id\", \"nota\"], [\"1\", \"Contiene, coma\"], [\"2\", \"Dijo \"hola\"\"]]\n        csv stringify filas\n```\n\n---\n\n## 5. Under the Hood: Performance, RMM Memory, and Guarantees\n\n- **Algorithmic & Safety Guarantee**: Exact handling of `\\r\\n` and `\\n` both inside and outside quotes, and lossless round-trips on `csv parse (csv stringify rows)`.\n- **Deterministic Memory (`RMM1`/`RMM2`)**: Zero garbage-collector pauses; all intermediate allocations are reclaimed deterministically on scope exit.\n- **Continuous Verification**: Statically checked via `stable check` and tested by the automated suite in `src/test/ridgun/test_csv.rg`.\n"}, {"num": "10", "slug": "10-lib-ini-sectioned-ini-and-dotenv", "file": "10-lib-ini-sectioned-ini-and-dotenv.md", "title": "Chapter 10: The `ini` Lib — Sectioned `.ini` Configs, `.env` Files, and Variable Interpolation", "short_title": "The `ini` Lib — Sectioned `.ini` Configs, `.env` Files, and Variable Interpolation", "markdown": "# Chapter 10: The `ini` Lib — Sectioned `.ini` Configs, `.env` Files, and Variable Interpolation\n\n## 1. Why Does the `ini` Lib Exist?\n\nLet's be honest: `.env` and `.ini` files look trivial until someone writes `export KEY=\"value # with hash\"`, inline `;` comments, or cross-variable interpolation.\n\nThe **`ini`** lib parses sectioned `.ini` files (`[database]`) and `export`-prefixed `.env` files, preserving `#` and `;` inside quoted values and resolving variable interpolations in `dotenv parse`.\n\n---\n\n## 2. Bundles, Imports, and Zero-`libc` Architecture\n\nIn `ridgun-libs`, **`ini`** is a first-class **lib** located at `src/main/ridgun/lib/ini.rg` (domain `INI`). When built with `stable bundle`, it compiles into three native artifacts:\n\n| Artifact | Path | Purpose |\n|---|---|---|\n| **Ridgun Bundle** | `target/bundles/ini.rglib` | Portable distribution and direct `import ini` resolution |\n| **Compiled Archive** | `target/ini.rgc` | Type-checked intermediate artifact verified by `ridgunc` |\n| **ELF64 Shared Object** | `target/libini.so` | Native dynamic shared library with zero C or `libc` dependencies |\n\n> To use this lib in any `.rg` file, simply add `import ini` at the top and call its functions using either multi-word spaces or underscores.\n\n---\n\n## 3. Quick API Reference for `ini`\n\n| Signature / Function / Type | Purpose & Usage |\n|---|---|\n| `ini parse / ini stringify` | Parse sectioned `.ini` text into `IniDoc` and serialize back to canonical text |\n| `ini get / ini get int / ini get bool / ini set` | Typed section+key lookups (`\"\"` for global section) and immutable updates |\n| `ini sections / ini section map` | List all section names or extract a section's `[String String]` map |\n| `dotenv parse` | Parse `.env` lines (`export K=V`, quotes, comments, and variable expansion) |\n\n---\n\n## 4. Practical Tabular Recipes\n\n### Recipe 1: Core Workflow with `ini`\n\nNotice how the `=` signs and transformation steps align into a clean, scannable table:\n\n```ridgun\nimport ini\n\nfn :: cargar base de datos (texto_ini : String) => (String, Int, Bool)\n      cargar base de datos texto_ini =\n        doc  = ini parse texto_ini\n        host = ini get doc \"database\" \"host\" \"localhost\"\n        port = ini get int doc \"database\" \"port\" 5432\n        pool = ini get bool doc \"database\" \"pool\" True\n        (host, port, pool)\n```\n\n### Recipe 2: Safe, Side-Effect-Free Composition\n\nEvery function in the `ini` lib composes seamlessly with the rest of the 32 libs in `ridgun-libs`:\n\n```ridgun\nimport ini\n\nfn :: actualizar puerto (doc : IniDoc) (nuevo : String) => String\n      actualizar puerto doc nuevo =\n        doc2 = ini set doc \"database\" \"port\" nuevo\n        ini stringify doc2\n```\n\n---\n\n## 5. Under the Hood: Performance, RMM Memory, and Guarantees\n\n- **Algorithmic & Safety Guarantee**: Full preservation of `#` and `;` characters inside single or double quotes, and flexible boolean parsing (`true/1/yes/on` vs `false/0/no/off`).\n- **Deterministic Memory (`RMM1`/`RMM2`)**: Zero garbage-collector pauses; all intermediate allocations are reclaimed deterministically on scope exit.\n- **Continuous Verification**: Statically checked via `stable check` and tested by the automated suite in `src/test/ridgun/test_ini.rg`.\n"}, {"num": "11", "slug": "11-lib-regex-linear-time-thompson-nfa", "file": "11-lib-regex-linear-time-thompson-nfa.md", "title": "Chapter 11: The `regex` Lib — Linear-Time $O(N \\cdot M)$ Thompson NFA Regular Expression Engine", "short_title": "The `regex` Lib — Linear-Time $O(N \\cdot M)$ Thompson NFA Regular Expression Engine", "markdown": "# Chapter 11: The `regex` Lib — Linear-Time $O(N \\cdot M)$ Thompson NFA Regular Expression Engine\n\n## 1. Why Does the `regex` Lib Exist?\n\nLet's be honest: backtracking regex engines have caused famous global outages (at Cloudflare, StackOverflow, and countless APIs) the moment a pattern like `(a+)+b` meets thirty `a`s and explodes into $O(2^N)$ exponential time.\n\nThe **`regex`** lib compiles patterns (`.`, `*`, `+`, `?`, `|`, `()`, `[a-z]`, `[^...]`, `^`, `$`, `\\d`, `\\w`, `\\s`) into a **Thompson Non-Deterministic Finite Automaton (NFA)** and steps the active state set in strict **$O(N \\cdot M)$ linear time**, making **ReDoS attacks mathematically impossible**.\n\n---\n\n## 2. Bundles, Imports, and Zero-`libc` Architecture\n\nIn `ridgun-libs`, **`regex`** is a first-class **lib** located at `src/main/ridgun/lib/regex.rg` (domain `REGEX`). When built with `stable bundle`, it compiles into three native artifacts:\n\n| Artifact | Path | Purpose |\n|---|---|---|\n| **Ridgun Bundle** | `target/bundles/regex.rglib` | Portable distribution and direct `import regex` resolution |\n| **Compiled Archive** | `target/regex.rgc` | Type-checked intermediate artifact verified by `ridgunc` |\n| **ELF64 Shared Object** | `target/libregex.so` | Native dynamic shared library with zero C or `libc` dependencies |\n\n> To use this lib in any `.rg` file, simply add `import regex` at the top and call its functions using either multi-word spaces or underscores.\n\n---\n\n## 3. Quick API Reference for `regex`\n\n| Signature / Function / Type | Purpose & Usage |\n|---|---|\n| `regex match / regex is match` | Full-string match and unanchored substring search in $O(N \\cdot M)$ |\n| `regex find / regex find all` | Extract the first or all non-overlapping matching substrings |\n| `regex replace / regex replace all` | Replace the first or all regex matches with a replacement string |\n| `regex split / regex escape` | Split text by a regex delimiter and escape metacharacters |\n\n---\n\n## 4. Practical Tabular Recipes\n\n### Recipe 1: Core Workflow with `regex`\n\nNotice how the `=` signs and transformation steps align into a clean, scannable table:\n\n```ridgun\nimport regex\n\nfn :: extraer codigos postales (texto : String) => [String]\n      extraer codigos postales texto =\n        regex find all \"\\\\d+\" texto\n```\n\n### Recipe 2: Safe, Side-Effect-Free Composition\n\nEvery function in the `regex` lib composes seamlessly with the rest of the 32 libs in `ridgun-libs`:\n\n```ridgun\nimport regex\n\nfn :: censurar telefonos (comentario : String) => (Bool, String)\n      censurar telefonos comentario =\n        tiene = regex is match \"\\\\d+-\\\\d+\" comentario\n        limpio = regex replace all \"\\\\d+-\\\\d+\" comentario \"[TELEFONO]\"\n        (tiene, limpio)\n```\n\n---\n\n## 5. Under the Hood: Performance, RMM Memory, and Guarantees\n\n- **Algorithmic & Safety Guarantee**: Lockstep NFA state-set simulation with zero stack-overflow risk and guaranteed $O(N \\cdot M)$ runtime even on pathological `(a+)+b` inputs.\n- **Deterministic Memory (`RMM1`/`RMM2`)**: Zero garbage-collector pauses; all intermediate allocations are reclaimed deterministically on scope exit.\n- **Continuous Verification**: Statically checked via `stable check` and tested by the automated suite in `src/test/ridgun/test_regex.rg`.\n"}, {"num": "12", "slug": "12-lib-glob-wildcards-and-filtering", "file": "12-lib-glob-wildcards-and-filtering.md", "title": "Chapter 12: The `glob` Lib — Wildcard Patterns (`*`, `?`, `[a-z]`) and List Filtering", "short_title": "The `glob` Lib — Wildcard Patterns (`*`, `?`, `[a-z]`) and List Filtering", "markdown": "# Chapter 12: The `glob` Lib — Wildcard Patterns (`*`, `?`, `[a-z]`) and List Filtering\n\n## 1. Why Does the `glob` Lib Exist?\n\nLet's be honest: firing up a full regular expression engine just to check whether a filename matches `*.rg` or `test_[0-9]*.rg` is overkill.\n\nThe **`glob`** lib implements shell wildcard matching (`*`, `?`, `[a-z]` ranges, negated `[!0-9]` / `[^a-z]` classes), case-insensitive matching (`glob match ci`), and batch list filtering.\n\n---\n\n## 2. Bundles, Imports, and Zero-`libc` Architecture\n\nIn `ridgun-libs`, **`glob`** is a first-class **lib** located at `src/main/ridgun/lib/glob.rg` (domain `GLOB`). When built with `stable bundle`, it compiles into three native artifacts:\n\n| Artifact | Path | Purpose |\n|---|---|---|\n| **Ridgun Bundle** | `target/bundles/glob.rglib` | Portable distribution and direct `import glob` resolution |\n| **Compiled Archive** | `target/glob.rgc` | Type-checked intermediate artifact verified by `ridgunc` |\n| **ELF64 Shared Object** | `target/libglob.so` | Native dynamic shared library with zero C or `libc` dependencies |\n\n> To use this lib in any `.rg` file, simply add `import glob` at the top and call its functions using either multi-word spaces or underscores.\n\n---\n\n## 3. Quick API Reference for `glob`\n\n| Signature / Function / Type | Purpose & Usage |\n|---|---|\n| `glob match / glob match ci` | Case-sensitive and ASCII case-insensitive glob pattern matching |\n| `glob filter / glob any match` | Filter `[String]` to matching items or check if any pattern in a list matches |\n| `glob has magic` | Detect whether a string contains wildcard metacharacters (`*`, `?`, `[`) |\n\n---\n\n## 4. Practical Tabular Recipes\n\n### Recipe 1: Core Workflow with `glob`\n\nNotice how the `=` signs and transformation steps align into a clean, scannable table:\n\n```ridgun\nimport glob\n\nfn :: seleccionar fuentes ridgun (archivos : [String]) => [String]\n      seleccionar fuentes ridgun archivos =\n        glob filter \"test_[a-z]*.rg\" archivos\n```\n\n### Recipe 2: Safe, Side-Effect-Free Composition\n\nEvery function in the `glob` lib composes seamlessly with the rest of the 32 libs in `ridgun-libs`:\n\n```ridgun\nimport glob\n\nfn :: es ruta excluida (ruta : String) => Bool\n      es ruta excluida ruta =\n        glob any match [\"*.tmp\", \"*.bak\", \"target/*\"] ruta\n```\n\n---\n\n## 5. Under the Hood: Performance, RMM Memory, and Guarantees\n\n- **Algorithmic & Safety Guarantee**: Automatic collapsing of consecutive stars (`***` $\\rightarrow$ `*`) to eliminate redundant backtracking and safe handling of unclosed `[` brackets.\n- **Deterministic Memory (`RMM1`/`RMM2`)**: Zero garbage-collector pauses; all intermediate allocations are reclaimed deterministically on scope exit.\n- **Continuous Verification**: Statically checked via `stable check` and tested by the automated suite in `src/test/ridgun/test_glob.rg`.\n"}, {"num": "13", "slug": "13-lib-diff-lcs-unified-diff-and-patching", "file": "13-lib-diff-lcs-unified-diff-and-patching.md", "title": "Chapter 13: The `diff` Lib — LCS Line Diff, Edit Distance, Unified Diff, and Patching", "short_title": "The `diff` Lib — LCS Line Diff, Edit Distance, Unified Diff, and Patching", "markdown": "# Chapter 13: The `diff` Lib — LCS Line Diff, Edit Distance, Unified Diff, and Patching\n\n## 1. Why Does the `diff` Lib Exist?\n\nLet's be honest: when a test fails or a config file changes, a raw 200-line `\"expected A, got B\"` dump forces you to squint at the screen hunting for the exact line that changed.\n\nThe **`diff`** lib computes the **Longest Common Subsequence (LCS)** over a 2D `Tensor[Int]` DP table to produce minimal edit scripts (`DiffKeep`, `DiffAdd`, `DiffDel`), edit distance, **Unified Diff** output (`---`/`+++`/`@@`), and lossless patching (`diff apply`).\n\n---\n\n## 2. Bundles, Imports, and Zero-`libc` Architecture\n\nIn `ridgun-libs`, **`diff`** is a first-class **lib** located at `src/main/ridgun/lib/diff.rg` (domain `DIFF`). When built with `stable bundle`, it compiles into three native artifacts:\n\n| Artifact | Path | Purpose |\n|---|---|---|\n| **Ridgun Bundle** | `target/bundles/diff.rglib` | Portable distribution and direct `import diff` resolution |\n| **Compiled Archive** | `target/diff.rgc` | Type-checked intermediate artifact verified by `ridgunc` |\n| **ELF64 Shared Object** | `target/libdiff.so` | Native dynamic shared library with zero C or `libc` dependencies |\n\n> To use this lib in any `.rg` file, simply add `import diff` at the top and call its functions using either multi-word spaces or underscores.\n\n---\n\n## 3. Quick API Reference for `diff`\n\n| Signature / Function / Type | Purpose & Usage |\n|---|---|\n| `type DiffOp` | `DiffKeep String | DiffDel String | DiffAdd String` |\n| `diff lines / diff text` | Compute minimal LCS edit script between `[String]` lists or multiline strings |\n| `diff edit distance / diff stats` | Minimal insertion+deletion distance and `(kept, added, deleted)` counts |\n| `diff format / diff unified` | Render compact `+ / - /  ` lines or standard Unified Diff with headers |\n| `diff apply / diff apply text` | Reconstruct the target document losslessly from an edit script |\n\n---\n\n## 4. Practical Tabular Recipes\n\n### Recipe 1: Core Workflow with `diff`\n\nNotice how the `=` signs and transformation steps align into a clean, scannable table:\n\n```ridgun\nimport diff\n\nfn :: auditar cambio (antes : String) (despues : String) => (Int, String)\n      auditar cambio antes despues =\n        dist   = diff edit distance ( [\"host=localhost\", \"port=8080\"] ) ( [\"host=0.0.0.0\", \"port=8080\"] )\n        parche = diff unified \"config.old\" \"config.new\" antes despues\n        (dist, parche)\n```\n\n### Recipe 2: Safe, Side-Effect-Free Composition\n\nEvery function in the `diff` lib composes seamlessly with the rest of the 32 libs in `ridgun-libs`:\n\n```ridgun\nimport diff\n\nfn :: verificar parche (orig : [String]) (nuevo : [String]) => [String]\n      verificar parche orig nuevo =\n        ops = diff lines orig nuevo\n        diff apply ops\n```\n\n---\n\n## 5. Under the Hood: Performance, RMM Memory, and Guarantees\n\n- **Algorithmic & Safety Guarantee**: Guaranteed mathematical identity $diff\\_edit\\_distance(a, b) == |a| + |b| - 2 \\cdot LCS(a, b)$ and lossless reconstruction `diff apply (diff lines a b) == b`.\n- **Deterministic Memory (`RMM1`/`RMM2`)**: Zero garbage-collector pauses; all intermediate allocations are reclaimed deterministically on scope exit.\n- **Continuous Verification**: Statically checked via `stable check` and tested by the automated suite in `src/test/ridgun/test_diff.rg`.\n"}, {"num": "14", "slug": "14-lib-template-safe-mustache-templates", "file": "14-lib-template-safe-mustache-templates.md", "title": "Chapter 14: The `template` Lib — Safe Mustache Templates with HTML and LaTeX Auto-Escaping", "short_title": "The `template` Lib — Safe Mustache Templates with HTML and LaTeX Auto-Escaping", "markdown": "# Chapter 14: The `template` Lib — Safe Mustache Templates with HTML and LaTeX Auto-Escaping\n\n## 1. Why Does the `template` Lib Exist?\n\nLet's be honest: assembling HTML pages or LaTeX reports by manual string concatenation is a textbook recipe for XSS vulnerabilities (`<script>`) or broken PDF builds the moment a user types `%` or `_`.\n\nThe **`template`** lib provides a logic-less **Mustache** engine with contextual auto-escaping (`TmplPlain`, `TmplHtml`, `TmplLatex`), explicit raw interpolation (`{{{raw}}}` / `{{&raw}}`), comments (`{{! ... }}`), truthy sections (`{{#sec}}...{{/sec}}`), and inverted sections (`{{^sec}}...{{/sec}}`).\n\n---\n\n## 2. Bundles, Imports, and Zero-`libc` Architecture\n\nIn `ridgun-libs`, **`template`** is a first-class **lib** located at `src/main/ridgun/lib/template.rg` (domain `TMPL`). When built with `stable bundle`, it compiles into three native artifacts:\n\n| Artifact | Path | Purpose |\n|---|---|---|\n| **Ridgun Bundle** | `target/bundles/template.rglib` | Portable distribution and direct `import template` resolution |\n| **Compiled Archive** | `target/template.rgc` | Type-checked intermediate artifact verified by `ridgunc` |\n| **ELF64 Shared Object** | `target/libtemplate.so` | Native dynamic shared library with zero C or `libc` dependencies |\n\n> To use this lib in any `.rg` file, simply add `import template` at the top and call its functions using either multi-word spaces or underscores.\n\n---\n\n## 3. Quick API Reference for `template`\n\n| Signature / Function / Type | Purpose & Usage |\n|---|---|\n| `tmpl render / tmpl render html / tmpl render latex` | Render Mustache templates with plain, HTML, or LaTeX auto-escaping |\n| `tmpl escape html / tmpl escape latex` | Escape `& < > \" '` for HTML or `\\ { } & % $ # _ ~ ^` for LaTeX |\n| `tmpl extract vars / tmpl has unclosed tags` | Inspect required variable names and validate tag balance before rendering |\n\n---\n\n## 4. Practical Tabular Recipes\n\n### Recipe 1: Core Workflow with `template`\n\nNotice how the `=` signs and transformation steps align into a clean, scannable table:\n\n```ridgun\nimport template\n\nfn :: renderizar perfil html (usuario : String) (es_admin : String) => String\n      renderizar perfil html usuario es_admin =\n        plantilla = \"<h1>Hola {{user}}</h1>{{#admin}}<span class='badge'>Admin</span>{{/admin}}\"\n        vars      = [(\"user\", usuario), (\"admin\", es_admin)]\n        tmpl render html plantilla vars\n```\n\n### Recipe 2: Safe, Side-Effect-Free Composition\n\nEvery function in the `template` lib composes seamlessly with the rest of the 32 libs in `ridgun-libs`:\n\n```ridgun\nimport template\n\nfn :: generar linea latex (metrica : String) => String\n      generar linea latex metrica =\n        -- Escapa automaticamente % _ & # para que LaTeX no falle\n        tmpl render latex \"Resultado: {{val}}\" [(\"val\", metrica)]\n```\n\n---\n\n## 5. Under the Hood: Performance, RMM Memory, and Guarantees\n\n- **Algorithmic & Safety Guarantee**: Default XSS prevention in `tmpl render html` (escaping `&`, `<`, `>`, `\"`, `'`), while triple-stache `{{{var}}}` explicitly opts into raw trusted markup.\n- **Deterministic Memory (`RMM1`/`RMM2`)**: Zero garbage-collector pauses; all intermediate allocations are reclaimed deterministically on scope exit.\n- **Continuous Verification**: Statically checked via `stable check` and tested by the automated suite in `src/test/ridgun/test_template.rg`.\n"}, {"num": "15", "slug": "15-lib-fmt-tabular-formatter-and-highlighter", "file": "15-lib-fmt-tabular-formatter-and-highlighter.md", "title": "Chapter 15: The `fmt` Lib — Canonical 2D Tabular Formatter and 9-Target Syntax Highlighter", "short_title": "The `fmt` Lib — Canonical 2D Tabular Formatter and 9-Target Syntax Highlighter", "markdown": "# Chapter 15: The `fmt` Lib — Canonical 2D Tabular Formatter and 9-Target Syntax Highlighter\n\n## 1. Why Does the `fmt` Lib Exist?\n\nLet's be honest: the beauty of Ridgun lies in its crisp tabular columns (`::`, `=`, `|`, `->`, `--`), but aligning spaces by hand or exporting syntax-highlighted code to ANSI terminals, HTML, and LaTeX without a dedicated engine is tedious.\n\nThe **`fmt`** lib is Ridgun's official 2D tabular formatter and lexical syntax highlighter: it aligns `fn ::` headers, equations, `|` guards, and `--` comments, and renders into **9 output targets** (`FmtPlain`, `FmtTty`, `FmtTrueColor`, `FmtHtmlInline`, `FmtHtmlCss`, `FmtMarkdown`, `FmtPango`, `FmtLatex`, `FmtRtf`).\n\n---\n\n## 2. Bundles, Imports, and Zero-`libc` Architecture\n\nIn `ridgun-libs`, **`fmt`** is a first-class **lib** located at `src/main/ridgun/lib/fmt.rg` (domain `FMT`). When built with `stable bundle`, it compiles into three native artifacts:\n\n| Artifact | Path | Purpose |\n|---|---|---|\n| **Ridgun Bundle** | `target/bundles/fmt.rglib` | Portable distribution and direct `import fmt` resolution |\n| **Compiled Archive** | `target/fmt.rgc` | Type-checked intermediate artifact verified by `ridgunc` |\n| **ELF64 Shared Object** | `target/libfmt.so` | Native dynamic shared library with zero C or `libc` dependencies |\n\n> To use this lib in any `.rg` file, simply add `import fmt` at the top and call its functions using either multi-word spaces or underscores.\n\n---\n\n## 3. Quick API Reference for `fmt`\n\n| Signature / Function / Type | Purpose & Usage |\n|---|---|\n| `fmt source / fmt source with` | Format raw Ridgun source code using canonical 2D tabular column alignment |\n| `fmt check` | Return `True` if source code already matches canonical `fmt source` layout |\n| `fmt render / fmt render with` | Format and highlight source into any of the 9 `FmtTarget` backends |\n| `fmt tokenize line` | Tokenize a Ridgun line into `TokKeyword`, `TokType`, `TokOperator`, `TokString`, `TokNumber`, `TokComment` |\n\n---\n\n## 4. Practical Tabular Recipes\n\n### Recipe 1: Core Workflow with `fmt`\n\nNotice how the `=` signs and transformation steps align into a clean, scannable table:\n\n```ridgun\nimport fmt\n\nfn :: formatear y verificar (codigo : String) => (String, Bool)\n      formatear y verificar codigo =\n        limpio = fmt source codigo\n        es_ok  = fmt check limpio\n        (limpio, es_ok)\n```\n\n### Recipe 2: Safe, Side-Effect-Free Composition\n\nEvery function in the `fmt` lib composes seamlessly with the rest of the 32 libs in `ridgun-libs`:\n\n```ridgun\nimport fmt\n\nfn :: exportar bloque html (codigo : String) => String\n      exportar bloque html codigo =\n        fmt render codigo FmtHtmlCss\n```\n\n---\n\n## 5. Under the Hood: Performance, RMM Memory, and Guarantees\n\n- **Algorithmic & Safety Guarantee**: Strict idempotence (`fmt source (fmt source s) == fmt source s`) and 100% preservation of semantic tokens.\n- **Deterministic Memory (`RMM1`/`RMM2`)**: Zero garbage-collector pauses; all intermediate allocations are reclaimed deterministically on scope exit.\n- **Continuous Verification**: Statically checked via `stable check` and tested by the automated suite in `src/test/ridgun/test_fmt.rg`.\n"}, {"num": "16", "slug": "16-lib-cli-flags-options-and-env", "file": "16-lib-cli-flags-options-and-env.md", "title": "Chapter 16: The `cli` Lib — Flags, Options, `--` Barrier, Subcommands, and Typed Env Readers", "short_title": "The `cli` Lib — Flags, Options, `--` Barrier, Subcommands, and Typed Env Readers", "markdown": "# Chapter 16: The `cli` Lib — Flags, Options, `--` Barrier, Subcommands, and Typed Env Readers\n\n## 1. Why Does the `cli` Lib Exist?\n\nLet's be honest: hand-rolling `argv` parsing always starts as an innocent loop and breaks the moment a user passes bundled `-la` flags, `--port=9090`, or `--` followed by a filename starting with a dash.\n\nThe **`cli`** lib handles long flags (`--verbose`), short flags (`-v`), bundled short flags (`-la`), valued options (`--port=8080`, `--port 8080`, `-p 8080`), the POSIX `--` end-of-options barrier, positional arguments, subcommands, and typed environment variable readers.\n\n---\n\n## 2. Bundles, Imports, and Zero-`libc` Architecture\n\nIn `ridgun-libs`, **`cli`** is a first-class **lib** located at `src/main/ridgun/lib/cli.rg` (domain `CLI`). When built with `stable bundle`, it compiles into three native artifacts:\n\n| Artifact | Path | Purpose |\n|---|---|---|\n| **Ridgun Bundle** | `target/bundles/cli.rglib` | Portable distribution and direct `import cli` resolution |\n| **Compiled Archive** | `target/cli.rgc` | Type-checked intermediate artifact verified by `ridgunc` |\n| **ELF64 Shared Object** | `target/libcli.so` | Native dynamic shared library with zero C or `libc` dependencies |\n\n> To use this lib in any `.rg` file, simply add `import cli` at the top and call its functions using either multi-word spaces or underscores.\n\n---\n\n## 3. Quick API Reference for `cli`\n\n| Signature / Function / Type | Purpose & Usage |\n|---|---|\n| `cli has flag : [String] -> String -> String -> Bool` | Detect `--long`, `-s`, or bundled `-xyz` before `--` |\n| `cli get opt / cli get int opt` | Extract string or integer option (`--k=v`, `--k v`, `-k v`) with default |\n| `cli positionals / cli subcommand` | Collect non-flag positional arguments (including everything after `--`) |\n| `env get or / env get int or / env get bool or` | Read environment variables with typed fallback defaults |\n\n---\n\n## 4. Practical Tabular Recipes\n\n### Recipe 1: Core Workflow with `cli`\n\nNotice how the `=` signs and transformation steps align into a clean, scannable table:\n\n```ridgun\nimport cli\n\nfn :: analizar comando (args : [String]) => (String, Bool, Int, [String])\n      analizar comando args =\n        sub   = cli subcommand args\n        all_f = cli has flag args \"--all\" \"-a\"\n        port  = cli get int opt args \"--port\" \"-p\" 8080\n        arch  = cli positionals args [\"--port\", \"-p\"]\n        (sub, all_f, port, arch)\n```\n\n### Recipe 2: Safe, Side-Effect-Free Composition\n\nEvery function in the `cli` lib composes seamlessly with the rest of the 32 libs in `ridgun-libs`:\n\n```ridgun\nimport cli\n\nfn :: leer config entorno () => (Int, Bool)\n      leer config entorno =\n        workers = env get int or \"SOLSTICE_WORKERS\" 4\n        debug   = env get bool or \"SOLSTICE_DEBUG\" False\n        (workers, debug)\n```\n\n---\n\n## 5. Under the Hood: Performance, RMM Memory, and Guarantees\n\n- **Algorithmic & Safety Guarantee**: Strict adherence to the POSIX `--` barrier: no token after `--` is ever misinterpreted as a flag or option.\n- **Deterministic Memory (`RMM1`/`RMM2`)**: Zero garbage-collector pauses; all intermediate allocations are reclaimed deterministically on scope exit.\n- **Continuous Verification**: Statically checked via `stable check` and tested by the automated suite in `src/test/ridgun/test_cli.rg`.\n"}, {"num": "17", "slug": "17-lib-path-posix-paths-and-confinement", "file": "17-lib-path-posix-paths-and-confinement.md", "title": "Chapter 17: The `path` Lib — POSIX Normalization (`path clean`) and Path-Traversal Confinement", "short_title": "The `path` Lib — POSIX Normalization (`path clean`) and Path-Traversal Confinement", "markdown": "# Chapter 17: The `path` Lib — POSIX Normalization (`path clean`) and Path-Traversal Confinement\n\n## 1. Why Does the `path` Lib Exist?\n\nLet's be honest: joining file paths with `base + \"/\" + user_path` without lexical `..` resolution and boundary confinement is an open invitation for a `../../etc/passwd` path-traversal exploit.\n\nThe **`path`** lib implements POSIX lexical normalization (`path clean`), safe joining (`path join`), component extraction (`dirname`, `basename`, `stem`, `ext`, `replace ext`), and the **`path is safe subpath`** (`VUL-INJ-001`) directory-confinement guard.\n\n---\n\n## 2. Bundles, Imports, and Zero-`libc` Architecture\n\nIn `ridgun-libs`, **`path`** is a first-class **lib** located at `src/main/ridgun/lib/path.rg` (domain `PATH`). When built with `stable bundle`, it compiles into three native artifacts:\n\n| Artifact | Path | Purpose |\n|---|---|---|\n| **Ridgun Bundle** | `target/bundles/path.rglib` | Portable distribution and direct `import path` resolution |\n| **Compiled Archive** | `target/path.rgc` | Type-checked intermediate artifact verified by `ridgunc` |\n| **ELF64 Shared Object** | `target/libpath.so` | Native dynamic shared library with zero C or `libc` dependencies |\n\n> To use this lib in any `.rg` file, simply add `import path` at the top and call its functions using either multi-word spaces or underscores.\n\n---\n\n## 3. Quick API Reference for `path`\n\n| Signature / Function / Type | Purpose & Usage |\n|---|---|\n| `path clean / path join / path join list` | Collapse `//`, `.`, and `..` lexically and join path segments |\n| `path dirname / path basename / path split` | Split a path into parent directory and final filename component |\n| `path ext / path stem / path replace ext` | Extract or swap file extensions (correctly treating `.bashrc` as stem `.bashrc`, ext `\"\"`) |\n| `path is safe subpath : String -> String -> Bool` | Verify `rel` stays strictly inside `base_dir` and has no NUL bytes |\n\n---\n\n## 4. Practical Tabular Recipes\n\n### Recipe 1: Core Workflow with `path`\n\nNotice how the `=` signs and transformation steps align into a clean, scannable table:\n\n```ridgun\nimport path\n\nfn :: resolver archivo estatico (raiz : String) (peticion : String) => (Bool, String)\n      resolver archivo estatico raiz peticion =\n        seguro = path is safe subpath raiz peticion\n        ruta   = path join raiz peticion\n        (seguro, ruta)\n```\n\n### Recipe 2: Safe, Side-Effect-Free Composition\n\nEvery function in the `path` lib composes seamlessly with the rest of the 32 libs in `ridgun-libs`:\n\n```ridgun\nimport path\n\nfn :: cambiar salida a objeto (fuente : String) => (String, String, String)\n      cambiar salida a objeto fuente =\n        dir = path dirname fuente\n        nom = path stem fuente\n        obj = path replace ext (path clean fuente) \".rglib\"\n        (dir, nom, obj)\n```\n\n---\n\n## 5. Under the Hood: Performance, RMM Memory, and Guarantees\n\n- **Algorithmic & Safety Guarantee**: `path is safe subpath` rejects absolute paths, NUL bytes, and any `..` sequence that attempts to escape `base_dir` or bleed into a sibling prefix (`/srv/www-secret`).\n- **Deterministic Memory (`RMM1`/`RMM2`)**: Zero garbage-collector pauses; all intermediate allocations are reclaimed deterministically on scope exit.\n- **Continuous Verification**: Statically checked via `stable check` and tested by the automated suite in `src/test/ridgun/test_path.rg`.\n"}, {"num": "18", "slug": "18-lib-time-utc-calendar-iso8601-and-backoff", "file": "18-lib-time-utc-calendar-iso8601-and-backoff.md", "title": "Chapter 18: The `time` Lib — Howard Hinnant UTC Calendar, ISO-8601, Durations, and Backoff", "short_title": "The `time` Lib — Howard Hinnant UTC Calendar, ISO-8601, Durations, and Backoff", "markdown": "# Chapter 18: The `time` Lib — Howard Hinnant UTC Calendar, ISO-8601, Durations, and Backoff\n\n## 1. Why Does the `time` Lib Exist?\n\nLet's be honest: `libc` date functions (`localtime`, `gmtime`, `mktime`) rely on hidden mutable global state (`TZ`), aren't thread-safe, and trip developers up on century leap-year rules.\n\nThe **`time`** lib implements **Howard Hinnant's $O(1)$** proleptic Gregorian UTC civil calendar algorithm, strict **ISO-8601 / RFC 3339** formatting and parsing (`YYYY-MM-DDTHH:MM:SSZ`), human-readable durations (`1h 1m 1s 5ms`), and bounded exponential backoff.\n\n---\n\n## 2. Bundles, Imports, and Zero-`libc` Architecture\n\nIn `ridgun-libs`, **`time`** is a first-class **lib** located at `src/main/ridgun/lib/time.rg` (domain `TIME`). When built with `stable bundle`, it compiles into three native artifacts:\n\n| Artifact | Path | Purpose |\n|---|---|---|\n| **Ridgun Bundle** | `target/bundles/time.rglib` | Portable distribution and direct `import time` resolution |\n| **Compiled Archive** | `target/time.rgc` | Type-checked intermediate artifact verified by `ridgunc` |\n| **ELF64 Shared Object** | `target/libtime.so` | Native dynamic shared library with zero C or `libc` dependencies |\n\n> To use this lib in any `.rg` file, simply add `import time` at the top and call its functions using either multi-word spaces or underscores.\n\n---\n\n## 3. Quick API Reference for `time`\n\n| Signature / Function / Type | Purpose & Usage |\n|---|---|\n| `time epoch to utc / time utc to epoch` | $O(1)$ conversion between Unix epoch seconds and `(year, month, day, hour, min, sec)` |\n| `time is leap year / time days in month / time day of week` | Leap-year rules (`400 / 100 / 4`), month lengths, and ISO weekday (`1=Mon..7=Sun`) |\n| `time format iso8601 / time parse iso8601` | Format and validate `YYYY-MM-DDTHH:MM:SSZ` timestamps (`-1` on invalid dates like Feb 30) |\n| `time format duration ms / time backoff ms` | Human duration strings and capped $base \\cdot 2^{attempt}$ retry delays |\n\n---\n\n## 4. Practical Tabular Recipes\n\n### Recipe 1: Core Workflow with `time`\n\nNotice how the `=` signs and transformation steps align into a clean, scannable table:\n\n```ridgun\nimport time\n\nfn :: registrar evento temporal (epoch_s : Int) => (String, Int, String)\n      registrar evento temporal epoch_s =\n        iso = time format iso8601 epoch_s\n        sem = time day of week epoch_s\n        dur = time format duration ms 3661005\n        (iso, sem, dur)\n```\n\n### Recipe 2: Safe, Side-Effect-Free Composition\n\nEvery function in the `time` lib composes seamlessly with the rest of the 32 libs in `ridgun-libs`:\n\n```ridgun\nimport time\n\nfn :: planificar reintentos () => [Int]\n      planificar reintentos =\n        [time backoff ms 0 100 5000, time backoff ms 1 100 5000, time backoff ms 2 100 5000, time backoff ms 9 100 5000]\n```\n\n---\n\n## 5. Under the Hood: Performance, RMM Memory, and Guarantees\n\n- **Algorithmic & Safety Guarantee**: $O(1)$ calendar conversion with zero year-by-year loops and strict per-month day validation (rejecting Feb 29 on non-leap years).\n- **Deterministic Memory (`RMM1`/`RMM2`)**: Zero garbage-collector pauses; all intermediate allocations are reclaimed deterministically on scope exit.\n- **Continuous Verification**: Statically checked via `stable check` and tested by the automated suite in `src/test/ridgun/test_time.rg`.\n"}, {"num": "19", "slug": "19-lib-uuid-identifiers-checksums-and-prng", "file": "19-lib-uuid-identifiers-checksums-and-prng.md", "title": "Chapter 19: The `uuid` Lib — RFC 9562 `UUIDv4`/`UUIDv7`, Checksums (`CRC-32`), and PRNG", "short_title": "The `uuid` Lib — RFC 9562 `UUIDv4`/`UUIDv7`, Checksums (`CRC-32`), and PRNG", "markdown": "# Chapter 19: The `uuid` Lib — RFC 9562 `UUIDv4`/`UUIDv7`, Checksums (`CRC-32`), and PRNG\n\n## 1. Why Does the `uuid` Lib Exist?\n\nLet's be honest: using random `UUIDv4` values as database primary keys fragments B-Tree indexes, while rolling ad-hoc IDs without kernel CSPRNG entropy leads to collisions.\n\nThe **`uuid`** lib implements **RFC 9562 `UUIDv4`** (kernel CSPRNG) and time-ordered **`UUIDv7`** (48-bit millisecond prefix for B-Tree locality), fast checksums (**FNV-1a**, **Adler-32**, **IEEE 802.3 CRC-32**), and a deterministic seeded PRNG.\n\n---\n\n## 2. Bundles, Imports, and Zero-`libc` Architecture\n\nIn `ridgun-libs`, **`uuid`** is a first-class **lib** located at `src/main/ridgun/lib/uuid.rg` (domain `UUID`). When built with `stable bundle`, it compiles into three native artifacts:\n\n| Artifact | Path | Purpose |\n|---|---|---|\n| **Ridgun Bundle** | `target/bundles/uuid.rglib` | Portable distribution and direct `import uuid` resolution |\n| **Compiled Archive** | `target/uuid.rgc` | Type-checked intermediate artifact verified by `ridgunc` |\n| **ELF64 Shared Object** | `target/libuuid.so` | Native dynamic shared library with zero C or `libc` dependencies |\n\n> To use this lib in any `.rg` file, simply add `import uuid` at the top and call its functions using either multi-word spaces or underscores.\n\n---\n\n## 3. Quick API Reference for `uuid`\n\n| Signature / Function / Type | Purpose & Usage |\n|---|---|\n| `uuid v4 / uuid v7 / uuid v7 at` | Generate RFC 9562 v4 (random) and v7 (time-ordered) canonical 36-char UUIDs |\n| `uuid is valid / uuid version` | Validate 8-4-4-4-12 layout and RFC 9562 variant bits (`8, 9, a, b`) |\n| `fnv1a 32 / adler32 / crc32 / crc32 hex` | Fast 32-bit non-cryptographic hashes and checksums |\n| `prng next / prng range` | Pure functional Linear Congruential PRNG for reproducible tests and simulations |\n\n---\n\n## 4. Practical Tabular Recipes\n\n### Recipe 1: Core Workflow with `uuid`\n\nNotice how the `=` signs and transformation steps align into a clean, scannable table:\n\n```ridgun\nimport uuid\n\nfn :: generar ids ordenados () => (String, String, Bool)\n      generar ids ordenados =\n        id1 = uuid v7 at 1000\n        id2 = uuid v7 at 2000\n        ok  = (uuid is valid id1) and (id1 < id2)\n        (id1, id2, ok)\n```\n\n### Recipe 2: Safe, Side-Effect-Free Composition\n\nEvery function in the `uuid` lib composes seamlessly with the rest of the 32 libs in `ridgun-libs`:\n\n```ridgun\nimport uuid\n\nfn :: firmar paquete (payload : String) => (String, Int)\n      firmar paquete payload =\n         (crc32 hex payload, fnv1a 32 payload)\n```\n\n---\n\n## 5. Under the Hood: Performance, RMM Memory, and Guarantees\n\n- **Algorithmic & Safety Guarantee**: `uuid v7 at t1 < uuid v7 at t2` guarantees monotonically increasing lexicographical order over time, ideal for `btree` indexes and databases.\n- **Deterministic Memory (`RMM1`/`RMM2`)**: Zero garbage-collector pauses; all intermediate allocations are reclaimed deterministically on scope exit.\n- **Continuous Verification**: Statically checked via `stable check` and tested by the automated suite in `src/test/ridgun/test_uuid.rg`.\n"}, {"num": "20", "slug": "20-lib-log-structured-ndjson-and-redaction", "file": "20-lib-log-structured-ndjson-and-redaction.md", "title": "Chapter 20: The `log` Lib — Structured NDJSON Logging and Automatic Secret Redaction", "short_title": "The `log` Lib — Structured NDJSON Logging and Automatic Secret Redaction", "markdown": "# Chapter 20: The `log` Lib — Structured NDJSON Logging and Automatic Secret Redaction\n\n## 1. Why Does the `log` Lib Exist?\n\nLet's be honest: dumping request fields into a log line and realizing weeks later that `password`, `api_key`, or `authorization` headers were stored in cleartext in your l
