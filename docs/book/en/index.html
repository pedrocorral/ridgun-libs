og aggregator is a classic security incident.\n\nThe **`log`** lib provides severity filtering (`DEBUG`, `INFO`, `WARN`, `ERROR`), human-readable text and **structured NDJSON** formatters, and **automatic secret redaction** (`password`, `secret`, `token`, `api_key`, `authorization`, `cookie`, `private_key` $\\rightarrow$ `\"[REDACTED]\"`, mitigating `VUL-LOG-001`).\n\n---\n\n## 2. Bundles, Imports, and Zero-`libc` Architecture\n\nIn `ridgun-libs`, **`log`** is a first-class **lib** located at `src/main/ridgun/lib/log.rg` (domain `LOG`). When built with `stable bundle`, it compiles into three native artifacts:\n\n| Artifact | Path | Purpose |\n|---|---|---|\n| **Ridgun Bundle** | `target/bundles/log.rglib` | Portable distribution and direct `import log` resolution |\n| **Compiled Archive** | `target/log.rgc` | Type-checked intermediate artifact verified by `ridgunc` |\n| **ELF64 Shared Object** | `target/liblog.so` | Native dynamic shared library with zero C or `libc` dependencies |\n\n> To use this lib in any `.rg` file, simply add `import log` at the top and call its functions using either multi-word spaces or underscores.\n\n---\n\n## 3. Quick API Reference for `log`\n\n| Signature / Function / Type | Purpose & Usage |\n|---|---|\n| `log level rank / log should emit` | Compare log levels (`DEBUG=10`, `INFO=20`, `WARN=30`, `ERROR=40`) against configured threshold |\n| `log is sensitive key / log redact fields` | Case-insensitively replace secret values with `\"[REDACTED]\"` |\n| `log format text / log format json` | Format single-line key=value text or RFC 8259 NDJSON with automatic secret redaction |\n\n---\n\n## 4. Practical Tabular Recipes\n\n### Recipe 1: Core Workflow with `log`\n\nNotice how the `=` signs and transformation steps align into a clean, scannable table:\n\n```ridgun\nimport log\n\nfn :: auditar login (usuario : String) (clave : String) => String\n      auditar login usuario clave =\n        campos = [(\"user\", usuario), (\"password\", clave), (\"ip\", \"10.0.0.1\")]\n        log format json \"INFO\" \"intento de acceso\" campos\n```\n\n### Recipe 2: Safe, Side-Effect-Free Composition\n\nEvery function in the `log` lib composes seamlessly with the rest of the 32 libs in `ridgun-libs`:\n\n```ridgun\nimport log\n\nfn :: emitir si procede (umbral : String) (nivel : String) (msg : String) => String\n      emitir si procede umbral nivel msg =\n        | log should emit umbral nivel = log format text nivel msg [(\"service\", \"solstice\")]\n        | otherwise                    = \"\"\n```\n\n---\n\n## 5. Under the Hood: Performance, RMM Memory, and Guarantees\n\n- **Algorithmic & Safety Guarantee**: Both `log format text` and `log format json` automatically pass fields through `log redact fields` prior to serialization, ensuring secrets never leak by accident.\n- **Deterministic Memory (`RMM1`/`RMM2`)**: Zero garbage-collector pauses; all intermediate allocations are reclaimed deterministically on scope exit.\n- **Continuous Verification**: Statically checked via `stable check` and tested by the automated suite in `src/test/ridgun/test_log.rg`.\n"}, {"num": "21", "slug": "21-lib-test-unit-and-functional-assertions", "file": "21-lib-test-unit-and-functional-assertions.md", "title": "Chapter 21: The `test` Lib — Unit and Functional Test Assertion Primitives (`RG-011`)", "short_title": "The `test` Lib — Unit and Functional Test Assertion Primitives (`RG-011`)", "markdown": "# Chapter 21: The `test` Lib — Unit and Functional Test Assertion Primitives (`RG-011`)\n\n## 1. Why Does the `test` Lib Exist?\n\nLet's be honest: when a testing framework demands compiler-magic macros, runtime reflection, or a bloated external runner, writing tests stops feeling immediate.\n\nThe **`test`** lib (`RG-011`) provides polymorphic and type-specific assertions that emit clear `[FAIL]` diagnostics showing expected vs. actual values and exit with code `1` the moment an invariant fails.\n\n---\n\n## 2. Bundles, Imports, and Zero-`libc` Architecture\n\nIn `ridgun-libs`, **`test`** is a first-class **lib** located at `src/main/ridgun/lib/test.rg` (domain `TST`). When built with `stable bundle`, it compiles into three native artifacts:\n\n| Artifact | Path | Purpose |\n|---|---|---|\n| **Ridgun Bundle** | `target/bundles/test.rglib` | Portable distribution and direct `import test` resolution |\n| **Compiled Archive** | `target/test.rgc` | Type-checked intermediate artifact verified by `ridgunc` |\n| **ELF64 Shared Object** | `target/libtest.so` | Native dynamic shared library with zero C or `libc` dependencies |\n\n> To use this lib in any `.rg` file, simply add `import test` at the top and call its functions using either multi-word spaces or underscores.\n\n---\n\n## 3. Quick API Reference for `test`\n\n| Signature / Function / Type | Purpose & Usage |\n|---|---|\n| `assert equals / assert eq : A -> A -> String -> ()` | Polymorphic equality assertion with descriptive test label |\n| `assert int equals / assert str eq` | Specialized `Int` and `String` equality assertions |\n| `assert true / assert false / assert not` | Boolean invariant assertions |\n| `assert ok : Int -> String -> ()` | Verify that an OS/socket status code equals `0` (`OK`) |\n\n---\n\n## 4. Practical Tabular Recipes\n\n### Recipe 1: Core Workflow with `test`\n\nNotice how the `=` signs and transformation steps align into a clean, scannable table:\n\n```ridgun\nimport test\nimport math\n\nfn :: suite matematicas () => ()\n      suite matematicas =\n        _ = assert int equals 12 (math gcd 36 60) \"MCD de 36 y 60\"\n        _ = assert true (math is prime 97) \"97 es primo\"\n        echo \"[PASS] suite matematicas\"\n```\n\n### Recipe 2: Safe, Side-Effect-Free Composition\n\nEvery function in the `test` lib composes seamlessly with the rest of the 32 libs in `ridgun-libs`:\n\n```ridgun\nimport test\n\nfn :: verificar codigo sistema (rc : Int) => ()\n      verificar codigo sistema rc =\n        assert ok rc \"operacion de descriptor exitosa\"\n```\n\n---\n\n## 5. Under the Hood: Performance, RMM Memory, and Guarantees\n\n- **Algorithmic & Safety Guarantee**: All 30 automated test suites in `ridgun-libs` (`src/test/ridgun/test_*.rg`, over 4,000 lines of tests) run on this exact lib via `stable test`.\n- **Deterministic Memory (`RMM1`/`RMM2`)**: Zero garbage-collector pauses; all intermediate allocations are reclaimed deterministically on scope exit.\n- **Continuous Verification**: Statically checked via `stable check` and tested by the automated suite in `src/test/ridgun/test_test.rg`.\n"}, {"num": "22", "slug": "22-lib-posix-pal-clocks-signals-and-csprng", "file": "22-lib-posix-pal-clocks-signals-and-csprng.md", "title": "Chapter 22: The `posix` Lib — 2-Layer PAL (`SysOs`, `SysArch`), Clocks, Signals, and CSPRNG", "short_title": "The `posix` Lib — 2-Layer PAL (`SysOs`, `SysArch`), Clocks, Signals, and CSPRNG", "markdown": "# Chapter 22: The `posix` Lib — 2-Layer PAL (`SysOs`, `SysArch`), Clocks, Signals, and CSPRNG\n\n## 1. Why Does the `posix` Lib Exist?\n\nLet's be honest: flags like `O_CREAT` and `O_NONBLOCK` or syscall numbers differ across Linux, macOS, and CPU architectures (`X86_64` vs `Arm64`), and C codebases solve it with an unreadable `#ifdef` jungle.\n\nThe **`posix`** lib implements Ridgun's 2-layer **Platform Abstraction Layer (PAL)** via tabular pattern matching on `sys os` (`Linux | MacOS | Windows`) and `sys arch` (`X86_64 | Arm64 | RiscV64`), plus descriptor polling (`wait fd` / `PollStatus`), monotonic/wall clocks (`RGF-017`), signal watchers (`RGF-018`), and kernel CSPRNG (`sys random bytes`).\n\n---\n\n## 2. Bundles, Imports, and Zero-`libc` Architecture\n\nIn `ridgun-libs`, **`posix`** is a first-class **lib** located at `src/main/ridgun/lib/posix.rg` (domain `POSIX`). When built with `stable bundle`, it compiles into three native artifacts:\n\n| Artifact | Path | Purpose |\n|---|---|---|\n| **Ridgun Bundle** | `target/bundles/posix.rglib` | Portable distribution and direct `import posix` resolution |\n| **Compiled Archive** | `target/posix.rgc` | Type-checked intermediate artifact verified by `ridgunc` |\n| **ELF64 Shared Object** | `target/libposix.so` | Native dynamic shared library with zero C or `libc` dependencies |\n\n> To use this lib in any `.rg` file, simply add `import posix` at the top and call its functions using either multi-word spaces or underscores.\n\n---\n\n## 3. Quick API Reference for `posix`\n\n| Signature / Function / Type | Purpose & Usage |\n|---|---|\n| `pal open create trunc wr / pal o nonblock` | Target-aware OS flag translation via `sys os` (`Linux | MacOS | Windows`) |\n| `wait fd : Int -> Int -> Int -> PollStatus` | Poll descriptor readiness returning `PollReady`, `PollTimeout`, or `PollError errno` |\n| `clock monotonic ms / clock monotonic ns / clock wall ms` | Monotonic elapsed clocks and UTC wall-clock milliseconds (`RGF-017`) |\n| `signal watch / signal poll / sys random bytes` | Non-blocking signal polling (`SIGINT`, `SIGTERM`) and kernel CSPRNG bytes |\n| `read text / write text / file exists / run cmd` | High-level file I/O, directory operations, and child process wrappers |\n\n---\n\n## 4. Practical Tabular Recipes\n\n### Recipe 1: Core Workflow with `posix`\n\nNotice how the `=` signs and transformation steps align into a clean, scannable table:\n\n```ridgun\nimport posix\n\nfn :: medir operacion () => (Int, Int)\n      medir operacion =\n        t0  = clock monotonic ms\n        rnd = len (sys random bytes 32)\n        t1  = clock monotonic ms\n        (rnd, t1 - t0)\n```\n\n### Recipe 2: Safe, Side-Effect-Free Composition\n\nEvery function in the `posix` lib composes seamlessly with the rest of the 32 libs in `ridgun-libs`:\n\n```ridgun\nimport posix\n\nfn :: esperar lectura (fd : Int) => Bool\n      esperar lectura fd =\n        est = wait fd fd poll_in 100\n        est == PollReady\n```\n\n---\n\n## 5. Under the Hood: Performance, RMM Memory, and Guarantees\n\n- **Algorithmic & Safety Guarantee**: Non-matching `sys os` and `sys arch` branches are statically pruned at compile time (Dead-Code Elimination) by `ridgunc`.\n- **Deterministic Memory (`RMM1`/`RMM2`)**: Zero garbage-collector pauses; all intermediate allocations are reclaimed deterministically on scope exit.\n- **Continuous Verification**: Statically checked via `stable check` and tested by the automated suite in `src/test/ridgun/test_posix.rg`.\n"}, {"num": "23", "slug": "23-lib-io-timeout-bounded-io-and-processes", "file": "23-lib-io-timeout-bounded-io-and-processes.md", "title": "Chapter 23: The `io` Lib — Typed `IoResult` Errors, `with timeout` Descriptor I/O, and Processes", "short_title": "The `io` Lib — Typed `IoResult` Errors, `with timeout` Descriptor I/O, and Processes", "markdown": "# Chapter 23: The `io` Lib — Typed `IoResult` Errors, `with timeout` Descriptor I/O, and Processes\n\n## 1. Why Does the `io` Lib Exist?\n\nLet's be honest: an unbounded `read()` call or child process execution with no deadline is an open invitation for one stalled peer to exhaust every worker in your server.\n\nThe **`io`** lib models every system operation through explicit ADTs (`IoError`, `IoResult[A]`), pairs non-blocking `ppoll` with Ridgun's lexical `with timeout wait_ms do` quotas, and exports the `read fd ... timeout` and `write fd ... timeout` mixfix operators.\n\n---\n\n## 2. Bundles, Imports, and Zero-`libc` Architecture\n\nIn `ridgun-libs`, **`io`** is a first-class **lib** located at `src/main/ridgun/lib/io.rg` (domain `IO`). When built with `stable bundle`, it compiles into three native artifacts:\n\n| Artifact | Path | Purpose |\n|---|---|---|\n| **Ridgun Bundle** | `target/bundles/io.rglib` | Portable distribution and direct `import io` resolution |\n| **Compiled Archive** | `target/io.rgc` | Type-checked intermediate artifact verified by `ridgunc` |\n| **ELF64 Shared Object** | `target/libio.so` | Native dynamic shared library with zero C or `libc` dependencies |\n\n> To use this lib in any `.rg` file, simply add `import io` at the top and call its functions using either multi-word spaces or underscores.\n\n---\n\n## 3. Quick API Reference for `io`\n\n| Signature / Function / Type | Purpose & Usage |\n|---|---|\n| `type IoError / type IoResult[A]` | `IoNotFound | IoPermission | IoTimeout | IoRefused | IoReset | IoEOF | IoInvalid | IoSysError` |\n| `io read with timeout / io write with timeout` | Non-blocking descriptor read/write bounded by `wait_ms` |\n| `read fd N max M timeout T / write fd N data S timeout T` | Ergonomic mixfix operators (`op ::`) for deadline-bounded descriptor I/O |\n| `io read file / io write file / io read lines` | Safe file and line-stream helpers returning `IoResult` |\n| `exec with timeout : String -> Int -> IoResult[ProcStatus]` | Run an external command bounded by a lexical `with timeout` quota |\n\n---\n\n## 4. Practical Tabular Recipes\n\n### Recipe 1: Core Workflow with `io`\n\nNotice how the `=` signs and transformation steps align into a clean, scannable table:\n\n```ridgun\nimport io\n\nfn :: leer peticion segura (fd : Int) => String\n      leer peticion segura fd =\n        res = read fd fd max 4096 timeout 250\n        io unwrap or res \"\"\n```\n\n### Recipe 2: Safe, Side-Effect-Free Composition\n\nEvery function in the `io` lib composes seamlessly with the rest of the 32 libs in `ridgun-libs`:\n\n```ridgun\nimport io\n\nfn :: describir fallo () => String\n      describir fallo =\n        format io error (IoTimeout \"read\" 250)\n```\n\n---\n\n## 5. Under the Hood: Performance, RMM Memory, and Guarantees\n\n- **Algorithmic & Safety Guarantee**: No read, write, or child command executed through `io` with a `wait_ms` quota can ever block the calling thread or actor indefinitely.\n- **Deterministic Memory (`RMM1`/`RMM2`)**: Zero garbage-collector pauses; all intermediate allocations are reclaimed deterministically on scope exit.\n- **Continuous Verification**: Statically checked via `stable check` and tested by the automated suite in `src/test/ridgun/test_io.rg`.\n"}, {"num": "24", "slug": "24-lib-crypto-sha256-hmac-pbkdf2-and-aead", "file": "24-lib-crypto-sha256-hmac-pbkdf2-and-aead.md", "title": "Chapter 24: The `crypto` Lib — SHA-256, HMAC, PBKDF2, Argon2id, and ChaCha20-Poly1305 AEAD", "short_title": "The `crypto` Lib — SHA-256, HMAC, PBKDF2, Argon2id, and ChaCha20-Poly1305 AEAD", "markdown": "# Chapter 24: The `crypto` Lib — SHA-256, HMAC, PBKDF2, Argon2id, and ChaCha20-Poly1305 AEAD\n\n## 1. Why Does the `crypto` Lib Exist?\n\nLet's be honest: comparing an HMAC tag with `==` opens the door to timing side-channel attacks, while linking `libssl.so` just to compute `SHA-256` or encrypt with `ChaCha20-Poly1305` ruins static binary portability.\n\nThe **`crypto`** lib implements in 100% pure Ridgun over pre-allocated `Tensor[Int]` state: raw byte/bitwise primitives (`RGF-019`), **FIPS 180-4 SHA-256**, **RFC 2104 HMAC-SHA-256**, constant-time equality (`ct equal`), midstate-accelerated **RFC 8018 PBKDF2-HMAC-SHA-256**, 5-argument **Argon2id**, and **RFC 8439 ChaCha20-Poly1305 AEAD** (`aead seal` / `aead open`).\n\n---\n\n## 2. Bundles, Imports, and Zero-`libc` Architecture\n\nIn `ridgun-libs`, **`crypto`** is a first-class **lib** located at `src/main/ridgun/lib/crypto.rg` (domain `CRYPTO`). When built with `stable bundle`, it compiles into three native artifacts:\n\n| Artifact | Path | Purpose |\n|---|---|---|\n| **Ridgun Bundle** | `target/bundles/crypto.rglib` | Portable distribution and direct `import crypto` resolution |\n| **Compiled Archive** | `target/crypto.rgc` | Type-checked intermediate artifact verified by `ridgunc` |\n| **ELF64 Shared Object** | `target/libcrypto.so` | Native dynamic shared library with zero C or `libc` dependencies |\n\n> To use this lib in any `.rg` file, simply add `import crypto` at the top and call its functions using either multi-word spaces or underscores.\n\n---\n\n## 3. Quick API Reference for `crypto`\n\n| Signature / Function / Type | Purpose & Usage |\n|---|---|\n| `sha256 bytes / sha256 hex` | FIPS 180-4 32-byte binary digest or 64-char lowercase hex digest |\n| `hmac sha256 / hmac sha256 hex / ct equal` | RFC 2104 keyed MAC and constant-time accumulator comparison |\n| `pbkdf2 hmac sha256 : String -> String -> Int -> Int -> String` | RFC 8018 key derivation with precomputed inner/outer SHA-256 midstates |\n| `argon2id hash / argon2id verify` | 5-argument RFC 9106 PHC password hashing and constant-time verification |\n| `aead seal / aead open` | RFC 8439 ChaCha20-Poly1305 authenticated encryption and tag-verified decryption |\n\n---\n\n## 4. Practical Tabular Recipes\n\n### Recipe 1: Core Workflow with `crypto`\n\nNotice how the `=` signs and transformation steps align into a clean, scannable table:\n\n```ridgun\nimport crypto\n\nfn :: cifrar mensaje sesion (secreto : String) (texto : String) => (Int, String)\n      cifrar mensaje sesion secreto texto =\n        key32   = sha256 bytes secreto\n        nonce12 = \"0123456789ab\"\n        aad     = \"canal-autenticado\"\n        sellado = aead seal key32 nonce12 aad texto\n        aead open key32 nonce12 aad sellado\n```\n\n### Recipe 2: Safe, Side-Effect-Free Composition\n\nEvery function in the `crypto` lib composes seamlessly with the rest of the 32 libs in `ridgun-libs`:\n\n```ridgun\nimport crypto\n\nfn :: verificar firma webhook (clave : String) (cuerpo : String) (firma_hex : String) => Bool\n      verificar firma webhook clave cuerpo firma_hex =\n        esperada = hmac sha256 hex clave cuerpo\n        ct equal esperada firma_hex\n```\n\n---\n\n## 5. Under the Hood: Performance, RMM Memory, and Guarantees\n\n- **Algorithmic & Safety Guarantee**: `aead open` verifies the 16-byte Poly1305 authentication tag in constant time before releasing a single byte of plaintext (returning `(-1, \"\")` on tamper).\n- **Deterministic Memory (`RMM1`/`RMM2`)**: Zero garbage-collector pauses; all intermediate allocations are reclaimed deterministically on scope exit.\n- **Continuous Verification**: Statically checked via `stable check` and tested by the automated suite in `src/test/ridgun/test_crypto.rg`.\n"}, {"num": "25", "slug": "25-lib-argon2id-rfc9106-password-hashing", "file": "25-lib-argon2id-rfc9106-password-hashing.md", "title": "Chapter 25: The `argon2id` Lib — RFC 9106 Argon2id on `Tensor[U64 * 8 * 16]`, Blake2b, and OWASP Presets", "short_title": "The `argon2id` Lib — RFC 9106 Argon2id on `Tensor[U64 * 8 * 16]`, Blake2b, and OWASP Presets", "markdown": "# Chapter 25: The `argon2id` Lib — RFC 9106 Argon2id on `Tensor[U64 * 8 * 16]`, Blake2b, and OWASP Presets\n\n## 1. Why Does the `argon2id` Lib Exist?\n\nLet's be honest: hashing passwords with plain SHA-256 lets a modern GPU brute-force billions of guesses per second, yet linking external C libraries for Argon2id often brings FFI and build headaches.\n\nThe **`argon2id`** lib implements **RFC 9106 Argon2id** and **RFC 7693 Blake2b-512** in 100% pure Ridgun directly over native `Tensor[U64 * 8 * 16]` blocks (1,024 contiguous bytes per block in RMM2 memory), complete with **PHC** string formatting (`$argon2id$v=19$m=...,t=...,p=...$`), **OWASP** presets (`owaspfirst`, `owaspsecond`), secret pepper/associated-data context (`argon2id hash ctx`), raw key derivation (`argon2id derive key`), and parameter upgrade detection (`argon2id needs rehash`).\n\n---\n\n## 2. Bundles, Imports, and Zero-`libc` Architecture\n\nIn `ridgun-libs`, **`argon2id`** is a first-class **lib** located at `src/main/ridgun/lib/argon2id.rg` (domain `CRYPTO`). When built with `stable bundle`, it compiles into three native artifacts:\n\n| Artifact | Path | Purpose |\n|---|---|---|\n| **Ridgun Bundle** | `target/bundles/argon2id.rglib` | Portable distribution and direct `import argon2id` resolution |\n| **Compiled Archive** | `target/argon2id.rgc` | Type-checked intermediate artifact verified by `ridgunc` |\n| **ELF64 Shared Object** | `target/libargon2id.so` | Native dynamic shared library with zero C or `libc` dependencies |\n\n> To use this lib in any `.rg` file, simply add `import argon2id` at the top and call its functions using either multi-word spaces or underscores.\n\n---\n\n## 3. Quick API Reference for `argon2id`\n\n| Signature / Function / Type | Purpose & Usage |\n|---|---|\n| `argon2id hash / argon2id verify` | 6-argument RFC 9106 PHC password hashing (`pwd, salt, m_kib, t, p, tag_len`) and constant-time verification |\n| `argon2id hash with preset / argon2id params preset` | Hash using named presets: `\"interactive\"`, `\"owaspfirst\"` (`19456 KiB, t=2`), `\"owaspsecond\"` (`47104 KiB, t=1`), `\"moderate\"`, `\"sensitive\"` |\n| `argon2id hash ctx / argon2id verify ctx` | RFC 9106 hashing with secret `pepper` ($K$) and associated data ($X$) |\n| `argon2id derive key / argon2id needs rehash` | Raw binary key derivation and policy-upgrade detection on stored PHC strings |\n| `blake2b / blake2b hex` | General-purpose RFC 7693 Blake2b cryptographic digest (`1..64` bytes) |\n\n---\n\n## 4. Practical Tabular Recipes\n\n### Recipe 1: Core Workflow with `argon2id`\n\nNotice how the `=` signs and transformation steps align into a clean, scannable table:\n\n```ridgun\nimport argon2id\n\nfn :: proteger clave usuario (clave : String) => (String, Bool, Bool)\n      proteger clave usuario clave =\n        phc    = argon2id hash clave \"sal-unica-16byte\" 32 2 1 32\n        valido = argon2id verify clave phc\n        rehash = argon2id needs rehash phc 19456 2 1 32\n        (phc, valido, rehash)\n```\n\n### Recipe 2: Safe, Side-Effect-Free Composition\n\nEvery function in the `argon2id` lib composes seamlessly with the rest of the 32 libs in `ridgun-libs`:\n\n```ridgun\nimport argon2id\n\nfn :: derivar clave maestra (frase : String) (sal : String) => String\n      derivar clave maestra frase sal =\n        -- Deriva 32 bytes crudos listos para ChaCha20-Poly1305 AEAD\n        argon2id derive key frase sal 64 2 1 32\n```\n\n---\n\n## 5. Under the Hood: Performance, RMM Memory, and Guarantees\n\n- **Algorithmic & Safety Guarantee**: Byte-for-byte match with official RFC 9106 §5.3 and OpenSSL 3.5 test vectors, operating on native `Tensor[U64 * 8 * 16]` blocks without a single line of C.\n- **Deterministic Memory (`RMM1`/`RMM2`)**: Zero garbage-collector pauses; all intermediate allocations are reclaimed deterministically on scope exit.\n- **Continuous Verification**: Statically checked via `stable check` and tested by the automated suite in `src/test/ridgun/test_argon2id.rg`.\n"}, {"num": "26", "slug": "26-lib-jwt-rfc7519-and-encrypted-tokens", "file": "26-lib-jwt-rfc7519-and-encrypted-tokens.md", "title": "Chapter 26: The `jwt` Lib — RFC 7519 `HS256` JSON Web Tokens and ChaCha20-Poly1305 Encrypted Tokens", "short_title": "The `jwt` Lib — RFC 7519 `HS256` JSON Web Tokens and ChaCha20-Poly1305 Encrypted Tokens", "markdown": "# Chapter 26: The `jwt` Lib — RFC 7519 `HS256` JSON Web Tokens and ChaCha20-Poly1305 Encrypted Tokens\n\n## 1. Why Does the `jwt` Lib Exist?\n\nLet's be honest: the JWT ecosystem is notorious for `\"alg\":\"none\"` signature-bypass bugs and for developers stuffing confidential data into a standard JWT while forgetting that its payload is merely Base64url-encoded, not encrypted.\n\nThe **`jwt`** lib solves both needs: it signs and verifies **RFC 7519 (`HS256`) JWTs** while strictly enforcing `alg == \"HS256\"`, constant-time MAC comparison, and `exp`/`nbf` windows, and it also provides **`token seal` / `token open`** for opaque tokens encrypted with **ChaCha20-Poly1305 AEAD**.\n\n---\n\n## 2. Bundles, Imports, and Zero-`libc` Architecture\n\nIn `ridgun-libs`, **`jwt`** is a first-class **lib** located at `src/main/ridgun/lib/jwt.rg` (domain `JWT`). When built with `stable bundle`, it compiles into three native artifacts:\n\n| Artifact | Path | Purpose |\n|---|---|---|\n| **Ridgun Bundle** | `target/bundles/jwt.rglib` | Portable distribution and direct `import jwt` resolution |\n| **Compiled Archive** | `target/jwt.rgc` | Type-checked intermediate artifact verified by `ridgunc` |\n| **ELF64 Shared Object** | `target/libjwt.so` | Native dynamic shared library with zero C or `libc` dependencies |\n\n> To use this lib in any `.rg` file, simply add `import jwt` at the top and call its functions using either multi-word spaces or underscores.\n\n---\n\n## 3. Quick API Reference for `jwt`\n\n| Signature / Function / Type | Purpose & Usage |\n|---|---|\n| `type JwtResult` | `JwtOk JsonVal | JwtExpired | JwtNotYetValid | JwtBadSignature | JwtMalformed` |\n| `jwt sign hs256 / jwt verify hs256` | Sign `JsonVal` claims and verify signature + `alg == \"HS256\"` + `exp`/`nbf` |\n| `jwt claims / jwt get str / jwt get int` | Build standard `(sub, iss, iat, exp)` claims and query verified payloads |\n| `token seal / token open` | Encrypt and authenticate opaque JSON tokens via ChaCha20-Poly1305 AEAD |\n\n---\n\n## 4. Practical Tabular Recipes\n\n### Recipe 1: Core Workflow with `jwt`\n\nNotice how the `=` signs and transformation steps align into a clean, scannable table:\n\n```ridgun\nimport jwt\nimport json\n\nfn :: emitir y verificar sesion (secreto : String) => (String, String)\n      emitir y verificar sesion secreto =\n        claims = jwt claims \"user-42\" \"solstice\" 1700000000 1700003600\n        tok    = jwt sign hs256 secreto claims\n        res    = jwt verify hs256 secreto tok 1700001000\n        sub    = jwt get str res \"sub\" \"anonimo\"\n        (tok, sub)\n```\n\n### Recipe 2: Safe, Side-Effect-Free Composition\n\nEvery function in the `jwt` lib composes seamlessly with the rest of the 32 libs in `ridgun-libs`:\n\n```ridgun\nimport jwt\nimport json\n\nfn :: sellar token confidencial (clave : String) => JwtResult\n      sellar token confidencial clave =\n        datos = JnObj [(\"rol\", JnStr \"root\"), (\"pin\", JnInt 9988)]\n        sobre = token seal clave \"nonce-12byte\" datos\n        token open clave sobre\n```\n\n---\n\n## 5. Under the Hood: Performance, RMM Memory, and Guarantees\n\n- **Algorithmic & Safety Guarantee**: Complete immunity to `\"alg\":\"none\"` downgrade attacks (any header where `alg != \"HS256\"` returns `JwtBadSignature`) and constant-time MAC verification.\n- **Deterministic Memory (`RMM1`/`RMM2`)**: Zero garbage-collector pauses; all intermediate allocations are reclaimed deterministically on scope exit.\n- **Continuous Verification**: Statically checked via `stable check` and tested by the automated suite in `src/test/ridgun/test_jwt.rg`.\n"}, {"num": "27", "slug": "27-lib-socket-tcp-udp-dns-and-kernel-sockets", "file": "27-lib-socket-tcp-udp-dns-and-kernel-sockets.md", "title": "Chapter 27: The `socket` Lib — TCP, UDP, AF_UNIX, Framing, DNS, and `RGF-001` Kernel Sockets", "short_title": "The `socket` Lib — TCP, UDP, AF_UNIX, Framing, DNS, and `RGF-001` Kernel Sockets", "markdown": "# Chapter 27: The `socket` Lib — TCP, UDP, AF_UNIX, Framing, DNS, and `RGF-001` Kernel Sockets\n\n## 1. Why Does the `socket` Lib Exist?\n\nLet's be honest: programming BSD sockets in C with `struct sockaddr_in`, `htons`, `inet_pton`, and `getaddrinfo` (which drags in `glibc`'s dynamic `libnss` plugins) is an arcane 1980s ritual.\n\nThe **`socket`** lib provides two complementary zero-C layers: (1) the **`RGF-001`** kernel descriptor API built for production servers like **Solstice** (`sys tcp listen`, `sys tcp listen reuseport`, `sys accept`, `sys tcp connect`, `sys send`, `sys recv`, `sys resolve ipv4` via `/etc/hosts` + RFC 1035 UDP port 53 DNS wire packets) and (2) the immutable functional `Socket` state machine with length-prefixed framing, CRLF line I/O, and CIDR matching.\n\n---\n\n## 2. Bundles, Imports, and Zero-`libc` Architecture\n\nIn `ridgun-libs`, **`socket`** is a first-class **lib** located at `src/main/ridgun/lib/socket.rg` (domain `SOCK`). When built with `stable bundle`, it compiles into three native artifacts:\n\n| Artifact | Path | Purpose |\n|---|---|---|\n| **Ridgun Bundle** | `target/bundles/socket.rglib` | Portable distribution and direct `import socket` resolution |\n| **Compiled Archive** | `target/socket.rgc` | Type-checked intermediate artifact verified by `ridgunc` |\n| **ELF64 Shared Object** | `target/libsocket.so` | Native dynamic shared library with zero C or `libc` dependencies |\n\n> To use this lib in any `.rg` file, simply add `import socket` at the top and call its functions using either multi-word spaces or underscores.\n\n---\n\n## 3. Quick API Reference for `socket`\n\n| Signature / Function / Type | Purpose & Usage |\n|---|---|\n| `sys tcp listen / sys tcp listen reuseport / sys unix listen` | Bind and listen on IPv4 TCP (`SO_REUSEADDR` / `SO_REUSEPORT`) or `AF_UNIX` |\n| `sys accept / sys tcp connect / sys unix connect` | Deadline-bounded accept and connect returning `SockFdResult` / `SockAcceptResult` |\n| `sys send / sys recv / sys shutdown write` | Timeout-bounded kernel socket send, receive, and half-close (`SHUT_WR`) |\n| `sys resolve ipv4 / dns resolve a` | Pure-Ridgun IPv4 resolution via `/etc/hosts` and RFC 1035 UDP DNS wire queries |\n| `sock send frame / sock recv frame / ipv4 in cidr` | Length-prefixed (`N:payload`) framing and IPv4 CIDR subnet matching |\n\n---\n\n## 4. Practical Tabular Recipes\n\n### Recipe 1: Core Workflow with `socket`\n\nNotice how the `=` signs and transformation steps align into a clean, scannable table:\n\n```ridgun\nimport socket\n\nfn :: eco tcp local () => String\n      eco tcp local =\n        l_res = sys tcp listen \"127.0.0.1\" 0 16\n        lfd   = sock fd l_res\n        port  = sys local port lfd\n        c_res = sys tcp connect \"127.0.0.1\" port 1000\n        cfd   = sock fd c_res\n        a_res = sys accept lfd 1000\n        sfd   = sock accept fd a_res\n        _     = sys send cfd \"hola-solstice\" 1000\n        r_res = sys recv sfd 64 1000\n        datos = sock recv data r_res\n        _     = sys_close cfd\n        _     = sys_close sfd\n        _     = sys_close lfd\n        datos\n```\n\n### Recipe 2: Safe, Side-Effect-Free Composition\n\nEvery function in the `socket` lib composes seamlessly with the rest of the 32 libs in `ridgun-libs`:\n\n```ridgun\nimport socket\n\nfn :: verificar ip interna (ip : String) => Bool\n      verificar ip interna ip =\n        ipv4 in cidr ip \"10.0.0.0/8\"\n```\n\n---\n\n## 5. Under the Hood: Performance, RMM Memory, and Guarantees\n\n- **Algorithmic & Safety Guarantee**: Record updates using immutable `s with field = val` syntax, zero-`glibc`/`libnss` DNS resolution, and deterministic status codes (`0` OK, `-1` EOF, `-2` TIMEOUT, `-3` REFUSED).\n- **Deterministic Memory (`RMM1`/`RMM2`)**: Zero garbage-collector pauses; all intermediate allocations are reclaimed deterministically on scope exit.\n- **Continuous Verification**: Statically checked via `stable check` and tested by the automated suite in `src/test/ridgun/test_socket.rg`.\n"}, {"num": "28", "slug": "28-lib-http-uris-http11-and-tcp-client", "file": "28-lib-http-uris-http11-and-tcp-client.md", "title": "Chapter 28: The `http` Lib — RFC 3986 URIs, RFC 9112 HTTP/1.1 Wire Codec, and Live TCP Client", "short_title": "The `http` Lib — RFC 3986 URIs, RFC 9112 HTTP/1.1 Wire Codec, and Live TCP Client", "markdown": "# Chapter 28: The `http` Lib — RFC 3986 URIs, RFC 9112 HTTP/1.1 Wire Codec, and Live TCP Client\n\n## 1. Why Does the `http` Lib Exist?\n\nLet's be honest: failing to strip `\\r\\n` from HTTP header values invites CRLF header-injection attacks, while linking `libcurl` just to make a clean HTTP/1.1 `GET` or `POST` call is massive overkill.\n\nThe **`http`** lib implements **RFC 3986 URI** parsing, **RFC 9112 HTTP/1.1** request/response wire formatting and parsing with automatic CRLF sanitization (`VUL-INJ-002`) and `Content-Length` injection, `Bearer` token extraction, and a **live kernel-TCP HTTP/1.1 client** (`http get`, `http post`, `http request tcp`).\n\n---\n\n## 2. Bundles, Imports, and Zero-`libc` Architecture\n\nIn `ridgun-libs`, **`http`** is a first-class **lib** located at `src/main/ridgun/lib/http.rg` (domain `HTTP`). When built with `stable bundle`, it compiles into three native artifacts:\n\n| Artifact | Path | Purpose |\n|---|---|---|\n| **Ridgun Bundle** | `target/bundles/http.rglib` | Portable distribution and direct `import http` resolution |\n| **Compiled Archive** | `target/http.rgc` | Type-checked intermediate artifact verified by `ridgunc` |\n| **ELF64 Shared Object** | `target/libhttp.so` | Native dynamic shared library with zero C or `libc` dependencies |\n\n> To use this lib in any `.rg` file, simply add `import http` at the top and call its functions using either multi-word spaces or underscores.\n\n---\n\n## 3. Quick API Reference for `http`\n\n| Signature / Function / Type | Purpose & Usage |\n|---|---|\n| `uri parse / uri scheme / uri host / uri port / uri path / uri query` | Decompose RFC 3986 URIs with automatic default ports (`80` for `http`, `443` for `https`) |\n| `http build request / http parse request` | Format and parse HTTP/1.1 wire requests with CRLF header sanitization |\n| `http build response / http parse response` | Format and parse HTTP/1.1 wire responses with status reason phrases |\n| `http header get / http bearer token` | Case-insensitive header lookup and `Authorization: Bearer <token>` extraction |\n| `http get / http post / http request tcp` | Execute live HTTP/1.1 calls over kernel TCP sockets with `timeout_ms` |\n\n---\n\n## 4. Practical Tabular Recipes\n\n### Recipe 1: Core Workflow with `http`\n\nNotice how the `=` signs and transformation steps align into a clean, scannable table:\n\n```ridgun\nimport http\n\nfn :: inspeccionar endpoint (url : String) => (String, Int, String, String)\n      inspeccionar endpoint url =\n        host = uri host url\n        port = uri port url\n        path = uri path url\n        wire = http build request \"GET\" path [(\"Host\", host)] \"\"\n        (host, port, path, wire)\n```\n\n### Recipe 2: Safe, Side-Effect-Free Composition\n\nEvery function in the `http` lib composes seamlessly with the rest of the 32 libs in `ridgun-libs`:\n\n```ridgun\nimport http\n\nfn :: extraer credenciales (raw_req : String) => (String, String)\n      extraer credenciales raw_req =\n        (metodo, ruta, _, hdrs_raw, _) = http parse request raw_req\n        hdrs = http parse headers hdrs_raw\n        tok  = http bearer token hdrs\n        (metodo + \" \" + ruta, tok)\n```\n\n---\n\n## 5. Under the Hood: Performance, RMM Memory, and Guarantees\n\n- **Algorithmic & Safety Guarantee**: Automatic stripping of `\\r` and `\\n` across all header keys and values (`http sanitize header`) to prevent HTTP response-splitting attacks.\n- **Deterministic Memory (`RMM1`/`RMM2`)**: Zero garbage-collector pauses; all intermediate allocations are reclaimed deterministically on scope exit.\n- **Continuous Verification**: Statically checked via `stable check` and tested by the automated suite in `src/test/ridgun/test_http.rg`.\n"}, {"num": "29", "slug": "29-lib-ws-rfc6455-websocket-protocol", "file": "29-lib-ws-rfc6455-websocket-protocol.md", "title": "Chapter 29: The `ws` Lib — RFC 6455 WebSocket Handshake, 16/64-Bit Frame Codec, and XOR Masking", "short_title": "The `ws` Lib — RFC 6455 WebSocket Handshake, 16/64-Bit Frame Codec, and XOR Masking", "markdown": "# Chapter 29: The `ws` Lib — RFC 6455 WebSocket Handshake, 16/64-Bit Frame Codec, and XOR Masking\n\n## 1. Why Does the `ws` Lib Exist?\n\nLet's be honest: the WebSocket protocol (RFC 6455) combines a SHA-1 + Base64 upgrade handshake with variable-length binary framing (7-bit, 16-bit, or 64-bit) and mandatory client-to-server 4-byte XOR payload masking.\n\nThe **`ws`** lib implements full **RFC 6455** in pure Ridgun: `Sec-WebSocket-Accept` derivation (including a self-contained RFC 3174 SHA-1 solely for the handshake GUID), `101 Switching Protocols` HTTP upgrade builders, 7/16/64-bit `WsFrame` wire encoding/decoding, symmetric 4-byte XOR masking, and text/ping/pong/close frame constructors.\n\n---\n\n## 2. Bundles, Imports, and Zero-`libc` Architecture\n\nIn `ridgun-libs`, **`ws`** is a first-class **lib** located at `src/main/ridgun/lib/ws.rg` (domain `WS`). When built with `stable bundle`, it compiles into three native artifacts:\n\n| Artifact | Path | Purpose |\n|---|---|---|\n| **Ridgun Bundle** | `target/bundles/ws.rglib` | Portable distribution and direct `import ws` resolution |\n| **Compiled Archive** | `target/ws.rgc` | Type-checked intermediate artifact verified by `ridgunc` |\n| **ELF64 Shared Object** | `target/libws.so` | Native dynamic shared library with zero C or `libc` dependencies |\n\n> To use this lib in any `.rg` file, simply add `import ws` at the top and call its functions using either multi-word spaces or underscores.\n\n---\n\n## 3. Quick API Reference for `ws`\n\n| Signature / Function / Type | Purpose & Usage |\n|---|---|\n| `ws accept key : String -> String` | Compute RFC 6455 §1.3 `Sec-WebSocket-Accept` from `Sec-WebSocket-Key` |\n| `ws build upgrade request / ws build upgrade response` | Format HTTP/1.1 WebSocket upgrade handshake messages |\n| `ws encode frame / ws decode frame` | Encode and decode `WsFrame` (`fin`, `opcode`, `masked`, `mask_key`, `payload`) |\n| `ws text frame / ws ping frame / ws pong frame / ws close frame` | High-level frame constructors and close-code extractors (`1000` normal closure) |\n\n---\n\n## 4. Practical Tabular Recipes\n\n### Recipe 1: Core Workflow with `ws`\n\nNotice how the `=` signs and transformation steps align into a clean, scannable table:\n\n```ridgun\nimport ws\n\nfn :: negociar y enviar (client_key : String) => (String, String)\n      negociar y enviar client_key =\n        resp  = ws build upgrade response client_key\n        trama = ws encode frame (ws text frame \"hola-tiempo-real\" False \"\")\n        (resp, trama)\n```\n\n### Recipe 2: Safe, Side-Effect-Free Composition\n\nEvery function in the `ws` lib composes seamlessly with the rest of the 32 libs in `ridgun-libs`:\n\n```ridgun\nimport ws\n\nfn :: decodificar trama cliente (clave4 : String) (msg : String) => String\n      decodificar trama cliente clave4 msg =\n        wire = ws encode frame (ws text frame msg True clave4)\n        res  = ws decode frame wire\n        ws frame payload res\n```\n\n---\n\n## 5. Under the Hood: Performance, RMM Memory, and Guarantees\n\n- **Algorithmic & Safety Guarantee**: Exact match with the official RFC 6455 handshake vector (`\"dGhlIHNhbXBsZSBub25jZQ==\"` $\\rightarrow$ `\"s3pPLMBiTxaQ9kYGzzhZRbK+xOo=\"`) and automatic XOR unmasking in `ws decode frame`.\n- **Deterministic Memory (`RMM1`/`RMM2`)**: Zero garbage-collector pauses; all intermediate allocations are reclaimed deterministically on scope exit.\n- **Continuous Verification**: Statically checked via `stable check` and tested by the automated suite in `src/test/ridgun/test_ws.rg`.\n"}, {"num": "30", "slug": "30-lib-agent-native-actor-concurrency", "file": "30-lib-agent-native-actor-concurrency.md", "title": "Chapter 30: The `agent` Lib — Native Actor Concurrency (`agent`, `send`, `receive`), KV Store, and Rate Limiter", "short_title": "The `agent` Lib — Native Actor Concurrency (`agent`, `send`, `receive`), KV Store, and Rate Limiter", "markdown": "# Chapter 30: The `agent` Lib — Native Actor Concurrency (`agent`, `send`, `receive`), KV Store, and Rate Limiter\n\n## 1. Why Does the `agent` Lib Exist?\n\nLet's be honest: sharing mutable state across threads with `Mutex`, `RwLock`, and condition variables is an endless factory of deadlocks and race conditions.\n\nThe **`agent`** lib builds on Ridgun's **Native Agent Model** (`agent`, `send ... to`, `receive from`, `try receive from`, `stop`) to provide isolated message-passing actors, a concurrent key-value store (`KvStore`), a token-bucket rate limiter (`RateBucket`), and supervision state machines (`AgentHealth`).\n\n---\n\n## 2. Bundles, Imports, and Zero-`libc` Architecture\n\nIn `ridgun-libs`, **`agent`** is a first-class **lib** located at `src/main/ridgun/lib/agent.rg` (domain `AGENT`). When built with `stable bundle`, it compiles into three native artifacts:\n\n| Artifact | Path | Purpose |\n|---|---|---|\n| **Ridgun Bundle** | `target/bundles/agent.rglib` | Portable distribution and direct `import agent` resolution |\n| **Compiled Archive** | `target/agent.rgc` | Type-checked intermediate artifact verified by `ridgunc` |\n| **ELF64 Shared Object** | `target/libagent.so` | Native dynamic shared library with zero C or `libc` dependencies |\n\n> To use this lib in any `.rg` file, simply add `import agent` at the top and call its functions using either multi-word spaces or underscores.\n\n---\n\n## 3. Quick API Reference for `agent`\n\n| Signature / Function / Type | Purpose & Usage |\n|---|---|\n| `agent roundtrip / agent drain count` | Spawn native Ridgun actors (`agent`), exchange messages (`send ... to` / `receive from`), and stop cleanly |\n| `kv store new / kv store apply` | Actor-ready immutable key-value store (`KvPut`, `KvGet`, `KvDelete`, `KvClear`) |\n| `rate bucket new / rate bucket allow` | Token-bucket rate limiter returning updated bucket and `(allowed, remaining)` |\n| `sup mark failed / sup should restart` | Supervision policy helpers tracking restart budgets (`max_restarts`) |\n\n---\n\n## 4. Practical Tabular Recipes\n\n### Recipe 1: Core Workflow with `agent`\n\nNotice how the `=` signs and transformation steps align into a clean, scannable table:\n\n```ridgun\nimport agent\n\nfn :: probar actor nativo () => (Int, Int)\n      probar actor nativo =\n        eco = agent roundtrip 42\n        vac = agent drain count [10, 20, 30]\n        (eco, vac)\n```\n\n### Recipe 2: Safe, Side-Effect-Free Composition\n\nEvery function in the `agent` lib composes seamlessly with the rest of the 32 libs in `ridgun-libs`:\n\n```ridgun\nimport agent\n\nfn :: aplicar limite peticion () => (Bool, Int)\n      aplicar limite peticion =\n        b0         = rate bucket new 10 2 1000\n        (b1, res1) = rate bucket allow b0 1 1000\n        rateresp allowed res1, rateobs remaining res1\n```\n\n---\n\n## 5. Under the Hood: Performance, RMM Memory, and Guarantees\n\n- **Algorithmic & Safety Guarantee**: Zero shared mutable memory across actors: every message is transferred by value / Copy-on-Write and `stop` deterministically reclaims the actor's region.\n- **Deterministic Memory (`RMM1`/`RMM2`)**: Zero garbage-collector pauses; all intermediate allocations are reclaimed deterministically on scope exit.\n- **Continuous Verification**: Statically checked via `stable check` and tested by the automated suite in `src/test/ridgun/test_agent.rg`.\n"}, {"num": "31", "slug": "31-lib-pool-worker-pool-and-work-stealing", "file": "31-lib-pool-worker-pool-and-work-stealing.md", "title": "Chapter 31: The `pool` Lib — Bounded Worker Pool, Round-Robin Dispatch, and Work-Stealing", "short_title": "The `pool` Lib — Bounded Worker Pool, Round-Robin Dispatch, and Work-Stealing", "markdown": "# Chapter 31: The `pool` Lib — Bounded Worker Pool, Round-Robin Dispatch, and Work-Stealing\n\n## 1. Why Does the `pool` Lib Exist?\n\nLet's be honest: spawning a fresh thread or actor for every incoming request with no upper bound guarantees that a traffic spike will drive your server into Out-Of-Memory in seconds.\n\nThe **`pool`** lib provides a bounded task dispatcher with **explicit backpressure** (`PoolAccept`, `PoolRejectFull`), balanced $K$-lane batch partitioning (`pool partition`), **work-stealing** queue rebalancing (`pool steal rebalance`), and parallel native-actor execution.\n\n---\n\n## 2. Bundles, Imports, and Zero-`libc` Architecture\n\nIn `ridgun-libs`, **`pool`** is a first-class **lib** located at `src/main/ridgun/lib/pool.rg` (domain `AGENT`). When built with `stable bundle`, it compiles into three native artifacts:\n\n| Artifact | Path | Purpose |\n|---|---|---|\n| **Ridgun Bundle** | `target/bundles/pool.rglib` | Portable distribution and direct `import pool` resolution |\n| **Compiled Archive** | `target/pool.rgc` | Type-checked intermediate artifact verified by `ridgunc` |\n| **ELF64 Shared Object** | `target/libpool.so` | Native dynamic shared library with zero C or `libc` dependencies |\n\n> To use this lib in any `.rg` file, simply add `import pool` at the top and call its functions using either multi-word spaces or underscores.\n\n---\n\n## 3. Quick API Reference for `pool`\n\n| Signature / Function / Type | Purpose & Usage |\n|---|---|\n| `pool new : Int -> Int -> PoolState` | Create a bounded pool with `workers` lanes and `max_queue` capacity |\n| `pool submit : PoolState -> PoolTask -> (PoolState, PoolDecision)` | Enqueue a task round-robin or return `PoolRejectFull` when saturated |\n| `pool partition / pool steal rebalance` | Split batches across $K$ workers and steal half of an overloaded queue for an idle worker |\n| `pool map sum / pool parallel sum2` | Dispatch integer workloads across concurrent native `agent` workers |\n\n---\n\n## 4. Practical Tabular Recipes\n\n### Recipe 1: Core Workflow with `pool`\n\nNotice how the `=` signs and transformation steps align into a clean, scannable table:\n\n```ridgun\nimport pool\n\nfn :: encolar con contrapresion () => (Int, Int)\n      encolar con contrapresion =\n        p0        = pool new 4 16\n        tarea     = PoolTask 1 100 \"indexar-bloque\"\n        (p1, dec) = pool submit p0 tarea\n        (pool queued p1, pool accepted p1)\n```\n\n### Recipe 2: Safe, Side-Effect-Free Composition\n\nEvery function in the `pool` lib composes seamlessly with the rest of the 32 libs in `ridgun-libs`:\n\n```ridgun\nimport pool\n\nfn :: sumar en paralelo () => Int\n      sumar en paralelo =\n        pool parallel sum2 [10, 20, 30] [40, 50, 60]\n```\n\n---\n\n## 5. Under the Hood: Performance, RMM Memory, and Guarantees\n\n- **Algorithmic & Safety Guarantee**: Strictly bounded queue capacity (`queued <= max_queue`) to protect memory under load spikes and deterministic round-robin / work-stealing distribution.\n- **Deterministic Memory (`RMM1`/`RMM2`)**: Zero garbage-collector pauses; all intermediate allocations are reclaimed deterministically on scope exit.\n- **Continuous Verification**: Statically checked via `stable check` and tested by the automated suite in `src/test/ridgun/test_pool.rg`.\n"}, {"num": "32", "slug": "32-lib-net-agent-connection-supervisor", "file": "32-lib-net-agent-connection-supervisor.md", "title": "Chapter 32: The `net_agent` Lib — Socket Connection Actor Supervisor and Non-Blocking Event Bridge", "short_title": "The `net_agent` Lib — Socket Connection Actor Supervisor and Non-Blocking Event Bridge", "markdown": "# Chapter 32: The `net_agent` Lib — Socket Connection Actor Supervisor and Non-Blocking Event Bridge\n\n## 1. Why Does the `net_agent` Lib Exist?\n\nLet's be honest: in a real server like **Solstice**, accepting TCP connections is the easy part; the hard part is enforcing max concurrent clients, reaping idle zombie connections, and bridging `ppoll` readiness into actor messages without leaking file descriptors.\n\nThe **`net_agent`** lib closes the loop of `ridgun-libs` by uniting **`posix`**, **`socket`**, and **`agent`**: it manages supervised connection tables (`NetSupervisor`), enforces concurrency limits (`max_conns`), reaps idle peers (`net evict idle`), bridges kernel descriptor readiness into typed actor events (`NetEvReadyRead`, `NetEvReadyWrite`, `NetEvTimeout`, `NetEvError`), and provides an end-to-end supervised TCP echo step (`net tcp echo step`).\n\n---\n\n## 2. Bundles, Imports, and Zero-`libc` Architecture\n\nIn `ridgun-libs`, **`net_agent`** is a first-class **lib** located at `src/main/ridgun/lib/net_agent.rg` (domain `AGENT`). When built with `stable bundle`, it compiles into three native artifacts:\n\n| Artifact | Path | Purpose |\n|---|---|---|\n| **Ridgun Bundle** | `target/bundles/net_agent.rglib` | Portable distribution and direct `import net_agent` resolution |\n| **Compiled Archive** | `target/net_agent.rgc` | Type-checked intermediate artifact verified by `ridgunc` |\n| **ELF64 Shared Object** | `target/libnet_agent.so` | Native dynamic shared library with zero C or `libc` dependencies |\n\n> To use this lib in any `.rg` file, simply add `import net_agent` at the top and call its functions using either multi-word spaces or underscores.\n\n---\n\n## 3. Quick API Reference for `net_agent`\n\n| Signature / Function / Type | Purpose & Usage |\n|---|---|\n| `net supervisor new : Int -> Int -> NetSupervisor` | Create a connection supervisor with `max_conns` and `idle_timeout_ms` |\n| `net register conn / net record rx / net record tx / net close conn` | Register accepted sockets, track byte counters/activity timestamps, and close peers |\n| `net evict idle : NetSupervisor -> Int -> (NetSupervisor, [Int])` | Close and evict connections idle longer than `idle_timeout_ms`, returning evicted FDs |\n| `net poll fd : Int -> Bool -> Int -> NetEvent` | Non-blocking `wait fd` bridge emitting `NetEvReadyRead`, `NetEvReadyWrite`, `NetEvTimeout`, or `NetEvError` |\n| `net tcp echo step : String -> Int -> (Int, String)` | End-to-end loopback TCP listen/connect/accept/supervise/echo verification step |\n\n---\n\n## 4. Practical Tabular Recipes\n\n### Recipe 1: Core Workflow with `net_agent`\n\nNotice how the `=` signs and transformation steps align into a clean, scannable table:\n\n```ridgun\nimport net_agent\n\nfn :: supervisar clientes () => (Int, [Int])\n      supervisar clientes =\n        s0        = net supervisor new 100 5000\n        (s1, _)   = net register conn s0 10 \"10.0.0.1\" 51000 1000\n        (s2, _)   = net register conn s1 11 \"10.0.0.2\" 51001 6500\n        (s3, exp) = net evict idle s2 7000\n        (net active count s3, exp)\n```\n\n### Recipe 2: Safe, Side-Effect-Free Composition\n\nEvery function in the `net_agent` lib composes seamlessly with the rest of the 32 libs in `ridgun-libs`:\n\n```ridgun\nimport net_agent\n\nfn :: probar puente tcp supervisado () => (Int, String)\n      probar puente tcp supervisado =\n        net tcp echo step \"ping-supervisado\" 1000\n```\n\n---\n\n## 5. Under the Hood: Performance, RMM Memory, and Guarantees\n\n- **Algorithmic & Safety Guarantee**: Automatic protection against descriptor exhaustion (`max_conns`), deterministic eviction of idle peers, and guaranteed socket cleanup in `net tcp echo step`.\n- **Deterministic Memory (`RMM1`/`RMM2`)**: Zero garbage-collector pauses; all intermediate allocations are reclaimed deterministically on scope exit.\n- **Continuous Verification**: Statically checked via `stable check` and tested by the automated suite in `src/test/ridgun/test_net_agent.rg`.\n"}];
    const UI_STRINGS = {"copy_label": "Copy", "copied_label": "Copied!", "prev_label": "&larr; Previous chapter", "next_label": "Next chapter &rarr;", "search_hits_label": "Results for", "search_empty_label": "No matches found for"};
    let currentIdx = 0;

    function escapeHtml(s) {
      return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function highlightRidgun(code) {
      return code.split("\n").map(line => {
        const comIdx = (() => {
          let inD = false, inS = false;
          for (let i = 0; i < line.length - 1; i++) {
            if (line[i] === "\\") { i++; continue; }
            if (line[i] === '"' && !inS) inD = !inD;
            else if (line[i] === "'" && !inD) inS = !inS;
            else if (!inD && !inS && line[i] === "-" && line[i+1] === "-") return i;
          }
          return -1;
        })();
        const codePart = comIdx >= 0 ? line.slice(0, comIdx) : line;
        const comPart = comIdx >= 0 ? line.slice(comIdx) : "";
        let html = escapeHtml(codePart);
        html = html.replace(/("([^"\\]|\\.)*"|'[^']*')/g, '<span class="rg-str">$1</span>');
        html = html.replace(/\b(fn|op|type|import|mut|otherwise|with|region|timeout|do|global|context|shared|atomic|hardware|echo|and|or|xor|not|agent|send|to|receive|from|try|stop)\b/g, '<span class="rg-kw">$1</span>');
        html = html.replace(/\b(Int|Real|String|Char|Bool|U64|Tensor|Option|Result|Some|None|Ok|Err|OutOfMemory|Timeout|True|False)\b/g, '<span class="rg-ty">$1</span>');
        html = html.replace(/(::|=&gt;|-&gt;|&lt;-|\|\|\.|\|\||\|\.)/g, '<span class="rg-op">$1</span>');
        html = html.replace(/\b(0x[0-9a-fA-F_]+|[0-9][0-9_]*(_KB|_MB|_GB)?(\.[0-9]+)?)\b/g, '<span class="rg-num">$1</span>');
        if (comPart) {
          html += '<span class="rg-com">' + escapeHtml(comPart) + '</span>';
        }
        return html;
      }).join("\n");
    }

    function formatInline(text) {
      let out = escapeHtml(text);
      out = out.replace(/`([^`]+)`/g, "<code>$1</code>");
      out = out.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      out = out.replace(/\*([^*]+)\*/g, "<em>$1</em>");
      out = out.replace(/\$O\(([^)]+)\)\$/g, "<code>O($1)</code>");
      out = out.replace(/\$\\rightarrow\$/g, "&rarr;");
      return out;
    }

    function renderMarkdown(md) {
      const lines = md.split("\n");
      let html = "";
      let i = 0;
      while (i < lines.length) {
        const line = lines[i];
        if (line.startsWith("```")) {
          const lang = line.slice(3).trim() || "ridgun";
          i++;
          const buf = [];
          while (i < lines.length && !lines[i].startsWith("```")) {
            buf.push(lines[i]);
            i++;
          }
          i++;
          const rawCode = buf.join("\n");
          const bodyHtml = (lang === "ridgun" || lang === "") ? highlightRidgun(rawCode) : escapeHtml(rawCode);
          html += `<div class="code-wrapper"><div class="code-header"><span>${escapeHtml(lang)}</span><button class="copy-btn" onclick="copyCode(this)">${escapeHtml(UI_STRINGS.copy_label)}</button></div><pre data-raw="${ encodeURIComponent(rawCode) }"><code>${bodyHtml}</code></pre></div>`;
          continue;
        }
        if (/^---+$/.test(line.trim())) {
          html += "<hr />";
          i++;
          continue;
        }
        if (line.startsWith("# ")) {
          html += `<h1>${formatInline(line.slice(2).trim())}</h1>`;
          i++;
          continue;
        }
        if (line.startsWith("## ")) {
          html += `<h2>${formatInline(line.slice(3).trim())}</h2>`;
          i++;
          continue;
        }
        if (line.startsWith("### ")) {
          html += `<h3>${formatInline(line.slice(4).trim())}</h3>`;
          i++;
          continue;
        }
        if (line.trim().startsWith("|") && i + 1 < lines.length && /^\|[\s:-]+\|/.test(lines[i+1].trim())) {
          const headers = line.trim().slice(1, -1).split("|").map(c => formatInline(c.trim()));
          i += 2;
          const rows = [];
          while (i < lines.length && lines[i].trim().startsWith("|")) {
            rows.push(lines[i].trim().slice(1, -1).split("|").map(c => formatInline(c.trim())));
            i++;
          }
          html += '<div class="table-wrap"><table><thead><tr>' + headers.map(h => `<th>${h}</th>`).join("") + '</tr></thead><tbody>' +
                  rows.map(r => '<tr>' + r.map(c => `<td>${c}</td>`).join("") + '</tr>').join("") + '</tbody></table></div>';
          continue;
        }
        if (line.startsWith(">")) {
          const qLines = [];
          while (i < lines.length && lines[i].startsWith(">")) {
            qLines.push(lines[i].replace(/^>\s?/, ""));
            i++;
          }
          html += `<blockquote><p>${qLines.map(formatInline).join("<br/>")}</p></blockquote>`;
          continue;
        }
        if (/^\s*-\s+/.test(line)) {
          const items = [];
          while (i < lines.length && /^\s*-\s+/.test(lines[i])) {
            items.push(formatInline(lines[i].replace(/^\s*-\s+/, "")));
            i++;
          }
          html += "<ul>" + items.map(it => `<li>${it}</li>`).join("") + "</ul>";
          continue;
        }
        if (/^\s*\d+\.\s+/.test(line)) {
          const items = [];
          while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
            items.push(formatInline(lines[i].replace(/^\s*\d+\.\s+/, "")));
            i++;
          }
          html += "<ol>" + items.map(it => `<li>${it}</li>`).join("") + "</ol>";
          continue;
        }
        if (!line.trim()) {
          i++;
          continue;
        }
        const pLines = [];
        while (i < lines.length && lines[i].trim() && !lines[i].startsWith("#") && !lines[i].startsWith("```") && !lines[i].startsWith(">") && !lines[i].trim().startsWith("|") && !/^---+$/.test(lines[i].trim()) && !/^\s*(-|\d+\.)\s+/.test(lines[i])) {
          pLines.push(formatInline(lines[i]));
          i++;
        }
        html += `<p>${pLines.join(" ")}</p>`;
      }
      return html;
    }

    window.copyCode = function(btn) {
      const pre = btn.closest(".code-wrapper").querySelector("pre");
      const raw = decodeURIComponent(pre.getAttribute("data-raw"));
      navigator.clipboard.writeText(raw);
      const old = btn.textContent;
      btn.textContent = UI_STRINGS.copied_label;
      setTimeout(() => { btn.textContent = old; }, 1400);
    };

    function renderSidebar() {
      const nav = document.getElementById("navList");
      nav.innerHTML = CHAPTERS.map((ch, idx) => `
        <li class="nav-item">
          <button class="nav-btn ${idx === currentIdx ? 'active' : ''}" onclick="selectChapter(${idx})">
            <span class="nav-num">${ch.num}</span>
            <span>${escapeHtml(ch.short_title)}</span>
          </button>
        </li>
      `).join("");
    }

    window.selectChapter = function(idx) {
      currentIdx = idx;
      const ch = CHAPTERS[idx];
      location.hash = ch.slug;
      renderSidebar();
      let pagerHtml = '<div class="pager">';
      if (idx > 0) {
        pagerHtml += `<button class="pager-btn prev" onclick="selectChapter(${idx - 1})"><span class="pager-label">${UI_STRINGS.prev_label}</span><span class="pager-title">${escapeHtml(CHAPTERS[idx - 1].title)}</span></button>`;
      } else {
        pagerHtml += '<div></div>';
      }
      if (idx + 1 < CHAPTERS.length) {
        pagerHtml += `<button class="pager-btn next" onclick="selectChapter(${idx + 1})"><span class="pager-label">${UI_STRINGS.next_label}</span><span class="pager-title">${escapeHtml(CHAPTERS[idx + 1].title)}</span></button>`;
      }
      pagerHtml += '</div>';
      document.getElementById("chapterContent").innerHTML = renderMarkdown(ch.markdown) + pagerHtml;
      window.scrollTo({ top: 0, behavior: "smooth" });
    };

    document.getElementById("searchInput").addEventListener("input", (e) => {
      const q = e.target.value.trim().toLowerCase();
      if (q.length < 2) {
        selectChapter(currentIdx);
        return;
      }
      const hits = [];
      CHAPTERS.forEach((ch, idx) => {
        const lines = ch.markdown.split("\n");
        for (const l of lines) {
          if (l.toLowerCase().includes(q)) {
            hits.push({ idx, title: ch.title, snippet: l.replace(/^[#>*-]+\s*/, "").slice(0, 140) });
            break;
          }
        }
      });
      const box = hits.length
        ? `<div class="search-results"><strong>${escapeHtml(UI_STRINGS.search_hits_label)} "${escapeHtml(q)}" (${hits.length}):</strong>` +
          hits.map(h => `<div class="search-hit" onclick="document.getElementById('searchInput').value=''; selectChapter(${h.idx})"><div class="search-hit-title">${escapeHtml(h.title)}</div><div class="search-hit-snippet">${escapeHtml(h.snippet)}</div></div>`).join("") +
          `</div>`
        : `<div class="search-results">${escapeHtml(UI_STRINGS.search_empty_label)} "${escapeHtml(q)}".</div>`;
      document.getElementById("chapterContent").innerHTML = box + renderMarkdown(CHAPTERS[currentIdx].markdown);
    });

    document.getElementById("themeBtn").addEventListener("click", () => {
      const root = document.documentElement;
      root.setAttribute("data-theme", root.getAttribute("data-theme") === "dark" ? "light" : "dark");
    });

    const initialSlug = location.hash.replace(/^#/, "");
    const foundIdx = CHAPTERS.findIndex(c => c.slug === initialSlug);
    selectChapter(foundIdx >= 0 ? foundIdx : 0);
  </script>
