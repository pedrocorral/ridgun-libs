`?\n\nLåt oss vara ärliga: att skriva ut anropsfält till en loggfil och veckor senare upptäcka att `password`, `api_key` eller `authorization` sparats i klartext i logghanteraren är en klassisk säkerhetsincident.\n\nLib:en **`log`** erbjuder allvarlighetsfiltrering (`DEBUG`, `INFO`, `WARN`, `ERROR`), text- och **NDJSON-formatering** samt **automatisk maskering av känsliga nycklar** (`password`, `secret`, `token`, `api_key`, `authorization`, `cookie`, `private_key` $\\rightarrow$ `\"[REDACTED]\"`, vilket motverkar `VUL-LOG-001`).\n\n---\n\n## 2. Paket, import och arkitektur helt utan `libc`\n\nI `ridgun-libs` är **`log`** en förstklassig **lib** placerad i `src/main/ridgun/lib/log.rg` (domän `LOG`). När du bygger med `stable bundle` paketeras den i tre inbyggda format:\n\n| Artefakt | Sökväg | Syfte |\n|---|---|---|\n| **Ridgun-bundle** | `target/bundles/log.rglib` | Portabel distribution och direkt import med `import log` |\n| **Kompilerat arkiv** | `target/log.rgc` | Typkontrollerad mellanartefakt verifierad av `ridgunc` |\n| **Delat ELF64-objekt** | `target/liblog.so` | Inbyggt dynamiskt bibliotek helt utan C- eller `libc`-beroenden |\n\n> För att använda denna lib i valfri `.rg`-fil deklarerar du bara `import log` överst och anropar funktionerna med mellanslag eller understreck.\n\n---\n\n## 3. Snabbreferens för `log`-API:et\n\n| Signatur / Funktion / Typ | Vad den gör och när den används |\n|---|---|\n| `log level rank / log should emit` | Jämför loggnivåer (`DEBUG=10`, `INFO=20`, `WARN=30`, `ERROR=40`) mot inställd tröskel |\n| `log is sensitive key / log redact fields` | Ersätter skiftlägesokänsligt hemliga värden med `\"[REDACTED]\"` |\n| `log format text / log format json` | Formaterar `nyckel=värde`-text eller RFC 8259 NDJSON med automatisk sekretessmaskering |\n\n---\n\n## 4. Praktiska recept i tabellform\n\n### Recept 1: Huvudflöde med `log`\n\nLägg märke till hur `=`-tecknen och transformationsstegen linjeras som en ren tabell:\n\n```ridgun\nimport log\n\nfn :: auditar login (usuario : String) (clave : String) => String\n      auditar login usuario clave =\n        campos = [(\"user\", usuario), (\"password\", clave), (\"ip\", \"10.0.0.1\")]\n        log format json \"INFO\" \"intento de acceso\" campos\n```\n\n### Recept 2: Säker komposition utan sidoeffekter\n\nVarje funktion i lib:en `log` kan kombineras fritt med övriga 32 libs i `ridgun-libs`:\n\n```ridgun\nimport log\n\nfn :: emitir si procede (umbral : String) (nivel : String) (msg : String) => String\n      emitir si procede umbral nivel msg =\n        | log should emit umbral nivel = log format text nivel msg [(\"service\", \"solstice\")]\n        | otherwise                    = \"\"\n```\n\n---\n\n## 5. Under huven: prestanda, RMM-minne och garantier\n\n- **Algoritmisk garanti och säkerhet**: Både `log format text` och `log format json` kör alltid fälten genom `log redact fields` före serialisering, vilket garanterar att inga hemligheter läcker av misstag.\n- **Deterministiskt minne (`RMM1`/`RMM2`)**: Noll skräpsamlarpauser; alla temporära strukturer frigörs deterministiskt när räckvidden lämnas.\n- **Kontinuerlig verifiering**: Statiskt kontrollerad med `stable check` och verifierad av den automatiserade testsviten `src/test/ridgun/test_log.rg`.\n"}, {"num": "21", "slug": "21-lib-test-enhets-och-funktionstester", "file": "21-lib-test-enhets-och-funktionstester.md", "title": "Kapitel 21: Lib:en `test` — Enhets- och Funktionstestprimitiver (`RG-011`)", "short_title": "Lib:en `test` — Enhets- och Funktionstestprimitiver (`RG-011`)", "markdown": "# Kapitel 21: Lib:en `test` — Enhets- och Funktionstestprimitiver (`RG-011`)\n\n## 1. Varför finns lib:en `test`?\n\nLåt oss vara ärliga: när ett testramverk kräver magiska makron, körtidsreflektion eller en tung extern testkörare slutar testskrivande att kännas omedelbart.\n\nLib:en **`test`** (`RG-011`) tillhandahåller polymorfa och typspecifika assertioner som skriver ut tydliga `[FAIL]`-diagnostiker med förväntat kontra faktiskt värde och avslutar med kod `1` vid fel.\n\n---\n\n## 2. Paket, import och arkitektur helt utan `libc`\n\nI `ridgun-libs` är **`test`** en förstklassig **lib** placerad i `src/main/ridgun/lib/test.rg` (domän `TST`). När du bygger med `stable bundle` paketeras den i tre inbyggda format:\n\n| Artefakt | Sökväg | Syfte |\n|---|---|---|\n| **Ridgun-bundle** | `target/bundles/test.rglib` | Portabel distribution och direkt import med `import test` |\n| **Kompilerat arkiv** | `target/test.rgc` | Typkontrollerad mellanartefakt verifierad av `ridgunc` |\n| **Delat ELF64-objekt** | `target/libtest.so` | Inbyggt dynamiskt bibliotek helt utan C- eller `libc`-beroenden |\n\n> För att använda denna lib i valfri `.rg`-fil deklarerar du bara `import test` överst och anropar funktionerna med mellanslag eller understreck.\n\n---\n\n## 3. Snabbreferens för `test`-API:et\n\n| Signatur / Funktion / Typ | Vad den gör och när den används |\n|---|---|\n| `assert equals / assert eq : A -> A -> String -> ()` | Polymorf likhetsassertion med beskrivande testetikett |\n| `assert int equals / assert str eq` | Specialiserade likhetsassertioner för `Int` och `String` |\n| `assert true / assert false / assert not` | Booleska invariantassertioner (`True` / `False`) |\n| `assert ok : Int -> String -> ()` | Verifierar att en OS-/socket-statuskod är `0` (`OK`) |\n\n---\n\n## 4. Praktiska recept i tabellform\n\n### Recept 1: Huvudflöde med `test`\n\nLägg märke till hur `=`-tecknen och transformationsstegen linjeras som en ren tabell:\n\n```ridgun\nimport test\nimport math\n\nfn :: suite matematicas () => ()\n      suite matematicas =\n        _ = assert int equals 12 (math gcd 36 60) \"MCD de 36 y 60\"\n        _ = assert true (math is prime 97) \"97 es primo\"\n        echo \"[PASS] suite matematicas\"\n```\n\n### Recept 2: Säker komposition utan sidoeffekter\n\nVarje funktion i lib:en `test` kan kombineras fritt med övriga 32 libs i `ridgun-libs`:\n\n```ridgun\nimport test\n\nfn :: verificar codigo sistema (rc : Int) => ()\n      verificar codigo sistema rc =\n        assert ok rc \"operacion de descriptor exitosa\"\n```\n\n---\n\n## 5. Under huven: prestanda, RMM-minne och garantier\n\n- **Algoritmisk garanti och säkerhet**: Alla 30 automatiserade testsviter i `ridgun-libs` (`src/test/ridgun/test_*.rg`, över 4 000 rader tester) körs med exakt denna lib via `stable test`.\n- **Deterministiskt minne (`RMM1`/`RMM2`)**: Noll skräpsamlarpauser; alla temporära strukturer frigörs deterministiskt när räckvidden lämnas.\n- **Kontinuerlig verifiering**: Statiskt kontrollerad med `stable check` och verifierad av den automatiserade testsviten `src/test/ridgun/test_test.rg`.\n"}, {"num": "22", "slug": "22-lib-posix-pal-klockor-och-signaler", "file": "22-lib-posix-pal-klockor-och-signaler.md", "title": "Kapitel 22: Lib:en `posix` — Plattformslager (PAL), Klockor, Signaler och CSPRNG", "short_title": "Lib:en `posix` — Plattformslager (PAL), Klockor, Signaler och CSPRNG", "markdown": "# Kapitel 22: Lib:en `posix` — Plattformslager (PAL), Klockor, Signaler och CSPRNG\n\n## 1. Varför finns lib:en `posix`?\n\nLåt oss vara ärliga: flaggor som `O_CREAT` och `O_NONBLOCK` eller syscall-nummer skiljer sig mellan Linux, macOS och arkitekturer (`X86_64` mot `Arm64`), och i C löser man det med en oläslig `#ifdef`-djungel.\n\nLib:en **`posix`** implementerar Ridguns tvåskikts **Platform Abstraction Layer (PAL)** med tabulära vakter över `sys os` (`Linux | MacOS | Windows`) och `sys arch` (`X86_64 | Arm64 | RiscV64`), samt deskriptor-polling (`wait fd`), monotona klockor (`RGF-017`), signaler (`RGF-018`) och CSPRNG (`sys random bytes`).\n\n---\n\n## 2. Paket, import och arkitektur helt utan `libc`\n\nI `ridgun-libs` är **`posix`** en förstklassig **lib** placerad i `src/main/ridgun/lib/posix.rg` (domän `POSIX`). När du bygger med `stable bundle` paketeras den i tre inbyggda format:\n\n| Artefakt | Sökväg | Syfte |\n|---|---|---|\n| **Ridgun-bundle** | `target/bundles/posix.rglib` | Portabel distribution och direkt import med `import posix` |\n| **Kompilerat arkiv** | `target/posix.rgc` | Typkontrollerad mellanartefakt verifierad av `ridgunc` |\n| **Delat ELF64-objekt** | `target/libposix.so` | Inbyggt dynamiskt bibliotek helt utan C- eller `libc`-beroenden |\n\n> För att använda denna lib i valfri `.rg`-fil deklarerar du bara `import posix` överst och anropar funktionerna med mellanslag eller understreck.\n\n---\n\n## 3. Snabbreferens för `posix`-API:et\n\n| Signatur / Funktion / Typ | Vad den gör och när den används |\n|---|---|\n| `pal open create trunc wr / pal o nonblock` | Målmedveten OS-flaggöversättning via `sys os` (`Linux | MacOS | Windows`) |\n| `wait fd : Int -> Int -> Int -> PollStatus` | Pollar en deskriptor och returnerar `PollReady`, `PollTimeout` eller `PollError errno` |\n| `clock monotonic ms / clock monotonic ns / clock wall ms` | Monotona klockor och UTC-väggklocka i millisekunder (`RGF-017`) |\n| `signal watch / signal poll / sys random bytes` | Icke-blockerande signal-polling (`SIGINT`, `SIGTERM`) och CSPRNG-bytes från kärnan |\n| `read text / write text / file exists / run cmd` | Högnivå-fil-I/O, katalogoperationer och barnprocess-wrappers |\n\n---\n\n## 4. Praktiska recept i tabellform\n\n### Recept 1: Huvudflöde med `posix`\n\nLägg märke till hur `=`-tecknen och transformationsstegen linjeras som en ren tabell:\n\n```ridgun\nimport posix\n\nfn :: medir operacion () => (Int, Int)\n      medir operacion =\n        t0  = clock monotonic ms\n        rnd = len (sys random bytes 32)\n        t1  = clock monotonic ms\n        (rnd, t1 - t0)\n```\n\n### Recept 2: Säker komposition utan sidoeffekter\n\nVarje funktion i lib:en `posix` kan kombineras fritt med övriga 32 libs i `ridgun-libs`:\n\n```ridgun\nimport posix\n\nfn :: esperar lectura (fd : Int) => Bool\n      esperar lectura fd =\n        est = wait fd fd poll_in 100\n        est == PollReady\n```\n\n---\n\n## 5. Under huven: prestanda, RMM-minne och garantier\n\n- **Algoritmisk garanti och säkerhet**: Grenar av `sys os` och `sys arch` som inte matchar målplattformen elimineras statiskt vid kompilering (Dead-Code Elimination) av `ridgunc`.\n- **Deterministiskt minne (`RMM1`/`RMM2`)**: Noll skräpsamlarpauser; alla temporära strukturer frigörs deterministiskt när räckvidden lämnas.\n- **Kontinuerlig verifiering**: Statiskt kontrollerad med `stable check` och verifierad av den automatiserade testsviten `src/test/ridgun/test_posix.rg`.\n"}, {"num": "23", "slug": "23-lib-io-tidsbegransad-io-och-processer", "file": "23-lib-io-tidsbegransad-io-och-processer.md", "title": "Kapitel 23: Lib:en `io` — Typade `IoResult`-fel, `with timeout`-I/O och Processer", "short_title": "Lib:en `io` — Typade `IoResult`-fel, `with timeout`-I/O och Processer", "markdown": "# Kapitel 23: Lib:en `io` — Typade `IoResult`-fel, `with timeout`-I/O och Processer\n\n## 1. Varför finns lib:en `io`?\n\nLåt oss vara ärliga: ett `read()`-anrop eller en barnprocess utan tidsgräns (`timeout`) är en öppen inbjudan för en enda hängande resurs att tömma alla arbetare i din server.\n\nLib:en **`io`** modellerar varje systemoperation med explicita ADT:er (`IoError`, `IoResult[A]`), kombinerar icke-blockerande `ppoll` med Ridguns lexikala `with timeout wait_ms do`-kvoter och erbjuder mixfix-operatorerna `read fd ... timeout` och `write fd ... timeout`.\n\n---\n\n## 2. Paket, import och arkitektur helt utan `libc`\n\nI `ridgun-libs` är **`io`** en förstklassig **lib** placerad i `src/main/ridgun/lib/io.rg` (domän `IO`). När du bygger med `stable bundle` paketeras den i tre inbyggda format:\n\n| Artefakt | Sökväg | Syfte |\n|---|---|---|\n| **Ridgun-bundle** | `target/bundles/io.rglib` | Portabel distribution och direkt import med `import io` |\n| **Kompilerat arkiv** | `target/io.rgc` | Typkontrollerad mellanartefakt verifierad av `ridgunc` |\n| **Delat ELF64-objekt** | `target/libio.so` | Inbyggt dynamiskt bibliotek helt utan C- eller `libc`-beroenden |\n\n> För att använda denna lib i valfri `.rg`-fil deklarerar du bara `import io` överst och anropar funktionerna med mellanslag eller understreck.\n\n---\n\n## 3. Snabbreferens för `io`-API:et\n\n| Signatur / Funktion / Typ | Vad den gör och när den används |\n|---|---|\n| `type IoError / type IoResult[A]` | `IoNotFound | IoPermission | IoTimeout | IoRefused | IoReset | IoEOF | IoInvalid | IoSysError` |\n| `io read with timeout / io write with timeout` | Icke-blockerande läsning/skrivning på deskriptor begränsad av `wait_ms` |\n| `read fd N max M timeout T / write fd N data S timeout T` | Ergonomiska mixfix-operatorer (`op ::`) för tidsbegränsad deskriptor-I/O |\n| `io read file / io write file / io read lines` | Säkra fil- och radströmsfunktioner som returnerar `IoResult` |\n| `exec with timeout : String -> Int -> IoResult[ProcStatus]` | Kör ett externt kommando begränsat av en lexikal `with timeout`-kvot |\n\n---\n\n## 4. Praktiska recept i tabellform\n\n### Recept 1: Huvudflöde med `io`\n\nLägg märke till hur `=`-tecknen och transformationsstegen linjeras som en ren tabell:\n\n```ridgun\nimport io\n\nfn :: leer peticion segura (fd : Int) => String\n      leer peticion segura fd =\n        res = read fd fd max 4096 timeout 250\n        io unwrap or res \"\"\n```\n\n### Recept 2: Säker komposition utan sidoeffekter\n\nVarje funktion i lib:en `io` kan kombineras fritt med övriga 32 libs i `ridgun-libs`:\n\n```ridgun\nimport io\n\nfn :: describir fallo () => String\n      describir fallo =\n        format io error (IoTimeout \"read\" 250)\n```\n\n---\n\n## 5. Under huven: prestanda, RMM-minne och garantier\n\n- **Algoritmisk garanti och säkerhet**: Ingen läsning, skrivning eller barnprocess som körs via `io` med en `wait_ms`-kvot kan någonsin blockera den anropande tråden eller aktören på obestämd tid.\n- **Deterministiskt minne (`RMM1`/`RMM2`)**: Noll skräpsamlarpauser; alla temporära strukturer frigörs deterministiskt när räckvidden lämnas.\n- **Kontinuerlig verifiering**: Statiskt kontrollerad med `stable check` och verifierad av den automatiserade testsviten `src/test/ridgun/test_io.rg`.\n"}, {"num": "24", "slug": "24-lib-crypto-sha256-hmac-pbkdf2-och-aead", "file": "24-lib-crypto-sha256-hmac-pbkdf2-och-aead.md", "title": "Kapitel 24: Lib:en `crypto` — SHA-256, HMAC, PBKDF2, Argon2id och ChaCha20-Poly1305 AEAD", "short_title": "Lib:en `crypto` — SHA-256, HMAC, PBKDF2, Argon2id och ChaCha20-Poly1305 AEAD", "markdown": "# Kapitel 24: Lib:en `crypto` — SHA-256, HMAC, PBKDF2, Argon2id och ChaCha20-Poly1305 AEAD\n\n## 1. Varför finns lib:en `crypto`?\n\nLåt oss vara ärliga: att jämföra en HMAC med `==` öppnar dörren för sidokanalsattacker (*timing attacks*), och att länka in `libssl.so` för att beräkna `SHA-256` eller kryptera med `ChaCha20-Poly1305` förstör binärens portabilitet.\n\nLib:en **`crypto`** implementerar i 100 % ren Ridgun över förallokerade `Tensor[Int]`: byte-/bitprimitiver (`RGF-019`), **FIPS 180-4 SHA-256**, **RFC 2104 HMAC-SHA-256**, konstanttidslikhet (`ct equal`), **RFC 8018 PBKDF2-HMAC-SHA-256**, 5-arguments **Argon2id** samt autentiserad kryptering med **RFC 8439 ChaCha20-Poly1305 AEAD** (`aead seal` / `aead open`).\n\n---\n\n## 2. Paket, import och arkitektur helt utan `libc`\n\nI `ridgun-libs` är **`crypto`** en förstklassig **lib** placerad i `src/main/ridgun/lib/crypto.rg` (domän `CRYPTO`). När du bygger med `stable bundle` paketeras den i tre inbyggda format:\n\n| Artefakt | Sökväg | Syfte |\n|---|---|---|\n| **Ridgun-bundle** | `target/bundles/crypto.rglib` | Portabel distribution och direkt import med `import crypto` |\n| **Kompilerat arkiv** | `target/crypto.rgc` | Typkontrollerad mellanartefakt verifierad av `ridgunc` |\n| **Delat ELF64-objekt** | `target/libcrypto.so` | Inbyggt dynamiskt bibliotek helt utan C- eller `libc`-beroenden |\n\n> För att använda denna lib i valfri `.rg`-fil deklarerar du bara `import crypto` överst och anropar funktionerna med mellanslag eller understreck.\n\n---\n\n## 3. Snabbreferens för `crypto`-API:et\n\n| Signatur / Funktion / Typ | Vad den gör och när den används |\n|---|---|\n| `sha256 bytes / sha256 hex` | FIPS 180-4 SHA-256 som 32-bytes binär digest eller 64-teckens hex-sträng |\n| `hmac sha256 / hmac sha256 hex / ct equal` | RFC 2104-nycklad MAC och ackumulatorjämförelse i konstant tid |\n| `pbkdf2 hmac sha256 : String -> String -> Int -> Int -> String` | RFC 8018-nyckelhärledning med förberäknade inre/yttre SHA-256-mellantillstånd |\n| `argon2id hash / argon2id verify` | 5-arguments RFC 9106 PHC-lösenordshashning och konstanttidsverifiering |\n| `aead seal / aead open` | RFC 8439 ChaCha20-Poly1305 autentiserad kryptering och taggverifierad dekryptering |\n\n---\n\n## 4. Praktiska recept i tabellform\n\n### Recept 1: Huvudflöde med `crypto`\n\nLägg märke till hur `=`-tecknen och transformationsstegen linjeras som en ren tabell:\n\n```ridgun\nimport crypto\n\nfn :: cifrar mensaje sesion (secreto : String) (texto : String) => (Int, String)\n      cifrar mensaje sesion secreto texto =\n        key32   = sha256 bytes secreto\n        nonce12 = \"0123456789ab\"\n        aad     = \"canal-autenticado\"\n        sellado = aead seal key32 nonce12 aad texto\n        aead open key32 nonce12 aad sellado\n```\n\n### Recept 2: Säker komposition utan sidoeffekter\n\nVarje funktion i lib:en `crypto` kan kombineras fritt med övriga 32 libs i `ridgun-libs`:\n\n```ridgun\nimport crypto\n\nfn :: verificar firma webhook (clave : String) (cuerpo : String) (firma_hex : String) => Bool\n      verificar firma webhook clave cuerpo firma_hex =\n        esperada = hmac sha256 hex clave cuerpo\n        ct equal esperada firma_hex\n```\n\n---\n\n## 5. Under huven: prestanda, RMM-minne och garantier\n\n- **Algoritmisk garanti och säkerhet**: `aead open` verifierar Poly1305-autentiseringstaggen på 16 byte i konstant tid innan en enda byte klartext lämnas ut (returnerar `(-1, \"\")` vid manipulering).\n- **Deterministiskt minne (`RMM1`/`RMM2`)**: Noll skräpsamlarpauser; alla temporära strukturer frigörs deterministiskt när räckvidden lämnas.\n- **Kontinuerlig verifiering**: Statiskt kontrollerad med `stable check` och verifierad av den automatiserade testsviten `src/test/ridgun/test_crypto.rg`.\n"}, {"num": "25", "slug": "25-lib-argon2id-rfc9106-losenordshashning", "file": "25-lib-argon2id-rfc9106-losenordshashning.md", "title": "Kapitel 25: Lib:en `argon2id` — RFC 9106 Argon2id över `Tensor[U64 * 8 * 16]`, Blake2b och OWASP-profiler", "short_title": "Lib:en `argon2id` — RFC 9106 Argon2id över `Tensor[U64 * 8 * 16]`, Blake2b och OWASP-profiler", "markdown": "# Kapitel 25: Lib:en `argon2id` — RFC 9106 Argon2id över `Tensor[U64 * 8 * 16]`, Blake2b och OWASP-profiler\n\n## 1. Varför finns lib:en `argon2id`?\n\nLåt oss vara ärliga: att hasha lösenord med enkel SHA-256 låter en modern GPU prova miljarder gissningar per sekund, men att länka in externa C-bibliotek för Argon2id leder ofta till kompileringsproblem.\n\nLib:en **`argon2id`** implementerar **RFC 9106 Argon2id** och **RFC 7693 Blake2b-512** i 100 % ren Ridgun direkt över inbyggda `Tensor[U64 * 8 * 16]`-block (1 024 byte per block i sammanhängande RMM2-minne), med **PHC**-stränggenerering (`$argon2id$v=19$m=...,t=...,p=...$`), **OWASP**-profiler (`owaspfirst`, `owaspsecond`), *pepper*-stöd (`argon2id hash ctx`), nyckelhärledning (`argon2id derive key`) och detektering av parameteruppgradering (`argon2id needs rehash`).\n\n---\n\n## 2. Paket, import och arkitektur helt utan `libc`\n\nI `ridgun-libs` är **`argon2id`** en förstklassig **lib** placerad i `src/main/ridgun/lib/argon2id.rg` (domän `CRYPTO`). När du bygger med `stable bundle` paketeras den i tre inbyggda format:\n\n| Artefakt | Sökväg | Syfte |\n|---|---|---|\n| **Ridgun-bundle** | `target/bundles/argon2id.rglib` | Portabel distribution och direkt import med `import argon2id` |\n| **Kompilerat arkiv** | `target/argon2id.rgc` | Typkontrollerad mellanartefakt verifierad av `ridgunc` |\n| **Delat ELF64-objekt** | `target/libargon2id.so` | Inbyggt dynamiskt bibliotek helt utan C- eller `libc`-beroenden |\n\n> För att använda denna lib i valfri `.rg`-fil deklarerar du bara `import argon2id` överst och anropar funktionerna med mellanslag eller understreck.\n\n---\n\n## 3. Snabbreferens för `argon2id`-API:et\n\n| Signatur / Funktion / Typ | Vad den gör och när den används |\n|---|---|\n| `argon2id hash / argon2id verify` | 6-arguments RFC 9106 PHC-hashning (`pwd, salt, m_kib, t, p, tag_len`) och konstanttidsverifiering |\n| `argon2id hash with preset / argon2id params preset` | Namngivna profiler: `\"interactive\"`, `\"owaspfirst\"` (`19456 KiB, t=2`), `\"owaspsecond\"` (`47104 KiB, t=1`), `\"moderate\"`, `\"sensitive\"` |\n| `argon2id hash ctx / argon2id verify ctx` | RFC 9106-hashning med hemlig `pepper` ($K$) och associerad data ($X$) |\n| `argon2id derive key / argon2id needs rehash` | Rå binär nyckelhärledning och detektering av rehash-behov för lagrade PHC-strängar |\n| `blake2b / blake2b hex` | Allmän kryptografisk RFC 7693 Blake2b-digest (`1..64` byte) |\n\n---\n\n## 4. Praktiska recept i tabellform\n\n### Recept 1: Huvudflöde med `argon2id`\n\nLägg märke till hur `=`-tecknen och transformationsstegen linjeras som en ren tabell:\n\n```ridgun\nimport argon2id\n\nfn :: proteger clave usuario (clave : String) => (String, Bool, Bool)\n      proteger clave usuario clave =\n        phc    = argon2id hash clave \"sal-unica-16byte\" 32 2 1 32\n        valido = argon2id verify clave phc\n        rehash = argon2id needs rehash phc 19456 2 1 32\n        (phc, valido, rehash)\n```\n\n### Recept 2: Säker komposition utan sidoeffekter\n\nVarje funktion i lib:en `argon2id` kan kombineras fritt med övriga 32 libs i `ridgun-libs`:\n\n```ridgun\nimport argon2id\n\nfn :: derivar clave maestra (frase : String) (sal : String) => String\n      derivar clave maestra frase sal =\n        -- Deriva 32 bytes crudos listos para ChaCha20-Poly1305 AEAD\n        argon2id derive key frase sal 64 2 1 32\n```\n\n---\n\n## 5. Under huven: prestanda, RMM-minne och garantier\n\n- **Algoritmisk garanti och säkerhet**: Byte-för-byte-överensstämmelse med de officiella testvektorerna i RFC 9106 §5.3 och OpenSSL 3.5, direkt över `Tensor[U64 * 8 * 16]` utan en enda rad C.\n- **Deterministiskt minne (`RMM1`/`RMM2`)**: Noll skräpsamlarpauser; alla temporära strukturer frigörs deterministiskt när räckvidden lämnas.\n- **Kontinuerlig verifiering**: Statiskt kontrollerad med `stable check` och verifierad av den automatiserade testsviten `src/test/ridgun/test_argon2id.rg`.\n"}, {"num": "26", "slug": "26-lib-jwt-rfc7519-och-krypterade-tokens", "file": "26-lib-jwt-rfc7519-och-krypterade-tokens.md", "title": "Kapitel 26: Lib:en `jwt` — RFC 7519 `HS256` JSON Web Tokens och ChaCha20-Poly1305-krypterade Tokens", "short_title": "Lib:en `jwt` — RFC 7519 `HS256` JSON Web Tokens och ChaCha20-Poly1305-krypterade Tokens", "markdown": "# Kapitel 26: Lib:en `jwt` — RFC 7519 `HS256` JSON Web Tokens och ChaCha20-Poly1305-krypterade Tokens\n\n## 1. Varför finns lib:en `jwt`?\n\nLåt oss vara ärliga: JWT-ekosystemet är ökänt för sårbarheter där en angripare ändrar headern till `\"alg\":\"none\"` och servern godkänner token utan signatur, eller där känslig data lagras i en vanlig JWT vars payload bara är Base64url-kodad, inte krypterad.\n\nLib:en **`jwt`** löser båda behoven: den signerar och verifierar **RFC 7519 (`HS256`) JWT:er** med strikt krav på `alg == \"HS256\"`, konstanttidsjämförelse av MAC och kontroll av `exp`/`nbf`, samt erbjuder **`token seal` / `token open`** för opaka tokens krypterade med **ChaCha20-Poly1305 AEAD**.\n\n---\n\n## 2. Paket, import och arkitektur helt utan `libc`\n\nI `ridgun-libs` är **`jwt`** en förstklassig **lib** placerad i `src/main/ridgun/lib/jwt.rg` (domän `JWT`). När du bygger med `stable bundle` paketeras den i tre inbyggda format:\n\n| Artefakt | Sökväg | Syfte |\n|---|---|---|\n| **Ridgun-bundle** | `target/bundles/jwt.rglib` | Portabel distribution och direkt import med `import jwt` |\n| **Kompilerat arkiv** | `target/jwt.rgc` | Typkontrollerad mellanartefakt verifierad av `ridgunc` |\n| **Delat ELF64-objekt** | `target/libjwt.so` | Inbyggt dynamiskt bibliotek helt utan C- eller `libc`-beroenden |\n\n> För att använda denna lib i valfri `.rg`-fil deklarerar du bara `import jwt` överst och anropar funktionerna med mellanslag eller understreck.\n\n---\n\n## 3. Snabbreferens för `jwt`-API:et\n\n| Signatur / Funktion / Typ | Vad den gör och när den används |\n|---|---|\n| `type JwtResult` | `JwtOk JsonVal | JwtExpired | JwtNotYetValid | JwtBadSignature | JwtMalformed` |\n| `jwt sign hs256 / jwt verify hs256` | Signerar `JsonVal`-claims och verifierar signatur + `alg == \"HS256\"` + `exp`/`nbf` |\n| `jwt claims / jwt get str / jwt get int` | Bygger standard-claims `(sub, iss, iat, exp)` och frågar verifierade payloads |\n| `token seal / token open` | Krypterar och autentiserar opaka JSON-tokens via ChaCha20-Poly1305 AEAD |\n\n---\n\n## 4. Praktiska recept i tabellform\n\n### Recept 1: Huvudflöde med `jwt`\n\nLägg märke till hur `=`-tecknen och transformationsstegen linjeras som en ren tabell:\n\n```ridgun\nimport jwt\nimport json\n\nfn :: emitir y verificar sesion (secreto : String) => (String, String)\n      emitir y verificar sesion secreto =\n        claims = jwt claims \"user-42\" \"solstice\" 1700000000 1700003600\n        tok    = jwt sign hs256 secreto claims\n        res    = jwt verify hs256 secreto tok 1700001000\n        sub    = jwt get str res \"sub\" \"anonimo\"\n        (tok, sub)\n```\n\n### Recept 2: Säker komposition utan sidoeffekter\n\nVarje funktion i lib:en `jwt` kan kombineras fritt med övriga 32 libs i `ridgun-libs`:\n\n```ridgun\nimport jwt\nimport json\n\nfn :: sellar token confidencial (clave : String) => JwtResult\n      sellar token confidencial clave =\n        datos = JnObj [(\"rol\", JnStr \"root\"), (\"pin\", JnInt 9988)]\n        sobre = token seal clave \"nonce-12byte\" datos\n        token open clave sobre\n```\n\n---\n\n## 5. Under huven: prestanda, RMM-minne och garantier\n\n- **Algoritmisk garanti och säkerhet**: Fullständig immunitet mot `\"alg\":\"none\"`-attacker (alla headers där `alg != \"HS256\"` returnerar `JwtBadSignature`) och konstanttidsverifiering av signaturer.\n- **Deterministiskt minne (`RMM1`/`RMM2`)**: Noll skräpsamlarpauser; alla temporära strukturer frigörs deterministiskt när räckvidden lämnas.\n- **Kontinuerlig verifiering**: Statiskt kontrollerad med `stable check` och verifierad av den automatiserade testsviten `src/test/ridgun/test_jwt.rg`.\n"}, {"num": "27", "slug": "27-lib-socket-natverk-dns-och-karn-sockets", "file": "27-lib-socket-natverk-dns-och-karn-sockets.md", "title": "Kapitel 27: Lib:en `socket` — TCP, UDP, AF_UNIX, Framing, DNS och `RGF-001` Kärn-sockets", "short_title": "Lib:en `socket` — TCP, UDP, AF_UNIX, Framing, DNS och `RGF-001` Kärn-sockets", "markdown": "# Kapitel 27: Lib:en `socket` — TCP, UDP, AF_UNIX, Framing, DNS och `RGF-001` Kärn-sockets\n\n## 1. Varför finns lib:en `socket`?\n\nLåt oss vara ärliga: att programmera BSD-sockets i C med `struct sockaddr_in`, `htons`, `inet_pton` och `getaddrinfo` (som dessutom drar in `libnss` från `glibc`) är en otymplig 80-talsritual.\n\nLib:en **`socket`** erbjuder två kompletterande lager helt utan C: (1) kärndeskriptor-API:et **`RGF-001`** för produktionsservrar som **Solstice** (`sys tcp listen`, `sys tcp listen reuseport`, `sys accept`, `sys tcp connect`, `sys send`, `sys recv`, `sys resolve ipv4` via `/etc/hosts` + RFC 1035 UDP-DNS-paket på port 53) och (2) den oföränderliga funktionella tillståndsmaskinen `Socket` med längdprefixad framing, CRLF-rader och CIDR-subnät.\n\n---\n\n## 2. Paket, import och arkitektur helt utan `libc`\n\nI `ridgun-libs` är **`socket`** en förstklassig **lib** placerad i `src/main/ridgun/lib/socket.rg` (domän `SOCK`). När du bygger med `stable bundle` paketeras den i tre inbyggda format:\n\n| Artefakt | Sökväg | Syfte |\n|---|---|---|\n| **Ridgun-bundle** | `target/bundles/socket.rglib` | Portabel distribution och direkt import med `import socket` |\n| **Kompilerat arkiv** | `target/socket.rgc` | Typkontrollerad mellanartefakt verifierad av `ridgunc` |\n| **Delat ELF64-objekt** | `target/libsocket.so` | Inbyggt dynamiskt bibliotek helt utan C- eller `libc`-beroenden |\n\n> För att använda denna lib i valfri `.rg`-fil deklarerar du bara `import socket` överst och anropar funktionerna med mellanslag eller understreck.\n\n---\n\n## 3. Snabbreferens för `socket`-API:et\n\n| Signatur / Funktion / Typ | Vad den gör och när den används |\n|---|---|\n| `sys tcp listen / sys tcp listen reuseport / sys unix listen` | Binder och lyssnar på IPv4 TCP (`SO_REUSEADDR` / `SO_REUSEPORT`) eller `AF_UNIX` |\n| `sys accept / sys tcp connect / sys unix connect` | Tidsbegränsad `accept` och `connect` som returnerar `SockFdResult` / `SockAcceptResult` |\n| `sys send / sys recv / sys shutdown write` | Tidsbegränsad sändning, mottagning och skrivstängning (`SHUT_WR`) på kärn-socket |\n| `sys resolve ipv4 / dns resolve a` | Ren Ridgun IPv4-uppslagning via `/etc/hosts` och RFC 1035 UDP DNS-frågor |\n| `sock send frame / sock recv frame / ipv4 in cidr` | Längdprefixad (`N:payload`) framing och IPv4 CIDR-subnätsmatchning |\n\n---\n\n## 4. Praktiska recept i tabellform\n\n### Recept 1: Huvudflöde med `socket`\n\nLägg märke till hur `=`-tecknen och transformationsstegen linjeras som en ren tabell:\n\n```ridgun\nimport socket\n\nfn :: eco tcp local () => String\n      eco tcp local =\n        l_res = sys tcp listen \"127.0.0.1\" 0 16\n        lfd   = sock fd l_res\n        port  = sys local port lfd\n        c_res = sys tcp connect \"127.0.0.1\" port 1000\n        cfd   = sock fd c_res\n        a_res = sys accept lfd 1000\n        sfd   = sock accept fd a_res\n        _     = sys send cfd \"hola-solstice\" 1000\n        r_res = sys recv sfd 64 1000\n        datos = sock recv data r_res\n        _     = sys_close cfd\n        _     = sys_close sfd\n        _     = sys_close lfd\n        datos\n```\n\n### Recept 2: Säker komposition utan sidoeffekter\n\nVarje funktion i lib:en `socket` kan kombineras fritt med övriga 32 libs i `ridgun-libs`:\n\n```ridgun\nimport socket\n\nfn :: verificar ip interna (ip : String) => Bool\n      verificar ip interna ip =\n        ipv4 in cidr ip \"10.0.0.0/8\"\n```\n\n---\n\n## 5. Under huven: prestanda, RMM-minne och garantier\n\n- **Algoritmisk garanti och säkerhet**: Postuppdatering med oföränderlig `s with field = val`-syntax, DNS-uppslagning utan `glibc`/`libnss` och deterministiska statuskoder (`0` OK, `-1` EOF, `-2` TIMEOUT, `-3` REFUSED).\n- **Deterministiskt minne (`RMM1`/`RMM2`)**: Noll skräpsamlarpauser; alla temporära strukturer frigörs deterministiskt när räckvidden lämnas.\n- **Kontinuerlig verifiering**: Statiskt kontrollerad med `stable check` och verifierad av den automatiserade testsviten `src/test/ridgun/test_socket.rg`.\n"}, {"num": "28", "slug": "28-lib-http-uri-http11-och-tcp-klient", "file": "28-lib-http-uri-http11-och-tcp-klient.md", "title": "Kapitel 28: Lib:en `http` — RFC 3986 URI, RFC 9112 HTTP/1.1-kodek och Direkt TCP-klient", "short_title": "Lib:en `http` — RFC 3986 URI, RFC 9112 HTTP/1.1-kodek och Direkt TCP-klient", "markdown": "# Kapitel 28: Lib:en `http` — RFC 3986 URI, RFC 9112 HTTP/1.1-kodek och Direkt TCP-klient\n\n## 1. Varför finns lib:en `http`?\n\nLåt oss vara ärliga: om man inte rensar bort `\\r\\n` i HTTP-headers kan en angripare injicera egna headers (*CRLF Response Splitting*), och att länka in `libcurl` bara för att göra ett `GET`- eller `POST`-anrop är överdrivet.\n\nLib:en **`http`** implementerar **RFC 3986 URI**-tolkning, **RFC 9112 HTTP/1.1**-formatering och tolkning med automatisk CRLF-sanering (`VUL-INJ-002`) och automatisk `Content-Length`, extrahering av `Bearer`-tokens samt en **direkt HTTP/1.1-klient över kärnans TCP-sockets** (`http get`, `http post`, `http request tcp`).\n\n---\n\n## 2. Paket, import och arkitektur helt utan `libc`\n\nI `ridgun-libs` är **`http`** en förstklassig **lib** placerad i `src/main/ridgun/lib/http.rg` (domän `HTTP`). När du bygger med `stable bundle` paketeras den i tre inbyggda format:\n\n| Artefakt | Sökväg | Syfte |\n|---|---|---|\n| **Ridgun-bundle** | `target/bundles/http.rglib` | Portabel distribution och direkt import med `import http` |\n| **Kompilerat arkiv** | `target/http.rgc` | Typkontrollerad mellanartefakt verifierad av `ridgunc` |\n| **Delat ELF64-objekt** | `target/libhttp.so` | Inbyggt dynamiskt bibliotek helt utan C- eller `libc`-beroenden |\n\n> För att använda denna lib i valfri `.rg`-fil deklarerar du bara `import http` överst och anropar funktionerna med mellanslag eller understreck.\n\n---\n\n## 3. Snabbreferens för `http`-API:et\n\n| Signatur / Funktion / Typ | Vad den gör och när den används |\n|---|---|\n| `uri parse / uri scheme / uri host / uri port / uri path / uri query` | Delar upp RFC 3986-URI:er med automatiska standardportar (`80` för `http`, `443` för `https`) |\n| `http build request / http parse request` | Formaterar och tolkar HTTP/1.1-anrop med CRLF-sanering av headers |\n| `http build response / http parse response` | Formaterar och tolkar HTTP/1.1-svar med standardiserade statusfraser |\n| `http header get / http bearer token` | Skiftlägesokänslig header-uppslagning och extrahering av `Authorization: Bearer <token>` |\n| `http get / http post / http request tcp` | Kör direkta HTTP/1.1-anrop över kärnans TCP-sockets med `timeout_ms` |\n\n---\n\n## 4. Praktiska recept i tabellform\n\n### Recept 1: Huvudflöde med `http`\n\nLägg märke till hur `=`-tecknen och transformationsstegen linjeras som en ren tabell:\n\n```ridgun\nimport http\n\nfn :: inspeccionar endpoint (url : String) => (String, Int, String, String)\n      inspeccionar endpoint url =\n        host = uri host url\n        port = uri port url\n        path = uri path url\n        wire = http build request \"GET\" path [(\"Host\", host)] \"\"\n        (host, port, path, wire)\n```\n\n### Recept 2: Säker komposition utan sidoeffekter\n\nVarje funktion i lib:en `http` kan kombineras fritt med övriga 32 libs i `ridgun-libs`:\n\n```ridgun\nimport http\n\nfn :: extraer credenciales (raw_req : String) => (String, String)\n      extraer credenciales raw_req =\n        (metodo, ruta, _, hdrs_raw, _) = http parse request raw_req\n        hdrs = http parse headers hdrs_raw\n        tok  = http bearer token hdrs\n        (metodo + \" \" + ruta, tok)\n```\n\n---\n\n## 5. Under huven: prestanda, RMM-minne och garantier\n\n- **Algoritmisk garanti och säkerhet**: Automatisk borttagning av `\\r` och `\\n` i alla headers (`http sanitize header`) för att förhindra HTTP response-splitting.\n- **Deterministiskt minne (`RMM1`/`RMM2`)**: Noll skräpsamlarpauser; alla temporära strukturer frigörs deterministiskt när räckvidden lämnas.\n- **Kontinuerlig verifiering**: Statiskt kontrollerad med `stable check` och verifierad av den automatiserade testsviten `src/test/ridgun/test_http.rg`.\n"}, {"num": "29", "slug": "29-lib-ws-rfc6455-websocket-protokoll", "file": "29-lib-ws-rfc6455-websocket-protokoll.md", "title": "Kapitel 29: Lib:en `ws` — RFC 6455 WebSocket-handskakning, 16/64-bitars Ramkodek och XOR-maskering", "short_title": "Lib:en `ws` — RFC 6455 WebSocket-handskakning, 16/64-bitars Ramkodek och XOR-maskering", "markdown": "# Kapitel 29: Lib:en `ws` — RFC 6455 WebSocket-handskakning, 16/64-bitars Ramkodek och XOR-maskering\n\n## 1. Varför finns lib:en `ws`?\n\nLåt oss vara ärliga: WebSocket-protokollet (RFC 6455) kombinerar en SHA-1 + Base64-handskakning med binära ramar av variabel längd (7, 16 eller 64 bitar) och obligatorisk 4-bytes XOR-maskering från klient till server.\n\nLib:en **`ws`** implementerar hela **RFC 6455** i ren Ridgun: beräkning av `Sec-WebSocket-Accept` (med inbyggd RFC 3174 SHA-1 för handskaknings-GUID), `101 Switching Protocols`-headers, kodning och avkodning av 7/16/64-bitars `WsFrame`-ramar, symmetrisk XOR-maskering samt byggare för text-, ping-, pong- och stängningsramar.\n\n---\n\n## 2. Paket, import och arkitektur helt utan `libc`\n\nI `ridgun-libs` är **`ws`** en förstklassig **lib** placerad i `src/main/ridgun/lib/ws.rg` (domän `WS`). När du bygger med `stable bundle` paketeras den i tre inbyggda format:\n\n| Artefakt | Sökväg | Syfte |\n|---|---|---|\n| **Ridgun-bundle** | `target/bundles/ws.rglib` | Portabel distribution och direkt import med `import ws` |\n| **Kompilerat arkiv** | `target/ws.rgc` | Typkontrollerad mellanartefakt verifierad av `ridgunc` |\n| **Delat ELF64-objekt** | `target/libws.so` | Inbyggt dynamiskt bibliotek helt utan C- eller `libc`-beroenden |\n\n> För att använda denna lib i valfri `.rg`-fil deklarerar du bara `import ws` överst och anropar funktionerna med mellanslag eller understreck.\n\n---\n\n## 3. Snabbreferens för `ws`-API:et\n\n| Signatur / Funktion / Typ | Vad den gör och när den används |\n|---|---|\n| `ws accept key : String -> String` | Beräknar RFC 6455 §1.3 `Sec-WebSocket-Accept` från `Sec-WebSocket-Key` |\n| `ws build upgrade request / ws build upgrade response` | Formaterar HTTP/1.1-meddelanden för WebSocket-uppgraderingshandskakning |\n| `ws encode frame / ws decode frame` | Kodar och avkodar `WsFrame`-ramar (`fin`, `opcode`, `masked`, `mask_key`, `payload`) |\n| `ws text frame / ws ping frame / ws pong frame / ws close frame` | Högnivåbyggare för ramar och extraherare för stängningskoder (`1000` normal stängning) |\n\n---\n\n## 4. Praktiska recept i tabellform\n\n### Recept 1: Huvudflöde med `ws`\n\nLägg märke till hur `=`-tecknen och transformationsstegen linjeras som en ren tabell:\n\n```ridgun\nimport ws\n\nfn :: negociar y enviar (client_key : String) => (String, String)\n      negociar y enviar client_key =\n        resp  = ws build upgrade response client_key\n        trama = ws encode frame (ws text frame \"hola-tiempo-real\" False \"\")\n        (resp, trama)\n```\n\n### Recept 2: Säker komposition utan sidoeffekter\n\nVarje funktion i lib:en `ws` kan kombineras fritt med övriga 32 libs i `ridgun-libs`:\n\n```ridgun\nimport ws\n\nfn :: decodificar trama cliente (clave4 : String) (msg : String) => String\n      decodificar trama cliente clave4 msg =\n        wire = ws encode frame (ws text frame msg True clave4)\n        res  = ws decode frame wire\n        ws frame payload res\n```\n\n---\n\n## 5. Under huven: prestanda, RMM-minne och garantier\n\n- **Algoritmisk garanti och säkerhet**: Exakt matchning med den officiella testvektorn i RFC 6455 (`\"dGhlIHNhbXBsZSBub25jZQ==\"` $\\rightarrow$ `\"s3pPLMBiTxaQ9kYGzzhZRbK+xOo=\"`) och automatisk XOR-avmaskering i `ws decode frame`.\n- **Deterministiskt minne (`RMM1`/`RMM2`)**: Noll skräpsamlarpauser; alla temporära strukturer frigörs deterministiskt när räckvidden lämnas.\n- **Kontinuerlig verifiering**: Statiskt kontrollerad med `stable check` och verifierad av den automatiserade testsviten `src/test/ridgun/test_ws.rg`.\n"}, {"num": "30", "slug": "30-lib-agent-aktorskonkurrens", "file": "30-lib-agent-aktorskonkurrens.md", "title": "Kapitel 30: Lib:en `agent` — Inbyggd Aktörskonkurrens (`agent`, `send`, `receive`), KV-lagring och Rate Limiter", "short_title": "Lib:en `agent` — Inbyggd Aktörskonkurrens (`agent`, `send`, `receive`), KV-lagring och Rate Limiter", "markdown": "# Kapitel 30: Lib:en `agent` — Inbyggd Aktörskonkurrens (`agent`, `send`, `receive`), KV-lagring och Rate Limiter\n\n## 1. Varför finns lib:en `agent`?\n\nLåt oss vara ärliga: att dela muterbart minne mellan trådar med `Mutex`, `RwLock` och villkorsvariabler är en outsinlig fabrik av *deadlocks* och kapplöpningsvillkor.\n\nLib:en **`agent`** bygger vidare på Ridguns **inbyggda aktörsmodell** (`agent`, `send ... to`, `receive from`, `try receive from`, `stop`) och erbjuder isolerade brevlådor med Copy-on-Write-meddelanden, en konkurrent nyckel-värde-lagring (`KvStore`), en *token-bucket*-begränsare (`RateBucket`) samt övervakning (`AgentHealth`).\n\n---\n\n## 2. Paket, import och arkitektur helt utan `libc`\n\nI `ridgun-libs` är **`agent`** en förstklassig **lib** placerad i `src/main/ridgun/lib/agent.rg` (domän `AGENT`). När du bygger med `stable bundle` paketeras den i tre inbyggda format:\n\n| Artefakt | Sökväg | Syfte |\n|---|---|---|\n| **Ridgun-bundle** | `target/bundles/agent.rglib` | Portabel distribution och direkt import med `import agent` |\n| **Kompilerat arkiv** | `target/agent.rgc` | Typkontrollerad mellanartefakt verifierad av `ridgunc` |\n| **Delat ELF64-objekt** | `target/libagent.so` | Inbyggt dynamiskt bibliotek helt utan C- eller `libc`-beroenden |\n\n> För att använda denna lib i valfri `.rg`-fil deklarerar du bara `import agent` överst och anropar funktionerna med mellanslag eller understreck.\n\n---\n\n## 3. Snabbreferens för `agent`-API:et\n\n| Signatur / Funktion / Typ | Vad den gör och när den används |\n|---|---|\n| `agent roundtrip / agent drain count` | Startar inbyggda aktörer (`agent`), utbyter meddelanden (`send ... to` / `receive from`) och kör `stop` |\n| `kv store new / kv store apply` | Oföränderlig nyckel-värde-lagring för aktörer (`KvPut`, `KvGet`, `KvDelete`, `KvClear`) |\n| `rate bucket new / rate bucket allow` | *Token-bucket*-begränsare som returnerar uppdaterad hink och `(allowed, remaining)` |\n| `sup mark failed / sup should restart` | Övervakningsfunktioner som spårar omstartsbudget (`max_restarts`) |\n\n---\n\n## 4. Praktiska recept i tabellform\n\n### Recept 1: Huvudflöde med `agent`\n\nLägg märke till hur `=`-tecknen och transformationsstegen linjeras som en ren tabell:\n\n```ridgun\nimport agent\n\nfn :: probar actor nativo () => (Int, Int)\n      probar actor nativo =\n        eco = agent roundtrip 42\n        vac = agent drain count [10, 20, 30]\n        (eco, vac)\n```\n\n### Recept 2: Säker komposition utan sidoeffekter\n\nVarje funktion i lib:en `agent` kan kombineras fritt med övriga 32 libs i `ridgun-libs`:\n\n```ridgun\nimport agent\n\nfn :: aplicar limite peticion () => (Bool, Int)\n      aplicar limite peticion =\n        b0         = rate bucket new 10 2 1000\n        (b1, res1) = rate bucket allow b0 1 1000\n        rateresp allowed res1, rateobs remaining res1\n```\n\n---\n\n## 5. Under huven: prestanda, RMM-minne och garantier\n\n- **Algoritmisk garanti och säkerhet**: Noll delat muterbart minne mellan aktörer: varje meddelande överförs via värde / Copy-on-Write och `stop` frigör aktörens minnesregion deterministiskt.\n- **Deterministiskt minne (`RMM1`/`RMM2`)**: Noll skräpsamlarpauser; alla temporära strukturer frigörs deterministiskt när räckvidden lämnas.\n- **Kontinuerlig verifiering**: Statiskt kontrollerad med `stable check` och verifierad av den automatiserade testsviten `src/test/ridgun/test_agent.rg`.\n"}, {"num": "31", "slug": "31-lib-pool-worker-pool-och-work-stealing", "file": "31-lib-pool-worker-pool-och-work-stealing.md", "title": "Kapitel 31: Lib:en `pool` — Begränsad Worker-pool, Round-Robin och Work-Stealing", "short_title": "Lib:en `pool` — Begränsad Worker-pool, Round-Robin och Work-Stealing", "markdown": "# Kapitel 31: Lib:en `pool` — Begränsad Worker-pool, Round-Robin och Work-Stealing\n\n## 1. Varför finns lib:en `pool`?\n\nLåt oss vara ärliga: att starta en ny tråd eller aktör för varje inkommande anrop utan övre gräns garanterar att en trafiktopp tömmer serverns minne på några sekunder.\n\nLib:en **`pool`** tillhandahåller en begränsad uppgiftsfördelare med **explicit mottryck** (`PoolAccept`, `PoolRejectFull`), balanserad uppdelning i $K$ filer (`pool partition`), ombalansering med **work-stealing** (`pool steal rebalance`) och parallell exekvering över inbyggda aktörer.\n\n---\n\n## 2. Paket, import och arkitektur helt utan `libc`\n\nI `ridgun-libs` är **`pool`** en förstklassig **lib** placerad i `src/main/ridgun/lib/pool.rg` (domän `AGENT`). När du bygger med `stable bundle` paketeras den i tre inbyggda format:\n\n| Artefakt | Sökväg | Syfte |\n|---|---|---|\n| **Ridgun-bundle** | `target/bundles/pool.rglib` | Portabel distribution och direkt import med `import pool` |\n| **Kompilerat arkiv** | `target/pool.rgc` | Typkontrollerad mellanartefakt verifierad av `ridgunc` |\n| **Delat ELF64-objekt** | `target/libpool.so` | Inbyggt dynamiskt bibliotek helt utan C- eller `libc`-beroenden |\n\n> För att använda denna lib i valfri `.rg`-fil deklarerar du bara `import pool` överst och anropar funktionerna med mellanslag eller understreck.\n\n---\n\n## 3. Snabbreferens för `pool`-API:et\n\n| Signatur / Funktion / Typ | Vad den gör och när den används |\n|---|---|\n| `pool new : Int -> Int -> PoolState` | Skapar en begränsad pool med `workers` filer och `max_queue` i kökapacitet |\n| `pool submit : PoolState -> PoolTask -> (PoolState, PoolDecision)` | Köar en uppgift med round-robin eller returnerar `PoolRejectFull` vid mättnad |\n| `pool partition / pool steal rebalance` | Delar upp batcher över $K$ arbetare och stjäl hälften av en överbelastad kö till en ledig arbetare |\n| `pool map sum / pool parallel sum2` | Fördelar arbetslaster parallellt över inbyggda `agent`-arbetare |\n\n---\n\n## 4. Praktiska recept i tabellform\n\n### Recept 1: Huvudflöde med `pool`\n\nLägg märke till hur `=`-tecknen och transformationsstegen linjeras som en ren tabell:\n\n```ridgun\nimport pool\n\nfn :: encolar con contrapresion () => (Int, Int)\n      encolar con contrapresion =\n        p0        = pool new 4 16\n        tarea     = PoolTask 1 100 \"indexar-bloque\"\n        (p1, dec) = pool submit p0 tarea\n        (pool queued p1, pool accepted p1)\n```\n\n### Recept 2: Säker komposition utan sidoeffekter\n\nVarje funktion i lib:en `pool` kan kombineras fritt med övriga 32 libs i `ridgun-libs`:\n\n```ridgun\nimport pool\n\nfn :: sumar en paralelo () => Int\n      sumar en paralelo =\n        pool parallel sum2 [10, 20, 30] [40, 50, 60]\n```\n\n---\n\n## 5. Under huven: prestanda, RMM-minne och garantier\n\n- **Algoritmisk garanti och säkerhet**: Strikt begränsad kökapacitet (`queued <= max_queue`) för att skydda minnet vid belastningstoppar samt deterministisk fördelning mellan arbetare.\n- **Deterministiskt minne (`RMM1`/`RMM2`)**: Noll skräpsamlarpauser; alla temporära strukturer frigörs deterministiskt när räckvidden lämnas.\n- **Kontinuerlig verifiering**: Statiskt kontrollerad med `stable check` och verifierad av den automatiserade testsviten `src/test/ridgun/test_pool.rg`.\n"}, {"num": "32", "slug": "32-lib-net-agent-anslutningsovervakare", "file": "32-lib-net-agent-anslutningsovervakare.md", "title": "Kapitel 32: Lib:en `net_agent` — Övervakare för Nätverksanslutningar och Icke-blockerande Händelsebrygga", "short_title": "Lib:en `net_agent` — Övervakare för Nätverksanslutningar och Icke-blockerande Händelsebrygga", "markdown": "# Kapitel 32: Lib:en `net_agent` — Övervakare för Nätverksanslutningar och Icke-blockerande Händelsebrygga\n\n## 1. Varför finns lib:en `net_agent`?\n\nLåt oss vara ärliga: i en riktig server som **Solstice** är det enkelt att acceptera TCP-anslutningar; det svåra är att begränsa max antal samtidiga klienter, rensa bort inaktiva zombie-anslutningar (*idle timeout*) och koppla ihop `ppoll`-loopen med dina aktörer utan att läcka fildeskriptorer.\n\nLib:en **`net_agent`** sluter cirkeln i `ridgun-libs` genom att förena **`posix`**, **`socket`** och **`agent`**: den hanterar övervakade anslutningstabeller (`NetSupervisor`), upprätthåller gränser för samtidiga klienter (`max_conns`), rensar inaktiva anslutningar (`net evict idle`), översätter kärndeskriptor-polling till typade aktörshändelser (`NetEvReadyRead`, `NetEvReadyWrite`, `NetEvTimeout`, `NetEvError`) och erbjuder ett komplett övervakat TCP-ekosteg (`net tcp echo step`).\n\n---\n\n## 2. Paket, import och arkitektur helt utan `libc`\n\nI `ridgun-libs` är **`net_agent`** en förstklassig **lib** placerad i `src/main/ridgun/lib/net_agent.rg` (domän `AGENT`). När du bygger med `stable bundle` paketeras den i tre inbyggda format:\n\n| Artefakt | Sökväg | Syfte |\n|---|---|---|\n| **Ridgun-bundle** | `target/bundles/net_agent.rglib` | Portabel distribution och direkt import med `import net_agent` |\n| **Kompilerat arkiv** | `target/net_agent.rgc` | Typkontrollerad mellanartefakt verifierad av `ridgunc` |\n| **Delat ELF64-objekt** | `target/libnet_agent.so` | Inbyggt dynamiskt bibliotek helt utan C- eller `libc`-beroenden |\n\n> För att använda denna lib i valfri `.rg`-fil deklarerar du bara `import net_agent` överst och anropar funktionerna med mellanslag eller understreck.\n\n---\n\n## 3. Snabbreferens för `net_agent`-API:et\n\n| Signatur / Funktion / Typ | Vad den gör och när den används |\n|---|---|\n| `net supervisor new : Int -> Int -> NetSupervisor` | Skapar en anslutningsövervakare med `max_conns` och `idle_timeout_ms` |\n| `net register conn / net record rx / net record tx / net close conn` | Registrerar accepterade sockets, spårar byte-räknare/tidsstämplar och stänger anslutningar |\n| `net evict idle : NetSupervisor -> Int -> (NetSupervisor, [Int])` | Stänger och rensar ut anslutningar som varit inaktiva längre än `idle_timeout_ms` |\n| `net poll fd : Int -> Bool -> Int -> NetEvent` | Icke-blockerande `wait fd`-brygga som ger `NetEvReadyRead`, `NetEvReadyWrite`, `NetEvTimeout` eller `NetEvError` |\n| `net tcp echo step : String -> Int -> (Int, String)` | Komplett TCP loopback-steg från ända till ända (`listen/connect/accept/supervise/echo`) |\n\n---\n\n## 4. Praktiska recept i tabellform\n\n### Recept 1: Huvudflöde med `net_agent`\n\nLägg märke till hur `=`-tecknen och transformationsstegen linjeras som en ren tabell:\n\n```ridgun\nimport net_agent\n\nfn :: supervisar clientes () => (Int, [Int])\n      supervisar clientes =\n        s0        = net supervisor new 100 5000\n        (s1, _)   = net register conn s0 10 \"10.0.0.1\" 51000 1000\n        (s2, _)   = net register conn s1 11 \"10.0.0.2\" 51001 6500\n        (s3, exp) = net evict idle s2 7000\n        (net active count s3, exp)\n```\n\n### Recept 2: Säker komposition utan sidoeffekter\n\nVarje funktion i lib:en `net_agent` kan kombineras fritt med övriga 32 libs i `ridgun-libs`:\n\n```ridgun\nimport net_agent\n\nfn :: probar puente tcp supervisado () => (Int, String)\n      probar puente tcp supervisado =\n        net tcp echo step \"ping-supervisado\" 1000\n```\n\n---\n\n## 5. Under huven: prestanda, RMM-minne och garantier\n\n- **Algoritmisk garanti och säkerhet**: Automatiskt skydd mot deskriptoruttömning (`max_conns`), deterministisk utrensning av inaktiva anslutningar och garanterad stängning av sockets i `net tcp echo step`.\n- **Deterministiskt minne (`RMM1`/`RMM2`)**: Noll skräpsamlarpauser; alla temporära strukturer frigörs deterministiskt när räckvidden lämnas.\n- **Kontinuerlig verifiering**: Statiskt kontrollerad med `stable check` och verifierad av den automatiserade testsviten `src/test/ridgun/test_net_agent.rg`.\n"}];
    const UI_STRINGS = {"copy_label": "Kopiera", "copied_label": "Kopierad!", "prev_label": "&larr; Föregående kapitel", "next_label": "Nästa kapitel &rarr;", "search_hits_label": "Resultat för", "search_empty_label": "Inga träffar hittades för"};
    let currentIdx = 0;

    function escapeHtml(s) {
      return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function highlightRidgun(code) {
      return code.split("\n").map(line => {
        const comIdx = (() => {
          let inD = false, inS = false;
          for (let i = 0; i < line.length - 1; i++) {
            if (line[i] === "\\") { i++; continue; }
            if (line[i] === '"' && !inS) inD = !inD;
            else if (line[i] === "'" && !inD) inS = !inS;
            else if (!inD && !inS && line[i] === "-" && line[i+1] === "-") return i;
          }
          return -1;
        })();
        const codePart = comIdx >= 0 ? line.slice(0, comIdx) : line;
        const comPart = comIdx >= 0 ? line.slice(comIdx) : "";
        let html = escapeHtml(codePart);
        html = html.replace(/("([^"\\]|\\.)*"|'[^']*')/g, '<span class="rg-str">$1</span>');
        html = html.replace(/\b(fn|op|type|import|mut|otherwise|with|region|timeout|do|global|context|shared|atomic|hardware|echo|and|or|xor|not|agent|send|to|receive|from|try|stop)\b/g, '<span class="rg-kw">$1</span>');
        html = html.replace(/\b(Int|Real|String|Char|Bool|U64|Tensor|Option|Result|Some|None|Ok|Err|OutOfMemory|Timeout|True|False)\b/g, '<span class="rg-ty">$1</span>');
        html = html.replace(/(::|=&gt;|-&gt;|&lt;-|\|\|\.|\|\||\|\.)/g, '<span class="rg-op">$1</span>');
        html = html.replace(/\b(0x[0-9a-fA-F_]+|[0-9][0-9_]*(_KB|_MB|_GB)?(\.[0-9]+)?)\b/g, '<span class="rg-num">$1</span>');
        if (comPart) {
          html += '<span class="rg-com">' + escapeHtml(comPart) + '</span>';
        }
        return html;
      }).join("\n");
    }

    function formatInline(text) {
      let out = escapeHtml(text);
      out = out.replace(/`([^`]+)`/g, "<code>$1</code>");
      out = out.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      out = out.replace(/\*([^*]+)\*/g, "<em>$1</em>");
      out = out.replace(/\$O\(([^)]+)\)\$/g, "<code>O($1)</code>");
      out = out.replace(/\$\\rightarrow\$/g, "&rarr;");
      return out;
    }

    function renderMarkdown(md) {
      const lines = md.split("\n");
      let html = "";
      let i = 0;
      while (i < lines.length) {
        const line = lines[i];
        if (line.startsWith("```")) {
          const lang = line.slice(3).trim() || "ridgun";
          i++;
          const buf = [];
          while (i < lines.length && !lines[i].startsWith("```")) {
            buf.push(lines[i]);
            i++;
          }
          i++;
          const rawCode = buf.join("\n");
          const bodyHtml = (lang === "ridgun" || lang === "") ? highlightRidgun(rawCode) : escapeHtml(rawCode);
          html += `<div class="code-wrapper"><div class="code-header"><span>${escapeHtml(lang)}</span><button class="copy-btn" onclick="copyCode(this)">${escapeHtml(UI_STRINGS.copy_label)}</button></div><pre data-raw="${ encodeURIComponent(rawCode) }"><code>${bodyHtml}</code></pre></div>`;
          continue;
        }
        if (/^---+$/.test(line.trim())) {
          html += "<hr />";
          i++;
          continue;
        }
        if (line.startsWith("# ")) {
          html += `<h1>${formatInline(line.slice(2).trim())}</h1>`;
          i++;
          continue;
        }
        if (line.startsWith("## ")) {
          html += `<h2>${formatInline(line.slice(3).trim())}</h2>`;
          i++;
          continue;
        }
        if (line.startsWith("### ")) {
          html += `<h3>${formatInline(line.slice(4).trim())}</h3>`;
          i++;
          continue;
        }
        if (line.trim().startsWith("|") && i + 1 < lines.length && /^\|[\s:-]+\|/.test(lines[i+1].trim())) {
          const headers = line.trim().slice(1, -1).split("|").map(c => formatInline(c.trim()));
          i += 2;
          const rows = [];
          while (i < lines.length && lines[i].trim().startsWith("|")) {
            rows.push(lines[i].trim().slice(1, -1).split("|").map(c => formatInline(c.trim())));
            i++;
          }
          html += '<div class="table-wrap"><table><thead><tr>' + headers.map(h => `<th>${h}</th>`).join("") + '</tr></thead><tbody>' +
                  rows.map(r => '<tr>' + r.map(c => `<td>${c}</td>`).join("") + '</tr>').join("") + '</tbody></table></div>';
          continue;
        }
        if (line.startsWith(">")) {
          const qLines = [];
          while (i < lines.length && lines[i].startsWith(">")) {
            qLines.push(lines[i].replace(/^>\s?/, ""));
            i++;
          }
          html += `<blockquote><p>${qLines.map(formatInline).join("<br/>")}</p></blockquote>`;
          continue;
        }
        if (/^\s*-\s+/.test(line)) {
          const items = [];
          while (i < lines.length && /^\s*-\s+/.test(lines[i])) {
            items.push(formatInline(lines[i].replace(/^\s*-\s+/, "")));
            i++;
          }
          html += "<ul>" + items.map(it => `<li>${it}</li>`).join("") + "</ul>";
          continue;
        }
        if (/^\s*\d+\.\s+/.test(line)) {
          const items = [];
          while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
            items.push(formatInline(lines[i].replace(/^\s*\d+\.\s+/, "")));
            i++;
          }
          html += "<ol>" + items.map(it => `<li>${it}</li>`).join("") + "</ol>";
          continue;
        }
        if (!line.trim()) {
          i++;
          continue;
        }
        const pLines = [];
        while (i < lines.length && lines[i].trim() && !lines[i].startsWith("#") && !lines[i].startsWith("```") && !lines[i].startsWith(">") && !lines[i].trim().startsWith("|") && !/^---+$/.test(lines[i].trim()) && !/^\s*(-|\d+\.)\s+/.test(lines[i])) {
          pLines.push(formatInline(lines[i]));
          i++;
        }
        html += `<p>${pLines.join(" ")}</p>`;
      }
      return html;
    }

    window.copyCode = function(btn) {
      const pre = btn.closest(".code-wrapper").querySelector("pre");
      const raw = decodeURIComponent(pre.getAttribute("data-raw"));
      navigator.clipboard.writeText(raw);
      const old = btn.textContent;
      btn.textContent = UI_STRINGS.copied_label;
      setTimeout(() => { btn.textContent = old; }, 1400);
    };

    function renderSidebar() {
      const nav = document.getElementById("navList");
      nav.innerHTML = CHAPTERS.map((ch, idx) => `
        <li class="nav-item">
          <button class="nav-btn ${idx === currentIdx ? 'active' : ''}" onclick="selectChapter(${idx})">
            <span class="nav-num">${ch.num}</span>
            <span>${escapeHtml(ch.short_title)}</span>
          </button>
        </li>
      `).join("");
    }

    window.selectChapter = function(idx) {
      currentIdx = idx;
      const ch = CHAPTERS[idx];
      location.hash = ch.slug;
      renderSidebar();
      let pagerHtml = '<div class="pager">';
      if (idx > 0) {
        pagerHtml += `<button class="pager-btn prev" onclick="selectChapter(${idx - 1})"><span class="pager-label">${UI_STRINGS.prev_label}</span><span class="pager-title">${escapeHtml(CHAPTERS[idx - 1].title)}</span></button>`;
      } else {
        pagerHtml += '<div></div>';
      }
      if (idx + 1 < CHAPTERS.length) {
        pagerHtml += `<button class="pager-btn next" onclick="selectChapter(${idx + 1})"><span class="pager-label">${UI_STRINGS.next_label}</span><span class="pager-title">${escapeHtml(CHAPTERS[idx + 1].title)}</span></button>`;
      }
      pagerHtml += '</div>';
      document.getElementById("chapterContent").innerHTML = renderMarkdown(ch.markdown) + pagerHtml;
      window.scrollTo({ top: 0, behavior: "smooth" });
    };

    document.getElementById("searchInput").addEventListener("input", (e) => {
      const q = e.target.value.trim().toLowerCase();
      if (q.length < 2) {
        selectChapter(currentIdx);
        return;
      }
      const hits = [];
      CHAPTERS.forEach((ch, idx) => {
        const lines = ch.markdown.split("\n");
        for (const l of lines) {
          if (l.toLowerCase().includes(q)) {
            hits.push({ idx, title: ch.title, snippet: l.replace(/^[#>*-]+\s*/, "").slice(0, 140) });
            break;
          }
        }
      });
      const box = hits.length
        ? `<div class="search-results"><strong>${escapeHtml(UI_STRINGS.search_hits_label)} "${escapeHtml(q)}" (${hits.length}):</strong>` +
          hits.map(h => `<div class="search-hit" onclick="document.getElementById('searchInput').value=''; selectChapter(${h.idx})"><div class="search-hit-title">${escapeHtml(h.title)}</div><div class="search-hit-snippet">${escapeHtml(h.snippet)}</div></div>`).join("") +
          `</div>`
        : `<div class="search-results">${escapeHtml(UI_STRINGS.search_empty_label)} "${escapeHtml(q)}".</div>`;
      document.getElementById("chapterContent").innerHTML = box + renderMarkdown(CHAPTERS[currentIdx].markdown);
    });

    document.getElementById("themeBtn").addEventListener("click", () => {
      const root = document.documentElement;
      root.setAttribute("data-theme", root.getAttribute("data-theme") === "dark" ? "light" : "dark");
    });

    const initialSlug = location.hash.replace(/^#/, "");
    const foundIdx = CHAPTERS.findIndex(c => c.slug === initialSlug);
    selectChapter(foundIdx >= 0 ? foundIdx : 0);
  </script>
</body>
