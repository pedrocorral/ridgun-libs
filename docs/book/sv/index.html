  <script>
    const CHAPTERS = [{"num": "00", "slug": "00-varfor-behover-jag-ridgun-libs", "file": "00-varfor-behover-jag-ridgun-libs.md", "title": "Kapitel 00: Varför behöver jag `ridgun-libs`? 32 libs utan en enda rad C? Berätta mer!", "short_title": "Varför behöver jag `ridgun-libs`? 32 libs utan en enda rad C? Berätta mer!", "markdown": "# Kapitel 00: Varför behöver jag `ridgun-libs`? 32 libs utan en enda rad C? Berätta mer!\n\nLåt oss vara ärliga: när du upptäcker att ett språk kompilerar till en pytteliten inbyggd ELF-binär utan skräpsamlare är nästa naturliga fråga du ställer dig — med all rätt:\n\n> *\"Okej, själva språket är fantastiskt... men så fort jag behöver öppna en TCP-socket, beräkna en Argon2id-hash, tolka JSON, lösa ett linjärt ekvationssystem med tensorer eller starta en aktörspool, måste jag då länka in `libc`, `OpenSSL`, `libcurl` och `pcre2`, eller ladda ner 800 tredjepartspaket som underhålls av främlingar?\"*\n\nDet är en utmärkt fråga. Och det korta svaret är: **nej**. Det är precis därför **`ridgun-libs`** finns: en svit med **32 grundläggande libs** skrivna i **100 % ren Ridgun (`v0.9.16`)**, med **noll C-beroenden** och **noll `libc`**.\n\nLåt oss sätta namn på de fyra vardagsplågor som `ridgun-libs` eliminerar från grunden.\n\n---\n\n## Plåga nr 1: \"Helvetet med `libc`, OpenSSL och korslänkning\"\n\nDu har garanterat varit med om den här mardrömmen:\n\n1. Du skriver en server eller ett CLI-verktyg som ska vara \"portabelt\".\n2. Så fort du behöver kryptografi (`SHA-256`, `Argon2id`, `ChaCha20-Poly1305`), nätverk (`DNS`, `HTTP`, `WebSockets`) eller reguljära uttryck blir din binär beroende av `glibc 2.38`, `libssl.so.3` och C-headers.\n3. Du kopierar binären till en minimal container eller en annan Linux-distribution och den kraschar direkt vid start med det ökända `version 'GLIBC_2.38' not found`.\n\n**Vad förändras med `ridgun-libs`?**\nVar och en av de 32 libs som ingår i detta arkiv är skriven helt i tabulär Ridgun och talar direkt med operativsystemets kärna via PAL-lagret (`posix`) eller kör rena algoritmer i deterministiskt minne (`RMM1`/`RMM2`). Alla libs kompileras både till portabla paket (`.rglib` / `.rgc`) och till inbyggda delade ELF64-objekt (`lib*.so`). Utan `libc`, utan bräcklig FFI och utan överraskningar vid driftsättning.\n\n---\n\n## Plåga nr 2: \"`node_modules`- och `Cargo.lock`-syndromet med 400 beroenden\"\n\nI många moderna ekosystem är standardbiblioteket så avskalat att du måste installera ett halvt dussin externa paket bara för att läsa en `.ini`-fil, validera en `UUIDv7`, applicera en Unified Diff-patch eller rendera en säker HTML-mall.\n\nI **`ridgun-libs`** följer alla **32 libs** en enda sammanhängande designfilosofi:\n\n```ridgun\nimport crypto\nimport json\nimport http\n\nfn :: autenticar y pedir (token : String) => String\n      autenticar y pedir token =\n        -- Alla libs delar rena typer, tabelljustering och deterministisk semantik\n        mac_hex = sha256 hex token\n        cuerpo  = json stringify (JnObj [(\"token_sha256\", JnStr mac_hex)])\n        pet     = http build request \"POST\" \"/v1/sesion\" [(\"Content-Type\", \"application/json\")] cuerpo\n        pet\n```\n\nSamma tabulära estetik, samma oföränderliga ADT:er (`Option`, `Result`, `IoResult`, `JsonVal`), noll dolda sidoeffekter.\n\n---\n\n## Plåga nr 3: \"Reguljära uttryck som låser processorn (ReDoS) och sockets som hänger för evigt\"\n\nTvå klassiska tidsinställda bomber i produktion:\n\n- En illvillig användare skickar en sträng som tvingar en regex-motor med *backtracking* in i exponentiell tid $O(2^N)$ och låser en CPU-kärna på 100 %.\n- En nätverksanslutning stannar upp mitt i en överföring och din tråd blockeras för evigt i en `read()` utan tidsgräns.\n\nI **`ridgun-libs`**:\n- Lib:en **`regex`** (Kapitel 11) bygger på en **Thompson-NFA**-automat som garanterar strikt linjär tid **$O(N \\cdot M)$** — immun mot ReDoS-attacker genom sin konstruktion.\n- Libs som **`posix`**, **`io`** och **`socket`** (Kapitel 22, 23 och 27) integrerar lexikala tidsgränser (`with timeout`) och `ppoll` på deskriptornivå.\n\n---\n\n## Plåga nr 4: \"Kryptografi och linjär algebra som ser ut som hieroglyfer\"\n\nI **`ridgun-libs`** gör Ridguns inbyggda `Tensor[...]`-typer att libs som **`tensor`** (Kapitel 05), **`linalg`** (Kapitel 06) och **`argon2id`** (Kapitel 25) kan arbeta direkt över sammanhängande minnesblock (`Tensor[U64 * 8 * 16]`, `Tensor[Real]`) med samma läsbarhet som en matematisk tabell.\n\n---\n\n## Komplett bokkarta: 32 kapitel för 32 libs\n\nVarje kapitel i den här boken är tillägnat **en lib** i `ridgun-libs`, ordnade i en logisk progression nerifrån och upp:\n\n| Kapitel | Lib-familj | Inkluderade libs |\n|---|---|---|\n| **01 – 04** | Text, Matematik och Datastrukturer | `str`, `math`, `list`, `btree` |\n| **05 – 06** | Tensorer och Linjär Algebra | `tensor`, `linalg` |\n| **07 – 10** | Kodning och Dataformat | `codec`, `json`, `csv`, `ini` |\n| **11 – 15** | Textmotorer, Diff, Mallar och Formatering | `regex`, `glob`, `diff`, `template`, `fmt` |\n| **16 – 21** | CLI, Sökvägar, Tid, UUID, Loggning och Testning | `cli`, `path`, `time`, `uuid`, `log`, `test` |\n| **22 – 23** | POSIX-system och Tidsbegränsad I/O | `posix`, `io` |\n| **24 – 26** | Kryptografi, Argon2id och JWT-tokens | `crypto`, `argon2id`, `jwt` |\n| **27 – 29** | Nätverk, Kärn-sockets, HTTP/1.1 och WebSockets | `socket`, `http`, `ws` |\n| **30 – 32** | Aktörskonkurrens, Worker-pooler och Nätverksövervakning | `agent`, `pool`, `net_agent` |\n\nNu kör vi! Bläddra till **Kapitel 01 (`str`)** och börja bygga.\n"}, {"num": "01", "slug": "01-lib-str-textmanipulering", "file": "01-lib-str-textmanipulering.md", "title": "Kapitel 01: Lib:en `str` — Textmanipulering, Sökning och Tabelljustering", "short_title": "Lib:en `str` — Textmanipulering, Sökning och Tabelljustering", "markdown": "# Kapitel 01: Lib:en `str` — Textmanipulering, Sökning och Tabelljustering\n\n## 1. Varför finns lib:en `str`?\n\nLåt oss vara ärliga: att manipulera strängar i C med `strtok` och `strncpy` är att vandra genom ett minfält av buffertspill och `NULL`-pekare, och i andra språk importerar man ofta externa paket bara för att fylla ut kolumner i $O(\\log N)$.\n\nLib:en **`str`** tillhandahåller rena, oföränderliga primitiver för att söka, trimma, dela upp, slå samman, ändra skiftläge, upprepa med binär fördubbling $O(\\log N)$ och fylla ut kolumner.\n\n---\n\n## 2. Paket, import och arkitektur helt utan `libc`\n\nI `ridgun-libs` är **`str`** en förstklassig **lib** placerad i `src/main/ridgun/lib/str.rg` (domän `STR`). När du bygger med `stable bundle` paketeras den i tre inbyggda format:\n\n| Artefakt | Sökväg | Syfte |\n|---|---|---|\n| **Ridgun-bundle** | `target/bundles/str.rglib` | Portabel distribution och direkt import med `import str` |\n| **Kompilerat arkiv** | `target/str.rgc` | Typkontrollerad mellanartefakt verifierad av `ridgunc` |\n| **Delat ELF64-objekt** | `target/libstr.so` | Inbyggt dynamiskt bibliotek helt utan C- eller `libc`-beroenden |\n\n> För att använda denna lib i valfri `.rg`-fil deklarerar du bara `import str` överst och anropar funktionerna med mellanslag eller understreck.\n\n---\n\n## 3. Snabbreferens för `str`-API:et\n\n| Signatur / Funktion / Typ | Vad den gör och när den används |\n|---|---|\n| `str index of : String -> String -> Int` | Första indexet för delsträngen (`-1` om den saknas / `0` om tom) |\n| `str contains / str starts with / str ends with` | `Bool`-predikat för delsträng, prefix och suffix |\n| `str trim / str trim left / str trim right` | Tar bort blanktecken i ASCII (` `, `\\t`, `\\n`, `\\r`) |\n| `str split / str lines / str words / str join` | Delar upp till `[String]` och slår ihop listor med avgränsare |\n| `str replace / str to upper / str to lower` | Icke-överlappande ersättning och ASCII-skiftlägeskonvertering |\n| `str repeat / str pad left / str pad right` | $O(\\log N)$-upprepning och kolumnutfyllnad till fast bredd |\n\n---\n\n## 4. Praktiska recept i tabellform\n\n### Recept 1: Huvudflöde med `str`\n\nLägg märke till hur `=`-tecknen och transformationsstegen linjeras som en ren tabell:\n\n```ridgun\nimport str\n\nfn :: normalizar cabecera (raw : String) => String\n      normalizar cabecera raw =\n        limpia = str to lower (str trim raw)\n        partes = str words limpia\n        slug   = str join partes \"-\"\n        str pad right slug 24 \".\"\n```\n\n### Recept 2: Säker komposition utan sidoeffekter\n\nVarje funktion i lib:en `str` kan kombineras fritt med övriga 32 libs i `ridgun-libs`:\n\n```ridgun\nimport str\n\nfn :: extraer dominio (correo : String) => String\n      extraer dominio correo =\n        pos = str index of correo \"@\"\n        | pos < 0   = \"sin-dominio\"\n        | otherwise =\n          partes = str split correo \"@\"\n          str replace (str to lower correo) \"@\" \" en \"\n```\n\n---\n\n## 5. Under huven: prestanda, RMM-minne och garantier\n\n- **Algoritmisk garanti och säkerhet**: $O(\\log N)$-upprepning via binär strängfördubbling, säker hantering av tomma söksträngar och noll mutering på plats.\n- **Deterministiskt minne (`RMM1`/`RMM2`)**: Noll skräpsamlarpauser; alla temporära strukturer frigörs deterministiskt när räckvidden lämnas.\n- **Kontinuerlig verifiering**: Statiskt kontrollerad med `stable check` och verifierad av den automatiserade testsviten `src/test/ridgun/test_str.rg`.\n"}, {"num": "02", "slug": "02-lib-math-saker-aritmetik-och-talteori", "file": "02-lib-math-saker-aritmetik-och-talteori.md", "title": "Kapitel 02: Lib:en `math` — Säker Aritmetik, Talteori och Statistik", "short_title": "Lib:en `math` — Säker Aritmetik, Talteori och Statistik", "markdown": "# Kapitel 02: Lib:en `math` — Säker Aritmetik, Talteori och Statistik\n\n## 1. Varför finns lib:en `math`?\n\nLåt oss vara ärliga: en oväntad division med noll i produktion eller `%`-operatorn som returnerar negativa rester i C eller Java har sänkt fler tjänster än vi vill erkänna.\n\nLib:en **`math`** erbjuder totala divisioner säkra mot `d == 0` (`div ceil`, `div floor`, `div euclid`, `mod euclid`), modulär exponentiering och invers i $O(\\log E)$, heltalsrötter och logaritmer, kombinatorik samt mixfix-operatorn `clamp x between lo and hi`.\n\n---\n\n## 2. Paket, import och arkitektur helt utan `libc`\n\nI `ridgun-libs` är **`math`** en förstklassig **lib** placerad i `src/main/ridgun/lib/math.rg` (domän `MATH`). När du bygger med `stable bundle` paketeras den i tre inbyggda format:\n\n| Artefakt | Sökväg | Syfte |\n|---|---|---|\n| **Ridgun-bundle** | `target/bundles/math.rglib` | Portabel distribution och direkt import med `import math` |\n| **Kompilerat arkiv** | `target/math.rgc` | Typkontrollerad mellanartefakt verifierad av `ridgunc` |\n| **Delat ELF64-objekt** | `target/libmath.so` | Inbyggt dynamiskt bibliotek helt utan C- eller `libc`-beroenden |\n\n> För att använda denna lib i valfri `.rg`-fil deklarerar du bara `import math` överst och anropar funktionerna med mellanslag eller understreck.\n\n---\n\n## 3. Snabbreferens för `math`-API:et\n\n| Signatur / Funktion / Typ | Vad den gör och när den används |\n|---|---|\n| `math abs / math sign / math min / math max` | Absolutbelopp, tecken (`-1, 0, 1`) och extremvärden |\n| `clamp x between lo and hi` | Mixfix-operator (`op ::`) som begränsar `x` till intervallet `[lo, hi]` |\n| `math div ceil / math div floor / math div euclid / math mod euclid` | Nolldivisionssäker avrundning och icke-negativ euklidisk rest |\n| `math pow / math isqrt / math ilog2 / math ilog10` | $O(\\log E)$-potens, Newtons heltalskvadratrot och heltalslogaritmer |\n| `math gcd / math lcm / math mod pow / math mod inv / math is prime` | Euklidisk SGD/MGM, modulär aritmetik och $6k \\pm 1$-primtalstest |\n| `math sum / math mean floor / math median floor / math variance floor` | Spillsäker kombinatorik (`nCr`) och heltalsstatistik över listor |\n\n---\n\n## 4. Praktiska recept i tabellform\n\n### Recept 1: Huvudflöde med `math`\n\nLägg märke till hur `=`-tecknen och transformationsstegen linjeras som en ren tabell:\n\n```ridgun\nimport math\n\nfn :: verificar clave modular (base : Int) (primo : Int) => (Int, Int, Bool)\n      verificar clave modular base primo =\n        es_p = math is prime primo\n        pot  = math mod pow base (primo - 1) primo\n        inv  = math mod inv base primo\n        (pot, inv, es_p)\n```\n\n### Recept 2: Säker komposition utan sidoeffekter\n\nVarje funktion i lib:en `math` kan kombineras fritt med övriga 32 libs i `ridgun-libs`:\n\n```ridgun\nimport math\n\nfn :: calcular paginas y cuota (items : Int) (por_pag : Int) (uso : Int) => (Int, Int)\n      calcular paginas y cuota items por_pag uso =\n        pags  = math div ceil items por_pag\n        cuota = clamp uso between 0 and 100\n        (pags, cuota)\n```\n\n---\n\n## 5. Under huven: prestanda, RMM-minne och garantier\n\n- **Algoritmisk garanti och säkerhet**: Totala funktioner (returnerar `0` när divisorn är `<= 0` istället för att krascha med `SIGFPE`), helt utan flyttalsavrundningsfel.\n- **Deterministiskt minne (`RMM1`/`RMM2`)**: Noll skräpsamlarpauser; alla temporära strukturer frigörs deterministiskt när räckvidden lämnas.\n- **Kontinuerlig verifiering**: Statiskt kontrollerad med `stable check` och verifierad av den automatiserade testsviten `src/test/ridgun/test_math.rg`.\n"}, {"num": "03", "slug": "03-lib-list-listor-mergesort-och-kv-mappar", "file": "03-lib-list-listor-mergesort-och-kv-mappar.md", "title": "Kapitel 03: Lib:en `list` — Listor, $O(N \\log N)$ Mergesort och Nyckel-Värde-Mappar", "short_title": "Lib:en `list` — Listor, $O(N \\log N)$ Mergesort och Nyckel-Värde-Mappar", "markdown": "# Kapitel 03: Lib:en `list` — Listor, $O(N \\log N)$ Mergesort och Nyckel-Värde-Mappar\n\n## 1. Varför finns lib:en `list`?\n\nLåt oss vara ärliga: indexfel utanför gränserna (`IndexError` / `panic!`) och oavsiktlig mutering av delade listor är två av de vanligaste buggarna vid databearbetning.\n\nLib:en **`list`** tillhandahåller säker indexering med standardvärde, skivning (`take`, `drop`, `slice`), intervall, stabil deduplicering, **$O(N \\log N)$ mergesort** för `[Int]` och `[String]` samt oföränderliga `[String String]`-nyckel-värde-mappar (`kv get`, `kv put`, `kv merge`).\n\n---\n\n## 2. Paket, import och arkitektur helt utan `libc`\n\nI `ridgun-libs` är **`list`** en förstklassig **lib** placerad i `src/main/ridgun/lib/list.rg` (domän `LIST`). När du bygger med `stable bundle` paketeras den i tre inbyggda format:\n\n| Artefakt | Sökväg | Syfte |\n|---|---|---|\n| **Ridgun-bundle** | `target/bundles/list.rglib` | Portabel distribution och direkt import med `import list` |\n| **Kompilerat arkiv** | `target/list.rgc` | Typkontrollerad mellanartefakt verifierad av `ridgunc` |\n| **Delat ELF64-objekt** | `target/liblist.so` | Inbyggt dynamiskt bibliotek helt utan C- eller `libc`-beroenden |\n\n> För att använda denna lib i valfri `.rg`-fil deklarerar du bara `import list` överst och anropar funktionerna med mellanslag eller understreck.\n\n---\n\n## 3. Snabbreferens för `list`-API:et\n\n| Signatur / Funktion / Typ | Vad den gör och när den används |\n|---|---|\n| `list nth or / list str nth or` | Säker indexuppslagning som returnerar `default_val` utanför gränserna |\n| `list take / list drop / list slice / list reverse` | Prefix, suffix, delintervall `[start, end)` och svansrekursiv omvändning |\n| `list range / list range step` | Genererar aritmetiska talföljder (`step == 0` returnerar säkert `[]`) |\n| `list sort / list str sort / list dedup / list str dedup` | Stabil $O(N \\log N)$ mergesort och deduplicering vid första förekomst |\n| `kv empty / kv put / kv get / kv get or / kv remove / kv merge` | Operationer på ordnade associativa `[String String]`-nyckel-värde-mappar |\n\n---\n\n## 4. Praktiska recept i tabellform\n\n### Recept 1: Huvudflöde med `list`\n\nLägg märke till hur `=`-tecknen och transformationsstegen linjeras som en ren tabell:\n\n```ridgun\nimport list\n\nfn :: top tres unicos (puntos : [Int]) => [Int]\n      top tres unicos puntos =\n        unicos    = list dedup puntos\n        ordenados = list reverse (list sort unicos)\n        list take ordenados 3\n```\n\n### Recept 2: Säker komposition utan sidoeffekter\n\nVarje funktion i lib:en `list` kan kombineras fritt med övriga 32 libs i `ridgun-libs`:\n\n```ridgun\nimport list\n\nfn :: configurar entorno (base : [String String]) => (String, [String])\n      configurar entorno base =\n        cfg1 = kv put base \"host\" \"0.0.0.0\"\n        cfg2 = kv put cfg1 \"port\" \"8080\"\n        host = kv get or cfg2 \"host\" \"127.0.0.1\"\n        (host, kv keys cfg2)\n```\n\n---\n\n## 5. Under huven: prestanda, RMM-minne och garantier\n\n- **Algoritmisk garanti och säkerhet**: Deterministisk $O(N \\log N)$-sortering i värsta fall (immun mot Quicksorts patologiska $O(N^2)$) och bevarad insättningsordning i `kv`-mappar.\n- **Deterministiskt minne (`RMM1`/`RMM2`)**: Noll skräpsamlarpauser; alla temporära strukturer frigörs deterministiskt när räckvidden lämnas.\n- **Kontinuerlig verifiering**: Statiskt kontrollerad med `stable check` och verifierad av den automatiserade testsviten `src/test/ridgun/test_list.rg`.\n"}, {"num": "04", "slug": "04-lib-btree-avl-trad-mangder-och-prioritetskoer", "file": "04-lib-btree-avl-trad-mangder-och-prioritetskoer.md", "title": "Kapitel 04: Lib:en `btree` — Beständiga $O(\\log N)$ AVL-Träd, Mängder och Prioritetsköer", "short_title": "Lib:en `btree` — Beständiga $O(\\log N)$ AVL-Träd, Mängder och Prioritetsköer", "markdown": "# Kapitel 04: Lib:en `btree` — Beständiga $O(\\log N)$ AVL-Träd, Mängder och Prioritetsköer\n\n## 1. Varför finns lib:en `btree`?\n\nLåt oss vara ärliga: muterbara hashtabeller är sårbara för hashkollisionsattacker (HashDoS), håller inte nycklar sorterade för intervallfrågor och kan inte delas säkert mellan aktörer utan lås.\n\nLib:en **`btree`** implementerar tre beständiga funktionella datastrukturer i $O(\\log N)$ med strukturell delning: **`BTreeMap`** (självbalanserande AVL-träd), **`BTreeSet`** (ordnad mängdalgebra) och **`MinHeap`** (*leftist heap*-prioritetskö).\n\n---\n\n## 2. Paket, import och arkitektur helt utan `libc`\n\nI `ridgun-libs` är **`btree`** en förstklassig **lib** placerad i `src/main/ridgun/lib/btree.rg` (domän `BTREE`). När du bygger med `stable bundle` paketeras den i tre inbyggda format:\n\n| Artefakt | Sökväg | Syfte |\n|---|---|---|\n| **Ridgun-bundle** | `target/bundles/btree.rglib` | Portabel distribution och direkt import med `import btree` |\n| **Kompilerat arkiv** | `target/btree.rgc` | Typkontrollerad mellanartefakt verifierad av `ridgunc` |\n| **Delat ELF64-objekt** | `target/libbtree.so` | Inbyggt dynamiskt bibliotek helt utan C- eller `libc`-beroenden |\n\n> För att använda denna lib i valfri `.rg`-fil deklarerar du bara `import btree` överst och anropar funktionerna med mellanslag eller understreck.\n\n---\n\n## 3. Snabbreferens för `btree`-API:et\n\n| Signatur / Funktion / Typ | Vad den gör och när den används |\n|---|---|\n| `btree empty / btree insert / btree get / btree remove` | Beständig $O(\\log N)$ AVL-uppslagning, insättning och borttagning |\n| `btree min key / btree max key / btree range` | Ordnade extremvärden och intervallfråga `[lo, hi]` |\n| `bset from list / bset union / bset intersect / bset diff` | Ordnad mängdalgebra (`BTreeSet`) och delmängdspredikat |\n| `heap empty / heap push / heap peek / heap pop / heap sort` | Prioritetskö `MinHeap` (*leftist heap*) med sammanslagning i $O(\\log N)$ |\n\n---\n\n## 4. Praktiska recept i tabellform\n\n### Recept 1: Huvudflöde med `btree`\n\nLägg märke till hur `=`-tecknen och transformationsstegen linjeras som en ren tabell:\n\n```ridgun\nimport btree\n\nfn :: consultar rango precios () => [String String]\n      consultar rango precios =\n        t0 = btree empty\n        t1 = btree insert t0 \"item:10\" \"Teclado\"\n        t2 = btree insert t1 \"item:20\" \"Monitor\"\n        t3 = btree insert t2 \"item:30\" \"Raton\"\n        btree range t3 \"item:10\" \"item:25\"\n```\n\n### Recept 2: Säker komposition utan sidoeffekter\n\nVarje funktion i lib:en `btree` kan kombineras fritt med övriga 32 libs i `ridgun-libs`:\n\n```ridgun\nimport btree\n\nfn :: despachar urgente () => (Int, String)\n      despachar urgente =\n        h0 = heap empty\n        h1 = heap push h0 50 \"backup-nocturno\"\n        h2 = heap push h1 10 \"alerta-seguridad\"\n        h3 = heap push h2 30 \"rotar-logs\"\n        heap peek h3\n```\n\n---\n\n## 5. Under huven: prestanda, RMM-minne och garantier\n\n- **Algoritmisk garanti och säkerhet**: Strikt AVL-balansering (`height diff <= 1`), fullständig immunitet mot HashDoS, intervallfrågor i $O(\\log N + K)$ och sammanslagning av heaps i $O(\\log N)$.\n- **Deterministiskt minne (`RMM1`/`RMM2`)**: Noll skräpsamlarpauser; alla temporära strukturer frigörs deterministiskt när räckvidden lämnas.\n- **Kontinuerlig verifiering**: Statiskt kontrollerad med `stable check` och verifierad av den automatiserade testsviten `src/test/ridgun/test_btree.rg`.\n"}, {"num": "05", "slug": "05-lib-tensor-flerdimensionella-tensorer", "file": "05-lib-tensor-flerdimensionella-tensorer.md", "title": "Kapitel 05: Lib:en `tensor` — Flerdimensionella Tensorer, Vyer och Einsteinkontraktion", "short_title": "Lib:en `tensor` — Flerdimensionella Tensorer, Vyer och Einsteinkontraktion", "markdown": "# Kapitel 05: Lib:en `tensor` — Flerdimensionella Tensorer, Vyer och Einsteinkontraktion\n\n## 1. Varför finns lib:en `tensor`?\n\nLåt oss vara ärliga: i de flesta språk måste du välja mellan långsamma nästlade listor fulla av pekare eller att länka in ett C++/Fortran-paket på 200 MB som NumPy/BLAS.\n\nLib:en **`tensor`** kapslar in Ridguns inbyggda `Tensor[...]`-primitiv med typade konstruktörer (`Tensor[Int]`, `Tensor[Real]`, `Tensor[U64]`), kopieringsfria vyer (`reshape`, `slice`), elementvisa Hadamard-operationer, Einsteinkontraktion och 64-bitars `BlaMka`-aritmetik.\n\n---\n\n## 2. Paket, import och arkitektur helt utan `libc`\n\nI `ridgun-libs` är **`tensor`** en förstklassig **lib** placerad i `src/main/ridgun/lib/tensor.rg` (domän `TENSOR`). När du bygger med `stable bundle` paketeras den i tre inbyggda format:\n\n| Artefakt | Sökväg | Syfte |\n|---|---|---|\n| **Ridgun-bundle** | `target/bundles/tensor.rglib` | Portabel distribution och direkt import med `import tensor` |\n| **Kompilerat arkiv** | `target/tensor.rgc` | Typkontrollerad mellanartefakt verifierad av `ridgunc` |\n| **Delat ELF64-objekt** | `target/libtensor.so` | Inbyggt dynamiskt bibliotek helt utan C- eller `libc`-beroenden |\n\n> För att använda denna lib i valfri `.rg`-fil deklarerar du bara `import tensor` överst och anropar funktionerna med mellanslag eller understreck.\n\n---\n\n## 3. Snabbreferens för `tensor`-API:et\n\n| Signatur / Funktion / Typ | Vad den gör och när den används |\n|---|---|\n| `tensor zeros int / tensor fill int / tensor zeros real` | Allokerar sammanhängande 1D/2D-block av `Tensor[Int]` och `Tensor[Real]` |\n| `tensor get 1d / tensor set 1d / tensor get 2d / tensor set 2d` | Funktionell Copy-on-Write-åtkomst och uppdatering (`with [i] = v`) |\n| `tensor reshape 1d to 2d / tensor slice 1d` | $O(1)$-deskriptorvyer utan att kopiera tensorns underliggande lagring |\n| `tensor add int / tensor mul int / tensor scale int` | Elementvis Hadamard-addition, multiplikation och skalning |\n| `tensor dot int / tensor matmul int` | Einsteinkontraktion över index (`a[i] * b[i]`, `a[i, k] * b[k, j]`) |\n| `u64 blamka g / u64 rotr` | 64-bitars teckenlös `U64`-rotationsblandning för kryptografiska block |\n\n---\n\n## 4. Praktiska recept i tabellform\n\n### Recept 1: Huvudflöde med `tensor`\n\nLägg märke till hur `=`-tecknen och transformationsstegen linjeras som en ren tabell:\n\n```ridgun\nimport tensor\n\nfn :: producto matricial tensor () => Tensor[Int]\n      producto matricial tensor =\n        a = tensor reshape 1d to 2d (tensor from list int [1, 2, 3, 4]) 2 2\n        b = tensor reshape 1d to 2d (tensor from list int [5, 6, 7, 8]) 2 2\n        tensor matmul int a b\n```\n\n### Recept 2: Säker komposition utan sidoeffekter\n\nVarje funktion i lib:en `tensor` kan kombineras fritt med övriga 32 libs i `ridgun-libs`:\n\n```ridgun\nimport tensor\n\nfn :: energia vector (xs : [Int]) => (Int, Int)\n      energia vector xs =\n        v   = tensor from list int xs\n        dot = tensor dot int v v\n        mx  = tensor max int v\n        (dot, mx)\n```\n\n---\n\n## 5. Under huven: prestanda, RMM-minne och garantier\n\n- **Algoritmisk garanti och säkerhet**: Sammanhängande 8-bytesjusterat minne statiskt hanterat av RMM1/RMM2, $O(1)$-vyer utan buffertkopiering och ren Copy-on-Write-semantik.\n- **Deterministiskt minne (`RMM1`/`RMM2`)**: Noll skräpsamlarpauser; alla temporära strukturer frigörs deterministiskt när räckvidden lämnas.\n- **Kontinuerlig verifiering**: Statiskt kontrollerad med `stable check` och verifierad av den automatiserade testsviten `src/test/ridgun/test_tensor.rg`.\n"}, {"num": "06", "slug": "06-lib-linalg-linjar-algebra-och-tensorer", "file": "06-lib-linalg-linjar-algebra-och-tensorer.md", "title": "Kapitel 06: Lib:en `linalg` — Linjär Algebra över `Tensor[Real]`, Bareiss-lösare och Aktiveringar", "short_title": "Lib:en `linalg` — Linjär Algebra över `Tensor[Real]`, Bareiss-lösare och Aktiveringar", "markdown": "# Kapitel 06: Lib:en `linalg` — Linjär Algebra över `Tensor[Real]`, Bareiss-lösare och Aktiveringar\n\n## 1. Varför finns lib:en `linalg`?\n\nLåt oss vara ärliga: när du vill beräkna cosinuslikhet för embeddings, lösa $A x = b$ eller köra ett `softmax`-lager i en lättviktig tjänst vill du inte släpa med 400 MB PyTorch eller LAPACK.\n\nLib:en **`linalg`** bygger numerisk linjär algebra direkt på inbyggda `Tensor[Real]`: transponering, spår, identitetsmatris, inre/yttre produkt, Einsteinkontraherad `matvec` och `matmul`, normer ($L_1, L_2, L_\\infty$, Frobenius), **Bareiss/Gauss**-determinant och $A x = b$-lösare samt neuronnätsaktiveringar (`relu`, `sigmoid`, `softmax`).\n\n---\n\n## 2. Paket, import och arkitektur helt utan `libc`\n\nI `ridgun-libs` är **`linalg`** en förstklassig **lib** placerad i `src/main/ridgun/lib/linalg.rg` (domän `LINALG`). När du bygger med `stable bundle` paketeras den i tre inbyggda format:\n\n| Artefakt | Sökväg | Syfte |\n|---|---|---|\n| **Ridgun-bundle** | `target/bundles/linalg.rglib` | Portabel distribution och direkt import med `import linalg` |\n| **Kompilerat arkiv** | `target/linalg.rgc` | Typkontrollerad mellanartefakt verifierad av `ridgunc` |\n| **Delat ELF64-objekt** | `target/liblinalg.so` | Inbyggt dynamiskt bibliotek helt utan C- eller `libc`-beroenden |\n\n> För att använda denna lib i valfri `.rg`-fil deklarerar du bara `import linalg` överst och anropar funktionerna med mellanslag eller understreck.\n\n---\n\n## 3. Snabbreferens för `linalg`-API:et\n\n| Signatur / Funktion / Typ | Vad den gör och när den används |\n|---|---|\n| `linalg vec from list / linalg mat from lists` | Konstruerar 1D- och 2D-`Tensor[Real]` från Ridgun-listor |\n| `linalg transpose / linalg trace / linalg diag / linalg identity` | Strukturella matristransformationer och identitetsmatriser |\n| `linalg dot / linalg outer / linalg matvec / linalg matmul` | Einstein contraction (`a[i] * b[i]`, `a[i, k] * b[k, j]`) |\n| `linalg norm l1 / linalg norm l2 / linalg cosine similarity` | Vektor-/matrisnormer, normalisering och cosinuslikhet |\n| `linalg det / linalg solve` | Exakt Bareiss-determinant och $A x = b$-lösare med partiell pivotering (`Option[Tensor[Real]]`) |\n| `linalg relu / linalg sigmoid / linalg softmax` | Numeriskt stabila neuronnätsaktiveringar med max-förskjutning |\n\n---\n\n## 4. Praktiska recept i tabellform\n\n### Recept 1: Huvudflöde med `linalg`\n\nLägg märke till hur `=`-tecknen och transformationsstegen linjeras som en ren tabell:\n\n```ridgun\nimport linalg\n\nfn :: resolver sistema lineal () => Option[Tensor[Real]]\n      resolver sistema lineal =\n        -- Resuelve 2x + y = 5, x + 3y = 10 -> x = 1.0, y = 3.0\n        a = linalg mat from lists [[2.0, 1.0], [1.0, 3.0]]\n        b = linalg vec from list [5.0, 10.0]\n        linalg solve a b\n```\n\n### Recept 2: Säker komposition utan sidoeffekter\n\nVarje funktion i lib:en `linalg` kan kombineras fritt med övriga 32 libs i `ridgun-libs`:\n\n```ridgun\nimport linalg\n\nfn :: puntuar embeddings () => (Real, Tensor[Real])\n      puntuar embeddings =\n        q     = linalg vec from list [1.0, 2.0, 3.0]\n        d     = linalg vec from list [1.0, 2.0, 3.0]\n        sim   = linalg cosine similarity q d\n        probs = linalg softmax q\n        (sim, probs)\n```\n\n---\n\n## 5. Under huven: prestanda, RMM-minne och garantier\n\n- **Algoritmisk garanti och säkerhet**: Singulära matriser returnerar `None` rent i `linalg solve` (inga tysta `NaN`), och `linalg softmax` subtraherar maxvärdet före exponentiering för att förhindra spill.\n- **Deterministiskt minne (`RMM1`/`RMM2`)**: Noll skräpsamlarpauser; alla temporära strukturer frigörs deterministiskt när räckvidden lämnas.\n- **Kontinuerlig verifiering**: Statiskt kontrollerad med `stable check` och verifierad av den automatiserade testsviten `src/test/ridgun/test_linalg.rg`.\n"}, {"num": "07", "slug": "07-lib-codec-hex-base64-och-url-kodning", "file": "07-lib-codec-hex-base64-och-url-kodning.md", "title": "Kapitel 07: Lib:en `codec` — RFC 4648 Hex, Base64, Base64url och URL-kodning", "short_title": "Lib:en `codec` — RFC 4648 Hex, Base64, Base64url och URL-kodning", "markdown": "# Kapitel 07: Lib:en `codec` — RFC 4648 Hex, Base64, Base64url och URL-kodning\n\n## 1. Varför finns lib:en `codec`?\n\nLåt oss vara ärliga: inget kraschar en webbintegration snabbare än att blanda ihop standard-Base64 (`+/=`) med URL-säker Base64url (`-_` utan utfyllnad) i en JWT, eller att bygga query-strängar utan att koda specialtecken.\n\nLib:en **`codec`** implementerar **RFC 4648** (Hex, Base64 och Base64url), **RFC 3986** (procentkodning av URL:er samt `query encode` / `query decode`) och lättviktiga **RFC 8259 JSON**-byggare.\n\n---\n\n## 2. Paket, import och arkitektur helt utan `libc`\n\nI `ridgun-libs` är **`codec`** en förstklassig **lib** placerad i `src/main/ridgun/lib/codec.rg` (domän `CODEC`). När du bygger med `stable bundle` paketeras den i tre inbyggda format:\n\n| Artefakt | Sökväg | Syfte |\n|---|---|---|\n| **Ridgun-bundle** | `target/bundles/codec.rglib` | Portabel distribution och direkt import med `import codec` |\n| **Kompilerat arkiv** | `target/codec.rgc` | Typkontrollerad mellanartefakt verifierad av `ridgunc` |\n| **Delat ELF64-objekt** | `target/libcodec.so` | Inbyggt dynamiskt bibliotek helt utan C- eller `libc`-beroenden |\n\n> För att använda denna lib i valfri `.rg`-fil deklarerar du bara `import codec` överst och anropar funktionerna med mellanslag eller understreck.\n\n---\n\n## 3. Snabbreferens för `codec`-API:et\n\n| Signatur / Funktion / Typ | Vad den gör och när den används |\n|---|---|\n| `hex encode / hex decode / hex is valid` | Hexadecimal kodning i gemener enligt RFC 4648 och validerad avkodning |\n| `base64 encode / base64 decode` | Standard Base64 enligt RFC 4648 §4 med `=`-utfyllnad |\n| `base64url encode / base64url decode` | URL-säker RFC 4648 §5 Base64url (`-`, `_`, utan utfyllnad) |\n| `url encode / url decode / query encode / query decode` | RFC 3986-procentkodning och `k=v&...` query-strängkonvertering |\n| `json quote / json object / json get str / json get int` | Snabb JSON-serialisering utan AST och nyckeluppslagning på toppnivå |\n\n---\n\n## 4. Praktiska recept i tabellform\n\n### Recept 1: Huvudflöde med `codec`\n\nLägg märke till hur `=`-tecknen och transformationsstegen linjeras som en ren tabell:\n\n```ridgun\nimport codec\n\nfn :: empaquetar parametros (usuario : String) (redir : String) => String\n      empaquetar parametros usuario redir =\n        token_b64 = base64url encode usuario\n        query encode [(\"token\", token_b64), (\"next\", redir)]\n```\n\n### Recept 2: Säker komposition utan sidoeffekter\n\nVarje funktion i lib:en `codec` kan kombineras fritt med övriga 32 libs i `ridgun-libs`:\n\n```ridgun\nimport codec\n\nfn :: construir respuesta rapida (id : Int) (nombre : String) => (String, Int)\n      construir respuesta rapida id nombre =\n        doc = json object [(\"id\", json int id), (\"name\", json quote nombre), (\"ok\", json bool True)]\n        leido = json get int doc \"id\" 0\n        (doc, leido)\n```\n\n---\n\n## 5. Under huven: prestanda, RMM-minne och garantier\n\n- **Algoritmisk garanti och säkerhet**: Deterministiskt avvisande av felformade Hex- eller Base64-indata (returnerar `\"\"` utan läsningar utanför gränserna) och exakt $decode(encode(x)) == x$-rundresa.\n- **Deterministiskt minne (`RMM1`/`RMM2`)**: Noll skräpsamlarpauser; alla temporära strukturer frigörs deterministiskt när räckvidden lämnas.\n- **Kontinuerlig verifiering**: Statiskt kontrollerad med `stable check` och verifierad av den automatiserade testsviten `src/test/ridgun/test_codec.rg`.\n"}, {"num": "08", "slug": "08-lib-json-ast-tolk-och-fragor", "file": "08-lib-json-ast-tolk-och-fragor.md", "title": "Kapitel 08: Lib:en `json` — Rekursiv RFC 8259 AST-tolk, Pretty-Printer och Sökvägsfrågor", "short_title": "Lib:en `json` — Rekursiv RFC 8259 AST-tolk, Pretty-Printer och Sökvägsfrågor", "markdown": "# Kapitel 08: Lib:en `json` — Rekursiv RFC 8259 AST-tolk, Pretty-Printer och Sökvägsfrågor\n\n## 1. Varför finns lib:en `json`?\n\nLåt oss vara ärliga: att navigera i djupt nästlad JSON i många statiskt typade språk kräver sidor av boilerplate-kod eller tio kedjade `.and_then()` bara för att läsa ett portnummer.\n\nLib:en **`json`** erbjuder en komplett rekursiv **RFC 8259**-tolk till den algebraiska datatypen `JsonVal` (`JnNull`, `JnBool`, `JnInt`, `JnStr`, `JnArr`, `JnObj`, `JnErr`), kompakt och indenterad serialisering (`json pretty`) samt punktseparerade sökvägsfrågor (`\"server.http.port\"`, `\"users.0.name\"`).\n\n---\n\n## 2. Paket, import och arkitektur helt utan `libc`\n\nI `ridgun-libs` är **`json`** en förstklassig **lib** placerad i `src/main/ridgun/lib/json.rg` (domän `JSON`). När du bygger med `stable bundle` paketeras den i tre inbyggda format:\n\n| Artefakt | Sökväg | Syfte |\n|---|---|---|\n| **Ridgun-bundle** | `target/bundles/json.rglib` | Portabel distribution och direkt import med `import json` |\n| **Kompilerat arkiv** | `target/json.rgc` | Typkontrollerad mellanartefakt verifierad av `ridgunc` |\n| **Delat ELF64-objekt** | `target/libjson.so` | Inbyggt dynamiskt bibliotek helt utan C- eller `libc`-beroenden |\n\n> För att använda denna lib i valfri `.rg`-fil deklarerar du bara `import json` överst och anropar funktionerna med mellanslag eller understreck.\n\n---\n\n## 3. Snabbreferens för `json`-API:et\n\n| Signatur / Funktion / Typ | Vad den gör och när den används |\n|---|---|\n| `type JsonVal` | `JnNull | JnBool Bool | JnInt Int | JnStr String | JnArr [JsonVal] | JnObj [String JsonVal] | JnErr String` |\n| `json parse / json is ok` | Tolkar JSON-text till `JsonVal` och kontrollerar att `JnErr` inte uppstått |\n| `json stringify / json pretty` | Serialiserar `JsonVal` till kompakt eller flerradig indenterad JSON |\n| `json get path / json get str / json get int / json get bool` | Navigerar i nästlade objekt och listor via punktseparerade sökvägar (`\"a.b.0.c\"`) |\n\n---\n\n## 4. Praktiska recept i tabellform\n\n### Recept 1: Huvudflöde med `json`\n\nLägg märke till hur `=`-tecknen och transformationsstegen linjeras som en ren tabell:\n\n```ridgun\nimport json\n\nfn :: leer config servidor (raw : String) => (String, Int, Bool)\n      leer config servidor raw =\n        doc  = json parse raw\n        host = json get str doc \"server.host\" \"127.0.0.1\"\n        port = json get int doc \"server.port\" 8080\n        tls  = json get bool doc \"server.tls.enabled\" False\n        (host, port, tls)\n```\n\n### Recept 2: Säker komposition utan sidoeffekter\n\nVarje funktion i lib:en `json` kan kombineras fritt med övriga 32 libs i `ridgun-libs`:\n\n```ridgun\nimport json\n\nfn :: construir manifiesto () => String\n      construir manifiesto =\n        nodo = JnObj [(\"app\", JnStr \"solstice\"), (\"workers\", JnInt 8), (\"tags\", JnArr [JnStr \"elf64\", JnStr \"rmm2\"])]\n        json pretty nodo 2\n```\n\n---\n\n## 5. Under huven: prestanda, RMM-minne och garantier\n\n- **Algoritmisk garanti och säkerhet**: Strikt avvisande av skräptecken efter rotvärdet (`trailing garbage`), fullständig hantering av escape-sekvenser och undantagsfri felrapportering med `JnErr`.\n- **Deterministiskt minne (`RMM1`/`RMM2`)**: Noll skräpsamlarpauser; alla temporära strukturer frigörs deterministiskt när räckvidden lämnas.\n- **Kontinuerlig verifiering**: Statiskt kontrollerad med `stable check` och verifierad av den automatiserade testsviten `src/test/ridgun/test_json.rg`.\n"}, {"num": "09", "slug": "09-lib-csv-rfc4180-tolk-och-tabeller", "file": "09-lib-csv-rfc4180-tolk-och-tabeller.md", "title": "Kapitel 09: Lib:en `csv` — RFC 4180 CSV/TSV-Tillståndsmaskin och Kolumnindexerade Tabeller", "short_title": "Lib:en `csv` — RFC 4180 CSV/TSV-Tillståndsmaskin och Kolumnindexerade Tabeller", "markdown": "# Kapitel 09: Lib:en `csv` — RFC 4180 CSV/TSV-Tillståndsmaskin och Kolumnindexerade Tabeller\n\n## 1. Varför finns lib:en `csv`?\n\nLåt oss vara ärliga: alla tror att CSV-tolkning bara är `str split rad \",\"`... tills det dyker upp ett citerat fält med ett kommatecken inuti, dubbla citattecken `\"\"` eller en radbrytning `\\r\\n` mitt i en cell.\n\nLib:en **`csv`** implementerar en komplett **RFC 4180**-tillståndsmaskin för CSV och TSV, smart serialisering med citattecken och typen `CsvTable` för kolumn- och raduppslagning via rubriknamn.\n\n---\n\n## 2. Paket, import och arkitektur helt utan `libc`\n\nI `ridgun-libs` är **`csv`** en förstklassig **lib** placerad i `src/main/ridgun/lib/csv.rg` (domän `CSV`). När du bygger med `stable bundle` paketeras den i tre inbyggda format:\n\n| Artefakt | Sökväg | Syfte |\n|---|---|---|\n| **Ridgun-bundle** | `target/bundles/csv.rglib` | Portabel distribution och direkt import med `import csv` |\n| **Kompilerat arkiv** | `target/csv.rgc` | Typkontrollerad mellanartefakt verifierad av `ridgunc` |\n| **Delat ELF64-objekt** | `target/libcsv.so` | Inbyggt dynamiskt bibliotek helt utan C- eller `libc`-beroenden |\n\n> För att använda denna lib i valfri `.rg`-fil deklarerar du bara `import csv` överst och anropar funktionerna med mellanslag eller understreck.\n\n---\n\n## 3. Snabbreferens för `csv`-API:et\n\n| Signatur / Funktion / Typ | Vad den gör och när den används |\n|---|---|\n| `csv parse / tsv parse / csv parse with` | Tolkar CSV/TSV-text (inklusive flerradiga citerade fält och `\"\"`) till `[[String]]` |\n| `csv stringify / tsv stringify` | Serialiserar `[[String]]` och citerar endast celler med avgränsare, citattecken eller radbrytningar |\n| `csv parse table / csv get cell / csv col` | Rubrikindexerad `CsvTable`-uppslagning via `(rad, kolumnnamn)` eller hel kolumn |\n| `csv row to kv / csv table to kv list` | Konverterar tabellrader till `[String String]`-mappar nycklade efter rubrik |\n\n---\n\n## 4. Praktiska recept i tabellform\n\n### Recept 1: Huvudflöde med `csv`\n\nLägg märke till hur `=`-tecknen och transformationsstegen linjeras som en ren tabell:\n\n```ridgun\nimport csv\n\nfn :: extraer columna precios (raw_csv : String) => ([String], String)\n      extraer columna precios raw_csv =\n        tabla   = csv parse table raw_csv\n        precios = csv col tabla \"precio\"\n        primero = csv get cell tabla 0 \"producto\" \"desconocido\"\n        (precios, primero)\n```\n\n### Recept 2: Säker komposition utan sidoeffekter\n\nVarje funktion i lib:en `csv` kan kombineras fritt med övriga 32 libs i `ridgun-libs`:\n\n```ridgun\nimport csv\n\nfn :: exportar informe () => String\n      exportar informe =\n        filas = [[\"id\", \"nota\"], [\"1\", \"Contiene, coma\"], [\"2\", \"Dijo \"hola\"\"]]\n        csv stringify filas\n```\n\n---\n\n## 5. Under huven: prestanda, RMM-minne och garantier\n\n- **Algoritmisk garanti och säkerhet**: Exakt hantering av `\\r\\n` och `\\n` både inom och utanför citattecken samt förlustfria rundresor med `csv parse (csv stringify rader)`.\n- **Deterministiskt minne (`RMM1`/`RMM2`)**: Noll skräpsamlarpauser; alla temporära strukturer frigörs deterministiskt när räckvidden lämnas.\n- **Kontinuerlig verifiering**: Statiskt kontrollerad med `stable check` och verifierad av den automatiserade testsviten `src/test/ridgun/test_csv.rg`.\n"}, {"num": "10", "slug": "10-lib-ini-ini-och-dotenv-konfiguration", "file": "10-lib-ini-ini-och-dotenv-konfiguration.md", "title": "Kapitel 10: Lib:en `ini` — Sektionsindelade `.ini`-filer, `.env` och Variabelinterpolering", "short_title": "Lib:en `ini` — Sektionsindelade `.ini`-filer, `.env` och Variabelinterpolering", "markdown": "# Kapitel 10: Lib:en `ini` — Sektionsindelade `.ini`-filer, `.env` och Variabelinterpolering\n\n## 1. Varför finns lib:en `ini`?\n\nLåt oss vara ärliga: `.env`- och `.ini`-filer verkar triviala tills någon skriver `export KEY=\"värde # med brädgård\"`, kommentarer med `;` i slutet av raden eller korsreferenser mellan variabler.\n\nLib:en **`ini`** tolkar sektionsindelade `.ini`-filer (`[database]`) och `.env`-filer med `export`-prefix, bevarar `#` och `;` inuti citerade värden och löser upp variabelinterpoleringar i `dotenv parse`.\n\n---\n\n## 2. Paket, import och arkitektur helt utan `libc`\n\nI `ridgun-libs` är **`ini`** en förstklassig **lib** placerad i `src/main/ridgun/lib/ini.rg` (domän `INI`). När du bygger med `stable bundle` paketeras den i tre inbyggda format:\n\n| Artefakt | Sökväg | Syfte |\n|---|---|---|\n| **Ridgun-bundle** | `target/bundles/ini.rglib` | Portabel distribution och direkt import med `import ini` |\n| **Kompilerat arkiv** | `target/ini.rgc` | Typkontrollerad mellanartefakt verifierad av `ridgunc` |\n| **Delat ELF64-objekt** | `target/libini.so` | Inbyggt dynamiskt bibliotek helt utan C- eller `libc`-beroenden |\n\n> För att använda denna lib i valfri `.rg`-fil deklarerar du bara `import ini` överst och anropar funktionerna med mellanslag eller understreck.\n\n---\n\n## 3. Snabbreferens för `ini`-API:et\n\n| Signatur / Funktion / Typ | Vad den gör och när den används |\n|---|---|\n| `ini parse / ini stringify` | Tolkar sektionsindelad `.ini`-text till `IniDoc` och serialiserar tillbaka |\n| `ini get / ini get int / ini get bool / ini set` | Typad uppslagning via sektion+nyckel (`\"\"` för global sektion) och oföränderlig uppdatering |\n| `ini sections / ini section map` | Listar alla sektionsnamn eller extraherar en sektions `[String String]`-mapp |\n| `dotenv parse` | Tolkar `.env`-rader (`export K=V`, citattecken, kommentarer och variabelexpansion) |\n\n---\n\n## 4. Praktiska recept i tabellform\n\n### Recept 1: Huvudflöde med `ini`\n\nLägg märke till hur `=`-tecknen och transformationsstegen linjeras som en ren tabell:\n\n```ridgun\nimport ini\n\nfn :: cargar base de datos (texto_ini : String) => (String, Int, Bool)\n      cargar base de datos texto_ini =\n        doc  = ini parse texto_ini\n        host = ini get doc \"database\" \"host\" \"localhost\"\n        port = ini get int doc \"database\" \"port\" 5432\n        pool = ini get bool doc \"database\" \"pool\" True\n        (host, port, pool)\n```\n\n### Recept 2: Säker komposition utan sidoeffekter\n\nVarje funktion i lib:en `ini` kan kombineras fritt med övriga 32 libs i `ridgun-libs`:\n\n```ridgun\nimport ini\n\nfn :: actualizar puerto (doc : IniDoc) (nuevo : String) => String\n      actualizar puerto doc nuevo =\n        doc2 = ini set doc \"database\" \"port\" nuevo\n        ini stringify doc2\n```\n\n---\n\n## 5. Under huven: prestanda, RMM-minne och garantier\n\n- **Algoritmisk garanti och säkerhet**: Fullt bevarande av `#` och `;` inuti enkla eller dubbla citattecken samt flexibel boolesk tolkning (`true/1/yes/on` kontra `false/0/no/off`).\n- **Deterministiskt minne (`RMM1`/`RMM2`)**: Noll skräpsamlarpauser; alla temporära strukturer frigörs deterministiskt när räckvidden lämnas.\n- **Kontinuerlig verifiering**: Statiskt kontrollerad med `stable check` och verifierad av den automatiserade testsviten `src/test/ridgun/test_ini.rg`.\n"}, {"num": "11", "slug": "11-lib-regex-linjar-thompson-nfa", "file": "11-lib-regex-linjar-thompson-nfa.md", "title": "Kapitel 11: Lib:en `regex` — Reguljära Uttryck med Thompson-NFA i Linjär Tid $O(N \\cdot M)$", "short_title": "Lib:en `regex` — Reguljära Uttryck med Thompson-NFA i Linjär Tid $O(N \\cdot M)$", "markdown": "# Kapitel 11: Lib:en `regex` — Reguljära Uttryck med Thompson-NFA i Linjär Tid $O(N \\cdot M)$\n\n## 1. Varför finns lib:en `regex`?\n\nLåt oss vara ärliga: regex-motorer med *backtracking* har orsakat ökända globala driftstopp (som hos Cloudflare och StackOverflow) när ett mönster som `(a+)+b` matas med trettio `a` i rad och exploderar i exponentiell tid $O(2^N)$.\n\nLib:en **`regex`** kompilerar reguljära uttryck (`.`, `*`, `+`, `?`, `|`, `()`, `[a-z]`, `[^...]`, `^`, `$`, `\\d`, `\\w`, `\\s`) till en **Thompson-NFA** och stegar tillståndsmängden i strikt linjär tid **$O(N \\cdot M)$**, vilket gör **ReDoS-attacker matematiskt omöjliga**.\n\n---\n\n## 2. Paket, import och arkitektur helt utan `libc`\n\nI `ridgun-libs` är **`regex`** en förstklassig **lib** placerad i `src/main/ridgun/lib/regex.rg` (domän `REGEX`). När du bygger med `stable bundle` paketeras den i tre inbyggda format:\n\n| Artefakt | Sökväg | Syfte |\n|---|---|---|\n| **Ridgun-bundle** | `target/bundles/regex.rglib` | Portabel distribution och direkt import med `import regex` |\n| **Kompilerat arkiv** | `target/regex.rgc` | Typkontrollerad mellanartefakt verifierad av `ridgunc` |\n| **Delat ELF64-objekt** | `target/libregex.so` | Inbyggt dynamiskt bibliotek helt utan C- eller `libc`-beroenden |\n\n> För att använda denna lib i valfri `.rg`-fil deklarerar du bara `import regex` överst och anropar funktionerna med mellanslag eller understreck.\n\n---\n\n## 3. Snabbreferens för `regex`-API:et\n\n| Signatur / Funktion / Typ | Vad den gör och när den används |\n|---|---|\n| `regex match / regex is match` | Helsträngsmatchning och delsträngssökning i linjär tid $O(N \\cdot M)$ |\n| `regex find / regex find all` | Extraherar den första eller alla icke-överlappande matchande delsträngar |\n| `regex replace / regex replace all` | Ersätter den första eller alla regex-träffar med en ersättningssträng |\n| `regex split / regex escape` | Delar upp text med en regex-avgränsare och kodar metatecken |\n\n---\n\n## 4. Praktiska recept i tabellform\n\n### Recept 1: Huvudflöde med `regex`\n\nLägg märke till hur `=`-tecknen och transformationsstegen linjeras som en ren tabell:\n\n```ridgun\nimport regex\n\nfn :: extraer codigos postales (texto : String) => [String]\n      extraer codigos postales texto =\n        regex find all \"\\\\d+\" texto\n```\n\n### Recept 2: Säker komposition utan sidoeffekter\n\nVarje funktion i lib:en `regex` kan kombineras fritt med övriga 32 libs i `ridgun-libs`:\n\n```ridgun\nimport regex\n\nfn :: censurar telefonos (comentario : String) => (Bool, String)\n      censurar telefonos comentario =\n        tiene = regex is match \"\\\\d+-\\\\d+\" comentario\n        limpio = regex replace all \"\\\\d+-\\\\d+\" comentario \"[TELEFONO]\"\n        (tiene, limpio)\n```\n\n---\n\n## 5. Under huven: prestanda, RMM-minne och garantier\n\n- **Algoritmisk garanti och säkerhet**: NFA-tillståndssimulering utan okontrollerad stackrekursion och garanterad $O(N \\cdot M)$-körtid även för patologiska `(a+)+b`-mönster.\n- **Deterministiskt minne (`RMM1`/`RMM2`)**: Noll skräpsamlarpauser; alla temporära strukturer frigörs deterministiskt när räckvidden lämnas.\n- **Kontinuerlig verifiering**: Statiskt kontrollerad med `stable check` och verifierad av den automatiserade testsviten `src/test/ridgun/test_regex.rg`.\n"}, {"num": "12", "slug": "12-lib-glob-jokertecken-och-filtrering", "file": "12-lib-glob-jokertecken-och-filtrering.md", "title": "Kapitel 12: Lib:en `glob` — Jokerteckenmönster (`*`, `?`, `[a-z]`) och Listfiltrering", "short_title": "Lib:en `glob` — Jokerteckenmönster (`*`, `?`, `[a-z]`) och Listfiltrering", "markdown": "# Kapitel 12: Lib:en `glob` — Jokerteckenmönster (`*`, `?`, `[a-z]`) och Listfiltrering\n\n## 1. Varför finns lib:en `glob`?\n\nLåt oss vara ärliga: att dra igång en hel regex-motor bara för att kontrollera om ett filnamn matchar `*.rg` eller `test_[0-9]*.rg` är att skjuta mygg med kanon.\n\nLib:en **`glob`** implementerar exakt matchning av skal-jokertecken (`*`, `?`, `[a-z]`-intervall, negerade `[!0-9]` / `[^a-z]`-klasser), skiftlägesokänslig matchning (`glob match ci`) och listfiltrering.\n\n---\n\n## 2. Paket, import och arkitektur helt utan `libc`\n\nI `ridgun-libs` är **`glob`** en förstklassig **lib** placerad i `src/main/ridgun/lib/glob.rg` (domän `GLOB`). När du bygger med `stable bundle` paketeras den i tre inbyggda format:\n\n| Artefakt | Sökväg | Syfte |\n|---|---|---|\n| **Ridgun-bundle** | `target/bundles/glob.rglib` | Portabel distribution och direkt import med `import glob` |\n| **Kompilerat arkiv** | `target/glob.rgc` | Typkontrollerad mellanartefakt verifierad av `ridgunc` |\n| **Delat ELF64-objekt** | `target/libglob.so` | Inbyggt dynamiskt bibliotek helt utan C- eller `libc`-beroenden |\n\n> För att använda denna lib i valfri `.rg`-fil deklarerar du bara `import glob` överst och anropar funktionerna med mellanslag eller understreck.\n\n---\n\n## 3. Snabbreferens för `glob`-API:et\n\n| Signatur / Funktion / Typ | Vad den gör och när den används |\n|---|---|\n| `glob match / glob match ci` | Skiftlägeskänslig och skiftlägesokänslig glob-mönstermatchning |\n| `glob filter / glob any match` | Filtrerar `[String]` till matchande element eller testar om något mönster i en lista matchar |\n| `glob has magic` | Detekterar om en sträng innehåller jokertecken (`*`, `?`, `[`) |\n\n---\n\n## 4. Praktiska recept i tabellform\n\n### Recept 1: Huvudflöde med `glob`\n\nLägg märke till hur `=`-tecknen och transformationsstegen linjeras som en ren tabell:\n\n```ridgun\nimport glob\n\nfn :: seleccionar fuentes ridgun (archivos : [String]) => [String]\n      seleccionar fuentes ridgun archivos =\n        glob filter \"test_[a-z]*.rg\" archivos\n```\n\n### Recept 2: Säker komposition utan sidoeffekter\n\nVarje funktion i lib:en `glob` kan kombineras fritt med övriga 32 libs i `ridgun-libs`:\n\n```ridgun\nimport glob\n\nfn :: es ruta excluida (ruta : String) => Bool\n      es ruta excluida ruta =\n        glob any match [\"*.tmp\", \"*.bak\", \"target/*\"] ruta\n```\n\n---\n\n## 5. Under huven: prestanda, RMM-minne och garantier\n\n- **Algoritmisk garanti och säkerhet**: Automatisk sammanslagning av på varandra följande asterisker (`***` $\\rightarrow$ `*`) för att undvika onödig backtracking samt säker hantering av oavslutade `[`-klammrar.\n- **Deterministiskt minne (`RMM1`/`RMM2`)**: Noll skräpsamlarpauser; alla temporära strukturer frigörs deterministiskt när räckvidden lämnas.\n- **Kontinuerlig verifiering**: Statiskt kontrollerad med `stable check` och verifierad av den automatiserade testsviten `src/test/ridgun/test_glob.rg`.\n"}, {"num": "13", "slug": "13-lib-diff-lcs-unified-diff-och-patchning", "file": "13-lib-diff-lcs-unified-diff-och-patchning.md", "title": "Kapitel 13: Lib:en `diff` — LCS-raddiff, Redigeringsavstånd, Unified Diff och Patchning", "short_title": "Lib:en `diff` — LCS-raddiff, Redigeringsavstånd, Unified Diff och Patchning", "markdown": "# Kapitel 13: Lib:en `diff` — LCS-raddiff, Redigeringsavstånd, Unified Diff och Patchning\n\n## 1. Varför finns lib:en `diff`?\n\nLåt oss vara ärliga: när ett test fallerar eller en konfigurationsfil ändras tvingar en rå 200-raders `\"expected A, got B\"`-utskrift dig att kisa mot skärmen för att hitta exakt vilken rad som ändrats.\n\nLib:en **`diff`** beräknar **Longest Common Subsequence (LCS)** över en 2D `Tensor[Int]`-tabell för att skapa minimala redigeringssekvenser (`DiffKeep`, `DiffAdd`, `DiffDel`), redigeringsavstånd, **Unified Diff** (`---`/`+++`/`@@`) och förlustfri patchning (`diff apply`).\n\n---\n\n## 2. Paket, import och arkitektur helt utan `libc`\n\nI `ridgun-libs` är **`diff`** en förstklassig **lib** placerad i `src/main/ridgun/lib/diff.rg` (domän `DIFF`). När du bygger med `stable bundle` paketeras den i tre inbyggda format:\n\n| Artefakt | Sökväg | Syfte |\n|---|---|---|\n| **Ridgun-bundle** | `target/bundles/diff.rglib` | Portabel distribution och direkt import med `import diff` |\n| **Kompilerat arkiv** | `target/diff.rgc` | Typkontrollerad mellanartefakt verifierad av `ridgunc` |\n| **Delat ELF64-objekt** | `target/libdiff.so` | Inbyggt dynamiskt bibliotek helt utan C- eller `libc`-beroenden |\n\n> För att använda denna lib i valfri `.rg`-fil deklarerar du bara `import diff` överst och anropar funktionerna med mellanslag eller understreck.\n\n---\n\n## 3. Snabbreferens för `diff`-API:et\n\n| Signatur / Funktion / Typ | Vad den gör och när den används |\n|---|---|\n| `type DiffOp` | `DiffKeep String | DiffDel String | DiffAdd String` |\n| `diff lines / diff text` | Beräknar minimalt LCS-redigeringsskript mellan `[String]`-listor eller flerradiga texter |\n| `diff edit distance / diff stats` | Minimalt insättnings-/borttagningsavstånd och `(kept, added, deleted)`-antal |\n| `diff format / diff unified` | Renderar kompakta `+ / - /  `-rader eller standard Unified Diff med rubriker |\n| `diff apply / diff apply text` | Återskapar måldokumentet förlustfritt från ett redigeringsskript |\n\n---\n\n## 4. Praktiska recept i tabellform\n\n### Recept 1: Huvudflöde med `diff`\n\nLägg märke till hur `=`-tecknen och transformationsstegen linjeras som en ren tabell:\n\n```ridgun\nimport diff\n\nfn :: auditar cambio (antes : String) (despues : String) => (Int, String)\n      auditar cambio antes despues =\n        dist   = diff edit distance ( [\"host=localhost\", \"port=8080\"] ) ( [\"host=0.0.0.0\", \"port=8080\"] )\n        parche = diff unified \"config.old\" \"config.new\" antes despues\n        (dist, parche)\n```\n\n### Recept 2: Säker komposition utan sidoeffekter\n\nVarje funktion i lib:en `diff` kan kombineras fritt med övriga 32 libs i `ridgun-libs`:\n\n```ridgun\nimport diff\n\nfn :: verificar parche (orig : [String]) (nuevo : [String]) => [String]\n      verificar parche orig nuevo =\n        ops = diff lines orig nuevo\n        diff apply ops\n```\n\n---\n\n## 5. Under huven: prestanda, RMM-minne och garantier\n\n- **Algoritmisk garanti och säkerhet**: Garanterad matematisk identitet $diff\\_edit\\_distance(a, b) == |a| + |b| - 2 \\cdot LCS(a, b)$ och förlustfri rekonstruktion `diff apply (diff lines a b) == b`.\n- **Deterministiskt minne (`RMM1`/`RMM2`)**: Noll skräpsamlarpauser; alla temporära strukturer frigörs deterministiskt när räckvidden lämnas.\n- **Kontinuerlig verifiering**: Statiskt kontrollerad med `stable check` och verifierad av den automatiserade testsviten `src/test/ridgun/test_diff.rg`.\n"}, {"num": "14", "slug": "14-lib-template-sakra-mustache-mallar", "file": "14-lib-template-sakra-mustache-mallar.md", "title": "Kapitel 14: Lib:en `template` — Säkra Mustache-mallar med Automatisk HTML- och LaTeX-kodning", "short_title": "Lib:en `template` — Säkra Mustache-mallar med Automatisk HTML- och LaTeX-kodning", "markdown": "# Kapitel 14: Lib:en `template` — Säkra Mustache-mallar med Automatisk HTML- och LaTeX-kodning\n\n## 1. Varför finns lib:en `template`?\n\nLåt oss vara ärliga: att bygga HTML-sidor eller LaTeX-rapporter genom manuell strängkonkatenering är ett säkert recept på XSS-sårbarheter (`<script>`) eller trasiga PDF-byggen så fort någon skriver `%` eller `_`.\n\nLib:en **`template`** erbjuder en logikfri **Mustache**-motor med kontextuell automatisk kodning (`TmplPlain`, `TmplHtml`, `TmplLatex`), explicit råinterpolering (`{{{raw}}}` / `{{&raw}}`), kommentarer (`{{! ... }}`) samt villkorliga (`{{#sec}}`) och inverterade sektioner (`{{^sec}}`).\n\n---\n\n## 2. Paket, import och arkitektur helt utan `libc`\n\nI `ridgun-libs` är **`template`** en förstklassig **lib** placerad i `src/main/ridgun/lib/template.rg` (domän `TMPL`). När du bygger med `stable bundle` paketeras den i tre inbyggda format:\n\n| Artefakt | Sökväg | Syfte |\n|---|---|---|\n| **Ridgun-bundle** | `target/bundles/template.rglib` | Portabel distribution och direkt import med `import template` |\n| **Kompilerat arkiv** | `target/template.rgc` | Typkontrollerad mellanartefakt verifierad av `ridgunc` |\n| **Delat ELF64-objekt** | `target/libtemplate.so` | Inbyggt dynamiskt bibliotek helt utan C- eller `libc`-beroenden |\n\n> För att använda denna lib i valfri `.rg`-fil deklarerar du bara `import template` överst och anropar funktionerna med mellanslag eller understreck.\n\n---\n\n## 3. Snabbreferens för `template`-API:et\n\n| Signatur / Funktion / Typ | Vad den gör och när den används |\n|---|---|\n| `tmpl render / tmpl render html / tmpl render latex` | Renderar Mustache-mallar med enkel, HTML- eller LaTeX-autokodning |\n| `tmpl escape html / tmpl escape latex` | Kodar `& < > \" '` för HTML eller `\\ { } & % $ # _ ~ ^` för LaTeX |\n| `tmpl extract vars / tmpl has unclosed tags` | Extraherar obligatoriska variabelnamn och validerar taggbalans före rendering |\n\n---\n\n## 4. Praktiska recept i tabellform\n\n### Recept 1: Huvudflöde med `template`\n\nLägg märke till hur `=`-tecknen och transformationsstegen linjeras som en ren tabell:\n\n```ridgun\nimport template\n\nfn :: renderizar perfil html (usuario : String) (es_admin : String) => String\n      renderizar perfil html usuario es_admin =\n        plantilla = \"<h1>Hola {{user}}</h1>{{#admin}}<span class='badge'>Admin</span>{{/admin}}\"\n        vars      = [(\"user\", usuario), (\"admin\", es_admin)]\n        tmpl render html plantilla vars\n```\n\n### Recept 2: Säker komposition utan sidoeffekter\n\nVarje funktion i lib:en `template` kan kombineras fritt med övriga 32 libs i `ridgun-libs`:\n\n```ridgun\nimport template\n\nfn :: generar linea latex (metrica : String) => String\n      generar linea latex metrica =\n        -- Escapa automaticamente % _ & # para que LaTeX no falle\n        tmpl render latex \"Resultado: {{val}}\" [(\"val\", metrica)]\n```\n\n---\n\n## 5. Under huven: prestanda, RMM-minne och garantier\n\n- **Algoritmisk garanti och säkerhet**: Inbyggt XSS-skydd som standard i `tmpl render html` (kodar `&`, `<`, `>`, `\"`, `'`), medan `{{{var}}}` tillåter explicit råinjektion av betrodd markup.\n- **Deterministiskt minne (`RMM1`/`RMM2`)**: Noll skräpsamlarpauser; alla temporära strukturer frigörs deterministiskt när räckvidden lämnas.\n- **Kontinuerlig verifiering**: Statiskt kontrollerad med `stable check` och verifierad av den automatiserade testsviten `src/test/ridgun/test_template.rg`.\n"}, {"num": "15", "slug": "15-lib-fmt-tabellformaterare-och-syntaxmarkering", "file": "15-lib-fmt-tabellformaterare-och-syntaxmarkering.md", "title": "Kapitel 15: Lib:en `fmt` — Kanonisk 2D-tabellformaterare och Syntaxmarkering för 9 Målformat", "short_title": "Lib:en `fmt` — Kanonisk 2D-tabellformaterare och Syntaxmarkering för 9 Målformat", "markdown": "# Kapitel 15: Lib:en `fmt` — Kanonisk 2D-tabellformaterare och Syntaxmarkering för 9 Målformat\n\n## 1. Varför finns lib:en `fmt`?\n\nLåt oss vara ärliga: skönheten i Ridgun-kod ligger i dess perfekt justerade tabellkolumner (`::`, `=`, `|`, `->`, `--`), men att justera mellanslag för hand eller exportera färgkodad syntax till terminal, HTML och LaTeX är tidsödande.\n\nLib:en **`fmt`** är Ridguns officiella 2D-tabellformaterare och syntaxmarkerare: den justerar `fn ::`-signaturer, ekvationer, `|`-vakter och `--`-kommentarer samt exporterar till **9 målformat** (`FmtPlain`, `FmtTty`, `FmtTrueColor`, `FmtHtmlInline`, `FmtHtmlCss`, `FmtMarkdown`, `FmtPango`, `FmtLatex`, `FmtRtf`).\n\n---\n\n## 2. Paket, import och arkitektur helt utan `libc`\n\nI `ridgun-libs` är **`fmt`** en förstklassig **lib** placerad i `src/main/ridgun/lib/fmt.rg` (domän `FMT`). När du bygger med `stable bundle` paketeras den i tre inbyggda format:\n\n| Artefakt | Sökväg | Syfte |\n|---|---|---|\n| **Ridgun-bundle** | `target/bundles/fmt.rglib` | Portabel distribution och direkt import med `import fmt` |\n| **Kompilerat arkiv** | `target/fmt.rgc` | Typkontrollerad mellanartefakt verifierad av `ridgunc` |\n| **Delat ELF64-objekt** | `target/libfmt.so` | Inbyggt dynamiskt bibliotek helt utan C- eller `libc`-beroenden |\n\n> För att använda denna lib i valfri `.rg`-fil deklarerar du bara `import fmt` överst och anropar funktionerna med mellanslag eller understreck.\n\n---\n\n## 3. Snabbreferens för `fmt`-API:et\n\n| Signatur / Funktion / Typ | Vad den gör och när den används |\n|---|---|\n| `fmt source / fmt source with` | Formaterar Ridgun-källkod med kanonisk 2D-tabelljustering |\n| `fmt check` | Returnerar `True` om källkoden redan följer kanonisk `fmt source`-layout |\n| `fmt render / fmt render with` | Formaterar och syntaxmarkerar källkod till valfritt av de 9 `FmtTarget`-målen |\n| `fmt tokenize line` | Tokeniserar en rad till `TokKeyword`, `TokType`, `TokOperator`, `TokString`, `TokNumber`, `TokComment` |\n\n---\n\n## 4. Praktiska recept i tabellform\n\n### Recept 1: Huvudflöde med `fmt`\n\nLägg märke till hur `=`-tecknen och transformationsstegen linjeras som en ren tabell:\n\n```ridgun\nimport fmt\n\nfn :: formatear y verificar (codigo : String) => (String, Bool)\n      formatear y verificar codigo =\n        limpio = fmt source codigo\n        es_ok  = fmt check limpio\n        (limpio, es_ok)\n```\n\n### Recept 2: Säker komposition utan sidoeffekter\n\nVarje funktion i lib:en `fmt` kan kombineras fritt med övriga 32 libs i `ridgun-libs`:\n\n```ridgun\nimport fmt\n\nfn :: exportar bloque html (codigo : String) => String\n      exportar bloque html codigo =\n        fmt render codigo FmtHtmlCss\n```\n\n---\n\n## 5. Under huven: prestanda, RMM-minne och garantier\n\n- **Algoritmisk garanti och säkerhet**: Strikt idempotens (`fmt source (fmt source s) == fmt source s`) och 100 % bevarande av semantiska tokens.\n- **Deterministiskt minne (`RMM1`/`RMM2`)**: Noll skräpsamlarpauser; alla temporära strukturer frigörs deterministiskt när räckvidden lämnas.\n- **Kontinuerlig verifiering**: Statiskt kontrollerad med `stable check` och verifierad av den automatiserade testsviten `src/test/ridgun/test_fmt.rg`.\n"}, {"num": "16", "slug": "16-lib-cli-flaggor-och-miljovariabler", "file": "16-lib-cli-flaggor-och-miljovariabler.md", "title": "Kapitel 16: Lib:en `cli` — Flaggor, Alternativ, `--`-barriär, Underkommandon och Miljövariabler", "short_title": "Lib:en `cli` — Flaggor, Alternativ, `--`-barriär, Underkommandon och Miljövariabler", "markdown": "# Kapitel 16: Lib:en `cli` — Flaggor, Alternativ, `--`-barriär, Underkommandon och Miljövariabler\n\n## 1. Varför finns lib:en `cli`?\n\nLåt oss vara ärliga: att tolka `argv` för hand börjar alltid som en oskyldig loop och går sönder så fort någon skickar kombinerade `-la`-flaggor, `--port=9090` eller `--` följt av ett filnamn som börjar med bindestreck.\n\nLib:en **`cli`** hanterar långa flaggor (`--verbose`), korta flaggor (`-v`), kombinerade kortflaggor (`-la`), värdealternativ (`--port=8080`, `--port 8080`, `-p 8080`), POSIX-barriären `--`, positionella argument, underkommandon och typade miljövariabler.\n\n---\n\n## 2. Paket, import och arkitektur helt utan `libc`\n\nI `ridgun-libs` är **`cli`** en förstklassig **lib** placerad i `src/main/ridgun/lib/cli.rg` (domän `CLI`). När du bygger med `stable bundle` paketeras den i tre inbyggda format:\n\n| Artefakt | Sökväg | Syfte |\n|---|---|---|\n| **Ridgun-bundle** | `target/bundles/cli.rglib` | Portabel distribution och direkt import med `import cli` |\n| **Kompilerat arkiv** | `target/cli.rgc` | Typkontrollerad mellanartefakt verifierad av `ridgunc` |\n| **Delat ELF64-objekt** | `target/libcli.so` | Inbyggt dynamiskt bibliotek helt utan C- eller `libc`-beroenden |\n\n> För att använda denna lib i valfri `.rg`-fil deklarerar du bara `import cli` överst och anropar funktionerna med mellanslag eller understreck.\n\n---\n\n## 3. Snabbreferens för `cli`-API:et\n\n| Signatur / Funktion / Typ | Vad den gör och när den används |\n|---|---|\n| `cli has flag : [String] -> String -> String -> Bool` | Detekterar `--long`, `-s` eller kombinerade `-xyz` före `--` |\n| `cli get opt / cli get int opt` | Extraherar sträng- eller heltalsalternativ (`--k=v`, `--k v`, `-k v`) med standardvärde |\n| `cli positionals / cli subcommand` | Samlar in positionella argument (inklusive allt efter `--`) |\n| `env get or / env get int or / env get bool or` | Läser miljövariabler med typad konvertering och reservvärden |\n\n---\n\n## 4. Praktiska recept i tabellform\n\n### Recept 1: Huvudflöde med `cli`\n\nLägg märke till hur `=`-tecknen och transformationsstegen linjeras som en ren tabell:\n\n```ridgun\nimport cli\n\nfn :: analizar comando (args : [String]) => (String, Bool, Int, [String])\n      analizar comando args =\n        sub   = cli subcommand args\n        all_f = cli has flag args \"--all\" \"-a\"\n        port  = cli get int opt args \"--port\" \"-p\" 8080\n        arch  = cli positionals args [\"--port\", \"-p\"]\n        (sub, all_f, port, arch)\n```\n\n### Recept 2: Säker komposition utan sidoeffekter\n\nVarje funktion i lib:en `cli` kan kombineras fritt med övriga 32 libs i `ridgun-libs`:\n\n```ridgun\nimport cli\n\nfn :: leer config entorno () => (Int, Bool)\n      leer config entorno =\n        workers = env get int or \"SOLSTICE_WORKERS\" 4\n        debug   = env get bool or \"SOLSTICE_DEBUG\" False\n        (workers, debug)\n```\n\n---\n\n## 5. Under huven: prestanda, RMM-minne och garantier\n\n- **Algoritmisk garanti och säkerhet**: Strikt efterlevnad av POSIX-barriären `--`: inget argument till höger om `--` tolkas någonsin som en flagga.\n- **Deterministiskt minne (`RMM1`/`RMM2`)**: Noll skräpsamlarpauser; alla temporära strukturer frigörs deterministiskt när räckvidden lämnas.\n- **Kontinuerlig verifiering**: Statiskt kontrollerad med `stable check` och verifierad av den automatiserade testsviten `src/test/ridgun/test_cli.rg`.\n"}, {"num": "17", "slug": "17-lib-path-posix-sokvagar-och-sakerhet", "file": "17-lib-path-posix-sokvagar-och-sakerhet.md", "title": "Kapitel 17: Lib:en `path` — POSIX-normalisering (`path clean`) och Skydd mot Path Traversal", "short_title": "Lib:en `path` — POSIX-normalisering (`path clean`) och Skydd mot Path Traversal", "markdown": "# Kapitel 17: Lib:en `path` — POSIX-normalisering (`path clean`) och Skydd mot Path Traversal\n\n## 1. Varför finns lib:en `path`?\n\nLåt oss vara ärliga: att slå ihop sökvägar med `base + \"/\" + fil` utan att rensa `..`-segment och kontrollera gränser är en öppen inbjudan till en `../../etc/passwd`-attack.\n\nLib:en **`path`** implementerar lexikal POSIX-normalisering (`path clean`), säker sammanslagning (`path join`), komponentextrahering (`dirname`, `basename`, `stem`, `ext`, `replace ext`) och säkerhetspredikatet **`path is safe subpath`** (`VUL-INJ-001`) mot *path traversal*.\n\n---\n\n## 2. Paket, import och arkitektur helt utan `libc`\n\nI `ridgun-libs` är **`path`** en förstklassig **lib** placerad i `src/main/ridgun/lib/path.rg` (domän `PATH`). När du bygger med `stable bundle` paketeras den i tre inbyggda format:\n\n| Artefakt | Sökväg | Syfte |\n|---|---|---|\n| **Ridgun-bundle** | `target/bundles/path.rglib` | Portabel distribution och direkt import med `import path` |\n| **Kompilerat arkiv** | `target/path.rgc` | Typkontrollerad mellanartefakt verifierad av `ridgunc` |\n| **Delat ELF64-objekt** | `target/libpath.so` | Inbyggt dynamiskt bibliotek helt utan C- eller `libc`-beroenden |\n\n> För att använda denna lib i valfri `.rg`-fil deklarerar du bara `import path` överst och anropar funktionerna med mellanslag eller understreck.\n\n---\n\n## 3. Snabbreferens för `path`-API:et\n\n| Signatur / Funktion / Typ | Vad den gör och när den används |\n|---|---|\n| `path clean / path join / path join list` | Slår ihop `//`, `.` och `..` lexikalt och förenar sökvägssegment |\n| `path dirname / path basename / path split` | Delar upp en sökväg i föräldrakatalog och sista filnamnskomponent |\n| `path ext / path stem / path replace ext` | Extraherar eller byter filändelse (behandlar `.bashrc` som basnamn `.bashrc`, ändelse `\"\"`) |\n| `path is safe subpath : String -> String -> Bool` | Verifierar att `rel` stannar strikt inom `base_dir` och saknar NUL-bytes |\n\n---\n\n## 4. Praktiska recept i tabellform\n\n### Recept 1: Huvudflöde med `path`\n\nLägg märke till hur `=`-tecknen och transformationsstegen linjeras som en ren tabell:\n\n```ridgun\nimport path\n\nfn :: resolver archivo estatico (raiz : String) (peticion : String) => (Bool, String)\n      resolver archivo estatico raiz peticion =\n        seguro = path is safe subpath raiz peticion\n        ruta   = path join raiz peticion\n        (seguro, ruta)\n```\n\n### Recept 2: Säker komposition utan sidoeffekter\n\nVarje funktion i lib:en `path` kan kombineras fritt med övriga 32 libs i `ridgun-libs`:\n\n```ridgun\nimport path\n\nfn :: cambiar salida a objeto (fuente : String) => (String, String, String)\n      cambiar salida a objeto fuente =\n        dir = path dirname fuente\n        nom = path stem fuente\n        obj = path replace ext (path clean fuente) \".rglib\"\n        (dir, nom, obj)\n```\n\n---\n\n## 5. Under huven: prestanda, RMM-minne och garantier\n\n- **Algoritmisk garanti och säkerhet**: `path is safe subpath` avvisar absoluta sökvägar, NUL-bytes och alla `..`-sekvenser som försöker lämna baskatalogen eller nå en syskonkatalog (`/srv/www-secret`).\n- **Deterministiskt minne (`RMM1`/`RMM2`)**: Noll skräpsamlarpauser; alla temporära strukturer frigörs deterministiskt när räckvidden lämnas.\n- **Kontinuerlig verifiering**: Statiskt kontrollerad med `stable check` och verifierad av den automatiserade testsviten `src/test/ridgun/test_path.rg`.\n"}, {"num": "18", "slug": "18-lib-time-utc-kalender-iso8601-och-backoff", "file": "18-lib-time-utc-kalender-iso8601-och-backoff.md", "title": "Kapitel 18: Lib:en `time` — UTC-kalender (Hinnant), ISO-8601, Varaktigheter och Backoff", "short_title": "Lib:en `time` — UTC-kalender (Hinnant), ISO-8601, Varaktigheter och Backoff", "markdown": "# Kapitel 18: Lib:en `time` — UTC-kalender (Hinnant), ISO-8601, Varaktigheter och Backoff\n\n## 1. Varför finns lib:en `time`?\n\nLåt oss vara ärliga: datumfunktionerna i `libc` (`localtime`, `gmtime`, `mktime`) förlitar sig på muterbart globalt tillstånd (`TZ`), är inte trådsäkra och snubblar lätt på skottårsregler.\n\nLib:en **`time`** implementerar **Howard Hinnants $O(1)$**-algoritm för den proleptiska gregorianska UTC-kalendern, strikt **ISO-8601 / RFC 3339**-formatering och tolkning (`YYYY-MM-DDTHH:MM:SSZ`), läsbara varaktigheter (`1h 1m 1s 5ms`) och exponentiell backoff.\n\n---\n\n## 2. Paket, import och arkitektur helt utan `libc`\n\nI `ridgun-libs` är **`time`** en förstklassig **lib** placerad i `src/main/ridgun/lib/time.rg` (domän `TIME`). När du bygger med `stable bundle` paketeras den i tre inbyggda format:\n\n| Artefakt | Sökväg | Syfte |\n|---|---|---|\n| **Ridgun-bundle** | `target/bundles/time.rglib` | Portabel distribution och direkt import med `import time` |\n| **Kompilerat arkiv** | `target/time.rgc` | Typkontrollerad mellanartefakt verifierad av `ridgunc` |\n| **Delat ELF64-objekt** | `target/libtime.so` | Inbyggt dynamiskt bibliotek helt utan C- eller `libc`-beroenden |\n\n> För att använda denna lib i valfri `.rg`-fil deklarerar du bara `import time` överst och anropar funktionerna med mellanslag eller understreck.\n\n---\n\n## 3. Snabbreferens för `time`-API:et\n\n| Signatur / Funktion / Typ | Vad den gör och när den används |\n|---|---|\n| `time epoch to utc / time utc to epoch` | $O(1)$-konvertering mellan Unix epoch-sekunder och `(year, month, day, hour, min, sec)` |\n| `time is leap year / time days in month / time day of week` | Skottårsregler (`400 / 100 / 4`), månadslängder och ISO-veckodag (`1=Mån..7=Sön`) |\n| `time format iso8601 / time parse iso8601` | Formaterar och validerar `YYYY-MM-DDTHH:MM:SSZ`-tidsstämplar (`-1` vid ogiltiga datum som 30 feb) |\n| `time format duration ms / time backoff ms` | Läsbara varaktigheter och begränsade exponentiella väntetider $base \\cdot 2^{attempt}$ |\n\n---\n\n## 4. Praktiska recept i tabellform\n\n### Recept 1: Huvudflöde med `time`\n\nLägg märke till hur `=`-tecknen och transformationsstegen linjeras som en ren tabell:\n\n```ridgun\nimport time\n\nfn :: registrar evento temporal (epoch_s : Int) => (String, Int, String)\n      registrar evento temporal epoch_s =\n        iso = time format iso8601 epoch_s\n        sem = time day of week epoch_s\n        dur = time format duration ms 3661005\n        (iso, sem, dur)\n```\n\n### Recept 2: Säker komposition utan sidoeffekter\n\nVarje funktion i lib:en `time` kan kombineras fritt med övriga 32 libs i `ridgun-libs`:\n\n```ridgun\nimport time\n\nfn :: planificar reintentos () => [Int]\n      planificar reintentos =\n        [time backoff ms 0 100 5000, time backoff ms 1 100 5000, time backoff ms 2 100 5000, time backoff ms 9 100 5000]\n```\n\n---\n\n## 5. Under huven: prestanda, RMM-minne och garantier\n\n- **Algoritmisk garanti och säkerhet**: $O(1)$-kalenderkonvertering utan år-för-år-loopar och strikt validering av dagar per månad (avvisar 29 februari under icke-skottår).\n- **Deterministiskt minne (`RMM1`/`RMM2`)**: Noll skräpsamlarpauser; alla temporära strukturer frigörs deterministiskt när räckvidden lämnas.\n- **Kontinuerlig verifiering**: Statiskt kontrollerad med `stable check` och verifierad av den automatiserade testsviten `src/test/ridgun/test_time.rg`.\n"}, {"num": "19", "slug": "19-lib-uuid-identifierare-crc32-och-prng", "file": "19-lib-uuid-identifierare-crc32-och-prng.md", "title": "Kapitel 19: Lib:en `uuid` — RFC 9562 `UUIDv4`/`UUIDv7`, Kontrollsummor (`CRC-32`) och PRNG", "short_title": "Lib:en `uuid` — RFC 9562 `UUIDv4`/`UUIDv7`, Kontrollsummor (`CRC-32`) och PRNG", "markdown": "# Kapitel 19: Lib:en `uuid` — RFC 9562 `UUIDv4`/`UUIDv7`, Kontrollsummor (`CRC-32`) och PRNG\n\n## 1. Varför finns lib:en `uuid`?\n\nLåt oss vara ärliga: att använda helt slumpmässiga `UUIDv4` som primärnycklar i en databas fragmenterar B-Tree-index, medan hemmasnickrade ID:n utan kärnentropi leder till kollisioner.\n\nLib:en **`uuid`** implementerar **RFC 9562 `UUIDv4`** (kärn-CSPRNG) och tidsordnade **`UUIDv7`** (48-bitars millisekundprefix för B-Tree-lokalitet), snabba kontrollsummor (**FNV-1a**, **Adler-32**, **IEEE 802.3 CRC-32**) samt en deterministisk PRNG.\n\n---\n\n## 2. Paket, import och arkitektur helt utan `libc`\n\nI `ridgun-libs` är **`uuid`** en förstklassig **lib** placerad i `src/main/ridgun/lib/uuid.rg` (domän `UUID`). När du bygger med `stable bundle` paketeras den i tre inbyggda format:\n\n| Artefakt | Sökväg | Syfte |\n|---|---|---|\n| **Ridgun-bundle** | `target/bundles/uuid.rglib` | Portabel distribution och direkt import med `import uuid` |\n| **Kompilerat arkiv** | `target/uuid.rgc` | Typkontrollerad mellanartefakt verifierad av `ridgunc` |\n| **Delat ELF64-objekt** | `target/libuuid.so` | Inbyggt dynamiskt bibliotek helt utan C- eller `libc`-beroenden |\n\n> För att använda denna lib i valfri `.rg`-fil deklarerar du bara `import uuid` överst och anropar funktionerna med mellanslag eller understreck.\n\n---\n\n## 3. Snabbreferens för `uuid`-API:et\n\n| Signatur / Funktion / Typ | Vad den gör och när den används |\n|---|---|\n| `uuid v4 / uuid v7 / uuid v7 at` | Genererar kanoniska 36-teckens UUID enligt RFC 9562 v4 (slump) och v7 (tidsordnad) |\n| `uuid is valid / uuid version` | Validerar 8-4-4-4-12-formatet och RFC 9562-variantbitar (`8, 9, a, b`) |\n| `fnv1a 32 / adler32 / crc32 / crc32 hex` | Snabba 32-bitars icke-kryptografiska hashar och kontrollsummor |\n| `prng next / prng range` | Ren funktionell linjär kongruens-PRNG för reproducerbara tester och simuleringar |\n\n---\n\n## 4. Praktiska recept i tabellform\n\n### Recept 1: Huvudflöde med `uuid`\n\nLägg märke till hur `=`-tecknen och transformationsstegen linjeras som en ren tabell:\n\n```ridgun\nimport uuid\n\nfn :: generar ids ordenados () => (String, String, Bool)\n      generar ids ordenados =\n        id1 = uuid v7 at 1000\n        id2 = uuid v7 at 2000\n        ok  = (uuid is valid id1) and (id1 < id2)\n        (id1, id2, ok)\n```\n\n### Recept 2: Säker komposition utan sidoeffekter\n\nVarje funktion i lib:en `uuid` kan kombineras fritt med övriga 32 libs i `ridgun-libs`:\n\n```ridgun\nimport uuid\n\nfn :: firmar paquete (payload : String) => (String, Int)\n      firmar paquete payload =\n         (crc32 hex payload, fnv1a 32 payload)\n```\n\n---\n\n## 5. Under huven: prestanda, RMM-minne och garantier\n\n- **Algoritmisk garanti och säkerhet**: `uuid v7 at t1 < uuid v7 at t2` garanterar monotont stigande lexikografisk ordning över tid, perfekt för `btree`-index och databaser.\n- **Deterministiskt minne (`RMM1`/`RMM2`)**: Noll skräpsamlarpauser; alla temporära strukturer frigörs deterministiskt när räckvidden lämnas.\n- **Kontinuerlig verifiering**: Statiskt kontrollerad med `stable check` och verifierad av den automatiserade testsviten `src/test/ridgun/test_uuid.rg`.\n"}, {"num": "20", "slug": "20-lib-log-strukturerad-ndjson-och-maskering", "file": "20-lib-log-strukturerad-ndjson-och-maskering.md", "title": "Kapitel 20: Lib:en `log` — Strukturerad NDJSON-loggning och Automatisk Sekretessmaskering", "short_title": "Lib:en `log` — Strukturerad NDJSON-loggning och Automatisk Sekretessmaskering", "markdown": "# Kapitel 20: Lib:en `log` — Strukturerad NDJSON-loggning och Automatisk Sekretessmaskering\n\n## 1. Varför finns lib:en `log
