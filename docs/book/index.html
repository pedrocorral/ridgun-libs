  <script>
    const CHAPTERS = [{"num": "00", "slug": "00-por-que-necesito-ridgun-libs", "file": "00-por-que-necesito-ridgun-libs.md", "title": "Capítulo 00: ¿Por qué necesito `ridgun-libs`? ¿32 libs sin una línea de C? ¡Cuéntame más!", "short_title": "¿Por qué necesito `ridgun-libs`? ¿32 libs sin una línea de C? ¡Cuéntame más!", "markdown": "# Capítulo 00: ¿Por qué necesito `ridgun-libs`? ¿32 libs sin una línea de C? ¡Cuéntame más!\n\nSeamos sinceros: cuando descubres que un lenguaje compila a un binario ELF nativo minúsculo y sin recolector de basura, la segunda pregunta que te haces —con toda la razón del mundo— es:\n\n> *\"Vale, el lenguaje mola mucho... pero cuando tenga que abrir un socket TCP, calcular un hash Argon2id, parsear un JSON, resolver un sistema lineal con tensores o montar un pool de actores, ¿voy a tener que enlazar `libc`, `OpenSSL`, `libcurl` y `pcre2`, o descargarme 800 paquetes de terceros mantenidos por un desconocido?\"*\n\nEs una pregunta excelente. Y la respuesta corta es: **no**. Para eso existe **`ridgun-libs`**: una suite de **32 libs fundamentales** escritas al **100 % en Ridgun puro (`v0.9.16`)**, con **cero dependencias en C** y **cero `libc`**.\n\nPongámosle nombre a los cuatro dolores diarios que `ridgun-libs` elimina de raíz.\n\n---\n\n## Dolor n.º 1: \"El infierno de `libc`, OpenSSL y el enlazado cruzado\"\n\nSeguro que has vivido esta pesadilla:\n\n1. Escribes un servidor o una herramienta CLI supuestamente \"estática\" o \"portable\".\n2. En cuanto necesitas criptografía (`SHA-256`, `Argon2id`, `ChaCha20-Poly1305`), red (`DNS`, `HTTP`, `WebSockets`) o expresiones regulares, tu programa acaba dependiendo de `glibc 2.38`, `libssl.so.3` y tres cabeceras de C.\n3. Intentas copiar el binario a un contenedor mínimo o a otra distribución Linux y explota al arrancar con el infame `version 'GLIBC_2.38' not found`.\n\n**¿Qué cambia con `ridgun-libs`?**\nCada una de las 32 libs de este repositorio está escrita íntegramente en Ridgun tabular y habla directamente con el núcleo del sistema operativo mediante la capa PAL (`posix`) o ejecuta algoritmos puros en memoria determinista (`RMM1`/`RMM2`). Se compilan tanto a paquetes portables (`.rglib` / `.rgc`) como a objetos compartidos ELF64 nativos (`lib*.so`). Sin `libc`, sin FFI frágil y sin sorpresas al desplegar.\n\n---\n\n## Dolor n.º 2: \"El síndrome del `node_modules` / `Cargo.lock` de 400 dependencias\"\n\nEn muchos ecosistemas modernos, la biblioteca estándar es tan esquelética que para leer un archivo `.ini`, validar un `UUIDv7`, aplicar un parche Unified Diff o renderizar una plantilla HTML segura necesitas instalar media docena de paquetes externos. Cada paquete trae sus propias convenciones, sus propios tipos de error y su propio riesgo de cadena de suministro.\n\nEn **`ridgun-libs`**, las **32 libs** siguen una única filosofía de diseño:\n\n```ridgun\nimport crypto\nimport json\nimport http\n\nfn :: autenticar y pedir (token : String) => String\n      autenticar y pedir token =\n        -- Todas las libs comparten tipos puros, alineación tabular y semántica determinista\n        mac_hex = sha256 hex token\n        cuerpo  = json stringify (JnObj [(\"token_sha256\", JnStr mac_hex)])\n        pet     = http build request \"POST\" \"/v1/sesion\" [(\"Content-Type\", \"application/json\")] cuerpo\n        pet\n```\n\nMisma estética tabular, mismos ADTs inmutables (`Option`, `Result`, `IoResult`, `JsonVal`), cero efectos laterales ocultos.\n\n---\n\n## Dolor n.º 3: \"Expresiones regulares que cuelgan la CPU (ReDoS) y sockets que bloquean para siempre\"\n\nDos bombas de relojería clásicas en producción:\n\n- Un usuario malicioso envía una cadena diseñada para que tu motor de expresiones regulares con *backtracking* entre en tiempo exponencial $O(2^N)$ y deje frito un núcleo al 100 %.\n- Un descriptor de red se queda medio abierto y tu hilo se queda bloqueado eternamente esperando un `read()` sin fecha límite.\n\nEn **`ridgun-libs`**:\n- La lib **`regex`** (Capítulo 11) implementa un autómata **NFA de Thompson** que garantiza tiempo lineal estricto **$O(N \\cdot M)$**: inmune por construcción a ataques ReDoS.\n- Las libs **`posix`**, **`io`** y **`socket`** (Capítulos 22, 23 y 27) integran cuotas léxicas `with timeout` y `ppoll` a nivel de descriptor: ninguna operación de entrada/salida puede colgar tu servicio.\n\n---\n\n## Dolor n.º 4: \"Criptografía y álgebra lineal que parecen jeroglíficos\"\n\nEn **`ridgun-libs`**, la potencia de los tipos `Tensor[...]` de Ridgun permite que libs como **`tensor`** (Capítulo 05), **`linalg`** (Capítulo 06) y **`argon2id`** (Capítulo 25) operen sobre bloques de memoria contigua (`Tensor[U64 * 8 * 16]`, `Tensor[Real]`) manteniendo la legibilidad de una tabla matemática.\n\n---\n\n## Mapa completo del libro: 32 capítulos para 32 libs\n\nCada capítulo de este libro está dedicado a **una lib** de `ridgun-libs`, agrupadas en una progresión lógica de abajo arriba:\n\n| Capítulos | Familia de libs | Libs incluidas |\n|---|---|---|\n| **01 – 04** | Texto, Matemáticas y Estructuras de Datos | `str`, `math`, `list`, `btree` |\n| **05 – 06** | Tensores y Álgebra Lineal | `tensor`, `linalg` |\n| **07 – 10** | Codificación y Formatos de Datos | `codec`, `json`, `csv`, `ini` |\n| **11 – 15** | Motores de Texto, Diffs, Plantillas y Formateo | `regex`, `glob`, `diff`, `template`, `fmt` |\n| **16 – 21** | CLI, Rutas, Tiempo, UUIDs, Logs y Testing | `cli`, `path`, `time`, `uuid`, `log`, `test` |\n| **22 – 23** | Sistemas POSIX y E/S con Timeout | `posix`, `io` |\n| **24 – 26** | Criptografía, Argon2id y Tokens JWT | `crypto`, `argon2id`, `jwt` |\n| **27 – 29** | Redes, Sockets del Kernel, HTTP/1.1 y WebSockets | `socket`, `http`, `ws` |\n| **30 – 32** | Concurrencia de Actores, Pools y Supervisión de Red | `agent`, `pool`, `net_agent` |\n\n¡Venga, al turrón! Pasa al **Capítulo 01 (`str`)** y empecemos a construir.\n"}, {"num": "01", "slug": "01-lib-str-manipulacion-de-texto", "file": "01-lib-str-manipulacion-de-texto.md", "title": "Capítulo 01: La lib `str` — Manipulación de Texto, Búsqueda y Formato Tabular", "short_title": "La lib `str` — Manipulación de Texto, Búsqueda y Formato Tabular", "markdown": "# Capítulo 01: La lib `str` — Manipulación de Texto, Búsqueda y Formato Tabular\n\n## 1. ¿Por qué existe la lib `str`?\n\nSeamos sinceros: en C manipular cadenas con `strtok` y `strncpy` es caminar por un campo de minas de desbordamientos de búfer y punteros `NULL`, y en otros lenguajes acabas importando tres paquetes solo para alinear columnas o repetir un separador en $O(\\log N)$.\n\nLa lib **`str`** proporciona todas las primitivas puras e inmutables para buscar, recortar, dividir, unir, cambiar mayúsculas/minúsculas, repetir por duplicación binaria $O(\\log N)$ y rellenar cadenas.\n\n---\n\n## 2. Artefactos, importación y arquitectura sin `libc`\n\nEn `ridgun-libs`, **`str`** es una **lib** de primera clase ubicada en `src/main/ridgun/lib/str.rg` (dominio `STR`). Al compilar con `stable bundle`, se empaqueta en tres formatos nativos:\n\n| Artefacto | Ruta | Propósito |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/str.rglib` | Distribución e importación directa con `import str` |\n| **Archivo compilado** | `target/str.rgc` | Artefacto intermedio verificado por `ridgunc` |\n| **Objeto compartido ELF64** | `target/libstr.so` | Biblioteca dinámica nativa sin dependencias de C ni `libc` |\n\n> Para usar esta lib en cualquier archivo `.rg`, basta con declarar `import str` en el encabezado y llamar a sus funciones con espacios o guiones bajos indistintamente.\n\n---\n\n## 3. Referencia rápida de la API de `str`\n\n| Firma / Función / Tipo | Qué hace y cuándo usarla |\n|---|---|\n| `str index of : String -> String -> Int` | Primer índice de la subcadena (`-1` si no existe / `0` si es vacía) |\n| `str contains / str starts with / str ends with` | Predicados `Bool` de subcadena, prefijo y sufijo |\n| `str trim / str trim left / str trim right` | Elimina espacios en blanco ASCII (` `, `\\t`, `\\n`, `\\r`) |\n| `str split / str lines / str words / str join` | Divide en `[String]` y une listas con un separador |\n| `str replace / str to upper / str to lower` | Reemplazo sin solapamiento y conversión ASCII de mayúsculas/minúsculas |\n| `str repeat / str pad left / str pad right` | Repetición en $O(\\log N)$ y relleno de columnas a ancho fijo |\n\n---\n\n## 4. Recetas prácticas en estilo tabular\n\n### Receta 1: Flujo principal con `str`\n\nObserva cómo los signos `=` y los pasos de transformación quedan alineados como una tabla limpia:\n\n```ridgun\nimport str\n\nfn :: normalizar cabecera (raw : String) => String\n      normalizar cabecera raw =\n        limpia = str to lower (str trim raw)\n        partes = str words limpia\n        slug   = str join partes \"-\"\n        str pad right slug 24 \".\"\n```\n\n### Receta 2: Composición segura y sin efectos laterales\n\nToda función de la lib `str` es componible con el resto de las 32 libs de `ridgun-libs`:\n\n```ridgun\nimport str\n\nfn :: extraer dominio (correo : String) => String\n      extraer dominio correo =\n        pos = str index of correo \"@\"\n        | pos < 0   = \"sin-dominio\"\n        | otherwise =\n          partes = str split correo \"@\"\n          str replace (str to lower correo) \"@\" \" en \"\n```\n\n---\n\n## 5. Bajo el capó: rendimiento, memoria RMM y garantías\n\n- **Garantía algorítmica y de seguridad**: Repetición en $O(\\log N)$ mediante duplicación de cadenas, predicados seguros ante agujas vacías y cero mutación en el lugar.\n- **Memoria determinista (`RMM1`/`RMM2`)**: Cero pausas de recolector de basura; todas las estructuras intermedias se liberan de forma determinista al salir del ámbito.\n- **Verificación continua**: Probada exhaustivamente con `stable check` y la suite automatizada `src/test/ridgun/test_str.rg`.\n"}, {"num": "02", "slug": "02-lib-math-aritmetica-y-teoria-de-numeros", "file": "02-lib-math-aritmetica-y-teoria-de-numeros.md", "title": "Capítulo 02: La lib `math` — Aritmética Segura, Teoría de Números y Estadística", "short_title": "La lib `math` — Aritmética Segura, Teoría de Números y Estadística", "markdown": "# Capítulo 02: La lib `math` — Aritmética Segura, Teoría de Números y Estadística\n\n## 1. ¿Por qué existe la lib `math`?\n\nSeamos sinceros: una división por cero inesperada en producción o el operador `%` devolviendo restos negativos en C o Java han tumbado más servicios de los que nos gusta admitir.\n\nLa lib **`math`** ofrece divisiones totales a prueba de `d == 0` (`div ceil`, `div floor`, `div euclid`, `mod euclid`), exponenciación e inverso modular en $O(\\log E)$, raíces y logaritmos enteros exactos, combinatoria, primalidad y el operador mixfix `clamp x between lo and hi`.\n\n---\n\n## 2. Artefactos, importación y arquitectura sin `libc`\n\nEn `ridgun-libs`, **`math`** es una **lib** de primera clase ubicada en `src/main/ridgun/lib/math.rg` (dominio `MATH`). Al compilar con `stable bundle`, se empaqueta en tres formatos nativos:\n\n| Artefacto | Ruta | Propósito |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/math.rglib` | Distribución e importación directa con `import math` |\n| **Archivo compilado** | `target/math.rgc` | Artefacto intermedio verificado por `ridgunc` |\n| **Objeto compartido ELF64** | `target/libmath.so` | Biblioteca dinámica nativa sin dependencias de C ni `libc` |\n\n> Para usar esta lib en cualquier archivo `.rg`, basta con declarar `import math` en el encabezado y llamar a sus funciones con espacios o guiones bajos indistintamente.\n\n---\n\n## 3. Referencia rápida de la API de `math`\n\n| Firma / Función / Tipo | Qué hace y cuándo usarla |\n|---|---|\n| `math abs / math sign / math min / math max` | Magnitud absoluta, signo (`-1, 0, 1`) y extremos |\n| `clamp x between lo and hi` | Operador mixfix (`op ::`) que acota `x` al rango `[lo, hi]` |\n| `math div ceil / math div floor / math div euclid / math mod euclid` | Redondeo seguro ante división por cero y resto euclídeo no negativo |\n| `math pow / math isqrt / math ilog2 / math ilog10` | Potencia en $O(\\log E)$, raíz cuadrada entera de Newton y logaritmos enteros |\n| `math gcd / math lcm / math mod pow / math mod inv / math is prime` | MCD/MCM de Euclides, aritmética modular y test de primalidad $6k \\pm 1$ |\n| `math sum / math mean floor / math median floor / math variance floor` | Combinatoria (`nCr`) sin desbordamiento y estadística entera sobre listas |\n\n---\n\n## 4. Recetas prácticas en estilo tabular\n\n### Receta 1: Flujo principal con `math`\n\nObserva cómo los signos `=` y los pasos de transformación quedan alineados como una tabla limpia:\n\n```ridgun\nimport math\n\nfn :: verificar clave modular (base : Int) (primo : Int) => (Int, Int, Bool)\n      verificar clave modular base primo =\n        es_p = math is prime primo\n        pot  = math mod pow base (primo - 1) primo\n        inv  = math mod inv base primo\n        (pot, inv, es_p)\n```\n\n### Receta 2: Composición segura y sin efectos laterales\n\nToda función de la lib `math` es componible con el resto de las 32 libs de `ridgun-libs`:\n\n```ridgun\nimport math\n\nfn :: calcular paginas y cuota (items : Int) (por_pag : Int) (uso : Int) => (Int, Int)\n      calcular paginas y cuota items por_pag uso =\n        pags  = math div ceil items por_pag\n        cuota = clamp uso between 0 and 100\n        (pags, cuota)\n```\n\n---\n\n## 5. Bajo el capó: rendimiento, memoria RMM y garantías\n\n- **Garantía algorítmica y de seguridad**: Funciones totales (devuelven `0` cuando el divisor o módulo es `<= 0` en lugar de abortar con `SIGFPE`), sin coma flotante imprecisa.\n- **Memoria determinista (`RMM1`/`RMM2`)**: Cero pausas de recolector de basura; todas las estructuras intermedias se liberan de forma determinista al salir del ámbito.\n- **Verificación continua**: Probada exhaustivamente con `stable check` y la suite automatizada `src/test/ridgun/test_math.rg`.\n"}, {"num": "03", "slug": "03-lib-list-listas-mergesort-y-mapas-kv", "file": "03-lib-list-listas-mergesort-y-mapas-kv.md", "title": "Capítulo 03: La lib `list` — Listas, Mergesort $O(N \\log N)$ y Mapas Clave-Valor", "short_title": "La lib `list` — Listas, Mergesort $O(N \\log N)$ y Mapas Clave-Valor", "markdown": "# Capítulo 03: La lib `list` — Listas, Mergesort $O(N \\log N)$ y Mapas Clave-Valor\n\n## 1. ¿Por qué existe la lib `list`?\n\nSeamos sinceros: acceder a un índice fuera de rango (`IndexError` / `panic!`) o mutar una lista compartida por accidente son dos de los errores más frecuentes al procesar colecciones.\n\nLa lib **`list`** proporciona indexación con valor por defecto, rebanado (`take`, `drop`, `slice`), rangos con paso, deduplicación estable, ordenación **mergesort $O(N \\log N)$** para `[Int]` y `[String]`, y diccionarios asociativos inmutables `[String String]` (`kv get`, `kv put`, `kv merge`).\n\n---\n\n## 2. Artefactos, importación y arquitectura sin `libc`\n\nEn `ridgun-libs`, **`list`** es una **lib** de primera clase ubicada en `src/main/ridgun/lib/list.rg` (dominio `LIST`). Al compilar con `stable bundle`, se empaqueta en tres formatos nativos:\n\n| Artefacto | Ruta | Propósito |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/list.rglib` | Distribución e importación directa con `import list` |\n| **Archivo compilado** | `target/list.rgc` | Artefacto intermedio verificado por `ridgunc` |\n| **Objeto compartido ELF64** | `target/liblist.so` | Biblioteca dinámica nativa sin dependencias de C ni `libc` |\n\n> Para usar esta lib en cualquier archivo `.rg`, basta con declarar `import list` en el encabezado y llamar a sus funciones con espacios o guiones bajos indistintamente.\n\n---\n\n## 3. Referencia rápida de la API de `list`\n\n| Firma / Función / Tipo | Qué hace y cuándo usarla |\n|---|---|\n| `list nth or / list str nth or` | Lectura segura por índice devolviendo `default_val` si está fuera de rango |\n| `list take / list drop / list slice / list reverse` | Prefijo, sufijo, subrango `[start, end)` e inversión recursiva de cola |\n| `list range / list range step` | Genera secuencias aritméticas (`step == 0` devuelve `[]` de forma segura) |\n| `list sort / list str sort / list dedup / list str dedup` | Ordenación mergesort $O(N \\log N)$ estable y deduplicación por primera aparición |\n| `kv empty / kv put / kv get / kv get or / kv remove / kv merge` | Operaciones sobre diccionarios asociativos ordenados `[String String]` |\n\n---\n\n## 4. Recetas prácticas en estilo tabular\n\n### Receta 1: Flujo principal con `list`\n\nObserva cómo los signos `=` y los pasos de transformación quedan alineados como una tabla limpia:\n\n```ridgun\nimport list\n\nfn :: top tres unicos (puntos : [Int]) => [Int]\n      top tres unicos puntos =\n        unicos    = list dedup puntos\n        ordenados = list reverse (list sort unicos)\n        list take ordenados 3\n```\n\n### Receta 2: Composición segura y sin efectos laterales\n\nToda función de la lib `list` es componible con el resto de las 32 libs de `ridgun-libs`:\n\n```ridgun\nimport list\n\nfn :: configurar entorno (base : [String String]) => (String, [String])\n      configurar entorno base =\n        cfg1 = kv put base \"host\" \"0.0.0.0\"\n        cfg2 = kv put cfg1 \"port\" \"8080\"\n        host = kv get or cfg2 \"host\" \"127.0.0.1\"\n        (host, kv keys cfg2)\n```\n\n---\n\n## 5. Bajo el capó: rendimiento, memoria RMM y garantías\n\n- **Garantía algorítmica y de seguridad**: Ordenación determinista $O(N \\log N)$ en el peor caso (sin el $O(N^2)$ patológico de Quicksort) y preservación del orden de inserción en mapas `kv`.\n- **Memoria determinista (`RMM1`/`RMM2`)**: Cero pausas de recolector de basura; todas las estructuras intermedias se liberan de forma determinista al salir del ámbito.\n- **Verificación continua**: Probada exhaustivamente con `stable check` y la suite automatizada `src/test/ridgun/test_list.rg`.\n"}, {"num": "04", "slug": "04-lib-btree-arboles-avl-conjuntos-y-monticulos", "file": "04-lib-btree-arboles-avl-conjuntos-y-monticulos.md", "title": "Capítulo 04: La lib `btree` — Árboles AVL Persistentes $O(\\log N)$, Conjuntos y Montículos", "short_title": "La lib `btree` — Árboles AVL Persistentes $O(\\log N)$, Conjuntos y Montículos", "markdown": "# Capítulo 04: La lib `btree` — Árboles AVL Persistentes $O(\\log N)$, Conjuntos y Montículos\n\n## 1. ¿Por qué existe la lib `btree`?\n\nSeamos sinceros: las tablas hash mutables sufren ataques de colisión de claves (HashDoS), no mantienen las claves ordenadas para consultas por rango y no pueden compartirse entre actores sin copiarlas enteras o meter un candado.\n\nLa lib **`btree`** implementa tres estructuras de datos funcionales persistentes en $O(\\log N)$ con compartición estructural: **`BTreeMap`** (árbol AVL auto-balanceado), **`BTreeSet`** (álgebra de conjuntos ordenada) y **`MinHeap`** (cola de prioridad *leftist heap*).\n\n---\n\n## 2. Artefactos, importación y arquitectura sin `libc`\n\nEn `ridgun-libs`, **`btree`** es una **lib** de primera clase ubicada en `src/main/ridgun/lib/btree.rg` (dominio `BTREE`). Al compilar con `stable bundle`, se empaqueta en tres formatos nativos:\n\n| Artefacto | Ruta | Propósito |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/btree.rglib` | Distribución e importación directa con `import btree` |\n| **Archivo compilado** | `target/btree.rgc` | Artefacto intermedio verificado por `ridgunc` |\n| **Objeto compartido ELF64** | `target/libbtree.so` | Biblioteca dinámica nativa sin dependencias de C ni `libc` |\n\n> Para usar esta lib en cualquier archivo `.rg`, basta con declarar `import btree` en el encabezado y llamar a sus funciones con espacios o guiones bajos indistintamente.\n\n---\n\n## 3. Referencia rápida de la API de `btree`\n\n| Firma / Función / Tipo | Qué hace y cuándo usarla |\n|---|---|\n| `btree empty / btree insert / btree get / btree remove` | Búsqueda, inserción y borrado persistente en diccionario AVL en $O(\\log N)$ |\n| `btree min key / btree max key / btree range` | Extremos ordenados y consulta por rango `[lo, hi]` |\n| `bset from list / bset union / bset intersect / bset diff` | Álgebra de conjuntos ordenados (`BTreeSet`) y predicado de subconjunto |\n| `heap empty / heap push / heap peek / heap pop / heap sort` | Cola de prioridad `MinHeap` (*leftist heap*) con fusión en $O(\\log N)$ |\n\n---\n\n## 4. Recetas prácticas en estilo tabular\n\n### Receta 1: Flujo principal con `btree`\n\nObserva cómo los signos `=` y los pasos de transformación quedan alineados como una tabla limpia:\n\n```ridgun\nimport btree\n\nfn :: consultar rango precios () => [String String]\n      consultar rango precios =\n        t0 = btree empty\n        t1 = btree insert t0 \"item:10\" \"Teclado\"\n        t2 = btree insert t1 \"item:20\" \"Monitor\"\n        t3 = btree insert t2 \"item:30\" \"Raton\"\n        btree range t3 \"item:10\" \"item:25\"\n```\n\n### Receta 2: Composición segura y sin efectos laterales\n\nToda función de la lib `btree` es componible con el resto de las 32 libs de `ridgun-libs`:\n\n```ridgun\nimport btree\n\nfn :: despachar urgente () => (Int, String)\n      despachar urgente =\n        h0 = heap empty\n        h1 = heap push h0 50 \"backup-nocturno\"\n        h2 = heap push h1 10 \"alerta-seguridad\"\n        h3 = heap push h2 30 \"rotar-logs\"\n        heap peek h3\n```\n\n---\n\n## 5. Bajo el capó: rendimiento, memoria RMM y garantías\n\n- **Garantía algorítmica y de seguridad**: Rotaciones AVL estrictas (`height diff <= 1`), inmunidad total a HashDoS, consultas por rango en $O(\\log N + K)$ y fusión de montículos en $O(\\log N)$.\n- **Memoria determinista (`RMM1`/`RMM2`)**: Cero pausas de recolector de basura; todas las estructuras intermedias se liberan de forma determinista al salir del ámbito.\n- **Verificación continua**: Probada exhaustivamente con `stable check` y la suite automatizada `src/test/ridgun/test_btree.rg`.\n"}, {"num": "05", "slug": "05-lib-tensor-tensores-multidimensionales", "file": "05-lib-tensor-tensores-multidimensionales.md", "title": "Capítulo 05: La lib `tensor` — Tensores Multidimensionales, Vistas y Contracción de Einstein", "short_title": "La lib `tensor` — Tensores Multidimensionales, Vistas y Contracción de Einstein", "markdown": "# Capítulo 05: La lib `tensor` — Tensores Multidimensionales, Vistas y Contracción de Einstein\n\n## 1. ¿Por qué existe la lib `tensor`?\n\nSeamos sinceros: en la mayoría de lenguajes tienes que elegir entre listas anidadas lentísimas llenas de punteros dispersos o enlazar una mole de C++/Fortran de 200 MB como NumPy/BLAS.\n\nLa lib **`tensor`** envuelve la primitiva nativa `Tensor[...]` de Ridgun ofreciendo creación tipada (`Tensor[Int]`, `Tensor[Real]`, `Tensor[U64]`), vistas sin copia (`reshape`, `slice`), operaciones elemento a elemento (Hadamard), contracción de Einstein (`*` sobre ejes simbólicos) y aritmética `BlaMka` de 64 bits.\n\n---\n\n## 2. Artefactos, importación y arquitectura sin `libc`\n\nEn `ridgun-libs`, **`tensor`** es una **lib** de primera clase ubicada en `src/main/ridgun/lib/tensor.rg` (dominio `TENSOR`). Al compilar con `stable bundle`, se empaqueta en tres formatos nativos:\n\n| Artefacto | Ruta | Propósito |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/tensor.rglib` | Distribución e importación directa con `import tensor` |\n| **Archivo compilado** | `target/tensor.rgc` | Artefacto intermedio verificado por `ridgunc` |\n| **Objeto compartido ELF64** | `target/libtensor.so` | Biblioteca dinámica nativa sin dependencias de C ni `libc` |\n\n> Para usar esta lib en cualquier archivo `.rg`, basta con declarar `import tensor` en el encabezado y llamar a sus funciones con espacios o guiones bajos indistintamente.\n\n---\n\n## 3. Referencia rápida de la API de `tensor`\n\n| Firma / Función / Tipo | Qué hace y cuándo usarla |\n|---|---|\n| `tensor zeros int / tensor fill int / tensor zeros real` | Reserva bloques contiguos 1D/2D de `Tensor[Int]` y `Tensor[Real]` |\n| `tensor get 1d / tensor set 1d / tensor get 2d / tensor set 2d` | Acceso y actualización funcional Copy-on-Write (`with [i] = v`) |\n| `tensor reshape 1d to 2d / tensor slice 1d` | Vistas de descriptor en $O(1)$ sin copiar el almacenamiento del tensor |\n| `tensor add int / tensor mul int / tensor scale int` | Suma, multiplicación elemento a elemento (Hadamard) y escalado |\n| `tensor dot int / tensor matmul int` | Contracción de índices de Einstein (`a[i] * b[i]`, `a[i, k] * b[k, j]`) |\n| `u64 blamka g / u64 rotr` | Mezcla rotacional `U64` sin signo de 64 bits para bloques criptográficos |\n\n---\n\n## 4. Recetas prácticas en estilo tabular\n\n### Receta 1: Flujo principal con `tensor`\n\nObserva cómo los signos `=` y los pasos de transformación quedan alineados como una tabla limpia:\n\n```ridgun\nimport tensor\n\nfn :: producto matricial tensor () => Tensor[Int]\n      producto matricial tensor =\n        a = tensor reshape 1d to 2d (tensor from list int [1, 2, 3, 4]) 2 2\n        b = tensor reshape 1d to 2d (tensor from list int [5, 6, 7, 8]) 2 2\n        tensor matmul int a b\n```\n\n### Receta 2: Composición segura y sin efectos laterales\n\nToda función de la lib `tensor` es componible con el resto de las 32 libs de `ridgun-libs`:\n\n```ridgun\nimport tensor\n\nfn :: energia vector (xs : [Int]) => (Int, Int)\n      energia vector xs =\n        v   = tensor from list int xs\n        dot = tensor dot int v v\n        mx  = tensor max int v\n        (dot, mx)\n```\n\n---\n\n## 5. Bajo el capó: rendimiento, memoria RMM y garantías\n\n- **Garantía algorítmica y de seguridad**: Memoria contigua de 8 bytes por celda gestionada estáticamente por RMM1/RMM2, vistas en $O(1)$ sin duplicar el búfer y semántica pura Copy-on-Write.\n- **Memoria determinista (`RMM1`/`RMM2`)**: Cero pausas de recolector de basura; todas las estructuras intermedias se liberan de forma determinista al salir del ámbito.\n- **Verificación continua**: Probada exhaustivamente con `stable check` y la suite automatizada `src/test/ridgun/test_tensor.rg`.\n"}, {"num": "06", "slug": "06-lib-linalg-algebra-lineal-y-tensores", "file": "06-lib-linalg-algebra-lineal-y-tensores.md", "title": "Capítulo 06: La lib `linalg` — Álgebra Lineal sobre `Tensor[Real]`, Bareiss y Activaciones", "short_title": "La lib `linalg` — Álgebra Lineal sobre `Tensor[Real]`, Bareiss y Activaciones", "markdown": "# Capítulo 06: La lib `linalg` — Álgebra Lineal sobre `Tensor[Real]`, Bareiss y Activaciones\n\n## 1. ¿Por qué existe la lib `linalg`?\n\nSeamos sinceros: cuando quieres calcular similitud coseno para embeddings, resolver $A x = b$ o evaluar una capa `softmax` en un binario ligero, no quieres arrastrar 400 MB de PyTorch o LAPACK.\n\nLa lib **`linalg`** construye álgebra lineal numérica sobre `Tensor[Real]` nativo: transposición, traza, identidad, producto interno/externo, multiplicación matriz-vector y matriz-matriz con notación de Einstein, normas ($L_1, L_2, L_\\infty$, Frobenius), determinante y resolución lineal $A x = b$ mediante eliminación de **Bareiss/Gauss con pivoteo parcial**, y activaciones neuronales (`relu`, `sigmoid`, `softmax`).\n\n---\n\n## 2. Artefactos, importación y arquitectura sin `libc`\n\nEn `ridgun-libs`, **`linalg`** es una **lib** de primera clase ubicada en `src/main/ridgun/lib/linalg.rg` (dominio `LINALG`). Al compilar con `stable bundle`, se empaqueta en tres formatos nativos:\n\n| Artefacto | Ruta | Propósito |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/linalg.rglib` | Distribución e importación directa con `import linalg` |\n| **Archivo compilado** | `target/linalg.rgc` | Artefacto intermedio verificado por `ridgunc` |\n| **Objeto compartido ELF64** | `target/liblinalg.so` | Biblioteca dinámica nativa sin dependencias de C ni `libc` |\n\n> Para usar esta lib en cualquier archivo `.rg`, basta con declarar `import linalg` en el encabezado y llamar a sus funciones con espacios o guiones bajos indistintamente.\n\n---\n\n## 3. Referencia rápida de la API de `linalg`\n\n| Firma / Función / Tipo | Qué hace y cuándo usarla |\n|---|---|\n| `linalg vec from list / linalg mat from lists` | Construye `Tensor[Real]` 1D y 2D a partir de listas de Ridgun |\n| `linalg transpose / linalg trace / linalg diag / linalg identity` | Transformaciones estructurales de matrices y matriz identidad |\n| `linalg dot / linalg outer / linalg matvec / linalg matmul` | Einstein contraction (`a[i] * b[i]`, `a[i, k] * b[k, j]`) |\n| `linalg norm l1 / linalg norm l2 / linalg cosine similarity` | Normas vectoriales/matriciales, normalización y similitud coseno |\n| `linalg det / linalg solve` | Determinante exacto de Bareiss y resolución $A x = b$ con pivoteo parcial (`Option[Tensor[Real]]`) |\n| `linalg relu / linalg sigmoid / linalg softmax` | Activaciones neuronales numéricamente estables con desplazamiento por máximo |\n\n---\n\n## 4. Recetas prácticas en estilo tabular\n\n### Receta 1: Flujo principal con `linalg`\n\nObserva cómo los signos `=` y los pasos de transformación quedan alineados como una tabla limpia:\n\n```ridgun\nimport linalg\n\nfn :: resolver sistema lineal () => Option[Tensor[Real]]\n      resolver sistema lineal =\n        -- Resuelve 2x + y = 5, x + 3y = 10 -> x = 1.0, y = 3.0\n        a = linalg mat from lists [[2.0, 1.0], [1.0, 3.0]]\n        b = linalg vec from list [5.0, 10.0]\n        linalg solve a b\n```\n\n### Receta 2: Composición segura y sin efectos laterales\n\nToda función de la lib `linalg` es componible con el resto de las 32 libs de `ridgun-libs`:\n\n```ridgun\nimport linalg\n\nfn :: puntuar embeddings () => (Real, Tensor[Real])\n      puntuar embeddings =\n        q     = linalg vec from list [1.0, 2.0, 3.0]\n        d     = linalg vec from list [1.0, 2.0, 3.0]\n        sim   = linalg cosine similarity q d\n        probs = linalg softmax q\n        (sim, probs)\n```\n\n---\n\n## 5. Bajo el capó: rendimiento, memoria RMM y garantías\n\n- **Garantía algorítmica y de seguridad**: Las matrices singulares devuelven `None` limpiamente en `linalg solve` (sin `NaN` silenciosos), y `linalg softmax` resta el máximo antes de exponenciar para evitar desbordamientos.\n- **Memoria determinista (`RMM1`/`RMM2`)**: Cero pausas de recolector de basura; todas las estructuras intermedias se liberan de forma determinista al salir del ámbito.\n- **Verificación continua**: Probada exhaustivamente con `stable check` y la suite automatizada `src/test/ridgun/test_linalg.rg`.\n"}, {"num": "07", "slug": "07-lib-codec-hex-base64-y-url", "file": "07-lib-codec-hex-base64-y-url.md", "title": "Capítulo 07: La lib `codec` — Hex, Base64, Base64url, URL Percent-Encoding y JSON Ligero", "short_title": "La lib `codec` — Hex, Base64, Base64url, URL Percent-Encoding y JSON Ligero", "markdown": "# Capítulo 07: La lib `codec` — Hex, Base64, Base64url, URL Percent-Encoding y JSON Ligero\n\n## 1. ¿Por qué existe la lib `codec`?\n\nSeamos sinceros: nada rompe más rápido una integración web que confundir Base64 estándar (`+/=`) con Base64url (`-_` sin relleno) en un token JWT, o construir una query string concatenando cadenas sin escapar.\n\nLa lib **`codec`** implementa los estándares **RFC 4648** (Hex, Base64 y Base64url), **RFC 3986** (codificación porcentual de URLs y diccionarios `query encode` / `query decode`) y constructores/extractores rápidos de **JSON ligero (RFC 8259)**.\n\n---\n\n## 2. Artefactos, importación y arquitectura sin `libc`\n\nEn `ridgun-libs`, **`codec`** es una **lib** de primera clase ubicada en `src/main/ridgun/lib/codec.rg` (dominio `CODEC`). Al compilar con `stable bundle`, se empaqueta en tres formatos nativos:\n\n| Artefacto | Ruta | Propósito |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/codec.rglib` | Distribución e importación directa con `import codec` |\n| **Archivo compilado** | `target/codec.rgc` | Artefacto intermedio verificado por `ridgunc` |\n| **Objeto compartido ELF64** | `target/libcodec.so` | Biblioteca dinámica nativa sin dependencias de C ni `libc` |\n\n> Para usar esta lib en cualquier archivo `.rg`, basta con declarar `import codec` en el encabezado y llamar a sus funciones con espacios o guiones bajos indistintamente.\n\n---\n\n## 3. Referencia rápida de la API de `codec`\n\n| Firma / Función / Tipo | Qué hace y cuándo usarla |\n|---|---|\n| `hex encode / hex decode / hex is valid` | Codificación hexadecimal RFC 4648 en minúsculas y decodificación validada |\n| `base64 encode / base64 decode` | Base64 estándar RFC 4648 §4 con relleno `=` |\n| `base64url encode / base64url decode` | Base64url seguro para URLs RFC 4648 §5 (`-`, `_`, sin relleno) |\n| `url encode / url decode / query encode / query decode` | Codificación porcentual RFC 3986 y diccionarios de query string `k=v&...` |\n| `json quote / json object / json get str / json get int` | Serialización JSON rápida sin AST y extracción de claves de primer nivel |\n\n---\n\n## 4. Recetas prácticas en estilo tabular\n\n### Receta 1: Flujo principal con `codec`\n\nObserva cómo los signos `=` y los pasos de transformación quedan alineados como una tabla limpia:\n\n```ridgun\nimport codec\n\nfn :: empaquetar parametros (usuario : String) (redir : String) => String\n      empaquetar parametros usuario redir =\n        token_b64 = base64url encode usuario\n        query encode [(\"token\", token_b64), (\"next\", redir)]\n```\n\n### Receta 2: Composición segura y sin efectos laterales\n\nToda función de la lib `codec` es componible con el resto de las 32 libs de `ridgun-libs`:\n\n```ridgun\nimport codec\n\nfn :: construir respuesta rapida (id : Int) (nombre : String) => (String, Int)\n      construir respuesta rapida id nombre =\n        doc = json object [(\"id\", json int id), (\"name\", json quote nombre), (\"ok\", json bool True)]\n        leido = json get int doc \"id\" 0\n        (doc, leido)\n```\n\n---\n\n## 5. Bajo el capó: rendimiento, memoria RMM y garantías\n\n- **Garantía algorítmica y de seguridad**: Rechazo determinista de entradas hexadecimales o Base64 mal formadas (devolviendo `\"\"` sin lecturas fuera de límites) y reversibilidad exacta $decode(encode(x)) == x$.\n- **Memoria determinista (`RMM1`/`RMM2`)**: Cero pausas de recolector de basura; todas las estructuras intermedias se liberan de forma determinista al salir del ámbito.\n- **Verificación continua**: Probada exhaustivamente con `stable check` y la suite automatizada `src/test/ridgun/test_codec.rg`.\n"}, {"num": "08", "slug": "08-lib-json-parser-ast-y-consultas", "file": "08-lib-json-parser-ast-y-consultas.md", "title": "Capítulo 08: La lib `json` — Árbol AST Recursivo RFC 8259, Pretty-Printer y Consultas por Ruta", "short_title": "La lib `json` — Árbol AST Recursivo RFC 8259, Pretty-Printer y Consultas por Ruta", "markdown": "# Capítulo 08: La lib `json` — Árbol AST Recursivo RFC 8259, Pretty-Printer y Consultas por Ruta\n\n## 1. ¿Por qué existe la lib `json`?\n\nSeamos sinceros: navegar un JSON anidado en muchos lenguajes estáticos implica escribir tres pantallas de boilerplate o encadenar diez `.and_then()` antes de leer un simple puerto.\n\nLa lib **`json`** proporciona un analizador descendente recursivo completo para **RFC 8259** sobre el ADT algebraico `JsonVal` (`JnNull`, `JnBool`, `JnInt`, `JnStr`, `JnArr`, `JnObj`, `JnErr`), serialización compacta e indentada (`json pretty`) y consultas directas por ruta con puntos (`\"server.http.port\"`, `\"users.0.name\"`).\n\n---\n\n## 2. Artefactos, importación y arquitectura sin `libc`\n\nEn `ridgun-libs`, **`json`** es una **lib** de primera clase ubicada en `src/main/ridgun/lib/json.rg` (dominio `JSON`). Al compilar con `stable bundle`, se empaqueta en tres formatos nativos:\n\n| Artefacto | Ruta | Propósito |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/json.rglib` | Distribución e importación directa con `import json` |\n| **Archivo compilado** | `target/json.rgc` | Artefacto intermedio verificado por `ridgunc` |\n| **Objeto compartido ELF64** | `target/libjson.so` | Biblioteca dinámica nativa sin dependencias de C ni `libc` |\n\n> Para usar esta lib en cualquier archivo `.rg`, basta con declarar `import json` en el encabezado y llamar a sus funciones con espacios o guiones bajos indistintamente.\n\n---\n\n## 3. Referencia rápida de la API de `json`\n\n| Firma / Función / Tipo | Qué hace y cuándo usarla |\n|---|---|\n| `type JsonVal` | `JnNull | JnBool Bool | JnInt Int | JnStr String | JnArr [JsonVal] | JnObj [String JsonVal] | JnErr String` |\n| `json parse / json is ok` | Analiza texto JSON en un árbol `JsonVal` y valida la ausencia de `JnErr` |\n| `json stringify / json pretty` | Serializa `JsonVal` a JSON compacto o multilínea indentado |\n| `json get path / json get str / json get int / json get bool` | Recorre objetos y listas anidados mediante rutas con puntos (`\"a.b.0.c\"`) |\n\n---\n\n## 4. Recetas prácticas en estilo tabular\n\n### Receta 1: Flujo principal con `json`\n\nObserva cómo los signos `=` y los pasos de transformación quedan alineados como una tabla limpia:\n\n```ridgun\nimport json\n\nfn :: leer config servidor (raw : String) => (String, Int, Bool)\n      leer config servidor raw =\n        doc  = json parse raw\n        host = json get str doc \"server.host\" \"127.0.0.1\"\n        port = json get int doc \"server.port\" 8080\n        tls  = json get bool doc \"server.tls.enabled\" False\n        (host, port, tls)\n```\n\n### Receta 2: Composición segura y sin efectos laterales\n\nToda función de la lib `json` es componible con el resto de las 32 libs de `ridgun-libs`:\n\n```ridgun\nimport json\n\nfn :: construir manifiesto () => String\n      construir manifiesto =\n        nodo = JnObj [(\"app\", JnStr \"solstice\"), (\"workers\", JnInt 8), (\"tags\", JnArr [JnStr \"elf64\", JnStr \"rmm2\"])]\n        json pretty nodo 2\n```\n\n---\n\n## 5. Bajo el capó: rendimiento, memoria RMM y garantías\n\n- **Garantía algorítmica y de seguridad**: Rechazo estricto de basura sobrante tras el valor raíz (`trailing garbage`), manejo completo de escapes y retorno seguro de `JnErr` sin excepciones.\n- **Memoria determinista (`RMM1`/`RMM2`)**: Cero pausas de recolector de basura; todas las estructuras intermedias se liberan de forma determinista al salir del ámbito.\n- **Verificación continua**: Probada exhaustivamente con `stable check` y la suite automatizada `src/test/ridgun/test_json.rg`.\n"}, {"num": "09", "slug": "09-lib-csv-parser-rfc4180-y-tablas", "file": "09-lib-csv-parser-rfc4180-y-tablas.md", "title": "Capítulo 09: La lib `csv` — Analizador de Estados RFC 4180 para CSV/TSV y Tablas Indexadas", "short_title": "La lib `csv` — Analizador de Estados RFC 4180 para CSV/TSV y Tablas Indexadas", "markdown": "# Capítulo 09: La lib `csv` — Analizador de Estados RFC 4180 para CSV/TSV y Tablas Indexadas\n\n## 1. ¿Por qué existe la lib `csv`?\n\nSeamos sinceros: todo el mundo cree que parsear un CSV es hacer `str split linea \",\"`... hasta que aparece un campo entre comillas con una coma dentro, comillas escapadas `\"\"` o un salto de línea `\\r\\n` en mitad de una celda.\n\nLa lib **`csv`** implementa una máquina de estados completa conforme a **RFC 4180** para CSV y TSV, serialización automática con entrecomillado inteligente y el tipo `CsvTable` para consultar columnas y filas por nombre de cabecera.\n\n---\n\n## 2. Artefactos, importación y arquitectura sin `libc`\n\nEn `ridgun-libs`, **`csv`** es una **lib** de primera clase ubicada en `src/main/ridgun/lib/csv.rg` (dominio `CSV`). Al compilar con `stable bundle`, se empaqueta en tres formatos nativos:\n\n| Artefacto | Ruta | Propósito |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/csv.rglib` | Distribución e importación directa con `import csv` |\n| **Archivo compilado** | `target/csv.rgc` | Artefacto intermedio verificado por `ridgunc` |\n| **Objeto compartido ELF64** | `target/libcsv.so` | Biblioteca dinámica nativa sin dependencias de C ni `libc` |\n\n> Para usar esta lib en cualquier archivo `.rg`, basta con declarar `import csv` en el encabezado y llamar a sus funciones con espacios o guiones bajos indistintamente.\n\n---\n\n## 3. Referencia rápida de la API de `csv`\n\n| Firma / Función / Tipo | Qué hace y cuándo usarla |\n|---|---|\n| `csv parse / tsv parse / csv parse with` | Analiza texto CSV/TSV (incluyendo celdas multilínea y escapes `\"\"`) en `[[String]]` |\n| `csv stringify / tsv stringify` | Serializa `[[String]]` entrecomillando solo celdas con delimitadores, comillas o saltos |\n| `csv parse table / csv get cell / csv col` | Consulta sobre `CsvTable` indexada por cabecera `(fila, nombre_col)` o columna completa |\n| `csv row to kv / csv table to kv list` | Convierte filas tabulares en diccionarios `[String String]` indexados por cabecera |\n\n---\n\n## 4. Recetas prácticas en estilo tabular\n\n### Receta 1: Flujo principal con `csv`\n\nObserva cómo los signos `=` y los pasos de transformación quedan alineados como una tabla limpia:\n\n```ridgun\nimport csv\n\nfn :: extraer columna precios (raw_csv : String) => ([String], String)\n      extraer columna precios raw_csv =\n        tabla   = csv parse table raw_csv\n        precios = csv col tabla \"precio\"\n        primero = csv get cell tabla 0 \"producto\" \"desconocido\"\n        (precios, primero)\n```\n\n### Receta 2: Composición segura y sin efectos laterales\n\nToda función de la lib `csv` es componible con el resto de las 32 libs de `ridgun-libs`:\n\n```ridgun\nimport csv\n\nfn :: exportar informe () => String\n      exportar informe =\n        filas = [[\"id\", \"nota\"], [\"1\", \"Contiene, coma\"], [\"2\", \"Dijo \"hola\"\"]]\n        csv stringify filas\n```\n\n---\n\n## 5. Bajo el capó: rendimiento, memoria RMM y garantías\n\n- **Garantía algorítmica y de seguridad**: Soporte exacto de saltos `\\r\\n` y `\\n` tanto fuera como dentro de comillas, y cero pérdida de datos en viajes de ida y vuelta `csv parse (csv stringify filas)`.\n- **Memoria determinista (`RMM1`/`RMM2`)**: Cero pausas de recolector de basura; todas las estructuras intermedias se liberan de forma determinista al salir del ámbito.\n- **Verificación continua**: Probada exhaustivamente con `stable check` y la suite automatizada `src/test/ridgun/test_csv.rg`.\n"}, {"num": "10", "slug": "10-lib-ini-configuracion-ini-y-dotenv", "file": "10-lib-ini-configuracion-ini-y-dotenv.md", "title": "Capítulo 10: La lib `ini` — Archivos `.ini` por Secciones, `.env` e Interpolación de Variables", "short_title": "La lib `ini` — Archivos `.ini` por Secciones, `.env` e Interpolación de Variables", "markdown": "# Capítulo 10: La lib `ini` — Archivos `.ini` por Secciones, `.env` e Interpolación de Variables\n\n## 1. ¿Por qué existe la lib `ini`?\n\nSeamos sinceros: los archivos `.env` y `.ini` parecen triviales hasta que alguien añade `export KEY=\"valor # con almohadilla\"`, comentarios `;` al final de la línea o referencias cruzadas entre variables.\n\nLa lib **`ini`** analiza configuraciones `.ini` con secciones (`[database]`) y archivos `.env` con prefijos `export`, preservando símbolos `#` y `;` dentro de comillas y resolviendo interpolaciones de variables en `dotenv parse`.\n\n---\n\n## 2. Artefactos, importación y arquitectura sin `libc`\n\nEn `ridgun-libs`, **`ini`** es una **lib** de primera clase ubicada en `src/main/ridgun/lib/ini.rg` (dominio `INI`). Al compilar con `stable bundle`, se empaqueta en tres formatos nativos:\n\n| Artefacto | Ruta | Propósito |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/ini.rglib` | Distribución e importación directa con `import ini` |\n| **Archivo compilado** | `target/ini.rgc` | Artefacto intermedio verificado por `ridgunc` |\n| **Objeto compartido ELF64** | `target/libini.so` | Biblioteca dinámica nativa sin dependencias de C ni `libc` |\n\n> Para usar esta lib en cualquier archivo `.rg`, basta con declarar `import ini` en el encabezado y llamar a sus funciones con espacios o guiones bajos indistintamente.\n\n---\n\n## 3. Referencia rápida de la API de `ini`\n\n| Firma / Función / Tipo | Qué hace y cuándo usarla |\n|---|---|\n| `ini parse / ini stringify` | Analiza texto `.ini` por secciones en `IniDoc` y lo serializa de vuelta |\n| `ini get / ini get int / ini get bool / ini set` | Consultas tipadas por sección+clave (`\"\"` para sección global) y actualización inmutable |\n| `ini sections / ini section map` | Lista los nombres de sección o extrae el mapa `[String String]` de una sección |\n| `dotenv parse` | Analiza archivos `.env` (`export K=V`, comillas, comentarios y expansión de variables) |\n\n---\n\n## 4. Recetas prácticas en estilo tabular\n\n### Receta 1: Flujo principal con `ini`\n\nObserva cómo los signos `=` y los pasos de transformación quedan alineados como una tabla limpia:\n\n```ridgun\nimport ini\n\nfn :: cargar base de datos (texto_ini : String) => (String, Int, Bool)\n      cargar base de datos texto_ini =\n        doc  = ini parse texto_ini\n        host = ini get doc \"database\" \"host\" \"localhost\"\n        port = ini get int doc \"database\" \"port\" 5432\n        pool = ini get bool doc \"database\" \"pool\" True\n        (host, port, pool)\n```\n\n### Receta 2: Composición segura y sin efectos laterales\n\nToda función de la lib `ini` es componible con el resto de las 32 libs de `ridgun-libs`:\n\n```ridgun\nimport ini\n\nfn :: actualizar puerto (doc : IniDoc) (nuevo : String) => String\n      actualizar puerto doc nuevo =\n        doc2 = ini set doc \"database\" \"port\" nuevo\n        ini stringify doc2\n```\n\n---\n\n## 5. Bajo el capó: rendimiento, memoria RMM y garantías\n\n- **Garantía algorítmica y de seguridad**: Respeto total por los caracteres `#` y `;` cuando aparecen entre comillas simples o dobles, y conversión booleana flexible (`true/1/yes/on` vs `false/0/no/off`).\n- **Memoria determinista (`RMM1`/`RMM2`)**: Cero pausas de recolector de basura; todas las estructuras intermedias se liberan de forma determinista al salir del ámbito.\n- **Verificación continua**: Probada exhaustivamente con `stable check` y la suite automatizada `src/test/ridgun/test_ini.rg`.\n"}, {"num": "11", "slug": "11-lib-regex-motor-thompson-nfa-lineal", "file": "11-lib-regex-motor-thompson-nfa-lineal.md", "title": "Capítulo 11: La lib `regex` — Motor de Expresiones Regulares Thompson NFA en Tiempo Lineal $O(N \\cdot M)$", "short_title": "La lib `regex` — Motor de Expresiones Regulares Thompson NFA en Tiempo Lineal $O(N \\cdot M)$", "markdown": "# Capítulo 11: La lib `regex` — Motor de Expresiones Regulares Thompson NFA en Tiempo Lineal $O(N \\cdot M)$\n\n## 1. ¿Por qué existe la lib `regex`?\n\nSeamos sinceros: los motores de expresiones regulares con *backtracking* han causado caídas globales famosas (como en Cloudflare o StackOverflow) cuando un patrón como `(a+)+b` recibe treinta `a` seguidas y entra en tiempo exponencial $O(2^N)$.\n\nLa lib **`regex`** compila tus expresiones regulares (`.`, `*`, `+`, `?`, `|`, `()`, `[a-z]`, `[^...]`, `^`, `$`, `\\d`, `\\w`, `\\s`) a un **autómata finito no determinista de Thompson (NFA)** y avanza el conjunto de estados paso a paso en tiempo estrictamente lineal **$O(N \\cdot M)$**, haciendo que los ataques **ReDoS sean matemáticamente imposibles**.\n\n---\n\n## 2. Artefactos, importación y arquitectura sin `libc`\n\nEn `ridgun-libs`, **`regex`** es una **lib** de primera clase ubicada en `src/main/ridgun/lib/regex.rg` (dominio `REGEX`). Al compilar con `stable bundle`, se empaqueta en tres formatos nativos:\n\n| Artefacto | Ruta | Propósito |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/regex.rglib` | Distribución e importación directa con `import regex` |\n| **Archivo compilado** | `target/regex.rgc` | Artefacto intermedio verificado por `ridgunc` |\n| **Objeto compartido ELF64** | `target/libregex.so` | Biblioteca dinámica nativa sin dependencias de C ni `libc` |\n\n> Para usar esta lib en cualquier archivo `.rg`, basta con declarar `import regex` en el encabezado y llamar a sus funciones con espacios o guiones bajos indistintamente.\n\n---\n\n## 3. Referencia rápida de la API de `regex`\n\n| Firma / Función / Tipo | Qué hace y cuándo usarla |\n|---|---|\n| `regex match / regex is match` | Coincidencia de cadena completa y búsqueda de subcadena en tiempo lineal $O(N \\cdot M)$ |\n| `regex find / regex find all` | Extrae la primera o todas las subcadenas coincidentes sin solapamiento |\n| `regex replace / regex replace all` | Reemplaza la primera o todas las coincidencias de la expresión regular |\n| `regex split / regex escape` | Divide texto según un delimitador regex y escapa metacaracteres |\n\n---\n\n## 4. Recetas prácticas en estilo tabular\n\n### Receta 1: Flujo principal con `regex`\n\nObserva cómo los signos `=` y los pasos de transformación quedan alineados como una tabla limpia:\n\n```ridgun\nimport regex\n\nfn :: extraer codigos postales (texto : String) => [String]\n      extraer codigos postales texto =\n        regex find all \"\\\\d+\" texto\n```\n\n### Receta 2: Composición segura y sin efectos laterales\n\nToda función de la lib `regex` es componible con el resto de las 32 libs de `ridgun-libs`:\n\n```ridgun\nimport regex\n\nfn :: censurar telefonos (comentario : String) => (Bool, String)\n      censurar telefonos comentario =\n        tiene = regex is match \"\\\\d+-\\\\d+\" comentario\n        limpio = regex replace all \"\\\\d+-\\\\d+\" comentario \"[TELEFONO]\"\n        (tiene, limpio)\n```\n\n---\n\n## 5. Bajo el capó: rendimiento, memoria RMM y garantías\n\n- **Garantía algorítmica y de seguridad**: Simulación de conjunto de estados NFA sin recursión descontrolada de pila y tiempo $O(N \\cdot M)$ garantizado incluso ante patrones patológicos `(a+)+b`.\n- **Memoria determinista (`RMM1`/`RMM2`)**: Cero pausas de recolector de basura; todas las estructuras intermedias se liberan de forma determinista al salir del ámbito.\n- **Verificación continua**: Probada exhaustivamente con `stable check` y la suite automatizada `src/test/ridgun/test_regex.rg`.\n"}, {"num": "12", "slug": "12-lib-glob-comodines-y-filtrado", "file": "12-lib-glob-comodines-y-filtrado.md", "title": "Capítulo 12: La lib `glob` — Patrones de Comodines (`*`, `?`, `[a-z]`) y Filtrado de Listas", "short_title": "La lib `glob` — Patrones de Comodines (`*`, `?`, `[a-z]`) y Filtrado de Listas", "markdown": "# Capítulo 12: La lib `glob` — Patrones de Comodines (`*`, `?`, `[a-z]`) y Filtrado de Listas\n\n## 1. ¿Por qué existe la lib `glob`?\n\nSeamos sinceros: usar una expresión regular completa solo para comprobar si un archivo termina en `*.rg` o empieza por `test_[0-9]*.rg` es matar moscas a cañonazos.\n\nLa lib **`glob`** implementa coincidencia exacta de comodines de shell (`*`, `?`, clases `[a-z]`, clases negadas `[!0-9]` / `[^a-z]`), variantes insensibles a mayúsculas (`glob match ci`) y filtrado directo de listas de rutas o nombres.\n\n---\n\n## 2. Artefactos, importación y arquitectura sin `libc`\n\nEn `ridgun-libs`, **`glob`** es una **lib** de primera clase ubicada en `src/main/ridgun/lib/glob.rg` (dominio `GLOB`). Al compilar con `stable bundle`, se empaqueta en tres formatos nativos:\n\n| Artefacto | Ruta | Propósito |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/glob.rglib` | Distribución e importación directa con `import glob` |\n| **Archivo compilado** | `target/glob.rgc` | Artefacto intermedio verificado por `ridgunc` |\n| **Objeto compartido ELF64** | `target/libglob.so` | Biblioteca dinámica nativa sin dependencias de C ni `libc` |\n\n> Para usar esta lib en cualquier archivo `.rg`, basta con declarar `import glob` en el encabezado y llamar a sus funciones con espacios o guiones bajos indistintamente.\n\n---\n\n## 3. Referencia rápida de la API de `glob`\n\n| Firma / Función / Tipo | Qué hace y cuándo usarla |\n|---|---|\n| `glob match / glob match ci` | Coincidencia de patrones glob sensible e insensible a mayúsculas ASCII |\n| `glob filter / glob any match` | Filtra `[String]` según un patrón o comprueba si coincide algún patrón de una lista |\n| `glob has magic` | Detecta si una cadena contiene metacaracteres de comodín (`*`, `?`, `[`) |\n\n---\n\n## 4. Recetas prácticas en estilo tabular\n\n### Receta 1: Flujo principal con `glob`\n\nObserva cómo los signos `=` y los pasos de transformación quedan alineados como una tabla limpia:\n\n```ridgun\nimport glob\n\nfn :: seleccionar fuentes ridgun (archivos : [String]) => [String]\n      seleccionar fuentes ridgun archivos =\n        glob filter \"test_[a-z]*.rg\" archivos\n```\n\n### Receta 2: Composición segura y sin efectos laterales\n\nToda función de la lib `glob` es componible con el resto de las 32 libs de `ridgun-libs`:\n\n```ridgun\nimport glob\n\nfn :: es ruta excluida (ruta : String) => Bool\n      es ruta excluida ruta =\n        glob any match [\"*.tmp\", \"*.bak\", \"target/*\"] ruta\n```\n\n---\n\n## 5. Bajo el capó: rendimiento, memoria RMM y garantías\n\n- **Garantía algorítmica y de seguridad**: Colapso automático de estrellas consecutivas (`***` $\\rightarrow$ `*`) para evitar retrocesos redundantes y manejo seguro de corchetes sin cerrar `[`.\n- **Memoria determinista (`RMM1`/`RMM2`)**: Cero pausas de recolector de basura; todas las estructuras intermedias se liberan de forma determinista al salir del ámbito.\n- **Verificación continua**: Probada exhaustivamente con `stable check` y la suite automatizada `src/test/ridgun/test_glob.rg`.\n"}, {"num": "13", "slug": "13-lib-diff-comparacion-lcs-y-parches", "file": "13-lib-diff-comparacion-lcs-y-parches.md", "title": "Capítulo 13: La lib `diff` — Algoritmo LCS, Distancia de Edición, Unified Diff y Parches", "short_title": "La lib `diff` — Algoritmo LCS, Distancia de Edición, Unified Diff y Parches", "markdown": "# Capítulo 13: La lib `diff` — Algoritmo LCS, Distancia de Edición, Unified Diff y Parches\n\n## 1. ¿Por qué existe la lib `diff`?\n\nSeamos sinceros: cuando un test falla o un archivo de configuración cambia, un seco `\"expected A, got B\"` de 200 líneas te obliga a dejarte las pestañas buscando qué línea exacta ha cambiado.\n\nLa lib **`diff`** calcula la **Subsecuencia Común Más Larga (LCS)** sobre `Tensor[Int]` 2D para producir ediciones mínimas (`DiffKeep`, `DiffAdd`, `DiffDel`), distancia de edición, estadísticas, formato **Unified Diff** (`---`/`+++`/`@@`) y reconstrucción exacta con `diff apply`.\n\n---\n\n## 2. Artefactos, importación y arquitectura sin `libc`\n\nEn `ridgun-libs`, **`diff`** es una **lib** de primera clase ubicada en `src/main/ridgun/lib/diff.rg` (dominio `DIFF`). Al compilar con `stable bundle`, se empaqueta en tres formatos nativos:\n\n| Artefacto | Ruta | Propósito |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/diff.rglib` | Distribución e importación directa con `import diff` |\n| **Archivo compilado** | `target/diff.rgc` | Artefacto intermedio verificado por `ridgunc` |\n| **Objeto compartido ELF64** | `target/libdiff.so` | Biblioteca dinámica nativa sin dependencias de C ni `libc` |\n\n> Para usar esta lib en cualquier archivo `.rg`, basta con declarar `import diff` en el encabezado y llamar a sus funciones con espacios o guiones bajos indistintamente.\n\n---\n\n## 3. Referencia rápida de la API de `diff`\n\n| Firma / Función / Tipo | Qué hace y cuándo usarla |\n|---|---|\n| `type DiffOp` | `DiffKeep String | DiffDel String | DiffAdd String` |\n| `diff lines / diff text` | Calcula el guion mínimo de edición LCS entre listas `[String]` o textos multilínea |\n| `diff edit distance / diff stats` | Distancia mínima de inserción+borrado y recuento `(kept, added, deleted)` |\n| `diff format / diff unified` | Formatea líneas compactas `+ / - /  ` o Unified Diff estándar con cabeceras |\n| `diff apply / diff apply text` | Reconstruye el documento destino sin pérdidas a partir del guion de edición |\n\n---\n\n## 4. Recetas prácticas en estilo tabular\n\n### Receta 1: Flujo principal con `diff`\n\nObserva cómo los signos `=` y los pasos de transformación quedan alineados como una tabla limpia:\n\n```ridgun\nimport diff\n\nfn :: auditar cambio (antes : String) (despues : String) => (Int, String)\n      auditar cambio antes despues =\n        dist   = diff edit distance ( [\"host=localhost\", \"port=8080\"] ) ( [\"host=0.0.0.0\", \"port=8080\"] )\n        parche = diff unified \"config.old\" \"config.new\" antes despues\n        (dist, parche)\n```\n\n### Receta 2: Composición segura y sin efectos laterales\n\nToda función de la lib `diff` es componible con el resto de las 32 libs de `ridgun-libs`:\n\n```ridgun\nimport diff\n\nfn :: verificar parche (orig : [String]) (nuevo : [String]) => [String]\n      verificar parche orig nuevo =\n        ops = diff lines orig nuevo\n        diff apply ops\n```\n\n---\n\n## 5. Bajo el capó: rendimiento, memoria RMM y garantías\n\n- **Garantía algorítmica y de seguridad**: Identidad matemática garantizada $diff\\_edit\\_distance(a, b) == |a| + |b| - 2 \\cdot LCS(a, b)$ y reconstrucción sin pérdidas `diff apply (diff lines a b) == b`.\n- **Memoria determinista (`RMM1`/`RMM2`)**: Cero pausas de recolector de basura; todas las estructuras intermedias se liberan de forma determinista al salir del ámbito.\n- **Verificación continua**: Probada exhaustivamente con `stable check` y la suite automatizada `src/test/ridgun/test_diff.rg`.\n"}, {"num": "14", "slug": "14-lib-template-plantillas-mustache-seguras", "file": "14-lib-template-plantillas-mustache-seguras.md", "title": "Capítulo 14: La lib `template` — Plantillas Mustache Seguras con Auto-Escape HTML y LaTeX", "short_title": "La lib `template` — Plantillas Mustache Seguras con Auto-Escape HTML y LaTeX", "markdown": "# Capítulo 14: La lib `template` — Plantillas Mustache Seguras con Auto-Escape HTML y LaTeX\n\n## 1. ¿Por qué existe la lib `template`?\n\nSeamos sinceros: montar páginas HTML o informes LaTeX concatenando cadenas a mano es la receta perfecta para una vulnerabilidad XSS (`<script>`) o para que un simple símbolo `%` o `_` rompa la compilación de tu PDF.\n\nLa lib **`template`** ofrece un motor **Mustache** sin lógica arbitraria con auto-escape contextual (`TmplPlain`, `TmplHtml`, `TmplLatex`), sustitución cruda explícita (`{{{raw}}}` / `{{&raw}}`), comentarios (`{{! ... }}`), secciones condicionales (`{{#sec}}...{{/sec}}`) e invertidas (`{{^sec}}...{{/sec}}`).\n\n---\n\n## 2. Artefactos, importación y arquitectura sin `libc`\n\nEn `ridgun-libs`, **`template`** es una **lib** de primera clase ubicada en `src/main/ridgun/lib/template.rg` (dominio `TMPL`). Al compilar con `stable bundle`, se empaqueta en tres formatos nativos:\n\n| Artefacto | Ruta | Propósito |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/template.rglib` | Distribución e importación directa con `import template` |\n| **Archivo compilado** | `target/template.rgc` | Artefacto intermedio verificado por `ridgunc` |\n| **Objeto compartido ELF64** | `target/libtemplate.so` | Biblioteca dinámica nativa sin dependencias de C ni `libc` |\n\n> Para usar esta lib en cualquier archivo `.rg`, basta con declarar `import template` en el encabezado y llamar a sus funciones con espacios o guiones bajos indistintamente.\n\n---\n\n## 3. Referencia rápida de la API de `template`\n\n| Firma / Función / Tipo | Qué hace y cuándo usarla |\n|---|---|\n| `tmpl render / tmpl render html / tmpl render latex` | Renderiza plantillas Mustache con auto-escape plano, HTML o LaTeX |\n| `tmpl escape html / tmpl escape latex` | Escapa `& < > \" '` para HTML o `\\ { } & % $ # _ ~ ^` para LaTeX |\n| `tmpl extract vars / tmpl has unclosed tags` | Extrae los nombres de variables requeridos y valida que las etiquetas estén cerradas |\n\n---\n\n## 4. Recetas prácticas en estilo tabular\n\n### Receta 1: Flujo principal con `template`\n\nObserva cómo los signos `=` y los pasos de transformación quedan alineados como una tabla limpia:\n\n```ridgun\nimport template\n\nfn :: renderizar perfil html (usuario : String) (es_admin : String) => String\n      renderizar perfil html usuario es_admin =\n        plantilla = \"<h1>Hola {{user}}</h1>{{#admin}}<span class='badge'>Admin</span>{{/admin}}\"\n        vars      = [(\"user\", usuario), (\"admin\", es_admin)]\n        tmpl render html plantilla vars\n```\n\n### Receta 2: Composición segura y sin efectos laterales\n\nToda función de la lib `template` es componible con el resto de las 32 libs de `ridgun-libs`:\n\n```ridgun\nimport template\n\nfn :: generar linea latex (metrica : String) => String\n      generar linea latex metrica =\n        -- Escapa automaticamente % _ & # para que LaTeX no falle\n        tmpl render latex \"Resultado: {{val}}\" [(\"val\", metrica)]\n```\n\n---\n\n## 5. Bajo el capó: rendimiento, memoria RMM y garantías\n\n- **Garantía algorítmica y de seguridad**: Prevención de XSS por defecto en `tmpl render html` (escapando `&`, `<`, `>`, `\"`, `'`) mientras `{{{var}}}` permite inyectar fragmentos de confianza de forma explícita.\n- **Memoria determinista (`RMM1`/`RMM2`)**: Cero pausas de recolector de basura; todas las estructuras intermedias se liberan de forma determinista al salir del ámbito.\n- **Verificación continua**: Probada exhaustivamente con `stable check` y la suite automatizada `src/test/ridgun/test_template.rg`.\n"}, {"num": "15", "slug": "15-lib-fmt-formateador-tabular-y-resaltador", "file": "15-lib-fmt-formateador-tabular-y-resaltador.md", "title": "Capítulo 15: La lib `fmt` — Formateador Tabular Canónico 2D y Resaltador de Sintaxis en 9 Formatos", "short_title": "La lib `fmt` — Formateador Tabular Canónico 2D y Resaltador de Sintaxis en 9 Formatos", "markdown": "# Capítulo 15: La lib `fmt` — Formateador Tabular Canónico 2D y Resaltador de Sintaxis en 9 Formatos\n\n## 1. ¿Por qué existe la lib `fmt`?\n\nSeamos sinceros: la belleza del código Ridgun reside en sus columnas tabulares perfectamente alineadas (`::`, `=`, `|`, `->`, `--`), pero alinear espacios a mano o exportar código coloreado para terminal, HTML y LaTeX sin una herramienta dedicada es tedioso.\n\nLa lib **`fmt`** es el motor oficial de formateo tabular 2D y resaltado léxico de Ridgun: alinea firmas `fn ::`, ecuaciones, guardas `|` y comentarios `--`, y exporta a **9 formatos de salida** (`FmtPlain`, `FmtTty`, `FmtTrueColor`, `FmtHtmlInline`, `FmtHtmlCss`, `FmtMarkdown`, `FmtPango`, `FmtLatex`, `FmtRtf`).\n\n---\n\n## 2. Artefactos, importación y arquitectura sin `libc`\n\nEn `ridgun-libs`, **`fmt`** es una **lib** de primera clase ubicada en `src/main/ridgun/lib/fmt.rg` (dominio `FMT`). Al compilar con `stable bundle`, se empaqueta en tres formatos nativos:\n\n| Artefacto | Ruta | Propósito |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/fmt.rglib` | Distribución e importación directa con `import fmt` |\n| **Archivo compilado** | `target/fmt.rgc` | Artefacto intermedio verificado por `ridgunc` |\n| **Objeto compartido ELF64** | `target/libfmt.so` | Biblioteca dinámica nativa sin dependencias de C ni `libc` |\n\n> Para usar esta lib en cualquier archivo `.rg`, basta con declarar `import fmt` en el encabezado y llamar a sus funciones con espacios o guiones bajos indistintamente.\n\n---\n\n## 3. Referencia rápida de la API de `fmt`\n\n| Firma / Función / Tipo | Qué hace y cuándo usarla |\n|---|---|\n| `fmt source / fmt source with` | Formatea código fuente Ridgun usando la alineación tabular 2D canónica |\n| `fmt check` | Devuelve `True` si el código ya cumple el formato tabular canónico de `fmt source` |\n| `fmt render / fmt render with` | Formatea y colorea el código hacia cualquiera de los 9 formatos `FmtTarget` |\n| `fmt tokenize line` | Tokeniza una línea en `TokKeyword`, `TokType`, `TokOperator`, `TokString`, `TokNumber`, `TokComment` |\n\n---\n\n## 4. Recetas prácticas en estilo tabular\n\n### Receta 1: Flujo principal con `fmt`\n\nObserva cómo los signos `=` y los pasos de transformación quedan alineados como una tabla limpia:\n\n```ridgun\nimport fmt\n\nfn :: formatear y verificar (codigo : String) => (String, Bool)\n      formatear y verificar codigo =\n        limpio = fmt source codigo\n        es_ok  = fmt check limpio\n        (limpio, es_ok)\n```\n\n### Receta 2: Composición segura y sin efectos laterales\n\nToda función de la lib `fmt` es componible con el resto de las 32 libs de `ridgun-libs`:\n\n```ridgun\nimport fmt\n\nfn :: exportar bloque html (codigo : String) => String\n      exportar bloque html codigo =\n        fmt render codigo FmtHtmlCss\n```\n\n---\n\n## 5. Bajo el capó: rendimiento, memoria RMM y garantías\n\n- **Garantía algorítmica y de seguridad**: Idempotencia estricta (`fmt source (fmt source s) == fmt source s`) y preservación del 100 % de los tokens semánticos.\n- **Memoria determinista (`RMM1`/`RMM2`)**: Cero pausas de recolector de basura; todas las estructuras intermedias se liberan de forma determinista al salir del ámbito.\n- **Verificación continua**: Probada exhaustivamente con `stable check` y la suite automatizada `src/test/ridgun/test_fmt.rg`.\n"}, {"num": "16", "slug": "16-lib-cli-argumentos-y-entorno", "file": "16-lib-cli-argumentos-y-entorno.md", "title": "Capítulo 16: La lib `cli` — Banderas, Opciones, Barrera `--`, Subcomandos y Variables de Entorno", "short_title": "La lib `cli` — Banderas, Opciones, Barrera `--`, Subcomandos y Variables de Entorno", "markdown": "# Capítulo 16: La lib `cli` — Banderas, Opciones, Barrera `--`, Subcomandos y Variables de Entorno\n\n## 1. ¿Por qué existe la lib `cli`?\n\nSeamos sinceros: analizar `argv` a mano siempre empieza con un bucle inocente y termina rompiéndose cuando alguien pasa `-la` agrupado, `--port=9090` con signo igual o `--` seguido de un archivo que empieza por guion `-archivo.rg`.\n\nLa lib **`cli`** resuelve banderas largas (`--verbose`), cortas (`-v`), agrupadas (`-la`), opciones con valor (`--port=8080`, `--port 8080`, `-p 8080`), el separador POSIX `--`, argumentos posicionales, subcomandos y lectura tipada de variables de entorno (`env get int or`, `env get bool or`).\n\n---\n\n## 2. Artefactos, importación y arquitectura sin `libc`\n\nEn `ridgun-libs`, **`cli`** es una **lib** de primera clase ubicada en `src/main/ridgun/lib/cli.rg` (dominio `CLI`). Al compilar con `stable bundle`, se empaqueta en tres formatos nativos:\n\n| Artefacto | Ruta | Propósito |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/cli.rglib` | Distribución e importación directa con `import cli` |\n| **Archivo compilado** | `target/cli.rgc` | Artefacto intermedio verificado por `ridgunc` |\n| **Objeto compartido ELF64** | `target/libcli.so` | Biblioteca dinámica nativa sin dependencias de C ni `libc` |\n\n> Para usar esta lib en cualquier archivo `.rg`, basta con declarar `import cli` en el encabezado y llamar a sus funciones con espacios o guiones bajos indistintamente.\n\n---\n\n## 3. Referencia rápida de la API de `cli`\n\n| Firma / Función / Tipo | Qué hace y cuándo usarla |\n|---|---|\n| `cli has flag : [String] -> String -> String -> Bool` | Detecta `--long`, `-s` o banderas agrupadas `-xyz` antes de `--` |\n| `cli get opt / cli get int opt` | Extrae opción de texto o entera (`--k=v`, `--k v`, `-k v`) con valor por defecto |\n| `cli positionals / cli subcommand` | Recoge los argumentos posicionales (incluyendo todo lo que sigue a `--`) |\n| `env get or / env get int or / env get bool or` | Lee variables de entorno con conversión tipada y valores de respaldo |\n\n---\n\n## 4. Recetas prácticas en estilo tabular\n\n### Receta 1: Flujo principal con `cli`\n\nObserva cómo los signos `=` y los pasos de transformación quedan alineados como una tabla limpia:\n\n```ridgun\nimport cli\n\nfn :: analizar comando (args : [String]) => (String, Bool, Int, [String])\n      analizar comando args =\n        sub   = cli subcommand args\n        all_f = cli has flag args \"--all\" \"-a\"\n        port  = cli get int opt args \"--port\" \"-p\" 8080\n        arch  = cli positionals args [\"--port\", \"-p\"]\n        (sub, all_f, port, arch)\n```\n\n### Receta 2: Composición segura y sin efectos laterales\n\nToda función de la lib `cli` es componible con el resto de las 32 libs de `ridgun-libs`:\n\n```ridgun\nimport cli\n\nfn :: leer config entorno () => (Int, Bool)\n      leer config entorno =\n        workers = env get int or \"SOLSTICE_WORKERS\" 4\n        debug   = env get bool or \"SOLSTICE_DEBUG\" False\n        (workers, debug)\n```\n\n---\n\n## 5. Bajo el capó: rendimiento, memoria RMM y garantías\n\n- **Garantía algorítmica y de seguridad**: Respeto estricto del separador POSIX `--`: ningún argumento situado a la derecha de `--` se interpreta jamás como bandera.\n- **Memoria determinista (`RMM1`/`RMM2`)**: Cero pausas de recolector de basura; todas las estructuras intermedias se liberan de forma determinista al salir del ámbito.\n- **Verificación continua**: Probada exhaustivamente con `stable check` y la suite automatizada `src/test/ridgun/test_cli.rg`.\n"}, {"num": "17", "slug": "17-lib-path-rutas-posix-y-seguridad", "file": "17-lib-path-rutas-posix-y-seguridad.md", "title": "Capítulo 17: La lib `path` — Normalización POSIX (`path clean`) y Confinamiento contra Path Traversal", "short_title": "La lib `path` — Normalización POSIX (`path clean`) y Confinamiento contra Path Traversal", "markdown": "# Capítulo 17: La lib `path` — Normalización POSIX (`path clean`) y Confinamiento contra Path Traversal\n\n## 1. ¿Por qué existe la lib `path`?\n\nSeamos sinceros: unir rutas con `base + \"/\" + archivo` sin limpiar segmentos `..` ni validar prefijos es como dejar la puerta abierta para que alguien pida `../../etc/passwd` en tu servidor web.\n\nLa lib **`path`** implementa normalización léxica POSIX (`path clean` al estilo `filepath.Clean` de Go), unión segura (`path join`), descomposición (`dirname`, `basename`, `stem`, `ext`, `replace ext`) y el predicado de seguridad **`path is safe subpath`** (`VUL-INJ-001`) contra escapes de directorio.\n\n---\n\n## 2. Artefactos, importación y arquitectura sin `libc`\n\nEn `ridgun-libs`, **`path`** es una **lib** de primera clase ubicada en `src/main/ridgun/lib/path.rg` (dominio `PATH`). Al compilar con `stable bundle`, se empaqueta en tres formatos nativos:\n\n| Artefacto | Ruta | Propósito |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/path.rglib` | Distribución e importación directa con `import path` |\n| **Archivo compilado** | `target/path.rgc` | Artefacto intermedio verificado por `ridgunc` |\n| **Objeto compartido ELF64** | `target/libpath.so` | Biblioteca dinámica nativa sin dependencias de C ni `libc` |\n\n> Para usar esta lib en cualquier archivo `.rg`, basta con declarar `import path` en el encabezado y llamar a sus funciones con espacios o guiones bajos indistintamente.\n\n---\n\n## 3. Referencia rápida de la API de `path`\n\n| Firma / Función / Tipo | Qué hace y cuándo usarla |\n|---|---|\n| `path clean / path join / path join list` | Colapsa `//`, `.` y `..` léxicamente y une segmentos de ruta |\n| `path dirname / path basename / path split` | Divide una ruta en directorio padre y nombre de archivo final |\n| `path ext / path stem / path replace ext` | Extrae o cambia la extensión (tratando `.bashrc` como raíz `.bashrc` y ext `\"\"`) |\n| `path is safe subpath : String -> String -> Bool` | Verifica que `rel` permanezca estrictamente dentro de `base_dir` y sin bytes NUL |\n\n---\n\n## 4. Recetas prácticas en estilo tabular\n\n### Receta 1: Flujo principal con `path`\n\nObserva cómo los signos `=` y los pasos de transformación quedan alineados como una tabla limpia:\n\n```ridgun\nimport path\n\nfn :: resolver archivo estatico (raiz : String) (peticion : String) => (Bool, String)\n      resolver archivo estatico raiz peticion =\n        seguro = path is safe subpath raiz peticion\n        ruta   = path join raiz peticion\n        (seguro, ruta)\n```\n\n### Receta 2: Composición segura y sin efectos laterales\n\nToda función de la lib `path` es componible con el resto de las 32 libs de `ridgun-libs`:\n\n```ridgun\nimport path\n\nfn :: cambiar salida a objeto (fuente : String) => (String, String, String)\n      cambiar salida a objeto fuente =\n        dir = path dirname fuente\n        nom = path stem fuente\n        obj = path replace ext (path clean fuente) \".rglib\"\n        (dir, nom, obj)\n```\n\n---\n\n## 5. Bajo el capó: rendimiento, memoria RMM y garantías\n\n- **Garantía algorítmica y de seguridad**: `path is safe subpath` rechaza rutas absolutas, bytes NUL y cualquier secuencia `..` que intente escapar del directorio raíz o de un prefijo hermano (`/srv/www-secret`).\n- **Memoria determinista (`RMM1`/`RMM2`)**: Cero pausas de recolector de basura; todas las estructuras intermedias se liberan de forma determinista al salir del ámbito.\n- **Verificación continua**: Probada exhaustivamente con `stable check` y la suite automatizada `src/test/ridgun/test_path.rg`.\n"}, {"num": "18", "slug": "18-lib-time-calendario-utc-iso8601-y-backoff", "file": "18-lib-time-calendario-utc-iso8601-y-backoff.md", "title": "Capítulo 18: La lib `time` — Calendario Civil UTC (Hinnant), ISO-8601, Duraciones y Backoff", "short_title": "La lib `time` — Calendario Civil UTC (Hinnant), ISO-8601, Duraciones y Backoff", "markdown": "# Capítulo 18: La lib `time` — Calendario Civil UTC (Hinnant), ISO-8601, Duraciones y Backoff\n\n## 1. ¿Por qué existe la lib `time`?\n\nSeamos sinceros: las funciones de fecha de `libc` (`localtime`, `gmtime`, `mktime`) dependen de estado global mutable (`TZ`), no son seguras entre hilos y fallan con reglas de años bisiestos seculares como 1900 vs 2000.\n\nLa lib **`time`** implementa el algoritmo de calendario civil gregoriano proléptico en **$O(1)$ de Howard Hinnant**, formateo y análisis estricto **ISO-8601 / RFC 3339** (`YYYY-MM-DDTHH:MM:SSZ`), duraciones legibles (`1h 1m 1s 5ms`) y cálculo de *exponential backoff* acotado para reintentos de red.\n\n---\n\n## 2. Artefactos, importación y arquitectura sin `libc`\n\nEn `ridgun-libs`, **`time`** es una **lib** de primera clase ubicada en `src/main/ridgun/lib/time.rg` (dominio `TIME`). Al compilar con `stable bundle`, se empaqueta en tres formatos nativos:\n\n| Artefacto | Ruta | Propósito |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/time.rglib` | Distribución e importación directa con `import time` |\n| **Archivo compilado** | `target/time.rgc` | Artefacto intermedio verificado por `ridgunc` |\n| **Objeto compartido ELF64** | `target/libtime.so` | Biblioteca dinámica nativa sin dependencias de C ni `libc` |\n\n> Para usar esta lib en cualquier archivo `.rg`, basta con declarar `import time` en el encabezado y llamar a sus funciones con espacios o guiones bajos indistintamente.\n\n---\n\n## 3. Referencia rápida de la API de `time`\n\n| Firma / Función / Tipo | Qué hace y cuándo usarla |\n|---|---|\n| `time epoch to utc / time utc to epoch` | Conversión en $O(1)$ entre segundos Unix epoch y `(year, month, day, hour, min, sec)` |\n| `time is leap year / time days in month / time day of week` | Reglas de año bisiesto (`400 / 100 / 4`), días del mes y día ISO de la semana (`1=Lun..7=Dom`) |\n| `time format iso8601 / time parse iso8601` | Formatea y valida marcas `YYYY-MM-DDTHH:MM:SSZ` (`-1` en fechas inválidas como 30 de feb) |\n| `time format duration ms / time backoff ms` | Duraciones legibles y tiempos de espera exponenciales acotados $base \\cdot 2^{attempt}$ |\n\n---\n\n## 4. Recetas prácticas en estilo tabular\n\n### Receta 1: Flujo principal con `time`\n\nObserva cómo los signos `=` y los pasos de transformación quedan alineados como una tabla limpia:\n\n```ridgun\nimport time\n\nfn :: registrar evento temporal (epoch_s : Int) => (String, Int, String)\n      registrar evento temporal epoch_s =\n        iso = time format iso8601 epoch_s\n        sem = time day of week epoch_s\n        dur = time format duration ms 3661005\n        (iso, sem, dur)\n```\n\n### Receta 2: Composición segura y sin efectos laterales\n\nToda función de la lib `time` es componible con el resto de las 32 libs de `ridgun-libs`:\n\n```ridgun\nimport time\n\nfn :: planificar reintentos () => [Int]\n      planificar reintentos =\n        [time backoff ms 0 100 5000, time backoff ms 1 100 5000, time backoff ms 2 100 5000, time backoff ms 9 100 5000]\n```\n\n---\n\n## 5. Bajo el capó: rendimiento, memoria RMM y garantías\n\n- **Garantía algorítmica y de seguridad**: Conversión de calendario en $O(1)$ sin bucles año por año y validación estricta de días por mes (rechazando el 29 de febrero en años no bisiestos).\n- **Memoria determinista (`RMM1`/`RMM2`)**: Cero pausas de recolector de basura; todas las estructuras intermedias se liberan de forma determinista al salir del ámbito.\n- **Verificación continua**: Probada exhaustivamente con `stable check` y la suite automatizada `src/test/ridgun/test_time.rg`.\n"}, {"num": "19", "slug": "19-lib-uuid-identificadores-crc32-y-prng", "file": "19-lib-uuid-identificadores-crc32-y-prng.md", "title": "Capítulo 19: La lib `uuid` — RFC 9562 `UUIDv4`/`UUIDv7`, FNV-1a, Adler-32, CRC-32 y PRNG", "short_title": "La lib `uuid` — RFC 9562 `UUIDv4`/`UUIDv7`, FNV-1a, Adler-32, CRC-32 y PRNG", "markdown": "# Capítulo 19: La lib `uuid` — RFC 9562 `UUIDv4`/`UUIDv7`, FNV-1a, Adler-32, CRC-32 y PRNG\n\n## 1. ¿Por qué existe la lib `uuid`?\n\nSeamos sinceros: usar `UUIDv4` completamente aleatorios como clave primaria en una base de datos fragmenta los índices B-Tree, mientras que inventarse IDs caseros sin entropía del kernel acaba en colisiones.\n\nLa lib **`uuid`** implementa **`UUIDv4`** (aleatorio con CSPRNG del kernel) y **`UUIDv7`** (ordenado cronológicamente en los primeros 48 bits según **RFC 9562**), sumas de verificación rápidas (**FNV-1a**, **Adler-32**, **CRC-32 IEEE 802.3**) y un PRNG determinista con semilla.\n\n---\n\n## 2. Artefactos, importación y arquitectura sin `libc`\n\nEn `ridgun-libs`, **`uuid`** es una **lib** de primera clase ubicada en `src/main/ridgun/lib/uuid.rg` (dominio `UUID`). Al compilar con `stable bundle`, se empaqueta en tres formatos nativos:\n\n| Artefacto | Ruta | Propósi
