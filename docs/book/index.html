to |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/uuid.rglib` | Distribución e importación directa con `import uuid` |\n| **Archivo compilado** | `target/uuid.rgc` | Artefacto intermedio verificado por `ridgunc` |\n| **Objeto compartido ELF64** | `target/libuuid.so` | Biblioteca dinámica nativa sin dependencias de C ni `libc` |\n\n> Para usar esta lib en cualquier archivo `.rg`, basta con declarar `import uuid` en el encabezado y llamar a sus funciones con espacios o guiones bajos indistintamente.\n\n---\n\n## 3. Referencia rápida de la API de `uuid`\n\n| Firma / Función / Tipo | Qué hace y cuándo usarla |\n|---|---|\n| `uuid v4 / uuid v7 / uuid v7 at` | Genera UUIDs canónicos de 36 caracteres RFC 9562 v4 (aleatorio) y v7 (ordenado por tiempo) |\n| `uuid is valid / uuid version` | Valida la estructura 8-4-4-4-12 y los bits de variante RFC 9562 (`8, 9, a, b`) |\n| `fnv1a 32 / adler32 / crc32 / crc32 hex` | Hashes no criptográficos y sumas de verificación rápidas de 32 bits |\n| `prng next / prng range` | PRNG congruencial lineal funcional puro para pruebas y simulaciones reproducibles |\n\n---\n\n## 4. Recetas prácticas en estilo tabular\n\n### Receta 1: Flujo principal con `uuid`\n\nObserva cómo los signos `=` y los pasos de transformación quedan alineados como una tabla limpia:\n\n```ridgun\nimport uuid\n\nfn :: generar ids ordenados () => (String, String, Bool)\n      generar ids ordenados =\n        id1 = uuid v7 at 1000\n        id2 = uuid v7 at 2000\n        ok  = (uuid is valid id1) and (id1 < id2)\n        (id1, id2, ok)\n```\n\n### Receta 2: Composición segura y sin efectos laterales\n\nToda función de la lib `uuid` es componible con el resto de las 32 libs de `ridgun-libs`:\n\n```ridgun\nimport uuid\n\nfn :: firmar paquete (payload : String) => (String, Int)\n      firmar paquete payload =\n         (crc32 hex payload, fnv1a 32 payload)\n```\n\n---\n\n## 5. Bajo el capó: rendimiento, memoria RMM y garantías\n\n- **Garantía algorítmica y de seguridad**: `uuid v7 at t1 < uuid v7 at t2` garantiza orden lexicográfico monótono creciente con el tiempo, ideal para índices `btree` y bases de datos.\n- **Memoria determinista (`RMM1`/`RMM2`)**: Cero pausas de recolector de basura; todas las estructuras intermedias se liberan de forma determinista al salir del ámbito.\n- **Verificación continua**: Probada exhaustivamente con `stable check` y la suite automatizada `src/test/ridgun/test_uuid.rg`.\n"}, {"num": "20", "slug": "20-lib-log-logging-ndjson-y-redaccion", "file": "20-lib-log-logging-ndjson-y-redaccion.md", "title": "Capítulo 20: La lib `log` — Logging Estructurado NDJSON y Redacción Automática de Secretos", "short_title": "La lib `log` — Logging Estructurado NDJSON y Redacción Automática de Secretos", "markdown": "# Capítulo 20: La lib `log` — Logging Estructurado NDJSON y Redacción Automática de Secretos\n\n## 1. ¿Por qué existe la lib `log`?\n\nSeamos sinceros: volcar los campos de una petición en un archivo de log y descubrir semanas después que acabas de guardar `password`, `api_key` o `authorization` en texto plano en tu agregador de logs es un incidente de seguridad clásico.\n\nLa lib **`log`** proporciona filtrado por severidad (`DEBUG`, `INFO`, `WARN`, `ERROR`), formateo en texto humano y **NDJSON estructurado**, y **redacción automática de claves sensibles** (`password`, `secret`, `token`, `api_key`, `authorization`, `cookie`, `private_key` $\\rightarrow$ `\"[REDACTED]\"`, mitigando `VUL-LOG-001`).\n\n---\n\n## 2. Artefactos, importación y arquitectura sin `libc`\n\nEn `ridgun-libs`, **`log`** es una **lib** de primera clase ubicada en `src/main/ridgun/lib/log.rg` (dominio `LOG`). Al compilar con `stable bundle`, se empaqueta en tres formatos nativos:\n\n| Artefacto | Ruta | Propósito |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/log.rglib` | Distribución e importación directa con `import log` |\n| **Archivo compilado** | `target/log.rgc` | Artefacto intermedio verificado por `ridgunc` |\n| **Objeto compartido ELF64** | `target/liblog.so` | Biblioteca dinámica nativa sin dependencias de C ni `libc` |\n\n> Para usar esta lib en cualquier archivo `.rg`, basta con declarar `import log` en el encabezado y llamar a sus funciones con espacios o guiones bajos indistintamente.\n\n---\n\n## 3. Referencia rápida de la API de `log`\n\n| Firma / Función / Tipo | Qué hace y cuándo usarla |\n|---|---|\n| `log level rank / log should emit` | Compara niveles (`DEBUG=10`, `INFO=20`, `WARN=30`, `ERROR=40`) frente al umbral activo |\n| `log is sensitive key / log redact fields` | Sustituye valores de claves secretas por `\"[REDACTED]\"` sin importar mayúsculas |\n| `log format text / log format json` | Formatea líneas texto `clave=valor` o NDJSON RFC 8259 con redacción automática de secretos |\n\n---\n\n## 4. Recetas prácticas en estilo tabular\n\n### Receta 1: Flujo principal con `log`\n\nObserva cómo los signos `=` y los pasos de transformación quedan alineados como una tabla limpia:\n\n```ridgun\nimport log\n\nfn :: auditar login (usuario : String) (clave : String) => String\n      auditar login usuario clave =\n        campos = [(\"user\", usuario), (\"password\", clave), (\"ip\", \"10.0.0.1\")]\n        log format json \"INFO\" \"intento de acceso\" campos\n```\n\n### Receta 2: Composición segura y sin efectos laterales\n\nToda función de la lib `log` es componible con el resto de las 32 libs de `ridgun-libs`:\n\n```ridgun\nimport log\n\nfn :: emitir si procede (umbral : String) (nivel : String) (msg : String) => String\n      emitir si procede umbral nivel msg =\n        | log should emit umbral nivel = log format text nivel msg [(\"service\", \"solstice\")]\n        | otherwise                    = \"\"\n```\n\n---\n\n## 5. Bajo el capó: rendimiento, memoria RMM y garantías\n\n- **Garantía algorítmica y de seguridad**: Tanto `log format text` como `log format json` pasan siempre los campos por `log redact fields` antes de serializar, garantizando que ningún secreto se filtre por olvido.\n- **Memoria determinista (`RMM1`/`RMM2`)**: Cero pausas de recolector de basura; todas las estructuras intermedias se liberan de forma determinista al salir del ámbito.\n- **Verificación continua**: Probada exhaustivamente con `stable check` y la suite automatizada `src/test/ridgun/test_log.rg`.\n"}, {"num": "21", "slug": "21-lib-test-aserciones-unitarias-y-funcionales", "file": "21-lib-test-aserciones-unitarias-y-funcionales.md", "title": "Capítulo 21: La lib `test` — Primitivas de Aserción Unitaria y Funcional (`RG-011`)", "short_title": "La lib `test` — Primitivas de Aserción Unitaria y Funcional (`RG-011`)", "markdown": "# Capítulo 21: La lib `test` — Primitivas de Aserción Unitaria y Funcional (`RG-011`)\n\n## 1. ¿Por qué existe la lib `test`?\n\nSeamos sinceros: cuando un framework de tests requiere macros mágicas, reflexión en tiempo de ejecución o un runner externo pesado, escribir pruebas deja de ser inmediato.\n\nLa lib **`test`** (`RG-011`) proporciona aserciones puras, polimórficas y específicas de tipo que emiten diagnósticos claros `[FAIL]` con los valores esperado y obtenido y terminan con código de salida `1` en cuanto falla una invariante.\n\n---\n\n## 2. Artefactos, importación y arquitectura sin `libc`\n\nEn `ridgun-libs`, **`test`** es una **lib** de primera clase ubicada en `src/main/ridgun/lib/test.rg` (dominio `TST`). Al compilar con `stable bundle`, se empaqueta en tres formatos nativos:\n\n| Artefacto | Ruta | Propósito |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/test.rglib` | Distribución e importación directa con `import test` |\n| **Archivo compilado** | `target/test.rgc` | Artefacto intermedio verificado por `ridgunc` |\n| **Objeto compartido ELF64** | `target/libtest.so` | Biblioteca dinámica nativa sin dependencias de C ni `libc` |\n\n> Para usar esta lib en cualquier archivo `.rg`, basta con declarar `import test` en el encabezado y llamar a sus funciones con espacios o guiones bajos indistintamente.\n\n---\n\n## 3. Referencia rápida de la API de `test`\n\n| Firma / Función / Tipo | Qué hace y cuándo usarla |\n|---|---|\n| `assert equals / assert eq : A -> A -> String -> ()` | Aserción polimórfica de igualdad con etiqueta descriptiva del caso de prueba |\n| `assert int equals / assert str eq` | Aserciones especializadas de igualdad para `Int` y `String` |\n| `assert true / assert false / assert not` | Aserciones de invariantes booleanas (`True` / `False`) |\n| `assert ok : Int -> String -> ()` | Verifica que un código de estado del sistema o socket sea `0` (`OK`) |\n\n---\n\n## 4. Recetas prácticas en estilo tabular\n\n### Receta 1: Flujo principal con `test`\n\nObserva cómo los signos `=` y los pasos de transformación quedan alineados como una tabla limpia:\n\n```ridgun\nimport test\nimport math\n\nfn :: suite matematicas () => ()\n      suite matematicas =\n        _ = assert int equals 12 (math gcd 36 60) \"MCD de 36 y 60\"\n        _ = assert true (math is prime 97) \"97 es primo\"\n        echo \"[PASS] suite matematicas\"\n```\n\n### Receta 2: Composición segura y sin efectos laterales\n\nToda función de la lib `test` es componible con el resto de las 32 libs de `ridgun-libs`:\n\n```ridgun\nimport test\n\nfn :: verificar codigo sistema (rc : Int) => ()\n      verificar codigo sistema rc =\n        assert ok rc \"operacion de descriptor exitosa\"\n```\n\n---\n\n## 5. Bajo el capó: rendimiento, memoria RMM y garantías\n\n- **Garantía algorítmica y de seguridad**: Las 30 suites de pruebas de `ridgun-libs` (`src/test/ridgun/test_*.rg`, más de 4 000 líneas) se ejecutan con esta misma lib mediante `stable test`.\n- **Memoria determinista (`RMM1`/`RMM2`)**: Cero pausas de recolector de basura; todas las estructuras intermedias se liberan de forma determinista al salir del ámbito.\n- **Verificación continua**: Probada exhaustivamente con `stable check` y la suite automatizada `src/test/ridgun/test_test.rg`.\n"}, {"num": "22", "slug": "22-lib-posix-capa-pal-relojes-y-senales", "file": "22-lib-posix-capa-pal-relojes-y-senales.md", "title": "Capítulo 22: La lib `posix` — Capa de Abstracción de Plataforma (PAL), Relojes, Señales y CSPRNG", "short_title": "La lib `posix` — Capa de Abstracción de Plataforma (PAL), Relojes, Señales y CSPRNG", "markdown": "# Capítulo 22: La lib `posix` — Capa de Abstracción de Plataforma (PAL), Relojes, Señales y CSPRNG\n\n## 1. ¿Por qué existe la lib `posix`?\n\nSeamos sinceros: las banderas como `O_CREAT`, `O_NONBLOCK` o los números de syscall cambian entre Linux, macOS y arquitecturas (`X86_64` vs `Arm64`), y en C todo se resuelve con una jungla ilegible de `#ifdef`.\n\nLa lib **`posix`** implementa la **Capa de Abstracción de Plataforma (PAL)** de 2 niveles de Ridgun usando guardas tabulares sobre `sys os` (`Linux | MacOS | Windows`) y `sys arch` (`X86_64 | Arm64 | RiscV64`), además de sondeo de descriptores (`wait fd` / `PollStatus`), relojes monótonos y de pared (`RGF-017`), señales (`RGF-018`) y entropía CSPRNG del kernel (`sys random bytes`).\n\n---\n\n## 2. Artefactos, importación y arquitectura sin `libc`\n\nEn `ridgun-libs`, **`posix`** es una **lib** de primera clase ubicada en `src/main/ridgun/lib/posix.rg` (dominio `POSIX`). Al compilar con `stable bundle`, se empaqueta en tres formatos nativos:\n\n| Artefacto | Ruta | Propósito |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/posix.rglib` | Distribución e importación directa con `import posix` |\n| **Archivo compilado** | `target/posix.rgc` | Artefacto intermedio verificado por `ridgunc` |\n| **Objeto compartido ELF64** | `target/libposix.so` | Biblioteca dinámica nativa sin dependencias de C ni `libc` |\n\n> Para usar esta lib en cualquier archivo `.rg`, basta con declarar `import posix` en el encabezado y llamar a sus funciones con espacios o guiones bajos indistintamente.\n\n---\n\n## 3. Referencia rápida de la API de `posix`\n\n| Firma / Función / Tipo | Qué hace y cuándo usarla |\n|---|---|\n| `pal open create trunc wr / pal o nonblock` | Traducción de banderas del SO según `sys os` (`Linux | MacOS | Windows`) |\n| `wait fd : Int -> Int -> Int -> PollStatus` | Sondea un descriptor devolviendo `PollReady`, `PollTimeout` o `PollError errno` |\n| `clock monotonic ms / clock monotonic ns / clock wall ms` | Relojes monótonos y reloj de pared UTC en milisegundos (`RGF-017`) |\n| `signal watch / signal poll / sys random bytes` | Sondeo no bloqueante de señales (`SIGINT`, `SIGTERM`) y bytes CSPRNG del kernel |\n| `read text / write text / file exists / run cmd` | E/S de archivos de alto nivel, directorios y ejecución de subprocesos |\n\n---\n\n## 4. Recetas prácticas en estilo tabular\n\n### Receta 1: Flujo principal con `posix`\n\nObserva cómo los signos `=` y los pasos de transformación quedan alineados como una tabla limpia:\n\n```ridgun\nimport posix\n\nfn :: medir operacion () => (Int, Int)\n      medir operacion =\n        t0  = clock monotonic ms\n        rnd = len (sys random bytes 32)\n        t1  = clock monotonic ms\n        (rnd, t1 - t0)\n```\n\n### Receta 2: Composición segura y sin efectos laterales\n\nToda función de la lib `posix` es componible con el resto de las 32 libs de `ridgun-libs`:\n\n```ridgun\nimport posix\n\nfn :: esperar lectura (fd : Int) => Bool\n      esperar lectura fd =\n        est = wait fd fd poll_in 100\n        est == PollReady\n```\n\n---\n\n## 5. Bajo el capó: rendimiento, memoria RMM y garantías\n\n- **Garantía algorítmica y de seguridad**: Las ramas de `sys os` y `sys arch` que no corresponden al binario destino son eliminadas en tiempo de compilación (Dead-Code Elimination) por `ridgunc`.\n- **Memoria determinista (`RMM1`/`RMM2`)**: Cero pausas de recolector de basura; todas las estructuras intermedias se liberan de forma determinista al salir del ámbito.\n- **Verificación continua**: Probada exhaustivamente con `stable check` y la suite automatizada `src/test/ridgun/test_posix.rg`.\n"}, {"num": "23", "slug": "23-lib-io-entrada-salida-con-timeout", "file": "23-lib-io-entrada-salida-con-timeout.md", "title": "Capítulo 23: La lib `io` — Errores Tipados `IoResult`, E/S con `with timeout` y Procesos", "short_title": "La lib `io` — Errores Tipados `IoResult`, E/S con `with timeout` y Procesos", "markdown": "# Capítulo 23: La lib `io` — Errores Tipados `IoResult`, E/S con `with timeout` y Procesos\n\n## 1. ¿Por qué existe la lib `io`?\n\nSeamos sinceros: una llamada a `read()` o un subproceso hijo sin fecha límite (`timeout`) es una invitación a que un solo recurso colgado agote todos los trabajadores de tu servidor.\n\nLa lib **`io`** modela cada operación del sistema con ADTs explícitos (`IoError`, `IoResult[A]`), combina `ppoll` no bloqueante con cuotas léxicas `with timeout wait_ms do` de Ridgun y ofrece los operadores mixfix `read fd ... timeout` y `write fd ... timeout`.\n\n---\n\n## 2. Artefactos, importación y arquitectura sin `libc`\n\nEn `ridgun-libs`, **`io`** es una **lib** de primera clase ubicada en `src/main/ridgun/lib/io.rg` (dominio `IO`). Al compilar con `stable bundle`, se empaqueta en tres formatos nativos:\n\n| Artefacto | Ruta | Propósito |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/io.rglib` | Distribución e importación directa con `import io` |\n| **Archivo compilado** | `target/io.rgc` | Artefacto intermedio verificado por `ridgunc` |\n| **Objeto compartido ELF64** | `target/libio.so` | Biblioteca dinámica nativa sin dependencias de C ni `libc` |\n\n> Para usar esta lib en cualquier archivo `.rg`, basta con declarar `import io` en el encabezado y llamar a sus funciones con espacios o guiones bajos indistintamente.\n\n---\n\n## 3. Referencia rápida de la API de `io`\n\n| Firma / Función / Tipo | Qué hace y cuándo usarla |\n|---|---|\n| `type IoError / type IoResult[A]` | `IoNotFound | IoPermission | IoTimeout | IoRefused | IoReset | IoEOF | IoInvalid | IoSysError` |\n| `io read with timeout / io write with timeout` | Lectura/escritura no bloqueante de descriptor acotada por `wait_ms` |\n| `read fd N max M timeout T / write fd N data S timeout T` | Operadores mixfix ergonómicos (`op ::`) para E/S de descriptor con fecha límite |\n| `io read file / io write file / io read lines` | Funciones seguras de archivos y flujos de líneas que devuelven `IoResult` |\n| `exec with timeout : String -> Int -> IoResult[ProcStatus]` | Ejecuta un comando externo acotado por una cuota léxica `with timeout` |\n\n---\n\n## 4. Recetas prácticas en estilo tabular\n\n### Receta 1: Flujo principal con `io`\n\nObserva cómo los signos `=` y los pasos de transformación quedan alineados como una tabla limpia:\n\n```ridgun\nimport io\n\nfn :: leer peticion segura (fd : Int) => String\n      leer peticion segura fd =\n        res = read fd fd max 4096 timeout 250\n        io unwrap or res \"\"\n```\n\n### Receta 2: Composición segura y sin efectos laterales\n\nToda función de la lib `io` es componible con el resto de las 32 libs de `ridgun-libs`:\n\n```ridgun\nimport io\n\nfn :: describir fallo () => String\n      describir fallo =\n        format io error (IoTimeout \"read\" 250)\n```\n\n---\n\n## 5. Bajo el capó: rendimiento, memoria RMM y garantías\n\n- **Garantía algorítmica y de seguridad**: Ninguna lectura, escritura o comando ejecutado a través de `io` con cuota `wait_ms` puede bloquear indefinidamente el hilo o actor llamante.\n- **Memoria determinista (`RMM1`/`RMM2`)**: Cero pausas de recolector de basura; todas las estructuras intermedias se liberan de forma determinista al salir del ámbito.\n- **Verificación continua**: Probada exhaustivamente con `stable check` y la suite automatizada `src/test/ridgun/test_io.rg`.\n"}, {"num": "24", "slug": "24-lib-crypto-sha256-hmac-pbkdf2-y-aead", "file": "24-lib-crypto-sha256-hmac-pbkdf2-y-aead.md", "title": "Capítulo 24: La lib `crypto` — SHA-256, HMAC, PBKDF2, Argon2id y ChaCha20-Poly1305 AEAD", "short_title": "La lib `crypto` — SHA-256, HMAC, PBKDF2, Argon2id y ChaCha20-Poly1305 AEAD", "markdown": "# Capítulo 24: La lib `crypto` — SHA-256, HMAC, PBKDF2, Argon2id y ChaCha20-Poly1305 AEAD\n\n## 1. ¿Por qué existe la lib `crypto`?\n\nSeamos sinceros: comparar un HMAC con `==` abre la puerta a ataques de temporización (*timing attacks*), y depender de `libssl.so` para calcular un `SHA-256` o cifrar con `ChaCha20-Poly1305` rompe la portabilidad estática de cualquier binario.\n\nLa lib **`crypto`** implementa al 100 % en Ridgun puro sobre `Tensor[Int]` preasignado: operaciones de bytes/bits (`RGF-019`), **FIPS 180-4 SHA-256**, **RFC 2104 HMAC-SHA-256**, igualdad en tiempo constante (`ct equal`), **RFC 8018 PBKDF2-HMAC-SHA-256** con precomputación del estado intermedio SHA-256, fachada **Argon2id** de 5 argumentos y cifrado autenticado **RFC 8439 ChaCha20-Poly1305 AEAD** (`aead seal` / `aead open`).\n\n---\n\n## 2. Artefactos, importación y arquitectura sin `libc`\n\nEn `ridgun-libs`, **`crypto`** es una **lib** de primera clase ubicada en `src/main/ridgun/lib/crypto.rg` (dominio `CRYPTO`). Al compilar con `stable bundle`, se empaqueta en tres formatos nativos:\n\n| Artefacto | Ruta | Propósito |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/crypto.rglib` | Distribución e importación directa con `import crypto` |\n| **Archivo compilado** | `target/crypto.rgc` | Artefacto intermedio verificado por `ridgunc` |\n| **Objeto compartido ELF64** | `target/libcrypto.so` | Biblioteca dinámica nativa sin dependencias de C ni `libc` |\n\n> Para usar esta lib en cualquier archivo `.rg`, basta con declarar `import crypto` en el encabezado y llamar a sus funciones con espacios o guiones bajos indistintamente.\n\n---\n\n## 3. Referencia rápida de la API de `crypto`\n\n| Firma / Función / Tipo | Qué hace y cuándo usarla |\n|---|---|\n| `sha256 bytes / sha256 hex` | Resumen binario de 32 bytes o hexadecimal de 64 caracteres FIPS 180-4 SHA-256 |\n| `hmac sha256 / hmac sha256 hex / ct equal` | MAC con clave RFC 2104 y comparación de acumulador en tiempo constante |\n| `pbkdf2 hmac sha256 : String -> String -> Int -> Int -> String` | Derivación de claves RFC 8018 con estados intermedios SHA-256 precomputados |\n| `argon2id hash / argon2id verify` | Hashing de contraseñas PHC RFC 9106 de 5 argumentos y verificación en tiempo constante |\n| `aead seal / aead open` | Cifrado autenticado RFC 8439 ChaCha20-Poly1305 y descifrado con verificación de tag |\n\n---\n\n## 4. Recetas prácticas en estilo tabular\n\n### Receta 1: Flujo principal con `crypto`\n\nObserva cómo los signos `=` y los pasos de transformación quedan alineados como una tabla limpia:\n\n```ridgun\nimport crypto\n\nfn :: cifrar mensaje sesion (secreto : String) (texto : String) => (Int, String)\n      cifrar mensaje sesion secreto texto =\n        key32   = sha256 bytes secreto\n        nonce12 = \"0123456789ab\"\n        aad     = \"canal-autenticado\"\n        sellado = aead seal key32 nonce12 aad texto\n        aead open key32 nonce12 aad sellado\n```\n\n### Receta 2: Composición segura y sin efectos laterales\n\nToda función de la lib `crypto` es componible con el resto de las 32 libs de `ridgun-libs`:\n\n```ridgun\nimport crypto\n\nfn :: verificar firma webhook (clave : String) (cuerpo : String) (firma_hex : String) => Bool\n      verificar firma webhook clave cuerpo firma_hex =\n        esperada = hmac sha256 hex clave cuerpo\n        ct equal esperada firma_hex\n```\n\n---\n\n## 5. Bajo el capó: rendimiento, memoria RMM y garantías\n\n- **Garantía algorítmica y de seguridad**: `aead open` verifica el tag Poly1305 de 16 bytes en tiempo constante antes de devolver un solo byte de texto plano (si falla, devuelve `(-1, \"\")`).\n- **Memoria determinista (`RMM1`/`RMM2`)**: Cero pausas de recolector de basura; todas las estructuras intermedias se liberan de forma determinista al salir del ámbito.\n- **Verificación continua**: Probada exhaustivamente con `stable check` y la suite automatizada `src/test/ridgun/test_crypto.rg`.\n"}, {"num": "25", "slug": "25-lib-argon2id-hashing-rfc9106-y-owasp", "file": "25-lib-argon2id-hashing-rfc9106-y-owasp.md", "title": "Capítulo 25: La lib `argon2id` — RFC 9106 Argon2id sobre `Tensor[U64 * 8 * 16]`, Blake2b y Presets OWASP", "short_title": "La lib `argon2id` — RFC 9106 Argon2id sobre `Tensor[U64 * 8 * 16]`, Blake2b y Presets OWASP", "markdown": "# Capítulo 25: La lib `argon2id` — RFC 9106 Argon2id sobre `Tensor[U64 * 8 * 16]`, Blake2b y Presets OWASP\n\n## 1. ¿Por qué existe la lib `argon2id`?\n\nSeamos sinceros: guardar contraseñas con un simple SHA-256 permite que una GPU moderna pruebe miles de millones de combinaciones por segundo, pero enlazar bibliotecas C externas para tener Argon2id suele traer dolores de cabeza de compilación y memoria.\n\nLa lib **`argon2id`** implementa **RFC 9106 Argon2id** y **RFC 7693 Blake2b-512** al 100 % en Ridgun puro operando directamente sobre bloques nativos `Tensor[U64 * 8 * 16]` (1 024 bytes por bloque en memoria contigua RMM2), con generación de cadenas **PHC** (`$argon2id$v=19$m=...,t=...,p=...$`), perfiles **OWASP** (`owaspfirst`, `owaspsecond`), soporte de *pepper* (`argon2id hash ctx`), derivación de claves (`argon2id derive key`) y detección de actualización de parámetros (`argon2id needs rehash`).\n\n---\n\n## 2. Artefactos, importación y arquitectura sin `libc`\n\nEn `ridgun-libs`, **`argon2id`** es una **lib** de primera clase ubicada en `src/main/ridgun/lib/argon2id.rg` (dominio `CRYPTO`). Al compilar con `stable bundle`, se empaqueta en tres formatos nativos:\n\n| Artefacto | Ruta | Propósito |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/argon2id.rglib` | Distribución e importación directa con `import argon2id` |\n| **Archivo compilado** | `target/argon2id.rgc` | Artefacto intermedio verificado por `ridgunc` |\n| **Objeto compartido ELF64** | `target/libargon2id.so` | Biblioteca dinámica nativa sin dependencias de C ni `libc` |\n\n> Para usar esta lib en cualquier archivo `.rg`, basta con declarar `import argon2id` en el encabezado y llamar a sus funciones con espacios o guiones bajos indistintamente.\n\n---\n\n## 3. Referencia rápida de la API de `argon2id`\n\n| Firma / Función / Tipo | Qué hace y cuándo usarla |\n|---|---|\n| `argon2id hash / argon2id verify` | Hashing PHC RFC 9106 de 6 argumentos (`pwd, salt, m_kib, t, p, tag_len`) y verificación en tiempo constante |\n| `argon2id hash with preset / argon2id params preset` | Perfiles con nombre: `\"interactive\"`, `\"owaspfirst\"` (`19456 KiB, t=2`), `\"owaspsecond\"` (`47104 KiB, t=1`), `\"moderate\"`, `\"sensitive\"` |\n| `argon2id hash ctx / argon2id verify ctx` | Hashing RFC 9106 con secreto `pepper` ($K$) y datos asociados ($X$) |\n| `argon2id derive key / argon2id needs rehash` | Derivación de clave binaria cruda y detección de necesidad de rehash en cadenas PHC |\n| `blake2b / blake2b hex` | Resumen criptográfico de propósito general RFC 7693 Blake2b (`1..64` bytes) |\n\n---\n\n## 4. Recetas prácticas en estilo tabular\n\n### Receta 1: Flujo principal con `argon2id`\n\nObserva cómo los signos `=` y los pasos de transformación quedan alineados como una tabla limpia:\n\n```ridgun\nimport argon2id\n\nfn :: proteger clave usuario (clave : String) => (String, Bool, Bool)\n      proteger clave usuario clave =\n        phc    = argon2id hash clave \"sal-unica-16byte\" 32 2 1 32\n        valido = argon2id verify clave phc\n        rehash = argon2id needs rehash phc 19456 2 1 32\n        (phc, valido, rehash)\n```\n\n### Receta 2: Composición segura y sin efectos laterales\n\nToda función de la lib `argon2id` es componible con el resto de las 32 libs de `ridgun-libs`:\n\n```ridgun\nimport argon2id\n\nfn :: derivar clave maestra (frase : String) (sal : String) => String\n      derivar clave maestra frase sal =\n        -- Deriva 32 bytes crudos listos para ChaCha20-Poly1305 AEAD\n        argon2id derive key frase sal 64 2 1 32\n```\n\n---\n\n## 5. Bajo el capó: rendimiento, memoria RMM y garantías\n\n- **Garantía algorítmica y de seguridad**: Coincidencia byte a byte con los vectores oficiales RFC 9106 §5.3 y OpenSSL 3.5, operando sobre `Tensor[U64 * 8 * 16]` sin una sola línea de C.\n- **Memoria determinista (`RMM1`/`RMM2`)**: Cero pausas de recolector de basura; todas las estructuras intermedias se liberan de forma determinista al salir del ámbito.\n- **Verificación continua**: Probada exhaustivamente con `stable check` y la suite automatizada `src/test/ridgun/test_argon2id.rg`.\n"}, {"num": "26", "slug": "26-lib-jwt-tokens-rfc7519-y-aead", "file": "26-lib-jwt-tokens-rfc7519-y-aead.md", "title": "Capítulo 26: La lib `jwt` — JSON Web Tokens RFC 7519 (`HS256`) y Tokens Cifrados ChaCha20-Poly1305", "short_title": "La lib `jwt` — JSON Web Tokens RFC 7519 (`HS256`) y Tokens Cifrados ChaCha20-Poly1305", "markdown": "# Capítulo 26: La lib `jwt` — JSON Web Tokens RFC 7519 (`HS256`) y Tokens Cifrados ChaCha20-Poly1305\n\n## 1. ¿Por qué existe la lib `jwt`?\n\nSeamos sinceros: el ecosistema JWT es famoso por vulnerabilidades donde un atacante cambia la cabecera a `\"alg\":\"none\"` y el servidor acepta el token sin firma, o donde se guarda información sensible en un JWT olvidando que su payload solo está codificado en Base64url, no cifrado.\n\nLa lib **`jwt`** resuelve ambos mundos: firma y verifica **JWTs RFC 7519 (`HS256`)** exigiendo explícitamente `alg == \"HS256\"`, comparando el HMAC en tiempo constante y validando `exp`/`nbf`, y además ofrece **`token seal` / `token open`** para emitir tokens opacos autenticados y cifrados con **ChaCha20-Poly1305 AEAD**.\n\n---\n\n## 2. Artefactos, importación y arquitectura sin `libc`\n\nEn `ridgun-libs`, **`jwt`** es una **lib** de primera clase ubicada en `src/main/ridgun/lib/jwt.rg` (dominio `JWT`). Al compilar con `stable bundle`, se empaqueta en tres formatos nativos:\n\n| Artefacto | Ruta | Propósito |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/jwt.rglib` | Distribución e importación directa con `import jwt` |\n| **Archivo compilado** | `target/jwt.rgc` | Artefacto intermedio verificado por `ridgunc` |\n| **Objeto compartido ELF64** | `target/libjwt.so` | Biblioteca dinámica nativa sin dependencias de C ni `libc` |\n\n> Para usar esta lib en cualquier archivo `.rg`, basta con declarar `import jwt` en el encabezado y llamar a sus funciones con espacios o guiones bajos indistintamente.\n\n---\n\n## 3. Referencia rápida de la API de `jwt`\n\n| Firma / Función / Tipo | Qué hace y cuándo usarla |\n|---|---|\n| `type JwtResult` | `JwtOk JsonVal | JwtExpired | JwtNotYetValid | JwtBadSignature | JwtMalformed` |\n| `jwt sign hs256 / jwt verify hs256` | Firma claims `JsonVal` y verifica firma + `alg == \"HS256\"` + ventanas `exp`/`nbf` |\n| `jwt claims / jwt get str / jwt get int` | Construye claims estándar `(sub, iss, iat, exp)` y consulta payloads verificados |\n| `token seal / token open` | Cifra y autentica tokens JSON opacos mediante ChaCha20-Poly1305 AEAD |\n\n---\n\n## 4. Recetas prácticas en estilo tabular\n\n### Receta 1: Flujo principal con `jwt`\n\nObserva cómo los signos `=` y los pasos de transformación quedan alineados como una tabla limpia:\n\n```ridgun\nimport jwt\nimport json\n\nfn :: emitir y verificar sesion (secreto : String) => (String, String)\n      emitir y verificar sesion secreto =\n        claims = jwt claims \"user-42\" \"solstice\" 1700000000 1700003600\n        tok    = jwt sign hs256 secreto claims\n        res    = jwt verify hs256 secreto tok 1700001000\n        sub    = jwt get str res \"sub\" \"anonimo\"\n        (tok, sub)\n```\n\n### Receta 2: Composición segura y sin efectos laterales\n\nToda función de la lib `jwt` es componible con el resto de las 32 libs de `ridgun-libs`:\n\n```ridgun\nimport jwt\nimport json\n\nfn :: sellar token confidencial (clave : String) => JwtResult\n      sellar token confidencial clave =\n        datos = JnObj [(\"rol\", JnStr \"root\"), (\"pin\", JnInt 9988)]\n        sobre = token seal clave \"nonce-12byte\" datos\n        token open clave sobre\n```\n\n---\n\n## 5. Bajo el capó: rendimiento, memoria RMM y garantías\n\n- **Garantía algorítmica y de seguridad**: Inmunidad total al ataque `\"alg\":\"none\"` (cualquier cabecera cuyo `alg` no sea exactamente `\"HS256\"` devuelve `JwtBadSignature`) y comparación de firma en tiempo constante.\n- **Memoria determinista (`RMM1`/`RMM2`)**: Cero pausas de recolector de basura; todas las estructuras intermedias se liberan de forma determinista al salir del ámbito.\n- **Verificación continua**: Probada exhaustivamente con `stable check` y la suite automatizada `src/test/ridgun/test_jwt.rg`.\n"}, {"num": "27", "slug": "27-lib-socket-redes-dns-y-kernel-sockets", "file": "27-lib-socket-redes-dns-y-kernel-sockets.md", "title": "Capítulo 27: La lib `socket` — TCP, UDP, AF_UNIX, Framing, DNS RFC 1035 y Kernel Sockets (`RGF-001`)", "short_title": "La lib `socket` — TCP, UDP, AF_UNIX, Framing, DNS RFC 1035 y Kernel Sockets (`RGF-001`)", "markdown": "# Capítulo 27: La lib `socket` — TCP, UDP, AF_UNIX, Framing, DNS RFC 1035 y Kernel Sockets (`RGF-001`)\n\n## 1. ¿Por qué existe la lib `socket`?\n\nSeamos sinceros: programar sockets BSD en C con `struct sockaddr_in`, `htons`, `inet_pton` y `getaddrinfo` (que además arrastra `libnss` de `glibc`) es un ritual arcano de los años 80.\n\nLa lib **`socket`** ofrece dos capas complementarias sin una línea de C: (1) la API de descriptores del kernel **`RGF-001`** para servidores de producción como **Solstice** (`sys tcp listen`, `sys tcp listen reuseport`, `sys accept`, `sys tcp connect`, `sys send`, `sys recv`, `sys resolve ipv4` mediante `/etc/hosts` + paquetes DNS UDP RFC 1035 en el puerto 53) y (2) la máquina de estados funcional inmutable `Socket` con framing prefijado por longitud, líneas CRLF y subredes CIDR.\n\n---\n\n## 2. Artefactos, importación y arquitectura sin `libc`\n\nEn `ridgun-libs`, **`socket`** es una **lib** de primera clase ubicada en `src/main/ridgun/lib/socket.rg` (dominio `SOCK`). Al compilar con `stable bundle`, se empaqueta en tres formatos nativos:\n\n| Artefacto | Ruta | Propósito |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/socket.rglib` | Distribución e importación directa con `import socket` |\n| **Archivo compilado** | `target/socket.rgc` | Artefacto intermedio verificado por `ridgunc` |\n| **Objeto compartido ELF64** | `target/libsocket.so` | Biblioteca dinámica nativa sin dependencias de C ni `libc` |\n\n> Para usar esta lib en cualquier archivo `.rg`, basta con declarar `import socket` en el encabezado y llamar a sus funciones con espacios o guiones bajos indistintamente.\n\n---\n\n## 3. Referencia rápida de la API de `socket`\n\n| Firma / Función / Tipo | Qué hace y cuándo usarla |\n|---|---|\n| `sys tcp listen / sys tcp listen reuseport / sys unix listen` | Enlaza y escucha en TCP IPv4 (`SO_REUSEADDR` / `SO_REUSEPORT`) o `AF_UNIX` |\n| `sys accept / sys tcp connect / sys unix connect` | `accept` y `connect` acotados por timeout devolviendo `SockFdResult` / `SockAcceptResult` |\n| `sys send / sys recv / sys shutdown write` | Envío, recepción y cierre de escritura (`SHUT_WR`) de socket con timeout |\n| `sys resolve ipv4 / dns resolve a` | Resolución IPv4 pura en Ridgun mediante `/etc/hosts` y consultas DNS UDP RFC 1035 |\n| `sock send frame / sock recv frame / ipv4 in cidr` | Framing prefijado por longitud (`N:payload`) y coincidencia de subredes CIDR IPv4 |\n\n---\n\n## 4. Recetas prácticas en estilo tabular\n\n### Receta 1: Flujo principal con `socket`\n\nObserva cómo los signos `=` y los pasos de transformación quedan alineados como una tabla limpia:\n\n```ridgun\nimport socket\n\nfn :: eco tcp local () => String\n      eco tcp local =\n        l_res = sys tcp listen \"127.0.0.1\" 0 16\n        lfd   = sock fd l_res\n        port  = sys local port lfd\n        c_res = sys tcp connect \"127.0.0.1\" port 1000\n        cfd   = sock fd c_res\n        a_res = sys accept lfd 1000\n        sfd   = sock accept fd a_res\n        _     = sys send cfd \"hola-solstice\" 1000\n        r_res = sys recv sfd 64 1000\n        datos = sock recv data r_res\n        _     = sys_close cfd\n        _     = sys_close sfd\n        _     = sys_close lfd\n        datos\n```\n\n### Receta 2: Composición segura y sin efectos laterales\n\nToda función de la lib `socket` es componible con el resto de las 32 libs de `ridgun-libs`:\n\n```ridgun\nimport socket\n\nfn :: verificar ip interna (ip : String) => Bool\n      verificar ip interna ip =\n        ipv4 in cidr ip \"10.0.0.0/8\"\n```\n\n---\n\n## 5. Bajo el capó: rendimiento, memoria RMM y garantías\n\n- **Garantía algorítmica y de seguridad**: Actualización de registros con sintaxis inmutable `s with field = val`, resolución DNS sin `glibc`/`libnss` y códigos de estado deterministas (`0` OK, `-1` EOF, `-2` TIMEOUT, `-3` REFUSED).\n- **Memoria determinista (`RMM1`/`RMM2`)**: Cero pausas de recolector de basura; todas las estructuras intermedias se liberan de forma determinista al salir del ámbito.\n- **Verificación continua**: Probada exhaustivamente con `stable check` y la suite automatizada `src/test/ridgun/test_socket.rg`.\n"}, {"num": "28", "slug": "28-lib-http-uris-http11-y-cliente-tcp", "file": "28-lib-http-uris-http11-y-cliente-tcp.md", "title": "Capítulo 28: La lib `http` — URIs RFC 3986, Codec HTTP/1.1 RFC 9112 y Cliente TCP en Vivo", "short_title": "La lib `http` — URIs RFC 3986, Codec HTTP/1.1 RFC 9112 y Cliente TCP en Vivo", "markdown": "# Capítulo 28: La lib `http` — URIs RFC 3986, Codec HTTP/1.1 RFC 9112 y Cliente TCP en Vivo\n\n## 1. ¿Por qué existe la lib `http`?\n\nSeamos sinceros: si no filtras saltos `\\r\\n` en los valores de las cabeceras HTTP, un atacante puede inyectar cabeceras falsas o dividir la respuesta (*CRLF Response Splitting*), y enlazar `libcurl` para hacer un simple `GET` o `POST` es excesivo.\n\nLa lib **`http`** implementa descomposición de **URIs RFC 3986**, construcción y análisis de peticiones y respuestas **HTTP/1.1 RFC 9112** con sanitización automática de CRLF (`VUL-INJ-002`) y `Content-Length` automático, extracción de tokens `Bearer` y un **cliente HTTP/1.1 en vivo sobre sockets TCP del kernel** (`http get`, `http post`, `http request tcp`).\n\n---\n\n## 2. Artefactos, importación y arquitectura sin `libc`\n\nEn `ridgun-libs`, **`http`** es una **lib** de primera clase ubicada en `src/main/ridgun/lib/http.rg` (dominio `HTTP`). Al compilar con `stable bundle`, se empaqueta en tres formatos nativos:\n\n| Artefacto | Ruta | Propósito |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/http.rglib` | Distribución e importación directa con `import http` |\n| **Archivo compilado** | `target/http.rgc` | Artefacto intermedio verificado por `ridgunc` |\n| **Objeto compartido ELF64** | `target/libhttp.so` | Biblioteca dinámica nativa sin dependencias de C ni `libc` |\n\n> Para usar esta lib en cualquier archivo `.rg`, basta con declarar `import http` en el encabezado y llamar a sus funciones con espacios o guiones bajos indistintamente.\n\n---\n\n## 3. Referencia rápida de la API de `http`\n\n| Firma / Función / Tipo | Qué hace y cuándo usarla |\n|---|---|\n| `uri parse / uri scheme / uri host / uri port / uri path / uri query` | Descompone URIs RFC 3986 con puertos por defecto automáticos (`80` en `http`, `443` en `https`) |\n| `http build request / http parse request` | Formatea y analiza peticiones HTTP/1.1 con sanitización CRLF de cabeceras |\n| `http build response / http parse response` | Formatea y analiza respuestas HTTP/1.1 con frases de estado estándar |\n| `http header get / http bearer token` | Búsqueda de cabeceras insensible a mayúsculas y extracción de `Authorization: Bearer <token>` |\n| `http get / http post / http request tcp` | Ejecuta llamadas HTTP/1.1 en vivo sobre sockets TCP del kernel con `timeout_ms` |\n\n---\n\n## 4. Recetas prácticas en estilo tabular\n\n### Receta 1: Flujo principal con `http`\n\nObserva cómo los signos `=` y los pasos de transformación quedan alineados como una tabla limpia:\n\n```ridgun\nimport http\n\nfn :: inspeccionar endpoint (url : String) => (String, Int, String, String)\n      inspeccionar endpoint url =\n        host = uri host url\n        port = uri port url\n        path = uri path url\n        wire = http build request \"GET\" path [(\"Host\", host)] \"\"\n        (host, port, path, wire)\n```\n\n### Receta 2: Composición segura y sin efectos laterales\n\nToda función de la lib `http` es componible con el resto de las 32 libs de `ridgun-libs`:\n\n```ridgun\nimport http\n\nfn :: extraer credenciales (raw_req : String) => (String, String)\n      extraer credenciales raw_req =\n        (metodo, ruta, _, hdrs_raw, _) = http parse request raw_req\n        hdrs = http parse headers hdrs_raw\n        tok  = http bearer token hdrs\n        (metodo + \" \" + ruta, tok)\n```\n\n---\n\n## 5. Bajo el capó: rendimiento, memoria RMM y garantías\n\n- **Garantía algorítmica y de seguridad**: Sanitización automática de `\\r` y `\\n` en todas las cabeceras (`http sanitize header`) para impedir ataques de división de respuesta HTTP.\n- **Memoria determinista (`RMM1`/`RMM2`)**: Cero pausas de recolector de basura; todas las estructuras intermedias se liberan de forma determinista al salir del ámbito.\n- **Verificación continua**: Probada exhaustivamente con `stable check` y la suite automatizada `src/test/ridgun/test_http.rg`.\n"}, {"num": "29", "slug": "29-lib-ws-protocolo-websocket-rfc6455", "file": "29-lib-ws-protocolo-websocket-rfc6455.md", "title": "Capítulo 29: La lib `ws` — Handshake WebSocket RFC 6455, Framing de 16/64 bits y Enmascarado XOR", "short_title": "La lib `ws` — Handshake WebSocket RFC 6455, Framing de 16/64 bits y Enmascarado XOR", "markdown": "# Capítulo 29: La lib `ws` — Handshake WebSocket RFC 6455, Framing de 16/64 bits y Enmascarado XOR\n\n## 1. ¿Por qué existe la lib `ws`?\n\nSeamos sinceros: el protocolo WebSocket (RFC 6455) combina un handshake SHA-1 + Base64 con tramas binarias de longitud variable (7 bits, 16 bits o 64 bits) y enmascarado XOR obligatorio de cliente a servidor.\n\nLa lib **`ws`** implementa **RFC 6455** completo en Ridgun puro: cálculo de `Sec-WebSocket-Accept` (con SHA-1 RFC 3174 integrado exclusivamente para el GUID de handshake), cabeceras HTTP `101 Switching Protocols`, codificación y decodificación de tramas (`WsFrame`) con longitudes de 7, 16 (`126`) y 64 bits (`127`), enmascarado simétrico XOR y constructores de tramas de texto, ping, pong y cierre.\n\n---\n\n## 2. Artefactos, importación y arquitectura sin `libc`\n\nEn `ridgun-libs`, **`ws`** es una **lib** de primera clase ubicada en `src/main/ridgun/lib/ws.rg` (dominio `WS`). Al compilar con `stable bundle`, se empaqueta en tres formatos nativos:\n\n| Artefacto | Ruta | Propósito |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/ws.rglib` | Distribución e importación directa con `import ws` |\n| **Archivo compilado** | `target/ws.rgc` | Artefacto intermedio verificado por `ridgunc` |\n| **Objeto compartido ELF64** | `target/libws.so` | Biblioteca dinámica nativa sin dependencias de C ni `libc` |\n\n> Para usar esta lib en cualquier archivo `.rg`, basta con declarar `import ws` en el encabezado y llamar a sus funciones con espacios o guiones bajos indistintamente.\n\n---\n\n## 3. Referencia rápida de la API de `ws`\n\n| Firma / Función / Tipo | Qué hace y cuándo usarla |\n|---|---|\n| `ws accept key : String -> String` | Calcula `Sec-WebSocket-Accept` (RFC 6455 §1.3) a partir de `Sec-WebSocket-Key` |\n| `ws build upgrade request / ws build upgrade response` | Formatea los mensajes HTTP/1.1 de negociación (upgrade handshake) WebSocket |\n| `ws encode frame / ws decode frame` | Codifica y decodifica tramas `WsFrame` (`fin`, `opcode`, `masked`, `mask_key`, `payload`) |\n| `ws text frame / ws ping frame / ws pong frame / ws close frame` | Constructores de tramas de alto nivel y extractores de código de cierre (`1000` normal) |\n\n---\n\n## 4. Recetas prácticas en estilo tabular\n\n### Receta 1: Flujo principal con `ws`\n\nObserva cómo los signos `=` y los pasos de transformación quedan alineados como una tabla limpia:\n\n```ridgun\nimport ws\n\nfn :: negociar y enviar (client_key : String) => (String, String)\n      negociar y enviar client_key =\n        resp  = ws build upgrade response client_key\n        trama = ws encode frame (ws text frame \"hola-tiempo-real\" False \"\")\n        (resp, trama)\n```\n\n### Receta 2: Composición segura y sin efectos laterales\n\nToda función de la lib `ws` es componible con el resto de las 32 libs de `ridgun-libs`:\n\n```ridgun\nimport ws\n\nfn :: decodificar trama cliente (clave4 : String) (msg : String) => String\n      decodificar trama cliente clave4 msg =\n        wire = ws encode frame (ws text frame msg True clave4)\n        res  = ws decode frame wire\n        ws frame payload res\n```\n\n---\n\n## 5. Bajo el capó: rendimiento, memoria RMM y garantías\n\n- **Garantía algorítmica y de seguridad**: Coincidencia exacta con el vector oficial RFC 6455 (`\"dGhlIHNhbXBsZSBub25jZQ==\"` $\\rightarrow$ `\"s3pPLMBiTxaQ9kYGzzhZRbK+xOo=\"`) y desenmascarado automático en `ws decode frame`.\n- **Memoria determinista (`RMM1`/`RMM2`)**: Cero pausas de recolector de basura; todas las estructuras intermedias se liberan de forma determinista al salir del ámbito.\n- **Verificación continua**: Probada exhaustivamente con `stable check` y la suite automatizada `src/test/ridgun/test_ws.rg`.\n"}, {"num": "30", "slug": "30-lib-agent-concurrencia-de-actores", "file": "30-lib-agent-concurrencia-de-actores.md", "title": "Capítulo 30: La lib `agent` — Modelo Nativo de Actores (`agent`, `send`, `receive`), KV Store y Rate Limiter", "short_title": "La lib `agent` — Modelo Nativo de Actores (`agent`, `send`, `receive`), KV Store y Rate Limiter", "markdown": "# Capítulo 30: La lib `agent` — Modelo Nativo de Actores (`agent`, `send`, `receive`), KV Store y Rate Limiter\n\n## 1. ¿Por qué existe la lib `agent`?\n\nSeamos sinceros: compartir memoria mutable entre hilos con `Mutex`, `RwLock` y variables de condición es una fábrica inagotable de *deadlocks* y condiciones de carrera.\n\nLa lib **`agent`** aprovecha el **Modelo Nativo de Agentes** de Ridgun (`agent`, `send ... to`, `receive from`, `try receive from`, `stop`) para ofrecer buzones aislados con paso de mensajes Copy-on-Write, un almacén clave-valor concurrente (`KvStore`), un limitador de tasa por cubo de tokens (`RateBucket`) y supervisión de estado (`AgentHealth`).\n\n---\n\n## 2. Artefactos, importación y arquitectura sin `libc`\n\nEn `ridgun-libs`, **`agent`** es una **lib** de primera clase ubicada en `src/main/ridgun/lib/agent.rg` (dominio `AGENT`). Al compilar con `stable bundle`, se empaqueta en tres formatos nativos:\n\n| Artefacto | Ruta | Propósito |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/agent.rglib` | Distribución e importación directa con `import agent` |\n| **Archivo compilado** | `target/agent.rgc` | Artefacto intermedio verificado por `ridgunc` |\n| **Objeto compartido ELF64** | `target/libagent.so` | Biblioteca dinámica nativa sin dependencias de C ni `libc` |\n\n> Para usar esta lib en cualquier archivo `.rg`, basta con declarar `import agent` en el encabezado y llamar a sus funciones con espacios o guiones bajos indistintamente.\n\n---\n\n## 3. Referencia rápida de la API de `agent`\n\n| Firma / Función / Tipo | Qué hace y cuándo usarla |\n|---|---|\n| `agent roundtrip / agent drain count` | Lanza actores nativos (`agent`), intercambia mensajes (`send ... to` / `receive from`) y ejecuta `stop` |\n| `kv store new / kv store apply` | Almacén clave-valor inmutable para actores (`KvPut`, `KvGet`, `KvDelete`, `KvClear`) |\n| `rate bucket new / rate bucket allow` | Limitador de tasa por cubo de tokens que devuelve el cubo actualizado y `(allowed, remaining)` |\n| `sup mark failed / sup should restart` | Políticas de supervisión con control de presupuesto de reinicios (`max_restarts`) |\n\n---\n\n## 4. Recetas prácticas en estilo tabular\n\n### Receta 1: Flujo principal con `agent`\n\nObserva cómo los signos `=` y los pasos de transformación quedan alineados como una tabla limpia:\n\n```ridgun\nimport agent\n\nfn :: probar actor nativo () => (Int, Int)\n      probar actor nativo =\n        eco = agent roundtrip 42\n        vac = agent drain count [10, 20, 30]\n        (eco, vac)\n```\n\n### Receta 2: Composición segura y sin efectos laterales\n\nToda función de la lib `agent` es componible con el resto de las 32 libs de `ridgun-libs`:\n\n```ridgun\nimport agent\n\nfn :: aplicar limite peticion () => (Bool, Int)\n      aplicar limite peticion =\n        b0         = rate bucket new 10 2 1000\n        (b1, res1) = rate bucket allow b0 1 1000\n        rateresp allowed res1, rateobs remaining res1\n```\n\n---\n\n## 5. Bajo el capó: rendimiento, memoria RMM y garantías\n\n- **Garantía algorítmica y de seguridad**: Cero memoria mutable compartida entre actores: cada mensaje se transfiere por valor / Copy-on-Write y `stop` libera la región del agente de forma determinista.\n- **Memoria determinista (`RMM1`/`RMM2`)**: Cero pausas de recolector de basura; todas las estructuras intermedias se liberan de forma determinista al salir del ámbito.\n- **Verificación continua**: Probada exhaustivamente con `stable check` y la suite automatizada `src/test/ridgun/test_agent.rg`.\n"}, {"num": "31", "slug": "31-lib-pool-trabajadores-y-work-stealing", "file": "31-lib-pool-trabajadores-y-work-stealing.md", "title": "Capítulo 31: La lib `pool` — Pool Acotado de Trabajadores, Round-Robin y Robo de Trabajo", "short_title": "La lib `pool` — Pool Acotado de Trabajadores, Round-Robin y Robo de Trabajo", "markdown": "# Capítulo 31: La lib `pool` — Pool Acotado de Trabajadores, Round-Robin y Robo de Trabajo\n\n## 1. ¿Por qué existe la lib `pool`?\n\nSeamos sinceros: lanzar un hilo o actor nuevo por cada petición entrante sin límite superior (`unbounded spawning`) hace que un pico de tráfico agote la memoria en segundos (*Out Of Memory*).\n\nLa lib **`pool`** proporciona un despachador de tareas con **contrapresión explícita** (`PoolAccept`, `PoolRejectFull`), partición equilibrada de lotes en $K$ carriles (`pool partition`), reequilibrio por **robo de trabajo (*work-stealing*)** (`pool steal rebalance`) y ejecución paralela sobre actores nativos.\n\n---\n\n## 2. Artefactos, importación y arquitectura sin `libc`\n\nEn `ridgun-libs`, **`pool`** es una **lib** de primera clase ubicada en `src/main/ridgun/lib/pool.rg` (dominio `AGENT`). Al compilar con `stable bundle`, se empaqueta en tres formatos nativos:\n\n| Artefacto | Ruta | Propósito |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/pool.rglib` | Distribución e importación directa con `import pool` |\n| **Archivo compilado** | `target/pool.rgc` | Artefacto intermedio verificado por `ridgunc` |\n| **Objeto compartido ELF64** | `target/libpool.so` | Biblioteca dinámica nativa sin dependencias de C ni `libc` |\n\n> Para usar esta lib en cualquier archivo `.rg`, basta con declarar `import pool` en el encabezado y llamar a sus funciones con espacios o guiones bajos indistintamente.\n\n---\n\n## 3. Referencia rápida de la API de `pool`\n\n| Firma / Función / Tipo | Qué hace y cuándo usarla |\n|---|---|\n| `pool new : Int -> Int -> PoolState` | Crea un pool acotado con `workers` carriles y capacidad máxima `max_queue` |\n| `pool submit : PoolState -> PoolTask -> (PoolState, PoolDecision)` | Encola una tarea en round-robin o devuelve `PoolRejectFull` si está saturado |\n| `pool partition / pool steal rebalance` | Reparte lotes entre $K$ trabajadores y roba la mitad de una cola sobrecargada para un trabajador libre |\n| `pool map sum / pool parallel sum2` | Despacha cargas de trabajo en paralelo sobre trabajadores `agent` nativos |\n\n---\n\n## 4. Recetas prácticas en estilo tabular\n\n### Receta 1: Flujo principal con `pool`\n\nObserva cómo los signos `=` y los pasos de transformación quedan alineados como una tabla limpia:\n\n```ridgun\nimport pool\n\nfn :: encolar con contrapresion () => (Int, Int)\n      encolar con contrapresion =\n        p0        = pool new 4 16\n        tarea     = PoolTask 1 100 \"indexar-bloque\"\n        (p1, dec) = pool submit p0 tarea\n        (pool queued p1, pool accepted p1)\n```\n\n### Receta 2: Composición segura y sin efectos laterales\n\nToda función de la lib `pool` es componible con el resto de las 32 libs de `ridgun-libs`:\n\n```ridgun\nimport pool\n\nfn :: sumar en paralelo () => Int\n      sumar en paralelo =\n        pool parallel sum2 [10, 20, 30] [40, 50, 60]\n```\n\n---\n\n## 5. Bajo el capó: rendimiento, memoria RMM y garantías\n\n- **Garantía algorítmica y de seguridad**: Capacidad de cola estrictamente acotada (`queued <= max_queue`) para proteger la memoria bajo sobrecarga y reparto determinista entre trabajadores.\n- **Memoria determinista (`RMM1`/`RMM2`)**: Cero pausas de recolector de basura; todas las estructuras intermedias se liberan de forma determinista al salir del ámbito.\n- **Verificación continua**: Probada exhaustivamente con `stable check` y la suite automatizada `src/test/ridgun/test_pool.rg`.\n"}, {"num": "32", "slug": "32-lib-net-agent-supervisor-de-conexiones", "file": "32-lib-net-agent-supervisor-de-conexiones.md", "title": "Capítulo 32: La lib `net_agent` — Supervisor de Conexiones de Red y Puente de Eventos No Bloqueante", "short_title": "La lib `net_agent` — Supervisor de Conexiones de Red y Puente de Eventos No Bloqueante", "markdown": "# Capítulo 32: La lib `net_agent` — Supervisor de Conexiones de Red y Puente de Eventos No Bloqueante\n\n## 1. ¿Por qué existe la lib `net_agent`?\n\nSeamos sinceros: en un servidor real como **Solstice**, aceptar conexiones TCP es la parte fácil; lo difícil es limitar el máximo de clientes simultáneos, desconectar clientes zombis inactivos (*idle timeout*) y conectar el bucle `ppoll` con tus actores sin fugas de descriptores.\n\nLa lib **`net_agent`** cierra el círculo de `ridgun-libs` uniendo **`posix`**, **`socket`** y **`agent`**: gestiona tablas de conexiones supervisadas (`NetSupervisor`), aplica límites de concurrencia (`max_conns`), purga conexiones inactivas (`net evict idle`) y convierte eventos de descriptores del kernel en eventos tipados (`NetEvReadyRead`, `NetEvReadyWrite`, `NetEvTimeout`, `NetEvError`) además de ofrecer un paso de eco TCP completo de extremo a extremo (`net tcp echo step`).\n\n---\n\n## 2. Artefactos, importación y arquitectura sin `libc`\n\nEn `ridgun-libs`, **`net_agent`** es una **lib** de primera clase ubicada en `src/main/ridgun/lib/net_agent.rg` (dominio `AGENT`). Al compilar con `stable bundle`, se empaqueta en tres formatos nativos:\n\n| Artefacto | Ruta | Propósito |\n|---|---|---|\n| **Bundle Ridgun** | `target/bundles/net_agent.rglib` | Distribución e importación directa con `import net_agent` |\n| **Archivo compilado** | `target/net_agent.rgc` | Artefacto intermedio verificado por `ridgunc` |\n| **Objeto compartido ELF64** | `target/libnet_agent.so` | Biblioteca dinámica nativa sin dependencias de C ni `libc` |\n\n> Para usar esta lib en cualquier archivo `.rg`, basta con declarar `import net_agent` en el encabezado y llamar a sus funciones con espacios o guiones bajos indistintamente.\n\n---\n\n## 3. Referencia rápida de la API de `net_agent`\n\n| Firma / Función / Tipo | Qué hace y cuándo usarla |\n|---|---|\n| `net supervisor new : Int -> Int -> NetSupervisor` | Crea un supervisor de conexiones con límite `max_conns` e inactividad `idle_timeout_ms` |\n| `net register conn / net record rx / net record tx / net close conn` | Registra sockets aceptados, actualiza contadores de bytes/actividad y cierra pares |\n| `net evict idle : NetSupervisor -> Int -> (NetSupervisor, [Int])` | Cierra y expulsa conexiones inactivas más allá de `idle_timeout_ms`, devolviendo sus FDs |\n| `net poll fd : Int -> Bool -> Int -> NetEvent` | Puente `wait fd` no bloqueante que emite `NetEvReadyRead`, `NetEvReadyWrite`, `NetEvTimeout` o `NetEvError` |\n| `net tcp echo step : String -> Int -> (Int, String)` | Paso completo de extremo a extremo TCP loopback (`listen/connect/accept/supervise/echo`) |\n\n---\n\n## 4. Recetas prácticas en estilo tabular\n\n### Receta 1: Flujo principal con `net_agent`\n\nObserva cómo los signos `=` y los pasos de transformación quedan alineados como una tabla limpia:\n\n```ridgun\nimport net_agent\n\nfn :: supervisar clientes () => (Int, [Int])\n      supervisar clientes =\n        s0        = net supervisor new 100 5000\n        (s1, _)   = net register conn s0 10 \"10.0.0.1\" 51000 1000\n        (s2, _)   = net register conn s1 11 \"10.0.0.2\" 51001 6500\n        (s3, exp) = net evict idle s2 7000\n        (net active count s3, exp)\n```\n\n### Receta 2: Composición segura y sin efectos laterales\n\nToda función de la lib `net_agent` es componible con el resto de las 32 libs de `ridgun-libs`:\n\n```ridgun\nimport net_agent\n\nfn :: probar puente tcp supervisado () => (Int, String)\n      probar puente tcp supervisado =\n        net tcp echo step \"ping-supervisado\" 1000\n```\n\n---\n\n## 5. Bajo el capó: rendimiento, memoria RMM y garantías\n\n- **Garantía algorítmica y de seguridad**: Protección automática frente a agotamiento de descriptores (`max_conns`), expulsión determinista de conexiones inactivas y cierre garantizado de sockets en `net tcp echo step`.\n- **Memoria determinista (`RMM1`/`RMM2`)**: Cero pausas de recolector de basura; todas las estructuras intermedias se liberan de forma determinista al salir del ámbito.\n- **Verificación continua**: Probada exhaustivamente con `stable check` y la suite automatizada `src/test/ridgun/test_net_agent.rg`.\n"}];
    const UI_STRINGS = {"copy_label": "Copiar", "copied_label": "¡Copiado!", "prev_label": "&larr; Capítulo anterior", "next_label": "Siguiente capítulo &rarr;", "search_hits_label": "Resultados para", "search_empty_label": "No se encontraron coincidencias para"};
    let currentIdx = 0;

    function escapeHtml(s) {
      return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function highlightRidgun(code) {
      return code.split("\n").map(line => {
        const comIdx = (() => {
          let inD = false, inS = false;
          for (let i = 0; i < line.length - 1; i++) {
            if (line[i] === "\\") { i++; continue; }
            if (line[i] === '"' && !inS) inD = !inD;
            else if (line[i] === "'" && !inD) inS = !inS;
            else if (!inD && !inS && line[i] === "-" && line[i+1] === "-") return i;
          }
          return -1;
        })();
        const codePart = comIdx >= 0 ? line.slice(0, comIdx) : line;
        const comPart = comIdx >= 0 ? line.slice(comIdx) : "";
        let html = escapeHtml(codePart);
        html = html.replace(/("([^"\\]|\\.)*"|'[^']*')/g, '<span class="rg-str">$1</span>');
        html = html.replace(/\b(fn|op|type|import|mut|otherwise|with|region|timeout|do|global|context|shared|atomic|hardware|echo|and|or|xor|not|agent|send|to|receive|from|try|stop)\b/g, '<span class="rg-kw">$1</span>');
        html = html.replace(/\b(Int|Real|String|Char|Bool|U64|Tensor|Option|Result|Some|None|Ok|Err|OutOfMemory|Timeout|True|False)\b/g, '<span class="rg-ty">$1</span>');
        html = html.replace(/(::|=&gt;|-&gt;|&lt;-|\|\|\.|\|\||\|\.)/g, '<span class="rg-op">$1</span>');
        html = html.replace(/\b(0x[0-9a-fA-F_]+|[0-9][0-9_]*(_KB|_MB|_GB)?(\.[0-9]+)?)\b/g, '<span class="rg-num">$1</span>');
        if (comPart) {
          html += '<span class="rg-com">' + escapeHtml(comPart) + '</span>';
        }
        return html;
      }).join("\n");
    }

    function formatInline(text) {
      let out = escapeHtml(text);
      out = out.replace(/`([^`]+)`/g, "<code>$1</code>");
      out = out.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      out = out.replace(/\*([^*]+)\*/g, "<em>$1</em>");
      out = out.replace(/\$O\(([^)]+)\)\$/g, "<code>O($1)</code>");
      out = out.replace(/\$\\rightarrow\$/g, "&rarr;");
      return out;
    }

    function renderMarkdown(md) {
      const lines = md.split("\n");
      let html = "";
      let i = 0;
      while (i < lines.length) {
        const line = lines[i];
        if (line.startsWith("```")) {
          const lang = line.slice(3).trim() || "ridgun";
          i++;
          const buf = [];
          while (i < lines.length && !lines[i].startsWith("```")) {
            buf.push(lines[i]);
            i++;
          }
          i++;
          const rawCode = buf.join("\n");
          const bodyHtml = (lang === "ridgun" || lang === "") ? highlightRidgun(rawCode) : escapeHtml(rawCode);
          html += `<div class="code-wrapper"><div class="code-header"><span>${escapeHtml(lang)}</span><button class="copy-btn" onclick="copyCode(this)">${escapeHtml(UI_STRINGS.copy_label)}</button></div><pre data-raw="${ encodeURIComponent(rawCode) }"><code>${bodyHtml}</code></pre></div>`;
          continue;
        }
        if (/^---+$/.test(line.trim())) {
          html += "<hr />";
          i++;
          continue;
        }
        if (line.startsWith("# ")) {
          html += `<h1>${formatInline(line.slice(2).trim())}</h1>`;
          i++;
          continue;
        }
        if (line.startsWith("## ")) {
          html += `<h2>${formatInline(line.slice(3).trim())}</h2>`;
          i++;
          continue;
        }
        if (line.startsWith("### ")) {
          html += `<h3>${formatInline(line.slice(4).trim())}</h3>`;
          i++;
          continue;
        }
        if (line.trim().startsWith("|") && i + 1 < lines.length && /^\|[\s:-]+\|/.test(lines[i+1].trim())) {
          const headers = line.trim().slice(1, -1).split("|").map(c => formatInline(c.trim()));
          i += 2;
          const rows = [];
          while (i < lines.length && lines[i].trim().startsWith("|")) {
            rows.push(lines[i].trim().slice(1, -1).split("|").map(c => formatInline(c.trim())));
            i++;
          }
          html += '<div class="table-wrap"><table><thead><tr>' + headers.map(h => `<th>${h}</th>`).join("") + '</tr></thead><tbody>' +
                  rows.map(r => '<tr>' + r.map(c => `<td>${c}</td>`).join("") + '</tr>').join("") + '</tbody></table></div>';
          continue;
        }
        if (line.startsWith(">")) {
          const qLines = [];
          while (i < lines.length && lines[i].startsWith(">")) {
            qLines.push(lines[i].replace(/^>\s?/, ""));
            i++;
          }
          html += `<blockquote><p>${qLines.map(formatInline).join("<br/>")}</p></blockquote>`;
          continue;
        }
        if (/^\s*-\s+/.test(line)) {
          const items = [];
          while (i < lines.length && /^\s*-\s+/.test(lines[i])) {
            items.push(formatInline(lines[i].replace(/^\s*-\s+/, "")));
            i++;
          }
          html += "<ul>" + items.map(it => `<li>${it}</li>`).join("") + "</ul>";
          continue;
        }
        if (/^\s*\d+\.\s+/.test(line)) {
          const items = [];
          while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
            items.push(formatInline(lines[i].replace(/^\s*\d+\.\s+/, "")));
            i++;
          }
          html += "<ol>" + items.map(it => `<li>${it}</li>`).join("") + "</ol>";
          continue;
        }
        if (!line.trim()) {
          i++;
          continue;
        }
        const pLines = [];
        while (i < lines.length && lines[i].trim() && !lines[i].startsWith("#") && !lines[i].startsWith("```") && !lines[i].startsWith(">") && !lines[i].trim().startsWith("|") && !/^---+$/.test(lines[i].trim()) && !/^\s*(-|\d+\.)\s+/.test(lines[i])) {
          pLines.push(formatInline(lines[i]));
          i++;
        }
        html += `<p>${pLines.join(" ")}</p>`;
      }
      return html;
    }

    window.copyCode = function(btn) {
      const pre = btn.closest(".code-wrapper").querySelector("pre");
      const raw = decodeURIComponent(pre.getAttribute("data-raw"));
      navigator.clipboard.writeText(raw);
      const old = btn.textContent;
      btn.textContent = UI_STRINGS.copied_label;
      setTimeout(() => { btn.textContent = old; }, 1400);
    };

    function renderSidebar() {
      const nav = document.getElementById("navList");
      nav.innerHTML = CHAPTERS.map((ch, idx) => `
        <li class="nav-item">
          <button class="nav-btn ${idx === currentIdx ? 'active' : ''}" onclick="selectChapter(${idx})">
            <span class="nav-num">${ch.num}</span>
            <span>${escapeHtml(ch.short_title)}</span>
          </button>
        </li>
      `).join("");
    }

    window.selectChapter = function(idx) {
      currentIdx = idx;
      const ch = CHAPTERS[idx];
      location.hash = ch.slug;
      renderSidebar();
      let pagerHtml = '<div class="pager">';
      if (idx > 0) {
        pagerHtml += `<button class="pager-btn prev" onclick="selectChapter(${idx - 1})"><span class="pager-label">${UI_STRINGS.prev_label}</span><span class="pager-title">${escapeHtml(CHAPTERS[idx - 1].title)}</span></button>`;
      } else {
        pagerHtml += '<div></div>';
      }
      if (idx + 1 < CHAPTERS.length) {
        pagerHtml += `<button class="pager-btn next" onclick="selectChapter(${idx + 1})"><span class="pager-label">${UI_STRINGS.next_label}</span><span class="pager-title">${escapeHtml(CHAPTERS[idx + 1].title)}</span></button>`;
      }
      pagerHtml += '</div>';
      document.getElementById("chapterContent").innerHTML = renderMarkdown(ch.markdown) + pagerHtml;
      window.scrollTo({ top: 0, behavior: "smooth" });
    };

    document.getElementById("searchInput").addEventListener("input", (e) => {
      const q = e.target.value.trim().toLowerCase();
      if (q.length < 2) {
        selectChapter(currentIdx);
        return;
      }
      const hits = [];
      CHAPTERS.forEach((ch, idx) => {
        const lines = ch.markdown.split("\n");
        for (const l of lines) {
          if (l.toLowerCase().includes(q)) {
            hits.push({ idx, title: ch.title, snippet: l.replace(/^[#>*-]+\s*/, "").slice(0, 140) });
            break;
          }
        }
      });
      const box = hits.length
        ? `<div class="search-results"><strong>${escapeHtml(UI_STRINGS.search_hits_label)} "${escapeHtml(q)}" (${hits.length}):</strong>` +
          hits.map(h => `<div class="search-hit" onclick="document.getElementById('searchInput').value=''; selectChapter(${h.idx})"><div class="search-hit-title">${escapeHtml(h.title)}</div><div class="search-hit-snippet">${escapeHtml(h.snippet)}</div></div>`).join("") +
          `</div>`
        : `<div class="search-results">${escapeHtml(UI_STRINGS.search_empty_label)} "${escapeHtml(q)}".</div>`;
      document.getElementById("chapterContent").innerHTML = box + renderMarkdown(CHAPTERS[currentIdx].markdown);
    });

    document.getElementById("themeBtn").addEventListener("click", () => {
      const root = document.documentElement;
      root.setAttribute("data-theme", root.getAttribute("data-theme") === "dark" ? "light" : "dark");
    });

    const initialSlug = location.hash.replace(/^#/, "");
    const foundIdx = CHAPTERS.findIndex(c => c.slug === initialSlug);
    selectChapter(foundIdx >= 0 ? foundIdx : 0);
  </script>
</body>
</html>
